<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 | 랑그릿사 모바일 미래시 정보</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #fafafa; padding: 24px; }
      main { width: min(100%, 480px); text-align: center; }
      .code { margin: 0; font-size: clamp(4rem, 18vw, 7rem); line-height: 1; font-weight: 800; letter-spacing: -0.05em; }
      h1 { margin: 24px 0 0; font-size: 1.35rem; }
      p { margin: 12px 0 0; color: #a1a1aa; line-height: 1.7; }
      a { display: inline-flex; margin-top: 28px; min-height: 44px; align-items: center; justify-content: center; border: 1px solid #3f3f46; border-radius: 10px; padding: 0 18px; color: #fafafa; text-decoration: none; background: #18181b; }
      a:focus-visible { outline: 2px solid #fafafa; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1 id="not-found-heading">페이지를 찾을 수 없어.</h1>
      <p id="not-found-description">요청한 주소에 해당하는 정보를 찾지 못했어.</p>
      <a href="/langrisser-future-guide/">메인으로 돌아가기</a>
    </main>
    <script>
      (() => {
        const path = window.location.pathname;
        const heading = document.getElementById("not-found-heading");
        const description = document.getElementById("not-found-description");
        if (!heading || !description) return;

        if (/\/heroes\/[^/]+\/?$/.test(path)) {
          heading.textContent = "영웅을 찾을 수 없어.";
          description.textContent = "요청한 영웅 ID가 현재 공개된 영웅 목록에 없어.";
        } else if (/\/soldiers\/[^/]+\/?$/.test(path)) {
          heading.textContent = "용병을 찾을 수 없어";
          description.textContent = "요청한 용병 ID가 현재 공개된 용병 목록에 없어.";
        } else if (/\/equipment\/[^/]+\/?$/.test(path)) {
          heading.textContent = "공개 장비를 찾을 수 없습니다.";
          description.textContent = "요청한 장비 ID가 현재 공개된 장비 목록에 없습니다.";
        }
      })();
    </script>
  </body>
</html>
