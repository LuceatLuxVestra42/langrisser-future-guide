name: Temporary A6 Installer Locator Inventory

on:
  push:
    branches:
      - diag/awakening-icon-a6-1113-coverage-20260910

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory official installer ZIP entries
        shell: bash
        run: |
          mkdir -p out/awakening-icon-a6-locator-inventory
          python <<'PY'
          import json, pathlib, struct, urllib.error, urllib.request

          OUT = pathlib.Path('out/awakening-icon-a6-locator-inventory')
          VERSION = '1.1.113'
          BASE = f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          MAX_PART, MISS_BREAK = 90, 8
          KEYWORDS = ('manifest', 'catalog', 'index', 'mapping', 'assetbundle', 'bundleinfo', 'bundlelist', 'reslist', 'filelist')

          def request(url, start=None, end=None):
              headers = {'User-Agent': UA, 'Accept-Encoding': 'identity'}
              if start is not None: headers['Range'] = f'bytes={start}-{end}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r: data = r.read()
              if start is not None and len(data) != end - start + 1:
                  raise RuntimeError(f'range mismatch {url}')
              return data

          def head_size(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Encoding': 'identity'}, method='HEAD')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return int(r.headers['Content-Length'])
              except urllib.error.HTTPError as e:
                  if e.code in (403, 404): return None
                  raise

          def zip_directory(url, total):
              tail_size = min(131072, total)
              tail = request(url, total-tail_size, total-1)
              eocd = tail.rfind(b'PK\x05\x06')
              if eocd < 0: raise RuntimeError(f'EOCD missing: {url}')
              _, _, _, _, central_size, central_offset, _ = struct.unpack_from('<HHHHIIH', tail, eocd+4)
              central = request(url, central_offset, central_offset+central_size-1)
              entries, i = [], 0
              while i + 46 <= len(central) and central[i:i+4] == b'PK\x01\x02':
                  flags, method = struct.unpack_from('<HH', central, i+8)
                  crc, compressed, uncompressed = struct.unpack_from('<III', central, i+16)
                  fn_len, extra_len, comment_len = struct.unpack_from('<HHH', central, i+28)
                  local_offset = struct.unpack_from('<I', central, i+42)[0]
                  raw_name = central[i+46:i+46+fn_len]
                  name = raw_name.decode('utf-8' if flags & 0x800 else 'cp437', 'replace')
                  entries.append({'name': name, 'method': method, 'crc32': f'{crc:08X}', 'compressedBytes': compressed, 'uncompressedBytes': uncompressed, 'localOffset': local_offset})
                  i += 46 + fn_len + extra_len + comment_len
              return entries

          packages = []
          all_entries = []
          seen, miss = False, 0
          for part in range(1, MAX_PART+1):
              package_name = f'InstallPage_{VERSION}_{part}.zip'
              url = f'{BASE}/{package_name}'
              total = head_size(url)
              if total is None:
                  if seen:
                      miss += 1
                      if miss >= MISS_BREAK: break
                  continue
              seen, miss = True, 0
              entries = zip_directory(url, total)
              packages.append({'packagePart': part, 'packageName': package_name, 'packageBytes': total, 'entryCount': len(entries)})
              for e in entries:
                  all_entries.append({'packagePart': part, 'packageName': package_name, **e})

          locator_candidates = []
          streaming_non_b = []
          export_bundles = []
          for e in all_entries:
              low = e['name'].replace('\\','/').lower()
              if any(k in low for k in KEYWORDS): locator_candidates.append(e)
              if '/streamingassets/' in low and not low.endswith('.b'): streaming_non_b.append(e)
              if '/streamingassets/exportassetbundle/' in low and low.endswith('.b'): export_bundles.append(e)

          result = {
              'version': 1,
              'schemaId': 'official-installer-locator-inventory/v1',
              'source': {'kind':'OFFICIAL_INSTALLER','installVersion':VERSION,'base':BASE},
              'packageCount': len(packages),
              'entryCount': len(all_entries),
              'exportBundleCount': len(export_bundles),
              'locatorCandidateCount': len(locator_candidates),
              'streamingNonBundleCount': len(streaming_non_b),
              'packages': packages,
              'locatorCandidates': locator_candidates,
              'streamingNonBundleEntries': streaming_non_b,
              'exportBundles': export_bundles,
          }
          (OUT/'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({k: result[k] for k in ('packageCount','entryCount','exportBundleCount','locatorCandidateCount','streamingNonBundleCount')}, indent=2))
          PY
      - name: Upload locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awakening-icon-a6-locator-inventory
          path: out/awakening-icon-a6-locator-inventory
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-awakening-icon-a6-locator-inventory.yml
          git commit -m "Remove temporary A6 locator inventory"
          git push origin HEAD:${GITHUB_REF_NAME}
