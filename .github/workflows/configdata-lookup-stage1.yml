name: ConfigData Lookup Stage 1

on:
  push:
    branches:
      - main
      - work/configdata-lookup-stage1-id-index
    paths:
      - 'data/contracts/configdata-lookup-stage0-contract.v1.json'
      - 'data/contracts/configdata-lookup-stage1-id-index-contract.v1.json'
      - 'data/contracts/configdata-source-pack-contract.v1.json'
      - 'data/contracts/project-tooling-configdata-lookup-b5-5-operational-cutover.v1.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSkillInfo.json'
      - 'data/configdata/ConfigDataEquipmentInfo.json'
      - 'scripts/lib/configdata-lookup-stage1.mjs'
      - 'scripts/build-configdata-lookup-stage1.mjs'
      - 'scripts/validate-configdata-lookup-stage1.mjs'
      - 'scripts/hydrate-configdata-source-pack-v1.mjs'
      - 'tools/configdata-lookup/lib/configdata-source-root.mjs'
      - 'tools/configdata-lookup/cli/build-stage1.mjs'
      - 'tools/configdata-lookup/cli/validate-stage1.mjs'
      - 'package.json'
      - '.github/workflows/configdata-lookup-stage1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/contracts/configdata-lookup-stage0-contract.v1.json'
      - 'data/contracts/configdata-lookup-stage1-id-index-contract.v1.json'
      - 'data/contracts/configdata-source-pack-contract.v1.json'
      - 'data/contracts/project-tooling-configdata-lookup-b5-5-operational-cutover.v1.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSkillInfo.json'
      - 'data/configdata/ConfigDataEquipmentInfo.json'
      - 'data/index/hero.v1.json'
      - 'data/index/soldier.v1.json'
      - 'data/index/skill.v1.json'
      - 'data/index/equipment.v1.json'
      - 'data/validation/configdata-lookup-stage1-summary.v1.json'
      - 'scripts/lib/configdata-lookup-stage1.mjs'
      - 'scripts/build-configdata-lookup-stage1.mjs'
      - 'scripts/validate-configdata-lookup-stage1.mjs'
      - 'scripts/hydrate-configdata-source-pack-v1.mjs'
      - 'tools/configdata-lookup/lib/configdata-source-root.mjs'
      - 'tools/configdata-lookup/cli/build-stage1.mjs'
      - 'tools/configdata-lookup/cli/validate-stage1.mjs'
      - 'package.json'
      - '.github/workflows/configdata-lookup-stage1.yml'

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    env:
      CONFIGDATA_SOURCE_ROOT: ${{ runner.temp }}/configdata-lookup-stage1-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hydrate and verify pinned ConfigData source pack outside repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONFIGDATA_SOURCE_ROOT"
          node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir "$CONFIGDATA_SOURCE_ROOT"
          count="$(find "$CONFIGDATA_SOURCE_ROOT/data/configdata" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$count" = "753"
          case "$CONFIGDATA_SOURCE_ROOT/" in
            "$GITHUB_WORKSPACE/"*) echo 'external ConfigData source root must stay outside repository' >&2; exit 1 ;;
          esac

      - name: Make tracked ConfigData unavailable during Stage 1 validation
        shell: bash
        run: |
          set -euo pipefail
          tracked_raw="$GITHUB_WORKSPACE/data/configdata"
          hidden_raw="$RUNNER_TEMP/configdata-stage1-tracked-hidden"
          rm -rf "$hidden_raw"
          if [ -d "$tracked_raw" ]; then
            mv "$tracked_raw" "$hidden_raw"
          fi
          test ! -e "$tracked_raw"

      - name: Validate Stage 0 predecessor
        run: npm run validate:configdata-lookup-stage0

      - name: Materialize Stage 1 indexes through source-root adapter
        run: node tools/configdata-lookup/cli/build-stage1.mjs

      - name: Validate Stage 1 indexes through source-root adapter
        run: node tools/configdata-lookup/cli/validate-stage1.mjs

      - name: Restore tracked ConfigData when present in this revision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tracked_raw="$GITHUB_WORKSPACE/data/configdata"
          hidden_raw="$RUNNER_TEMP/configdata-stage1-tracked-hidden"
          if [ -d "$hidden_raw" ]; then
            test ! -e "$tracked_raw"
            mv "$hidden_raw" "$tracked_raw"
          fi

      - name: Commit materialized indexes on Stage 1 work branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/configdata-lookup-stage1-id-index'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/index/hero.v1.json \
            data/index/soldier.v1.json \
            data/index/skill.v1.json \
            data/index/equipment.v1.json \
            data/validation/configdata-lookup-stage1-summary.v1.json
          if git diff --cached --quiet; then
            echo 'Materialized Stage 1 indexes are already current.'
          else
            git commit -m 'Materialize ConfigData Lookup Stage 1 indexes [skip ci]'
            git push origin HEAD:work/configdata-lookup-stage1-id-index
          fi

      - name: Require committed indexes outside materialization branch
        if: "!(github.event_name == 'push' && github.ref == 'refs/heads/work/configdata-lookup-stage1-id-index')"
        shell: bash
        run: |
          git diff --exit-code -- \
            data/index/hero.v1.json \
            data/index/soldier.v1.json \
            data/index/skill.v1.json \
            data/index/equipment.v1.json \
            data/validation/configdata-lookup-stage1-summary.v1.json
