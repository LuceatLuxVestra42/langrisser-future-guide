name: Equipment Stage 2-1 Census

on:
  push:
    paths:
      - '.github/workflows/equipment-stage2-1-census.yml'
      - 'scripts/verify-equipment-stage2-1.mjs'
      - 'data/configdata/ConfigDataEquipmentInfo.json'

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Equipment Stage 2-1 census
        run: node scripts/verify-equipment-stage2-1.mjs

      - name: Persist census checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/equipment_stage2_1_census.json
          if git diff --cached --quiet; then
            echo "No census changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 2-1 census"
          git push
