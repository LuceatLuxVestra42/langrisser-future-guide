name: Hero CardHead Materialize Final

on:
  push:
    branches:
      - work/hero-cardhead-assets-20260830
    paths:
      - .github/workflows/hero-cardhead-materialize-final.yml
      - scripts/materialize-hero-cardhead-assets-final.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install extraction runtime
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet UnityPy==1.25.3 Pillow
      - name: Materialize complete exact CardHead assets
        shell: pwsh
        run: python scripts/materialize-hero-cardhead-assets-final.py
      - name: Commit verified CardHead assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/heroes/card-head data/generated/hero-cardhead-web-assets.v1.json data/validation/hero-cardhead-materialization.v1.json
          git commit -m "Materialize 267 exact Hero CardHead assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
