name: hero-awakening-display-metadata-patch-diagnose
on:
  push:
    branches: [hero-awakening-display-metadata]
    paths: [.github/workflows/hero-awakening-display-metadata-patch-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed awakening patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/hero-awakening-display-metadata-run.yml').read_text().splitlines()
          start = source.index('      - name: Patch owning producers and validator')
          run_index = next(i for i in range(start + 1, len(source)) if source[i] == '        run: |')
          body=[]
          for line in source[run_index+1:]:
              if line.startswith('      - name: '): break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/apply.sh
      - name: Count compatibility anchors
        run: |
          python3 - <<'PY' > /tmp/diag.txt
          from pathlib import Path
          t=Path('scripts/prepare_hero_skill_acquisition_stage44.cjs').read_text()
          anchors={
            'sourceState_start': 'function sourceState(filename) {',
            'sourceState_exact_tail': "return { filename, asset, ...inspectTextAsset(asset, expectedName) };",
            'hero_parse_start': "const heroSource = parseSourceRecords(byFilename.get('ConfigDataHeroInfo.json'))",
            'connection_parse_start': "const connectionSource = parseSourceRecords(byFilename.get('ConfigDataJobConnectionInfo.json'))",
            'skill_parse_start': "const skillSource = parseSourceRecords(byFilename.get('ConfigDataSkillInfo.json'))",
            'sourceHealth_old': 'sourceHealth: sourceStates.map(({ filename, ok, issues }) => ({',
          }
          for k,v in anchors.items(): print(k, t.count(v))
          start=t.find('function sourceState(filename) {')
          print('\nSOURCESTATE\n', t[start:start+700])
          start=t.find("const heroSource =")
          print('\nDECODE\n', t[start:start+2500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: patch-anchor-diagnosis
          path: /tmp/diag.txt
