name: Hero Awakening Icon Official Verifier Contract

on:
  pull_request:
    branches:
      - main
      - work/awakening-skill-icon-a6-1-target-freeze-20260910
    paths:
      - '.github/workflows/hero-awakening-icon-official-verifier-contract.yml'
      - 'scripts/verify-hero-awakening-icon-official.py'
      - 'data/contracts/hero-awakening-icon-official-verifier.v1.json'
      - 'data/generated/hero-awakening-icon-verification-targets.v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-official-verifier-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate A6-2 contract without network
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/verify-hero-awakening-icon-official.py --contract-check
          after="$(git status --porcelain=v1 --untracked-files=all)"
          test "$before" = "$after"
