name: Hero portrait Stage 4-2B finalize interim
on:
  push:
    branches:
      - work/hero-portrait-stage4-2b-explicit-fallback-source-acquisition
    paths:
      - scripts/hero_portrait_stage4_2b_finalize_interim.py
      - .github/workflows/hero-portrait-stage4-2b-finalize-interim.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/hero_portrait_stage4_2b_finalize_interim.py
      - run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/hero-portrait-stage4-2b-interim-admission.v1.json data/checkpoints/hero-portrait-stage4-2b-234-admissions-checkpoint.v1.json
          if git diff --cached --quiet; then echo no-change; else git commit -m 'Checkpoint 234 Hero portrait source admissions'; git push; fi
