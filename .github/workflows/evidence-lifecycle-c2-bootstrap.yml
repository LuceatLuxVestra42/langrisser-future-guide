name: Evidence Lifecycle C2 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c2
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c2-bootstrap.yml'

permissions:
  contents: write

jobs:
  inspect-c2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current workflow protecting edges
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const graph = JSON.parse(fs.readFileSync('tools/evidence-lifecycle/generated/c2-reference-graph.v1.json', 'utf8'));
          const edges = graph.edges.filter(edge => edge.edgeType === 'ACTIVE_WORKFLOW_REF');
          const bySource = new Map();
          for (const edge of edges) bySource.set(edge.fromPath, (bySource.get(edge.fromPath) ?? 0) + 1);
          const rows = [...bySource].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          console.log(JSON.stringify({ workflowProtectingEdgeCount: edges.length, workflowSourceCount: rows.length, bySource: rows }, null, 2));
          NODE
