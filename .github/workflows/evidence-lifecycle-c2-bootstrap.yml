name: Evidence Lifecycle C2 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c2
    paths:
      - '.github/workflows/evidence-lifecycle-c2-bootstrap.yml'

permissions:
  contents: read

jobs:
  inspect-protecting-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect protecting edge sources
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const graph = JSON.parse(fs.readFileSync('tools/evidence-lifecycle/generated/c2-reference-graph.v1.json', 'utf8'));
          const protecting = graph.edges.filter(edge => edge.retentionClass === 'PROTECTING');
          const grouped = {};
          for (const edge of protecting) {
            grouped[edge.edgeType] ??= {};
            grouped[edge.edgeType][edge.fromPath] ??= [];
            grouped[edge.edgeType][edge.fromPath].push({ toPath: edge.toPath, locator: edge.sourceFieldOrLocator });
          }
          for (const sources of Object.values(grouped)) {
            for (const [source, edges] of Object.entries(sources)) {
              sources[source] = edges.sort((a, b) => a.toPath.localeCompare(b.toPath) || a.locator.localeCompare(b.locator));
            }
          }
          console.log(JSON.stringify(grouped, null, 2));
          NODE
