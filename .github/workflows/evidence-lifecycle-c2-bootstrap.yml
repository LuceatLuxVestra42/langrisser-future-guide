name: Evidence Lifecycle C2 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c2
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c2-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-c2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate C2 graph
        run: node tools/evidence-lifecycle/cli/c2-reference-graph.mjs --write
      - name: Commit generated graph if changed
        run: |
          if git diff --quiet -- tools/evidence-lifecycle/generated/c2-reference-graph.v1.json; then
            echo 'C2 graph already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evidence-lifecycle/generated/c2-reference-graph.v1.json
          git commit -m 'Generate Evidence Lifecycle C2 reference graph'
          git push
