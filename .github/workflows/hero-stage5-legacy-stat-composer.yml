name: Hero Stage5 Legacy Stat Composer

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/hero-stage5-legacy-stat-composer.cjs
      - scripts/validate_hero_stage5_legacy_stat_composer.cjs
      - data/contracts/hero-stage5-legacy-stat-composer.v1.json
      - .github/workflows/hero-stage5-legacy-stat-composer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Stage5 legacy stat composer
        run: node scripts/validate_hero_stage5_legacy_stat_composer.cjs
      - name: Verify repository unchanged
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
