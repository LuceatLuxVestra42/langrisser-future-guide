name: Skin Detail Spine Stage 3 Contract V2 Targeted

on:
  push:
    branches:
      - research/skin-detail-spine-stage2-20260830
    paths:
      - scripts/validate-skin-detail-spine-stage3-contract-v2.py
      - scripts/spine-stage3-geometry-export-v2.cs
      - scripts/render-spine-stage2-geometry.py
      - scripts/run-skin-detail-spine-stage3-bulk.py
      - data/contracts/skin-detail-spine-render-contract.v1.json
      - .github/workflows/skin-detail-spine-stage3-contract-v2-targeted.yml

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned dependencies
        run: python -m pip install UnityPy==1.25.3 Pillow==12.3.0 numpy==2.5.2
      - name: Build geometry exporter v2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/spine-runtimes /tmp/spine33v2
          git init -q /tmp/spine-runtimes
          git -C /tmp/spine-runtimes remote add origin https://github.com/EsotericSoftware/spine-runtimes.git
          git -C /tmp/spine-runtimes fetch -q --depth=1 origin 1c1936532527900f74cfb58f7002998bf157b254
          git -C /tmp/spine-runtimes checkout -q FETCH_HEAD
          test "$(git -C /tmp/spine-runtimes rev-parse HEAD)" = "1c1936532527900f74cfb58f7002998bf157b254"
          mkdir -p /tmp/spine33v2
          cat > /tmp/spine33v2/Spine33V2.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><EnableDefaultCompileItems>false</EnableDefaultCompileItems><ImplicitUsings>disable</ImplicitUsings><Nullable>disable</Nullable></PropertyGroup>
            <ItemGroup><Compile Include="${GITHUB_WORKSPACE}/scripts/spine-stage3-geometry-export-v2.cs" /><Compile Include="/tmp/spine-runtimes/spine-csharp/src/**/*.cs" /></ItemGroup>
          </Project>
          EOF
          dotnet build /tmp/spine33v2/Spine33V2.csproj -c Release
      - name: Validate representative, Ledin initial skin, and additive extension
        run: >-
          python scripts/validate-skin-detail-spine-stage3-contract-v2.py
          --geometry-project /tmp/spine33v2/Spine33V2.csproj
          --work-dir /tmp/skin-detail-spine-stage3-contract-v2
      - name: Print result
        if: always()
        run: |
          test -f skin-detail-spine-stage3-contract-v2-targeted.json && python - <<'PY'
          import json
          x=json.load(open('skin-detail-spine-stage3-contract-v2-targeted.json',encoding='utf-8'))
          print(json.dumps({'status':x['status'],'records':[(r['skinId'],r['status'],r.get('initialSkinName'),r.get('blendModeCounts')) for r in x['records']]},ensure_ascii=False))
          PY
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skin-detail-spine-stage3-contract-v2-targeted
          path: |
            skin-detail-spine-stage3-contract-v2-targeted.json
            skin-detail-spine-stage3-contract-v2-renders/*.png
          if-no-files-found: warn
