name: Temporary R4 fixedpoint helper scan
on:
  push:
    paths: ['.github/workflows/tmp-r4-fixedpoint-helper-scan.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dump metadata and identify helper RVAs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4h out/r4-fixedpoint-helper
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib
          V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'; D=pathlib.Path('/tmp/r4h')
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ents(u,t):
            n=min(131072,t);x=rq(u,t-n,t-1);p=x.rfind(b'PK\x05\x06');_,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4);c=rq(u,o,o+s-1);i=0;out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8);cr,co,un=struct.unpack_from('<III',c,i+16);fn,ex,cm=struct.unpack_from('<HHH',c,i+28);lo=struct.unpack_from('<I',c,i+42)[0];nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace');out.append((nm,me,cr,co,un,lo));i+=46+fn+ex+cm
            return out
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip';e=next(e for e in ents(u,hs(u)) if e[0]==target);nm,me,cr,co,un,lo=e;h=rq(u,lo,lo+4095);fn,ex=struct.unpack_from('<HH',h,26);st=lo+30+fn+ex;d=rq(u,st,st+co-1);raw=d if me==0 else zlib.decompress(d,-15);assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr;(D/out).write_bytes(raw)
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release > out/r4-fixedpoint-helper/build.log 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/r4h/dump
          set +e
          dotnet "$DLL" /tmp/r4h/GameAssembly.dll /tmp/r4h/global-metadata.dat /tmp/r4h/dump > out/r4-fixedpoint-helper/dumper.log 2>&1
          set -e
          test -f /tmp/r4h/dump/dump.cs
          python <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/r4h/dump/dump.cs').read_text(errors='replace')
          targets=['0x44E320','0x44E170']
          with open('out/r4-fixedpoint-helper/result.txt','w') as f:
            for t in targets:
              f.write('===== '+t+' =====\n')
              for m in re.finditer(r'// RVA: '+re.escape(t)+r'\b',s,re.I):
                f.write(s[max(0,m.start()-2500):min(len(s),m.start()+3500)]+'\n---\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-fixedpoint-helper
          path: out/r4-fixedpoint-helper
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-r4-fixedpoint-helper-scan.yml
          git commit -m 'Remove temporary R4 fixedpoint helper scan'
          git push origin HEAD:${GITHUB_REF_NAME}
