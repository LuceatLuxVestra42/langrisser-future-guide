name: Equipment Image Stage 2 Acquire

on:
  push:
    branches:
      - work/equipment-image-stage2-public-assets
    paths:
      - scripts/acquire-equipment-image-stage2-public-assets.mjs
      - data/generated/equipment-image-stage2-acquisition-manifest.v1.json
      - data/validation/equipment-image-stage2-drive-resolution-summary.v1.json
      - .github/workflows/equipment-image-stage2-acquire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Acquire exact-resolved public Equipment PNGs
        run: node scripts/acquire-equipment-image-stage2-public-assets.mjs

      - name: Require exact-source acquisition PASS
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('data/validation/equipment-image-stage2-acquisition-summary.v1.json', 'utf8'));
          if (summary.status !== 'PASS_EQUIPMENT_IMAGE_STAGE2_EXACT_SOURCE_ACQUISITION') throw new Error(summary.status);
          if (summary.completion !== 'PARTIAL_344_OF_373') throw new Error(summary.completion);
          if (summary.counts.verifiedExactSourceAssets !== 344) throw new Error(`verified ${summary.counts.verifiedExactSourceAssets}`);
          if (summary.counts.sourceRepositoryShaParity !== 344) throw new Error(`parity ${summary.counts.sourceRepositoryShaParity}`);
          if (summary.counts.unresolvedEquipment !== 29) throw new Error(`unresolved ${summary.counts.unresolvedEquipment}`);
          if (summary.counts.hardErrors !== 0 || summary.counts.downloadFailures !== 0) throw new Error('bulk acquisition error');
          if (summary.finalStage2Complete !== false) throw new Error('Stage 2 must not be finalized while held assets remain');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Re-run Stage 1 representative validator
        run: node scripts/validate-equipment-image-stage1.mjs

      - name: Re-run frozen Equipment admission QA
        run: bun scripts/validate-equipment-stage4-6-admission-route-qa.mjs

      - name: Commit verified Equipment assets and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/images/equipment \
            data/evidence/equipment-image-stage2-source-evidence.v1.json \
            data/validation/equipment-image-stage2-acquisition-summary.v1.json \
            data/checkpoints/equipment-image-stage2-acquisition.v1.json \
            data/validation/equipment-image-stage1-summary.v1.json \
            data/checkpoints/equipment-image-stage1.v1.json
          if git diff --cached --quiet; then
            echo 'Equipment Stage 2 exact-source assets already current.'
          else
            git commit -m 'Acquire Equipment Stage 2 exact-source assets [skip ci]'
            git push origin HEAD:work/equipment-image-stage2-public-assets
          fi
