name: Project Doctor PR Guard

on:
  push:
    branches:
      - work/project-doctor-closeout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-doctor-pr-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate D7 guard contract
        run: npm run doctor:pr-guard:validate

      - name: Validate committed freshness seal
        run: npm run doctor:freshness:validate

      - name: Regenerate D1 status outputs
        run: npm run doctor:status

      - name: Prove committed D1 outputs are deterministic
        run: git diff --exit-code -- data/generated/project-doctor-d1-1-status.v1.json data/validation/project-doctor-d1-1-summary.v1.json data/validation/project-doctor-d1-2-summary.v1.json

      - name: Revalidate freshness after D1 regeneration
        run: npm run doctor:freshness:validate

      - name: Resolve changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
            echo "DOCTOR_BASE=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
            echo "DOCTOR_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "DOCTOR_BASE=origin/main" >> "$GITHUB_ENV"
            echo "DOCTOR_HEAD=HEAD" >> "$GITHUB_ENV"
          fi

      - name: Validate Regression Coverage Promotion V1 admission
        shell: bash
        run: |
          PROMOTION_CHANGED=0
          while IFS= read -r path; do
            case "$path" in
              data/contracts/regression-coverage-promotion.v1.json|data/validation/regression-coverage-promotion-summary.v1.json|scripts/validate-regression-coverage-promotion.mjs)
                PROMOTION_CHANGED=1
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRD "${DOCTOR_BASE}...${DOCTOR_HEAD}" --)
          if [[ "$PROMOTION_CHANGED" -eq 1 ]]; then
            test -f data/contracts/regression-coverage-promotion.v1.json
            test -f data/validation/regression-coverage-promotion-summary.v1.json
            test -f scripts/validate-regression-coverage-promotion.mjs
            node scripts/validate-regression-coverage-promotion.mjs
          fi

      - name: Integrated Doctor real-diff dry run
        run: npm run doctor -- --dry-run --base "$DOCTOR_BASE" --head "$DOCTOR_HEAD"

      - name: Integrated Doctor real-diff execution
        run: npm run doctor -- --base "$DOCTOR_BASE" --head "$DOCTOR_HEAD"
