name: Hero Awakening Icon Official Bulk Verification

on:
  push:
    branches:
      - work/awakening-skill-icon-a6-6-bulk-verify-20260910
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-bulk-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/awakening-skill-icon-a6-6-bulk-verify-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: pip install UnityPy==1.25.3 Pillow
      - name: Verify all 256 targets in deterministic shards and freeze result
        run: python scripts/freeze-hero-awakening-icon-official-bulk-verification.py --write
      - name: Commit frozen bulk verification when changed
        shell: bash
        run: |
          set -euo pipefail
          git add data/generated/hero-awakening-icon-official-bulk-verification.v1.json
          if git diff --cached --quiet; then
            echo 'Frozen bulk verification already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Freeze official awakening icon bulk verification'
          git push origin HEAD:work/awakening-skill-icon-a6-6-bulk-verify-20260910
