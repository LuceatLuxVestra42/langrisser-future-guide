name: ConfigData Source Pack B2 Hydration

on:
  push:
    branches:
      - configdata/b2-hydration-v1
    paths:
      - data/contracts/configdata-source-pack-contract.v1.json
      - scripts/hydrate-configdata-source-pack-v1.mjs
      - scripts/validate-configdata-source-pack-boundary-v1.mjs
      - .github/workflows/configdata-source-pack-hydration-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configdata-source-pack-b2-hydration-v1
  cancel-in-progress: false

jobs:
  hydrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hydrate pinned external snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/hydrate-configdata-source-pack-v1.mjs \
            --target-dir "$RUNNER_TEMP/configdata-hydrated"

      - name: Count Cost-5B SkillCost key coverage on frozen equipable set
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const expectedFrozenSha = '8681629d110b5e6ec6fbfdb673e4585918b8b5d73a22bda3893b3e0998932064';

          const manifest = JSON.parse(fs.readFileSync('data/generated/hero-detail.v1.json', 'utf8'));
          const byHeroId = manifest?.storage?.byHeroId;
          if (!byHeroId || typeof byHeroId !== 'object' || Array.isArray(byHeroId)) {
            throw new Error('hero-detail manifest storage.byHeroId is missing or malformed');
          }

          const equipableIds = new Set();
          for (const [heroId, meta] of Object.entries(byHeroId)) {
            if (!meta || typeof meta.path !== 'string') throw new Error(`missing shard path for hero ${heroId}`);
            const shard = JSON.parse(fs.readFileSync(meta.path, 'utf8'));
            if (String(shard.heroId) !== String(heroId)) throw new Error(`heroId mismatch for shard ${heroId}`);
            const connections = shard?.normal?.jobTree?.connections;
            if (!Array.isArray(connections)) throw new Error(`connections missing for hero ${heroId}`);
            for (const connection of connections) {
              if (!Array.isArray(connection?.levels)) throw new Error(`levels missing for hero ${heroId}`);
              for (const level of connection.levels) {
                const id = level?.gotSkillId;
                if (id === null || id === undefined) continue;
                if (typeof id !== 'number' || !Number.isFinite(id)) throw new Error(`non-numeric gotSkillId for hero ${heroId}`);
                equipableIds.add(String(id));
              }
            }
          }

          const sortedIds = [...equipableIds].sort((a, b) => Number(a) - Number(b));
          const frozenSha = crypto.createHash('sha256').update(JSON.stringify(sortedIds)).digest('hex');
          if (sortedIds.length !== 678 || frozenSha !== expectedFrozenSha) {
            throw new Error(`Cost-4K frozen set identity mismatch count=${sortedIds.length} sha=${frozenSha}`);
          }

          const skillIndex = JSON.parse(fs.readFileSync('data/index/skill.v1.json', 'utf8'));
          const entries = skillIndex?.index?.entries;
          if (!Array.isArray(entries)) throw new Error('skill index entries missing or malformed');
          const recordIndexById = new Map();
          for (const tuple of entries) {
            if (!Array.isArray(tuple) || tuple.length < 2 || typeof tuple[0] !== 'string' || !Number.isInteger(tuple[1])) {
              throw new Error('malformed skill index tuple');
            }
            recordIndexById.set(tuple[0], tuple[1]);
          }

          const sourcePath = `${process.env.RUNNER_TEMP}/configdata-hydrated/data/configdata/ConfigDataSkillInfo.json`;
          const rows = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          if (!Array.isArray(rows)) throw new Error('ConfigDataSkillInfo root is not an array');

          let present = 0;
          let missing = 0;
          for (const id of sortedIds) {
            const recordIndex = recordIndexById.get(id);
            if (!Number.isInteger(recordIndex)) throw new Error(`equipable SkillID absent from lookup index: ${id}`);
            const row = rows[recordIndex];
            if (!row || typeof row !== 'object' || Array.isArray(row)) throw new Error(`malformed SkillInfo row for ${id}`);
            if (String(row.ID) !== id) throw new Error(`SkillInfo ID/index mismatch for ${id}`);
            if (Object.prototype.hasOwnProperty.call(row, 'SkillCost')) present += 1;
            else missing += 1;
          }

          console.log(JSON.stringify({
            equipableDistinctSkillIds: sortedIds.length,
            frozenSetSha256: frozenSha,
            skillCostPresent: present,
            skillCostMissing: missing
          }));
          NODE

      - name: Verify repository non-mutation
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
