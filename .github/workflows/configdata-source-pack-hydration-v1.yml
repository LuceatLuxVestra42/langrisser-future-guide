name: ConfigData Source Pack B2 Hydration

on:
  push:
    branches:
      - configdata/b2-hydration-v1
    paths:
      - data/contracts/configdata-source-pack-contract.v1.json
      - scripts/hydrate-configdata-source-pack-v1.mjs
      - scripts/validate-configdata-source-pack-boundary-v1.mjs
      - .github/workflows/configdata-source-pack-hydration-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configdata-source-pack-b2-hydration-v1
  cancel-in-progress: false

jobs:
  hydrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Count Cost-4H exact SkillInfo intersection
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('data/generated/hero-detail.v1.json', 'utf8'));
          const byHeroId = manifest?.storage?.byHeroId;
          if (!byHeroId || typeof byHeroId !== 'object' || Array.isArray(byHeroId)) {
            throw new Error('hero-detail manifest storage.byHeroId is missing or malformed');
          }

          const equipableSkillIds = new Set();
          for (const [heroId, meta] of Object.entries(byHeroId)) {
            if (!meta || typeof meta.path !== 'string') {
              throw new Error(`missing shard path for hero ${heroId}`);
            }
            const shard = JSON.parse(fs.readFileSync(meta.path, 'utf8'));
            if (String(shard.heroId) !== String(heroId)) {
              throw new Error(`heroId mismatch for shard ${heroId}`);
            }
            const connections = shard?.normal?.jobTree?.connections;
            if (!Array.isArray(connections)) {
              throw new Error(`normal.jobTree.connections missing for hero ${heroId}`);
            }
            for (const connection of connections) {
              if (!Array.isArray(connection?.levels)) {
                throw new Error(`levels missing for hero ${heroId}`);
              }
              for (const level of connection.levels) {
                const id = level?.gotSkillId;
                if (id === null || id === undefined) continue;
                if (typeof id !== 'number' || !Number.isFinite(id)) {
                  throw new Error(`non-numeric gotSkillId for hero ${heroId}`);
                }
                equipableSkillIds.add(String(id));
              }
            }
          }

          const skillIndex = JSON.parse(fs.readFileSync('data/index/skill.v1.json', 'utf8'));
          const entries = skillIndex?.index?.entries;
          if (!Array.isArray(entries)) {
            throw new Error('skill index entries missing or malformed');
          }
          const skillInfoIds = new Set();
          for (const tuple of entries) {
            if (!Array.isArray(tuple) || tuple.length < 2) {
              throw new Error('malformed skill index tuple');
            }
            const id = tuple[0];
            if (typeof id !== 'string' || id.length === 0) {
              throw new Error('malformed skill index id');
            }
            skillInfoIds.add(id);
          }

          let intersection = 0;
          let equipableNotInSkillInfo = 0;
          for (const id of equipableSkillIds) {
            if (skillInfoIds.has(id)) intersection += 1;
            else equipableNotInSkillInfo += 1;
          }

          console.log(JSON.stringify({
            equipableDistinctSkillIds: equipableSkillIds.size,
            skillInfoIds: skillInfoIds.size,
            intersection,
            equipableNotInSkillInfo
          }));
          NODE

      - name: Verify repository non-mutation
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
