name: ConfigData Source Pack B2 Hydration

on:
  push:
    branches:
      - configdata/b2-hydration-v1
    paths:
      - data/contracts/configdata-source-pack-contract.v1.json
      - scripts/hydrate-configdata-source-pack-v1.mjs
      - scripts/validate-configdata-source-pack-boundary-v1.mjs
      - .github/workflows/configdata-source-pack-hydration-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configdata-source-pack-b2-hydration-v1
  cancel-in-progress: false

jobs:
  hydrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hydrate pinned external snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/hydrate-configdata-source-pack-v1.mjs \
            --target-dir "$RUNNER_TEMP/configdata-hydrated"

      - name: Census present SkillCost raw types
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const file = `${process.env.RUNNER_TEMP}/configdata-hydrated/data/configdata/ConfigDataSkillInfo.json`;
          const root = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (!Array.isArray(root)) {
            throw new Error('ConfigDataSkillInfo root is not an array');
          }

          const out = {
            total: root.length,
            present: 0,
            number: 0,
            string: 0,
            boolean: 0,
            object: 0,
            array: 0,
            null: 0,
            other: 0,
          };

          for (const row of root) {
            if (!row || typeof row !== 'object' || Array.isArray(row)) continue;
            if (!Object.prototype.hasOwnProperty.call(row, 'SkillCost')) continue;

            out.present += 1;
            const value = row.SkillCost;

            if (value === null) out.null += 1;
            else if (Array.isArray(value)) out.array += 1;
            else if (typeof value === 'number') out.number += 1;
            else if (typeof value === 'string') out.string += 1;
            else if (typeof value === 'boolean') out.boolean += 1;
            else if (typeof value === 'object') out.object += 1;
            else out.other += 1;
          }

          const classified = out.number + out.string + out.boolean + out.object + out.array + out.null + out.other;
          if (out.present !== classified) {
            throw new Error('SkillCost raw type census total mismatch');
          }

          console.log(JSON.stringify(out));
          NODE

      - name: Verify hydrated shape and repository non-mutation
        run: |
          set -euo pipefail
          count="$(find "$RUNNER_TEMP/configdata-hydrated/data/configdata" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$count" = "753"
          git diff --exit-code
          test -z "$(git status --porcelain)"
