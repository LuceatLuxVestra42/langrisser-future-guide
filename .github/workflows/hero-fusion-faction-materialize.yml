name: Hero Fusion Faction Materialize

on:
  push:
    branches:
      - work/hero-fusion-faction-marks-20260830
    paths:
      - '.github/workflows/hero-fusion-faction-materialize.yml'
      - 'data/validation/hero-fusion-faction-materialize.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Unity asset reader
        run: python -m pip install --disable-pip-version-check --quiet UnityPy Pillow

      - name: Generate explicit fusion-power projection
        run: node scripts/generate-hero-fusion-power-presentation.mjs

      - name: Materialize exact official faction marks
        run: python scripts/materialize-hero-fusion-faction-assets.py

      - name: Verify frozen relation and faction asset bytes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const fusion = JSON.parse(fs.readFileSync('data/generated/hero-fusion-power-presentation.v1.json','utf8'));
          const assets = JSON.parse(fs.readFileSync('data/generated/hero-fusion-faction-assets.v1.json','utf8'));
          if (fusion.status !== 'PASS' || fusion.completion !== 'COMPLETE' || fusion.freezeState !== 'HERO_FUSION_POWER_PRESENTATION_FROZEN') throw new Error('fusion freeze mismatch');
          if (fusion.summary.fusionPowerHeroCount !== 35 || fusion.records.length !== 35 || fusion.summary.uniqueTargetFactionCount !== 12) throw new Error('fusion population mismatch');
          if (fusion.policy.targetFactionField !== 'SkillTypeParam2' || fusion.policy.descriptionParsing !== false || fusion.policy.skillIconNameInference !== false || fusion.policy.semanticStageReopened !== false) throw new Error('fusion relation policy mismatch');
          if (assets.status !== 'PASS' || assets.completion !== 'COMPLETE' || assets.freezeState !== 'HERO_FUSION_FACTION_ASSETS_FROZEN') throw new Error('asset freeze mismatch');
          if (assets.summary.resolvedCount !== 12 || assets.records.length !== 12) throw new Error('asset population mismatch');
          for (const row of assets.records) {
            const bytes = fs.readFileSync(row.localAssetPath);
            if (bytes.subarray(0,8).toString('hex') !== '89504e470d0a1a0a') throw new Error(`Faction ${row.factionId} is not PNG`);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== row.sha256) throw new Error(`Faction ${row.factionId} SHA mismatch`);
          }
          const byFaction = new Map(assets.records.map((row) => [row.factionId,row]));
          for (const row of fusion.records) {
            const asset = byFaction.get(row.targetFactionId);
            if (!asset || asset.iconSourcePath !== row.iconSourcePath || row.skillTypeParam2 !== row.targetFactionId) throw new Error(`Hero ${row.heroId} relation/asset mismatch`);
          }
          console.log(JSON.stringify({status:'PASS_HERO_FUSION_PRESENTATION_AND_ASSETS', fusionHeroes:35, factionAssets:12, hero6:fusion.records.find((r)=>r.heroId===6), hero12:fusion.records.find((r)=>r.heroId===12)}));
          NODE
          test "$(find public/images/factions -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = '12'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: TypeScript gate
        run: bunx tsc --noEmit

      - name: Restore non-owned build outputs
        shell: bash
        run: |
          git restore -- .github/workflows/project-doctor-authoritative-pages-deploy.yml || true
          rm -f data/generated/equipment-name-kr-user-approved.v1.json
          rm -f data/validation/equipment-name-kr-user-approved-summary.v1.json

      - name: Commit verified fusion presentation assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/hero-fusion-power-presentation.v1.json
          git add data/generated/hero-fusion-faction-assets.v1.json
          git add data/validation/hero-fusion-faction-assets.v1.json
          git add public/images/factions
          if git diff --cached --quiet; then
            echo 'No generated fusion presentation changes.'
            exit 0
          fi
          git commit -m "Materialize Hero fusion faction marks"
          git push origin HEAD:work/hero-fusion-faction-marks-20260830
