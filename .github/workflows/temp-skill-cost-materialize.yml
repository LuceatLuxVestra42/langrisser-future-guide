name: Temporary Skill Cost Materialize

on:
  push:
    branches:
      - work/skill-cost-pipeline
    paths:
      - '.github/workflows/temp-skill-cost-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regress frozen Stage 4 upstream
        run: node scripts/validate_hero_stage4_upstream_direct.cjs
      - name: Generate Hero Stage 4-5 with SkillCost
        run: node scripts/prepare_hero_basic_combat_stage45.cjs
      - name: Validate Hero Stage 4 final
        run: node scripts/validate_hero_stage4_final.cjs
      - name: Recheck Hero A boundary
        run: node scripts/validate_hero_stage4_a_boundary.cjs
      - name: Persist generated outputs and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/hero-basic-combat.v1.json data/validation/hero-stage4-upstream-direct.v1.json data/validation/hero-basic-combat-stage4-5-summary.v1.json data/validation/hero-stage4-a-boundary.v1.json
          git rm .github/workflows/temp-skill-cost-materialize.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Hero SkillCost Stage 4 outputs'
            git push origin HEAD:work/skill-cost-pipeline
          fi
