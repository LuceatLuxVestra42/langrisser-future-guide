name: Temporary Awakening Skill Super4 Manifest Admit

on:
  push:
    branches:
      - work/awakening-skill-icon-a2-materialize-20260910
    paths:
      - .github/workflows/temp-awakening-skill-super4-manifest-admit.yml

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Admit verified awakening icon record
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          path = Path('data/generated/hero-skill-icon-assets.v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          assert data['version'] == 1
          assert data['schemaId'] == 'hero-skill-icon-assets/v1'
          assert data['status'] == 'FROZEN'
          assert data['scope']['heroId'] == 6
          assert data['scope']['targetUniqueIconCount'] == 12
          assert data['scope']['frontendConnectedGroups'] == ['talent', 'normal', 'direct']
          assert data['scope']['materializedButNotYetRenderedGroups'] == ['sp']
          assert not any(r['sourcePath'] == 'UI/Icon/Skill_ABS/Skill_Super4.png' for r in data['records'])
          assert len(data['records']) == 12

          data['scope']['targetUniqueIconCount'] = 13
          data['scope']['frontendConnectedGroups'].append('awakening')
          data['records'].append({
              'role': 'awakening',
              'skillIds': [12079],
              'nameCn': '青龙破阵',
              'sourcePath': 'UI/Icon/Skill_ABS/Skill_Super4.png',
              'packagePart': 62,
              'packageName': 'InstallPage_1.1.113_62.zip',
              'bundleEntry': 'Client/Langrisser_Data/StreamingAssets/ExportAssetBundle/ui_icon_skill_abs.b',
              'bundleSha256': '14c4fe918356f47f0e9f5a59e77dae31e4eb4a0d19e30d898c9d8c1085b8eb12',
              'containerPath': 'assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_super4.png',
              'objectType': 'Sprite',
              'rawObjectSha256': '8bd9fea67f998b20e5cb8f2440d3b5f0e022466305ea8f802edd63b74ddabaef',
              'rgbaSha256': 'bd61b5dd9929182ef9a235e10c3b7940468cfdb86a95d93788ea8a08f70bc808',
              'width': 170,
              'height': 170,
              'publicPath': '/images/heroes/skill-icons/Skill_Super4.png',
              'pngBytes': 50764,
              'pngSha256': 'b9d4480bea95270ae9f42abc169a61b3760041b7678898e13ec1934749c369bc',
              'verification': {
                  'runId': 34416831883,
                  'jobId': 102683459215,
                  'artifactId': 10129430409,
                  'artifactDigest': 'sha256:4f75cf52322a01463f632375f90c5522c69eb4ccd15e1a319e982723ec4ffb06'
              }
          })
          data['validation']['exactHit'] = '13/13'
          data['validation']['sprite'] = '13/13'
          data['validation']['rgbaDecode'] = '13/13'
          data['validation']['nonEmptyAlpha'] = '13/13'
          data['validation']['semanticReopen'] = False
          data['validation']['blocker'] = None
          data['validation']['review'] = None

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          test "$(python - <<'PY'
          import json
          d=json.load(open('data/generated/hero-skill-icon-assets.v1.json', encoding='utf-8'))
          r=[r for r in d['records'] if r['sourcePath']=='UI/Icon/Skill_ABS/Skill_Super4.png']
          print(len(r))
          PY
          )" = "1"

      - name: Commit manifest admission and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-awakening-skill-super4-manifest-admit.yml
          git add data/generated/hero-skill-icon-assets.v1.json
          git commit -m "Admit verified awakening skill icon manifest record"
          git push origin HEAD:${GITHUB_REF_NAME}
