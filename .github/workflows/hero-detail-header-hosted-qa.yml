name: Hero Detail Header Hosted Browser QA

on:
  push:
    branches:
      - qa/hero-detail-header-hosted
    paths:
      - '.github/workflows/hero-detail-header-hosted-qa.yml'
      - 'scripts/validate-hero-detail-header-hosted-qa.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero-detail-header-hosted-browser-qa
  cancel-in-progress: true

jobs:
  hosted-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout QA candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Reconfirm Hero resolver and navigation preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate_hero_list_stage4_artwork.cjs
          node scripts/validate_hero_list_stage4.cjs
          test "$(grep -o 'reloadDocument' src/routes/heroes.tsx | wc -l | tr -d ' ')" -eq 1
          test "$(grep -o 'reloadDocument' 'src/routes/heroes_.$heroId.tsx' | wc -l | tr -d ' ')" -eq 2
          grep -q '공식 초상화 267명 연결' src/routes/heroes.tsx
          ! grep -q '나머지는 placeholder' src/routes/heroes.tsx
          grep -q 'object-contain object-bottom' 'src/routes/heroes_.$heroId.tsx'
          grep -q 'min-h-\[620px\]' 'src/routes/heroes_.$heroId.tsx'

      - name: Reuse proven GitHub Pages static build config
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin deploy/soldier-lower-tier-kr-names-20260828
          git show FETCH_HEAD:vite.config.ts > vite.config.ts
          grep -q 'GitHub Pages deployment-only static build config' vite.config.ts
          grep -q 'base: "/langrisser-future-guide/"' vite.config.ts
          grep -q 'nitro: false' vite.config.ts

      - name: Build static GitHub Pages candidate
        run: bun run build

      - name: TypeScript gate
        run: bunx tsc --noEmit

      - name: Static Hero detail header gate
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          cp dist/client/index.html dist/client/404.html
          test -f dist/client/heroes/index.html
          test -f dist/client/heroes/6/index.html
          test -f dist/client/images/heroes/cards/6.png
          count=$(find dist/client/images/heroes/cards -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          test "$count" = '267'
          cmp -s public/images/heroes/cards/6.png dist/client/images/heroes/cards/6.png
          printf '%s\n' "$GITHUB_SHA" > dist/client/qa-main-source.txt
          printf '%s\n' '4e3743306c4d13e9fe5a9c3867e257f3b171bf3b' > dist/client/qa-production-main-source.txt
          echo "PASS static Hero header files/count/hash; rendered content is owned by Browser UI gate"

      - name: Publish QA candidate to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/client
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Hero detail header Hosted QA: deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run actual Hosted Browser UI gate
        env:
          HERO_HEADER_QA_EXPECTED_SOURCE_SHA: ${{ github.sha }}
          HERO_HEADER_QA_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/
        run: node scripts/validate-hero-detail-header-hosted-qa.mjs

      - name: Print concise result
        if: always()
        shell: bash
        run: |
          if [ -f test-results/hero-detail-header-hosted-qa/report.json ]; then
            node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('test-results/hero-detail-header-hosted-qa/report.json','utf8'));console.log(JSON.stringify({status:r.status,error:r.error??null,summary:r.summary,hosted:r.hosted,browser:r.browser,failedChecks:(r.checks??[]).filter(x=>!x.pass)},null,2));"
          fi

      - name: Upload Hero detail header QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-detail-header-hosted-browser-qa
          path: test-results/hero-detail-header-hosted-qa
          if-no-files-found: warn
          retention-days: 5
