name: Temporary HeroFetter Skill relation validate
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen typed relation
        run: node scripts/validate-hero-fetter-skill-relation.mjs
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-hero-fetter-skill-relation-validate.yml
          git commit -m "Remove temporary HeroFetter Skill relation validator workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
