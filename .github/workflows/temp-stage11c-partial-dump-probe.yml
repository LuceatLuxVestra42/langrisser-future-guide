name: Temporary Stage11C partial dump probe
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract official IL2CPP pair and partial dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage11c out/stage11c-partial
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib
          D=pathlib.Path('/tmp/stage11c'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ent(u,hs(u)) if e[0]==target); (D/out).write_bytes(get(u,e))
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release >/dev/null 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/stage11c/dump
          set +e
          dotnet "$DLL" /tmp/stage11c/GameAssembly.dll /tmp/stage11c/global-metadata.dat /tmp/stage11c/dump > out/stage11c-partial/dumper.log 2>&1
          echo $? > out/stage11c-partial/dumper-exit.txt
          set -e
          ls -la /tmp/stage11c/dump > out/stage11c-partial/dump-files.txt
          test -f /tmp/stage11c/dump/script.json
          test -f /tmp/stage11c/dump/dump.cs
      - name: Identify current method and Hero3 modifier fields
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json,pathlib,re,bisect
          D=pathlib.Path('/tmp/stage11c/dump'); O=pathlib.Path('out/stage11c-partial')
          s=json.loads((D/'script.json').read_text(errors='replace')); methods=[]
          def walk(x):
            if isinstance(x,dict):
              if 'Address' in x and ('Name' in x or 'Signature' in x):
                try:
                  a=x['Address']; a=int(a,16) if isinstance(a,str) else int(a); a=a-0x180000000 if a>=0x180000000 else a
                  methods.append((a,x.get('Name',''),x.get('Signature','')))
                except: pass
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(s); methods=sorted(set(methods)); addrs=[x[0] for x in methods]
          target=0x17a0cc0; i=bisect.bisect_right(addrs,target)-1; owner=methods[i]
          around=methods[max(0,i-5):i+6]
          named=[m for m in methods if any(k in (m[1]+' '+m[2]) for k in ['ComputeHeroProperties','ComputeSoldierProperties','BattlePropertyModifier','PropertyModifyType'])][:300]
          dump=(D/'dump.cs').read_text(errors='replace')
          keys=['Hero1_HPCmdAdd','Hero2_HPCmdAdd','Hero3_HPCmdAdd','Hero1_ATCmdAdd','Hero2_ATCmdAdd','Hero3_ATCmdAdd','Hero1_DFCmdAdd','Hero2_DFCmdAdd','Hero3_DFCmdAdd','Hero1_MagicDFCmdAdd','Hero2_MagicDFCmdAdd','Hero3_MagicDFCmdAdd','BattlePropertyModifier']
          excerpts={}
          for k in keys:
            p=dump.find(k); excerpts[k]=dump[max(0,p-1800):p+3000] if p>=0 else ''
          (O/'result.json').write_text(json.dumps({'status':'PASS','owner':owner,'around':around,'named':named},ensure_ascii=False,indent=2)+'\n')
          (O/'modifier-excerpts.txt').write_text('\n\n'.join('===== '+k+' =====\n'+v for k,v in excerpts.items()))
          print(json.dumps({'owner':owner,'around':around,'found':{k:bool(v) for k,v in excerpts.items()}},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage11c-partial
          path: out/stage11c-partial
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-stage11c-partial-dump-probe.yml
          git commit -m "Remove temporary Stage11C partial probe"
          git push origin HEAD:${GITHUB_REF_NAME}
