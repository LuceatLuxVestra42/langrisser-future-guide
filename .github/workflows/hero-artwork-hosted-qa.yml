name: Hero Artwork Hosted Browser QA

on:
  push:
    branches:
      - work/hero-artwork-hosted-qa
    paths:
      - '.github/workflows/hero-artwork-hosted-qa.yml'
      - 'scripts/validate-hero-artwork-hosted-qa.mjs'
      - 'src/routes/heroes.tsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero-artwork-hosted-browser-qa
  cancel-in-progress: true

jobs:
  hosted-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout H-A6 QA candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen project dependencies
        run: bun install --frozen-lockfile

      - name: Reconfirm Hero resolver gate
        run: |
          set -euo pipefail
          node scripts/generate_hero_list_stage4_artwork.cjs
          node scripts/validate_hero_list_stage4.cjs

      - name: Reuse proven GitHub Pages static build config
        run: |
          set -euo pipefail
          git fetch --depth=1 origin deploy/soldier-lower-tier-kr-names-20260828
          git show FETCH_HEAD:vite.config.ts > vite.config.ts
          grep -q 'GitHub Pages deployment-only static build config' vite.config.ts
          grep -q 'base: "/langrisser-future-guide/"' vite.config.ts
          grep -q 'nitro: false' vite.config.ts

      - name: Build static GitHub Pages candidate
        run: bun run build

      - name: TypeScript gate after generated build inputs
        run: bunx tsc --noEmit

      - name: Static Hero artwork gate
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            dist/client/index.html \
            dist/client/404.html \
            dist/client/heroes/index.html \
            dist/client/heroes/6/index.html \
            dist/client/heroes/99204/index.html \
            dist/client/images/heroes/cards/6.png \
            dist/client/images/heroes/cards/99204.png; do
            test -f "$path"
          done

          count=$(find dist/client/images/heroes/cards -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          test "$count" = '267'
          cmp public/images/heroes/cards/6.png dist/client/images/heroes/cards/6.png
          cmp public/images/heroes/cards/99204.png dist/client/images/heroes/cards/99204.png
          grep -q '/langrisser-future-guide/images/heroes/cards/' dist/client/heroes/index.html
          grep -q '공식 초상화 267명 연결' dist/client/heroes/index.html
          ! grep -q '나머지는 placeholder' dist/client/heroes/index.html

          printf '%s\n' "$GITHUB_SHA" > dist/client/qa-main-source.txt
          printf '%s\n' 'hero-artwork-hosted-browser-qa' > dist/client/qa-surface.txt
          printf '%s\n' '44e04bb3fd0657f82690efe39ae3395e36980ba6' > dist/client/qa-hero-artwork-h-a6-predecessor.txt
          echo "PASS static Hero artwork count=${count}"

      - name: Publish Hero artwork QA candidate to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/client
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Hero Artwork Hosted QA: deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run actual Hosted and Browser UI gate
        env:
          HERO_ARTWORK_QA_EXPECTED_SOURCE_SHA: ${{ github.sha }}
          HERO_ARTWORK_QA_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/
        run: node scripts/validate-hero-artwork-hosted-qa.mjs

      - name: Persist Hosted QA checkpoint
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh_pages_sha=$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')
          report='test-results/hero-artwork-hosted-qa/report.json'
          mkdir -p data/validation data/checkpoints
          node - "$report" "$GITHUB_SHA" "$gh_pages_sha" <<'NODE'
          const fs = require('fs');
          const [reportPath, sourceSha, ghPagesSha] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const validation = {
            schemaVersion: 1,
            status: report.status,
            completion: report.status === 'PASS_HERO_ARTWORK_HOSTED_BROWSER_QA' ? 'COMPLETE' : 'BLOCKED',
            hA6Predecessor: '44e04bb3fd0657f82690efe39ae3395e36980ba6',
            qaSourceSha: sourceSha,
            ghPagesSha,
            hostedBase: report.baseUrl,
            hostedAssetHeadPassCount: report.hosted.assetHeadPassCount,
            representativeFinalHeroId: 6,
            representativeBeginHeroId: 99204,
            browser: report.browser,
            summary: report.summary,
          };
          fs.writeFileSync('data/validation/hero-artwork-hosted-qa.v1.json', JSON.stringify(validation, null, 2) + '\n');
          const checkpoint = `Hero Artwork Hosted / Browser QA checkpoint\n기준일: 2026-08-29\n\nstatus: ${validation.status}\ncompletion: ${validation.completion}\nH-A6 predecessor: ${validation.hA6Predecessor}\nQA source SHA: ${sourceSha}\ngh-pages deployment SHA: ${ghPagesSha}\nhosted base: ${validation.hostedBase}\nresolver/assets: 267 / 267\nHosted PNG HEAD: ${validation.hostedAssetHeadPassCount} / 267\nrepresentative final Hero: 6 (레온)\nrepresentative begin Hero: 99204 (타탈리아)\nDesktop list/detail/direct/reload: PASS\nMobile list/detail/no-horizontal-overflow: PASS\n\nOwning layer: presentation / deployment / browser QA\nSemantic recomputation: none\n\n다시 열리는 조건:\n- H-A6 actual PNG 또는 resolver contract 변경\n- GitHub Pages base/path architecture 변경\n- hosted asset HTTP coverage 파손\n- representative Browser/UI regression\n\n다음 시작점:\n- H-A5/H-A6 main promotion은 Project Doctor hero-assets MANUAL_REVIEW 정책과 별도로 처리\n- Hosted QA PASS 자체를 semantic stage 재검토 사유로 사용하지 않음\n`;
          fs.writeFileSync('data/checkpoints/hero-artwork-hosted-qa.txt', checkpoint);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/hero-artwork-hosted-qa.v1.json data/checkpoints/hero-artwork-hosted-qa.txt
          git commit -m "Record Hero artwork Hosted Browser QA checkpoint"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Hosted Browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-artwork-hosted-browser-qa
          path: |
            test-results/hero-artwork-hosted-qa
            data/validation/hero-artwork-hosted-qa.v1.json
            data/checkpoints/hero-artwork-hosted-qa.txt
          if-no-files-found: warn
          retention-days: 5
