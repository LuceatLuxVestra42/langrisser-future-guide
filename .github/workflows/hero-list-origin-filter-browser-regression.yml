name: Hero List Origin Filter Browser Regression

on:
  workflow_run:
    workflows:
      - Authoritative GitHub Pages Deploy
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA; defaults to current workflow SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hero-list-origin-filter-browser-regression-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/

jobs:
  origin-filter-browser-regression:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact deployed source
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout QA source
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve exact deployed source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run) expected="$WORKFLOW_RUN_HEAD_SHA" ;;
            workflow_dispatch) expected="${DISPATCH_EXPECTED_SHA:-$CURRENT_SHA}" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          if [[ ! "$expected" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Exact 40-hex deployed source SHA required: $expected" >&2
            exit 2
          fi
          EXPECTED_SOURCE_SHA="$expected" node --input-type=module <<'NODE'
          const base = process.env.HOSTED_BASE_URL;
          const expected = process.env.EXPECTED_SOURCE_SHA;
          const response = await fetch(`${base}authoritative-pages-source.json?origin_filter_qa=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`deployment manifest HTTP ${response.status}`);
          const manifest = await response.json();
          if (manifest.sourceSha !== expected) {
            throw new Error(`origin filter predecessor freshness mismatch: expected=${expected} deployed=${manifest.sourceSha}`);
          }
          if (manifest.semanticStageReopened !== false) throw new Error('deployed manifest reopened semantic stage');
          console.log(JSON.stringify({ status: 'PASS_ORIGIN_FILTER_PREDECESSOR', expectedSourceSha: expected, deployedSourceSha: manifest.sourceSha, semanticStageReopened: false }, null, 2));
          NODE
          echo "EXPECTED_SOURCE_SHA=$expected" >> "$GITHUB_ENV"

      - name: Install Chromium Browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify LLR excluded from Ch.4 origin results
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.HOSTED_BASE_URL.replace(/\/?$/, '/');
          const heroesUrl = new URL('heroes/', base).toString();
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', (error) => errors.push(`page:${String(error)}`));
            page.on('console', (message) => { if (message.type() === 'error') errors.push(`console:${message.text()}`); });

            const response = await page.goto(heroesUrl, { waitUntil: 'networkidle', timeout: 45000 });
            if (!response || response.status() >= 400) throw new Error(`Hero list entry failed: ${response?.status()}`);

            await page.getByRole('button', { name: '출전작', exact: true }).click();
            const originGroup = page.getByRole('group', { name: '출전작 필터' });
            await originGroup.waitFor({ timeout: 10000 });

            const ch4Button = originGroup.getByRole('button', { name: /랑그릿사 모바일 Ch\.4\(토이바르\)/ });
            if (await ch4Button.count() !== 1) throw new Error('Ch.4 origin filter button missing or ambiguous');
            await ch4Button.click();

            const heroList = page.getByRole('region', { name: '영웅 목록' });
            await heroList.waitFor({ timeout: 10000 });
            const visibleCards = heroList.locator('a[href*="/heroes/"]');
            const visibleCount = await visibleCards.count();
            if (visibleCount <= 0) throw new Error('Ch.4 origin filter returned no heroes; regression fixture is not meaningful');

            const llrIcons = heroList.locator('img[alt="LLR"]');
            const llrCount = await llrIcons.count();
            if (llrCount !== 0) {
              const names = await llrIcons.evaluateAll((nodes) => nodes.map((node) => node.closest('a')?.textContent?.trim() ?? 'unknown'));
              throw new Error(`LLR heroes leaked into Ch.4 origin results: count=${llrCount} cards=${JSON.stringify(names)}`);
            }
            if (errors.length !== 0) throw new Error(`Browser/UI errors: ${JSON.stringify(errors)}`);

            console.log(JSON.stringify({
              status: 'PASS_LLR_EXCLUDED_FROM_CH4_ORIGIN',
              sourceSha: process.env.EXPECTED_SOURCE_SHA,
              originId: 22,
              originLabel: '랑그릿사 모바일 Ch.4(토이바르)',
              visibleHeroCount: visibleCount,
              visibleLlrCount: llrCount,
              semanticStageReopened: false,
            }, null, 2));
          } finally {
            await browser.close();
          }
          NODE
