name: Hero final-job army probe
on:
  push:
    branches:
      - feat/hero-final-job-army-type-20260919

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate pinned ConfigData source pack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir /tmp/configdata
      - name: Inspect explicit JobInfo army fields
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync('/tmp/configdata/ConfigDataJobInfo.json', 'utf8'));
          const ids = new Set([101, 201, 262, 299, 307, 404, 605, 1104]);
          const samples = rows.filter((row) => ids.has(row.ID));
          console.log('JOBINFO_COUNT', rows.length);
          console.log('SAMPLE_KEYS', JSON.stringify([...new Set(samples.flatMap((row) => Object.keys(row)))].sort()));
          for (const row of samples) console.log('JOBINFO_SAMPLE', JSON.stringify(row));
          const candidateKeys = [...new Set(rows.flatMap((row) => Object.keys(row)))].filter((key) => /army|occupation|class|type/i.test(key)).sort();
          console.log('CANDIDATE_KEYS', JSON.stringify(candidateKeys));
          for (const key of candidateKeys) {
            const values = [...new Set(samples.map((row) => row[key]).filter((value) => value !== undefined))];
            console.log('CANDIDATE_SAMPLE', key, JSON.stringify(values));
          }
          NODE
