name: Hero-Soldier Stage C-3 Special Fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject protected main as explicit producer target
        run: |
          echo 'Explicit Hero-Soldier Stage C-3 producer runs must target a non-main branch. Select the branch/ref to freeze, then open a normal PR.'
          exit 1

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate C-3 special relation fixtures
        id: validate
        continue-on-error: true
        run: node scripts/validate-hero-soldier-stageC-3-special-fixtures.cjs

      - name: Show C-3 summary
        if: always() && hashFiles('data/validation/hero-soldier-integration-stageC-3-special-fixtures.v1.json') != ''
        run: |
          node - <<'NODE'
          const v = require('./data/validation/hero-soldier-integration-stageC-3-special-fixtures.v1.json');
          console.log(JSON.stringify({
            status: v.status,
            completion: v.completion,
            summary: v.summary,
            fixtures: v.fixtures.map(f => ({ code: f.code, status: f.status, pairKey: f.pairKey })),
            hardErrors: v.hardErrors,
            decision: v.decision
          }, null, 2));
          NODE

      - name: Upload C-3 diagnostics
        if: always() && hashFiles('data/validation/hero-soldier-integration-stageC-3-special-fixtures.v1.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hero-soldier-stageC-3-special-fixtures
          path: data/validation/hero-soldier-integration-stageC-3-special-fixtures.v1.json

      - name: Freeze C-3 output on explicit producer run
        if: steps.validate.outcome == 'success'
        run: |
          TARGET='data/validation/hero-soldier-integration-stageC-3-special-fixtures.v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'C-3 output already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Freeze Hero-Soldier Stage C-3 special fixture PASS'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce C-3 gate
        if: always() && steps.validate.outcome != 'success'
        run: exit 1
