name: Hero Stage 6-4 Site Consumer Final Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'data/contracts/hero-stage6-4-site-consumer.v1.json'
      - 'data/generated/hero-detail.v1.json'
      - 'data/generated/hero-detail-shared.v1.json'
      - 'data/generated/hero-detail/by-id/**'
      - 'data/validation/hero-stage6-3-final.v1.json'
      - 'data/validation/hero-exclusive-equipment-relation-stageB-final.v1.json'
      - 'data/generated/hero-exclusive-equipment-consumer-admission.v1.json'
      - 'data/generated/hero-exclusive-equipment-by-hero.v1.json'
      - 'data/generated/hero-exclusive-equipment-by-equipment.v1.json'
      - 'data/generated/equipment_stage3_5_exclusive_consumer.json'
      - 'scripts/validate_hero_stage6_4_site_consumer.cjs'
      - '.github/workflows/hero-stage6-4-site-consumer.yml'
  pull_request:
    paths:
      - 'data/contracts/hero-stage6-4-site-consumer.v1.json'
      - 'data/generated/hero-detail.v1.json'
      - 'data/generated/hero-detail-shared.v1.json'
      - 'data/generated/hero-detail/by-id/**'
      - 'data/validation/hero-stage6-3-final.v1.json'
      - 'data/validation/hero-stage6-4-final.v1.json'
      - 'data/checkpoints/hero-stage6-4-site-consumer.json'
      - 'data/checkpoints/hero-stage6-4-site-consumer.md'
      - 'data/validation/hero-exclusive-equipment-relation-stageB-final.v1.json'
      - 'data/generated/hero-exclusive-equipment-consumer-admission.v1.json'
      - 'data/generated/hero-exclusive-equipment-by-hero.v1.json'
      - 'data/generated/hero-exclusive-equipment-by-equipment.v1.json'
      - 'data/generated/equipment_stage3_5_exclusive_consumer.json'
      - 'scripts/validate_hero_stage6_4_site_consumer.cjs'
      - '.github/workflows/hero-stage6-4-site-consumer.yml'

permissions:
  contents: write

jobs:
  site-consumer-final-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate final Hero site consumer boundary
        id: validate
        continue-on-error: true
        run: node scripts/validate_hero_stage6_4_site_consumer.cjs

      - name: Show Stage 6-4 summary
        if: always() && hashFiles('data/validation/hero-stage6-4-final.v1.json') != ''
        run: |
          node - <<'NODE'
          const v = require('./data/validation/hero-stage6-4-final.v1.json');
          console.log(JSON.stringify({
            status:v.status,
            completion:v.completion,
            heroDataPipelineStatus:v.heroDataPipelineStatus,
            summary:v.summary,
            hardErrors:v.hardErrors,
            decision:v.decision
          }, null, 2));
          NODE

      - name: Upload Stage 6-4 diagnostics
        if: always() && hashFiles('data/validation/hero-stage6-4-final.v1.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hero-stage6-4-diagnostics
          path: |
            data/validation/hero-stage6-4-final.v1.json
            data/checkpoints/hero-stage6-4-site-consumer.json
            data/checkpoints/hero-stage6-4-site-consumer.md

      - name: Commit Stage 6-4 checkpoint on work branch
        if: steps.validate.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/')
        run: |
          TARGETS='data/validation/hero-stage6-4-final.v1.json data/checkpoints/hero-stage6-4-site-consumer.json data/checkpoints/hero-stage6-4-site-consumer.md'
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'Stage 6-4 outputs already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'Freeze Hero Stage 6-4 site consumer checkpoint'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify frozen Stage 6-4 outputs on PR or main
        if: steps.validate.outcome == 'success' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        run: |
          TARGETS='data/validation/hero-stage6-4-final.v1.json data/checkpoints/hero-stage6-4-site-consumer.json data/checkpoints/hero-stage6-4-site-consumer.md'
          if [ -n "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'Stage 6-4 generated outputs are not frozen or are stale.'
            git status --short -- $TARGETS
            exit 1
          fi

      - name: Enforce Stage 6-4 gate
        if: always() && steps.validate.outcome != 'success'
        run: exit 1
