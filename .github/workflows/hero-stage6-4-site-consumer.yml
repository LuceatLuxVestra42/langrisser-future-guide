name: Hero Stage 6-4 Site Consumer Final Freeze

on:
  push:
    branches:
      - 'work/sp-cost-stage6-4-final'
    paths:
      - '.github/workflows/hero-stage6-4-site-consumer.yml'

permissions:
  contents: write

jobs:
  explicit-producer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate final Hero site consumer boundary
        run: node scripts/validate_hero_stage6_4_site_consumer.cjs

      - name: Verify Stage 6-4 completion
        run: |
          node - <<'NODE'
          const v=require('./data/validation/hero-stage6-4-final.v1.json');
          const ok=(v.status==='PASS'||v.status==='PASS_WITH_REVIEW')&&v.completion==='COMPLETE'&&v.heroDataPipelineStatus==='FINAL_FROZEN'&&v.summary?.hardErrorCount===0;
          if(!ok){ console.error(v); process.exit(1); }
          console.log(JSON.stringify({status:v.status,completion:v.completion,pipeline:v.heroDataPipelineStatus,summary:v.summary},null,2));
          NODE

      - name: Audit Stage 6-4 mutation scope
        run: |
          allowed='^(data/validation/hero-stage6-4-final\.v1\.json|data/checkpoints/hero-stage6-4-site-consumer\.json|data/checkpoints/hero-stage6-4-site-consumer\.md|\.github/workflows/hero-stage6-4-site-consumer\.yml)$'
          bad="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected mutation:'
            echo "$bad"
            exit 1
          fi
          git status --short

      - name: Freeze Stage 6-4 outputs
        run: |
          TARGETS='data/validation/hero-stage6-4-final.v1.json data/checkpoints/hero-stage6-4-site-consumer.json data/checkpoints/hero-stage6-4-site-consumer.md'
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'Stage 6-4 outputs already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'Freeze Hero Stage 6-4 site consumer checkpoint'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
