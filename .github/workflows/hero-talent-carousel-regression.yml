name: Hero Talent Carousel Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hero-talent-carousel-regression.yml'
      - 'src/routes/heroes_.$heroId.tsx'
      - 'data/generated/hero-detail/by-id/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hero-talent-carousel-regression.yml'
      - 'src/routes/heroes_.$heroId.tsx'
      - 'data/generated/hero-detail/by-id/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-talent-carousel-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hero-talent-carousel-regression:
    name: hero-talent-carousel-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build static candidate
        run: |
          set -euo pipefail
          node scripts/build-equipment-name-kr-presentation.mjs
          bunx vite build --config vite.config.pages.ts
          git diff --exit-code

      - name: Install Chromium regression runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify Hero talent star navigation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qa-site
          mkdir -p .qa-site/langrisser-future-guide
          cp -R dist/client/. .qa-site/langrisser-future-guide/
          cat > .qa-site/langrisser-future-guide/authoritative-pages-source.json <<JSON
          {
            "status": "AUTHORITATIVE_GITHUB_PAGES_DEPLOYMENT",
            "sourceSha": "${GITHUB_SHA}",
            "sourceRef": "main"
          }
          JSON

          python3 -m http.server 4173 --bind 127.0.0.1 --directory .qa-site >/tmp/hero-talent-carousel-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/langrisser-future-guide/heroes/6/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/hero-talent-carousel-http.log >&2 || true
            echo 'Static QA server did not become ready' >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const baseUrl = 'http://127.0.0.1:4173/langrisser-future-guide/';
          const check = (condition, message) => { if (!condition) throw new Error(message); };
          const heroDir = 'data/generated/hero-detail/by-id';
          const heroFiles = fs.readdirSync(heroDir)
            .filter((name) => /^\d+\.json$/.test(name))
            .sort((a, b) => Number(a.replace('.json', '')) - Number(b.replace('.json', '')));

          const byInitialStar = new Map();
          let hero6 = null;
          for (const file of heroFiles) {
            const record = JSON.parse(fs.readFileSync(`${heroDir}/${file}`, 'utf8'));
            const heroId = Number(record.heroId);
            const initialStar = Number(record.normal?.heroMeta?.initialStar);
            if (heroId === 6) hero6 = { heroId, initialStar, nameCn: record.identity?.nameCn ?? null };
            if ([1, 2].includes(initialStar) && !byInitialStar.has(initialStar)) {
              byInitialStar.set(initialStar, { heroId, initialStar, nameCn: record.identity?.nameCn ?? null });
            }
          }

          check(hero6?.initialStar === 3, `Hero 6 initialStar must stay 3, got ${JSON.stringify(hero6)}`);
          check(byInitialStar.has(2), 'No frozen Hero detail representative with initialStar=2');
          check(byInitialStar.has(1), 'No frozen Hero detail representative with initialStar=1');

          const ashi = { heroId: 99279, initialStar: 3, nameCn: '雅希' };
          const targets = [hero6, byInitialStar.get(2), byInitialStar.get(1), ashi];

          async function verifyTalentCarousel(page, target, label) {
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });

            const response = await page.goto(`${baseUrl}heroes/${target.heroId}/`, { waitUntil: 'networkidle', timeout: 45000 });
            check(response && response.status() < 400, `${label} Hero ${target.heroId} page failed: ${response?.status()}`);

            const carousel = page.locator('[data-hero-talent-carousel="true"]');
            await carousel.waitFor({ state: 'visible', timeout: 15000 });
            const state = carousel.locator('[data-hero-talent-active-star]');
            await state.waitFor({ state: 'attached', timeout: 15000 });

            check((await state.getAttribute('data-hero-talent-active-star')) === '6', `${label} Hero ${target.heroId} default talent star is not 6`);
            check((await state.getAttribute('data-hero-talent-min-star')) === String(target.initialStar), `${label} Hero ${target.heroId} min star mismatch`);
            check((await state.getAttribute('data-hero-talent-max-star')) === '6', `${label} Hero ${target.heroId} max star is not 6`);

            check(await carousel.locator('[aria-label="고유기 성급 선택"]').count() === 0, `${label} Hero ${target.heroId} direct talent star selector must be removed`);
            for (let star = target.initialStar; star <= 6; star += 1) {
              check(await carousel.getByRole('button', { name: `${star}성`, exact: true }).count() === 0, `${label} Hero ${target.heroId} exposed direct ${star}성 selector`);
            }

            const lower = carousel.getByRole('button', { name: '낮은 성급 고유기 보기', exact: true });
            const higher = carousel.getByRole('button', { name: '높은 성급 고유기 보기', exact: true });
            check(await lower.count() === 1 && await higher.count() === 1, `${label} Hero ${target.heroId} talent arrows missing or duplicated`);

            const assertStar = async (star) => {
              await carousel.locator(`[data-hero-talent-active-star="${star}"]`).waitFor({ state: 'attached', timeout: 5000 });
              const article = carousel.locator('article');
              const name = article.locator('[data-hero-talent-name="true"]');
              const starDisplay = article.locator(`[data-hero-talent-star-display="${star}"]`);
              const description = article.locator('[data-hero-talent-description="true"]');
              const talentIcon = article.locator('[data-hero-skill-icon-variant="talent"]');
              const talentIconImage = talentIcon.locator('img');
              check(await talentIcon.count() === 1, `${label} Hero ${target.heroId} talent icon missing or duplicated`);
              check(await talentIconImage.count() === 1, `${label} Hero ${target.heroId} talent icon image missing or duplicated`);
              const talentIconPresentation = await talentIconImage.evaluate((element) => {
                const rect = element.getBoundingClientRect();
                return {
                  clipPath: getComputedStyle(element).clipPath,
                  width: rect.width,
                  height: rect.height,
                };
              });
              check(talentIconPresentation.clipPath.startsWith('polygon('), `${label} Hero ${target.heroId} talent icon is not hex-clipped: ${talentIconPresentation.clipPath}`);
              check(talentIconPresentation.width > talentIconPresentation.height, `${label} Hero ${target.heroId} talent icon must preserve Gift asset aspect ratio: ${JSON.stringify(talentIconPresentation)}`);
              check(await name.count() === 1, `${label} Hero ${target.heroId} talent name missing or duplicated`);
              check(await starDisplay.count() === 1, `${label} Hero ${target.heroId} ${star}성 display missing or duplicated`);
              check((await starDisplay.innerText()).trim() === "★".repeat(star), `${label} Hero ${target.heroId} ${star}성 display mismatch`);
              check(await description.count() === 1, `${label} Hero ${target.heroId} talent description missing or duplicated`);

              const [iconBox, nameBox, starBox, descriptionBox] = await Promise.all([
                talentIcon.boundingBox(),
                name.boundingBox(),
                starDisplay.boundingBox(),
                description.boundingBox(),
              ]);
              check(iconBox && nameBox && starBox && descriptionBox, `${label} Hero ${target.heroId} talent layout boxes unavailable`);
              check(Math.abs(starBox.x - descriptionBox.x) <= 1, `${label} Hero ${target.heroId} talent description must align with star row: star=${starBox.x}, description=${descriptionBox.x}`);
              check(nameBox.x >= starBox.x, `${label} Hero ${target.heroId} talent name must stay beside the icon while star/description use the full card width`);
              const iconCenterY = iconBox.y + (iconBox.height / 2);
              const nameCenterY = nameBox.y + (nameBox.height / 2);
              check(Math.abs(iconCenterY - nameCenterY) <= 1, `${label} Hero ${target.heroId} talent name must be vertically centered on the icon: icon=${iconCenterY}, name=${nameCenterY}`);
              const iconToStarGap = starBox.y - (iconBox.y + iconBox.height);
              check(iconToStarGap >= 0 && iconToStarGap <= 8, `${label} Hero ${target.heroId} talent icon-to-star gap must stay compact: ${iconToStarGap}`);
            };

            await assertStar(6);
            check(await higher.isDisabled(), `${label} Hero ${target.heroId} higher arrow must be disabled at 6성`);
            check(!(await lower.isDisabled()), `${label} Hero ${target.heroId} lower arrow unexpectedly disabled at 6성`);
            check((await lower.innerText()).includes('5성'), `${label} Hero ${target.heroId} lower arrow must expose 5성 target label at 6성: ${JSON.stringify(await lower.innerText())}`);
            if (target.heroId === 99279) {
              const [lowerBox, articleBox] = await Promise.all([lower.boundingBox(), carousel.locator('article').boundingBox()]);
              check(lowerBox && articleBox, `${label} Ashi talent navigation boxes unavailable`);
              check(Math.abs(lowerBox.y - articleBox.y) <= 1, `${label} Ashi lower navigation must stay top-aligned with the talent card: button=${lowerBox.y}, article=${articleBox.y}`);
              check(Math.abs(lowerBox.height - articleBox.height) <= 1, `${label} Ashi lower navigation height must match the talent card: button=${lowerBox.height}, article=${articleBox.height}`);
              const [lowerIconBox, lowerLabelBox] = await Promise.all([
                lower.locator('svg').boundingBox(),
                lower.locator('span').boundingBox(),
              ]);
              check(lowerIconBox && lowerLabelBox, `${label} Ashi lower navigation icon/label boxes unavailable`);
              const lowerContentCenter = (lowerIconBox.y + lowerLabelBox.y + lowerLabelBox.height) / 2;
              const lowerButtonCenter = lowerBox.y + (lowerBox.height / 2);
              check(Math.abs(lowerContentCenter - lowerButtonCenter) <= 2, `${label} Ashi lower navigation icon/label must be vertically centered: content=${lowerContentCenter}, button=${lowerButtonCenter}`);
            }

            const downward = [6];
            for (let star = 5; star >= target.initialStar; star -= 1) {
              await lower.click();
              await assertStar(star);
              downward.push(star);
            }
            check(await lower.isDisabled(), `${label} Hero ${target.heroId} lower arrow must be disabled at ${target.initialStar}성`);
            check(!(await higher.isDisabled()), `${label} Hero ${target.heroId} higher arrow unexpectedly disabled at minimum star`);

            const upward = [target.initialStar];
            for (let star = target.initialStar + 1; star <= 6; star += 1) {
              await higher.click();
              await assertStar(star);
              upward.push(star);
            }
            check(await higher.isDisabled(), `${label} Hero ${target.heroId} higher arrow must be disabled after returning to 6성`);

            check(pageErrors.length === 0, `${label} Hero ${target.heroId} page errors: ${JSON.stringify(pageErrors)}`);
            check(consoleErrors.length === 0, `${label} Hero ${target.heroId} console errors: ${JSON.stringify(consoleErrors)}`);
            return { heroId: target.heroId, initialStar: target.initialStar, downward, upward, directSelectors: false };
          }

          const browser = await chromium.launch({ headless: true });
          try {
            const desktopResults = [];
            for (const target of targets) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              try {
                desktopResults.push(await verifyTalentCarousel(page, target, 'desktop'));
              } finally {
                await page.close();
              }
            }

            const mobileContext = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            let mobileResult;
            try {
              const mobilePage = await mobileContext.newPage();
              mobileResult = await verifyTalentCarousel(mobilePage, hero6, 'mobile');
              const overflow = await mobilePage.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              check(overflow <= 1, `mobile Hero 6 horizontal overflow=${overflow}`);
            } finally {
              await mobileContext.close();
            }

            console.log(JSON.stringify({
              status: 'PASS_HERO_TALENT_CAROUSEL_REGRESSION',
              defaultStar: 6,
              representatives: desktopResults,
              hero6ExpectedCycle: [6, 5, 4, 3, 4, 5, 6],
              mobileHero6: mobileResult,
              semanticRecomputation: false,
            }, null, 2));
          } finally {
            await browser.close();
          }
          NODE
