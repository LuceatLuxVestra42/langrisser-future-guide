name: Static Pages Preview

on:
  push:
    paths:
      - '.github/workflows/banner-stage3-7-frontend-integration.yml'
      - 'vite.config.ts'
      - 'data/contracts/banner-stage3-7-frontend-integration.v1.json'
      - 'data/configdata/ConfigDataArmyInfo.json'
      - 'data/generated/army-icon-manifest.v1.json'
      - 'data/generated/banner-stage3-3-basic-table-consumer.v1.json'
      - 'data/generated/banner-stage3-4-wish-consumer.v1.json'
      - 'data/generated/banner-stage3-5-cp-event-consumer.v1.json'
      - 'data/generated/banner-stage3-6-recurrence-pickup-log-consumer.v1.json'
      - 'data/generated/equipment_stage2_6_restrictions.json'
      - 'data/generated/equipment_stage2_6_job_index.json'
      - 'data/generated/equipment_stage3_3_general_list.json'
      - 'data/generated/equipment_stage3_4_general_detail.json'
      - 'data/generated/equipment_stage3_5_exclusive_consumer.json'
      - 'data/generated/hero-exclusive-equipment-by-equipment.v1.json'
      - 'data/generated/hero-list-stage1.v1.json'
      - 'data/generated/hero-card-artwork-stage4.v1.json'
      - 'data/generated/hero-detail.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'data/generated/soldier-detail-stage5-2.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'public/images/army/**'
      - 'public/images/heroes/cards/**'
      - 'public/images/shared/stats/**'
      - 'public/images/shared/movement/**'
      - 'scripts/import-army-icons-from-drive.mjs'
      - 'scripts/prepare-army-icons.mjs'
      - 'scripts/validate-banner-stage3-7-frontend-integration.mjs'
      - 'src/components/soldier-detail-modal.tsx'
      - 'src/lib/army-icon-assets.ts'
      - 'src/lib/banner-page.server.ts'
      - 'src/lib/banner-page.static.ts'
      - 'src/lib/banner-page.functions.ts'
      - 'src/lib/equipment-page.server.ts'
      - 'src/lib/equipment-page.functions.ts'
      - 'src/lib/hero-list.server.ts'
      - 'src/lib/hero-list.functions.ts'
      - 'src/lib/soldier-page.server.ts'
      - 'src/lib/soldier-page.functions.ts'
      - 'src/router.tsx'
      - 'src/routes/banners.tsx'
      - 'src/routes/equipment.tsx'
      - 'src/routes/equipment_.exclusive.tsx'
      - 'src/routes/equipment_.$equipmentId.tsx'
      - 'src/routes/heroes.tsx'
      - 'src/routes/heroes_.$heroId.tsx'
      - 'src/routes/soldiers.tsx'
      - 'src/routes/index.tsx'
      - 'src/routeTree.gen.ts'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Import official Soldier army icons
        run: node scripts/import-army-icons-from-drive.mjs
      - name: Validate Soldier army icon pipeline
        run: bun run check:army-icons
      - name: Validate Banner Stage 3-7 frontend integration
        run: node scripts/validate-banner-stage3-7-frontend-integration.mjs
      - name: Build production frontend
        run: bun run build
      - name: Verify static home, banner, equipment, Soldier, and Hero pages
        run: |
          test -f dist/client/index.html
          test -f dist/client/banners/index.html
          test -f dist/client/equipment/index.html
          test -f dist/client/equipment/exclusive/index.html
          test -f dist/client/soldiers/index.html
          test -f dist/client/heroes/index.html
          EQUIPMENT_DETAIL_COUNT="$(find dist/client/equipment -mindepth 2 -maxdepth 2 -type f -name index.html | grep -E '/equipment/[0-9]+/index\.html$' | wc -l | tr -d ' ')"
          HERO_DETAIL_COUNT="$(find dist/client/heroes -mindepth 2 -maxdepth 2 -type f -name index.html | grep -E '/heroes/[0-9]+/index\.html$' | wc -l | tr -d ' ')"
          echo "Equipment detail static pages: $EQUIPMENT_DETAIL_COUNT"
          echo "Hero detail static pages: $HERO_DETAIL_COUNT"
          test "$EQUIPMENT_DETAIL_COUNT" -eq 373
          test "$HERO_DETAIL_COUNT" -eq 267
          node -e "const x=require('./data/generated/soldier-list-stage5-8.v1.json'); if(x.summary.recordCount!==224 || x.summary.normalCount!==168 || x.summary.spCount!==56) process.exit(1)"
          node -e "const x=require('./data/generated/hero-list-stage1.v1.json'); if(x.freezeState!=='HERO_LIST_STAGE1_FROZEN' || x.summary.generatedRecordCount!==267 || x.summary.uniqueHeroCount!==267 || x.summary.hardErrorCount!==0) process.exit(1)"
          node -e "const x=require('./data/generated/hero-card-artwork-stage4.v1.json'); const s=x.summary; if(x.status!=='PASS' || x.completion!=='RESOLVER_READY' || s.heroCount!==267 || s.resolvedCount+s.pendingCount!==267 || s.stage6MissingCount!==0 || s.hardErrorCount!==0) process.exit(1)"
          node -e "const x=require('./data/generated/army-icon-manifest.v1.json'); if(x.assetsReady!==true || x.importedAssetCount!==10) process.exit(1)"
          ARMY_ICON_COUNT="$(find public/images/army -maxdepth 1 -type f -name 'Icon_Occupation_*.png' | wc -l | tr -d ' ')"
          test "$ARMY_ICON_COUNT" -eq 10
          test -f dist/client/images/army/Icon_Occupation_Infantryman.png
          test -f dist/client/images/army/Icon_Occupation_Marines.png
          test -f dist/client/images/army/Icon_Occupation_Cavalry.png
          test -f dist/client/images/army/Icon_Occupation_Fly.png
          test -f dist/client/images/army/Icon_Occupation_Water.png
          test -f dist/client/images/army/Icon_Occupation_Archer.png
          test -f dist/client/images/army/Icon_Occupation_Assassin.png
          test -f dist/client/images/army/Icon_Occupation_Magician.png
          test -f dist/client/images/army/Icon_Occupation_Monk.png
          test -f dist/client/images/army/Icon_Occupation_Monster.png
          test -f dist/client/images/shared/stats/Icon_HP.png
          test -f dist/client/images/shared/stats/Icon_Attack.png
          test -f dist/client/images/shared/stats/Icon_Defense.png
          test -f dist/client/images/shared/stats/Icon_MagicDefense.png
          test -f dist/client/images/shared/stats/Icon_Range.png
          test -f dist/client/images/shared/movement/Move_Ride.png
          test -f dist/client/images/shared/movement/Move_Walk.png
          test -f dist/client/images/shared/movement/Move_Water.png
          test -f dist/client/images/shared/movement/Move_Fly.png
          test -f dist/client/images/shared/movement/Move_FieldArmy.png
          grep -q 'Icon_Range.png' src/components/soldier-detail-modal.tsx
          grep -q 'Move_FieldArmy.png' src/components/soldier-detail-modal.tsx
          grep -q '/banners' src/routeTree.gen.ts
          grep -q '/equipment' src/routeTree.gen.ts
          grep -q '/soldiers' src/routeTree.gen.ts
          grep -q '/heroes' src/routeTree.gen.ts
          grep -q '/heroes/\$heroId' src/routeTree.gen.ts
          grep -q '224종' dist/client/soldiers/index.html
          grep -q '267' dist/client/heroes/index.html
          grep -q '매튜' dist/client/heroes/index.html
          grep -q '레온' dist/client/heroes/index.html
          test -f dist/client/heroes/1/index.html
          test -f dist/client/heroes/6/index.html
          grep -q '매튜' dist/client/heroes/1/index.html
          grep -q '레온' dist/client/heroes/6/index.html
          grep -q 'Stage 6' dist/client/heroes/6/index.html
          grep -q 'to: "/soldiers"' src/routes/index.tsx
          grep -q 'to: "/heroes"' src/routes/index.tsx
      - name: Persist static frontend checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routeTree.gen.ts \
            data/validation/banner-stage3-7-frontend-integration-summary.v1.json \
            data/generated/army-icon-manifest.v1.json \
            public/images/army
          if git diff --cached --quiet; then
            echo "No static frontend checkpoint changes"
            exit 0
          fi
          git commit -m "Freeze static frontend asset checkpoint"
          git push
      - name: Publish static preview to gh-pages
        if: github.ref == 'refs/heads/test/github-pages-static-banner'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/client
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy static preview ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
