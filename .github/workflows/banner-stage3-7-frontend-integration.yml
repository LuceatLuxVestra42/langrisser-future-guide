name: Static Pages Preview

on:
  push:
    paths:
      - '.github/workflows/banner-stage3-7-frontend-integration.yml'
      - 'vite.config.ts'
      - 'data/contracts/banner-stage3-7-frontend-integration.v1.json'
      - 'data/configdata/ConfigDataArmyInfo.json'
      - 'data/generated/army-icon-manifest.v1.json'
      - 'data/generated/banner-stage3-3-basic-table-consumer.v1.json'
      - 'data/generated/banner-stage3-4-wish-consumer.v1.json'
      - 'data/generated/banner-stage3-5-cp-event-consumer.v1.json'
      - 'data/generated/banner-stage3-6-recurrence-pickup-log-consumer.v1.json'
      - 'data/generated/equipment_stage2_6_restrictions.json'
      - 'data/generated/equipment_stage2_6_job_index.json'
      - 'data/generated/equipment_stage3_3_general_list.json'
      - 'data/generated/equipment_stage3_4_general_detail.json'
      - 'data/generated/equipment_stage3_5_exclusive_consumer.json'
      - 'data/generated/hero-exclusive-equipment-by-equipment.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'data/generated/soldier-detail-stage5-2.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'public/images/army/**'
      - 'scripts/prepare-army-icons.mjs'
      - 'scripts/validate-banner-stage3-7-frontend-integration.mjs'
      - 'src/lib/army-icon-assets.ts'
      - 'src/lib/banner-page.server.ts'
      - 'src/lib/banner-page.static.ts'
      - 'src/lib/banner-page.functions.ts'
      - 'src/lib/equipment-page.server.ts'
      - 'src/lib/equipment-page.functions.ts'
      - 'src/lib/soldier-page.server.ts'
      - 'src/lib/soldier-page.functions.ts'
      - 'src/router.tsx'
      - 'src/routes/banners.tsx'
      - 'src/routes/equipment.tsx'
      - 'src/routes/equipment_.exclusive.tsx'
      - 'src/routes/equipment_.$equipmentId.tsx'
      - 'src/routes/soldiers.tsx'
      - 'src/routes/index.tsx'
      - 'src/routeTree.gen.ts'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Soldier army icon pipeline
        run: bun run check:army-icons
      - name: Validate Banner Stage 3-7 frontend integration
        run: node scripts/validate-banner-stage3-7-frontend-integration.mjs
      - name: Build production frontend
        run: bun run build
      - name: Verify static home, banner, equipment, and Soldier pages
        run: |
          test -f dist/client/index.html
          test -f dist/client/banners/index.html
          test -f dist/client/equipment/index.html
          test -f dist/client/equipment/exclusive/index.html
          test -f dist/client/soldiers/index.html
          DETAIL_COUNT="$(find dist/client/equipment -mindepth 2 -maxdepth 2 -type f -name index.html | grep -E '/equipment/[0-9]+/index\.html$' | wc -l | tr -d ' ')"
          test "$DETAIL_COUNT" -eq 373
          node -e "const x=require('./data/generated/soldier-list-stage5-8.v1.json'); if(x.summary.recordCount!==224 || x.summary.normalCount!==168 || x.summary.spCount!==56) process.exit(1)"
          grep -q '/banners' src/routeTree.gen.ts
          grep -q '/equipment' src/routeTree.gen.ts
          grep -q '/soldiers' src/routeTree.gen.ts
          grep -q '224종' dist/client/soldiers/index.html
      - name: Persist Banner Stage 3-7 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts data/validation/banner-stage3-7-frontend-integration-summary.v1.json
          if git diff --cached --quiet; then
            echo "No Banner Stage 3-7 checkpoint changes"
            exit 0
          fi
          git commit -m "Freeze Banner Stage 3-7 frontend checkpoint"
          git push
      - name: Publish static preview to gh-pages
        if: github.ref == 'refs/heads/test/github-pages-static-banner'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/client
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy static preview ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
