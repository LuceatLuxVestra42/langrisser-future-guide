name: Hero Stage 6 Stat Consumer Refresh

on:
  push:
    branches:
      - 'work/**'
    paths:
      - 'scripts/refresh_hero_stage6_stat_consumer.cjs'
      - 'data/contracts/hero-stage6-5-stat-consumer-refresh.v1.json'
      - 'data/generated/hero-page-stage5-6-stat-composition.v1.json'
      - 'data/validation/hero-page-stage5-6-stat-composition.v1.json'
      - '.github/workflows/hero-stage6-stat-consumer-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero-stage6-stat-consumer-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-validate-writeback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Stage 6 production stat consumer
        id: refresh
        shell: bash
        run: |
          set +e
          node scripts/refresh_hero_stage6_stat_consumer.cjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize refresh provenance idempotently
        if: steps.refresh.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/generated/hero-detail.v1.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const sentence = 'Final job stat values/components are refreshed from the validated Stage 5-6 stat-composition predecessor without semantic recomputation.';
          const escaped = sentence.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const repeated = new RegExp(`(?:\\s*${escaped})+`, 'g');
          manifest.sourcePolicy = String(manifest.sourcePolicy || '').replace(repeated, '').trim();
          manifest.sourcePolicy = `${manifest.sourcePolicy} ${sentence}`.trim();
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Persist fail-closed diagnostics
        if: steps.refresh.outputs.exit_code != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- data/generated/hero-detail.v1.json data/generated/hero-detail/by-id || true
          test -f data/validation/hero-stage6-5-stat-consumer-refresh.v1.json || { echo "refresh failed before validation output" >&2; exit 1; }
          git add data/validation/hero-stage6-5-stat-consumer-refresh.v1.json
          test -f data/checkpoints/hero-stage6-5-stat-consumer-refresh.md && git add data/checkpoints/hero-stage6-5-stat-consumer-refresh.md || true
          git diff --cached --quiet || {
            git commit -m "chore(hero): record Stage6 stat refresh blocker"
            git push origin HEAD:${{ github.ref_name }}
          }
          echo "Stage6 stat-consumer refresh reported a blocker; production shards were restored and not committed." >&2
          exit 1

      - name: Verify mutation scope
        if: steps.refresh.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          if [ -z "$changed" ]; then
            echo "Stage6 stat consumer is already current; no repository mutation required."
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              data/generated/hero-detail.v1.json|data/generated/hero-detail/by-id/*.json|data/validation/hero-stage6-5-stat-consumer-refresh.v1.json|data/checkpoints/hero-stage6-5-stat-consumer-refresh.md) ;;
              *) echo "unexpected Stage6 stat-consumer mutation: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit refreshed production shards and validation
        if: steps.refresh.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/hero-detail.v1.json data/generated/hero-detail/by-id data/validation/hero-stage6-5-stat-consumer-refresh.v1.json data/checkpoints/hero-stage6-5-stat-consumer-refresh.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(hero): refresh Stage6 final stat consumer"
          git push origin HEAD:${{ github.ref_name }}
