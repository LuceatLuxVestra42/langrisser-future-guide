name: Hero Talent KR Sheet Source

on:
  pull_request:
    paths:
      - 'data/contracts/localization-audit-hero-talent-kr-sheet-source.v1.json'
      - 'data/presentation/hero-talent-kr-sheet-source.v1.json'
      - 'scripts/audit-localization-hero-talent-kr-sheet-source.mjs'
      - '.github/workflows/localization-audit-hero-talent-kr-sheet-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract pinned Korean-sheet normal Hero talents
        run: |
          mkdir -p artifacts
          node scripts/audit-localization-hero-talent-kr-sheet-source.mjs \
            --output artifacts/hero-talent-kr-sheet-source.v1.json
      - name: Verify or materialize projection
        run: |
          mkdir -p data/presentation
          cp artifacts/hero-talent-kr-sheet-source.v1.json data/presentation/hero-talent-kr-sheet-source.v1.json
          node scripts/audit-localization-hero-talent-kr-sheet-source.mjs --check
      - name: Commit generated projection when changed
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- data/presentation/hero-talent-kr-sheet-source.v1.json)" ]; then
            echo 'Generated projection already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/presentation/hero-talent-kr-sheet-source.v1.json
          git commit -m 'Materialize KR sheet Hero talent projection'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-talent-kr-sheet-source
          path: artifacts/hero-talent-kr-sheet-source.v1.json
          if-no-files-found: error
