name: Hero Bond Material Icons

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hero-bond-material-icons.yml'
      - 'data/contracts/hero-bond-material-icons.v1.json'
      - 'data/generated/hero-bond-material-icon-assets.v1.json'
      - 'data/validation/hero-bond-material-icon-assets-summary.v1.json'
      - 'scripts/validate-hero-bond-material-icon-assets.mjs'
      - 'public/images/heroes/bond-materials/**'
      - 'src/lib/hero-bond-materials.server.ts'
      - 'src/components/hero-bond-materials-panel.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen local icon assets
        run: node scripts/validate-hero-bond-material-icon-assets.mjs
      - name: Install dependencies without changing lockfile
        run: npm install --no-package-lock
      - name: Build frontend
        run: npm run build
      - name: Require clean repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
