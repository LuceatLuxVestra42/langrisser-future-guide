name: Hero portrait Stage 4-2B base-role probe
on:
  push:
    branches:
      - work/hero-portrait-stage4-2b-explicit-fallback-source-acquisition
    paths:
      - scripts/hero_portrait_stage4_2b_base_role_probe.py
      - .github/workflows/hero-portrait-stage4-2b-base-role-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'gdown==6.1.0'
      - run: python scripts/hero_portrait_stage4_2b_base_role_probe.py
      - run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2b-base-role-probe.v1.json
          if git diff --cached --quiet; then echo no-change; else git commit -m 'Probe Hero portrait Stage 4-2B base roles'; git push; fi
