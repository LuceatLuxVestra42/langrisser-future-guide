name: Hero portrait Stage 4-2C pending asset key inventory

on:
  workflow_dispatch:
  push:
    branches:
      - work/hero-portrait-stage4-2c-current-unity-source-proof
    paths:
      - scripts/hero_portrait_stage4_2c_pending_inventory.py
      - .github/workflows/hero-portrait-stage4-2c-pending-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pending current asset key inventory
        run: python scripts/hero_portrait_stage4_2c_pending_inventory.py
      - name: Commit generated inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2c-pending-current-asset-key-inventory.v1.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Generate Stage 4-2C pending asset key inventory'
          git push
