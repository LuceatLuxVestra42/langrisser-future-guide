name: Finalize Doctor Pages runtime retirement v3

on:
  push:
    branches:
      - fix/retire-doctor-pages-runtime

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: fix/retire-doctor-pages-runtime
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Restore frozen Skin validator inputs and materialize final runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 8ad8b238f33253f87cb903fbdf56fa563dde77c3
          git checkout 8ad8b238f33253f87cb903fbdf56fa563dde77c3 -- \
            data/contracts/skin-stage3-5-static-web-asset-map.v1.json \
            scripts/validate-skin-stage3-5-static-web-assets.mjs
          python scripts/retire-doctor-pages-runtime-once.py
          git rm \
            .github/workflows/project-doctor-authoritative-pages-deploy.yml \
            scripts/project-doctor-compose-authoritative-pages-runtime.mjs \
            scripts/project-doctor-validate-authoritative-pages-hosted.mjs \
            scripts/retire-doctor-pages-runtime-once.py \
            .github/workflows/finalize-doctor-pages-retirement-v3.yml

      - name: Validate current-tree retirement boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-skin-stage3-5-static-assets-readonly.mjs
          node scripts/validate-skin-stage3-6-hero-detail-consumer.mjs
          node tools/project-check/test/project-check-self-test.mjs
          node tools/route-hosted-qa/test/route-hosted-qa-self-test.mjs
          test "$(find public/images/skins -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = '540'
          test ! -e .github/workflows/project-doctor-authoritative-pages-deploy.yml
          test ! -e scripts/project-doctor-compose-authoritative-pages-runtime.mjs
          test ! -e scripts/project-doctor-validate-authoritative-pages-hosted.mjs
          grep -q 'CURRENT_REPOSITORY_FROZEN_CONSUMER' .github/workflows/authoritative-pages-deploy.yml
          grep -q 'vite.config.pages.ts' .github/workflows/authoritative-pages-deploy.yml
          if grep -Eq 'SKIN_RUNTIME_REF|project-doctor-compose-authoritative-pages-runtime|project-doctor-validate-authoritative-pages-hosted|skinRuntimeRef' .github/workflows/authoritative-pages-deploy.yml scripts/validate-authoritative-pages-hosted.mjs; then
            echo 'retired Doctor runtime token remains in active deployment path' >&2
            exit 1
          fi
          git diff --check

      - name: Build normal and Pages candidates without tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/before-build.txt
          bun run build
          bunx tsc --noEmit
          rm -rf dist
          node scripts/build-equipment-name-kr-presentation.mjs
          bunx vite build --config vite.config.pages.ts
          git diff --name-only | sort > /tmp/after-build.txt
          diff -u /tmp/before-build.txt /tmp/after-build.txt

      - name: Commit retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retire Project Doctor production Pages runtime [skip ci]'
          git push origin HEAD:fix/retire-doctor-pages-runtime
