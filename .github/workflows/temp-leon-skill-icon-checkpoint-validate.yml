name: Temporary Leon Skill Icon Checkpoint Validate

on:
  push:
    branches:
      - verify/leon-skill-icon-official-20260902

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Project Check plan
        run: node tools/project-check/cli/check.mjs --path tools/asset-intake/checkpoints/leon-skill-icon-official-verify-20260902.md --plan

      - name: Project Check execute owning validator
        run: node tools/project-check/cli/check.mjs --path tools/asset-intake/checkpoints/leon-skill-icon-official-verify-20260902.md

      - name: Ensure validator left no tracked mutation
        run: test -z "$(git status --porcelain)"

      - name: Remove temporary validation workflow
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-leon-skill-icon-checkpoint-validate.yml
          git commit -m "Remove temporary Leon skill icon checkpoint validation"
          git push origin HEAD:${GITHUB_REF_NAME}
