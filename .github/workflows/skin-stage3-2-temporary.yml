name: Skin Stage 3-2 Temporary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/skin-stage3-2-temporary.yml

permissions:
  contents: write

jobs:
  build-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Generate representative fixtures
        run: node scripts/generate-skin-stage3-2-resolution-fixtures.mjs
      - name: Validate Stage 3-2 readiness
        run: node scripts/validate-skin-stage3-2-resolution-proof.mjs
      - name: Commit generated checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures/skin-stage3-2-resolution-fixtures.v1.json data/validation/skin-stage3-2-readiness.v1.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Prepare Skin Stage 3-2 resolution proof"
          git pull --rebase origin main
          git push origin main
