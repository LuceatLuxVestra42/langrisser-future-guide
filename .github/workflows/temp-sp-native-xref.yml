name: Temporary SP native xref
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  xref:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract official GameAssembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sp-native out/sp-native-xref
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib,hashlib,json
          D=pathlib.Path('/tmp/sp-native'); O=pathlib.Path('out/sp-native-xref'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          part=1; target='Client/GameAssembly.dll'; u=f'{B}/InstallPage_{V}_{part}.zip'
          def rq(a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:t=int(r.headers['Content-Length'])
          n=min(131072,t); x=rq(t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(o,o+s-1); i=0; hit=None
          while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
            fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace')
            if nm==target: hit=(nm,me,cr,co,un,lo)
            i+=46+fn+ex+cm
          assert hit
          nm,me,cr,co,un,lo=hit; h=rq(lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; z=rq(st,st+co-1); raw=z if me==0 else zlib.decompress(z,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr
          (D/'GameAssembly.dll').write_bytes(raw)
          (O/'source.json').write_text(json.dumps({'installVersion':V,'part':1,'entry':target,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()},indent=2)+'\n')
          PY
      - name: Instruction-aligned xref and disassembly
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json,pathlib,re,subprocess
          E='/tmp/sp-native/GameAssembly.dll'; O=pathlib.Path('out/sp-native-xref')
          image=0x180000000
          targets={
            'GetSPHeroInfoIfJobIsSP':0x18187B960,
            'SP_get_HPCmd_INI':0x1804040E0,
            'SP_get_ATCmd_INI':0x180342D00,
            'SP_get_DFCmd_INI':0x1803875B0,
            'SP_get_MagicDFCmd_INI':0x180342D10,
          }
          def dis(start,stop):
            cp=subprocess.run(['objdump','-d','-M','intel',f'--start-address={start}',f'--stop-address={stop}',E],text=True,capture_output=True,check=True)
            return cp.stdout
          # exact selector body
          selector=dis(targets['GetSPHeroInfoIfJobIsSP'],targets['GetSPHeroInfoIfJobIsSP']+0x90)
          (O/'selector-disasm.txt').write_text(selector)
          # full instruction-aligned call inventory; objdump emits only decoded instructions
          cp=subprocess.run(['objdump','-d','-M','intel',E],text=True,capture_output=True,check=True)
          lines=cp.stdout.splitlines()
          patterns={k:re.compile(r'\bcall\s+(?:QWORD PTR )?0x?'+format(v,'x')+r'\b',re.I) for k,v in targets.items()}
          hits={k:[] for k in targets}
          for idx,line in enumerate(lines):
            for k,p in patterns.items():
              if p.search(line):
                m=re.match(r'\s*([0-9a-f]+):',line,re.I); addr=int(m.group(1),16) if m else None
                hits[k].append({'callVa':hex(addr) if addr else None,'line':line.strip(),'context':'\n'.join(lines[max(0,idx-18):min(len(lines),idx+55)])})
          # Also catch canonical objdump formatting without 0x prefix.
          for k,v in targets.items():
            needle=format(v,'x')
            if hits[k]: continue
            for idx,line in enumerate(lines):
              if '\tcall' in line and needle in line.lower():
                m=re.match(r'\s*([0-9a-f]+):',line,re.I); addr=int(m.group(1),16) if m else None
                hits[k].append({'callVa':hex(addr) if addr else None,'line':line.strip(),'context':'\n'.join(lines[max(0,idx-18):min(len(lines),idx+55)])})
          # Locate enclosing function-ish boundary from int3/prologue in each selector caller context and save focused windows.
          selector_callers=[]
          for i,h in enumerate(hits['GetSPHeroInfoIfJobIsSP']):
            if not h['callVa']: continue
            a=int(h['callVa'],16)
            w=dis(max(image,a-0x300),a+0x500)
            (O/f'selector-caller-{i}.txt').write_text(w)
            selector_callers.append({'callVa':h['callVa'],'windowFile':f'selector-caller-{i}.txt'})
          # Save focused getter caller windows only for real decoded calls; cap each getter to 20.
          getter_callers={}
          for k in ['SP_get_HPCmd_INI','SP_get_ATCmd_INI','SP_get_DFCmd_INI','SP_get_MagicDFCmd_INI']:
            getter_callers[k]=[]
            for i,h in enumerate(hits[k][:20]):
              if not h['callVa']: continue
              a=int(h['callVa'],16); fn=f'{k}-{i}.txt'; (O/fn).write_text(dis(max(image,a-0x180),a+0x300)); getter_callers[k].append({'callVa':h['callVa'],'windowFile':fn})
          result={'status':'PASS','targets':{k:hex(v) for k,v in targets.items()},'instructionAlignedCallCounts':{k:len(v) for k,v in hits.items()},'selectorCallers':selector_callers,'getterCallers':getter_callers,'selectorDisasmFile':'selector-disasm.txt','blockers':[]}
          if not selector_callers: result['status']='REVIEW'; result['blockers'].append('NO_INSTRUCTION_ALIGNED_DIRECT_CALL_TO_SP_SELECTOR')
          (O/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sp-native-xref
          path: out/sp-native-xref
          retention-days: 7
      - name: Remove temporary native xref workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-sp-native-xref.yml
          git commit -m "Remove temporary SP native xref workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
