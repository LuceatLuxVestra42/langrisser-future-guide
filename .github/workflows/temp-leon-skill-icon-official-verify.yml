name: Temporary Leon Skill Icon Official Verify

on:
  push:
    branches:
      - diag/leon-skill-icon-official-verify-20260902

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow

      - name: Verify Leon talent and skill icons against official installer 1.1.113
        shell: bash
        run: |
          set +e
          python <<'PY'
          import binascii, hashlib, json, pathlib, struct, traceback, urllib.error, urllib.request, zlib
          import UnityPy

          OUT = pathlib.Path('out/leon-skill-icons-official-verify')
          PNG = OUT / 'png'
          PNG.mkdir(parents=True, exist_ok=True)
          RESULT_PATH = OUT / 'leon-skill-icons-official-verify.json'
          VERSION = '1.1.113'
          BASE = f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}'
          ROOT_PREFIX = 'assets/gameproject/runtimeassets'
          BUNDLE_STEM = 'ui_icon_skill_abs'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          MAX_PART, MISS_BREAK = 90, 8

          targets = [
            {'kind':'talent','skillIds':[3067,3072,3077,3082],'nameCn':'传说的骑士','sourcePath':'UI/Icon/Skill_ABS/Gift_Knight.png'},
            {'kind':'normal','skillIds':[5020],'nameCn':'整军','sourcePath':'UI/Icon/Skill_ABS/Passive_BothBuf1.png'},
            {'kind':'normal','skillIds':[10324],'nameCn':'猛撞','sourcePath':'UI/Icon/Skill_ABS/Skill_SpeedUp1.png'},
            {'kind':'normal','skillIds':[5003],'nameCn':'破攻','sourcePath':'UI/Icon/Skill_ABS/Passive_BreakAtk.png'},
            {'kind':'normal','skillIds':[5007],'nameCn':'压制','sourcePath':'UI/Icon/Skill_ABS/Passive_AtkBuf1.png'},
            {'kind':'normal','skillIds':[10314],'nameCn':'气浪','sourcePath':'UI/Icon/Skill_ABS/Passive_KnightWave.png'},
            {'kind':'normal','skillIds':[10328],'nameCn':'骑士精神','sourcePath':'UI/Icon/Skill_ABS/Skill_KnightSoul.png'},
            {'kind':'normal','skillIds':[11807],'nameCn':'帝国冲锋','sourcePath':'UI/Icon/Skill_ABS/SuperBuff_Empire1.png'},
            {'kind':'normal','skillIds':[10302],'nameCn':'千骑','sourcePath':'UI/Icon/Skill_ABS/Passive_Assault.png'},
            {'kind':'direct','skillIds':[10301],'nameCn':'突击','sourcePath':'UI/Icon/Skill_ABS/Skill_KnightCrash.png'},
            {'kind':'sp','skillIds':[12527],'nameCn':'冥火碎踏','sourcePath':'UI/Icon/Skill_ABS/Skill_SPLeon1.png'},
            {'kind':'sp','skillIds':[12528],'nameCn':'青龙的真魂','sourcePath':'UI/Icon/Skill_ABS/Skill_SPLeon2.png'},
          ]

          def norm(v): return str(v).replace('\\','/').strip('/').lower()
          def sha256(data): return hashlib.sha256(data).hexdigest()
          def request(url,start=None,end=None):
            headers={'User-Agent':UA,'Accept-Encoding':'identity'}
            if start is not None: headers['Range']=f'bytes={start}-{end}'
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=90) as response: data=response.read()
            if start is not None and len(data)!=end-start+1: raise RuntimeError(f'range mismatch {len(data)} != {end-start+1}')
            return data
          def head_size(url):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD')
            try:
              with urllib.request.urlopen(req,timeout=45) as response: return int(response.headers['Content-Length'])
            except urllib.error.HTTPError as e:
              if e.code in (403,404): return None
              raise
          def zip_directory(url,total):
            tail_size=min(131072,total); tail=request(url,total-tail_size,total-1); eocd=tail.rfind(b'PK\x05\x06')
            if eocd<0: raise RuntimeError(f'EOCD missing: {url}')
            _,_,_,_,central_size,central_offset,_=struct.unpack_from('<HHHHIIH',tail,eocd+4)
            central=request(url,central_offset,central_offset+central_size-1); entries=[]; i=0
            while i+46<=len(central) and central[i:i+4]==b'PK\x01\x02':
              flags,method=struct.unpack_from('<HH',central,i+8); crc,compressed,uncompressed=struct.unpack_from('<III',central,i+16)
              fn_len,extra_len,comment_len=struct.unpack_from('<HHH',central,i+28); local_offset=struct.unpack_from('<I',central,i+42)[0]
              name_bytes=central[i+46:i+46+fn_len]; name=name_bytes.decode('utf-8' if flags&0x800 else 'cp437','replace')
              entries.append({'name':name,'method':method,'crc32':f'{crc:08X}','compressedBytes':compressed,'uncompressedBytes':uncompressed,'localOffset':local_offset})
              i+=46+fn_len+extra_len+comment_len
            return entries
          def fetch_zip_entry(url,entry):
            offset=entry['localOffset']; header=request(url,offset,offset+4095)
            if header[:4]!=b'PK\x03\x04': raise RuntimeError('local header missing')
            method=struct.unpack_from('<H',header,8)[0]; fn_len,extra_len=struct.unpack_from('<HH',header,26); start=offset+30+fn_len+extra_len
            compressed=request(url,start,start+entry['compressedBytes']-1)
            raw=compressed if method==0 else zlib.decompress(compressed,-15) if method==8 else None
            if raw is None: raise RuntimeError(f'unsupported ZIP compression {method}')
            if len(raw)!=entry['uncompressedBytes']: raise RuntimeError('uncompressed size mismatch')
            if f'{binascii.crc32(raw)&0xffffffff:08X}'!=entry['crc32']: raise RuntimeError('CRC mismatch')
            return raw
          def runtime_relative(path):
            actual,prefix=norm(path),norm(ROOT_PREFIX)
            return actual[len(prefix)+1:] if actual.startswith(prefix+'/') else None
          def reader_of(value):
            return value.deref() if hasattr(value,'deref') else value

          result={'version':1,'schemaId':'leon-skill-icon-official-verify/v1','status':'RUNNING','source':{'kind':'OFFICIAL_INSTALLER','installVersion':VERSION,'base':BASE,'unityParser':'UnityPy==1.25.3','unityContainerRootPrefix':ROOT_PREFIX},'authority':{'heroId':6,'generatedConsumer':'data/generated/hero-detail/by-id/6.json','targetUniqueIconCount':len(targets),'semanticRecomputation':False,'nameJoin':False,'idArithmetic':False},'packageCatalog':{},'coverage':{},'results':[],'blockers':[],'reviews':[]}
          exit_code=0
          try:
            expected={norm(t['sourcePath']):t for t in targets}; hits={k:[] for k in expected}; packages=[]; candidates=[]; seen=False; missing_after_seen=0
            for part in range(1,MAX_PART+1):
              package_name=f'InstallPage_{VERSION}_{part}.zip'; url=f'{BASE}/{package_name}'; total=head_size(url)
              if total is None:
                if seen:
                  missing_after_seen+=1
                  if missing_after_seen>=MISS_BREAK: break
                continue
              seen=True; missing_after_seen=0; entries=zip_directory(url,total); matches=[]
              for entry in entries:
                basename=norm(entry['name']).rsplit('/',1)[-1]
                if basename.endswith(BUNDLE_STEM+'.b'):
                  matches.append(entry); candidates.append((part,package_name,url,entry,basename))
              packages.append({'part':part,'packageName':package_name,'sizeBytes':total,'entryCount':len(entries),'matchingSkillBundleEntries':len(matches)})

            bundle_reports=[]
            for part,package_name,url,entry,basename in candidates:
              raw=fetch_zip_entry(url,entry); env=UnityPy.load(raw); container=list(env.container.items())
              report={'packagePart':part,'packageName':package_name,'bundleEntry':entry['name'],'bundleBasename':basename,'bundleBytes':len(raw),'bundleSha256':sha256(raw),'containerCount':len(container),'exactHitCount':0}
              for container_path,value in container:
                rel=runtime_relative(container_path)
                if rel not in expected: continue
                item={'packagePart':part,'packageName':package_name,'bundleEntry':entry['name'],'bundleBasename':basename,'containerPath':str(container_path).replace('\\','/'),'normalizedRuntimePath':rel}
                try:
                  reader=reader_of(value); raw_obj=reader.get_raw_data(); data=reader.read(); image=data.image.convert('RGBA'); rgba=image.tobytes(); alpha_bbox=image.getchannel('A').getbbox()
                  item.update({'objectType':getattr(getattr(reader,'type',None),'name',None),'pathId':int(getattr(reader,'path_id',0) or 0),'rawObjectBytes':len(raw_obj),'rawObjectSha256':sha256(raw_obj),'decodeStatus':'PASS','width':image.width,'height':image.height,'mode':'RGBA','rgbaSha256':sha256(rgba),'alphaBbox':list(alpha_bbox) if alpha_bbox else None,'nonEmptyAlpha':alpha_bbox is not None})
                  target=expected[rel]; png_path=PNG/f"{target['skillIds'][-1]}-{pathlib.Path(target['sourcePath']).stem}.png"
                  if not png_path.exists(): image.save(png_path); item['decodedPng']=str(png_path)
                except Exception as exc:
                  item.update({'decodeStatus':'FAIL','decodeError':f'{type(exc).__name__}: {exc}'})
                hits[rel].append(item); report['exactHitCount']+=1
              bundle_reports.append(report)

            blockers=[]; reviews=[]; rows=[]
            for rel,target in expected.items():
              row_hits=hits[rel]; raw_keys={(h.get('rawObjectBytes'),h.get('rawObjectSha256')) for h in row_hits if h.get('rawObjectSha256')}; render_keys={(h.get('width'),h.get('height'),h.get('rgbaSha256')) for h in row_hits if h.get('decodeStatus')=='PASS'}
              if not row_hits: status='NO_EXACT_HIT'; blockers.append(f"NO_EXACT_HIT:{target['sourcePath']}")
              elif any(h.get('decodeStatus')!='PASS' for h in row_hits): status='DECODE_FAIL'; blockers.append(f"DECODE_FAIL:{target['sourcePath']}")
              elif any(h.get('objectType')!='Sprite' for h in row_hits): status='NON_SPRITE_EXACT_HIT'; blockers.append(f"NON_SPRITE_EXACT_HIT:{target['sourcePath']}")
              elif any(not h.get('nonEmptyAlpha') for h in row_hits): status='EMPTY_ALPHA'; blockers.append(f"EMPTY_ALPHA:{target['sourcePath']}")
              elif len(raw_keys)==1: status='PASS_EXACT_HIT_RAW_EQUIVALENT'
              elif len(render_keys)==1: status='PASS_EXACT_HIT_RENDER_EQUIVALENT_RAW_VARIANTS'; reviews.append(f"MULTIPLE_RAW_VARIANTS_RENDER_EQUIVALENT:{target['sourcePath']}")
              else: status='AMBIGUOUS_NON_EQUIVALENT_EXACT_SOURCES'; blockers.append(f"AMBIGUOUS_NON_EQUIVALENT_EXACT_SOURCES:{target['sourcePath']}")
              rows.append({**target,'normalizedRuntimePath':rel,'status':status,'exactHitCount':len(row_hits),'hits':row_hits})
            result['packageCatalog']={'officialPackageCount':len(packages),'candidateSkillBundleCount':len(candidates),'candidateBundles':bundle_reports,'packages':packages}
            result['coverage']={'targetCount':len(rows),'exactHitTargets':sum(1 for r in rows if r['exactHitCount']>0),'decodedTargets':sum(1 for r in rows if any(h.get('decodeStatus')=='PASS' for h in r['hits']))}
            result['results']=rows; result['blockers']=blockers; result['reviews']=reviews; result['status']='PASS' if not blockers else 'BLOCKER'; exit_code=0 if not blockers else 2
          except Exception as exc:
            result['status']='DIAGNOSTIC_ERROR'; result['blockers']=[f'DIAGNOSTIC_ERROR:{type(exc).__name__}:{exc}']; result['traceback']=traceback.format_exc(); exit_code=3
          RESULT_PATH.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':result['status'],'packageCatalog':{k:v for k,v in result.get('packageCatalog',{}).items() if k!='packages' and k!='candidateBundles'},'coverage':result.get('coverage',{}),'blockers':result.get('blockers',[]),'reviews':result.get('reviews',[])},ensure_ascii=False,indent=2))
          raise SystemExit(exit_code)
          PY
          code=$?
          echo "$code" > out/leon-skill-icons-official-verify/exit-code.txt
          exit 0

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: leon-skill-icons-official-verify
          path: out/leon-skill-icons-official-verify
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-leon-skill-icon-official-verify.yml
          git commit -m "Remove temporary Leon skill icon diagnostic"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Enforce verifier status
        if: always()
        shell: bash
        run: |
          code=$(cat out/leon-skill-icons-official-verify/exit-code.txt 2>/dev/null || echo 99)
          test "$code" = "0"
