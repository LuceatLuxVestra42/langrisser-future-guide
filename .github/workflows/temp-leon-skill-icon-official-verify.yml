name: Temporary Leon Skill Icon Official Verify

on:
  push:
    branches:
      - diag/leon-skill-icon-official-verify-20260902
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow

      - name: Verify Leon talent and skill icons against official installer 1.1.113
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          python <<'PY'
          import binascii
          import hashlib
          import json
          import pathlib
          import struct
          import urllib.error
          import urllib.request
          import zlib

          import UnityPy

          OUT = pathlib.Path('out/leon-skill-icons-official-verify')
          PNG = OUT / 'png'
          PNG.mkdir(parents=True, exist_ok=True)

          VERSION = '1.1.113'
          BASE = f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}'
          ROOT_PREFIX = 'assets/gameproject/runtimeassets'
          BUNDLE_STEM = 'ui_icon_skill_abs'
          MAX_PART = 90
          MISS_BREAK = 8
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          targets = [
              {'kind':'talent','skillIds':[3067,3072,3077,3082],'nameCn':'传说的骑士','sourcePath':'UI/Icon/Skill_ABS/Gift_Knight.png'},
              {'kind':'normal','skillIds':[5020],'nameCn':'整军','sourcePath':'UI/Icon/Skill_ABS/Passive_BothBuf1.png'},
              {'kind':'normal','skillIds':[10324],'nameCn':'猛撞','sourcePath':'UI/Icon/Skill_ABS/Skill_SpeedUp1.png'},
              {'kind':'normal','skillIds':[5003],'nameCn':'破攻','sourcePath':'UI/Icon/Skill_ABS/Passive_BreakAtk.png'},
              {'kind':'normal','skillIds':[5007],'nameCn':'压制','sourcePath':'UI/Icon/Skill_ABS/Passive_AtkBuf1.png'},
              {'kind':'normal','skillIds':[10314],'nameCn':'气浪','sourcePath':'UI/Icon/Skill_ABS/Passive_KnightWave.png'},
              {'kind':'normal','skillIds':[10328],'nameCn':'骑士精神','sourcePath':'UI/Icon/Skill_ABS/Skill_KnightSoul.png'},
              {'kind':'normal','skillIds':[11807],'nameCn':'帝国冲锋','sourcePath':'UI/Icon/Skill_ABS/SuperBuff_Empire1.png'},
              {'kind':'normal','skillIds':[10302],'nameCn':'千骑','sourcePath':'UI/Icon/Skill_ABS/Passive_Assault.png'},
              {'kind':'direct','skillIds':[10301],'nameCn':'突击','sourcePath':'UI/Icon/Skill_ABS/Skill_KnightCrash.png'},
              {'kind':'sp','skillIds':[12527],'nameCn':'冥火碎踏','sourcePath':'UI/Icon/Skill_ABS/Skill_SPLeon1.png'},
              {'kind':'sp','skillIds':[12528],'nameCn':'青龙的真魂','sourcePath':'UI/Icon/Skill_ABS/Skill_SPLeon2.png'},
          ]

          def norm(v):
              return str(v).replace('\\', '/').strip('/').lower()

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def request(url, start=None, end=None):
              headers = {'User-Agent': UA, 'Accept-Encoding': 'identity'}
              if start is not None:
                  headers['Range'] = f'bytes={start}-{end}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as response:
                  data = response.read()
              if start is not None and len(data) != end - start + 1:
                  raise RuntimeError(f'range mismatch for {url}: {len(data)} != {end-start+1}')
              return data

          def head_size(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Encoding': 'identity'}, method='HEAD')
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return int(response.headers['Content-Length'])
              except urllib.error.HTTPError as error:
                  if error.code in (403, 404):
                      return None
                  raise

          def zip_directory(url, total):
              tail_size = min(131072, total)
              tail = request(url, total-tail_size, total-1)
              eocd = tail.rfind(b'PK\x05\x06')
              if eocd < 0:
                  raise RuntimeError(f'EOCD missing: {url}')
              _, _, _, _, central_size, central_offset, _ = struct.unpack_from('<HHHHIIH', tail, eocd+4)
              central = request(url, central_offset, central_offset+central_size-1)
              entries = []
              i = 0
              while i + 46 <= len(central) and central[i:i+4] == b'PK\x01\x02':
                  flags, method = struct.unpack_from('<HH', central, i+8)
                  crc, compressed, uncompressed = struct.unpack_from('<III', central, i+16)
                  fn_len, extra_len, comment_len = struct.unpack_from('<HHH', central, i+28)
                  local_offset = struct.unpack_from('<I', central, i+42)[0]
                  name_bytes = central[i+46:i+46+fn_len]
                  name = name_bytes.decode('utf-8' if flags & 0x800 else 'cp437', 'replace')
                  entries.append({'name':name,'method':method,'crc32':f'{crc:08X}','compressedBytes':compressed,'uncompressedBytes':uncompressed,'localOffset':local_offset})
                  i += 46 + fn_len + extra_len + comment_len
              return entries

          def fetch_zip_entry(url, entry):
              offset = entry['localOffset']
              header = request(url, offset, offset+4095)
              if header[:4] != b'PK\x03\x04':
                  raise RuntimeError(f"local header missing for {entry['name']}")
              method = struct.unpack_from('<H', header, 8)[0]
              fn_len, extra_len = struct.unpack_from('<HH', header, 26)
              start = offset + 30 + fn_len + extra_len
              compressed = request(url, start, start+entry['compressedBytes']-1)
              if method == 0:
                  raw = compressed
              elif method == 8:
                  raw = zlib.decompress(compressed, -15)
              else:
                  raise RuntimeError(f'unsupported compression {method}')
              if len(raw) != entry['uncompressedBytes']:
                  raise RuntimeError('uncompressed size mismatch')
              crc = f'{binascii.crc32(raw) & 0xffffffff:08X}'
              if crc != entry['crc32']:
                  raise RuntimeError('CRC mismatch')
              return raw

          def runtime_relative(path):
              actual = norm(path)
              prefix = norm(ROOT_PREFIX)
              if not actual.startswith(prefix + '/'):
                  return None
              return actual[len(prefix)+1:]

          expected = {norm(t['sourcePath']): t for t in targets}
          hits = {k: [] for k in expected}
          packages = []
          candidates = []
          seen = False
          missing_after_seen = 0

          for part in range(1, MAX_PART+1):
              package_name = f'InstallPage_{VERSION}_{part}.zip'
              url = f'{BASE}/{package_name}'
              total = head_size(url)
              if total is None:
                  if seen:
                      missing_after_seen += 1
                      if missing_after_seen >= MISS_BREAK:
                          break
                  continue
              seen = True
              missing_after_seen = 0
              entries = zip_directory(url, total)
              match_entries = []
              for entry in entries:
                  basename = norm(entry['name']).rsplit('/',1)[-1]
                  if basename.endswith(BUNDLE_STEM + '.b'):
                      match_entries.append(entry)
                      candidates.append((part, package_name, url, total, entry, basename))
              packages.append({'part':part,'packageName':package_name,'sizeBytes':total,'entryCount':len(entries),'matchingSkillBundleEntries':len(match_entries)})

          bundle_reports = []
          for part, package_name, url, total, entry, basename in candidates:
              raw = fetch_zip_entry(url, entry)
              env = UnityPy.load(raw)
              container = list(env.container.items())
              report = {'packagePart':part,'packageName':package_name,'bundleEntry':entry['name'],'bundleBasename':basename,'bundleBytes':len(raw),'bundleSha256':sha256(raw),'containerCount':len(container),'exactHitCount':0}
              for container_path, obj in container:
                  rel = runtime_relative(container_path)
                  if rel not in expected:
                      continue
                  raw_obj = obj.get_raw_data()
                  item = {'packagePart':part,'packageName':package_name,'bundleEntry':entry['name'],'bundleBasename':basename,'containerPath':str(container_path).replace('\\','/'),'normalizedRuntimePath':rel,'objectType':getattr(getattr(obj,'type',None),'name',None),'pathId':int(getattr(obj,'path_id',0) or 0),'rawObjectBytes':len(raw_obj),'rawObjectSha256':sha256(raw_obj),'decodeStatus':'NOT_ATTEMPTED'}
                  try:
                      data = obj.read()
                      image = data.image.convert('RGBA')
                      rgba = image.tobytes()
                      alpha_bbox = image.getchannel('A').getbbox()
                      item.update({'decodeStatus':'PASS','width':image.width,'height':image.height,'mode':'RGBA','rgbaSha256':sha256(rgba),'alphaBbox':list(alpha_bbox) if alpha_bbox else None,'nonEmptyAlpha':alpha_bbox is not None})
                      target = expected[rel]
                      primary_id = target['skillIds'][-1]
                      png_path = PNG / f"{primary_id}-{pathlib.Path(target['sourcePath']).stem}.png"
                      if not png_path.exists():
                          image.save(png_path)
                          item['decodedPng'] = str(png_path)
                  except Exception as exc:
                      item.update({'decodeStatus':'FAIL','decodeError':f'{type(exc).__name__}: {exc}'})
                  hits[rel].append(item)
                  report['exactHitCount'] += 1
              bundle_reports.append(report)

          results = []
          blockers = []
          reviews = []
          for rel, target in expected.items():
              row_hits = hits[rel]
              raw_keys = {(h.get('rawObjectBytes'), h.get('rawObjectSha256')) for h in row_hits}
              render_keys = {(h.get('width'),h.get('height'),h.get('rgbaSha256')) for h in row_hits if h.get('decodeStatus') == 'PASS'}
              if not row_hits:
                  status = 'NO_EXACT_HIT'
                  blockers.append(f"NO_EXACT_HIT:{target['sourcePath']}")
              elif any(h.get('objectType') != 'Sprite' for h in row_hits):
                  status = 'NON_SPRITE_EXACT_HIT'
                  blockers.append(f"NON_SPRITE_EXACT_HIT:{target['sourcePath']}")
              elif any(h.get('decodeStatus') != 'PASS' or not h.get('nonEmptyAlpha') for h in row_hits):
                  status = 'DECODE_OR_ALPHA_FAIL'
                  blockers.append(f"DECODE_OR_ALPHA_FAIL:{target['sourcePath']}")
              elif len(raw_keys) == 1:
                  status = 'PASS_EXACT_HIT_RAW_EQUIVALENT'
              elif len(render_keys) == 1:
                  status = 'PASS_EXACT_HIT_RENDER_EQUIVALENT_RAW_VARIANTS'
                  reviews.append(f"MULTIPLE_RAW_VARIANTS_RENDER_EQUIVALENT:{target['sourcePath']}")
              else:
                  status = 'AMBIGUOUS_NON_EQUIVALENT_EXACT_SOURCES'
                  blockers.append(f"AMBIGUOUS_NON_EQUIVALENT_EXACT_SOURCES:{target['sourcePath']}")
              results.append({**target,'normalizedRuntimePath':rel,'status':status,'exactHitCount':len(row_hits),'hits':row_hits})

          result = {
              'version':1,
              'schemaId':'leon-skill-icon-official-verify/v1',
              'status':'PASS' if not blockers else 'BLOCKER',
              'source':{'kind':'OFFICIAL_INSTALLER','installVersion':VERSION,'base':BASE,'unityParser':'UnityPy==1.25.3','unityContainerRootPrefix':ROOT_PREFIX},
              'authority':{'heroId':6,'generatedConsumer':'data/generated/hero-detail/by-id/6.json','targetUniqueIconCount':len(targets),'semanticRecomputation':False,'nameJoin':False,'idArithmetic':False},
              'packageCatalog':{'officialPackageCount':len(packages),'candidateSkillBundleCount':len(candidates),'packages':packages},
              'coverage':{'targetCount':len(results),'exactHitTargets':sum(1 for r in results if r['exactHitCount']>0),'decodedTargets':sum(1 for r in results if any(h.get('decodeStatus')=='PASS' for h in r['hits']))},
              'results':results,
              'blockers':blockers,
              'reviews':reviews,
          }
          (OUT / 'leon-skill-icons-official-verify.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'status':result['status'],'officialPackageCount':len(packages),'candidateSkillBundleCount':len(candidates),'targetCount':len(results),'exactHitTargets':result['coverage']['exactHitTargets'],'decodedTargets':result['coverage']['decodedTargets'],'blockers':blockers,'reviews':reviews}, ensure_ascii=False, indent=2))
          if blockers:
              raise SystemExit(2)
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leon-skill-icons-official-verify
          path: out/leon-skill-icons-official-verify
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-leon-skill-icon-official-verify.yml
          git commit -m "Remove temporary Leon skill icon diagnostic"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Fail job if verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
