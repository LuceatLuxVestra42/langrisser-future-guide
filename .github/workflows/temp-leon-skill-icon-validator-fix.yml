name: Temporary Leon Skill Icon Validator Fix

on:
  push:
    branches:
      - feat/leon-skill-icon-assets-20260902

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align frozen container-root representation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-hero-skill-icon-assets-readonly.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'manifest.source?.unityContainerRootPrefix !== "assets/gameproject/runtimeassets/"'
          new = 'manifest.source?.unityContainerRootPrefix !== "assets/gameproject/runtimeassets"'
          if text.count(old) != 1:
              raise SystemExit('container-root validator anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Commit validator fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-leon-skill-icon-validator-fix.yml
          git add scripts/validate-hero-skill-icon-assets-readonly.mjs
          git commit -m "Align Leon skill icon validator with frozen manifest"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Run changed-path Project Check
        run: node tools/project-check/cli/check.mjs --base origin/main --head HEAD

      - name: Ensure validation left no tracked mutation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
