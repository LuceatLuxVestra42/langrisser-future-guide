name: Equipment Stage 3-4 General Detail

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/equipment-stage3-4-general-detail.yml'
      - 'scripts/finalize-equipment-stage3-4-general-detail.mjs'
      - 'scripts/validate-equipment-stage3-4-general-detail.mjs'
      - 'data/contracts/equipment-stage3-4-general-detail.v1.json'
      - 'data/contracts/equipment-stage3-1-page-schema.v1.json'
      - 'data/generated/equipment_stage3_3_general_list.json'
      - 'data/generated/equipment_stage2_4_stats.json'
      - 'data/generated/equipment_stage2_5_effects.json'
      - 'data/generated/equipment_stage2_6_restrictions.json'
      - 'data/generated/equipment_stage2_7_acquisition.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Equipment Stage 3-4 general detail
        run: node scripts/finalize-equipment-stage3-4-general-detail.mjs
      - name: Validate Equipment Stage 3-4 general detail
        run: node scripts/validate-equipment-stage3-4-general-detail.mjs
      - name: Persist Stage 3-4 checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/equipment_stage3_4_general_detail.json data/validation/equipment-stage3-4-general-detail-summary.v1.json
          if git diff --cached --quiet; then
            echo "No Stage 3-4 changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 3-4 general detail"
          git push
