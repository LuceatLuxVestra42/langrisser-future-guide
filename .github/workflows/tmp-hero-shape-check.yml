name: Temporary Hero Shape Check

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-hero-shape-check.yml"

jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print Leon consumer shape
        run: |
          node - <<'NODE'
          const x = require('./data/generated/hero-detail/by-id/6.json')
          console.log('top', Object.keys(x))
          console.log('normal', Object.keys(x.normal || {}))
          console.log('skills', Object.keys(x.skills || {}))
          console.log('normal.skills', Object.keys(x.normal?.skills || {}))
          console.log('talent top', x.skills?.talent?.status)
          console.log('talent normal', x.normal?.skills?.talent?.status)
          console.log('soldierModifiers top', x.soldierModifiers?.status)
          console.log('soldierModifiers normal', x.normal?.soldierModifiers?.status)
          NODE
