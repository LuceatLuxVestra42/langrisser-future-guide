name: Temporary Apply Central Bond Stat Presentation

on:
  push:
    branches:
      - 'work/restore-central-bond-final-stats-20260914'
    paths:
      - '.github/workflows/tmp-apply-central-bond-stat-presentation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 scripts/tmp_apply_central_bond_stat_presentation.py
      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/lib/hero-detail-stage5.server.ts\nsrc/routes/heroes_.$heroId.tsx'
      - name: Commit exact frontend mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/lib/hero-detail-stage5.server.ts' 'src/routes/heroes_.$heroId.tsx'
          git commit -m "feat(hero): show central bond contribution under final jobs"
          git push origin HEAD:${{ github.ref_name }}
