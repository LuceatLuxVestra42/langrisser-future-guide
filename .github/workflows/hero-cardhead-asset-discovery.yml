name: Hero CardHead Asset Discovery

on:
  push:
    branches:
      - work/hero-cardhead-assets-20260830
    paths:
      - .github/workflows/hero-cardhead-asset-discovery.yml
      - scripts/discover-hero-cardhead-assets.py

permissions:
  contents: write

jobs:
  discover:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Discover exact CardHead bundles from frozen game updater
        shell: pwsh
        run: python scripts/discover-hero-cardhead-assets.py
      - name: Commit discovery report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/hero-cardhead-asset-discovery.v1.json
          if git diff --cached --quiet; then
            echo "No discovery changes."
          else
            git commit -m "Record Hero CardHead asset discovery"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
