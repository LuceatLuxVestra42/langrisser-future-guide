name: Project Status Stage 6-3 Refresh

on:
  push:
    branches:
      - work/project-status-stage6-3-apply-handoff
    paths:
      - 'data/contracts/project-doctor-d5-freshness.v1.json'
      - 'data/contracts/project-doctor-status-source-stage6-3-apply-handoff.v1.json'
      - 'scripts/apply-project-doctor-status-source-handoff.mjs'
      - 'scripts/validate-project-doctor-status-source-stage6-3-apply-handoff.mjs'
      - '.github/workflows/project-doctor-status-source-stage6-3-apply-handoff.yml'
      - '.github/workflows/project-status-stage6-3-refresh.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Stage 6-3 handoff self-tests
        run: node scripts/validate-project-doctor-status-source-stage6-3-apply-handoff.mjs

      - name: Explicitly refresh D5 freshness seal
        run: npm run doctor:freshness:refresh

      - name: Validate refreshed D5 seal
        run: npm run doctor:freshness:validate

      - name: Regenerate and verify Project Status
        run: |
          node scripts/build-project-status.mjs
          node scripts/build-project-status.mjs --check

      - name: Commit refreshed Doctor outputs
        shell: bash
        run: |
          PATHS=(
            data/generated/project-doctor-active-source-registry.v1.json
            data/validation/project-doctor-active-source-registry-summary.v1.json
            data/generated/project-doctor-d1-1-status.v1.json
            data/validation/project-doctor-d1-1-summary.v1.json
            data/validation/project-doctor-d1-2-summary.v1.json
            data/generated/project-doctor-d5-freshness.v1.json
            data/generated/project-status.v1.json
            PROJECT_STATUS.md
          )
          if [ -z "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo 'Stage 6-3 freshness outputs are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${PATHS[@]}"
          git commit -m 'chore: reseal Project Doctor freshness for Stage 6-3'
          git push origin HEAD:"${GITHUB_REF_NAME}"
