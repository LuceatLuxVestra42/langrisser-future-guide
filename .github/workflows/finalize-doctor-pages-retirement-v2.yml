name: Finalize Doctor Pages runtime retirement v2

on:
  push:
    branches:
      - fix/retire-doctor-pages-runtime

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: fix/retire-doctor-pages-runtime
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Restore frozen Skin asset validator inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 8ad8b238f33253f87cb903fbdf56fa563dde77c3
          git checkout 8ad8b238f33253f87cb903fbdf56fa563dde77c3 -- \
            data/contracts/skin-stage3-5-static-web-asset-map.v1.json \
            scripts/validate-skin-stage3-5-static-web-assets.mjs

      - name: Materialize current-tree deployment contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_workflow = Path('.github/workflows/project-doctor-authoritative-pages-deploy.yml').read_text()

          # Preserve the exact proven Pages-only Vite configuration, but make it tracked source.
          start_marker = "          cat > vite.config.ts <<'TS'\n"
          end_marker = "\n          TS"
          start = old_workflow.index(start_marker) + len(start_marker)
          end = old_workflow.index(end_marker, start)
          config_block = old_workflow[start:end]
          config_lines = [line[10:] if line.startswith('          ') else line for line in config_block.splitlines()]
          Path('vite.config.pages.ts').write_text('\n'.join(config_lines) + '\n')

          workflow = old_workflow
          workflow = workflow.replace('  SKIN_RUNTIME_REF: 8ad8b238f33253f87cb903fbdf56fa563dde77c3\n', '')

          def drop_step(text, start_name, next_name):
              a = text.index(f'      - name: {start_name}\n')
              b = text.index(f'      - name: {next_name}\n', a)
              return text[:a] + text[b:]

          workflow = drop_step(workflow, 'Overlay frozen Skin runtime only', 'Reconfirm frozen Hero artwork resolver freshness')
          workflow = drop_step(workflow, 'Compose admission-aware GitHub Pages static build config', 'Build authoritative static candidate')
          workflow = workflow.replace('      - name: Compose latest product with frozen Skin presentation\n', '      - name: Validate current frozen product inputs\n')
          workflow = workflow.replace('          node scripts/project-doctor-compose-authoritative-pages-runtime.mjs\n', '          node scripts/validate-skin-stage3-5-static-assets-readonly.mjs\n')
          workflow = workflow.replace(
              '      - name: Build authoritative static candidate\n        run: bun run build\n',
              '      - name: Build authoritative static candidate\n        run: |\n          node scripts/build-equipment-name-kr-presentation.mjs\n          bunx vite build --config vite.config.pages.ts\n',
          )
          workflow = workflow.replace('            "skinRuntimeRef": "${SKIN_RUNTIME_REF}",\n', '            "skinSource": "CURRENT_REPOSITORY_FROZEN_CONSUMER",\n')
          workflow = workflow.replace('.github/workflows/project-doctor-authoritative-pages-deploy.yml', '.github/workflows/authoritative-pages-deploy.yml')
          # Avoid embedding GitHub expression syntax in this migration workflow: remove the env line structurally.
          workflow = '\n'.join(line for line in workflow.splitlines() if 'EXPECTED_SKIN_REF:' not in line) + '\n'
          workflow = workflow.replace(
              'run_hosted_validator project-doctor-authoritative-pages \\\n            node scripts/project-doctor-validate-authoritative-pages-hosted.mjs',
              'run_hosted_validator authoritative-pages \\\n            node scripts/validate-authoritative-pages-hosted.mjs',
          )
          workflow = workflow.replace(
              "          printf 'skinRuntimeRef=%s\\n' \"$SKIN_RUNTIME_REF\"\n",
              "          printf 'skinSource=%s\\n' 'CURRENT_REPOSITORY_FROZEN_CONSUMER'\n",
          )

          forbidden = [
              'SKIN_RUNTIME_REF',
              'project-doctor-compose-authoritative-pages-runtime',
              'project-doctor-validate-authoritative-pages-hosted',
              'project-doctor-authoritative-pages-deploy.yml',
          ]
          for token in forbidden:
              leftovers = [line for line in workflow.splitlines() if token in line]
              if leftovers:
                  raise SystemExit(f'active deployment workflow still contains retired token {token}: {leftovers}')
          Path('.github/workflows/authoritative-pages-deploy.yml').write_text(workflow)

          # Preserve proven HTTP checks, replacing only the historical overlay identity requirement.
          hosted = Path('scripts/project-doctor-validate-authoritative-pages-hosted.mjs').read_text()
          hosted = hosted.replace('const expectedSkinRef = process.env.EXPECTED_SKIN_REF;\n', '')
          hosted = hosted.replace('if (!expectedSourceSha || !expectedSkinRef) {', 'if (!expectedSourceSha) {')
          hosted = hosted.replace('EXPECTED_SOURCE_SHA and EXPECTED_SKIN_REF are required', 'EXPECTED_SOURCE_SHA is required')
          hosted = hosted.replace(
              'candidate.sourceSha === expectedSourceSha && candidate.skinRuntimeRef === expectedSkinRef',
              'candidate.sourceSha === expectedSourceSha && candidate.skinPngCount === 540',
          )
          hosted = hosted.replace('skinRuntimeRef: expectedSkinRef,', 'skinSource: "CURRENT_REPOSITORY_FROZEN_CONSUMER",')
          if 'expectedSkinRef' in hosted or 'EXPECTED_SKIN_REF' in hosted:
              raise SystemExit('generic hosted validator still depends on historical Skin ref')
          Path('scripts/validate-authoritative-pages-hosted.mjs').write_text(hosted)

          # Independent read-only Skin asset owner validator: no write path, no new relation inference.
          Path('scripts/validate-skin-stage3-5-static-assets-readonly.mjs').write_text('''import fs from "node:fs";\nimport { evaluateStaticWebAssetManifest } from "./validate-skin-stage3-5-static-web-assets.mjs";\n\nconst readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));\nconst contract = readJson("data/contracts/skin-stage3-5-static-web-asset-map.v1.json");\nconst manifest = readJson("data/generated/skin-stage3-5-static-web-asset-map.v1.json");\nconst relation = readJson("data/generated/skin-stage2-3-bidirectional-relation.v1.json");\nconst frozenValidation = readJson("data/validation/skin-stage3-5-static-web-asset-map.v1.json");\nconst result = evaluateStaticWebAssetManifest(manifest, relation, ".", contract);\nif (!result.finalReady || result.counts.acceptedSkinCount !== 540 || result.counts.missingFileCount !== 0 || result.counts.hashMismatchCount !== 0 || result.counts.unexpectedFileCount !== 0) {\n  throw new Error(`Frozen Skin static asset validation failed: ${JSON.stringify(result.counts)}`);\n}\nif (frozenValidation.finalReady !== true || frozenValidation.status !== result.status || JSON.stringify(frozenValidation.counts) !== JSON.stringify(result.counts)) {\n  throw new Error("Frozen Skin validation checkpoint no longer matches current repository bytes.");\n}\nconsole.log(JSON.stringify({ status: "PASS_SKIN_STATIC_ASSETS_READONLY", finalReady: true, skinCount: 540, repositoryMutation: false }, null, 2));\n''')

          owners_path = Path('tools/project-check/contracts/owners.v1.json')
          owners = owners_path.read_text()
          old_owner = '{"id":"skin-assets","validators":[],"manualReview":"Skin asset ownership remains manual until authoritative asset evidence and an independent final owner are admitted."}'
          new_owner = '{"id":"skin-assets","validators":["skin-static-assets-readonly"]}'
          if old_owner not in owners:
              raise SystemExit('skin-assets owner anchor changed')
          owners = owners.replace(old_owner, new_owner, 1)

          route_anchor = '".github/workflows/project-doctor-authoritative-pages-deploy.yml","scripts/project-doctor-validate-authoritative-pages-hosted.mjs"'
          route_replacement = '".github/workflows/project-doctor-authoritative-pages-deploy.yml","scripts/project-doctor-validate-authoritative-pages-hosted.mjs","scripts/project-doctor-compose-authoritative-pages-runtime.mjs",".github/workflows/authoritative-pages-deploy.yml","scripts/validate-authoritative-pages-hosted.mjs"'
          if route_anchor not in owners:
              raise SystemExit('route-hosted owner anchor changed')
          owners = owners.replace(route_anchor, route_replacement, 1)

          skin_anchor = '"patterns":["data/generated/skin-stage3-*","data/validation/skin-stage3-*","data/contracts/skin-stage3-*","data/evidence/skin-stage3-*","scripts/*skin-stage3*",".github/workflows/skin-stage3-*"],'
          skin_replacement = '"patterns":["public/images/skins/**","data/generated/skin-stage3-*","data/validation/skin-stage3-*","data/contracts/skin-stage3-*","data/evidence/skin-stage3-*","scripts/*skin-stage3*",".github/workflows/skin-stage3-*"],'
          if skin_anchor not in owners:
              raise SystemExit('skin-assets path rule anchor changed')
          owners = owners.replace(skin_anchor, skin_replacement, 1)

          hero_anchor = '"patterns":["src/routes/heroes*.tsx","src/lib/hero-*.ts","src/lib/hero-*.tsx"],'
          hero_replacement = '"patterns":["src/routes/heroes*.tsx","src/lib/hero-*.ts","src/lib/hero-*.tsx","src/lib/skin-detail.server.ts"],'
          if hero_anchor not in owners:
              raise SystemExit('hero frontend path rule anchor changed')
          owners = owners.replace(hero_anchor, hero_replacement, 1)
          owners_path.write_text(owners)

          validators_path = Path('tools/project-check/contracts/validators.v1.json')
          validators = validators_path.read_text()
          marker = '''    {\n      "id": "equipment-assets",'''
          insertion = '''    {\n      "id": "skin-static-assets-readonly",\n      "phase": 30,\n      "executable": "node",\n      "args": ["scripts/validate-skin-stage3-5-static-assets-readonly.mjs"],\n      "owner": "skin-assets",\n      "coverage": "Read-only parity of the frozen Stage 3-5 Skin static manifest, 540 repository PNG bytes, Stage 2 relation, and frozen validation checkpoint."\n    },\n'''
          if marker not in validators:
              raise SystemExit('validator catalog anchor changed')
          validators = validators.replace(marker, insertion + marker, 1)
          validators_path.write_text(validators)
          PY

          git rm \
            .github/workflows/project-doctor-authoritative-pages-deploy.yml \
            scripts/project-doctor-compose-authoritative-pages-runtime.mjs \
            scripts/project-doctor-validate-authoritative-pages-hosted.mjs
          git rm .github/workflows/finalize-doctor-pages-retirement-v2.yml

      - name: Validate retirement boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-skin-stage3-5-static-assets-readonly.mjs
          node scripts/validate-skin-stage3-6-hero-detail-consumer.mjs
          node tools/project-check/test/project-check-self-test.mjs
          node tools/route-hosted-qa/test/route-hosted-qa-self-test.mjs
          test "$(find public/images/skins -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = '540'
          test ! -e .github/workflows/project-doctor-authoritative-pages-deploy.yml
          test ! -e scripts/project-doctor-compose-authoritative-pages-runtime.mjs
          test ! -e scripts/project-doctor-validate-authoritative-pages-hosted.mjs
          grep -q 'CURRENT_REPOSITORY_FROZEN_CONSUMER' .github/workflows/authoritative-pages-deploy.yml
          grep -q 'vite.config.pages.ts' .github/workflows/authoritative-pages-deploy.yml
          if grep -Eq 'SKIN_RUNTIME_REF|project-doctor-compose-authoritative-pages-runtime|project-doctor-validate-authoritative-pages-hosted' .github/workflows/authoritative-pages-deploy.yml scripts/validate-authoritative-pages-hosted.mjs; then
            echo 'retired Doctor runtime token remains in active deployment path' >&2
            exit 1
          fi
          git diff --check

      - name: Commit retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retire Project Doctor production Pages runtime [skip ci]'
          git push origin HEAD:fix/retire-doctor-pages-runtime
