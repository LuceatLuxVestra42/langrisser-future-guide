name: Temporary A6 Bundle Manifest Probe

on:
  push:
    branches:
      - diag/awakening-icon-a6-1113-coverage-20260910

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Unity parser
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3
      - name: Probe official installer bundle manifest
        shell: bash
        run: |
          mkdir -p out/awakening-icon-a6-manifest-probe
          python <<'PY'
          import binascii, hashlib, json, pathlib, struct, urllib.request, zlib, traceback
          import UnityPy

          OUT=pathlib.Path('out/awakening-icon-a6-manifest-probe')
          VERSION='1.1.113'
          PACKAGE='InstallPage_1.1.113_17.zip'
          URL=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}/{PACKAGE}'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          WANTED=[
            'Client/Langrisser_Data/StreamingAssets/ExportAssetBundle/StandaloneWindows64',
            'Client/Langrisser_Data/StreamingAssets/Config/IncludeBundleFiles.txt',
            'Client/Langrisser_Data/StreamingAssets/Config/ExcludeBundleFilesFromApk.txt',
            'Client/Langrisser_Data/StreamingAssets/Config/ExcludeBundleFilesFromHap.txt',
            'Client/Langrisser_Data/StreamingAssets/Config/ExcludeBundleFilesFromIpa.txt',
          ]
          TARGETS=[
            'assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_super15.png',
            'assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_super140.png',
            'assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_captainbaby_3.png',
            'skill_super15','skill_super140','skill_captainbaby_3'
          ]
          def sha(b): return hashlib.sha256(b).hexdigest()
          def req(start=None,end=None):
            h={'User-Agent':UA,'Accept-Encoding':'identity'}
            if start is not None: h['Range']=f'bytes={start}-{end}'
            r=urllib.request.Request(URL,headers=h)
            with urllib.request.urlopen(r,timeout=60) as x: data=x.read()
            if start is not None and len(data)!=end-start+1: raise RuntimeError('range mismatch')
            return data
          def size():
            r=urllib.request.Request(URL,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD')
            with urllib.request.urlopen(r,timeout=30) as x: return int(x.headers['Content-Length'])
          def entries(total):
            n=min(131072,total); tail=req(total-n,total-1); p=tail.rfind(b'PK\x05\x06')
            if p<0: raise RuntimeError('EOCD missing')
            _,_,_,_,cs,co,_=struct.unpack_from('<HHHHIIH',tail,p+4); c=req(co,co+cs-1)
            out=[]; i=0
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              flags,method=struct.unpack_from('<HH',c,i+8); crc,comp,uncomp=struct.unpack_from('<III',c,i+16)
              fl,el,cl=struct.unpack_from('<HHH',c,i+28); off=struct.unpack_from('<I',c,i+42)[0]
              name=c[i+46:i+46+fl].decode('utf-8' if flags&0x800 else 'cp437','replace')
              out.append({'name':name,'method':method,'crc32':f'{crc:08X}','compressedBytes':comp,'uncompressedBytes':uncomp,'localOffset':off})
              i+=46+fl+el+cl
            return out
          def fetch(e):
            off=e['localOffset']; hdr=req(off,off+4095); method=struct.unpack_from('<H',hdr,8)[0]; fl,el=struct.unpack_from('<HH',hdr,26)
            start=off+30+fl+el; comp=req(start,start+e['compressedBytes']-1)
            raw=comp if method==0 else zlib.decompress(comp,-15) if method==8 else None
            if raw is None: raise RuntimeError(f'unsupported zip method {method}')
            if len(raw)!=e['uncompressedBytes']: raise RuntimeError('size mismatch')
            if f'{binascii.crc32(raw)&0xffffffff:08X}'!=e['crc32']: raise RuntimeError('crc mismatch')
            return raw
          def ascii_strings(b,minlen=4):
            out=[]; buf=[]
            for x in b:
              if 32<=x<=126: buf.append(chr(x))
              else:
                if len(buf)>=minlen: out.append(''.join(buf))
                buf=[]
            if len(buf)>=minlen: out.append(''.join(buf))
            return out
          result={'version':1,'source':{'kind':'OFFICIAL_INSTALLER','installVersion':VERSION,'package':PACKAGE},'files':[],'manifest':{},'targetSearch':[],'errors':[]}
          try:
            idx={e['name']:e for e in entries(size())}
            raws={}
            for name in WANTED:
              e=idx.get(name)
              if not e: continue
              raw=fetch(e); raws[name]=raw
              suffix=name.rsplit('/',1)[-1]
              (OUT/suffix).write_bytes(raw)
              result['files'].append({'name':name,'bytes':len(raw),'sha256':sha(raw)})
              if suffix.endswith('.txt'):
                try: (OUT/(suffix+'.utf8.txt')).write_text(raw.decode('utf-8'),encoding='utf-8')
                except Exception: pass
            mname=WANTED[0]; raw=raws[mname]
            strings=ascii_strings(raw)
            (OUT/'StandaloneWindows64.strings.txt').write_text('\n'.join(strings)+'\n',encoding='utf-8')
            env=UnityPy.load(raw)
            objs=[]; texts=[]
            for reader in env.objects:
              typ=getattr(getattr(reader,'type',None),'name',None)
              rec={'type':typ,'pathId':int(getattr(reader,'path_id',0) or 0)}
              try:
                rb=reader.get_raw_data(); rec['rawBytes']=len(rb); rec['rawSha256']=sha(rb)
              except Exception as exc: rec['rawError']=f'{type(exc).__name__}:{exc}'
              try:
                tree=reader.read_typetree(); rec['typetree']=tree
                texts.append(json.dumps(tree,ensure_ascii=False,default=str))
              except Exception as exc: rec['typetreeError']=f'{type(exc).__name__}:{exc}'
              objs.append(rec)
            result['manifest']={'rawBytes':len(raw),'rawSha256':sha(raw),'objectCount':len(objs),'objects':objs,'asciiStringCount':len(strings)}
            hay='\n'.join(strings+texts).lower()
            for t in TARGETS:
              result['targetSearch'].append({'needle':t,'found':t.lower() in hay})
            (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
            print(json.dumps({'files':result['files'],'manifestObjectTypes':[o['type'] for o in objs],'targetSearch':result['targetSearch']},ensure_ascii=False,indent=2))
          except Exception as exc:
            result['errors'].append({'type':type(exc).__name__,'message':str(exc),'traceback':traceback.format_exc()})
            (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
            raise
          PY
      - name: Upload manifest probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awakening-icon-a6-manifest-probe
          path: out/awakening-icon-a6-manifest-probe
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-awakening-icon-a6-manifest-probe.yml
          git commit -m "Remove temporary A6 manifest probe"
          git push origin HEAD:${GITHUB_REF_NAME}
