name: Equipment Acquisition Analysis

on:
  push:
    paths:
      - '.github/workflows/equipment-acquisition-analysis.yml'
      - 'scripts/analyze-equipment-acquisition.mjs'
      - 'data/configdata/ConfigDataEquipmentInfo.json'
      - 'data/generated/equipment_stage2_6_restrictions.json'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze equipment acquisition paths
        run: node scripts/analyze-equipment-acquisition.mjs
      - name: Persist acquisition analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/equipment_acquisition_path_analysis.json
          if git diff --cached --quiet; then
            echo "No acquisition analysis changes"
            exit 0
          fi
          git commit -m "Freeze equipment acquisition path analysis"
          git push
