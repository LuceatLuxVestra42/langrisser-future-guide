name: Hero portrait Stage 4-2C export PGUpdate

on:
  workflow_dispatch:
  push:
    branches:
      - work/hero-portrait-stage4-2c-current-unity-source-proof
    paths:
      - .github/workflows/hero-portrait-stage4-2c-export-pgupdate.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact PGUPDATE.EXE resource
        shell: python
        run: |
          import hashlib, urllib.request
          url='https://mhmnzdownload.zlongame.com/MHMNZ/Clientdown/DownLoad-MZ-PC.exe'
          off=293352148; size=3528640
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Range':f'bytes={off}-{off+size-1}'})
          with urllib.request.urlopen(req,timeout=60) as r:
              data=r.read(size)
          assert len(data)==size, (len(data),size)
          sha=hashlib.sha256(data).hexdigest()
          assert sha=='9f19b2712a4f589291b5c232ee0634538951e98f85ad99525990a2959db53c86', sha
          open('PGUPDATE.EXE','wb').write(data)
          print(len(data), sha)
      - uses: actions/upload-artifact@v4
        with:
          name: hero-stage4-2c-pgupdate-exact
          path: PGUPDATE.EXE
          if-no-files-found: error
          retention-days: 1
