name: Hero portrait Stage 4-1B bulk map

on:
  push:
    branches:
      - work/hero-portrait-stage4-1b-structured-drive-bulk-mapping
    paths:
      - scripts/hero_portrait_stage4_1b_bulk_map.py
      - scripts/hero_portrait_stage4_1b_drive_crawl.py
      - .github/workflows/hero-portrait-stage4-1b-bulk-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Drive folder parser
        run: python -m pip install 'gdown==6.1.0'
      - name: Crawl only Hero skin paths
        run: python scripts/hero_portrait_stage4_1b_drive_crawl.py --out-dir /tmp/hero-drive --workers 12
      - name: Apply frozen mapping bridge
        run: python scripts/hero_portrait_stage4_1b_bulk_map.py --drive-dir /tmp/hero-drive --repo-root .
      - name: Commit generated mapping checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/hero-portrait-stage4-1b-structured-drive-bulk-mapping.v1.json data/checkpoints/hero-portrait-stage4-1b-structured-drive-bulk-mapping.v1.json data/validation/hero-portrait-stage4-1b-structured-drive-bulk-mapping-summary.v1.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Apply Hero portrait Stage 4-1B Drive bulk mapping'
            git push
          fi
