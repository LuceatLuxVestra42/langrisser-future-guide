name: Hero portrait Stage 4-1B bulk map

on:
  push:
    branches:
      - work/hero-portrait-stage4-1-drive-mapping-bridge
    paths:
      - scripts/hero_portrait_stage4_1b_bulk_map.py
      - .github/workflows/hero-portrait-stage4-1b-bulk-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive folder enumerator
        run: python -m pip install 'gdown==6.1.0'
      - name: Enumerate Drive rarity trees without image downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hero-drive
          gdown 'https://drive.google.com/drive/folders/1_ohdOz7yowi98AE7MuyORMAFkxeGk5GV' --folder --json --quiet > /tmp/hero-drive/LLR.json
          gdown 'https://drive.google.com/drive/folders/1LZou2oXpeOwtt2uBHWpesKN4uyMUGoOe' --folder --json --quiet > /tmp/hero-drive/SSR.json
          gdown 'https://drive.google.com/drive/folders/15Z_wf0wrfX3Bn56WU_Y7vqDvPcS_i8MN' --folder --json --quiet > /tmp/hero-drive/SR.json
          gdown 'https://drive.google.com/drive/folders/1KIqnv-LEEO2RBYzdF1dr5oGUbfriUPgG' --folder --json --quiet > /tmp/hero-drive/R.json
          gdown 'https://drive.google.com/drive/folders/1ShOmvsheoRWl9yeneaMRoXXid6wIrGhX' --folder --json --quiet > /tmp/hero-drive/N.json
      - name: Apply frozen mapping bridge
        run: python scripts/hero_portrait_stage4_1b_bulk_map.py --drive-dir /tmp/hero-drive --repo-root .
      - name: Commit generated mapping checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/hero-portrait-stage4-1b-structured-drive-bulk-mapping.v1.json data/checkpoints/hero-portrait-stage4-1b-structured-drive-bulk-mapping.v1.json data/validation/hero-portrait-stage4-1b-structured-drive-bulk-mapping-summary.v1.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Apply Hero portrait Stage 4-1B Drive bulk mapping'
            git push
          fi
