name: Soldier Training Material Assets A3

on:
  push:
    branches:
      - work/soldier-training-material-assets-stage1
    paths:
      - data/contracts/soldier-training-material-asset-intake.v1.json
      - data/generated/soldier-training-material-assets-a2-source-census.v1.json
      - data/validation/soldier-training-material-assets-a2.v1.json
      - tools/asset-intake/core/contract-v1.mjs
      - tools/asset-intake/core/engine-v1.mjs
      - tools/asset-intake/adapters/soldier-training-material-v1.mjs
      - scripts/freeze-soldier-training-material-assets-a3.mjs
      - .github/workflows/soldier-training-material-assets-a3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shared Asset Intake contract
        run: node tools/asset-intake/cli/validate-contract-v1.mjs

      - name: Freeze and validate A3 representative byte proof
        run: node scripts/freeze-soldier-training-material-assets-a3.mjs

      - name: Commit deterministic A3 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/evidence/soldier-training-material-assets-a3-representatives.v1.json \
            data/contracts/soldier-training-material-asset-intake-a3.v1.json \
            data/validation/soldier-training-material-assets-a3.v1.json \
            docs/checkpoints/soldier-training-material-assets-a3.md
          if git diff --cached --quiet; then
            echo 'Soldier training material A3 outputs already current.'
          else
            git commit -m 'Freeze Soldier training material representative byte proof A3 [skip ci]'
            git push origin HEAD:work/soldier-training-material-assets-stage1
          fi
