name: P1 Equipment Hosted Summary Refresh (temporary)

on:
  push:
    branches:
      - maintenance/p1-equipment-persistence-hardening
    paths:
      - '.github/workflows/p1-equipment-hosted-summary-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: maintenance/p1-equipment-persistence-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate Hosted-owned summary with fresh Browser evidence
        env:
          HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/
        run: node scripts/validate-equipment-image-stage3-hosted.mjs

      - name: Persist Hosted-owned freeze on P1 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/validation/equipment-image-stage3-hosted-qa-summary.v1.json \
            data/checkpoints/equipment-image-stage3-final.v1.json
          if git diff --cached --quiet; then
            echo 'Hosted-owned frozen evidence is already current.'
            exit 0
          fi
          git commit -m 'Refresh P1 Equipment Hosted summary'
          git push origin HEAD:maintenance/p1-equipment-persistence-hardening
