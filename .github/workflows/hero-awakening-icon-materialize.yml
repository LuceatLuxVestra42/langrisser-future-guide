name: Hero Awakening Icon Materialize

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-materialization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen A7-1 materialization read-only
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/materialize-hero-awakening-icon-assets.py --validate-frozen-only
          after="$(git status --porcelain=v1 --untracked-files=all)"
          test "$before" = "$after"
