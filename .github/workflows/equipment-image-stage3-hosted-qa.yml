name: Equipment Image Stage 3 Hosted QA

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/equipment-image-stage3-hosted-qa.yml'
      - 'public/equipment-image-stage3-ready.json'
      - 'public/images/equipment/**'
      - 'src/lib/equipment-image-assets.ts'
      - 'src/routes/equipment.tsx'
      - 'src/routes/equipment_.exclusive.tsx'
      - 'src/routes/equipment_.$equipmentId.tsx'
      - 'scripts/validate-equipment-image-stage3-hosted.mjs'
      - 'data/validation/equipment-image-stage3-frontend-summary.v1.json'
      - 'data/validation/equipment-image-stage3-hosted-qa-summary.v1.json'
      - 'data/checkpoints/equipment-image-stage3-final.v1.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/equipment-image-stage3-hosted-qa.yml'
      - 'scripts/validate-equipment-image-stage3-hosted.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equipment-image-stage3-hosted-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate GitHub Pages deployment and Equipment routes/assets
        env:
          HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/
        run: node scripts/validate-equipment-image-stage3-hosted.mjs

      - name: Report downstream Browser/UI freshness
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('data/validation/equipment-image-stage3-hosted-qa-summary.v1.json', 'utf8'));
          if (summary.status !== 'PASS_EQUIPMENT_IMAGE_STAGE3_HOSTED_QA') {
            throw new Error(`Hosted QA status is not PASS: ${summary.status}`);
          }
          if (summary.gates?.preflight !== 'PASS' || summary.gates?.build !== 'PASS' || summary.gates?.deploymentHosted !== 'PASS') {
            throw new Error(`Hosted-owned gate is not PASS: ${JSON.stringify(summary.gates)}`);
          }
          if (summary.semanticStageReopened !== false) {
            throw new Error('Hosted QA unexpectedly reopened the semantic stage.');
          }
          console.log(`Hosted QA PASS; Browser/UI freshness=${summary.browserUiFreshness?.status ?? 'UNKNOWN'}`);
          if (summary.browserUiFreshness?.status !== 'PASS_FRESH_BROWSER_UI_EVIDENCE') {
            console.log('Browser/UI evidence requires revalidation in the Browser/UI owning layer; Hosted QA remains PASS.');
          }
          NODE

      - name: Prove routine Hosted QA is repository read-only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- data/validation/equipment-image-stage3-hosted-qa-summary.v1.json data/checkpoints/equipment-image-stage3-final.v1.json
          git diff --exit-code -- .
          echo 'Hosted QA completed without repository persistence.'
