name: Soldier Frontend Stage 3 Drive Index

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - '.github/workflows/soldier-frontend-stage3-drive-index.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted ConfigDataSoldierInfo asset fields
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('data/configdata/ConfigDataSoldierInfo.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.records??raw.data??raw.Data??Object.values(raw).find(Array.isArray));
          if(!Array.isArray(rows)) throw new Error('ConfigDataSoldierInfo rows not found');
          const ids=new Set([100,200,300,303,400,407,500,503,600,617,619,625,800,1000,1100,1102,1108,136,1039,102,105,5115]);
          const selected=rows.filter(r=>ids.has(Number(r.ID??r.Id??r.id)));
          console.log(`ROW_COUNT=${rows.length} SELECTED=${selected.length}`);
          console.log(`KEYS=${JSON.stringify([...new Set(selected.flatMap(r=>Object.keys(r)))])}`);
          const pick=r=>Object.fromEntries(Object.entries(r).filter(([k,v])=>/icon|image|img|model|skin|resource|res|avatar|portrait|head|show|art/i.test(k)||['ID','Name','SoldierName','Army','ArmyType','MoveType','BF_MovePoint'].includes(k)));
          for(const r of selected) console.log(`REC ${JSON.stringify({id:Number(r.ID??r.Id??r.id),fields:pick(r)})}`);
          NODE
