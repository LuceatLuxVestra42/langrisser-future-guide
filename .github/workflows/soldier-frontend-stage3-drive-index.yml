name: Soldier Frontend Stage 3 Drive Index

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - '.github/workflows/soldier-frontend-stage3-drive-index.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Probe public Drive folder payload
        run: |
          node <<'NODE'
          const folders = {
            I: '1Br-tmzvjc4xo7baBaiziwweGyU75H-8x',
            II: '15a3Rc2w2i3Zkf32LZwB4xT8Ldaej0yXl',
            III: '17586qKXHeDoCZ13E6bmrmgMRtMUk9fzQ',
          };
          for (const [tier, id] of Object.entries(folders)) {
            const url = `https://drive.google.com/drive/folders/${id}`;
            const res = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0' }, redirect: 'follow' });
            const text = await res.text();
            const entries = [...text.matchAll(/aria-label="([^"]+) Shared folder"[\s\S]{0,900}?data-id="([^"]+)"/g)]
              .map((m) => ({ name: m[1], id: m[2] }));
            const unique = [...new Map(entries.map((x) => [x.id, x])).values()];
            console.log(`DRIVE_TIER=${tier} status=${res.status} entries=${unique.length}`);
            console.log(JSON.stringify(unique.slice(0, 5)));
          }
          NODE
      - name: Probe Korean legacy sheet lower-tier records
        run: |
          node <<'NODE'
          const url = 'https://raw.githubusercontent.com/redpanda7301/langrisser/a85bba49dcf073563e7366dc18e96b7ba67c2ae3/troop/%EC%B0%BD%EB%B3%91.html';
          const res = await fetch(url);
          const text = await res.text();
          console.log(`LEGACY status=${res.status} bytes=${text.length}`);
          for (const needle of ['창병','정예 창병','바위 골렘','중장 창병','대지 골렘']) {
            let from = 0;
            let seen = 0;
            while (seen < 2) {
              const i = text.indexOf(needle, from);
              if (i < 0) break;
              console.log(`LEGACY needle=${needle} index=${i}`);
              console.log(text.slice(Math.max(0, i - 650), i + 900).replace(/\n/g, ' '));
              from = i + needle.length;
              seen += 1;
            }
          }
          NODE
