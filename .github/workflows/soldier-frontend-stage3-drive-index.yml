name: Soldier Frontend Stage 3 Drive Index

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - '.github/workflows/soldier-frontend-stage3-drive-index.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect missing Drive portrait folder
        run: |
          node <<'NODE'
          const id='1nUe6vHORKmU1w8rDKvFieRJm3j1KHty_';
          const res=await fetch(`https://drive.google.com/drive/folders/${id}`,{headers:{'user-agent':'Mozilla/5.0'}});
          const text=await res.text();
          console.log(`status=${res.status} bytes=${text.length}`);
          const labels=[...text.matchAll(/aria-label="([^"]+)"/g)].map(m=>m[1]);
          const interesting=[...new Set(labels.filter(x=>/png|jpg|jpeg|webp|default|shared file|image/i.test(x)))];
          console.log(`INTERESTING_LABELS ${JSON.stringify(interesting.slice(0,100))}`);
          const ids=[...text.matchAll(/data-id="([^"]+)"/g)].map(m=>m[1]);
          console.log(`DATA_ID_COUNT=${new Set(ids).size}`);
          for(const needle of ['Default.png','.png','.webp','.jpg']){
            const i=text.indexOf(needle);
            console.log(`NEEDLE=${needle} index=${i}`);
            if(i>=0) console.log(text.slice(Math.max(0,i-1000),i+1500).replace(/\n/g,' '));
          }
          NODE
