name: Soldier Frontend Stage 3 Drive Index

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - '.github/workflows/soldier-frontend-stage3-drive-index.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect representative legacy stat markup
        run: |
          node <<'NODE'
          const url='https://raw.githubusercontent.com/redpanda7301/langrisser/a85bba49dcf073563e7366dc18e96b7ba67c2ae3/troop/%EC%B0%BD%EB%B3%91.html';
          const text=await (await fetch(url)).text();
          const start=text.indexOf('11_정예창병.webp');
          const next=text.indexOf('<img class="filterDiv', start+1);
          const chunk=text.slice(start, next>start?next:start+15000);
          console.log(`start=${start} next=${next} chunk=${chunk.length}`);
          for(const label of ['사거리','이동거리','생명','공격','방어','마방']){
            const i=chunk.indexOf(`<!--${label}-->`);
            console.log(`LABEL=${label} index=${i}`);
            if(i>=0) console.log(chunk.slice(i,i+500).replace(/\n/g,' '));
          }
          NODE
