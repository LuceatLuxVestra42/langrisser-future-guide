name: Soldier Frontend Stage 3 Drive Index

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - '.github/workflows/soldier-frontend-stage3-drive-index.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Match legacy Soldier records to canonical combat signatures
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const canonical = JSON.parse(fs.readFileSync('data/generated/soldier-detail-stage5-2.v1.json','utf8')).records;
          const pages = [
            {page:'보병', direct:'INFANTRY'},
            {page:'창병', direct:'LANCER'},
            {page:'기병', direct:'CAVALRY'},
            {page:'비병', subgroup:{1:'FLYING',2:'WATER'}},
            {page:'궁병', subgroup:{1:'ARCHER',2:'ASSASSIN'}},
            {page:'승병', subgroup:{1:'MAGE',2:'HOLY',3:'DEMON'}},
          ];
          const legacy = [];
          const statValue = (chunk, label) => {
            const re = new RegExp(`<!--${label}-->[\\s\\S]{0,420}?<td>\\s*([0-9]+)\\s*<\\/td>`);
            const m = chunk.match(re);
            return m ? Number(m[1]) : null;
          };
          for (const def of pages) {
            const base = `https://raw.githubusercontent.com/redpanda7301/langrisser/a85bba49dcf073563e7366dc18e96b7ba67c2ae3/troop/${encodeURIComponent(def.page)}.html`;
            const res = await fetch(base);
            const text = await res.text();
            if (!res.ok) throw new Error(`${def.page} fetch ${res.status}`);
            const headings = [...text.matchAll(/<div class="view_title">([123])티어 용병<\/div>/g)].map(m => ({tier:Number(m[1]), index:m.index}));
            const imageMatches = [...text.matchAll(/<img class="filterDiv [^"]+"[^>]*src="(\.\.\/img\/troop\/[^\"]+\/병종\/(\d+)_([^\"]+\.webp))"[^>]*>/g)];
            for (let idx=0; idx<imageMatches.length; idx++) {
              const m = imageMatches[idx];
              const h = headings.filter(h => h.index < m.index).at(-1);
              if (!h || h.tier > 3) continue;
              let body = m[3].replace(/\.webp$/,'');
              let subgroup = null;
              const sm = body.match(/^(\d+)_(.+)$/);
              if (sm) { subgroup = Number(sm[1]); body = sm[2]; }
              const armyType = def.direct ?? (def.subgroup ? def.subgroup[subgroup] : null) ?? null;
              const end = imageMatches[idx+1]?.index ?? Math.min(text.length, m.index + 20000);
              const chunk = text.slice(m.index, end);
              const name = chunk.match(/<h2>\s*([^<]+?)\s*<\/h2>/)?.[1]?.trim() ?? body;
              const stats = {
                range: statValue(chunk,'사거리'),
                move: statValue(chunk,'이동거리'),
                hp: statValue(chunk,'생명'),
                atk: statValue(chunk,'공격'),
                def: statValue(chunk,'방어'),
                mdef: statValue(chunk,'마방'),
              };
              legacy.push({page:def.page,tier:h.tier,armyType,name,src:m[1],stats});
            }
          }
          const sig = x => [x.armyType,x.tier,x.range,x.move,x.hp,x.atk,x.def,x.mdef].join(':');
          const legacyBySig = new Map();
          for (const x of legacy) {
            if (Object.values(x.stats).some(v=>v==null) || !x.armyType) continue;
            const key=sig({...x,...x.stats});
            const arr=legacyBySig.get(key)??[]; arr.push(x); legacyBySig.set(key,arr);
          }
          let unique=0, ambiguous=0, missing=0, nameChecks=0, nameContradictions=0;
          const unresolved=[];
          for (const r of canonical.filter(r=>!r.identity.isSp)) {
            const key=sig({armyType:r.identity.armyType,tier:r.identity.tier,...r.combat});
            const cands=legacyBySig.get(key)??[];
            if (cands.length===1) {
              unique++;
              const c=cands[0];
              if (r.identity.nameKr && r.identity.tier===3) {
                nameChecks++;
                const norm=s=>s.replace(/[\s_\-]/g,'').toLowerCase();
                if (norm(r.identity.nameKr)!==norm(c.name)) {
                  nameContradictions++;
                  console.log(`NAME_CONTRADICTION id=${r.soldierId} canonical=${r.identity.nameKr} legacy=${c.name} sig=${key}`);
                }
              }
              if (r.identity.tier<3 || !r.identity.nameKr) console.log(`UNIQUE_JOIN id=${r.soldierId} tier=${r.identity.tier} army=${r.identity.armyType} legacyName=${c.name} src=${c.src}`);
            } else if (cands.length>1) {
              ambiguous++;
              unresolved.push({id:r.soldierId,reason:'AMBIG',count:cands.length,names:cands.map(x=>x.name)});
            } else {
              missing++;
              unresolved.push({id:r.soldierId,reason:'NO_LEGACY_SIGNATURE'});
            }
          }
          const low = canonical.filter(r=>!r.identity.isSp && r.identity.tier<3);
          let lowUnique=0, lowAmbig=0, lowMissing=0;
          for (const r of low) {
            const key=sig({armyType:r.identity.armyType,tier:r.identity.tier,...r.combat});
            const n=(legacyBySig.get(key)??[]).length;
            if(n===1) lowUnique++; else if(n>1) lowAmbig++; else lowMissing++;
          }
          console.log(`SIGNATURE_RESULT normalUnique=${unique} normalAmbiguous=${ambiguous} normalMissing=${missing} t3NameChecks=${nameChecks} t3NameContradictions=${nameContradictions}`);
          console.log(`LOW_TIER_RESULT total=${low.length} unique=${lowUnique} ambiguous=${lowAmbig} missing=${lowMissing}`);
          console.log(`UNRESOLVED ${JSON.stringify(unresolved)}`);
          if (nameContradictions!==0) process.exit(1);
          NODE
