name: Soldier Frontend Stage 3 Drive Index

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - '.github/workflows/soldier-frontend-stage3-drive-index.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Measure canonical lower-tier distribution and legacy images
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const canonical = JSON.parse(fs.readFileSync('data/generated/soldier-detail-stage5-2.v1.json','utf8')).records;
          const armyPages = {
            INFANTRY: '보병', LANCER: '창병', CAVALRY: '기병', FLYING: '비병', WATER: '수병',
            ARCHER: '궁병', ASSASSIN: '암살자', MAGE: '마법사', HOLY: '승병', DEMON: '마족'
          };
          const norm = s => s.replace(/[\s_\-]/g,'').toLowerCase();
          for (const tier of [1,2]) {
            const rows = canonical.filter(r => !r.identity.isSp && r.identity.tier === tier);
            const byArmy = Object.groupBy(rows, r => r.identity.armyType);
            console.log(`CANONICAL_TIER=${tier} count=${rows.length}`);
            for (const [army, rs] of Object.entries(byArmy)) console.log(`CANONICAL tier=${tier} army=${army} ids=${rs.map(r=>r.soldierId).join(',')}`);
          }
          for (const [army, page] of Object.entries(armyPages)) {
            const url = `https://raw.githubusercontent.com/redpanda7301/langrisser/a85bba49dcf073563e7366dc18e96b7ba67c2ae3/troop/${encodeURIComponent(page)}.html`;
            const res = await fetch(url);
            const text = await res.text();
            if (!res.ok) { console.log(`LEGACY_PAGE_FAIL army=${army} status=${res.status}`); continue; }
            const headings = [...text.matchAll(/<div class="view_title">([123])티어 용병<\/div>/g)].map(m => ({tier:Number(m[1]), index:m.index}));
            const imgs = [...text.matchAll(/<img class="filterDiv [^"]+"[^>]*src="\.\.\/img\/troop\/[^\"]+\/병종\/([^\"]+\.webp)"[^>]*>/g)].map(m => ({file:m[1], index:m.index}));
            const rows = imgs.map(x => {
              const h = headings.filter(h => h.index < x.index).at(-1);
              const raw = x.file.replace(/\.webp$/,'').replace(/^\d+_/, '');
              return {tier:h?.tier ?? null, file:x.file, raw, key:norm(raw)};
            }).filter(x => x.tier === 1 || x.tier === 2);
            console.log(`LEGACY army=${army} t1=${rows.filter(x=>x.tier===1).map(x=>x.raw).join('|')} t2=${rows.filter(x=>x.tier===2).map(x=>x.raw).join('|')}`);
          }
          NODE
