name: Soldier Frontend Stage 3 Drive Index

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - '.github/workflows/soldier-frontend-stage3-drive-index.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Probe public Drive folder payload
        run: |
          node <<'NODE'
          const folders = {
            I: '1Br-tmzvjc4xo7baBaiziwweGyU75H-8x',
            II: '15a3Rc2w2i3Zkf32LZwB4xT8Ldaej0yXl',
            III: '17586qKXHeDoCZ13E6bmrmgMRtMUk9fzQ',
          };
          for (const [tier, id] of Object.entries(folders)) {
            const url = `https://drive.google.com/drive/folders/${id}`;
            const res = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0' }, redirect: 'follow' });
            const text = await res.text();
            console.log(`TIER=${tier} status=${res.status} bytes=${text.length}`);
            for (const needle of ['중장 창병','대지 골렘','할버드','정예 창병','창병']) {
              const i = text.indexOf(needle);
              console.log(`TIER=${tier} needle=${needle} index=${i}`);
              if (i >= 0) console.log(text.slice(Math.max(0, i - 240), i + 400).replace(/\n/g, ' '));
            }
            console.log(`TIER=${tier} folderMimeOccurrences=${(text.match(/application\\\/vnd\\.google-apps\\.folder/g) || []).length}`);
          }
          NODE
