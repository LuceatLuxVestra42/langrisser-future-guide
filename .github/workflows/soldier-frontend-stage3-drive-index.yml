name: Soldier Frontend Stage 3 Drive Index

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - '.github/workflows/soldier-frontend-stage3-drive-index.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect lazy Drive folder payload
        run: |
          node <<'NODE'
          const id='17586qKXHeDoCZ13E6bmrmgMRtMUk9fzQ';
          const text=await (await fetch(`https://drive.google.com/drive/folders/${id}`,{headers:{'user-agent':'Mozilla/5.0'}})).text();
          console.log(`bytes=${text.length}`);
          for(const name of ['가면 메이드','볼트 레인저','로열 그리폰','야만 뿔투사','중장 창병']){
            const positions=[]; let from=0;
            while(true){const i=text.indexOf(name,from);if(i<0)break;positions.push(i);from=i+name.length;if(positions.length>=5)break;}
            console.log(`NAME=${name} positions=${positions.join(',')||'NONE'}`);
            for(const i of positions.slice(0,2)) console.log(text.slice(Math.max(0,i-600),i+900).replace(/\n/g,' '));
          }
          NODE
