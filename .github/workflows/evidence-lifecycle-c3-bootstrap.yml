name: Evidence Lifecycle C3 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c3
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c3-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print refreshed C1 identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('tools/evidence-lifecycle/generated/c1-inventory.v1.json', 'utf8'));
          console.log(JSON.stringify({ baseline: x.baseline, summary: x.summary, inventoryDigest: x.inventoryDigest }, null, 2));
          NODE
