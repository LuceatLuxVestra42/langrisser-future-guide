name: Evidence Lifecycle C3 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c3
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c3-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate C3 classification
        run: node tools/evidence-lifecycle/cli/c3-lifecycle-classification.mjs --write
      - name: Inspect secondary lifecycle signals
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('tools/evidence-lifecycle/generated/c3-lifecycle-classification.v1.json', 'utf8'));
          const counts = {};
          const samples = {};
          for (const row of x.records) {
            for (const reason of row.secondaryReasons || []) {
              counts[reason.lifecycle] = (counts[reason.lifecycle] || 0) + 1;
              (samples[reason.lifecycle] ||= []).push(row.path);
            }
          }
          console.log(JSON.stringify({
            secondaryLifecycleCounts: counts,
            samples: Object.fromEntries(Object.entries(samples).map(([k, v]) => [k, v.slice(0, 20)])),
          }, null, 2));
          NODE
      - name: Commit generated classification if changed
        run: |
          if [ -z "$(git status --porcelain -- tools/evidence-lifecycle/generated/c3-lifecycle-classification.v1.json)" ]; then
            echo 'C3 classification already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evidence-lifecycle/generated/c3-lifecycle-classification.v1.json
          git commit -m 'Generate Evidence Lifecycle C3 classification'
          git push
