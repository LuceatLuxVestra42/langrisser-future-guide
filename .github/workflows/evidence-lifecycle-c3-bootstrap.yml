name: Evidence Lifecycle C3 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c3
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c3-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate C3 classification
        run: node tools/evidence-lifecycle/cli/c3-lifecycle-classification.mjs --write
      - name: Commit generated classification if changed
        run: |
          if git diff --quiet -- tools/evidence-lifecycle/generated/c3-lifecycle-classification.v1.json; then
            echo 'C3 classification already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evidence-lifecycle/generated/c3-lifecycle-classification.v1.json
          git commit -m 'Generate Evidence Lifecycle C3 classification'
          git push
