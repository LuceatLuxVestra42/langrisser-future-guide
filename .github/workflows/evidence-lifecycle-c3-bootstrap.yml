name: Evidence Lifecycle C3 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c3
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c3-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh C1 inventory from frozen C0 baseline
        run: node tools/evidence-lifecycle/cli/c1-inventory.mjs --write
      - name: Commit refreshed C1 inventory if changed
        run: |
          if [ -z "$(git status --porcelain -- tools/evidence-lifecycle/generated/c1-inventory.v1.json)" ]; then
            echo 'C1 inventory already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evidence-lifecycle/generated/c1-inventory.v1.json
          git commit -m 'Refresh Evidence Lifecycle C1 inventory baseline'
          git push
