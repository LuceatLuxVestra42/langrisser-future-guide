name: Evidence Lifecycle C3 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c3
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c3-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh C1 C2 C3 chain
        run: |
          node tools/evidence-lifecycle/cli/c1-inventory.mjs --stdout > /tmp/c1.json
          mv /tmp/c1.json tools/evidence-lifecycle/generated/c1-inventory.v1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c0 = JSON.parse(fs.readFileSync('tools/evidence-lifecycle/contracts/c0-scope-admission.v1.json','utf8'));
          const c1 = JSON.parse(fs.readFileSync('tools/evidence-lifecycle/generated/c1-inventory.v1.json','utf8'));
          const admitted = c1.records.filter(x => x.admissionStatus === 'ADMITTED').length;
          const p='tools/evidence-lifecycle/contracts/c2-reference-graph.v1.json';
          const c2=JSON.parse(fs.readFileSync(p,'utf8'));
          c2.baseline.sha=c0.baseline.sha;
          c2.input.c1InventoryDigest=c1.inventoryDigest.value;
          c2.input.admittedNodeCount=admitted;
          for (const k of ['admittedPopulationParity','nodePopulationParity']) if (k in c2.completionCriteria) c2.completionCriteria[k]=admitted;
          fs.writeFileSync(p, JSON.stringify(c2,null,2)+'\n');
          NODE
          node tools/evidence-lifecycle/cli/c2-reference-graph.mjs > /tmp/c2.json
          mv /tmp/c2.json tools/evidence-lifecycle/generated/c2-reference-graph.v1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c0=JSON.parse(fs.readFileSync('tools/evidence-lifecycle/contracts/c0-scope-admission.v1.json','utf8'));
          const c1=JSON.parse(fs.readFileSync('tools/evidence-lifecycle/generated/c1-inventory.v1.json','utf8'));
          const c2=JSON.parse(fs.readFileSync('tools/evidence-lifecycle/generated/c2-reference-graph.v1.json','utf8'));
          const admitted=c1.records.filter(x=>x.admissionStatus==='ADMITTED').length;
          const p='tools/evidence-lifecycle/contracts/c3-lifecycle-classification.v1.json';
          const c3=JSON.parse(fs.readFileSync(p,'utf8'));
          c3.baseline.sha=c0.baseline.sha;
          c3.input.c1InventoryDigest=c1.inventoryDigest.value;
          c3.input.c2GraphDigest=c2.graphDigest.value;
          c3.input.admittedNodeCount=admitted;
          c3.completionCriteria.admittedPopulationParity=admitted;
          c3.completionCriteria.classifiedPopulationParity=admitted;
          fs.writeFileSync(p, JSON.stringify(c3,null,2)+'\n');
          NODE
          node tools/evidence-lifecycle/cli/c3-lifecycle-classification.mjs > /tmp/c3.json
          mv /tmp/c3.json tools/evidence-lifecycle/generated/c3-lifecycle-classification.v1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='tools/evidence-lifecycle/test/evidence-lifecycle-readonly.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replaceAll('assert.equal(c2Contract.input.admittedNodeCount, 640);','assert.equal(c2Contract.input.admittedNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c2Committed.input.admittedNodeCount, 640);','assert.equal(c2Committed.input.admittedNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c2Committed.summary.admittedNodeCount, 640);','assert.equal(c2Committed.summary.admittedNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c2Committed.summary.referencedNodeCount + c2Committed.summary.zeroReferenceNodeCount, 640);','assert.equal(c2Committed.summary.referencedNodeCount + c2Committed.summary.zeroReferenceNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c2Committed.summary.protectingReferencedNodeCount + c2Committed.summary.zeroProtectingReferenceNodeCount, 640);','assert.equal(c2Committed.summary.protectingReferencedNodeCount + c2Committed.summary.zeroProtectingReferenceNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c3Contract.input.admittedNodeCount, 640);','assert.equal(c3Contract.input.admittedNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c3Contract.completionCriteria.admittedPopulationParity, 640);','assert.equal(c3Contract.completionCriteria.admittedPopulationParity, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c3Contract.completionCriteria.classifiedPopulationParity, 640);','assert.equal(c3Contract.completionCriteria.classifiedPopulationParity, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c3Committed.input.admittedNodeCount, 640);','assert.equal(c3Committed.input.admittedNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(admittedC1Paths.length, 640);','assert.equal(admittedC1Paths.length, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c3Committed.records.length, 640);','assert.equal(c3Committed.records.length, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(new Set(c3Paths).size, 640);','assert.equal(new Set(c3Paths).size, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c3Committed.summary.admittedNodeCount, 640);','assert.equal(c3Committed.summary.admittedNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(c3Committed.summary.classifiedNodeCount, 640);','assert.equal(c3Committed.summary.classifiedNodeCount, c1Committed.summary.admittedCount);')
             .replaceAll('assert.equal(lifecycleCountSum, 640);','assert.equal(lifecycleCountSum, c1Committed.summary.admittedCount);');
          fs.writeFileSync(p,s);
          NODE
          node tools/evidence-lifecycle/test/evidence-lifecycle-readonly.mjs
      - name: Commit refreshed frozen chain
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evidence-lifecycle/contracts/c2-reference-graph.v1.json \
                  tools/evidence-lifecycle/contracts/c3-lifecycle-classification.v1.json \
                  tools/evidence-lifecycle/generated/c1-inventory.v1.json \
                  tools/evidence-lifecycle/generated/c2-reference-graph.v1.json \
                  tools/evidence-lifecycle/generated/c3-lifecycle-classification.v1.json \
                  tools/evidence-lifecycle/test/evidence-lifecycle-readonly.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Close Evidence Lifecycle C1-C3 freshness chain'
          git push
