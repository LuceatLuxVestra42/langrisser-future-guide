name: Evidence Lifecycle C4 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c4
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c4-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-c4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate C4 retention freeze
        run: |
          node tools/evidence-lifecycle/cli/c4-retention-freeze.mjs > /tmp/c4.json
          mv /tmp/c4.json tools/evidence-lifecycle/generated/c4-retention-freeze.v1.json
      - name: Extend permanent Evidence Lifecycle validator
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='tools/evidence-lifecycle/test/evidence-lifecycle-readonly.mjs';
          let s=fs.readFileSync(p,'utf8');
          const line="await import('./c4-retention-readonly.mjs');";
          if (!s.includes(line)) s=`${s.trimEnd()}\n\n${line}\n`;
          fs.writeFileSync(p,s);
          NODE
      - name: Validate frozen C0-C4 chain read-only
        run: node tools/evidence-lifecycle/test/evidence-lifecycle-readonly.mjs
      - name: Commit C4 freeze
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evidence-lifecycle/generated/c4-retention-freeze.v1.json \
                  tools/evidence-lifecycle/test/evidence-lifecycle-readonly.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Complete Evidence Lifecycle C4 retention freeze'
          git push
