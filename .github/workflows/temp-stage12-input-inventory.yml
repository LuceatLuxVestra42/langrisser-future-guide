name: Temporary Stage12 soldier correction input inventory
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inventory frozen/generated correction inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/stage12-input-inventory
          node <<'NODE'
          import fs from 'node:fs';
          const paths = [
            'data/generated/hero-basic-combat.v1.json',
            'data/generated/hero-page-stage5-4-sp.v1.json',
            'data/generated/hero-page-stage5-1-bonds-final.v1.json',
            'data/generated/hero-page-soldiers-stage5-3.v1.json',
            'data/generated/hero-detail/by-id/6.json',
            'data/contracts/hero-stage6-3-full-generation.v1.json',
            'data/contracts/hero-soldier-correction-stage11d-freeze-contract.v1.json'
          ];
          const terms = /cmd|fetter|property|modify|soldier|correction|command/i;
          const idKeys = new Set(['ID','id','heroId','heroID','HeroID','canonicalHeroId','hero_id']);
          function scalar(v){ return v===null || ['string','number','boolean'].includes(typeof v); }
          function collect(obj, path='', out=[], depth=0){
            if(depth>12 || out.length>=300) return out;
            if(Array.isArray(obj)){
              for(let i=0;i<Math.min(obj.length,1000)&&out.length<300;i++) collect(obj[i],`${path}[${i}]`,out,depth+1);
            } else if(obj && typeof obj==='object'){
              for(const [k,v] of Object.entries(obj)){
                const p=path?`${path}.${k}`:k;
                if(terms.test(k) && scalar(v)) out.push([p,v]);
                collect(v,p,out,depth+1);
              }
            }
            return out;
          }
          function leonRecords(obj, path='', out=[], depth=0){
            if(depth>12 || out.length>=40) return out;
            if(Array.isArray(obj)){
              for(let i=0;i<obj.length && out.length<40;i++) leonRecords(obj[i],`${path}[${i}]`,out,depth+1);
            } else if(obj && typeof obj==='object'){
              let hit=false;
              for(const [k,v] of Object.entries(obj)) if(idKeys.has(k) && (v===6 || v==='6')) hit=true;
              if(hit){
                const vals=[];
                for(const [k,v] of Object.entries(obj)) if(terms.test(k) && scalar(v)) vals.push([k,v]);
                out.push({path, keys:Object.keys(obj).slice(0,80), matchedScalars:vals.slice(0,80)});
              }
              for(const [k,v] of Object.entries(obj)) leonRecords(v,path?`${path}.${k}`:k,out,depth+1);
            }
            return out;
          }
          const result={};
          for(const p of paths){
            if(!fs.existsSync(p)){ result[p]={exists:false}; continue; }
            const txt=fs.readFileSync(p,'utf8');
            let obj; try{obj=JSON.parse(txt)}catch(e){result[p]={exists:true,json:false,error:String(e)};continue;}
            result[p]={
              exists:true,
              bytes:txt.length,
              rootType:Array.isArray(obj)?'array':typeof obj,
              rootKeys:obj&&typeof obj==='object'&&!Array.isArray(obj)?Object.keys(obj).slice(0,100):[],
              literalHits:{
                Hero3_HPCmdAdd:txt.includes('Hero3_HPCmdAdd'),
                Hero3_ATCmdAdd:txt.includes('Hero3_ATCmdAdd'),
                HPCmd_INI:txt.includes('HPCmd_INI'),
                ATCmd_INI:txt.includes('ATCmd_INI'),
                DFCmd_INI:txt.includes('DFCmd_INI'),
                MagicDFCmd_INI:txt.includes('MagicDFCmd_INI')
              },
              leonRecords:leonRecords(obj),
              matchingScalars:collect(obj).slice(0,120)
            };
          }
          fs.writeFileSync('out/stage12-input-inventory/result.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-input-inventory
          path: out/stage12-input-inventory
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-stage12-input-inventory.yml
          git commit -m "Remove temporary Stage12 input inventory"
          git push origin HEAD:${GITHUB_REF_NAME}
