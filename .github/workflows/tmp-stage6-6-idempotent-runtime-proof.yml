name: Temporary Stage 6-6 Idempotent Runtime Proof

on:
  push:
    branches:
      - work/project-status-stage6-6-all-domain-closeout
    paths:
      - '.github/workflows/tmp-stage6-6-idempotent-runtime-proof.yml'

permissions:
  contents: write

concurrency:
  group: stage6-6-runtime-proof-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Stage 6-6 self-test
        run: node scripts/validate-project-doctor-status-source-stage6-6-all-domain-closeout.mjs

      - name: Apply Equipment idempotent baseline
        run: node scripts/apply-project-doctor-status-source-stage6-6-all-domain-closeout.mjs --pipeline equipment --apply

      - name: Apply Hero-Soldier idempotent baseline
        run: node scripts/apply-project-doctor-status-source-stage6-6-all-domain-closeout.mjs --pipeline hero-soldier --apply

      - name: Apply Banner idempotent baseline
        run: node scripts/apply-project-doctor-status-source-stage6-6-all-domain-closeout.mjs --pipeline banner --apply

      - name: Verify Skin readiness remains check-only
        run: |
          node scripts/apply-project-doctor-status-source-stage6-6-all-domain-closeout.mjs --pipeline skin --check
          if node scripts/apply-project-doctor-status-source-stage6-6-all-domain-closeout.mjs --pipeline skin --apply; then
            echo 'Skin apply unexpectedly succeeded.'
            exit 1
          fi

      - name: Verify authorities remain unchanged
        run: |
          node - <<'NODE'
          const r = require('./data/generated/project-doctor-active-source-registry.v1.json');
          const expected = {
            hero: 'hero-stage6-4-final',
            soldier: 'soldier-stage6-7-site-admission',
            equipment: 'equipment-stage4-final',
            'hero-soldier': 'hero-soldier-stageC-final',
            banner: 'banner-stage3-8-regression-freeze',
            skin: 'skin-stage3-2-readiness'
          };
          for (const [domain, id] of Object.entries(expected)) {
            if (r.domains?.[domain]?.selectedId !== id) throw new Error(`${domain}: ${r.domains?.[domain]?.selectedId} != ${id}`);
          }
          if (r.entryCount !== 6 || r.selectedCount !== 6) throw new Error('Registry count changed.');
          console.log('Registry authority unchanged.');
          NODE

      - name: Verify D5 fresh and Project Status current
        run: |
          node scripts/validate-project-doctor-d5-active.mjs
          node scripts/build-project-status.mjs --check

      - name: Reject unexpected mutations
        run: |
          CHANGED="$(git status --porcelain | awk '{print $2}')"
          for path in $CHANGED; do
            if [ "$path" != 'data/generated/project-doctor-d5-freshness.v1.json' ]; then
              echo "Unexpected mutation: $path"
              git status --short
              exit 1
            fi
          done

      - name: Commit explicit D5 reseal
        run: |
          FILE='data/generated/project-doctor-d5-freshness.v1.json'
          if [ -z "$(git status --porcelain -- "$FILE")" ]; then
            echo 'D5 seal already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'chore: reseal D5 after Stage 6-6 runtime proof'
          git push origin HEAD:"${GITHUB_REF_NAME}"
