name: Hero Talent Stage 5 Review

on:
  pull_request:
    paths:
      - 'data/contracts/localization-audit-hero-talent-stage5-review.v1.json'
      - 'data/presentation/hero-talent-stage5-review.v1.json'
      - 'data/presentation/hero-talent-kr-cn-parity.v1.json'
      - 'scripts/audit-localization-hero-talent-stage5-review.mjs'
      - '.github/workflows/localization-audit-hero-talent-stage5-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Stage 5 review projection
        run: node scripts/audit-localization-hero-talent-stage5-review.mjs
      - name: Verify Stage 5 projection
        run: node scripts/audit-localization-hero-talent-stage5-review.mjs --check
      - name: Snapshot intended tracked state
        run: git status --porcelain > /tmp/stage5-before.txt
      - name: Run localization owner validator
        run: node tools/project-check/test/localization-with-equipment-freshness.mjs
      - name: Run Hero frontend production validator
        run: node tools/project-check/test/frontend-production-gate.mjs
      - name: Verify validators left no extra tracked mutation
        run: |
          git status --porcelain > /tmp/stage5-after.txt
          diff -u /tmp/stage5-before.txt /tmp/stage5-after.txt
      - name: Commit generated projection when changed
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain -- data/presentation/hero-talent-stage5-review.v1.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/presentation/hero-talent-stage5-review.v1.json
            git commit -m 'Materialize Hero talent Stage 5 review projection'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
