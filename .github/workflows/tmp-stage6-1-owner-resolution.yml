name: Temporary Stage 6-1 Owner Resolution

on:
  push:
    branches:
      - work/project-status-stage6-1-owner-resolution
    paths:
      - 'data/contracts/project-doctor-status-source-stage6-1-owner-resolution.v1.json'
      - 'scripts/validate-project-doctor-status-source-stage6-1-owner-resolution.mjs'
      - '.github/workflows/tmp-stage6-1-owner-resolution.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Hero and Soldier completion owner resolution
        run: node scripts/validate-project-doctor-status-source-stage6-1-owner-resolution.mjs
