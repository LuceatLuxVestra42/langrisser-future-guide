name: Hero-Soldier Stage C-5 Final Closeout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject protected main as explicit producer target
        run: |
          echo 'Explicit Hero-Soldier Stage C-5 producer runs must target a non-main branch. Select the branch/ref to freeze, then open a normal PR.'
          exit 1

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate C-5 final closeout
        run: node scripts/validate-hero-soldier-stageC-5-final.cjs

      - name: Show C-FINAL summary
        if: always()
        run: |
          if [ -f data/validation/hero-soldier-integration-stageC-final.v1.json ]; then
            node -e "const x=require('./data/validation/hero-soldier-integration-stageC-final.v1.json'); console.log(JSON.stringify({status:x.status,completion:x.completion,pipelineStatus:x.pipelineStatus,summary:x.summary,decision:x.decision},null,2))"
          fi

      - name: Upload C-FINAL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-soldier-stageC-final
          path: data/validation/hero-soldier-integration-stageC-final.v1.json
          if-no-files-found: ignore

      - name: Freeze C-FINAL output on explicit producer run
        if: success()
        run: |
          OUTPUT='data/validation/hero-soldier-integration-stageC-final.v1.json'
          if [ -z "$(git status --porcelain -- "$OUTPUT")" ]; then
            echo 'C-FINAL output already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT"
          git commit -m 'Freeze Hero-Soldier Stage C-FINAL PASS_WITH_REVIEW'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
