name: F4 D5 Freshness Reseal Once

on:
  push:
    branches:
      - maintenance/frozen-provenance-semantic-freshness-v2-f4
    paths:
      - .github/workflows/f4-d5-refresh-once.yml

permissions:
  contents: write

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run authoritative D5 refresh
        run: npm run doctor:freshness:refresh

      - name: Commit authoritative refresh outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/generated/project-doctor-d5-freshness.v1.json \
            data/validation/project-doctor-d5-freshness.v1.json \
            data/generated/project-status.v1.json \
            data/validation/project-status.v1.json
          if git diff --cached --quiet; then
            echo "No D5 refresh changes to commit"
            exit 0
          fi
          git commit -m "Refresh Project Doctor D5 freshness seal for F4"
          git push origin HEAD:maintenance/frozen-provenance-semantic-freshness-v2-f4
