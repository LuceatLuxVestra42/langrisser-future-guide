name: Hero portrait Stage 4-1C admission

on:
  push:
    branches:
      - work/hero-portrait-stage4-1c-mapped-source-admission
    paths:
      - scripts/hero_portrait_stage4_1c_validate_admission.py
      - .github/workflows/hero-portrait-stage4-1c-admission.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install 'gdown==6.1.0' 'Pillow==11.3.0'

      - name: Download mapped sources and apply Stage 3 technical gates
        run: |
          python scripts/hero_portrait_stage4_1c_validate_admission.py \
            --repo-root . \
            --work-dir /tmp/hero-stage4-1c-png \
            --review-dir /tmp/hero-stage4-1c-review \
            --workers 8

      - name: Upload visual review contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: hero-stage4-1c-contact-sheets
          path: /tmp/hero-stage4-1c-review/
          if-no-files-found: error
          retention-days: 7

      - name: Commit technical admission evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-1c-technical-admission.v1.json data/validation/hero-portrait-stage4-1c-technical-admission-summary.v1.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Validate Hero portrait Stage 4-1C mapped sources'
            git push
          fi
