name: ConfigData B5.7 Stage4-8 baseline refresh

on:
  push:
    branches:
      - configdata/b5-7-soldier-deletion-readiness-v1
    paths:
      - '.github/workflows/configdata-b5-7-baseline-refresh.yml'

permissions:
  contents: write
  actions: read

jobs:
  adopt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: configdata/b5-7-soldier-deletion-readiness-v1

      - name: Adopt exact validated Stage4-8 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b57-artifact"
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9840189001/zip" \
            -o "$RUNNER_TEMP/b57.zip"
          unzip -q "$RUNNER_TEMP/b57.zip" -d "$RUNNER_TEMP/b57-artifact"
          SOURCE="$RUNNER_TEMP/b57-artifact/validation/soldier-stage4-8-baseline.v1.json"
          test -f "$SOURCE"
          ACTUAL_BLOB="$(git hash-object "$SOURCE")"
          test "$ACTUAL_BLOB" = "6308ca7bb80868a45f27efa1186e7a2e987378ed"
          node -e "const d=require(process.argv[1]); if(d.status!=='PASS'||d.errors.length||d.changeRecord.dataChanges.length||d.changeRecord.contractChanges.length||d.changeRecord.artifactChanges.length) process.exit(1)" "$SOURCE"
          cp "$SOURCE" data/validation/soldier-stage4-8-baseline.v1.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/soldier-stage4-8-baseline.v1.json
          git commit -m "Freeze B5.7 Soldier Stage4-8 baseline"
          git push origin HEAD:configdata/b5-7-soldier-deletion-readiness-v1
