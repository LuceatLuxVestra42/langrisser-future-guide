name: hero-awakening-display-metadata-pr-trigger

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trigger-runner:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hero-awakening-display-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-awakening-display-metadata
          fetch-depth: 0
      - name: Trigger branch runner and self-remove
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# PR bootstrap trigger\n' >> .github/workflows/hero-awakening-display-metadata-run.yml
          git rm .github/workflows/hero-awakening-display-metadata-pr-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/hero-awakening-display-metadata-run.yml
          git commit -m "chore: trigger awakening metadata completion runner"
          git push origin HEAD:hero-awakening-display-metadata
