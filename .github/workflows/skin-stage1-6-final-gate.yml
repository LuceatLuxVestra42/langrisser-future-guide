name: Skin Stage 1-6 Final Gate

on:
  push:
    branches:
      - work/skin-stage1-6-final-gate

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Skin Stage 1-6 final gate
        run: python scripts/validate-skin-stage1-6-final.py
      - name: Commit final checkpoint and remove one-shot workflow
        run: |
          rm .github/workflows/skin-stage1-6-final-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/skin-stage1-6-final.v1.json .github/workflows/skin-stage1-6-final-gate.yml
          git commit -m "Complete Skin Stage 1-6 final gate"
          git push
