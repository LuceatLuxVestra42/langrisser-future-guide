name: Hero portrait Stage 4-2C embedded PE range probe

on:
  workflow_dispatch:
  push:
    branches:
      - work/hero-portrait-stage4-2c-current-unity-source-proof
    paths:
      - scripts/hero_portrait_stage4_2c_embedded_pe_range_probe.py
      - .github/workflows/hero-portrait-stage4-2c-embedded-pe-range-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/hero_portrait_stage4_2c_embedded_pe_range_probe.py
      - name: Commit probe result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2c-embedded-pe-range-probe.v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Probe Stage 4-2C embedded PE ranges'
          git push
