name: Soldier Stage 11-A15 Official WeChat Mirror Boundary

on:
  pull_request:
    paths:
      - 'data/soldier-release-official-wechat-mirror-boundary-stage11-a15.v1.json'
      - 'data/soldier-release-pre2020-event-boundary-stage11-a7.v1.json'
      - 'data/soldier-release-primary-locator-recovery-stage11-a14.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'scripts/validate-soldier-release-official-wechat-mirror-boundary-stage11-a15.mjs'
      - '.github/workflows/soldier-release-official-wechat-mirror-boundary-stage11-a15.yml'
  push:
    branches:
      - main
    paths:
      - 'data/soldier-release-official-wechat-mirror-boundary-stage11-a15.v1.json'
      - 'data/soldier-release-pre2020-event-boundary-stage11-a7.v1.json'
      - 'data/soldier-release-primary-locator-recovery-stage11-a14.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'scripts/validate-soldier-release-official-wechat-mirror-boundary-stage11-a15.mjs'
      - '.github/workflows/soldier-release-official-wechat-mirror-boundary-stage11-a15.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Stage 11-A15 official WeChat mirror boundary
        run: node scripts/validate-soldier-release-official-wechat-mirror-boundary-stage11-a15.mjs
      - name: Verify evidence validation is read-only
        run: git diff --exit-code
