name: Hero portrait Stage 4-2B SD bulk bridge
on:
  push:
    branches:
      - work/hero-portrait-stage4-2b-explicit-fallback-source-acquisition
    paths:
      - scripts/hero_portrait_stage4_2b_sd_bulk_bridge.py
      - .github/workflows/hero-portrait-stage4-2b-sd-bulk-bridge.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'gdown==6.1.0'
      - run: python scripts/hero_portrait_stage4_2b_sd_bulk_bridge.py
      - run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2b-sd-bulk-bridge.v1.json
          if git diff --cached --quiet; then echo no-change; else git commit -m 'Apply Hero portrait Stage 4-2B SD runtime bridge'; git push; fi
