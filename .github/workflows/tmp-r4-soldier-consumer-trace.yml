name: Temporary R4 soldier consumer trace
on:
  push:
    paths: ['.github/workflows/tmp-r4-soldier-consumer-trace.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract official IL2CPP pair and trace soldier consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4s out/r4-soldier-consumer
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib,hashlib,json
          D=pathlib.Path('/tmp/r4s'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          src={}
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ent(u,hs(u)) if e[0]==target); raw=get(u,e); (D/out).write_bytes(raw); src[out]={'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}
          pathlib.Path('out/r4-soldier-consumer/source.json').write_text(json.dumps(src,indent=2)+'\n')
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release > out/r4-soldier-consumer/dumper-build.log 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/r4s/dump
          set +e
          dotnet "$DLL" /tmp/r4s/GameAssembly.dll /tmp/r4s/global-metadata.dat /tmp/r4s/dump > out/r4-soldier-consumer/dumper.log 2>&1
          set -e
          test -f /tmp/r4s/dump/dump.cs
          python <<'PY'
          from pathlib import Path
          import re,json,subprocess
          s=Path('/tmp/r4s/dump/dump.cs').read_text(errors='replace')
          names=['ComputeSoldierProperties','ApplySoldierExchangeProperty','SetInfoForSoldier','CalcSoldierPropertyModifityAddtion']
          result=[]
          for name in names:
            pos=s.find(name+'(')
            if pos<0: continue
            pre=s[max(0,pos-2500):pos]
            ms=list(re.finditer(r'// RVA: 0x([0-9A-Fa-f]+).*?VA: 0x([0-9A-Fa-f]+)',pre))
            if not ms: continue
            m=ms[-1]; rva=int(m.group(1),16); va=int(m.group(2),16)
            result.append({'name':name,'rva':hex(rva),'va':hex(va)})
            Path(f'out/r4-soldier-consumer/{name}-context.txt').write_text(s[max(0,pos-4500):min(len(s),pos+7000)])
            txt=subprocess.run(['objdump','-D','-Mintel',f'--start-address=0x{va:x}',f'--stop-address=0x{va+0x1600:x}','/tmp/r4s/GameAssembly.dll'],capture_output=True,text=True).stdout
            Path(f'out/r4-soldier-consumer/{name}-disasm.txt').write_text(txt)
          Path('out/r4-soldier-consumer/methods.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-soldier-consumer
          path: out/r4-soldier-consumer
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-r4-soldier-consumer-trace.yml
          git commit -m 'Remove temporary R4 soldier consumer trace'
          git push origin HEAD:${GITHUB_REF_NAME}
