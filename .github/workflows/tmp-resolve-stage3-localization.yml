name: Temporary Stage 3 Localization Route Resolver

on:
  push:
    branches:
      - hero-provisional-localization-stage3
    paths:
      - .github/workflows/tmp-resolve-stage3-localization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 3 branch
        uses: actions/checkout@v5
        with:
          ref: hero-provisional-localization-stage3

      - name: Apply localization-only route merge
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/heroes.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'import type { HeroListRecord, HeroListStage4Record } from "@/lib/hero-list.server";',
                  'import type { HeroListStage4Record } from "@/lib/hero-list.server";'
              ),
              (
                  'function matchesHeroSearch(hero: HeroListRecord, normalizedQuery: string) {',
                  'function matchesHeroSearch(hero: HeroListStage4Record, normalizedQuery: string) {'
              ),
              (
                  '  return [hero.identity.nameKr, hero.identity.nameCn, hero.identity.nameEn]\n    .filter((name): name is string => Boolean(name))\n',
                  '  return [\n    hero.localization.displayName,\n    hero.localization.displayNameKr,\n    hero.localization.officialNameKr,\n    hero.identity.nameKr,\n    hero.identity.nameCn,\n    hero.identity.nameEn,\n  ]\n    .filter((name): name is string => Boolean(name))\n'
              ),
              (
                  '  const displayName = hero.identity.nameKr ?? hero.identity.nameCn;',
                  '  const displayName = hero.localization.displayName || (hero.identity.nameKr ?? hero.identity.nameCn);'
              ),
              (
                  '      <article data-hero-card="true" data-hero-id={hero.heroId} className="overflow-hidden rounded-lg border border-border/70 bg-card p-1 shadow-sm transition duration-200 group-hover:-translate-y-0.5 group-hover:border-foreground/25 group-hover:shadow-md">',
                  '      <article\n        data-hero-card="true"\n        data-hero-id={hero.heroId}\n        data-name-kr-status={hero.localization.nameKrStatus}\n        data-name-source-authority={hero.localization.sourceAuthority}\n        className="overflow-hidden rounded-lg border border-border/70 bg-card p-1 shadow-sm transition duration-200 group-hover:-translate-y-0.5 group-hover:border-foreground/25 group-hover:shadow-md"\n      >'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          required_preserved = [
              'getHeroFusionPowerIndex',
              'data-hero-fusion-power-marks="true"',
              'data-hero-fusion-power-mark="true"',
              'data-target-faction-id={fusionPower?.targetFactionId}',
          ]
          for token in required_preserved:
              if token not in text:
                  raise SystemExit(f'Fusion-power presentation token lost: {token}')

          path.write_text(text, encoding='utf-8')

      - name: Validate Stage 2 and Stage 7
        run: |
          npm run validate:hero-provisional-localization-stage2
          npm run audit:localization:stage7:check

      - name: Commit resolved route and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-resolve-stage3-localization.yml
          git add src/routes/heroes.tsx
          git diff --cached --check
          git commit -m "Resolve Stage 3 localization with current Hero card presentation"
          git push origin HEAD:hero-provisional-localization-stage3
