name: Project Status Sync (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-observation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify NEW R1 Status Source predecessor
        run: node tools/status-source/test/current-main-parity.mjs

      - name: Verify NEW R2 Project Status projection
        run: node tools/project-status/test/current-parity.mjs

      - name: Explain retired writer boundary
        run: |
          echo 'Legacy Project Status Sync mutation is retired.'
          echo 'This workflow is retained temporarily for read-only rollback observation only.'
          echo 'It does not regenerate D1, write Project Status, commit, or push.'
