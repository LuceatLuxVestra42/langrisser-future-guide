name: Soldier Stage 11-A2 Branch Freeze

on:
  push:
    branches:
      - soldier/stage11-a2-release-promotion

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: soldier/stage11-a2-release-promotion

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Stage 5-8 baseline
        run: node scripts/finalize-soldier-stage5-8-release.cjs

      - name: Promote Stage 11-A1 official evidence
        run: node scripts/promote-soldier-release-metadata-stage11-a2.mjs

      - name: Validate Stage 11-A historical checkpoint compatibility
        run: node scripts/validate-soldier-release-metadata-stage11-a.mjs

      - name: Validate Stage 11-A1 evidence compatibility
        run: node scripts/validate-soldier-release-official-notice-evidence-stage11-a1.mjs

      - name: Validate Stage 11-A2 promotion
        run: node scripts/validate-soldier-release-metadata-stage11-a2.mjs

      - name: Freeze promoted generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/soldier-release-metadata.v1.json \
            data/generated/soldier-list-stage5-8.v1.json \
            data/validation/soldier-stage5-8-release.v1.json
          if git diff --cached --quiet; then
            echo "Stage 11-A2 promoted artifacts already frozen."
          else
            git commit -m "freeze Soldier stage 11-A2 promoted release artifacts"
            git push origin HEAD:soldier/stage11-a2-release-promotion
          fi
