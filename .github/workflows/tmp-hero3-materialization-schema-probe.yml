name: Temporary Hero3 materialization schema probe

on:
  push:
    paths:
      - '.github/workflows/tmp-hero3-materialization-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6475e63ee23d18adf733756c26a14fa9e3ed662c
      - name: Locate exact ConfigData owner for PassiveBuff IDs
        run: |
          python3 <<'PY'
          import glob, json, os

          TARGETS = {5111, 5181}
          hits = []

          def walk(node, path='$'):
              if isinstance(node, dict):
                  if node.get('ID') in TARGETS:
                      hits.append((current_file, path, node))
                  for k, v in node.items():
                      walk(v, f'{path}.{k}')
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, f'{path}[{i}]')

          for current_file in sorted(glob.glob('data/configdata/*.json')):
              try:
                  with open(current_file, encoding='utf-8') as f:
                      data = json.load(f)
              except Exception:
                  continue
              walk(data)

          print('TARGET_IDS=' + json.dumps(sorted(TARGETS)))
          print('DIRECT_ID_HIT_COUNT=' + str(len(hits)))
          for filename, jpath, row in hits:
              print('DIRECT_ID_HIT=' + json.dumps({
                  'file': filename,
                  'jsonPath': jpath,
                  'record': row,
              }, ensure_ascii=False, separators=(',', ':')))

          found = {int(row['ID']) for _, _, row in hits if isinstance(row.get('ID'), int)}
          missing = sorted(TARGETS - found)
          print('MISSING_TARGET_IDS=' + json.dumps(missing))
          if missing:
              raise SystemExit('Target IDs not found as explicit ID records: ' + repr(missing))
          PY
