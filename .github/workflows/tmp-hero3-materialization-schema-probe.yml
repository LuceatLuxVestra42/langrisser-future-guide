name: Temporary Hero3 materialization schema probe

on:
  push:
    paths:
      - '.github/workflows/tmp-hero3-materialization-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6475e63ee23d18adf733756c26a14fa9e3ed662c
      - name: Trace 5111 and 5181 through semantic-looking fields
        run: |
          python3 <<'PY'
          import glob, json, os
          TARGETS={5111,5181}
          KEYWORDS=('buff','passive','property','skill','modify')
          out=[]

          def contains_target(v):
              if isinstance(v,int): return v in TARGETS
              if isinstance(v,list): return any(contains_target(x) for x in v)
              return False

          for p in sorted(glob.glob('data/configdata/*.json')):
              try: data=json.load(open(p,encoding='utf-8'))
              except Exception: continue
              rows=data if isinstance(data,list) else data.get('records',[]) if isinstance(data,dict) else []
              for i,r in enumerate(rows):
                  if not isinstance(r,dict): continue
                  for k,v in r.items():
                      if contains_target(v) and any(q in k.lower() for q in KEYWORDS):
                          out.append({'file':os.path.basename(p),'index':i,'recordID':r.get('ID'),'field':k,'value':v,'keys':sorted(r.keys())})
          print('SEMANTIC_FIELD_HIT_COUNT='+str(len(out)))
          for x in out:
              print('SEMANTIC_FIELD_HIT='+json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY
