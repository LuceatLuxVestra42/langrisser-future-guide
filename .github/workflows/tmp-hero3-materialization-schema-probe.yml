name: Temporary Hero3 materialization schema probe

on:
  push:
    paths:
      - '.github/workflows/tmp-hero3-materialization-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6475e63ee23d18adf733756c26a14fa9e3ed662c
      - name: Verify pinned SkillInfo bytes and selected records
        run: |
          python3 <<'PY'
          import json, os
          p='data/configdata/ConfigDataSkillInfo.json'
          print('FILE_SIZE='+str(os.path.getsize(p)))
          raw=open(p,'rb').read(128)
          print('HEAD_BYTES='+repr(raw))
          for enc in ('utf-8','utf-8-sig'):
              try:
                  data=json.load(open(p,encoding=enc))
                  print('PARSE_OK='+enc+';TYPE='+type(data).__name__)
                  if isinstance(data,list): rows=data
                  elif isinstance(data,dict):
                      print('TOP_KEYS='+json.dumps(list(data.keys())[:20],ensure_ascii=False))
                      rows=data.get('records') or data.get('data') or data.get('list') or []
                  else: rows=[]
                  print('ROW_COUNT='+str(len(rows) if hasattr(rows,'__len__') else -1))
                  if isinstance(rows,dict): rows=list(rows.values())
                  for r in rows:
                      if isinstance(r,dict) and r.get('ID') in (70009,70069):
                          print('SELECTED_SKILL_ROW='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
                  break
              except Exception as e:
                  print('PARSE_FAIL='+enc+':'+repr(e))
          PY
