name: Temporary Hero3 materialization schema probe

on:
  push:
    paths:
      - '.github/workflows/tmp-hero3-materialization-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect frozen Stage5 MAX selection and ConfigData skill schema
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const records = p => { const x=read(p); return Array.isArray(x)?x:(Array.isArray(x.records)?x.records:[]); };
          const bonds = read('data/generated/hero-page-stage5-1-bonds-final.v1.json');
          const heroes = Array.isArray(bonds) ? bonds : (bonds.heroes || bonds.records || []);
          const leon = heroes.find(h => Number(h.heroId) === 6);
          if (!leon) throw new Error('Leon heroId=6 missing from frozen Stage5 output');
          const selected = leon.bonds.map(b => ({
            fetterId: Number(b.fetterId),
            maxLevel: Number(b.maxLevel),
            gotSkillIds: b.gotSkillIds,
            selectedAtMax: Array.isArray(b.gotSkillIds) ? b.gotSkillIds[Number(b.maxLevel)-1] : null,
          }));
          console.log('LEON_MAX_SELECTION=' + JSON.stringify(selected));
          const cfgDir='data/configdata';
          const files=fs.readdirSync(cfgDir).filter(f=>/Skill|Buff|Property|Fetter/i.test(f)).sort();
          console.log('RELATED_FILES=' + JSON.stringify(files));
          const skillPath=path.join(cfgDir,'ConfigDataSkillInfo.json');
          const skills=records(skillPath);
          const ids=new Set(selected.map(x=>Number(x.selectedAtMax)).filter(Number.isFinite));
          for (const row of skills.filter(r=>ids.has(Number(r.ID)))) {
            console.log('SELECTED_SKILL_ROW=' + JSON.stringify(row));
          }
          for (const f of files) {
            if (!/Passive|Buff|Property/i.test(f)) continue;
            const p=path.join(cfgDir,f);
            let rs=[];
            try { rs=records(p); } catch { continue; }
            console.log('SCHEMA_FILE=' + f + ';COUNT=' + rs.length + ';KEYS=' + JSON.stringify(Object.keys(rs[0]||{})));
          }
          NODE
