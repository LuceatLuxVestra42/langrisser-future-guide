name: Temporary Hero3 materialization schema probe

on:
  push:
    paths:
      - '.github/workflows/tmp-hero3-materialization-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6475e63ee23d18adf733756c26a14fa9e3ed662c
      - name: Resolve SkillInfo PassiveBuffs_ID target rows
        run: |
          python3 <<'PY'
          import json
          skills=json.load(open('data/configdata/ConfigDataSkillInfo.json',encoding='utf-8'))
          buffs=json.load(open('data/configdata/ConfigDataBuffInfo.json',encoding='utf-8'))
          skill_ids=(70009,70069)
          selected=[r for r in skills if isinstance(r,dict) and r.get('ID') in skill_ids]
          target_ids=sorted({x for r in selected for x in r.get('PassiveBuffs_ID',[])})
          print('TARGET_BUFF_IDS='+json.dumps(target_ids))
          for r in selected:
              print('SKILL_ROW='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
          hit=[r for r in buffs if isinstance(r,dict) and r.get('ID') in target_ids]
          print('BUFF_HIT_COUNT='+str(len(hit)))
          for r in hit:
              print('BUFF_ROW='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
          missing=sorted(set(target_ids)-{r.get('ID') for r in hit})
          print('MISSING_BUFF_IDS='+json.dumps(missing))
          if missing: raise SystemExit(1)
          PY
