name: Equipment Stage 2-6 Restriction Analysis

on:
  push:
    paths:
      - '.github/workflows/equipment-stage2-6-restriction-analysis.yml'
      - 'scripts/analyze-equipment-stage2-6.mjs'
      - 'data/configdata/ConfigDataEquipmentInfo.json'
      - 'data/configdata/ConfigDataJobInfo.json'
      - 'data/configdata/ConfigDataArmyInfo.json'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze Equipment Stage 2-6 restrictions
        run: node scripts/analyze-equipment-stage2-6.mjs
      - name: Persist Stage 2-6 analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/equipment_stage2_6_restriction_analysis.json
          if git diff --cached --quiet; then
            echo "No Stage 2-6 changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 2-6 restriction analysis"
          git push
