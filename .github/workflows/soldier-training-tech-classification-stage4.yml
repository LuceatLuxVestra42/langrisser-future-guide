name: TrainingTech Stage 4 Classification Contract

on:
  pull_request:
    paths:
      - 'data/contracts/soldier-training-tech-classification-stage4-contract.v1.json'
      - 'data/validation/soldier-training-tech-classification-stage4.v1.json'
      - 'scripts/validate-soldier-training-tech-classification-stage4.mjs'
      - '.github/workflows/soldier-training-tech-classification-stage4.yml'
  push:
    branches:
      - main
    paths:
      - 'data/contracts/soldier-training-tech-classification-stage4-contract.v1.json'
      - 'data/validation/soldier-training-tech-classification-stage4.v1.json'
      - 'scripts/validate-soldier-training-tech-classification-stage4.mjs'
      - '.github/workflows/soldier-training-tech-classification-stage4.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frozen Stage 4 classification contract
        run: node scripts/validate-soldier-training-tech-classification-stage4.mjs --check
      - name: Assert Stage 4 validation is read-only
        run: git diff --exit-code
