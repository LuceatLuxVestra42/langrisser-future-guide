name: TEMP HeartFetter Research Publication

on:
  push:
    branches:
      - research/publish-heart-fetter-job-effect-v1-20260914
    paths:
      - .github/workflows/hero-heart-fetter-research-publication-temp.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: research/publish-heart-fetter-job-effect-v1-20260914
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build tracked research projection
        run: node scripts/build-hero-heart-fetter-job-effect-research-v1.cjs --output data/generated/hero-heart-fetter-job-effect-research.v1.json

      - name: Validate tracked research projection
        run: node scripts/validate-hero-heart-fetter-job-effect-research-v1.cjs --artifact data/generated/hero-heart-fetter-job-effect-research.v1.json

      - name: Commit exact generated artifact
        run: |
          set -euo pipefail
          git add data/generated/hero-heart-fetter-job-effect-research.v1.json
          git diff --cached --exit-code && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish HeartFetter job effect research projection"
          git push origin HEAD:research/publish-heart-fetter-job-effect-v1-20260914
