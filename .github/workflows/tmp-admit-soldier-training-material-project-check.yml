name: Temporary Soldier Training Material Project Check Admission

on:
  push:
    branches:
      - fix/project-check-soldier-training-material-owner-20260901
    paths:
      - scripts/tmp-admit-soldier-training-material-project-check.mjs
      - .github/workflows/tmp-admit-soldier-training-material-project-check.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/project-check-soldier-training-material-owner-20260901
          fetch-depth: 0

      - name: Apply minimal explicit owner and validator admission
        run: node scripts/tmp-admit-soldier-training-material-project-check.mjs

      - name: Commit final admission diff and remove temporary patcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Admit Soldier training material Project Check owner [skip ci]'
          git push origin HEAD:fix/project-check-soldier-training-material-owner-20260901
