name: Hero portrait Stage 4-2 finalize

on:
  push:
    branches:
      - work/hero-portrait-stage4-2-uncovered-source-fallback-proof
    paths:
      - scripts/hero_portrait_stage4_2_finalize.py
      - data/reviews/hero-portrait-stage4-2-known-ownership-visual-review.v1.json
      - .github/workflows/hero-portrait-stage4-2-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize Stage 4-2 fallback admission registry and checkpoint
        run: python scripts/hero_portrait_stage4_2_finalize.py
      - name: Commit frozen Stage 4-2 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/hero-portrait-stage4-2-fallback-admission.v1.json data/checkpoints/hero-portrait-stage4-2-uncovered-source-fallback-proof.v1.json data/validation/hero-portrait-stage4-2-final-summary.v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze Hero portrait Stage 4-2 fallback boundary'
            git push
          fi
