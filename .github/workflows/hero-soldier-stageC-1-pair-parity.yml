name: Hero-Soldier Stage C-1 Pair Parity

on:
  workflow_dispatch:
  push:
    branches:
      - 'work/hero-soldier-stageC-1'
    paths:
      - 'scripts/validate-hero-soldier-stageC-1-pair-parity.cjs'
      - 'data/contracts/hero-soldier-integration-stageC-0-input.v1.json'
      - 'data/validation/hero-soldier-integration-stageC-0-summary.v1.json'
      - 'data/validation/hero-soldier-relation-stageA-final.v1.json'
      - 'data/generated/hero-soldier-relations.v1.json'
      - 'data/generated/hero-detail.v1.json'
      - 'data/generated/hero-detail/by-id/**'
      - 'data/validation/hero-stage6-4-final.v1.json'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-7-site-admission.v1.json'
      - '.github/workflows/hero-soldier-stageC-1-pair-parity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/validate-hero-soldier-stageC-1-pair-parity.cjs'
      - 'data/contracts/hero-soldier-integration-stageC-0-input.v1.json'
      - 'data/validation/hero-soldier-integration-stageC-0-summary.v1.json'
      - 'data/validation/hero-soldier-relation-stageA-final.v1.json'
      - 'data/generated/hero-soldier-relations.v1.json'
      - 'data/generated/hero-detail.v1.json'
      - 'data/generated/hero-detail/by-id/**'
      - 'data/validation/hero-stage6-4-final.v1.json'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-7-site-admission.v1.json'
      - 'data/validation/hero-soldier-integration-stageC-1-pair-parity.v1.json'
      - '.github/workflows/hero-soldier-stageC-1-pair-parity.yml'

permissions:
  contents: write

jobs:
  validate-final-pair-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve validation refs
        id: refs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          else
            base="$(git rev-parse HEAD^)"
            head="$(git rev-parse HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Resolved C-1 validation diff: $base...$head"

      - name: Validate C-1 with SR-8 partial replacement
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/smart-regression-sr8-admission.mjs \
            --execute \
            --json \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" \
            > smart-regression-sr8-c1.json \
            2> smart-regression-sr8-c1.stderr.log
          sr8_code=$?
          set -e

          cat smart-regression-sr8-c1.json || true
          if [[ -s smart-regression-sr8-c1.stderr.log ]]; then
            cat smart-regression-sr8-c1.stderr.log >&2
          fi

          decision="$(node - <<'NODE'
          const fs = require('fs');
          try {
            const value = JSON.parse(fs.readFileSync('smart-regression-sr8-c1.json', 'utf8'));
            process.stdout.write(value.decision || 'ADMISSION_ERROR');
          } catch {
            process.stdout.write('ADMISSION_ERROR');
          }
          NODE
          )"
          echo "sr8_decision=$decision" >> "$GITHUB_OUTPUT"
          echo "SR-8 decision: $decision (exit=$sr8_code)"

          if [[ "$sr8_code" -eq 0 && "$decision" == "REPLACEMENT_EXECUTED" ]]; then
            echo 'C-1 validated through Smart Regression replacement path.'
            exit 0
          fi

          if [[ "$sr8_code" -eq 3 && "$decision" == "LEGACY_REQUIRED" ]]; then
            echo 'SR-8 admission was not narrow/safe enough; running unchanged legacy C-1 validator.'
            node scripts/validate-hero-soldier-stageC-1-pair-parity.cjs
            exit $?
          fi

          echo 'SR-8 admission/execution failed unexpectedly; do not silently fall back.' >&2
          exit "$sr8_code"

      - name: Show C-1 summary
        if: always() && hashFiles('data/validation/hero-soldier-integration-stageC-1-pair-parity.v1.json') != ''
        run: |
          node - <<'NODE'
          const v = require('./data/validation/hero-soldier-integration-stageC-1-pair-parity.v1.json');
          console.log(JSON.stringify({
            status: v.status,
            completion: v.completion,
            summary: v.summary,
            differences: v.differences,
            hardErrors: v.hardErrors,
            decision: v.decision
          }, null, 2));
          NODE

      - name: Upload C-1 diagnostics
        if: always() && hashFiles('data/validation/hero-soldier-integration-stageC-1-pair-parity.v1.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hero-soldier-stageC-1-pair-parity
          path: |
            data/validation/hero-soldier-integration-stageC-1-pair-parity.v1.json
            smart-regression-sr8-c1.json
            smart-regression-sr8-c1.stderr.log
          if-no-files-found: warn

      - name: Freeze C-1 output on work branch
        if: steps.validate.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/hero-soldier-stageC-1')
        run: |
          TARGET='data/validation/hero-soldier-integration-stageC-1-pair-parity.v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'C-1 output already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Freeze Hero-Soldier Stage C-1 pair parity PASS'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify frozen C-1 output on PR
        if: steps.validate.outcome == 'success' && github.event_name == 'pull_request'
        run: |
          TARGET='data/validation/hero-soldier-integration-stageC-1-pair-parity.v1.json'
          if [ -n "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'C-1 output is missing or stale.'
            git status --short -- "$TARGET"
            exit 1
          fi

      - name: Enforce C-1 gate
        if: always() && steps.validate.outcome != 'success'
        run: exit 1
