name: Skin Detail Full Art Stage 1 Probe

on:
  push:
    branches:
      - research/skin-detail-full-art-stage1-20260830
    paths:
      - scripts/probe-skin-detail-full-art-stage1.py
      - .github/workflows/skin-detail-full-art-stage1-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UnityPy
        shell: pwsh
        run: python -m pip install UnityPy==1.25.3
      - name: Probe frozen HeroPainting bundles
        shell: pwsh
        run: python scripts/probe-skin-detail-full-art-stage1.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: skin-detail-full-art-stage1-probe
          path: skin-detail-full-art-stage1-probe.json
          if-no-files-found: error
