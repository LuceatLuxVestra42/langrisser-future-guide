name: Skin Stage 1-1 Generate

on:
  push:
    branches:
      - work/skin-stage1-1-canonical
    paths:
      - .github/workflows/skin-stage1-1-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/skin-stage1-1-canonical
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical skin population
        run: python scripts/generate-skin-stage1-1.py
      - name: Commit generated checkpoint and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/skin-stage1-1-generate.yml
          git add data/generated/skin-stage1-canonical.v1.json data/validation/skin-stage1-1-final.v1.json
          git commit -m "Generate Skin Stage 1-1 canonical population"
          git push origin HEAD:work/skin-stage1-1-canonical
