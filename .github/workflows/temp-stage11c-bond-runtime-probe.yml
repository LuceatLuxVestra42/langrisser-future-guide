name: Temporary Stage11C bond runtime probe
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract official IL2CPP pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage11c out/stage11c-bond-runtime
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib,hashlib,json
          D=pathlib.Path('/tmp/stage11c'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          src={'installVersion':V,'files':{}}
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ent(u,hs(u)) if e[0]==target); raw=get(u,e); (D/out).write_bytes(raw); src['files'][out]={'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}
          pathlib.Path('out/stage11c-bond-runtime/source.json').write_text(json.dumps(src,indent=2)+'\n')
          PY
      - name: Dump metadata and identify owning method/modifier fields
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release > out/stage11c-bond-runtime/dumper-build.log 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/stage11c/dump
          ok=0
          for i in 1 2 3; do
            rm -rf /tmp/stage11c/dump/*
            if dotnet "$DLL" /tmp/stage11c/GameAssembly.dll /tmp/stage11c/global-metadata.dat /tmp/stage11c/dump > out/stage11c-bond-runtime/dumper-$i.log 2>&1; then ok=1; break; fi
          done
          test "$ok" = 1
          python <<'PY'
          import json,pathlib,re,bisect
          D=pathlib.Path('/tmp/stage11c/dump'); O=pathlib.Path('out/stage11c-bond-runtime')
          script=json.loads((D/'script.json').read_text(errors='replace'))
          methods=[]
          def walk(x):
            if isinstance(x,dict):
              if 'Address' in x and ('Name' in x or 'Signature' in x):
                try:
                  a=x['Address']; a=int(a,16) if isinstance(a,str) else int(a)
                  if a>=0x180000000:a-=0x180000000
                  methods.append((a,x.get('Name',''),x.get('Signature','')))
                except: pass
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(script)
          methods=sorted(set(methods))
          addrs=[m[0] for m in methods]
          target=0x17a0cc0
          i=bisect.bisect_right(addrs,target)-1
          owner=methods[i] if i>=0 else None
          named=[m for m in methods if any(k in (m[1]+' '+m[2]) for k in ['ComputeSoldierProperties','ComputeHeroProperties','Hero3_HPCmdAdd','Hero3_ATCmdAdd','Hero3_DFCmdAdd','Hero3_MagicDFCmdAdd','PropertyModifyType'])]
          dump=(D/'dump.cs').read_text(errors='replace')
          pats=['Hero3_HPCmdAdd','Hero3_ATCmdAdd','Hero3_DFCmdAdd','Hero3_MagicDFCmdAdd','BattlePropertyModifier','PropertyModifyType_Hero3']
          excerpts={}
          for p in pats:
            hits=[]
            for m in re.finditer(re.escape(p),dump):
              hits.append(dump[max(0,m.start()-1200):min(len(dump),m.end()+2400)])
              if len(hits)>=8: break
            excerpts[p]=hits
          result={'status':'PASS','targetRva':hex(target),'ownerMethod':owner,'namedMethods':named[:200],'excerptCounts':{k:len(v) for k,v in excerpts.items()}}
          (O/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          (O/'dump-excerpts.txt').write_text('\n\n'.join('===== '+k+' =====\n'+ '\n---\n'.join(v) for k,v in excerpts.items()),errors='replace')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage11c-bond-runtime
          path: out/stage11c-bond-runtime
          retention-days: 7
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-stage11c-bond-runtime-probe.yml
          git commit -m "Remove temporary Stage11C probe"
          git push origin HEAD:${GITHUB_REF_NAME}
