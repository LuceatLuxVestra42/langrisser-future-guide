name: Hero portrait Stage 4-2 gap inventory

on:
  push:
    branches:
      - work/hero-portrait-stage4-2-uncovered-source-fallback-proof
    paths:
      - scripts/hero_portrait_stage4_2_gap_inventory.py
      - .github/workflows/hero-portrait-stage4-2-gap-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen gap inventory
        run: python scripts/hero_portrait_stage4_2_gap_inventory.py
      - name: Commit gap inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2-gap-inventory.v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Inventory Hero portrait Stage 4-2 gaps'
            git push
          fi
