name: Soldier T3 Korean Names 136 1039

on:
  push:
    branches:
      - fix/soldier-t3-kr-names-136-137
    paths:
      - '.github/workflows/soldier-t3-korean-names-136-1039.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply exact Korean mappings and validate canonical invariants
        run: node scripts/apply-soldier-t3-korean-names-136-1039.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build gate
        run: bun run build

      - name: Diff and exact target gate
        run: |
          set -euo pipefail
          git diff --check
          node <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync('data/generated/soldier-list-stage5-8.v1.json','utf8'));
          const expected = new Map([
            [136, ['烬色卫队','잿빛 호위대','LANCER']],
            [1039, ['断罪修女','단죄의 수녀','DEMON']],
          ]);
          for (const [id,[cn,kr,army]] of expected) {
            const row = list.records.find(r => r.soldierId === id);
            if (!row) throw new Error(`missing ${id}`);
            if (row.nameCn !== cn || row.nameKr !== kr || row.armyType !== army || row.tier !== 3) throw new Error(`identity mismatch ${id}`);
            if (row.nameKrStatus !== 'confirmed' || row.validationStatus !== 'PASS') throw new Error(`localization status mismatch ${id}`);
          }
          const t3 = list.records.filter(r => !r.isSp && r.tier === 3);
          const missing = t3.filter(r => !r.nameKr || r.nameKrStatus !== 'confirmed');
          if (t3.length !== 129 || missing.length !== 0) throw new Error(`T3 localization ${t3.length - missing.length}/${t3.length}`);
          console.log('PASS: T3 Korean localization 129/129; exact IDs 136 and 1039 fixed');
          NODE

      - name: Commit generated localization update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/soldier-list-stage5-8.v1.json \
            data/generated/soldier-detail-stage5-2.v1.json \
            public/data/soldier-detail-stage5-6.v1.json \
            data/validation/soldier-t3-korean-names-136-1039.v1.json \
            data/checkpoints/soldier-t3-korean-names-136-1039.txt
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Finalize two T3 Soldier Korean names"
          git push origin HEAD:fix/soldier-t3-kr-names-136-137
