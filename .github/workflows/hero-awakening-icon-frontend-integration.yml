name: Hero Awakening Icon Frontend Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hero-awakening-icon-frontend-integration.yml'
      - 'scripts/validate-hero-awakening-icon-frontend-integration.mjs'
      - 'src/lib/hero-skill-icon-assets.ts'
      - 'data/generated/hero-skill-icon-assets.v1.json'
      - 'data/generated/hero-awakening-icon-asset-validation.v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frontend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without creating a lockfile
        run: npm install --no-package-lock
      - name: Record worktree state before validation
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/a8-before.txt"
      - name: Validate A8 exact-path frontend integration
        run: node scripts/validate-hero-awakening-icon-frontend-integration.mjs
      - name: Build frontend
        run: npm run build
      - name: Require no repository mutation
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/a8-after.txt"
          diff -u "$RUNNER_TEMP/a8-before.txt" "$RUNNER_TEMP/a8-after.txt"
