name: Deploy and Hosted QA Equipment Korean Names

on:
  push:
    branches:
      - deploy/equipment-korean-names-20260827
    paths:
      - '.github/workflows/deploy-hosted-qa-equipment-korean-names.yml'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hosted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deployment baseline
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='5b81f1bbc916ba83dfd5c406273383c3da2b6a6f'
          git cat-file -e "$EXPECTED_MAIN^{commit}"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          printf '%s\n' "$EXPECTED_MAIN" > /tmp/equipment-main-source.txt

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Korean equipment-name presentation
        run: node scripts/build-equipment-name-kr-presentation.mjs

      - name: Verify localization projection
        run: |
          node <<'NODE'
          const p = require('./data/generated/equipment-name-kr-user-approved.v1.json');
          const v = require('./data/validation/equipment-name-kr-user-approved-summary.v1.json');
          if (p.status !== 'PASS_USER_APPROVED_EQUIPMENT_KR_PRESENTATION') throw new Error('projection status mismatch');
          if (p.counts.canonical !== 390 || p.counts.public !== 373 || p.counts.publicNameKr !== 373 || p.counts.nonPublic !== 17 || p.counts.unresolvedNonPublic !== 17) throw new Error('projection counts mismatch');
          if (v.status !== 'PASS' || v.runtimeNameJoin !== false || v.productionJoinKey !== 'equipmentId') throw new Error('projection policy mismatch');
          NODE

      - name: Re-run frozen Equipment admission QA
        run: bun scripts/validate-equipment-stage4-6-admission-route-qa.mjs

      - name: Production static build
        run: bun run build

      - name: Verify static Equipment candidate and current Soldier v9 assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          test -f dist/client/equipment/index.html
          test -f dist/client/equipment/exclusive/index.html
          EQUIPMENT_DETAIL_COUNT="$(find dist/client/equipment -mindepth 2 -maxdepth 2 -type f -name index.html | grep -E '/equipment/[0-9]+/index\.html$' | wc -l | tr -d ' ')"
          test "$EQUIPMENT_DETAIL_COUNT" -eq 373
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const p = require('./data/generated/equipment-name-kr-user-approved.v1.json');
          const soldierV9 = require('./data/generated/soldier-portrait-manifest.v9.json');
          const entries = Object.entries(p.byEquipmentId).map(([id, r]) => ({ equipmentId: Number(id), ...r }));
          const pub = entries.filter((r) => r.pageReady === true);
          const hidden = entries.filter((r) => r.pageReady !== true);
          if (pub.length !== 373 || hidden.length !== 17) throw new Error('public/non-public split mismatch');
          const listHtml = fs.readFileSync('dist/client/equipment/index.html', 'utf8') + '\n' + fs.readFileSync('dist/client/equipment/exclusive/index.html', 'utf8');
          for (const r of pub) {
            if (!r.nameKr) throw new Error(`public equipment missing nameKr: ${r.equipmentId}`);
            const detail = path.join('dist/client/equipment', String(r.equipmentId), 'index.html');
            if (!fs.existsSync(detail)) throw new Error(`missing public detail: ${r.equipmentId}`);
            const html = fs.readFileSync(detail, 'utf8');
            if (!html.includes(r.nameKr)) throw new Error(`detail missing Korean name ${r.equipmentId}: ${r.nameKr}`);
            if (!listHtml.includes(r.nameKr)) throw new Error(`list surfaces missing Korean name ${r.equipmentId}: ${r.nameKr}`);
          }
          for (const r of hidden) {
            if (r.nameKr !== null) throw new Error(`non-public equipment exposed nameKr: ${r.equipmentId}`);
            const detail = path.join('dist/client/equipment', String(r.equipmentId), 'index.html');
            if (fs.existsSync(detail)) throw new Error(`non-public detail unexpectedly generated: ${r.equipmentId}`);
          }
          if (soldierV9.version !== 9 || soldierV9.status !== 'PASS' || soldierV9.coverage?.resolvedCount !== 224 || soldierV9.records?.length !== 224) {
            throw new Error('Soldier portrait v9 manifest mismatch');
          }
          for (const r of soldierV9.records) {
            const asset = path.join('dist/client/images/soldiers', r.fileName);
            if (!fs.existsSync(asset)) throw new Error(`missing Soldier v9 asset ${r.soldierId}:${r.fileName}`);
            const sha256 = crypto.createHash('sha256').update(fs.readFileSync(asset)).digest('hex');
            if (sha256 !== r.sha256) throw new Error(`Soldier v9 hash mismatch ${r.soldierId}:${r.fileName}`);
          }
          console.log(`Static PASS: Equipment ${pub.length}/373 Korean names; ${hidden.length}/17 blocked; Soldier v9 224/224 hashes.`);
          NODE
          grep -q '/langrisser-future-guide/' dist/client/equipment/index.html
          cp /tmp/equipment-main-source.txt dist/client/qa-main-source.txt
          printf '%s\n' "$GITHUB_SHA" > dist/client/qa-deploy-source.txt
          printf '%s\n' 'equipment-korean-names-373-soldier-v9' > dist/client/qa-surface.txt

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/client
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy current main with Korean equipment names ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Wait for deployed source markers over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://luceatluxvestra42.github.io/langrisser-future-guide'
          EXPECTED_MAIN='5b81f1bbc916ba83dfd5c406273383c3da2b6a6f'
          EXPECTED_SURFACE='equipment-korean-names-373-soldier-v9'
          for i in {1..30}; do
            MAIN="$(curl -fsSL --retry 2 --retry-delay 1 "$BASE/qa-main-source.txt" || true)"
            SURFACE="$(curl -fsSL --retry 2 --retry-delay 1 "$BASE/qa-surface.txt" || true)"
            if [ "$MAIN" = "$EXPECTED_MAIN" ] && [ "$SURFACE" = "$EXPECTED_SURFACE" ]; then
              echo "Hosted deployment markers reached expected current-main Equipment build."
              exit 0
            fi
            sleep 5
          done
          echo "Hosted markers did not reach expected current-main deployment" >&2
          exit 1

      - name: Hosted HTTP gate - all Equipment names and routes
        run: |
          node --input-type=commonjs <<'NODE'
          const projection = require('./data/generated/equipment-name-kr-user-approved.v1.json');
          const BASE = 'https://luceatluxvestra42.github.io/langrisser-future-guide';
          (async () => {
            const all = Object.entries(projection.byEquipmentId).map(([id, r]) => ({ equipmentId: Number(id), ...r }));
            const pub = all.filter((r) => r.pageReady);
            const hidden = all.filter((r) => !r.pageReady);
            const [general, exclusive] = await Promise.all([fetch(`${BASE}/equipment/`), fetch(`${BASE}/equipment/exclusive/`)]);
            if (general.status !== 200 || exclusive.status !== 200) throw new Error(`list HTTP ${general.status}/${exclusive.status}`);
            const combined = `${await general.text()}\n${await exclusive.text()}`;
            for (const r of pub) if (!combined.includes(r.nameKr)) throw new Error(`hosted lists missing ${r.equipmentId}:${r.nameKr}`);
            async function batches(records, size, check) {
              for (let i = 0; i < records.length; i += size) await Promise.all(records.slice(i, i + size).map(check));
            }
            await batches(pub, 20, async (r) => {
              const res = await fetch(`${BASE}/equipment/${r.equipmentId}/`);
              if (res.status !== 200) throw new Error(`public ${r.equipmentId} HTTP ${res.status}`);
              const html = await res.text();
              if (!html.includes(r.nameKr)) throw new Error(`public ${r.equipmentId} missing ${r.nameKr}`);
            });
            await batches(hidden, 20, async (r) => {
              const res = await fetch(`${BASE}/equipment/${r.equipmentId}/`, { redirect: 'manual' });
              if (res.status !== 404) throw new Error(`non-public ${r.equipmentId} expected 404 got ${res.status}`);
            });
            console.log(`Hosted HTTP PASS: list names ${pub.length}/373; public detail ${pub.length}/373; blocked ${hidden.length}/17.`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Prepare Chromium browser QA
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Chromium Browser UI Gate - Equipment list and four detail groups
        run: |
          cat > hosted-equipment-browser.cjs <<'BROWSER'
          const { chromium } = require('@playwright/test');
          const projection = require('./data/generated/equipment-name-kr-user-approved.v1.json');
          const generalList = require('./data/generated/equipment_stage3_3_general_list.json');
          const BASE = 'https://luceatluxvestra42.github.io/langrisser-future-guide';
          const records = Object.entries(projection.byEquipmentId)
            .map(([id, r]) => ({ equipmentId: Number(id), ...r }))
            .filter((r) => r.pageReady);
          const byId = new Map(records.map((r) => [r.equipmentId, r]));
          const general = byId.get(generalList.records[0].equipmentId);
          if (!general?.nameKr) throw new Error('General list representative is missing');
          function representative(group) {
            const r = records.find((x) => x.sourceGroup === group && x.nameKr);
            if (!r) throw new Error(`Missing representative for ${group}`);
            return r;
          }
          async function checkPage(browser, label, url, nameKr, refresh) {
            const page = await browser.newPage();
            const pageErrors = [];
            page.on('pageerror', (e) => pageErrors.push(e.message));
            const response = await page.goto(url, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`${label} navigation HTTP ${response?.status()}`);
            await page.getByText(nameKr, { exact: true }).first().waitFor({ state: 'visible' });
            if (pageErrors.length) throw new Error(`${label} page errors: ${pageErrors.join(' | ')}`);
            if (refresh) {
              const reload = await page.reload({ waitUntil: 'networkidle' });
              if (!reload || reload.status() !== 200) throw new Error(`${label} refresh HTTP ${reload?.status()}`);
              await page.getByText(nameKr, { exact: true }).first().waitFor({ state: 'visible' });
            }
            await page.close();
            console.log(`Browser PASS: ${label} -> ${nameKr}`);
          }
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await checkPage(browser, 'equipment-list', `${BASE}/equipment/`, general.nameKr, false);
              for (const group of ['weapon', 'armor', 'headgear', 'accessory']) {
                const r = representative(group);
                await checkPage(browser, group, `${BASE}/equipment/${r.equipmentId}/`, r.nameKr, true);
              }
            } finally {
              await browser.close();
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          BROWSER
          node hosted-equipment-browser.cjs
