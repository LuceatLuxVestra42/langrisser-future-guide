name: Hero portrait Stage 4-2B series-index probe

on:
  push:
    branches:
      - work/hero-portrait-stage4-2b-explicit-fallback-source-acquisition
    paths:
      - scripts/hero_portrait_stage4_2b_series_index_probe.py
      - .github/workflows/hero-portrait-stage4-2b-series-index-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install 'gdown==6.1.0'
      - name: Crawl series index and apply exact runtime bridge
        run: python scripts/hero_portrait_stage4_2b_series_index_probe.py
      - name: Commit probe result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2b-series-index-probe.v1.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Probe Hero portrait Stage 4-2B series index'
            git push
          fi
