name: Hero Exclusive Equipment Relation Stage B-4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-exclusive-equipment-relation-stageB4.yml'
      - 'scripts/validate_hero_exclusive_equipment_relation_stageB4.cjs'
      - 'data/contracts/hero-exclusive-equipment-relation-validation-contract.v1.json'
      - 'data/generated/hero-exclusive-equipment-relations.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'data/generated/equipment_stage2_7_acquisition.json'
      - 'data/validation/hero-exclusive-equipment-relation-stageB3-summary.v1.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Stage B-4 relation and cardinality
        run: node scripts/validate_hero_exclusive_equipment_relation_stageB4.cjs
      - name: Persist Stage B-4 validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/hero-exclusive-equipment-relation-stageB4-validation.v1.json
          if git diff --cached --quiet; then
            echo "No Stage B-4 changes"
            exit 0
          fi
          git commit -m "Freeze Stage B-4 relation validation and cardinality"
          git push
