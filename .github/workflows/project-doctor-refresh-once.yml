name: Project Doctor Refresh Once

on:
  push:
    branches:
      - work/project-doctor-closeout
    paths:
      - .github/workflows/project-doctor-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/project-doctor-closeout
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh D1 and D5
        run: node scripts/run-project-doctor-d5-refresh.mjs

      - name: Commit refreshed Doctor outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/project-doctor-d1-1-status.v1.json \
            data/validation/project-doctor-d1-1-summary.v1.json \
            data/validation/project-doctor-d1-2-summary.v1.json \
            data/generated/project-doctor-d5-freshness.v1.json
          if git diff --cached --quiet; then
            echo "No refresh changes required."
            exit 0
          fi
          git commit -m "chore: refresh Project Doctor D1/D5"
          git push origin HEAD:work/project-doctor-closeout
