name: Temporary SkillCost Generated Regeneration

on:
  push:
    branches:
      - work/skill-cost-generated-regeneration
    paths:
      - '.github/workflows/temp-skill-cost-regenerate-generated.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/skill-cost-generated-regeneration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Hero Stage 6-1 detail integration
        run: node scripts/build_hero_stage6_1_detail.cjs
      - name: Build Hero Stage 6-2 representative fixture QA
        run: node scripts/build_hero_stage6_2_fixture_qa.cjs
      - name: Build, validate, and shard Hero Stage 6-3 full generation
        run: |
          node scripts/run_hero_stage6_3_full_generation.cjs
          node scripts/shard_hero_stage6_3_output.cjs
      - name: Commit regenerated outputs and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-skill-cost-regenerate-generated.yml
          git add \
            data/generated/hero-detail-stage6-1.v1.json \
            data/validation/hero-stage6-1-final.v1.json \
            data/generated/hero-stage6-2-representative-fixtures.v1.json \
            data/validation/hero-stage6-2-final.v1.json \
            data/generated/hero-detail.v1.json \
            data/generated/hero-detail-shared.v1.json \
            data/generated/hero-detail/by-id \
            data/validation/hero-stage6-3-final.v1.json \
            data/checkpoints/hero-stage6-3-full-generation.json \
            data/checkpoints/hero-stage6-3-full-generation.md \
            .github/workflows/temp-skill-cost-regenerate-generated.yml
          if git diff --cached --quiet; then
            echo 'No generated output changes detected.'
          else
            git commit -m 'Regenerate Hero generated outputs with SkillCost'
            git push origin HEAD:work/skill-cost-generated-regeneration
          fi
