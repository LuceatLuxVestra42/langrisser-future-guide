name: Temporary R4 Hero3 unit scan
on:
  push:
    paths: ['.github/workflows/tmp-r4-unit-scan.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate and scan Hero3 command properties
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/r4-unit-scan
          node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir /tmp/langrisser-configdata-source > out/r4-unit-scan/hydration.json
          node <<'NODE' | tee out/r4-unit-scan/result.txt
          const fs=require('fs');
          const root='/tmp/langrisser-configdata-source/data/configdata';
          const rows=x=>Array.isArray(x)?x:(x.records||[]);
          const buffs=rows(JSON.parse(fs.readFileSync(`${root}/ConfigDataBuffInfo.json`,'utf8')));
          const props=[93,94,95,96]; const hits=[];
          for(const b of buffs){
            for(let i=1;i<=8;i++){
              const id=Number(b[`Property${i}_ID`]); if(!props.includes(id)) continue;
              hits.push({buffId:b.ID,name:b.Name,desc:b.Desc,propertyId:id,value:Number(b[`Property${i}_Value`])});
            }
          }
          console.log('HIT_COUNT='+hits.length);
          const by={}; for(const h of hits){(by[h.propertyId]??=[]).push(h)}
          for(const id of props){
            const arr=by[id]||[]; const vals=[...new Set(arr.map(x=>x.value))].sort((a,b)=>a-b);
            console.log(`PROPERTY=${id};COUNT=${arr.length};VALUES=${JSON.stringify(vals)}`);
            for(const v of vals){const ex=arr.find(x=>x.value===v); console.log('EXAMPLE='+JSON.stringify(ex));}
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-unit-scan
          path: out/r4-unit-scan
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-r4-unit-scan.yml
          git commit -m 'Remove temporary R4 Hero3 unit scan'
          git push origin HEAD:${GITHUB_REF_NAME}
