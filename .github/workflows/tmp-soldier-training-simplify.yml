name: Temporary Soldier Training Simplify

on:
  push:
    branches:
      - work/soldier-training-simplify-detail

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/soldier-training-simplify-detail
      - name: Simplify Training Hall presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/soldiers_.training.tsx')
          text = path.read_text()

          note = '''      <p className="mt-3 text-[11px] leading-5 text-muted-foreground">\n        {isUltimateTrainingTech(tech)\n          ? "궁극 특훈 문구는 검증된 원문과 레벨별 수치를 그대로 반영해."\n          : "조건부 효과 문구는 검증된 원문 조건과 레벨별 수치를 그대로 반영해."}\n      </p>\n'''
          if note not in text:
              raise SystemExit('target explanatory note block not found')
          text = text.replace(note, '', 1)

          table = '''                <div className="mt-5">\n                  <h4 className="text-sm font-black text-foreground">전체 레벨표</h4>\n                  <div className="mt-2 overflow-hidden rounded-lg border border-border">\n                    {selectedTech.levels.map((row) => (\n                      <button\n                        key={row.level}\n                        type="button"\n                        onClick={() => setLevel(row.level)}\n                        className={`grid w-full grid-cols-[52px_minmax(0,1fr)] border-b border-border px-3 py-2.5 text-left text-xs last:border-b-0 ${\n                          safeLevel === row.level ? "bg-muted" : "bg-card hover:bg-muted/60"\n                        }`}\n                      >\n                        <span className="font-black text-foreground">Lv.{row.level}</span>\n                        <span className="min-w-0 leading-5 text-muted-foreground">\n                          <span className="block">\n                            {row.statEffects ? formatStatEffects(row.statEffects) : stripColorTags(row.passiveDescriptionKr ?? "-")}\n                          </span>\n                          <span className="mt-1 block text-[10px] font-semibold text-muted-foreground/80">\n                            강화 비용 · 골드 {formatNumber(row.goldCost)} · 재료 {row.materialCosts.length}종\n                          </span>\n                        </span>\n                      </button>\n                    ))}\n                  </div>\n                </div>\n'''
          if table not in text:
              raise SystemExit('target full level table block not found')
          text = text.replace(table, '', 1)

          if '전체 레벨표' in text:
              raise SystemExit('full level table label still present')
          if '궁극 특훈 문구는 검증된 원문과 레벨별 수치를 그대로 반영해.' in text:
              raise SystemExit('ultimate note still present')
          if '조건부 효과 문구는 검증된 원문 조건과 레벨별 수치를 그대로 반영해.' in text:
              raise SystemExit('conditional note still present')

          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-soldier-training-simplify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/soldiers_.training.tsx .github/workflows/tmp-soldier-training-simplify.yml
          git commit -m "Simplify Training Hall detail presentation"
          git push origin HEAD:work/soldier-training-simplify-detail
