name: Localization Audit Stage 3 Check

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Print Stage 3 baseline
        run: node scripts/audit-localization-stage3.mjs --json
      - name: Run Stage 3 self-tests
        run: node scripts/audit-localization-stage3.mjs --self-test
