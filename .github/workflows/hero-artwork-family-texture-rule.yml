name: Hero Artwork Family Texture2D Rule

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-hero-artwork-family-texture-rule.py'
      - '.github/workflows/hero-artwork-family-texture-rule.yml'

permissions:
  contents: read

jobs:
  texture2d-rule:
    if: github.event.pull_request.head.ref == 'work/hero-asset-launcher-probe'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install UnityPy
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet UnityPy
      - name: Validate representative Prefab to Sprite to Texture2D chains
        shell: pwsh
        run: python scripts/probe-hero-artwork-family-texture-rule.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-artwork-family-texture-rule-report
          path: ${{ runner.temp }}/langrisser-hero-artwork-family-texture-rule/report
          if-no-files-found: warn
          retention-days: 3
