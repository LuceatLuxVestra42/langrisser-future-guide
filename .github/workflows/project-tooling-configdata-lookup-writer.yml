name: Project Tooling ConfigData Lookup Writer

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Existing work branch that will receive refreshed ConfigData Lookup materialization
        required: true
        default: work/configdata-lookup-stage6-incremental
        type: string
      confirmation:
        description: Type APPLY_CONFIGDATA_LOOKUP_REBUILD to enable the writer
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: project-tooling-configdata-lookup-writer-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  explicit-materialization-writer:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit writer request
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'APPLY_CONFIGDATA_LOOKUP_REBUILD'
          [[ "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$TARGET_BRANCH" != -* ]]
          [[ "$TARGET_BRANCH" != *'..'* ]]
          test "$TARGET_BRANCH" != 'main'
          test "$TARGET_BRANCH" != 'gh-pages'
          [[ "$TARGET_BRANCH" == work/* ]]

      - name: Checkout explicit work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure external ConfigData source root
        shell: bash
        run: echo "CONFIGDATA_SOURCE_ROOT=$RUNNER_TEMP/configdata-lookup-writer-source" >> "$GITHUB_ENV"

      - name: Hydrate and verify pinned ConfigData source pack outside repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONFIGDATA_SOURCE_ROOT"
          node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir "$CONFIGDATA_SOURCE_ROOT"
          count="$(find "$CONFIGDATA_SOURCE_ROOT/data/configdata" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$count" = "753"
          case "$CONFIGDATA_SOURCE_ROOT/" in
            "$GITHUB_WORKSPACE/"*) echo 'external ConfigData source root must stay outside repository' >&2; exit 1 ;;
          esac

      - name: Make tracked ConfigData unavailable during writer execution
        shell: bash
        run: |
          set -euo pipefail
          tracked_raw="$GITHUB_WORKSPACE/data/configdata"
          hidden_raw="$RUNNER_TEMP/configdata-writer-tracked-hidden"
          rm -rf "$hidden_raw"
          if [ -d "$tracked_raw" ]; then
            mv "$tracked_raw" "$hidden_raw"
          fi
          test ! -e "$tracked_raw"

      - name: Validate Stage 5 predecessor through current compatibility gate
        run: npm run validate:configdata-lookup-stage5

      - name: Apply incremental materialization
        run: node tools/configdata-lookup/cli/rebuild.mjs --apply --json

      - name: Validate Stage 6 materialization through current compatibility gate
        run: node tools/configdata-lookup/test/configdata-lookup-stage6-current-validator.mjs

      - name: Require clean stale plan through current source-root adapter
        run: node tools/configdata-lookup/cli/check-freshness.mjs

      - name: Restore tracked ConfigData when present in this revision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tracked_raw="$GITHUB_WORKSPACE/data/configdata"
          hidden_raw="$RUNNER_TEMP/configdata-writer-tracked-hidden"
          if [ -d "$hidden_raw" ]; then
            test ! -e "$tracked_raw"
            mv "$hidden_raw" "$tracked_raw"
          fi

      - name: Commit only ConfigData Lookup materialization
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/index/hero.v1.json \
            data/index/soldier.v1.json \
            data/index/skill.v1.json \
            data/index/equipment.v1.json \
            data/index/forward \
            data/index/reverse \
            data/index/overlay \
            data/index/configdata-lookup-dependency-manifest.v1.json \
            data/validation/configdata-lookup-stage1-summary.v1.json \
            data/validation/configdata-lookup-stage2-summary.v1.json \
            data/validation/configdata-lookup-stage3-summary.v1.json \
            data/validation/configdata-lookup-stage4-summary.v1.json \
            data/validation/configdata-lookup-stage5-summary.v1.json \
            data/validation/configdata-lookup-stage6-summary.v1.json
          if git diff --cached --quiet; then
            echo 'ConfigData Lookup materialization is already current.'
            exit 0
          fi
          git commit -m 'Refresh ConfigData Lookup materialization'
          git push origin "HEAD:${TARGET_BRANCH}"
