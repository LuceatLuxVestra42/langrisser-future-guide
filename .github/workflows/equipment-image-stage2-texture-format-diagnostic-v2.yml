name: Equipment Image Stage 2 Texture Format Diagnostic v2

on:
  push:
    branches:
      - work/equipment-image-stage2-apk-final373-v2
    paths:
      - scripts/diagnose-equipment-image-stage2-texture-format-v2.py
      - .github/workflows/equipment-image-stage2-texture-format-diagnostic-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check UnityPy Pillow

      - name: Inspect representative Texture2D formats
        run: python scripts/diagnose-equipment-image-stage2-texture-format-v2.py
