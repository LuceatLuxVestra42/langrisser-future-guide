name: tmp-stage6-3-provenance-refresh

on:
  push:
    branches:
      - fix/sp-reward-skill-cost
    paths:
      - .github/workflows/tmp-stage6-3-provenance-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Regenerate Stage 6-3 from committed upstreams
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_hero_stage6_3_full_generation.cjs
          node scripts/shard_hero_stage6_3_output.cjs
          node <<'NODE'
          const fs = require('fs');
          const v = require('./data/validation/hero-stage6-3-final.v1.json');
          if (!['PASS','PASS_WITH_REVIEW'].includes(v.status) || v.completion !== 'COMPLETE' || (v.summary?.hardErrorCount ?? 1) !== 0) {
            throw new Error(`Stage6-3 ${v.status}/${v.completion}/hard=${v.summary?.hardErrorCount}`);
          }
          const stage61ValidationSha = require('child_process').execFileSync('git', ['rev-parse', 'HEAD:data/validation/hero-stage6-1-final.v1.json'], {encoding:'utf8'}).trim();
          const recorded = v.sources?.['data/validation/hero-stage6-1-final.v1.json']?.gitBlobSha;
          if (recorded !== stage61ValidationSha) throw new Error(`Stage6-1 validation provenance mismatch recorded=${recorded} actual=${stage61ValidationSha}`);
          const files = fs.readdirSync('./data/generated/hero-detail/by-id').filter(x => x.endsWith('.json'));
          if (files.length !== 267) throw new Error(`expected 267 shards, got ${files.length}`);
          console.log(JSON.stringify({status:v.status, completion:v.completion, hardErrorCount:v.summary?.hardErrorCount, stage61ValidationSha, shardCount:files.length}, null, 2));
          NODE

      - name: Audit and commit expected refresh
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-stage6-3-provenance-refresh.yml
          python3 <<'PY'
          import subprocess, sys
          allowed_exact={
            'data/generated/hero-detail.v1.json',
            'data/generated/hero-detail-shared.v1.json',
            'data/validation/hero-stage6-3-final.v1.json',
            'data/checkpoints/hero-stage6-3-full-generation.json',
            'data/checkpoints/hero-stage6-3-full-generation.md',
            '.github/workflows/tmp-stage6-3-provenance-refresh.yml',
          }
          out=subprocess.check_output(['git','status','--porcelain'], text=True)
          bad=[]
          for line in out.splitlines():
            p=line[3:]
            if ' -> ' in p: p=p.split(' -> ',1)[1]
            if p in allowed_exact or p.startswith('data/generated/hero-detail/by-id/'):
              continue
            bad.append(line)
          print(out)
          if bad:
            print('unexpected tracked mutation:', *bad, sep='\n', file=sys.stderr)
            sys.exit(1)
          PY
          git add data/generated/hero-detail.v1.json \
            data/generated/hero-detail-shared.v1.json \
            data/generated/hero-detail/by-id \
            data/validation/hero-stage6-3-final.v1.json \
            data/checkpoints/hero-stage6-3-full-generation.json \
            data/checkpoints/hero-stage6-3-full-generation.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(hero): refresh Stage6-3 frozen provenance'
          git pull --rebase origin fix/sp-reward-skill-cost
          git push origin HEAD:fix/sp-reward-skill-cost
