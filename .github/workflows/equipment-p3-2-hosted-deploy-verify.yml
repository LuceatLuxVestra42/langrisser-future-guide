name: Equipment P3-2 Hosted Deploy Verify

on:
  push:
    branches:
      - qa/equipment-p3-2-hosted-deploy-verify-20260829
    paths:
      - '.github/workflows/equipment-p3-2-hosted-deploy-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equipment-p3-2-hosted-deploy-verify
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 4e3743306c4d13e9fe5a9c3867e257f3b171bf3b
  HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/

jobs:
  hosted-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current-main QA candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Assert branch predecessor is the frozen current main
        shell: bash
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$EXPECTED_MAIN_SHA"
          grep -q 'equipment-p3-1-release-metadata.v1.json' src/lib/equipment-page.localized.server.ts
          grep -q 'equipmentReleaseProjection.defaultOrderEquipmentIds' src/lib/equipment-page.localized.server.ts
          grep -q '같은 세부 타입 안에서는 확인된 출시 그룹 기준 최신순' src/routes/equipment.tsx
          echo "PASS current main predecessor ${actual_parent}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen project dependencies
        run: bun install --frozen-lockfile

      - name: Reuse proven GitHub Pages static build config
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin deploy/soldier-lower-tier-kr-names-20260828
          git show FETCH_HEAD:vite.config.ts > vite.config.ts
          grep -q 'GitHub Pages deployment-only static build config' vite.config.ts
          grep -q 'base: "/langrisser-future-guide/"' vite.config.ts
          grep -q 'nitro: false' vite.config.ts

      - name: Build static GitHub Pages candidate
        run: bun run build

      - name: TypeScript gate after generated build inputs
        run: bunx tsc --noEmit

      - name: Static Equipment P3-2 gate
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          test -f dist/client/equipment/index.html
          test -f dist/client/equipment/642/index.html
          test -f dist/client/equipment/299/index.html
          cp dist/client/index.html dist/client/404.html
          printf '%s\n' "$EXPECTED_MAIN_SHA" > dist/client/qa-equipment-p3-2-source-main.txt
          printf '%s\n' 'equipment-p3-2-hosted-deploy-verify' > dist/client/qa-surface.txt
          grep -q '장비패스' dist/client/equipment/index.html
          grep -q '같은 세부 타입 안에서는 확인된 출시 그룹 기준 최신순' dist/client/equipment/index.html
          grep -q '2026-07-16' dist/client/equipment/642/index.html
          grep -q '2019-05-09' dist/client/equipment/299/index.html
          echo 'PASS static Equipment P3-2 gate'

      - name: Publish current-main candidate to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist/client
          touch .nojekyll
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b gh-pages
          git add -A
          git commit -m "Equipment P3-2 Hosted verify: deploy ${EXPECTED_MAIN_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify hosted deployment marker and P3-2 chronology
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { chromium } from 'playwright';

          const projection = JSON.parse(readFileSync('data/presentation/equipment-p3-1-release-metadata.v1.json', 'utf8'));
          const expectedPolicy = '장비 종류·세부 타입 순서를 유지하고, 같은 세부 타입 안에서는 확인된 출시 그룹 기준 최신순이야. 같은 출시 그룹 안의 개별 순서는 별도 출시순 의미가 없어.';
          const expectedMainSha = process.env.EXPECTED_MAIN_SHA;
          const base = (process.env.HOSTED_BASE_URL ?? '').replace(/\/?$/, '/');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          let markerReady = false;
          let markerLast = null;
          for (let attempt = 1; attempt <= 36; attempt += 1) {
            try {
              const response = await fetch(new URL('qa-equipment-p3-2-source-main.txt', base), { cache: 'no-store' });
              markerLast = response.ok ? (await response.text()).trim() : `HTTP ${response.status}`;
              if (markerLast === expectedMainSha) {
                markerReady = true;
                break;
              }
            } catch (error) {
              markerLast = String(error);
            }
            if (attempt < 36) await sleep(10_000);
          }
          assert(markerReady, `Hosted deployment marker mismatch: ${markerLast}`);

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          const badResponses = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));
          page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('response', (response) => {
            if (response.url().startsWith(base) && response.status() >= 400) badResponses.push({ url: response.url(), status: response.status() });
          });

          try {
            const response = await page.goto(new URL('equipment/', base).toString(), { waitUntil: 'networkidle', timeout: 45_000 });
            assert(response && response.status() < 400, `Equipment list failed: ${response?.status()}`);
            await page.getByRole('button', { name: /장비패스/ }).click();
            await page.getByText(expectedPolicy, { exact: true }).waitFor({ state: 'visible', timeout: 15_000 });

            const cardLinks = page.locator('section[aria-label="SSR 장비 이미지 목록"] a[href]');
            const cardCount = await cardLinks.count();
            assert(cardCount === projection.scope.targetCount, `Tab3 card count mismatch: ${cardCount}`);

            const actualIds = [];
            for (let index = 0; index < cardCount; index += 1) {
              const href = await cardLinks.nth(index).getAttribute('href');
              const match = href?.match(/\/equipment\/(\d+)\/?$/);
              assert(match, `Unexpected Equipment card href: ${href}`);
              actualIds.push(Number(match[1]));
            }
            assert(JSON.stringify(actualIds) === JSON.stringify(projection.defaultOrderEquipmentIds), `Tab3 default order mismatch: ${JSON.stringify(actualIds)}`);

            for (const [equipmentId, expectedDate] of [[642, '2026-07-16'], [299, '2019-05-09']]) {
              const detailResponse = await page.goto(new URL(`equipment/${equipmentId}/`, base).toString(), { waitUntil: 'networkidle', timeout: 45_000 });
              assert(detailResponse && detailResponse.status() < 400, `Equipment ${equipmentId} detail failed: ${detailResponse?.status()}`);
              const acquisitionSection = page.locator('section').filter({ has: page.getByRole('heading', { name: '획득 계열', exact: true }) }).first();
              await acquisitionSection.getByText('확인된 출시 그룹 날짜', { exact: true }).waitFor({ state: 'visible', timeout: 15_000 });
              await acquisitionSection.getByText(expectedDate, { exact: true }).waitFor({ state: 'visible', timeout: 15_000 });
              const text = await acquisitionSection.innerText();
              assert(!text.includes('REVIEW'), `Equipment ${equipmentId} acquisition still exposes REVIEW copy`);
            }

            assert(pageErrors.length === 0, `pageerror detected: ${JSON.stringify(pageErrors)}`);
            assert(consoleErrors.length === 0, `console error detected: ${JSON.stringify(consoleErrors)}`);
            assert(badResponses.length === 0, `hosted HTTP failure detected: ${JSON.stringify(badResponses)}`);

            console.log(JSON.stringify({
              status: 'PASS_EQUIPMENT_P3_2_HOSTED_CHRONOLOGY',
              expectedMainSha,
              hostedBaseUrl: base,
              tab3Count: cardCount,
              defaultOrderParity: 'PASS',
              detailDates: { 642: '2026-07-16', 299: '2019-05-09' },
              policyCopy: 'PASS',
              pageErrors: 0,
              consoleErrors: 0,
              hostedHttpFailures: 0,
              semanticStageReopened: false,
            }, null, 2));
          } finally {
            await browser.close();
          }
          NODE

      - name: Re-run Equipment Image hosted Browser regression
        run: node scripts/validate-equipment-image-stage3-browser-ui.mjs

      - name: Re-run Equipment P2 hosted search sort persistence regression
        run: node scripts/validate-equipment-p2-browser-ui.mjs

      - name: Re-run Equipment P1 hosted navigation regression
        shell: bash
        run: |
          node --input-type=module <<'RUNNER'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const workflow = readFileSync('.github/workflows/equipment-p1-closeout-hosted-qa.yml', 'utf8');
          const marker = "node --input-type=module <<'NODE'";
          const markerIndex = workflow.indexOf(marker);
          if (markerIndex < 0) throw new Error('P1 hosted navigation regression source marker is missing');
          const start = workflow.indexOf('\n', markerIndex) + 1;
          const end = workflow.indexOf('\n          NODE', start);
          if (end < 0) throw new Error('P1 hosted navigation regression terminator is missing');
          const code = workflow.slice(start, end).split('\n').map((line) => line.replace(/^          /, '')).join('\n');
          const child = spawnSync(process.execPath, ['--input-type=module'], { input: code, encoding: 'utf8', env: process.env });
          process.stdout.write(child.stdout ?? '');
          process.stderr.write(child.stderr ?? '');
          if (child.status !== 0) process.exit(child.status ?? 1);
          RUNNER

      - name: Print final deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote origin refs/heads/gh-pages
          echo "PASS Equipment P3-2 Hosted Deploy Verify for main ${EXPECTED_MAIN_SHA}"
