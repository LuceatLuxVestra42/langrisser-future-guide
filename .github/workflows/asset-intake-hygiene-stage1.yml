name: Asset Hygiene Stage 1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/asset-intake/contract/hygiene-scope.v1.json'
      - 'tools/asset-intake/contract/hygiene-stage1-inventory.v1.json'
      - 'tools/asset-intake/core/engine-v1.mjs'
      - 'tools/asset-intake/cli/run-hygiene-stage1-v1.mjs'
      - 'tools/asset-intake/cli/validate-hygiene-stage1-v1.mjs'
      - 'tools/asset-intake/hygiene/generated/**'
      - 'data/validation/asset-intake-hygiene-stage1-*'
      - 'docs/checkpoints/asset-intake-hygiene-stage1-*'
      - '.github/workflows/asset-intake-hygiene-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate frozen Stage 1 inventory
        run: node tools/asset-intake/cli/validate-hygiene-stage1-v1.mjs

  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject protected main as producer target
        run: |
          echo 'Asset Hygiene Stage 1 producer runs must target an explicit non-main branch.'
          exit 1

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate Stage 1 frozen inventory
        run: node tools/asset-intake/cli/run-hygiene-stage1-v1.mjs
      - name: Freeze generated inventory on explicit producer branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/asset-intake/hygiene/generated/asset-hygiene-inventory.v1.json \
            tools/asset-intake/hygiene/generated/asset-hygiene-duplicate-groups.v1.json \
            tools/asset-intake/hygiene/generated/asset-hygiene-basename-groups.v1.json \
            data/validation/asset-intake-hygiene-stage1-inventory-summary.v1.json \
            docs/checkpoints/asset-intake-hygiene-stage1-repository-inventory.md
          if git diff --cached --quiet; then
            echo 'Stage 1 inventory already matches the frozen baseline.'
          else
            git commit -m "Freeze Asset Hygiene Stage 1 inventory"
          fi
      - name: Validate committed Stage 1 inventory
        run: node tools/asset-intake/cli/validate-hygiene-stage1-v1.mjs
      - name: Push frozen Stage 1 artifacts
        run: git push origin HEAD:${{ github.ref_name }}
