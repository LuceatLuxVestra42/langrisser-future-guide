name: Skin Stage 2-2 Generate

on:
  push:
    paths:
      - '.github/workflows/skin-stage2-2-generate.yml'
      - 'scripts/generate-skin-stage2-2-reverse-index.py'
      - 'data/contracts/skin-stage2-input-contract.v1.json'
      - 'data/contracts/skin-stage2-2-reverse-index.v1.json'
      - 'data/generated/skin-stage2-1-forward-relation.v1.json'
      - 'data/validation/skin-stage2-1-final.v1.json'
      - 'data/hero-name-master.v1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate Skin Stage 2-2
        run: python scripts/generate-skin-stage2-2-reverse-index.py
      - name: Commit generated checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/skin-stage2-2-reverse-index.v1.json data/validation/skin-stage2-2-final.v1.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate Skin Stage 2-2 reverse index"
            git push
          fi
