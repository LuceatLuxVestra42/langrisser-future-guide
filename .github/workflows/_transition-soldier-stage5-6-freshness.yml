name: Transition Soldier Stage 5-6 Freshness

on:
  push:
    branches:
      - maintenance/soldier-stage5-6-freshness-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure transition commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh frozen Soldier Stage 5 and Stage 6 chain
        shell: bash
        run: |
          set -euo pipefail

          commit_stage() {
            local message="$1"
            git add -u data/generated data/validation
            if git diff --cached --quiet; then
              echo "${message}: no tracked changes"
            else
              echo "${message}:"
              git diff --cached --name-only
              git commit -m "${message}"
            fi
          }

          node scripts/finalize-soldier-stage5-2-combat.cjs
          commit_stage "Refresh Soldier stage 5-2 frozen provenance"

          node scripts/finalize-soldier-stage5-3-ability.cjs
          commit_stage "Refresh Soldier stage 5-3 frozen provenance"

          node scripts/finalize-soldier-stage5-4-training.cjs
          commit_stage "Refresh Soldier stage 5-4 frozen provenance"

          node scripts/finalize-soldier-stage5-5-heroes.cjs
          commit_stage "Refresh Soldier stage 5-5 frozen provenance"

          node scripts/finalize-soldier-stage5-6-sp-detail.cjs
          commit_stage "Refresh Soldier stage 5-6 frozen provenance"

          node scripts/finalize-soldier-stage5-7-list.cjs
          commit_stage "Refresh Soldier stage 5-7 frozen provenance"

          node scripts/finalize-soldier-stage5-8-release.cjs
          commit_stage "Refresh Soldier stage 5-8 frozen provenance"

          node scripts/finalize-soldier-stage6-1-full-records.cjs
          commit_stage "Refresh Soldier stage 6-1 frozen provenance"

          node scripts/finalize-soldier-stage6-2-classification.cjs
          commit_stage "Refresh Soldier stage 6-2 frozen provenance"

          node scripts/finalize-soldier-stage6-3-representative-qa.cjs
          commit_stage "Refresh Soldier stage 6-3 frozen provenance"

          node scripts/finalize-soldier-stage6-4-filter-qa.cjs
          commit_stage "Refresh Soldier stage 6-4 frozen provenance"

          node scripts/finalize-soldier-stage6-5-reciprocal-links.cjs
          commit_stage "Refresh Soldier stage 6-5 frozen provenance"

          node scripts/finalize-soldier-stage6-6-expansion-basis.cjs
          commit_stage "Refresh Soldier stage 6-6 frozen provenance"

          node scripts/finalize-soldier-stage6-7-site-admission.cjs
          commit_stage "Refresh Soldier stage 6-7 frozen provenance"

          node scripts/validate-soldier-stage6-7-final.mjs

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Unexpected uncommitted transition output remains."
            git status --short
            exit 1
          fi

          git push origin HEAD:${GITHUB_REF_NAME}
