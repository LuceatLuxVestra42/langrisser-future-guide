name: Hero Provisional Localization Stage 3 Producer

on:
  push:
    branches:
      - hero-provisional-localization-stage3

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: hero-provisional-localization-stage3
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply deterministic Stage 3 patch
        run: node scripts/apply-hero-provisional-localization-stage3.mjs

      - name: Validate Stage 2 predecessor
        run: npm run validate:hero-provisional-localization-stage2

      - name: Validate Localization Audit Stage 7 successor
        run: node scripts/audit-localization-stage7.mjs --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: TypeScript gate
        run: bunx tsc --noEmit

      - name: Diff check
        run: git diff --check

      - name: Commit generated consumer migration
        shell: bash
        run: |
          if git diff --quiet -- src/routes/heroes.tsx 'src/routes/heroes_.$heroId.tsx' package.json; then
            echo "Stage 3 consumer migration already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/heroes.tsx 'src/routes/heroes_.$heroId.tsx' package.json
          git commit -m "Adopt Hero provisional localization in routes"
          git push origin HEAD:hero-provisional-localization-stage3
