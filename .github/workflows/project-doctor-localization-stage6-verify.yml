name: Project Doctor Localization Stage 6 Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Preserve Regression Promotion V1
        run: node scripts/validate-regression-coverage-promotion.mjs
      - name: Validate Doctor D2 v2
        run: npm run doctor:impact:validate
      - name: Validate Doctor D3 v2
        run: npm run doctor:plan:validate
      - name: Validate Doctor D4 v2
        run: npm run doctor:run:validate
      - name: Validate Doctor D7 v2
        run: npm run doctor:pr-guard:validate
      - name: Validate Stage 5 frozen gate
        run: npm run audit:localization:check
      - name: Print Stage 6 baseline
        run: node scripts/validate-localization-audit-stage6.mjs --json
      - name: Stage 6 self-test
        run: node scripts/validate-localization-audit-stage6.mjs --self-test
