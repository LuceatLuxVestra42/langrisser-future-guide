name: Temporary R2 property target trace
on:
  push:
    paths:
      - '.github/workflows/tmp-r2-property-target-trace.yml'
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract official IL2CPP pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2 out/r2-property-target
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib,hashlib,json
          D=pathlib.Path('/tmp/r2'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          src={'installVersion':V,'files':{}}
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ent(u,hs(u)) if e[0]==target); raw=get(u,e); (D/out).write_bytes(raw); src['files'][out]={'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}
          pathlib.Path('out/r2-property-target/source.json').write_text(json.dumps(src,indent=2)+'\n')
          PY
      - name: Resolve property loader thunk and metadata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release > out/r2-property-target/dumper-build.log 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/r2/dump
          set +e
          dotnet "$DLL" /tmp/r2/GameAssembly.dll /tmp/r2/global-metadata.dat /tmp/r2/dump > out/r2-property-target/dumper.log 2>&1
          set -e
          test -f /tmp/r2/dump/dump.cs
          objdump -D -Mintel --start-address=0x18018c8f0 --stop-address=0x18018ca20 /tmp/r2/GameAssembly.dll > out/r2-property-target/property-loader-thunk.txt
          objdump -D -Mintel --start-address=0x1832b31d0 --stop-address=0x1832b3430 /tmp/r2/GameAssembly.dll > out/r2-property-target/buff-property-consumer.txt
          python <<'PY'
          from pathlib import Path
          import re,json
          s=Path('/tmp/r2/dump/dump.cs').read_text(errors='replace')
          terms=['GetConfigDataPropertyModifyInfo','ConfigDataPropertyModifyInfo','ConfigDataBuffInfo','Property1_ID','PropertyModifyType','IConfigDataLoader']
          out={}
          for term in terms:
            hits=[]
            for m in re.finditer(re.escape(term),s,re.I):
              hits.append(s[max(0,m.start()-1800):min(len(s),m.end()+3600)])
              if len(hits)>=12: break
            out[term]=hits
          Path('out/r2-property-target/excerpts.txt').write_text('\n\n'.join('===== '+k+' =====\n'+'\n---\n'.join(v) for k,v in out.items()))
          print(json.dumps({k:len(v) for k,v in out.items()},indent=2))
          PY
      - name: Hydrate pinned source and verify exact rows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir /tmp/langrisser-configdata-source > out/r2-property-target/hydration.json
          node <<'NODE' | tee out/r2-property-target/source-rows.txt
          const fs=require('fs');
          const root='/tmp/langrisser-configdata-source/data/configdata';
          const read=p=>JSON.parse(fs.readFileSync(`${root}/${p}`,'utf8'));
          const rows=x=>Array.isArray(x)?x:(x.records||[]);
          const buffs=rows(read('ConfigDataBuffInfo.json'));
          for(const id of [70009,70069]) console.log('BUFF_ROW='+JSON.stringify(buffs.find(r=>Number(r.ID)===id)));
          const props=rows(read('ConfigDataPropertyModifyInfo.json'));
          for(const id of [93,94,95,96]) console.log('PROPERTY_ROW='+JSON.stringify(props.find(r=>Number(r.ID)===id)));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-property-target-trace
          path: out/r2-property-target
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-r2-property-target-trace.yml
          git commit -m 'Remove temporary R2 property target trace'
          git push origin HEAD:${GITHUB_REF_NAME}
