name: Skin Stage 3-6 Fullart Validator Check

on:
  push:
    branches:
      - fix/skin-stage3-6-fullart-validator

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run updated Skin Stage 3-6 consumer validator
        run: node scripts/validate-skin-stage3-6-hero-detail-consumer.mjs
      - name: Verify no tracked mutation
        run: test -z "$(git status --porcelain --untracked-files=no)"
