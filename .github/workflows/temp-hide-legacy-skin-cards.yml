name: Temporary hide legacy Skin cards

on:
  push:
    branches:
      - fix/hero-detail-hide-legacy-skin-cards-20260901

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: fix/hero-detail-hide-legacy-skin-cards-20260901
          fetch-depth: 0

      - name: Patch Hero detail presentation only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/heroes_.$heroId.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace('import { useEffect, useState, type ReactNode } from "react";', 'import { useState, type ReactNode } from "react";')
          text = text.replace('  ChevronLeft,\n', '')
          text = text.replace('  ChevronRight,\n', '')

          text, n = re.subn(
              r'\ntype HeroVisual = \{.*?\n\};\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          assert n == 1, f'HeroVisual block replacements={n}'

          text, n = re.subn(
              r'\n  const visuals: HeroVisual\[\] = \[\];.*?\n  const moveVisual = \(delta: number\) => \{.*?\n  \};\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          assert n == 1, f'visual state block replacements={n}'

          old_image = '''              {activeVisual ? (\n                <img src={activeVisual.src} alt={`${displayName} ${activeVisual.label}`} className="absolute inset-0 h-full w-full object-contain object-bottom px-3 pt-4 sm:px-6 sm:pt-6" />\n              ) : ('''
          new_image = '''              {imageUrl ? (\n                <img src={imageUrl} alt={`${displayName} 대표 일러스트`} className="absolute inset-0 h-full w-full object-contain object-bottom px-3 pt-4 sm:px-6 sm:pt-6" />\n              ) : ('''
          assert old_image in text, 'activeVisual image block not found'
          text = text.replace(old_image, new_image, 1)

          text, n = re.subn(
              r'\n              \{visuals\.length > 1 \? \(.*?\n              \) : null\}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          assert n == 1, f'carousel controls replacements={n}'

          text, n = re.subn(
              r'\n              \{activeVisual \? \(\n                <div className="absolute bottom-4 right-4.*?\n              \) : null\}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          assert n == 1, f'visual indicator replacements={n}'

          forbidden = [
              'detail.presentation.skins)',
              'skin.publicPath',
              'visuals.length',
              'activeVisual',
              'moveVisual(',
              'ChevronLeft',
              'ChevronRight',
              'HeroVisual',
          ]
          for token in forbidden:
              assert token not in text, f'legacy Skin carousel token remains: {token}'

          assert 'detail.presentation.skinCount' in text, 'skinCount presentation data must remain'
          assert 'hero.card.webAssetPath' in text, 'base Hero artwork must remain'

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Remove temporary workflow and verify diff
        run: |
          rm .github/workflows/temp-hide-legacy-skin-cards.yml
          git diff --check
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | sort -u)"
          test "$changed" = 'src/routes/heroes_.$heroId.tsx'

      - name: Commit frontend-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/'heroes_.$heroId.tsx' .github/workflows/temp-hide-legacy-skin-cards.yml
          git commit -m 'Hide legacy Skin cards from Hero detail carousel'
          git push origin HEAD:fix/hero-detail-hide-legacy-skin-cards-20260901
