name: Temporary Stage11D freeze validate
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Stage 11D freeze
        run: node scripts/validate-hero-soldier-correction-stage11d.mjs
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-stage11d-freeze-validate.yml
          git commit -m "Remove temporary Stage11D freeze validator workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
