name: Equipment Stage 4-2 General List UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/equipment-stage4-2-general-list-ui.yml'
      - 'data/contracts/equipment-stage4-2-general-list-ui.v1.json'
      - 'scripts/validate-equipment-stage4-2-general-list-ui.mjs'
      - 'src/routes/equipment.tsx'
      - 'src/lib/equipment-page.server.ts'
      - 'src/lib/equipment-page.functions.ts'
      - 'data/validation/equipment-stage4-1-route-loader-summary.v1.json'
      - 'data/generated/equipment_stage3_3_general_list.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Equipment Stage 4-2 general List UI
        run: node scripts/validate-equipment-stage4-2-general-list-ui.mjs
      - name: Persist Stage 4-2 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts data/validation/equipment-stage4-2-general-list-ui-summary.v1.json
          if git diff --cached --quiet; then
            echo "No Stage 4-2 generated changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 4-2 general List UI checkpoint"
          git push
