name: Hero Fusion Faction Diagnostic

on:
  push:
    branches:
      - work/hero-fusion-faction-marks-20260830
    paths:
      - '.github/workflows/hero-fusion-faction-diagnostic.yml'
      - 'data/validation/hero-fusion-faction-diagnostic.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Confirm explicit fusion target relation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const shardDir = 'data/generated/hero-detail/by-id';
          const skillInfo = JSON.parse(fs.readFileSync('data/configdata/ConfigDataSkillInfo.json', 'utf8'));
          const skillById = new Map(skillInfo.map((row) => [Number(row.ID), row]));
          const candidates = [];
          for (const name of fs.readdirSync(shardDir).filter((x) => /^\d+\.json$/.test(x))) {
            const shard = JSON.parse(fs.readFileSync(path.join(shardDir, name), 'utf8'));
            for (const acquisition of shard.normal?.skills?.jobLevelAcquisitions ?? []) {
              if (acquisition?.skill?.displayType !== '超绝强化') continue;
              const raw = skillById.get(Number(acquisition.skill.skillId));
              if (!raw) throw new Error(`missing SkillInfo ${acquisition.skill.skillId}`);
              if (raw.SkillType !== 14 || raw.SkillTypeParam1 !== 2 || !Number.isInteger(raw.SkillTypeParam2)) {
                throw new Error(`invalid fusion relation SkillInfo ${raw.ID}`);
              }
              const target = (shard.presentation?.factions ?? []).find((f) => Number(f.factionId) === raw.SkillTypeParam2);
              if (!target) throw new Error(`Hero ${shard.heroId} fusion target ${raw.SkillTypeParam2} not in frozen faction rows`);
              candidates.push({heroId: shard.heroId, skillId: raw.ID, targetFactionId: raw.SkillTypeParam2, targetFactionNameCn: target.nameCn, iconSourcePath: target.iconSourcePath});
            }
          }
          if (candidates.length !== 35 || new Set(candidates.map((r)=>r.heroId)).size !== 35 || new Set(candidates.map((r)=>r.targetFactionId)).size !== 12) {
            throw new Error(`fusion population mismatch ${JSON.stringify({count:candidates.length, heroes:new Set(candidates.map((r)=>r.heroId)).size, factions:new Set(candidates.map((r)=>r.targetFactionId)).size})}`);
          }
          console.log(JSON.stringify({status:'PASS_EXPLICIT_FUSION_TARGET_RELATION', candidateCount:35, uniqueFactionCount:12, representative:candidates.filter((r)=>[6,12,25,55,110].includes(r.heroId))}, null, 2));
          NODE
      - name: Inspect official keyword bundle container and Sprite identities
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet UnityPy Pillow
          python <<'PY'
          import struct, urllib.request, zlib, pathlib
          import UnityPy

          VER='1.1.113'; N=61; BUNDLE='ui_icon_keyword_abs.b'
          BASE=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VER}'
          URL=f'{BASE}/InstallPage_{VER}_{N}.zip'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def req(url,start=None,end=None,method=None):
              h={'User-Agent':UA,'Accept-Encoding':'identity'}
              if start is not None: h['Range']=f'bytes={start}-{end}'
              with urllib.request.urlopen(urllib.request.Request(url,headers=h,method=method),timeout=60) as r:
                  data=r.read()
                  if start is not None and len(data) != end-start+1: raise RuntimeError('range mismatch')
                  return data,dict(r.headers)

          _,heads=req(URL,method='HEAD'); size=int(heads['Content-Length']); ts=min(1024*1024,size)
          tail,_=req(URL,size-ts,size-1); e=tail.rfind(b'PK\x05\x06')
          _,_,_,_,cs,co,_=struct.unpack_from('<HHHHIIH',tail,e+4)
          central,_=req(URL,co,co+cs-1); off=0; entry=None
          while off+46<=len(central) and central[off:off+4]==b'PK\x01\x02':
              flags,method=struct.unpack_from('<HH',central,off+8)
              csz,usz=struct.unpack_from('<II',central,off+20)
              fl,el,cl=struct.unpack_from('<HHH',central,off+28); lo=struct.unpack_from('<I',central,off+42)[0]
              raw=central[off+46:off+46+fl]; name=raw.decode('utf-8' if flags&0x800 else 'cp437','replace')
              if pathlib.PurePosixPath(name).name.lower()==BUNDLE: entry=(name,method,csz,usz,lo)
              off += 46+fl+el+cl
          if not entry: raise SystemExit('bundle missing')
          name,method,csz,usz,lo=entry
          header,_=req(URL,lo,lo+4095); actual_method=struct.unpack_from('<H',header,8)[0]; fl,el=struct.unpack_from('<HH',header,26)
          ds=lo+30+fl+el; compressed,_=req(URL,ds,ds+csz-1)
          raw=compressed if actual_method==0 else zlib.decompress(compressed,-15)
          env=UnityPy.load(raw)

          def typ(obj): return getattr(getattr(obj,'type',None),'name',None)
          container_rows=[]
          for key,obj in env.container.items():
              k=str(key)
              if 'group' in k.lower() or 'lead' in k.lower() or len(container_rows)<40:
                  container_rows.append({'key':k,'type':typ(obj),'pathId':int(getattr(obj,'path_id',0))})
          sprite_rows=[]; texture_rows=[]
          for obj in env.objects:
              t=typ(obj)
              if t not in {'Sprite','Texture2D'}: continue
              try: data=obj.read(); nm=str(getattr(data,'m_Name',''))
              except Exception as exc: continue
              row={'name':nm,'type':t,'pathId':int(getattr(obj,'path_id',0))}
              if t=='Sprite' and ('group' in nm.lower() or 'lead' in nm.lower() or len(sprite_rows)<40): sprite_rows.append(row)
              if t=='Texture2D' and ('group' in nm.lower() or 'lead' in nm.lower() or len(texture_rows)<30): texture_rows.append(row)
          print('BUNDLE',name,'bytes',len(raw),'containerCount',len(env.container),'objectCount',len(env.objects))
          print('CONTAINER_ROWS',container_rows[:120])
          print('SPRITE_ROWS',sprite_rows[:120])
          print('TEXTURE_ROWS',texture_rows[:100])
          expected=['Icon_Group_Lead','Icon_Group_Light','Icon_Group_Origin','Icon_Group_Empire','Icon_Group_Dark','Icon_Group_Princess','Icon_Group_WisdomAndCourage','Icon_Group_Meteor','Icon_Group_Crystal','Icon_Group_SpaceTimeHub','Icon_Group_Transcendency','Icon_Group_Incarnation']
          exact={name.lower():[] for name in expected}
          for obj in env.objects:
              if typ(obj)!='Sprite': continue
              try: nm=str(getattr(obj.read(),'m_Name',''))
              except Exception: continue
              if nm.lower() in exact: exact[nm.lower()].append(int(getattr(obj,'path_id',0)))
          print('EXPECTED_EXACT_SPRITE_MATCHES',{name:exact[name.lower()] for name in expected})
          PY
