name: Apply Training Hall Gold Icon

on:
  push:
    branches:
      - work/soldier-training-gold-icon

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/soldier-training-gold-icon
      - name: Reuse Soldier common gold asset in Training Hall
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/routes/soldiers_.training.tsx")
          text = path.read_text()

          old_import = 'import { getOfficialArmyIconUrl } from "@/lib/army-icon-assets";\nimport { getSoldierTrainingCostMaterialIconUrl } from "@/lib/soldier-training-cost-material-assets-supplemental";'
          new_import = 'import { getOfficialArmyIconUrl } from "@/lib/army-icon-assets";\nimport { getSoldierCommonMaterialIconUrl } from "@/lib/soldier-common-material-assets";\nimport { getSoldierTrainingCostMaterialIconUrl } from "@/lib/soldier-training-cost-material-assets-supplemental";'
          if old_import not in text:
              raise SystemExit("expected import block not found")
          text = text.replace(old_import, new_import, 1)

          old_gold = '''        <span className="rounded-md border border-border bg-card px-2.5 py-1.5 font-bold text-foreground">\n          골드 {formatNumber(level.goldCost)}\n        </span>'''
          new_gold = '''        <span className="inline-flex items-center gap-1.5 rounded-md border border-border bg-card px-2 py-1.5 text-foreground">\n          <img\n            src={getSoldierCommonMaterialIconUrl("gold")}\n            alt=""\n            className="h-5 w-5 shrink-0 object-contain"\n            aria-hidden="true"\n          />\n          <span className="font-black">×{formatNumber(level.goldCost)}</span>\n        </span>'''
          if old_gold not in text:
              raise SystemExit("expected gold cost block not found")
          text = text.replace(old_gold, new_gold, 1)
          path.write_text(text)
      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/apply-training-gold-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/soldiers_.training.tsx
          git commit -m "Show Training Hall gold as icon and count"
          git push
