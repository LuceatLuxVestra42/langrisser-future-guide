# SR-7 shadow mode: fixture gate + real-history comparison + non-blocking Smart Regression observation.
name: Smart Regression Shadow

on:
  push:
    branches:
      - main
      - work/smart-regression-sr6-shadow
      - work/smart-regression-sr7-history
    paths-ignore:
      - 'data/checkpoints/smart-regression-sr6-shadow.v1.json'
      - 'data/checkpoints/smart-regression-sr7-history.v1.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'data/checkpoints/smart-regression-sr6-shadow.v1.json'
      - 'data/checkpoints/smart-regression-sr7-history.v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-regression-shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow:
    name: Smart Regression Shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run SR-5 representative fixtures
        shell: bash
        run: |
          set -o pipefail
          bun run test:smart-regression:fixtures | tee smart-regression-fixtures.json

      - name: Run SR-7 real-history comparison
        shell: bash
        run: |
          set -o pipefail
          bun run test:smart-regression:history | tee smart-regression-history.json

      - name: Resolve comparison refs
        id: refs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          else
            base="$(git rev-parse HEAD^)"
            head="$(git rev-parse HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Resolved shadow diff: $base...$head"

      - name: Run Smart Regression dry-run in shadow mode
        id: smart-regression
        shell: bash
        run: |
          set +e
          node scripts/smart-regression-sr4.mjs \
            --dry-run \
            --json \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" \
            > smart-regression-shadow.json \
            2> smart-regression-shadow.stderr.log
          code=$?
          set -e

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat smart-regression-shadow.json || true
          if [[ -s smart-regression-shadow.stderr.log ]]; then
            cat smart-regression-shadow.stderr.log >&2
          fi

          {
            echo '## Smart Regression Shadow'
            echo
            echo "- diff: \`${{ steps.refs.outputs.base }}...${{ steps.refs.outputs.head }}\`"
            echo "- dry-run exit code: \`$code\`"
            echo '- mode: observation only; this dry-run result is not a merge gate'
            echo '- SR-5 fixtures and SR-7 historical comparison are acceptance checks'
            echo
            echo '<details><summary>Dry-run JSON</summary>'
            echo
            echo '```json'
            cat smart-regression-shadow.json || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          # Shadow policy: BLOCKED_UNBOUND / BLOCKED_UNKNOWN_PATH are evidence,
          # not CI failures yet. SR-7 history replay separately enforces zero observed false negatives.
          exit 0

      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-regression-shadow-${{ github.run_id }}
          path: |
            smart-regression-fixtures.json
            smart-regression-history.json
            smart-regression-shadow.json
            smart-regression-shadow.stderr.log
          if-no-files-found: warn
          retention-days: 14
