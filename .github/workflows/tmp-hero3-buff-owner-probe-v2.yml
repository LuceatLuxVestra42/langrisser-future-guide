name: Temporary Hero3 Buff owner probe v2

on:
  push:
    paths:
      - '.github/workflows/tmp-hero3-buff-owner-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate pinned ConfigData source pack outside repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir /tmp/langrisser-configdata-source
      - name: Resolve actual PassiveBuff IDs into BuffInfo
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='/tmp/langrisser-configdata-source/data/configdata';
          const read=p=>JSON.parse(fs.readFileSync(`${root}/${p}`,'utf8'));
          const rows=x=>Array.isArray(x)?x:(x.records||[]);
          const buffs=rows(read('ConfigDataBuffInfo.json'));
          for(const id of [70009,70069]){
            const hits=buffs.filter(r=>Number(r.ID)===id);
            console.log(`BUFF_ID=${id};HIT_COUNT=${hits.length}`);
            for(const r of hits) console.log('BUFF_ROW='+JSON.stringify(r));
          }
          NODE
