name: Temporary HeroFetter SkillInfo MethodInfo xref
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract official IL2CPP pair and partial dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hfgs out/herofetter-skillinfo-methodinfo-xref
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib
          D=pathlib.Path('/tmp/hfgs'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ent(u,hs(u)) if e[0]==target); (D/out).write_bytes(get(u,e))
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release >/dev/null 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/hfgs/dump
          set +e
          dotnet "$DLL" /tmp/hfgs/GameAssembly.dll /tmp/hfgs/global-metadata.dat /tmp/hfgs/dump > out/herofetter-skillinfo-methodinfo-xref/dumper.log 2>&1
          set -e
          test -f /tmp/hfgs/dump/script.json
      - name: Xref specialization MethodInfo pointer
        shell: bash
        run: |
          set -euo pipefail
          objdump -d -Mintel /tmp/hfgs/GameAssembly.dll > /tmp/hfgs/full.disasm
          python <<'PY'
          import json,pathlib,re,bisect
          O=pathlib.Path('out/herofetter-skillinfo-methodinfo-xref'); D=pathlib.Path('/tmp/hfgs/dump')
          script=json.loads((D/'script.json').read_text(errors='replace'))
          rows=[]
          def walk(x):
            if isinstance(x,dict):
              n=x.get('Name'); a=x.get('Address'); s=x.get('Signature')
              if isinstance(n,str) and isinstance(a,(int,float)): rows.append((int(a),n,s or ''))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(script); rows=sorted(set(rows),key=lambda x:x[0]); addrs=[r[0] for r in rows]
          lines=pathlib.Path('/tmp/hfgs/full.disasm').read_text(errors='replace').splitlines()
          ptr='0x186370ed8'; helper='0x18018d820'; hits=[]
          for i,l in enumerate(lines):
            if ptr not in l: continue
            nearby='\n'.join(lines[max(0,i-12):min(len(lines),i+20)])
            # Keep references whose nearby block calls the same shared helper.
            if helper not in nearby: continue
            m=re.match(r'\s*([0-9a-fA-F]+):',l)
            if not m: continue
            va=int(m.group(1),16); rva=va-0x180000000 if va>=0x180000000 else va
            idx=bisect.bisect_right(addrs,rva)-1
            owner=rows[idx] if idx>=0 else None
            hits.append({'referenceVA':hex(va),'owner':None if owner is None else {'address':hex(owner[0]),'name':owner[1],'signature':owner[2]},'window':nearby})
          result={'status':'TRACE_COMPLETE','methodInfoPointer':ptr,'sharedHelper':helper,'xrefCount':len(hits),'xrefs':hits[:300]}
          (O/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('XREF_COUNT',len(hits))
          for h in hits[:300]:
            print('OWNER',json.dumps(h['owner'],ensure_ascii=False))
            print('WINDOW_BEGIN\n'+h['window']+'\nWINDOW_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herofetter-skillinfo-methodinfo-xref
          path: out/herofetter-skillinfo-methodinfo-xref
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-herofetter-skillinfo-methodinfo-xref.yml
          git commit -m "Remove temporary HeroFetter SkillInfo MethodInfo xref"
          git push origin HEAD:${GITHUB_REF_NAME}
