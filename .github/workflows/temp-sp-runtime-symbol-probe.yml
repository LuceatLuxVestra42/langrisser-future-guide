name: Temporary SP runtime symbol probe
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract official IL2CPP code assets and probe symbols
        shell: bash
        run: |
          set +e
          mkdir -p out/sp-runtime-symbol-probe
          python <<'PY'
          import binascii, hashlib, json, pathlib, re, struct, urllib.request, zlib
          OUT=pathlib.Path('out/sp-runtime-symbol-probe')
          VERSION='1.1.113'; BASE=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          TARGETS={1:'Client/GameAssembly.dll',66:'Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat'}
          TERMS=['ConfigDataSPHeroInfo','SPHeroInfo','GetConfigDataSPHeroInfo','GetConfigDataHeroInfo','UpdateHeroInfo','HPCmd_INI','ATCmd_INI','DFCmd_INI','MagicDFCmd_INI','Hero3_HPCmdAdd','ComputeSoldierProperties','ComputeHeroProperties','JobConnection_ID']
          def req(url,start,end):
              h={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={start}-{end}'}
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=120) as r: return r.read()
          def head(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r: return int(r.headers['Content-Length'])
          def entries(url,total):
              n=min(131072,total); tail=req(url,total-n,total-1); p=tail.rfind(b'PK\x05\x06')
              _,_,_,_,size,off,_=struct.unpack_from('<HHHHIIH',tail,p+4); c=req(url,off,off+size-1); out=[]; i=0
              while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
                  flags,method=struct.unpack_from('<HH',c,i+8); crc,comp,uncomp=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]
                  name=c[i+46:i+46+fn].decode('utf-8' if flags&0x800 else 'cp437','replace')
                  out.append((name,method,crc,comp,uncomp,lo)); i+=46+fn+ex+cm
              return out
          def fetch_entry(url,e):
              name,method,crc,comp,uncomp,lo=e; h=req(url,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); start=lo+30+fn+ex; data=req(url,start,start+comp-1); raw=data if method==0 else zlib.decompress(data,-15)
              assert len(raw)==uncomp and (binascii.crc32(raw)&0xffffffff)==crc; return raw
          result={'version':1,'schemaId':'sp-runtime-symbol-probe/v1','status':'RUNNING','source':{'kind':'OFFICIAL_INSTALLER','installVersion':VERSION,'base':BASE},'assets':[],'terms':{},'blockers':[]}
          try:
              blobs=[]
              for part,target in TARGETS.items():
                  pkg=f'InstallPage_{VERSION}_{part}.zip'; url=f'{BASE}/{pkg}'; total=head(url); es=entries(url,total); hit=next((e for e in es if e[0]==target),None)
                  if not hit: raise RuntimeError(f'missing {target}')
                  raw=fetch_entry(url,hit); blobs.append((target,raw)); result['assets'].append({'part':part,'packageName':pkg,'entry':target,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              for term in TERMS:
                  rec=[]; needle=term.encode(); needle16=term.encode('utf-16le')
                  for name,raw in blobs:
                      for enc,n in [('ascii',needle),('utf16le',needle16)]:
                          starts=[]; pos=0
                          while True:
                              p=raw.find(n,pos)
                              if p<0: break
                              starts.append(p); pos=p+1
                              if len(starts)>=20: break
                          if starts: rec.append({'asset':name,'encoding':enc,'countCapped':len(starts),'offsets':starts})
                  result['terms'][term]=rec
              result['status']='PASS'
          except Exception as exc:
              result['status']='BLOCKER'; result['blockers']=[f'{type(exc).__name__}:{exc}']
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          raise SystemExit(0 if result['status']=='PASS' else 2)
          PY
          echo $? > out/sp-runtime-symbol-probe/exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sp-runtime-symbol-probe
          path: out/sp-runtime-symbol-probe
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-sp-runtime-symbol-probe.yml
          git commit -m "Remove temporary SP runtime symbol probe"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Enforce probe status
        shell: bash
        run: |
          code=$(cat out/sp-runtime-symbol-probe/exit-code.txt 2>/dev/null || echo 99)
          test "$code" = "0"
