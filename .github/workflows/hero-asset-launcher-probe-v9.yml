name: Hero Asset Launcher Probe v9

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-hero-launcher-v9.ps1'
      - '.github/workflows/hero-asset-launcher-probe-v9.yml'

permissions:
  contents: read

jobs:
  targeted-config-extract:
    if: github.event.pull_request.head.ref == 'work/hero-asset-launcher-probe'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v5
      - name: Extract exact launcher config resources without execution
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/probe-hero-launcher-v9.ps1
      - name: Upload decoded config reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-asset-launcher-probe-v9-report
          path: ${{ runner.temp }}/langrisser-launcher-probe-v9/report
          if-no-files-found: warn
          retention-days: 3
