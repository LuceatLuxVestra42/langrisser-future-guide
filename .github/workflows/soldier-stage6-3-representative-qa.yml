name: Soldier Stage 6-3 Representative QA

on:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'scripts/finalize-soldier-stage6-3-representative-qa.cjs'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - 'data/generated/soldier-stage6-2-classification.v1.json'
      - 'data/validation/soldier-stage6-2-classification.v1.json'
      - 'data/generated/hero-soldier-relations.v1.json'
      - 'data/validation/hero-soldier-relation-validation.v1.json'
      - 'data/fixtures/soldier-stage6-3-fixtures.v1.json'
      - 'data/validation/soldier-stage6-3-representative-qa.v1.json'
      - '.github/workflows/soldier-stage6-3-representative-qa.yml'
  pull_request:
    paths:
      - 'scripts/finalize-soldier-stage6-3-representative-qa.cjs'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - 'data/generated/soldier-stage6-2-classification.v1.json'
      - 'data/validation/soldier-stage6-2-classification.v1.json'
      - 'data/generated/hero-soldier-relations.v1.json'
      - 'data/validation/hero-soldier-relation-validation.v1.json'
      - 'data/fixtures/soldier-stage6-3-fixtures.v1.json'
      - 'data/validation/soldier-stage6-3-representative-qa.v1.json'
      - '.github/workflows/soldier-stage6-3-representative-qa.yml'

permissions:
  contents: write

jobs:
  representative-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Soldier Stage 6-3 representative QA
        run: node scripts/finalize-soldier-stage6-3-representative-qa.cjs

      - name: Upload Stage 6-3 QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage6-3-representative-qa
          path: |
            data/fixtures/soldier-stage6-3-fixtures.v1.json
            data/validation/soldier-stage6-3-representative-qa.v1.json

      - name: Freeze Stage 6-3 fixtures and QA on work branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fixtures/soldier-stage6-3-fixtures.v1.json \
            data/validation/soldier-stage6-3-representative-qa.v1.json
          if git diff --cached --quiet; then
            echo "Soldier Stage 6-3 QA artifacts already frozen."
          else
            git commit -m "freeze Soldier stage 6-3 representative QA PASS"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Verify frozen QA artifacts on main or PR
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: git diff --exit-code -- data/fixtures/soldier-stage6-3-fixtures.v1.json data/validation/soldier-stage6-3-representative-qa.v1.json

