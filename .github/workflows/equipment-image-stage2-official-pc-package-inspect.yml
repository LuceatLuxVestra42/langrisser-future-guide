name: Equipment Image Stage 2 Official PC Package Inspect

on:
  push:
    branches:
      - work/equipment-image-stage2-hold29
    paths:
      - '.github/workflows/equipment-image-stage2-official-pc-package-inspect.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify official CDN anti-hotlink request with 1KB range
        run: |
          set -euo pipefail
          URL='https://mhmnzdownload.zlongame.com/MHMNZ/Clientdown/DownLoad-MZ-PC.exe'
          REF='https://mz.zlongame.com/jx/mzdownload/20180731/5473.html'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          curl --http1.1 -fL -A "$UA" -e "$REF" -H 'Range: bytes=0-1023' -D /tmp/range.headers -o /tmp/range.bin "$URL"
          cat /tmp/range.headers
          stat -c 'range-bytes=%s' /tmp/range.bin
          xxd -l 32 /tmp/range.bin
      - name: Download official PC package once with accepted browser headers
        run: |
          set -euo pipefail
          URL='https://mhmnzdownload.zlongame.com/MHMNZ/Clientdown/DownLoad-MZ-PC.exe'
          REF='https://mz.zlongame.com/jx/mzdownload/20180731/5473.html'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          curl --http1.1 -fL --retry 2 -A "$UA" -e "$REF" -o /tmp/DownLoad-MZ-PC.exe "$URL"
          stat -c 'bytes=%s' /tmp/DownLoad-MZ-PC.exe
          md5sum /tmp/DownLoad-MZ-PC.exe
          sha256sum /tmp/DownLoad-MZ-PC.exe
          file /tmp/DownLoad-MZ-PC.exe
      - name: Inspect archive table without extraction
        run: |
          set +e
          echo '=== 7z archive summary ==='
          7z l /tmp/DownLoad-MZ-PC.exe | head -n 120
          echo '=== likely updater/config members ==='
          7z l -ba /tmp/DownLoad-MZ-PC.exe | grep -Eai 'patch|update|version|manifest|config|setting|url|cdn|asset|bundle|\.ini$|\.xml$|\.json$|\.cfg$|\.config$|\.txt$' | head -n 300
          exit 0
      - name: Scan embedded strings for update endpoints
        run: |
          set +e
          echo '=== URL / patch strings ==='
          strings -a -n 8 /tmp/DownLoad-MZ-PC.exe \
            | grep -Eai 'https?://|patchinfo|patch|manifest|cdn|ExportAssetBundle|assetbundle|version' \
            | head -n 500
          exit 0
