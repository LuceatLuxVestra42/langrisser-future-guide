name: Soldier portrait clean unify v9 final

on:
  push:
    branches:
      - work/soldier-portrait-clean-unify-v9
    paths:
      - '.github/workflows/soldier-portrait-clean-unify-v9-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow requests
      - name: Run exact-source resolver with edge-touch-safe transparency gate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/soldier-portrait-clean-unify-v9-fast.yml').read_text(encoding='utf-8')
          start="          python <<'PY'\n"
          end="\n          PY\n"
          body=src.split(start,1)[1].split(end,1)[0]
          body=textwrap.dedent(body)
          body=body.replace("and tr>=0.08 and br>=0.50 and cc==4", "and tr>=0.08 and br>=0.50 and cc>=3")
          body=body.replace("'requiredTransparentCorners':4", "'requiredTransparentCorners':3")
          Path('/tmp/soldier-v9.py').write_text(body,encoding='utf-8')
          PY
          python /tmp/soldier-v9.py
      - uses: oven-sh/setup-bun@v2
      - name: Production build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit verified v9 assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/soldiers data/generated/soldier-portrait-manifest.v9.json data/validation/soldier-portrait-v9-source-audit.json src/lib/soldier-portrait-assets.ts
          git commit -m 'Unify all Soldier portraits to transparent source assets'
          git push origin HEAD:work/soldier-portrait-clean-unify-v9
