name: F3 Extract Leon Heart Fetter Skills

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Leon Heart Fetter skill records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const {
            resolveConfigDataFile,
          } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          function load(name) {
            return JSON.parse(fs.readFileSync(resolveConfigDataFile(name), 'utf8'));
          }

          function uniqueById(records, id, label) {
            const hits = [];
            for (let i = 0; i < records.length; i++) {
              const record = records[i];
              if (record && typeof record === 'object' && record.ID === id) {
                hits.push({ recordIndex: i, record });
              }
            }
            if (hits.length !== 1) {
              throw new Error(`${label}: expected exactly one ID ${id}; found ${hits.length}`);
            }
            return hits[0];
          }

          const heroRecords = load('ConfigDataHeroInfo.json');
          const leonHero = uniqueById(heroRecords, 6, 'ConfigDataHeroInfo');
          if (leonHero.record.HeroInformation_ID !== 6) {
            throw new Error(`Leon HeroInformation_ID mismatch: ${leonHero.record.HeroInformation_ID}`);
          }

          const informationRecords = load('ConfigDataHeroInformationInfo.json');
          const leonInfo = uniqueById(informationRecords, 6, 'ConfigDataHeroInformationInfo');
          if (leonInfo.record.Name !== '利昂' || leonInfo.record.HeroHeartFetterId !== 6) {
            throw new Error('Leon HeroInformation identity / HeroHeartFetterId mismatch');
          }

          const heartRecords = load('ConfigDataHeroHeartFetterInfo.json');
          const leonHeart = uniqueById(heartRecords, 6, 'ConfigDataHeroHeartFetterInfo');
          const expectedSkillIds = [70343,70344,70345,70346,70347,70348,70349,70350,70351,70352];
          if (JSON.stringify(leonHeart.record.HeroHeartFetterSkills) !== JSON.stringify(expectedSkillIds)) {
            throw new Error(`Leon HeroHeartFetterSkills mismatch: ${JSON.stringify(leonHeart.record.HeroHeartFetterSkills)}`);
          }
          if (leonHeart.record.MaxLevel !== 10) {
            throw new Error(`Leon HeartFetter MaxLevel mismatch: ${leonHeart.record.MaxLevel}`);
          }

          const skillRecords = load('ConfigDataSkillInfo.json');
          const hits = expectedSkillIds.map((id) => uniqueById(skillRecords, id, 'ConfigDataSkillInfo'));

          console.log('=== F3_LEON_HEART_FETTER_SKILL_META_START ===');
          console.log(JSON.stringify({
            sourceFile: 'ConfigDataHeroHeartFetterInfo.json',
            sourceRecordIndex: leonHeart.recordIndex,
            sourceID: leonHeart.record.ID,
            sourceField: 'HeroHeartFetterSkills',
            sourceValues: expectedSkillIds,
            targetFile: 'ConfigDataSkillInfo.json',
            targetKey: 'ID',
            targets: hits.map((hit, index) => ({
              heartFetterLevel: index + 1,
              targetID: hit.record.ID,
              targetRecordIndex: hit.recordIndex,
            })),
          }, null, 2));
          console.log('=== F3_LEON_HEART_FETTER_SKILL_META_END ===');

          for (let i = 0; i < hits.length; i++) {
            const hit = hits[i];
            const level = i + 1;
            console.log(`=== F3_LEON_HEART_FETTER_LV${level}_SKILL_${hit.record.ID}_START ===`);
            console.log(JSON.stringify(hit.record, null, 2));
            console.log(`=== F3_LEON_HEART_FETTER_LV${level}_SKILL_${hit.record.ID}_END ===`);
          }
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
