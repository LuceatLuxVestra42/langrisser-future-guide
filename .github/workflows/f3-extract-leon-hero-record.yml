name: F3 Extract Skill ID 10301 Record

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Skill ID 10301 record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const {
            resolveConfigDataFile,
          } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          const skillPath = resolveConfigDataFile('ConfigDataSkillInfo.json');
          const skills = JSON.parse(fs.readFileSync(skillPath, 'utf8'));
          const record = skills[1841];

          if (!record) {
            throw new Error('recordIndex 1841 missing');
          }

          if (record.ID !== 10301) {
            throw new Error(`identity mismatch: expected ID 10301, got ${record.ID}`);
          }

          console.log('=== F3_SKILL_10301_RECORD_START ===');
          console.log(JSON.stringify(record, null, 2));
          console.log('=== F3_SKILL_10301_RECORD_END ===');
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
