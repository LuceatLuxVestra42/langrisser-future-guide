name: F3 Extract JobConnection ID 60 Record

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract JobConnection ID 60 record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const {
            resolveConfigDataFile,
          } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          const sourcePath = resolveConfigDataFile('ConfigDataJobConnectionInfo.json');
          const records = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const recordIndex = 35;
          const record = records[recordIndex];

          if (!record) {
            throw new Error(`recordIndex ${recordIndex} missing`);
          }
          if (record.ID !== 60) {
            throw new Error(`identity mismatch: expected ID 60, got ${record.ID}`);
          }

          console.log('=== F3_JOBCONNECTION_60_META_START ===');
          console.log(JSON.stringify({ file: 'ConfigDataJobConnectionInfo.json', recordIndex, ID: record.ID }, null, 2));
          console.log('=== F3_JOBCONNECTION_60_META_END ===');
          console.log('=== F3_JOBCONNECTION_60_RECORD_START ===');
          console.log(JSON.stringify(record, null, 2));
          console.log('=== F3_JOBCONNECTION_60_RECORD_END ===');
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
