name: F3 Extract Leon Fetter Target Records

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Leon HeroInformation and Fetter targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const {
            resolveConfigDataFile,
          } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          function load(name) {
            return JSON.parse(fs.readFileSync(resolveConfigDataFile(name), 'utf8'));
          }

          function uniqueById(records, id, label) {
            const hits = [];
            for (let i = 0; i < records.length; i++) {
              const record = records[i];
              if (record && typeof record === 'object' && record.ID === id) {
                hits.push({ recordIndex: i, record });
              }
            }
            if (hits.length !== 1) {
              throw new Error(`${label}: expected exactly one ID ${id}; found ${hits.length}`);
            }
            return hits[0];
          }

          const heroInfoRecords = load('ConfigDataHeroInfo.json');
          const leonHero = uniqueById(heroInfoRecords, 6, 'ConfigDataHeroInfo');
          if (leonHero.record.HeroInformation_ID !== 6) {
            throw new Error(`Leon HeroInformation_ID mismatch: ${leonHero.record.HeroInformation_ID}`);
          }

          const informationRecords = load('ConfigDataHeroInformationInfo.json');
          const leonInfo = uniqueById(informationRecords, leonHero.record.HeroInformation_ID, 'ConfigDataHeroInformationInfo');
          if (leonInfo.record.Name !== '利昂') {
            throw new Error(`Leon information identity mismatch: ${leonInfo.record.Name}`);
          }
          if (!Array.isArray(leonInfo.record.HeroFetters_ID)) {
            throw new Error('Leon HeroFetters_ID is not an array');
          }
          if (!Number.isInteger(leonInfo.record.HeroHeartFetterId)) {
            throw new Error(`Leon HeroHeartFetterId is not an integer: ${leonInfo.record.HeroHeartFetterId}`);
          }

          console.log('=== F3_LEON_HERO_INFORMATION_META_START ===');
          console.log(JSON.stringify({
            sourceHeroRecordIndex: leonHero.recordIndex,
            HeroInformation_ID: leonHero.record.HeroInformation_ID,
            targetFile: 'ConfigDataHeroInformationInfo.json',
            targetRecordIndex: leonInfo.recordIndex,
            targetID: leonInfo.record.ID,
            HeroFetters_ID: leonInfo.record.HeroFetters_ID,
            HeroHeartFetterId: leonInfo.record.HeroHeartFetterId,
          }, null, 2));
          console.log('=== F3_LEON_HERO_INFORMATION_META_END ===');
          console.log('=== F3_LEON_HERO_INFORMATION_RECORD_START ===');
          console.log(JSON.stringify(leonInfo.record, null, 2));
          console.log('=== F3_LEON_HERO_INFORMATION_RECORD_END ===');

          const heartRecords = load('ConfigDataHeroHeartFetterInfo.json');
          const heart = uniqueById(heartRecords, leonInfo.record.HeroHeartFetterId, 'ConfigDataHeroHeartFetterInfo');
          console.log('=== F3_LEON_HEART_FETTER_META_START ===');
          console.log(JSON.stringify({
            sourceField: 'HeroHeartFetterId',
            sourceValue: leonInfo.record.HeroHeartFetterId,
            targetFile: 'ConfigDataHeroHeartFetterInfo.json',
            targetRecordIndex: heart.recordIndex,
            targetID: heart.record.ID,
          }, null, 2));
          console.log('=== F3_LEON_HEART_FETTER_META_END ===');
          console.log('=== F3_LEON_HEART_FETTER_RECORD_START ===');
          console.log(JSON.stringify(heart.record, null, 2));
          console.log('=== F3_LEON_HEART_FETTER_RECORD_END ===');

          const fetterRecords = load('ConfigDataHeroFetterInfo.json');
          const fetters = leonInfo.record.HeroFetters_ID.map((id) => uniqueById(fetterRecords, id, 'ConfigDataHeroFetterInfo'));
          console.log('=== F3_LEON_FETTER_META_START ===');
          console.log(JSON.stringify(fetters.map((hit, i) => ({
            sourceField: 'HeroFetters_ID',
            sourceValue: leonInfo.record.HeroFetters_ID[i],
            targetFile: 'ConfigDataHeroFetterInfo.json',
            targetRecordIndex: hit.recordIndex,
            targetID: hit.record.ID,
          })), null, 2));
          console.log('=== F3_LEON_FETTER_META_END ===');
          for (const hit of fetters) {
            console.log(`=== F3_LEON_FETTER_${hit.record.ID}_RECORD_START ===`);
            console.log(JSON.stringify(hit.record, null, 2));
            console.log(`=== F3_LEON_FETTER_${hit.record.ID}_RECORD_END ===`);
          }
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
