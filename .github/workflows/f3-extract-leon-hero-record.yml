name: F3 Discover HeroID 6 Reverse References

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover explicit HeroID 6 reverse references
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const {
            resolveConfigDataFile,
          } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          const sourceDir = path.dirname(resolveConfigDataFile('ConfigDataHeroInfo.json'));
          const files = fs.readdirSync(sourceDir).filter((name) => name.endsWith('.json')).sort();
          const semanticNameRx = /(fetter|bond|heart|favor|affection|intimacy|friend|relation)/i;
          const semanticFiles = [];
          const heroIdRefs = [];

          const valueContainsSix = (value) => value === 6 || (Array.isArray(value) && value.includes(6));
          const isHeroIdField = (key) => {
            const normalized = key.replace(/[^A-Za-z0-9]/g, '');
            return /hero/i.test(normalized) && /ids?$/i.test(normalized);
          };

          for (const file of files) {
            const fullPath = path.join(sourceDir, file);
            let data;
            try {
              data = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            } catch {
              continue;
            }
            if (!Array.isArray(data)) continue;

            if (semanticNameRx.test(file)) {
              const first = data.find((record) => record && typeof record === 'object' && !Array.isArray(record));
              semanticFiles.push({
                file,
                recordCount: data.length,
                sampleKeys: first ? Object.keys(first) : [],
              });
            }

            for (let recordIndex = 0; recordIndex < data.length; recordIndex++) {
              const record = data[recordIndex];
              if (!record || typeof record !== 'object' || Array.isArray(record)) continue;

              for (const [field, value] of Object.entries(record)) {
                if (!isHeroIdField(field) || !valueContainsSix(value)) continue;
                heroIdRefs.push({
                  file,
                  recordIndex,
                  recordID: Object.prototype.hasOwnProperty.call(record, 'ID') ? record.ID : null,
                  recordName: Object.prototype.hasOwnProperty.call(record, 'Name') ? record.Name : null,
                  field,
                  value,
                  keys: Object.keys(record),
                });
              }
            }
          }

          console.log('=== F3_SEMANTIC_FILENAME_CANDIDATES_START ===');
          console.log(JSON.stringify(semanticFiles, null, 2));
          console.log('=== F3_SEMANTIC_FILENAME_CANDIDATES_END ===');
          console.log('=== F3_HEROID6_EXPLICIT_REVERSE_REFS_START ===');
          console.log(JSON.stringify(heroIdRefs, null, 2));
          console.log('=== F3_HEROID6_EXPLICIT_REVERSE_REFS_END ===');
          console.log(JSON.stringify({
            scannedJsonFiles: files.length,
            semanticFilenameCandidateCount: semanticFiles.length,
            explicitHeroId6ReferenceCount: heroIdRefs.length,
          }, null, 2));
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
