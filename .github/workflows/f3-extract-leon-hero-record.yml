name: F3 Extract Leon Heart Lv10 Effect Skills

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract exact SkillInfo records 70110 and 70111
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { resolveConfigDataFile } = require('./scripts/configdata-source-pack-maintenance-root.cjs');
          const rows = JSON.parse(fs.readFileSync(resolveConfigDataFile('ConfigDataSkillInfo.json'), 'utf8'));
          for (const id of [70110,70111]) {
            const hits=[];
            rows.forEach((record,recordIndex)=>{if(record&&record.ID===id)hits.push({recordIndex,record});});
            if(hits.length!==1) throw new Error(`SkillInfo ${id}: expected 1 hit, got ${hits.length}`);
            console.log(`=== SKILL_${id}_START ===`);
            console.log(JSON.stringify(hits[0],null,2));
            console.log(`=== SKILL_${id}_END ===`);
          }
          NODE
      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
