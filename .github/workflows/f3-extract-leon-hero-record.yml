name: F3 Assert Leon Central Bond Stat Formula

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert exact Leon SP central-bond delta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { resolveConfigDataFile } = require('./scripts/configdata-source-pack-maintenance-root.cjs');
          const load = name => JSON.parse(fs.readFileSync(resolveConfigDataFile(name), 'utf8'));
          const one = (rows,id,label) => { const h=rows.filter(r=>r&&r.ID===id); if(h.length!==1)throw new Error(`${label} ${id}: ${h.length}`); return h[0]; };
          const sp=one(load('ConfigDataSPHeroInfo.json'),6,'SPHeroInfo');
          const jc=one(load('ConfigDataJobConnectionInfo.json'),Number(sp.JobConnection_ID),'JobConnectionInfo');
          if(!Array.isArray(jc.JobLevels_ID)||jc.JobLevels_ID.length!==1) throw new Error('Leon SP JobConnection expected one JobLevel');
          const level=one(load('ConfigDataJobLevelInfo.json'),Number(jc.JobLevels_ID[0]),'JobLevelInfo');
          const info=one(load('ConfigDataHeroInformationInfo.json'),6,'HeroInformationInfo');
          const heart=one(load('ConfigDataHeroHeartFetterInfo.json'),Number(info.HeroHeartFetterId),'HeroHeartFetterInfo');
          if(!Array.isArray(heart.HeroHeartFetterSkills)||heart.HeroHeartFetterSkills.length!==10) throw new Error('HeartFetterSkills expected 10 levels');
          if(!Array.isArray(heart.UnlockSkills_ID)) throw new Error('UnlockSkills_ID missing');
          const lv10Unlocks=heart.UnlockSkills_ID.filter(x=>Number(x?.HeartFetterLevel)===10);
          if(lv10Unlocks.length!==1) throw new Error(`expected one Lv10 unlock skill; got ${lv10Unlocks.length}`);
          const skills=load('ConfigDataSkillInfo.json');
          const lv10HeartSkill=one(skills,Number(heart.HeroHeartFetterSkills[9]),'HeartLv10Skill');
          const allStatSkill=one(skills,Number(lv10Unlocks[0].SkillId),'HeartUnlockLv10Skill');
          if(lv10HeartSkill.ID!==70352) throw new Error(`unexpected Heart Lv10 skill ${lv10HeartSkill.ID}`);
          if(allStatSkill.ID!==70110) throw new Error(`unexpected Heart Lv10 unlock skill ${allStatSkill.ID}`);
          const flatDesc=String(lv10HeartSkill.Desc||'');
          const pctDesc=String(allStatSkill.Desc||'');
          if(!flatDesc.includes('生命')||!flatDesc.includes('+750')||!flatDesc.includes('防御')||!flatDesc.includes('+30')||!flatDesc.includes('魔防')||!flatDesc.includes('+40')) throw new Error(`flat semantic mismatch: ${flatDesc}`);
          if(!pctDesc.includes('全属性')||!pctDesc.includes('+5%')) throw new Error(`5% semantic mismatch: ${pctDesc}`);

          const defs={
            hp:{ini:'HP_INI',up:'HP_UP',star:'HPStar',current:4041,target:4929,flat:750},
            at:{ini:'AT_INI',up:'AT_UP',star:'ATStar',current:602,target:623,flat:0},
            magic:{ini:'Magic_INI',up:'Magic_UP',star:'MagicStar',current:224,target:233,flat:0},
            df:{ini:'DF_INI',up:'DF_UP',star:'DFStar',current:260,target:300,flat:30},
            magicDf:{ini:'MagicDF_INI',up:'MagicDF_UP',star:'MagicDFStar',current:231,target:280,flat:40},
            dex:{ini:'DEX_INI',up:'DEX_UP',star:'DEXStar',current:125,target:130,flat:0},
          };
          const rows=[];
          for(const [stat,d] of Object.entries(defs)){
            const progressionBase=Number(level[d.ini]||0)+Number(level[d.up]||0)*69/10;
            const starCorrection=Number(sp[d.star][5]);
            const starAdjustedRaw=progressionBase*(1+starCorrection/10000);
            const heartPercentDelta=Math.round(starAdjustedRaw*0.05);
            const corrected=d.current+heartPercentDelta+d.flat;
            const combinedMultiplierDelta=Math.round(starAdjustedRaw*1.30)-Math.round(starAdjustedRaw*1.25);
            const combinedCandidate=d.current+combinedMultiplierDelta+d.flat;
            rows.push({stat,progressionBase,starCorrection,starAdjustedRaw,heartPercentDelta,flat:d.flat,current:d.current,corrected,target:d.target,exact:corrected===d.target,combinedCandidate,combinedExact:combinedCandidate===d.target});
            if(corrected!==d.target) throw new Error(`${stat}: corrected ${corrected} != target ${d.target}`);
          }
          const defRow=rows.find(x=>x.stat==='df');
          if(defRow.combinedCandidate!==299 || defRow.combinedExact) throw new Error(`DEF discriminator unexpected: ${JSON.stringify(defRow)}`);
          console.log('=== LEON_CENTRAL_BOND_FORMULA_PROOF_START ===');
          console.log(JSON.stringify({heroId:6,spJobConnectionId:sp.JobConnection_ID,spJobLevelId:jc.JobLevels_ID[0],heartFetterId:info.HeroHeartFetterId,heartFlatSkillId:lv10HeartSkill.ID,heartPercentSkillId:allStatSkill.ID,formula:'corrected = legacyCurrent + round(starAdjustedRaw * 0.05) + heartFlat',rows},null,2));
          console.log('=== LEON_CENTRAL_BOND_FORMULA_PROOF_END ===');
          NODE
      - name: Verify repository unchanged
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
