name: F3 Extract Skill ID 90085 Record

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Skill ID 90085 record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const {
            resolveConfigDataFile,
          } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          const sourcePath = resolveConfigDataFile('ConfigDataSkillInfo.json');
          const records = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const matches = [];

          for (let i = 0; i < records.length; i++) {
            const record = records[i];
            if (record && typeof record === 'object' && record.ID === 90085) {
              matches.push({ recordIndex: i, record });
            }
          }

          if (matches.length !== 1) {
            throw new Error(`expected exactly one Skill record with ID 90085; found ${matches.length}`);
          }

          const hit = matches[0];
          if (hit.record.ID !== 90085) {
            throw new Error(`identity mismatch: expected ID 90085, got ${hit.record.ID}`);
          }

          console.log('=== F3_SKILL_90085_META_START ===');
          console.log(JSON.stringify({
            file: 'ConfigDataSkillInfo.json',
            recordIndex: hit.recordIndex,
            ID: hit.record.ID,
          }, null, 2));
          console.log('=== F3_SKILL_90085_META_END ===');
          console.log('=== F3_SKILL_90085_RECORD_START ===');
          console.log(JSON.stringify(hit.record, null, 2));
          console.log('=== F3_SKILL_90085_RECORD_END ===');
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
