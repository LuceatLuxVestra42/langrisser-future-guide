name: F3 Extract JobConnection IDs 61-65 Records

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract JobConnection IDs 61-65 records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const {
            resolveConfigDataFile,
          } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          const sourcePath = resolveConfigDataFile('ConfigDataJobConnectionInfo.json');
          const records = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const targets = [
            { ID: 61, recordIndex: 36 },
            { ID: 62, recordIndex: 37 },
            { ID: 63, recordIndex: 38 },
            { ID: 64, recordIndex: 39 },
            { ID: 65, recordIndex: 40 },
          ];

          for (const target of targets) {
            const record = records[target.recordIndex];
            if (!record) {
              throw new Error(`recordIndex ${target.recordIndex} missing for ID ${target.ID}`);
            }
            if (record.ID !== target.ID) {
              throw new Error(`identity mismatch at recordIndex ${target.recordIndex}: expected ID ${target.ID}, got ${record.ID}`);
            }
          }

          console.log('=== F3_JOBCONNECTION_61_65_META_START ===');
          console.log(JSON.stringify(targets.map((target) => ({
            file: 'ConfigDataJobConnectionInfo.json',
            recordIndex: target.recordIndex,
            ID: target.ID,
          })), null, 2));
          console.log('=== F3_JOBCONNECTION_61_65_META_END ===');

          for (const target of targets) {
            const record = records[target.recordIndex];
            console.log(`=== F3_JOBCONNECTION_${target.ID}_RECORD_START ===`);
            console.log(JSON.stringify(record, null, 2));
            console.log(`=== F3_JOBCONNECTION_${target.ID}_RECORD_END ===`);
          }
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
