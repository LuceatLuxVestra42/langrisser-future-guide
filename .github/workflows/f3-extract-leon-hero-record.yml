name: F3 Extract JobConnection ID 60 Record

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate and extract JobConnection ID 60 record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const {
            resolveConfigDataDir,
          } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          const dir = resolveConfigDataDir();
          const files = fs.readdirSync(dir).filter((name) => name.endsWith('.json')).sort();
          const requiredIds = new Set([60, 61, 62, 63, 64, 65]);
          const candidates = [];

          for (const file of files) {
            const fullPath = path.join(dir, file);
            let data;
            try {
              data = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            } catch {
              continue;
            }
            if (!Array.isArray(data)) continue;

            const matches = new Map();
            for (let i = 0; i < data.length; i++) {
              const record = data[i];
              if (record && typeof record === 'object' && requiredIds.has(record.ID)) {
                matches.set(record.ID, { index: i, record });
              }
            }

            if ([...requiredIds].every((id) => matches.has(id))) {
              candidates.push({ file, matches });
            }
          }

          console.log('=== F3_JOBCONNECTION_CANDIDATES_START ===');
          console.log(JSON.stringify(candidates.map(({ file, matches }) => ({
            file,
            ids: [...requiredIds].map((id) => ({ id, recordIndex: matches.get(id).index }))
          })), null, 2));
          console.log('=== F3_JOBCONNECTION_CANDIDATES_END ===');

          if (candidates.length !== 1) {
            throw new Error(`expected exactly one raw table containing IDs 60..65; found ${candidates.length}`);
          }

          const candidate = candidates[0];
          const hit = candidate.matches.get(60);
          if (!hit || hit.record.ID !== 60) {
            throw new Error('JobConnection target ID 60 identity mismatch');
          }

          console.log('=== F3_JOBCONNECTION_60_META_START ===');
          console.log(JSON.stringify({ file: candidate.file, recordIndex: hit.index, ID: hit.record.ID }, null, 2));
          console.log('=== F3_JOBCONNECTION_60_META_END ===');
          console.log('=== F3_JOBCONNECTION_60_RECORD_START ===');
          console.log(JSON.stringify(hit.record, null, 2));
          console.log('=== F3_JOBCONNECTION_60_RECORD_END ===');
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
