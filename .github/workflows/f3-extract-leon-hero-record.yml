name: F3 Inspect Leon Heart Fetter Passive Buff Candidates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract all complete target candidates for Leon Heart Fetter passive IDs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { resolveConfigDataFile } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          function load(name) {
            return JSON.parse(fs.readFileSync(resolveConfigDataFile(name), 'utf8'));
          }

          function uniqueById(records, id, label) {
            const hits = [];
            for (let i = 0; i < records.length; i++) {
              const record = records[i];
              if (record && typeof record === 'object' && !Array.isArray(record) && record.ID === id) {
                hits.push({ recordIndex: i, record });
              }
            }
            if (hits.length !== 1) throw new Error(`${label}: expected one ID ${id}; found ${hits.length}`);
            return hits[0];
          }

          const leonHero = uniqueById(load('ConfigDataHeroInfo.json'), 6, 'HeroInfo');
          if (leonHero.record.HeroInformation_ID !== 6) throw new Error('HeroInformation_ID mismatch');
          const leonInfo = uniqueById(load('ConfigDataHeroInformationInfo.json'), 6, 'HeroInformationInfo');
          if (leonInfo.record.Name !== '利昂' || leonInfo.record.HeroHeartFetterId !== 6) throw new Error('HeroInformation identity mismatch');
          const leonHeart = uniqueById(load('ConfigDataHeroHeartFetterInfo.json'), 6, 'HeroHeartFetterInfo');
          const skillIds = [70343,70344,70345,70346,70347,70348,70349,70350,70351,70352];
          if (JSON.stringify(leonHeart.record.HeroHeartFetterSkills) !== JSON.stringify(skillIds)) throw new Error('Heart skill sequence mismatch');

          const skillRecords = load('ConfigDataSkillInfo.json');
          const passiveIds = skillIds.map((id) => {
            const hit = uniqueById(skillRecords, id, 'SkillInfo');
            const refs = hit.record.PassiveBuffs_ID;
            if (!Array.isArray(refs) || refs.length !== 1 || refs[0] !== id) throw new Error(`PassiveBuffs_ID mismatch for ${id}`);
            return refs[0];
          });

          const sourceDir = path.dirname(resolveConfigDataFile('ConfigDataHeroInfo.json'));
          const candidates = [];
          for (const file of fs.readdirSync(sourceDir).filter((x) => x.endsWith('.json')).sort()) {
            if (file === 'ConfigDataSkillInfo.json') continue;
            let records;
            try { records = JSON.parse(fs.readFileSync(path.join(sourceDir, file), 'utf8')); } catch { continue; }
            if (!Array.isArray(records)) continue;
            const hits = [];
            let complete = true;
            for (const id of passiveIds) {
              const found = [];
              for (let i = 0; i < records.length; i++) {
                const record = records[i];
                if (record && typeof record === 'object' && !Array.isArray(record) && record.ID === id) found.push({ recordIndex: i, record });
              }
              if (found.length !== 1) { complete = false; break; }
              hits.push(found[0]);
            }
            if (complete) candidates.push({ file, hits });
          }

          if (candidates.length < 1) throw new Error('No complete non-Skill target candidates found');

          console.log('=== F3_PASSIVE_CANDIDATE_META_START ===');
          console.log(JSON.stringify(candidates.map((candidate) => ({
            file: candidate.file,
            targets: candidate.hits.map((hit) => ({ ID: hit.record.ID, recordIndex: hit.recordIndex }))
          })), null, 2));
          console.log('=== F3_PASSIVE_CANDIDATE_META_END ===');

          for (const candidate of candidates) {
            for (let i = 0; i < candidate.hits.length; i++) {
              const hit = candidate.hits[i];
              console.log(`=== F3_PASSIVE_CANDIDATE_${candidate.file}_LV${i + 1}_${hit.record.ID}_START ===`);
              console.log(JSON.stringify(hit.record, null, 2));
              console.log(`=== F3_PASSIVE_CANDIDATE_${candidate.file}_LV${i + 1}_${hit.record.ID}_END ===`);
            }
          }
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
