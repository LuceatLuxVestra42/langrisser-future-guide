name: F3 Locate Proven Leon Bond Effect Records

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate exact records by proven IDs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { resolveConfigDataSourceRoot } = require('./scripts/configdata-source-pack-maintenance-root.cjs');
          const root = resolveConfigDataSourceRoot();
          const ids = new Set([70088,70089,70099,70109,70110,70111,70352]);
          const hits = [];
          for (const name of fs.readdirSync(root).filter(n => /^ConfigData.*\.json$/i.test(n)).sort()) {
            let rows;
            try { rows = JSON.parse(fs.readFileSync(path.join(root, name), 'utf8')); } catch { continue; }
            if (!Array.isArray(rows)) continue;
            rows.forEach((record, recordIndex) => {
              if (!record || typeof record !== 'object' || Array.isArray(record) || !ids.has(Number(record.ID))) return;
              hits.push({table:name, recordIndex, id:Number(record.ID), keys:Object.keys(record), record});
            });
          }
          console.log('=== EXACT_ID_HITS_START ===');
          console.log(JSON.stringify(hits, null, 2));
          console.log('=== EXACT_ID_HITS_END ===');
          NODE
      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
