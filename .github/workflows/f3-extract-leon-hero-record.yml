name: F3 Extract Leon Normal Fetter Lv10 Skills

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Leon normal Fetter Lv10 skill records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { resolveConfigDataFile } = require('./scripts/configdata-source-pack-maintenance-root.cjs');

          function load(name) {
            return JSON.parse(fs.readFileSync(resolveConfigDataFile(name), 'utf8'));
          }

          function uniqueById(records, id, label) {
            const hits = [];
            for (let i = 0; i < records.length; i++) {
              const record = records[i];
              if (record && typeof record === 'object' && !Array.isArray(record) && record.ID === id) hits.push({ recordIndex: i, record });
            }
            if (hits.length !== 1) throw new Error(`${label}: expected one ID ${id}; found ${hits.length}`);
            return hits[0];
          }

          const hero = uniqueById(load('ConfigDataHeroInfo.json'), 6, 'HeroInfo');
          if (hero.record.HeroInformation_ID !== 6) throw new Error('HeroInformation_ID mismatch');
          const info = uniqueById(load('ConfigDataHeroInformationInfo.json'), 6, 'HeroInformationInfo');
          if (info.record.Name !== '利昂') throw new Error('Leon identity mismatch');
          const expectedFetterIds = [21,22,23,24,25];
          if (JSON.stringify(info.record.HeroFetters_ID) !== JSON.stringify(expectedFetterIds)) throw new Error('HeroFetters_ID mismatch');

          const fetterRecords = load('ConfigDataHeroFetterInfo.json');
          const skillRecords = load('ConfigDataSkillInfo.json');
          const out = [];

          for (const fetterId of expectedFetterIds) {
            const fetter = uniqueById(fetterRecords, fetterId, 'HeroFetterInfo');
            if (fetter.record.MaxLevel !== 10) throw new Error(`Fetter ${fetterId}: MaxLevel mismatch`);
            if (!Array.isArray(fetter.record.GotSkills_ID) || fetter.record.GotSkills_ID.length !== 10) {
              throw new Error(`Fetter ${fetterId}: GotSkills_ID must contain 10 levels`);
            }
            const lv10SkillId = fetter.record.GotSkills_ID[9];
            const skill = uniqueById(skillRecords, lv10SkillId, 'SkillInfo');
            out.push({
              fetterId,
              fetterName: fetter.record.Name,
              fetterRecordIndex: fetter.recordIndex,
              lv10SkillId,
              skillRecordIndex: skill.recordIndex,
              skill: skill.record,
            });
          }

          console.log('=== F3_LEON_NORMAL_FETTER_LV10_META_START ===');
          console.log(JSON.stringify(out.map((x) => ({
            fetterId: x.fetterId,
            fetterName: x.fetterName,
            fetterRecordIndex: x.fetterRecordIndex,
            lv10SkillId: x.lv10SkillId,
            skillRecordIndex: x.skillRecordIndex,
            PassiveBuffs_ID: x.skill.PassiveBuffs_ID ?? null,
          })), null, 2));
          console.log('=== F3_LEON_NORMAL_FETTER_LV10_META_END ===');

          for (const x of out) {
            console.log(`=== F3_LEON_NORMAL_FETTER_${x.fetterId}_LV10_SKILL_${x.lv10SkillId}_START ===`);
            console.log(JSON.stringify(x.skill, null, 2));
            console.log(`=== F3_LEON_NORMAL_FETTER_${x.fetterId}_LV10_SKILL_${x.lv10SkillId}_END ===`);
          }
          NODE

      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
