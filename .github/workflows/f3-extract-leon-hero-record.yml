name: F3 Probe Leon Heart Fetter Buff Effects

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f3-extract-leon-hero-record.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate exact buff records for proven Leon bond skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { resolveConfigDataSourceRoot } = require('./scripts/configdata-source-pack-maintenance-root.cjs');
          const root = resolveConfigDataSourceRoot();
          const names = fs.readdirSync(root).filter(n => /^ConfigData.*Buff.*\.json$/i.test(n)).sort();
          console.log('=== BUFF_TABLE_CANDIDATES ===');
          console.log(JSON.stringify(names, null, 2));
          const ids = new Set([70088,70089,70099,70109,70110,70111,70352]);
          const hits = [];
          for (const name of names) {
            let rows;
            try { rows = JSON.parse(fs.readFileSync(path.join(root, name), 'utf8')); } catch { continue; }
            if (!Array.isArray(rows)) continue;
            rows.forEach((record, recordIndex) => {
              if (record && typeof record === 'object' && !Array.isArray(record) && ids.has(Number(record.ID))) {
                hits.push({table:name, recordIndex, record});
              }
            });
          }
          console.log('=== TARGET_BUFF_HITS_START ===');
          console.log(JSON.stringify(hits, null, 2));
          console.log('=== TARGET_BUFF_HITS_END ===');
          NODE
      - name: Verify repository unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
