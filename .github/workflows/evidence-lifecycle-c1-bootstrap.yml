name: Evidence Lifecycle C1 Bootstrap

on:
  push:
    branches:
      - evidence-lifecycle-c1
    paths:
      - 'tools/evidence-lifecycle/**'
      - '.github/workflows/evidence-lifecycle-c1-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bootstrap owner and generate C1 inventory
        run: node tools/evidence-lifecycle/cli/bootstrap-c1.mjs

      - name: Check patch formatting
        run: git diff --check

      - name: Commit generated C1 state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/project-check/contracts/owners.v1.json \
                  tools/project-check/contracts/validators.v1.json \
                  tools/project-check/test/project-check-self-test.mjs \
                  tools/evidence-lifecycle/generated/c1-inventory.v1.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Complete Evidence Lifecycle C1 inventory'
          git push origin HEAD:evidence-lifecycle-c1
