name: Soldier Stage 11-A18 Bootstrap Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh-a18:
    if: github.head_ref == 'data/soldier-release-stage11-a17-promote-2022-10'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Stage 6-0 release baseline
        run: node scripts/refresh-soldier-release-metadata-stage11-a18.mjs --prepare-checkpoint

      - name: Freeze Stage 6-0 checkpoint before downstream regeneration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/soldier-stage6-0-checkpoint.v1.json
          if git diff --cached --quiet; then
            echo 'Stage 6-0 A18 checkpoint already frozen.'
          else
            git commit -m 'refresh Soldier stage 6-0 release baseline for A18'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Regenerate Stage 6-1 through Stage 6-7 from committed A18 checkpoint
        run: node scripts/refresh-soldier-release-metadata-stage11-a18.mjs --refresh-downstream

      - name: Freeze exact downstream refresh artifacts
        run: |
          git add \
            data/generated/soldier-stage6-1-full-records.v1.json \
            data/validation/soldier-stage6-1-full-records.v1.json \
            data/generated/soldier-stage6-2-classification.v1.json \
            data/validation/soldier-stage6-2-classification.v1.json \
            data/fixtures/soldier-stage6-3-fixtures.v1.json \
            data/validation/soldier-stage6-3-representative-qa.v1.json \
            data/validation/soldier-stage6-4-filter-qa.v1.json \
            data/generated/hero-soldier-page-links-stage6-5.v1.json \
            data/validation/soldier-stage6-5-reciprocal-links.v1.json \
            data/generated/soldier-stage6-6-expansion-basis.v1.json \
            data/validation/soldier-stage6-6-expansion-basis.v1.json \
            data/generated/soldier-stage6-7-site-admission.v1.json \
            data/validation/soldier-stage6-7-site-admission.v1.json \
            data/validation/soldier-release-metadata-stage11-a18-site-admission-refresh.v1.json
          if git diff --cached --quiet; then
            echo 'A18 downstream artifacts already frozen.'
          else
            git commit -m 'freeze Soldier stage 11-A18 site admission refresh PASS'
            git push origin HEAD:${{ github.head_ref }}
          fi
