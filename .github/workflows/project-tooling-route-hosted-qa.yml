name: Project Tooling Route Hosted QA

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - Authoritative GitHub Pages Deploy
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted validation mode
        required: true
        default: probe-current
        type: choice
        options:
          - probe-current
          - strict-candidate
      expected_sha:
        description: Explicit deployed source SHA required only for strict-candidate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: project-tooling-route-hosted-qa-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  preview_gate_plan:
    name: preview-gate-plan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      hosted_preview_required: ${{ steps.plan.outputs.hosted_preview_required }}
    steps:
      - name: Checkout exact PR head with base history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Project merge gate plan
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          result="$(node tools/project-check/cli/merge-gates.mjs --base "$BASE_SHA" --head "$HEAD_SHA")"
          printf '%s\n' "$result"
          required="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const r=JSON.parse(s);process.stdout.write(r.mergeGates.some(g=>g.id==='hosted-preview')?'true':'false')})")"
          echo "hosted_preview_required=$required" >> "$GITHUB_OUTPUT"
          echo "HOSTED_PREVIEW_REQUIRED=$required"

  publish-pr-preview:
    name: publish-pr-preview
    needs: preview_gate_plan
    if: >-
      github.event_name == 'pull_request' &&
      needs.preview_gate_plan.result == 'success' &&
      needs.preview_gate_plan.outputs.hosted_preview_required == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_REPOSITORY: LuceatLuxVestra42/Data
      PREVIEW_BRANCH: gh-pages
      PREVIEW_PATH: pr-${{ github.event.pull_request.number }}
      PREVIEW_BASE_URL: https://luceatluxvestra42.github.io/Data/pr-${{ github.event.pull_request.number }}/
      STATIC_SITE_BASE: /Data/pr-${{ github.event.pull_request.number }}/
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build isolated preview candidate
        run: |
          set -euo pipefail
          node scripts/build-equipment-name-kr-presentation.mjs
          bunx vite build --config vite.config.pages.ts
          cp dist/client/index.html dist/client/404.html
          cat > dist/client/preview-source.json <<JSON
          {
            "status": "PR_PREVIEW_DEPLOYMENT",
            "sourceRepository": "${GITHUB_REPOSITORY}",
            "sourceSha": "${SOURCE_SHA}",
            "pullRequest": ${{ github.event.pull_request.number }},
            "publisher": ".github/workflows/project-tooling-route-hosted-qa.yml"
          }
          JSON

      - name: Create Data repository GitHub App token
        id: preview-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERGEFINALIZER_APP_ID }}
          private-key: ${{ secrets.MERGEFINALIZER_APP_KEY }}
          owner: LuceatLuxVestra42
          repositories: Data
          permission-contents: write

      - name: Publish only this PR directory
        env:
          PREVIEW_TOKEN: ${{ steps.preview-token.outputs.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PREVIEW_BRANCH" "https://x-access-token:${PREVIEW_TOKEN}@github.com/${PREVIEW_REPOSITORY}.git" /tmp/preview-pages
          mkdir -p "/tmp/preview-pages/${PREVIEW_PATH}"
          find "/tmp/preview-pages/${PREVIEW_PATH}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a dist/client/. "/tmp/preview-pages/${PREVIEW_PATH}/"
          touch /tmp/preview-pages/.nojekyll
          cd /tmp/preview-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'PR_PREVIEW_PUBLISH=NO_CHANGE'
          else
            git commit -m "PR preview ${GITHUB_REPOSITORY}#${{ github.event.pull_request.number }} ${SOURCE_SHA}"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin "$PREVIEW_BRANCH"; then
                pushed=true
                break
              fi
              echo "PR_PREVIEW_PUSH_RETRY attempt=${attempt}" >&2
              git fetch origin "$PREVIEW_BRANCH"
              git rebase "origin/$PREVIEW_BRANCH"
              sleep $((attempt * 2))
            done
            if [[ "$pushed" != 'true' ]]; then
              echo 'BLOCKER_PREVIEW_PUBLISH_RETRY_EXHAUSTED' >&2
              exit 1
            fi
          fi

      - name: Wait for exact preview deployment
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            body="$(curl --silent --show-error --location --fail --max-time 15 "${PREVIEW_BASE_URL}preview-source.json?sha=${SOURCE_SHA}&run=${GITHUB_RUN_ID}" || true)"
            if printf '%s' "$body" | grep -q "\"sourceSha\": \"${SOURCE_SHA}\""; then
              echo 'PR_PREVIEW_PUBLISH=PASS'
              echo "PR_PREVIEW_URL=${PREVIEW_BASE_URL}"
              exit 0
            fi
            sleep 5
          done
          echo "BLOCKER_PREVIEW_DEPLOYMENT_NOT_FRESH url=${PREVIEW_BASE_URL} expected=${SOURCE_SHA}" >&2
          exit 1

      - name: Strict Hosted QA against exact Data Pages preview
        run: >-
          node tools/route-hosted-qa/cli/check-preview.mjs
          --pr "${{ github.event.pull_request.number }}"
          --expected-sha "$SOURCE_SHA"

  route-hosted-qa:
    name: route-hosted-qa
    needs: preview_gate_plan
    if: >-
      always() &&
      (
        (github.event_name == 'pull_request' &&
         needs.preview_gate_plan.result == 'success' &&
         needs.preview_gate_plan.outputs.hosted_preview_required == 'true') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact deployed source for strict follow-up
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate frozen RH3 Route Hosted QA runtime
        run: |
          node tools/route-hosted-qa/test/route-hosted-qa-self-test.mjs
          node tools/route-hosted-qa/test/preview-publisher-self-test.mjs

      - name: Validate strict candidate input
        if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'strict-candidate') }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'strict-candidate requires expected_sha as an explicit 40-hex source SHA.' >&2
            exit 2
          fi

      - name: Probe current deployed GitHub Pages
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe-current') }}
        run: node tools/route-hosted-qa/cli/check.mjs --probe-current

      - name: Strict Hosted QA against exact deployed source SHA
        if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'strict-candidate') }}
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
        run: node tools/route-hosted-qa/cli/check.mjs --expected-sha "$EXPECTED_SHA"
