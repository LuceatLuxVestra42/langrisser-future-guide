name: Soldier Training Presentation Hosted Browser QA

on:
  workflow_run:
    workflows:
      - Authoritative GitHub Pages Deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/

jobs:
  hosted-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify Soldier Training hosted browser surface
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/validate-soldier-training-presentation-hosted.mjs
