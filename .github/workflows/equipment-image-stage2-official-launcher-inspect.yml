name: Equipment Image Stage 2 Official Launcher Inspect

on:
  push:
    branches:
      - work/equipment-image-stage2-hold29
    paths:
      - '.github/workflows/equipment-image-stage2-official-launcher-inspect.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify current official installer against CDN metadata
        run: |
          set -euo pipefail
          URL='https://mhmnzdownload.zlongame.com/MHMNZ/Clientdown/DownLoad-MZ-PC.exe'
          REF='https://mz.zlongame.com/jx/mzdownload/20180731/5473.html'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          curl --http1.1 -fL --retry 2 -A "$UA" -e "$REF" -D /tmp/download.headers -o /tmp/DownLoad-MZ-PC.exe "$URL"
          MD5="$(md5sum /tmp/DownLoad-MZ-PC.exe | awk '{print $1}')"
          CDN_MD5="$(grep -i '^x-cos-meta-md5:' /tmp/download.headers | tail -1 | cut -d: -f2- | tr -d ' \r\n')"
          echo "size=$(stat -c %s /tmp/DownLoad-MZ-PC.exe) md5=$MD5 cdn-md5=$CDN_MD5"
          grep -Ei '^(Last-Modified|Etag|Content-Length|x-cos-meta-md5):' /tmp/download.headers || true
          test -n "$CDN_MD5"
          test "$MD5" = "$CDN_MD5"
      - name: Inspect current PGSetup PE resources
        run: |
          set +e
          echo '=== PE archive/resource listing ==='
          7z l -ba /tmp/DownLoad-MZ-PC.exe | head -n 300
          echo '=== embedded archive signatures ==='
          grep -abo $'7z\xbc\xaf\x27\x1c' /tmp/DownLoad-MZ-PC.exe | head -n 100 || true
          grep -abo $'PK\x03\x04' /tmp/DownLoad-MZ-PC.exe | head -n 100 || true
          exit 0
      - name: Scan current PGSetup strings for distribution endpoints
        run: |
          set +e
          echo '=== ASCII endpoints/config strings ==='
          strings -a -n 6 /tmp/DownLoad-MZ-PC.exe \
            | grep -Eai 'https?://|mhmnz|zlongame|patch|update|manifest|version|cdn|download|clientdown|assetbundle|exportassetbundle|\.ini|\.json|\.xml|\.txt|api/' \
            | sort -u \
            | head -n 1500
          echo '=== UTF-16LE endpoints/config strings ==='
          strings -el -n 6 /tmp/DownLoad-MZ-PC.exe \
            | grep -Eai 'https?://|mhmnz|zlongame|patch|update|manifest|version|cdn|download|clientdown|assetbundle|exportassetbundle|\.ini|\.json|\.xml|\.txt|api/' \
            | sort -u \
            | head -n 1500
          exit 0
