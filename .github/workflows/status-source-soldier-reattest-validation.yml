name: Status Source Soldier Reattestation Validation

on:
  push:
    branches:
      - status-source/soldier-same-path-successor-r1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select active Status Sources
        run: node tools/status-source/cli/select.mjs

      - name: Validate R1-1 selection parity
        run: node tools/status-source/test/current-main-parity.mjs

      - name: Validate R1-2 promotion parity
        run: node tools/status-source/test/promotion-parity.mjs

      - name: Validate R1-3 producer gate parity
        run: node tools/status-source/test/producer-gate-parity.mjs

      - name: Validate R1-4 artifact bridge parity
        run: node tools/status-source/test/artifact-bridge-parity.mjs

      - name: Validate R1-5 lifecycle parity
        run: node tools/status-source/test/lifecycle-parity.mjs

      - name: Verify tracked state unchanged
        run: git diff --exit-code && git diff --cached --exit-code
