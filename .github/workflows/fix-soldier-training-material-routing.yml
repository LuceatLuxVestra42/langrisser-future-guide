name: Fix Soldier Training Material Routing

on:
  push:
    branches:
      - work/soldier-training-cost-material-icons-48
    paths:
      - ".github/workflows/fix-soldier-training-material-routing.yml"

permissions:
  contents: write

jobs:
  fix-routing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/soldier-training-cost-material-icons-48
      - name: Align supplemental artifacts with existing Soldier training-material owner rule
        shell: bash
        run: |
          set -euo pipefail
          git mv data/manifests/soldier-training-cost-material-assets-supplemental.v1.json data/manifests/soldier-training-material-cost-assets-supplemental.v1.json
          git mv scripts/validate-soldier-training-cost-material-assets-supplemental.mjs scripts/validate-soldier-training-material-cost-assets-supplemental.mjs
          python3 - <<'PY'
          from pathlib import Path
          helper = Path('src/lib/soldier-training-cost-material-assets-supplemental.ts')
          text = helper.read_text(encoding='utf-8')
          text = text.replace('../../data/manifests/soldier-training-cost-material-assets-supplemental.v1.json', '../../data/manifests/soldier-training-material-cost-assets-supplemental.v1.json')
          helper.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate-soldier-training-material-cost-assets-supplemental.mjs')
          text = validator.read_text(encoding='utf-8')
          text = text.replace('data/manifests/soldier-training-cost-material-assets-supplemental.v1.json', 'data/manifests/soldier-training-material-cost-assets-supplemental.v1.json')
          validator.write_text(text, encoding='utf-8')
          PY
          node scripts/validate-soldier-training-material-cost-assets-supplemental.mjs
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-soldier-training-material-routing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Soldier Training supplemental assets with owner routing"
          git push origin HEAD:work/soldier-training-cost-material-icons-48
