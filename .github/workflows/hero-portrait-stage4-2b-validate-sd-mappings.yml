name: Hero portrait Stage 4-2B validate SD mappings
on:
  push:
    branches:
      - work/hero-portrait-stage4-2b-explicit-fallback-source-acquisition
    paths:
      - scripts/hero_portrait_stage4_2b_validate_sd_mappings.py
      - .github/workflows/hero-portrait-stage4-2b-validate-sd-mappings.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'gdown==6.1.0' 'Pillow==11.3.0'
      - run: python scripts/hero_portrait_stage4_2b_validate_sd_mappings.py
      - uses: actions/upload-artifact@v4
        with:
          name: hero-stage4-2b-sd-mapped-review
          path: /tmp/hero42b-review/
          retention-days: 7
      - run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2b-sd-mapped-source-validation.v1.json
          if git diff --cached --quiet; then echo no-change; else git commit -m 'Validate Hero portrait Stage 4-2B SD mappings'; git push; fi
