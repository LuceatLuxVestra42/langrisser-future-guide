name: Soldier Stage 6-5 Reciprocal Links

on:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'scripts/finalize-soldier-stage6-5-reciprocal-links.cjs'
      - 'data/generated/hero-soldier-relations.v1.json'
      - 'data/validation/hero-soldier-relation-validation.v1.json'
      - 'data/generated/hero-soldier-by-hero.v1.json'
      - 'data/generated/hero-soldier-by-soldier.v1.json'
      - 'data/generated/hero-page-soldiers-stage5-3.v1.json'
      - 'data/validation/hero-page-stage5-3-final.v1.json'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage5-5-heroes.v1.json'
      - 'data/validation/soldier-stage6-2-classification.v1.json'
      - 'data/validation/soldier-stage6-3-representative-qa.v1.json'
      - 'data/validation/soldier-stage6-4-filter-qa.v1.json'
      - 'data/generated/hero-soldier-page-links-stage6-5.v1.json'
      - 'data/validation/soldier-stage6-5-reciprocal-links.v1.json'
      - '.github/workflows/soldier-stage6-5-reciprocal-links.yml'
  pull_request:
    paths:
      - 'scripts/finalize-soldier-stage6-5-reciprocal-links.cjs'
      - 'data/generated/hero-soldier-relations.v1.json'
      - 'data/validation/hero-soldier-relation-validation.v1.json'
      - 'data/generated/hero-soldier-by-hero.v1.json'
      - 'data/generated/hero-soldier-by-soldier.v1.json'
      - 'data/generated/hero-page-soldiers-stage5-3.v1.json'
      - 'data/validation/hero-page-stage5-3-final.v1.json'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage5-5-heroes.v1.json'
      - 'data/validation/soldier-stage6-2-classification.v1.json'
      - 'data/validation/soldier-stage6-3-representative-qa.v1.json'
      - 'data/validation/soldier-stage6-4-filter-qa.v1.json'
      - 'data/generated/hero-soldier-page-links-stage6-5.v1.json'
      - 'data/validation/soldier-stage6-5-reciprocal-links.v1.json'
      - '.github/workflows/soldier-stage6-5-reciprocal-links.yml'

permissions:
  contents: write

jobs:
  reciprocal-link-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Soldier Stage 6-5 reciprocal link QA
        run: node scripts/finalize-soldier-stage6-5-reciprocal-links.cjs

      - name: Upload Stage 6-5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage6-5-reciprocal-links
          path: |
            data/generated/hero-soldier-page-links-stage6-5.v1.json
            data/validation/soldier-stage6-5-reciprocal-links.v1.json

      - name: Freeze Stage 6-5 artifacts on work branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/hero-soldier-page-links-stage6-5.v1.json \
            data/validation/soldier-stage6-5-reciprocal-links.v1.json
          if git diff --cached --quiet; then
            echo "Soldier Stage 6-5 artifacts already frozen."
          else
            git commit -m "freeze Soldier stage 6-5 reciprocal links PASS"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Verify frozen Stage 6-5 artifacts on main or PR
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: git diff --exit-code -- data/generated/hero-soldier-page-links-stage6-5.v1.json data/validation/soldier-stage6-5-reciprocal-links.v1.json

