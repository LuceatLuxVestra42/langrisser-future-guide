name: Equipment Image Stage 0

on:
  push:
    branches:
      - work/equipment-image-stage0
    paths:
      - scripts/build-equipment-image-stage0.mjs
      - data/contracts/equipment-image-stage0-contract.v1.json
      - .github/workflows/equipment-image-stage0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Equipment image locator inventory
        run: node scripts/build-equipment-image-stage0.mjs

      - name: Validate Stage 0 checkpoint
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('data/validation/equipment-image-stage0-summary.v1.json', 'utf8'));
          if (summary.status !== 'PASS_EQUIPMENT_IMAGE_STAGE0') throw new Error(`unexpected status ${summary.status}`);
          if (summary.freezeState !== 'EQUIPMENT_IMAGE_STAGE0_FROZEN') throw new Error(`unexpected freeze ${summary.freezeState}`);
          if (summary.semanticStageReopened !== false) throw new Error('semantic stage was reopened');
          if (summary.canonicalIdentityChanged !== false) throw new Error('canonical identity changed');
          if (summary.runtimeNameJoinRequired !== false) throw new Error('runtime name join required');
          if (summary.productionJoinKey !== 'equipmentId') throw new Error('production join key drift');
          if (summary.counts.canonical !== 390) throw new Error(`canonical ${summary.counts.canonical}`);
          if (summary.counts.public !== 373) throw new Error(`public ${summary.counts.public}`);
          if (summary.counts.nonPublic !== 17) throw new Error(`nonPublic ${summary.counts.nonPublic}`);
          if (summary.counts.uniqueWebPaths !== 390) throw new Error(`uniqueWebPaths ${summary.counts.uniqueWebPaths}`);
          if (summary.representativeFixtures.length !== 5) throw new Error(`representatives ${summary.representativeFixtures.length}`);
          if (summary.hardErrors.length !== 0) throw new Error(summary.hardErrors.join('\n'));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Re-run frozen Equipment admission QA
        run: bun scripts/validate-equipment-stage4-6-admission-route-qa.mjs

      - name: Persist Stage 0 generated checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/generated/equipment-image-stage0-locator-inventory.v1.json \
            data/validation/equipment-image-stage0-summary.v1.json \
            data/checkpoints/equipment-image-stage0.v1.json
          if git diff --cached --quiet; then
            echo 'Stage 0 outputs already current.'
          else
            git commit -m 'Materialize Equipment image Stage 0 checkpoint [skip ci]'
            git push origin HEAD:work/equipment-image-stage0
          fi
