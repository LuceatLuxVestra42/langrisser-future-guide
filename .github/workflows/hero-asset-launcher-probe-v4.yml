name: Hero Asset Launcher Probe v4

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-hero-launcher-v4.ps1'
      - '.github/workflows/hero-asset-launcher-probe-v4.yml'

permissions:
  contents: read

jobs:
  static-probe-v4:
    if: github.event.pull_request.head.ref == 'work/hero-asset-launcher-probe'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v5
      - name: Probe exact official launcher without execution
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/probe-hero-launcher-v4.ps1
      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-asset-launcher-probe-v4-report
          path: ${{ runner.temp }}/langrisser-launcher-probe-v4/report
          if-no-files-found: warn
          retention-days: 3
