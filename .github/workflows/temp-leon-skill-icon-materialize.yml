name: Temporary Leon Skill Icon Materialize

on:
  push:
    branches:
      - feat/leon-skill-icon-assets-20260902

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download frozen official verification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/leon-skill-icons-official-verify.zip \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9825841985/zip
          echo "25c1b2dfdec1887c38c56fa2d0ea7d98636effff2be62af9350fe1292cbb249d  /tmp/leon-skill-icons-official-verify.zip" | sha256sum -c -
          rm -rf /tmp/leon-skill-icons-official-verify
          mkdir -p /tmp/leon-skill-icons-official-verify
          unzip -q /tmp/leon-skill-icons-official-verify.zip -d /tmp/leon-skill-icons-official-verify

      - name: Materialize 12 verified PNGs and frozen manifest
        shell: bash
        run: |
          python <<'PY'
          import hashlib
          import io
          import json
          import pathlib
          from PIL import Image

          artifact = pathlib.Path('/tmp/leon-skill-icons-official-verify')
          evidence_path = artifact / 'leon-skill-icons-official-verify.json'
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if evidence.get('status') != 'PASS':
              raise SystemExit('verification artifact status is not PASS')
          coverage = evidence.get('coverage') or {}
          if coverage.get('targetCount') != 12 or coverage.get('exactHitTargets') != 12 or coverage.get('decodedTargets') != 12:
              raise SystemExit(f'unexpected verification coverage: {coverage}')
          if evidence.get('blockers') or evidence.get('reviews'):
              raise SystemExit('verification artifact has blocker/review')

          bundle_by_part = {
              int(row['packagePart']): row
              for row in evidence['packageCatalog']['candidateBundles']
          }
          expected_bundle_sha = {
              27: '5ca1962b06355b48fe0ca6531e002a13a63a1d35e42f558471aace39d4298adf',
              62: '14c4fe918356f47f0e9f5a59e77dae31e4eb4a0d19e30d898c9d8c1085b8eb12',
          }
          if set(bundle_by_part) != set(expected_bundle_sha):
              raise SystemExit(f'unexpected bundle parts: {sorted(bundle_by_part)}')
          for part, expected_sha in expected_bundle_sha.items():
              if bundle_by_part[part].get('bundleSha256') != expected_sha:
                  raise SystemExit(f'bundle SHA mismatch for package {part}')

          out = pathlib.Path('public/images/heroes/skill-icons')
          out.mkdir(parents=True, exist_ok=True)
          records = []
          seen_paths = set()
          for result in evidence['results']:
              source_path = result['sourcePath']
              hits = result.get('hits') or []
              if len(hits) != 1 or result.get('status') != 'PASS_EXACT_HIT_RAW_EQUIVALENT':
                  raise SystemExit(f'{source_path}: not a single exact verified hit')
              hit = hits[0]
              if hit.get('objectType') != 'Sprite' or hit.get('decodeStatus') != 'PASS' or hit.get('nonEmptyAlpha') is not True:
                  raise SystemExit(f'{source_path}: Sprite/decode/alpha proof failed')
              decoded = pathlib.Path(hit['decodedPng']).name
              source_png = artifact / 'png' / decoded
              png = source_png.read_bytes()
              image = Image.open(io.BytesIO(png)).convert('RGBA')
              rgba_sha = hashlib.sha256(image.tobytes()).hexdigest()
              if rgba_sha != hit['rgbaSha256']:
                  raise SystemExit(f'{source_path}: artifact pixel SHA mismatch')
              if [image.width, image.height] != [hit['width'], hit['height']]:
                  raise SystemExit(f'{source_path}: artifact dimension mismatch')
              if image.getchannel('A').getbbox() is None:
                  raise SystemExit(f'{source_path}: artifact alpha is empty')
              public_name = pathlib.PurePosixPath(source_path).name
              public_path = f'/images/heroes/skill-icons/{public_name}'
              if public_path in seen_paths:
                  raise SystemExit(f'duplicate public path: {public_path}')
              seen_paths.add(public_path)
              target = out / public_name
              target.write_bytes(png)
              bundle = bundle_by_part[int(hit['packagePart'])]
              records.append({
                  'role': result['kind'],
                  'skillIds': result['skillIds'],
                  'nameCn': result.get('nameCn'),
                  'sourcePath': source_path,
                  'packagePart': hit['packagePart'],
                  'packageName': hit['packageName'],
                  'bundleEntry': hit['bundleEntry'],
                  'bundleSha256': bundle['bundleSha256'],
                  'containerPath': hit['containerPath'],
                  'objectType': hit['objectType'],
                  'rawObjectSha256': hit['rawObjectSha256'],
                  'rgbaSha256': hit['rgbaSha256'],
                  'width': hit['width'],
                  'height': hit['height'],
                  'publicPath': public_path,
                  'pngBytes': len(png),
                  'pngSha256': hashlib.sha256(png).hexdigest(),
              })

          if len(records) != 12:
              raise SystemExit(f'materialized {len(records)} records, expected 12')
          manifest = {
              'version': 1,
              'schemaId': 'hero-skill-icon-assets/v1',
              'status': 'FROZEN',
              'scope': {
                  'heroId': 6,
                  'heroNameKr': '레온',
                  'targetUniqueIconCount': 12,
                  'frontendConnectedGroups': ['talent', 'normal', 'direct'],
                  'materializedButNotYetRenderedGroups': ['sp'],
                  'centralDisciplineIncluded': False,
              },
              'source': {
                  'kind': 'OFFICIAL_INSTALLER',
                  'installVersion': evidence['source']['installVersion'],
                  'base': evidence['source']['base'],
                  'unityParser': evidence['source']['unityParser'],
                  'unityContainerRootPrefix': evidence['source']['unityContainerRootPrefix'],
                  'verificationRunId': 33573620678,
                  'verificationJobId': 100072692506,
                  'verificationArtifactId': 9825841985,
                  'verificationArtifactDigest': 'sha256:25c1b2dfdec1887c38c56fa2d0ea7d98636effff2be62af9350fe1292cbb249d',
                  'materializationRule': 'exact verified sourcePath only; no basename/name/ID inference',
              },
              'records': records,
              'validation': {
                  'exactHit': '12/12',
                  'sprite': '12/12',
                  'rgbaDecode': '12/12',
                  'nonEmptyAlpha': '12/12',
                  'semanticReopen': False,
                  'blocker': None,
                  'review': None,
              },
          }
          pathlib.Path('data/generated/hero-skill-icon-assets.v1.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'status':'PASS_MATERIALIZED','records':len(records)}, ensure_ascii=False))
          PY

      - name: Commit materialized assets and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-leon-skill-icon-materialize.yml
          git add data/generated/hero-skill-icon-assets.v1.json public/images/heroes/skill-icons
          git commit -m "Materialize verified Leon skill icons"
          git push origin HEAD:${GITHUB_REF_NAME}
