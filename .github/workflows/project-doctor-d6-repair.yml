name: Project Doctor D6 One-time Freshness Repair

on:
  push:
    branches:
      - work/project-doctor-closeout
    paths:
      - .github/workflows/project-doctor-d6-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Explicitly regenerate D1 outputs and reseal D5
        run: npm run doctor:freshness:refresh

      - name: Validate repaired seal
        run: npm run doctor:freshness:validate

      - name: Commit only repaired Doctor outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/generated/project-doctor-d1-1-status.v1.json \
            data/validation/project-doctor-d1-1-summary.v1.json \
            data/validation/project-doctor-d1-2-summary.v1.json \
            data/generated/project-doctor-d5-freshness.v1.json
          if git diff --cached --quiet; then
            echo 'Project Doctor freshness baseline already current.'
          else
            git commit -m 'Refresh Project Doctor D1 outputs and D5 seal [skip ci]'
            git push origin HEAD:work/project-doctor-closeout
          fi
