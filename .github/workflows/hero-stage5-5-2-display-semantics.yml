name: Hero Stage 5-5-2 display semantics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-stage5-5-2-display-semantics.yml'
      - 'scripts/analyze_hero_stage5_5_2_display_semantics.cjs'
      - 'scripts/profile_hero_stage5_5_2_fields.cjs'
      - 'scripts/analyze_hero_faction_candidates.cjs'
      - 'scripts/build_hero_faction_map.cjs'
      - 'scripts/analyze_hero_cv_candidates.cjs'
      - 'scripts/inventory_hero_cv_fields.cjs'
      - 'scripts/build_hero_cv_map.cjs'
      - 'scripts/analyze_hero_rarity.cjs'
      - 'scripts/build_hero_origin_map.cjs'
      - 'scripts/analyze_hero_artwork_fields.cjs'
      - 'data/configdata/**'
      - 'data/hero-name-master.v1.json'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build semantic diagnostics
        run: |
          node scripts/analyze_hero_stage5_5_2_display_semantics.cjs
          node scripts/profile_hero_stage5_5_2_fields.cjs
          node scripts/analyze_hero_faction_candidates.cjs
          node scripts/build_hero_faction_map.cjs
          node scripts/analyze_hero_cv_candidates.cjs
          node scripts/inventory_hero_cv_fields.cjs
          node scripts/build_hero_cv_map.cjs
          node scripts/analyze_hero_rarity.cjs
          node scripts/build_hero_origin_map.cjs
          node scripts/analyze_hero_artwork_fields.cjs
      - name: Freeze diagnostic artifacts
        run: |
          TARGET1='data/validation/hero-page-stage5-5-2-display-semantics.v1.json'
          TARGET2='data/validation/hero-page-stage5-5-2-field-profile.v1.json'
          TARGET3='data/validation/hero-page-stage5-5-2-faction-candidates.v1.json'
          TARGET4='data/validation/hero-page-stage5-5-2-factions.v1.json'
          TARGET5='data/validation/hero-page-stage5-5-2-cv-candidates.v1.json'
          TARGET6='data/validation/hero-page-stage5-5-2-cv-field-inventory.v1.json'
          TARGET7='data/validation/hero-page-stage5-5-2-cv.v1.json'
          TARGET8='data/validation/hero-page-stage5-5-2-rarity.v1.json'
          TARGET9='data/validation/hero-page-stage5-5-2-origin.v1.json'
          TARGET10='data/validation/hero-page-stage5-5-2-artwork.v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET1" "$TARGET2" "$TARGET3" "$TARGET4" "$TARGET5" "$TARGET6" "$TARGET7" "$TARGET8" "$TARGET9" "$TARGET10")" ]; then
            echo 'Diagnostics already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET1" "$TARGET2" "$TARGET3" "$TARGET4" "$TARGET5" "$TARGET6" "$TARGET7" "$TARGET8" "$TARGET9" "$TARGET10"
          git commit -m 'Freeze Hero Stage 5-5-2 semantic diagnostics'
          git push