name: Hero Stage 5-5-2 display semantics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-stage5-5-2-display-semantics.yml'
      - 'scripts/analyze_hero_stage5_5_2_display_semantics.cjs'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/hero-name-master.v1.json'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build semantic diagnostic
        run: node scripts/analyze_hero_stage5_5_2_display_semantics.cjs
      - name: Freeze diagnostic artifact
        run: |
          TARGET='data/validation/hero-page-stage5-5-2-display-semantics.v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'Diagnostic already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Freeze Hero Stage 5-5-2 display semantics diagnostic'
          git push
