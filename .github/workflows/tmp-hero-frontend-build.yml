name: Temporary Hero Frontend Build Check

on:
  pull_request:
    paths:
      - "src/lib/hero-page.functions.ts"
      - "src/lib/hero-page.server.ts"
      - "src/routes/heroes_.$heroId.tsx"
      - ".github/workflows/tmp-hero-frontend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
