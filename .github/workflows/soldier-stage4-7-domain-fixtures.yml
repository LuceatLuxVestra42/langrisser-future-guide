name: Soldier Stage 4-7 Domain Fixtures

on:
  pull_request:
    paths:
      - 'scripts/validate-soldier-stage4-7-domain-fixtures.cjs'
      - 'scripts/finalize-soldier-stage3.cjs'
      - 'scripts/lib/configdata-direct.cjs'
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/validation/soldier-representative-fixture-plan.v1.json'
      - 'data/validation/hero-soldier-relation-validation.v1.json'
      - '.github/workflows/soldier-stage4-7-domain-fixtures.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/validate-soldier-stage4-7-domain-fixtures.cjs'
      - 'scripts/finalize-soldier-stage3.cjs'
      - 'scripts/lib/configdata-direct.cjs'
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/validation/soldier-representative-fixture-plan.v1.json'
      - 'data/validation/hero-soldier-relation-validation.v1.json'
      - 'data/validation/soldier-stage4-7-domain-fixtures.v1.json'
      - '.github/workflows/soldier-stage4-7-domain-fixtures.yml'

permissions:
  contents: write

jobs:
  validate-domain-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate current Soldier Stage 3 from direct JSON
        run: node scripts/finalize-soldier-stage3.cjs
      - name: Validate Soldier Stage 4-7 domain fixtures
        run: node scripts/validate-soldier-stage4-7-domain-fixtures.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: soldier-stage4-7-domain-fixtures
          path: data/validation/soldier-stage4-7-domain-fixtures.v1.json
      - name: Freeze PASS validation on PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/soldier-stage4-7-domain-fixtures.v1.json
          if git diff --cached --quiet; then
            echo "Stage 4-7 validation already frozen."
          else
            git commit -m "freeze Soldier stage 4-7 domain fixture PASS"
            git push origin HEAD:${{ github.head_ref }}
          fi
