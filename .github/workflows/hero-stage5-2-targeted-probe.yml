name: Hero Stage 5-2 targeted probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-stage5-2-targeted-probe.yml'
      - 'scripts/probe_hero_stage5_2_targeted.cjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run targeted Stage 5-2 probe
        run: node scripts/probe_hero_stage5_2_targeted.cjs
      - name: Freeze targeted probe
        run: |
          TARGET='data/validation/hero-page-stage5-2-targeted-probe.v1.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo 'Targeted probe already current.'
          else
            git commit -m 'Freeze Hero Stage 5-2 targeted probe'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
