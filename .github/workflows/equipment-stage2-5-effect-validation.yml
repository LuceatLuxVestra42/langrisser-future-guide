name: Equipment Stage 2-5 Effect Validation

on:
  push:
    paths:
      - '.github/workflows/equipment-stage2-5-effect-validation.yml'
      - 'scripts/analyze-equipment-stage2-5.mjs'
      - 'data/configdata/ConfigDataEquipmentInfo.json'
      - 'data/configdata/ConfigDataSkillInfo.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze Equipment Stage 2-5 effects
        run: node scripts/analyze-equipment-stage2-5.mjs
      - name: Persist Stage 2-5 analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/equipment_stage2_5_effect_analysis.json
          if git diff --cached --quiet; then
            echo "No Stage 2-5 changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 2-5 effect analysis"
          git push
