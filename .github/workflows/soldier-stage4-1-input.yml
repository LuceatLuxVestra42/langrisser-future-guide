name: Soldier Stage 4-1 Direct JSON Input

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataArmyInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'scripts/lib/configdata-direct.cjs'
      - 'scripts/validate-soldier-stage4-1-input.cjs'
      - 'scripts/finalize-soldier-stage2.cjs'
      - 'scripts/finalize-soldier-stage3.cjs'
      - 'scripts/finalize-soldier-stage3-postprocess.cjs'
      - '.github/workflows/soldier-stage4-1-input.yml'
  pull_request:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataArmyInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'scripts/lib/configdata-direct.cjs'
      - 'scripts/validate-soldier-stage4-1-input.cjs'
      - 'scripts/finalize-soldier-stage2.cjs'
      - 'scripts/finalize-soldier-stage3.cjs'
      - 'scripts/finalize-soldier-stage3-postprocess.cjs'
      - '.github/workflows/soldier-stage4-1-input.yml'

permissions:
  contents: read

jobs:
  validate-direct-json-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate direct ConfigData adapter
        run: node scripts/validate-soldier-stage4-1-input.cjs
      - name: Smoke-test Soldier Master consumer
        run: node scripts/finalize-soldier-stage2.cjs
      - name: Smoke-test Soldier Stage 3 consumer
        run: node scripts/finalize-soldier-stage3.cjs
      - name: Assert finalized Stage 3 rules
        run: node scripts/finalize-soldier-stage3-postprocess.cjs
      - name: Upload stage 4-1 smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage4-1-direct-json
          path: |
            data/validation/soldier-stage4-1-input.v1.json
            data/generated/soldier-master.v1.json
            data/validation/soldier-stage2-final.v1.json
            data/generated/soldier-stage3.v1.json
            data/validation/soldier-stage3-final.v1.json
