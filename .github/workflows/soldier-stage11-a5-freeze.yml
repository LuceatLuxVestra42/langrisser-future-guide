name: Temporary Soldier Stage 11-A5 Freeze

on:
  push:
    branches:
      - soldier/stage11-a5-cn-chronology-promotion-correction

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate frozen Stage 5-8 baseline
        run: node scripts/finalize-soldier-stage5-8-release.cjs

      - name: Promote admitted Stage 11-A1 official release evidence
        run: node scripts/promote-soldier-release-metadata-stage11-a2.mjs

      - name: Validate historical A/A1/A2 chain
        run: |
          node scripts/validate-soldier-release-metadata-stage11-a.mjs
          node scripts/validate-soldier-release-official-notice-evidence-stage11-a1.mjs
          node scripts/validate-soldier-release-metadata-stage11-a2.mjs

      - name: Validate Stage 11-A4 evidence boundary
        run: node scripts/validate-soldier-release-cn-chronology-correction-stage11-a4.mjs

      - name: Apply and validate Stage 11-A5 correction
        run: |
          node scripts/promote-soldier-release-metadata-stage11-a5-correction.mjs
          node scripts/validate-soldier-release-metadata-stage11-a5.mjs

      - name: Verify immutable evidence sources are unchanged
        run: git diff --exit-code -- data/soldier-release-source.v1.json data/soldier-release-official-notice-evidence-stage11-a1.v1.json data/soldier-release-cn-chronology-correction-evidence-stage11-a4.v1.json data/validation/soldier-release-metadata-stage11-a2-promotion.v1.json

      - name: Verify exact generated path set
        run: |
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            data/generated/soldier-list-stage5-8.v1.json
            data/generated/soldier-release-metadata.v1.json
            data/validation/soldier-release-metadata-stage11-a5-correction.v1.json
            data/validation/soldier-stage5-8-release.v1.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo "Unexpected generated changed path set" >&2
            exit 1
          fi

      - name: Freeze Stage 11-A5 artifacts
        run: |
          git add \
            data/generated/soldier-release-metadata.v1.json \
            data/generated/soldier-list-stage5-8.v1.json \
            data/validation/soldier-stage5-8-release.v1.json \
            data/validation/soldier-release-metadata-stage11-a5-correction.v1.json
          git commit -m "Freeze Soldier Stage 11-A5 CN chronology correction"
          git push origin HEAD:${GITHUB_REF_NAME}
