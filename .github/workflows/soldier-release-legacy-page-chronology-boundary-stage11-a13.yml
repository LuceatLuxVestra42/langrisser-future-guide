name: Soldier Stage 11-A13 Legacy Page Chronology Boundary

on:
  pull_request:
    paths:
      - 'data/soldier-release-legacy-page-chronology-boundary-stage11-a13.v1.json'
      - 'data/soldier-release-official-data-site-identity-stage11-a9.v1.json'
      - 'data/soldier-release-official-data-site-identity-stage11-a10.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'scripts/validate-soldier-release-legacy-page-chronology-boundary-stage11-a13.mjs'
      - '.github/workflows/soldier-release-legacy-page-chronology-boundary-stage11-a13.yml'
  push:
    branches:
      - main
    paths:
      - 'data/soldier-release-legacy-page-chronology-boundary-stage11-a13.v1.json'
      - 'data/soldier-release-official-data-site-identity-stage11-a9.v1.json'
      - 'data/soldier-release-official-data-site-identity-stage11-a10.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'scripts/validate-soldier-release-legacy-page-chronology-boundary-stage11-a13.mjs'
      - '.github/workflows/soldier-release-legacy-page-chronology-boundary-stage11-a13.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Stage 11-A13 legacy page chronology boundary
        run: node scripts/validate-soldier-release-legacy-page-chronology-boundary-stage11-a13.mjs
      - name: Verify evidence validation is read-only
        run: git diff --exit-code
