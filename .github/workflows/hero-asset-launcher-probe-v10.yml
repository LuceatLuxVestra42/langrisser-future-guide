name: Hero Asset Launcher Probe v10

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-hero-launcher-v10.ps1'
      - '.github/workflows/hero-asset-launcher-probe-v10.yml'

permissions:
  contents: read

jobs:
  embedded-protocol-scan:
    if: github.event.pull_request.head.ref == 'work/hero-asset-launcher-probe'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v5
      - name: Statically scan embedded PGLauncher without execution
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/probe-hero-launcher-v10.ps1
      - name: Upload text reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-asset-launcher-probe-v10-report
          path: ${{ runner.temp }}/langrisser-launcher-probe-v10/report
          if-no-files-found: warn
          retention-days: 3
