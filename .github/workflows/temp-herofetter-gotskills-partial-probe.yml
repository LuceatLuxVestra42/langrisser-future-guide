name: Temporary HeroFetter GotSkills partial probe
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract official IL2CPP pair and partial dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hfgsp out/herofetter-gotskills-partial
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib,hashlib,json
          D=pathlib.Path('/tmp/hfgsp'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          src={'installVersion':V,'files':{}}
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ent(u,hs(u)) if e[0]==target); raw=get(u,e); (D/out).write_bytes(raw); src['files'][out]={'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}
          pathlib.Path('out/herofetter-gotskills-partial/source.json').write_text(json.dumps(src,indent=2)+'\n')
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release >/dev/null 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/hfgsp/dump
          set +e
          dotnet "$DLL" /tmp/hfgsp/GameAssembly.dll /tmp/hfgsp/global-metadata.dat /tmp/hfgsp/dump > out/herofetter-gotskills-partial/dumper.log 2>&1
          echo $? > out/herofetter-gotskills-partial/dumper-exit.txt
          set -e
          ls -la /tmp/hfgsp/dump > out/herofetter-gotskills-partial/dump-files.txt
          test -f /tmp/hfgsp/dump/script.json
          test -f /tmp/hfgsp/dump/dump.cs
      - name: Trace HeroFetter GotSkills relation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json,pathlib,re
          D=pathlib.Path('/tmp/hfgsp/dump'); O=pathlib.Path('out/herofetter-gotskills-partial')
          dump=(D/'dump.cs').read_text(errors='replace')
          script=json.loads((D/'script.json').read_text(errors='replace'))
          terms=['ConfigDataHeroFetterInfo','HeroFetter','GotSkills_ID','GotSkills','ConfigDataSkillInfo','SkillInfo']
          excerpts={}
          for term in terms:
            hits=[]
            for m in re.finditer(re.escape(term),dump):
              hits.append(dump[max(0,m.start()-1400):min(len(dump),m.end()+2600)])
              if len(hits)>=12: break
            excerpts[term]=hits
          methods=[]
          def walk(x,trail='$'):
            if isinstance(x,dict):
              text=' '.join(str(x.get(k,'')) for k in ['Name','Signature','Namespace'])
              if any(t in text for t in terms):
                methods.append({'trail':trail,'Name':x.get('Name'),'Signature':x.get('Signature'),'Namespace':x.get('Namespace'),'Address':x.get('Address')})
              for k,v in x.items(): walk(v,trail+'.'+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,f'{trail}[{i}]')
          walk(script)
          blocks=[]
          for pat in [r'public class ConfigDataHeroFetterInfo\b',r'class ConfigDataHeroFetterInfo\b',r'HeroFetterInfo']:
            for m in re.finditer(pat,dump):
              blocks.append(dump[max(0,m.start()-300):min(len(dump),m.start()+10000)])
              if len(blocks)>=8: break
          relation=[]
          for block in blocks:
            ls=block.splitlines()
            for i,line in enumerate(ls):
              if 'GotSkills' in line or 'SkillInfo' in line:
                relation.append('\n'.join(ls[max(0,i-6):min(len(ls),i+14)]))
          result={'status':'TRACE_COMPLETE','excerptCounts':{k:len(v) for k,v in excerpts.items()},'methodMatchCount':len(methods),'relationCandidateCount':len(relation),'methods':methods[:200],'relationCandidates':relation[:80]}
          (O/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          (O/'dump-excerpts.txt').write_text('\n\n'.join('===== '+k+' =====\n'+'\n---\n'.join(v) for k,v in excerpts.items()))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herofetter-gotskills-partial
          path: out/herofetter-gotskills-partial
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-herofetter-gotskills-partial-probe.yml
          git commit -m "Remove temporary HeroFetter GotSkills partial probe"
          git push origin HEAD:${GITHUB_REF_NAME}
