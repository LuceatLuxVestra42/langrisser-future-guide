name: Hero portrait Stage 4-1C finalize

on:
  push:
    branches:
      - work/hero-portrait-stage4-1c-mapped-source-admission
    paths:
      - scripts/hero_portrait_stage4_1c_finalize_admission.py
      - data/reviews/hero-portrait-stage4-1c-contact-sheet-visual-review.v1.json
      - .github/workflows/hero-portrait-stage4-1c-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize Stage 4-1C admissions
        run: python scripts/hero_portrait_stage4_1c_finalize_admission.py

      - name: Commit frozen admission registry and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/generated/hero-portrait-stage4-1c-mapped-source-admission.v1.json \
            data/validation/hero-portrait-stage4-1c-final-admission-summary.v1.json \
            data/checkpoints/hero-portrait-stage4-1c-mapped-source-admission.v1.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Freeze Hero portrait Stage 4-1C mapped source admissions'
            git push
          fi
