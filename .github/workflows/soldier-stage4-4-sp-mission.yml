name: Soldier Stage 4-4 SP Mission Regression

on:
  pull_request:
    paths:
      - 'scripts/finalize-soldier-stage3.cjs'
      - 'scripts/lib/configdata-direct.cjs'
      - 'scripts/validate-soldier-stage4-4-sp-mission.cjs'
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/hero-name-master.v1.json'
      - 'data/validation/soldier-stage4-4-sp-mission.v1.json'
      - '.github/workflows/soldier-stage4-4-sp-mission.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-soldier-stage3.cjs'
      - 'scripts/lib/configdata-direct.cjs'
      - 'scripts/validate-soldier-stage4-4-sp-mission.cjs'
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/hero-name-master.v1.json'
      - 'data/validation/soldier-stage4-4-sp-mission.v1.json'
      - '.github/workflows/soldier-stage4-4-sp-mission.yml'

permissions:
  contents: read

jobs:
  validate-sp-mission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract pre-4-1 SP baseline
        run: git show c2276d1162dae52a1762e6381e7dd195c917da2f:data/generated/soldier-stage3.v1.json > "$RUNNER_TEMP/soldier-stage3-pre-4-1.json"
      - name: Regenerate Stage 3 from direct JSON
        run: node scripts/finalize-soldier-stage3.cjs
      - name: Validate Stage 4-4 SP mission regression
        env:
          BASELINE_STAGE3_PATH: ${{ runner.temp }}/soldier-stage3-pre-4-1.json
        run: node scripts/validate-soldier-stage4-4-sp-mission.cjs
      - name: Upload Stage 4-4 validation
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage4-4-sp-mission
          path: data/validation/soldier-stage4-4-sp-mission.v1.json
