name: Hero Provisional Localization Stage 3 Route Restore

on:
  push:
    branches:
      - hero-provisional-localization-stage3

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: hero-provisional-localization-stage3
          fetch-depth: 1

      - name: Restore canonical route declaration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/heroes_.$heroId.tsx')
          text = p.read_text()
          old = 'createFileRoute("/heroes_/$heroId")'
          new = 'createFileRoute("/heroes/$heroId")'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
          elif new not in text:
              raise SystemExit('Neither expected route declaration is present')
          PY

      - name: Commit route restoration before build
        shell: bash
        run: |
          if git diff --quiet -- 'src/routes/heroes_.$heroId.tsx'; then
            echo "Canonical route already restored."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'src/routes/heroes_.$heroId.tsx'
            git commit -m "Restore canonical Hero detail route declaration"
            git push origin HEAD:hero-provisional-localization-stage3
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Stage 2 predecessor
        run: npm run validate:hero-provisional-localization-stage2

      - name: Validate Stage 7 localization successor
        run: npm run audit:localization:stage7:check

      - name: Generate Stage 4 artwork manifest
        run: node scripts/generate_hero_list_stage4_artwork.cjs

      - name: Validate current Hero Stage 4 boundary
        run: node scripts/validate_hero_list_stage4.cjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: TypeScript gate
        run: bunx tsc --noEmit
