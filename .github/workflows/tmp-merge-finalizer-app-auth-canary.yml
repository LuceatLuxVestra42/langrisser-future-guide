name: TEMP Merge Finalizer App Auth Canary

on:
  push:
    branches:
      - tooling/merge-finalizer-app-auth-canary-20260903

permissions:
  contents: read

jobs:
  app-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create merge finalizer GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERGEFINALIZER_APP_ID }}
          private-key: ${{ secrets.MERGEFINALIZER_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-checks: read

      - name: Verify installation token without mutation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$APP_SLUG"
          test -n "$INSTALLATION_ID"
          repo="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name')"
          test "$repo" = "$GITHUB_REPOSITORY"
          printf 'APP_AUTH_CANARY=PASS\nAPP_SLUG=%s\nINSTALLATION_ID=%s\nREPOSITORY=%s\n' "$APP_SLUG" "$INSTALLATION_ID" "$repo"
