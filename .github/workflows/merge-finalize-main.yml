name: Merge Finalize Main

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to finalize onto main
        required: true
        type: string
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: merge-finalize-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      handoff: ${{ steps.refresh-state.outputs.handoff == 'true' || steps.prepare.outputs.handoff == 'true' }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip duplicate finalizer after merge
        id: merged-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged')"
          if [[ "$merged" == "true" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'MERGE_FINALIZER_ALREADY_MERGED_NOOP=PASS'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        if: steps.merged-state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create merge finalizer GitHub App token
        if: steps.merged-state.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERGEFINALIZER_APP_ID }}
          private-key: ${{ secrets.MERGEFINALIZER_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read

      - name: Run merge finalizer self-test
        if: steps.merged-state.outputs.skip != 'true'
        run: |
          node tools/merge-finalizer/test/merge-finalizer-self-test.mjs
          node tools/merge-finalizer/test/merge-finalizer-concurrency-contract.mjs

      - name: Refresh stale PR with GitHub App and hand off to exact-head run
        if: steps.merged-state.outputs.skip != 'true'
        id: refresh-state
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          updates=0
          echo 'handoff=false' >> "$GITHUB_OUTPUT"

          while (( SECONDS < deadline )); do
            snapshot="$(GITHUB_TOKEN="$READ_TOKEN" node tools/merge-finalizer/cli/finalize.mjs --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER")"
            status="$(printf '%s' "$snapshot" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(String(JSON.parse(s).status ?? '')))")"
            printf 'MERGE_FINALIZER_APP_PREFLIGHT_STATUS=%s\n' "$status"

            case "$status" in
              READY_TO_MERGE)
                printf 'MERGE_FINALIZER_APP_PREFLIGHT=PASS\nAPP_REFRESH_COUNT=%s\n' "$updates"
                exit 0
                ;;
              UPDATE_REQUIRED)
                if (( updates >= 3 )); then
                  echo 'BLOCKER_APP_REFRESH_RESTART_EXHAUSTED'
                  exit 1
                fi
                old_head="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
                GH_TOKEN="$APP_TOKEN" gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/update-branch" -f expected_head_sha="$old_head" >/dev/null
                changed=false
                for _ in $(seq 1 60); do
                  sleep 5
                  new_head="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
                  if [[ "$new_head" != "$old_head" ]]; then
                    changed=true
                    break
                  fi
                done
                if [[ "$changed" != true ]]; then
                  echo 'BLOCKER_APP_REFRESH_HEAD_TIMEOUT'
                  exit 1
                fi
                updates=$((updates + 1))
                echo 'handoff=true' >> "$GITHUB_OUTPUT"
                printf 'MERGE_FINALIZER_EXACT_HEAD_HANDOFF=PASS\nOLD_HEAD=%s\nNEW_HEAD=%s\nAPP_REFRESH_COUNT=%s\n' "$old_head" "$new_head" "$updates"
                exit 0
                ;;
              WAIT_MERGEABILITY)
                sleep 5
                ;;
              CHECK_REQUIRED|CHECK_PENDING|CHECK_NOT_SUCCESSFUL|MERGE_GATE_REQUIRED|MERGE_GATE_PENDING)
                printf 'MERGE_FINALIZER_APP_PREFLIGHT=HANDOFF_TO_PREPARE\nAPP_REFRESH_COUNT=%s\n' "$updates"
                exit 0
                ;;
              *)
                printf '%s\n' "$snapshot"
                exit 1
                ;;
            esac
          done

          echo 'BLOCKER_APP_PREFLIGHT_TIMEOUT'
          exit 1

      - name: Prepare exact PR for merge admission
        if: steps.merged-state.outputs.skip != 'true' && steps.refresh-state.outputs.handoff != 'true'
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          echo 'handoff=false' >> "$GITHUB_OUTPUT"

          set +e
          result="$(node tools/merge-finalizer/cli/finalize.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --prepare \
            --max-restarts 3 \
            --timeout-ms 900000 \
            --poll-ms 5000)"
          code=$?
          set -e
          printf '%s\n' "$result"
          status="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(String(JSON.parse(s).status ?? '')))")"

          if [[ "$code" -eq 0 && "$status" == 'PREPARED_FOR_MERGE_ADMISSION' ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'MERGE_FINALIZER_PREPARE=PASS'
            exit 0
          fi

          if [[ "$status" == 'CHECK_NOT_SUCCESSFUL' ]]; then
            echo 'handoff=true' >> "$GITHUB_OUTPUT"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/merge-finalize-main.yml/dispatches" \
              -f ref=main \
              -f "inputs[pr]=$PR_NUMBER" >/dev/null
            echo 'MERGE_FINALIZER_STALE_REVALIDATION_HANDOFF=PASS'
            exit 0
          fi

          if [[ "$code" -eq 3 && "$status" == 'PREPARE_REVALIDATION_REQUIRED' ]]; then
            echo 'handoff=true' >> "$GITHUB_OUTPUT"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/merge-finalize-main.yml/dispatches" \
              -f ref=main \
              -f "inputs[pr]=$PR_NUMBER" >/dev/null
            echo 'MERGE_FINALIZER_PREPARE_HANDOFF=PASS'
            exit 0
          fi

          echo 'BLOCKER_MERGE_FINALIZER_PREPARE'
          exit 1

  merge-admission:
    needs: finalize
    if: needs.finalize.outputs.ready == 'true' && needs.finalize.outputs.handoff != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: merge-finalize-main-mutation
      queue: max
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge exact ready PR or hand off revalidation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          result="$(node tools/merge-finalizer/cli/finalize.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --merge-only \
            --max-restarts 0 \
            --timeout-ms 60000 \
            --poll-ms 1000)"
          code=$?
          set -e
          printf '%s\n' "$result"
          status="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(String(JSON.parse(s).status ?? '')))")"

          if [[ "$code" -eq 0 && "$status" == 'MERGED' ]]; then
            echo 'MERGE_FINALIZER_MAIN_MUTATION=PASS'
            exit 0
          fi

          if [[ "$code" -eq 3 && "$status" == 'MERGE_ADMISSION_REVALIDATION_REQUIRED' ]]; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/merge-finalize-main.yml/dispatches" \
              -f ref=main \
              -f "inputs[pr]=$PR_NUMBER" >/dev/null
            echo 'MERGE_FINALIZER_MAIN_MUTATION_HANDOFF=PASS'
            exit 0
          fi

          if [[ "$code" -eq 3 && "$status" == 'MERGED_REVIEW_POST_MERGE_BASE_RACE' ]]; then
            echo 'BLOCKER_MERGE_FINALIZER_POST_MERGE_BASE_RACE'
            exit 1
          fi

          echo 'BLOCKER_MERGE_FINALIZER_MAIN_MUTATION'
          exit 1
