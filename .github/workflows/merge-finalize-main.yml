name: Merge Finalize Main

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to finalize onto main
        required: true
        type: string
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: merge-finalize-main
  queue: max

jobs:
  finalize:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip duplicate finalizer after merge
        id: merged-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged')"
          if [[ "$merged" == "true" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'MERGE_FINALIZER_ALREADY_MERGED_NOOP=PASS'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        if: steps.merged-state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create merge finalizer GitHub App token
        if: steps.merged-state.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERGEFINALIZER_APP_ID }}
          private-key: ${{ secrets.MERGEFINALIZER_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read

      - name: Run merge finalizer self-test
        if: steps.merged-state.outputs.skip != 'true'
        run: node tools/merge-finalizer/test/merge-finalizer-self-test.mjs

      - name: Refresh stale PR with GitHub App and wait for protected check
        if: steps.merged-state.outputs.skip != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          updates=0

          while (( SECONDS < deadline )); do
            snapshot="$(GITHUB_TOKEN="$READ_TOKEN" node tools/merge-finalizer/cli/finalize.mjs --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER")"
            status="$(printf '%s' "$snapshot" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(String(JSON.parse(s).status ?? '')))")"
            printf 'MERGE_FINALIZER_APP_PREFLIGHT_STATUS=%s\n' "$status"

            case "$status" in
              READY_TO_MERGE)
                printf 'MERGE_FINALIZER_APP_PREFLIGHT=PASS\nAPP_REFRESH_COUNT=%s\n' "$updates"
                exit 0
                ;;
              UPDATE_REQUIRED)
                if (( updates >= 3 )); then
                  echo 'BLOCKER_APP_REFRESH_RESTART_EXHAUSTED'
                  exit 1
                fi
                old_head="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
                GH_TOKEN="$APP_TOKEN" gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/update-branch" -f expected_head_sha="$old_head" >/dev/null
                changed=false
                for _ in $(seq 1 60); do
                  sleep 5
                  new_head="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
                  if [[ "$new_head" != "$old_head" ]]; then
                    changed=true
                    break
                  fi
                done
                if [[ "$changed" != true ]]; then
                  echo 'BLOCKER_APP_REFRESH_HEAD_TIMEOUT'
                  exit 1
                fi
                updates=$((updates + 1))
                ;;
              WAIT_MERGEABILITY)
                sleep 5
                ;;
              CHECK_REQUIRED|CHECK_PENDING|CHECK_NOT_SUCCESSFUL|MERGE_GATE_REQUIRED|MERGE_GATE_PENDING)
                printf 'MERGE_FINALIZER_APP_PREFLIGHT=HANDOFF_TO_EXECUTE\nAPP_REFRESH_COUNT=%s\n' "$updates"
                exit 0
                ;;
              *)
                printf '%s\n' "$snapshot"
                exit 1
                ;;
            esac
          done

          echo 'BLOCKER_APP_PREFLIGHT_TIMEOUT'
          exit 1

      - name: Finalize pull request with fail-closed guards
        if: steps.merged-state.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/merge-finalizer/cli/finalize.mjs
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --execute
          --max-restarts 3
          --timeout-ms 900000
          --poll-ms 5000
