name: Equipment Stage 2-4 Stat Validation

on:
  push:
    paths:
      - '.github/workflows/equipment-stage2-4-stat-validation.yml'
      - 'scripts/analyze-equipment-stage2-4.mjs'
      - 'scripts/build-equipment-stage2-4-stats.mjs'
      - 'data/configdata/ConfigDataEquipmentInfo.json'
      - 'data/configdata/ConfigDataEquipmentLevelInfo.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze Equipment Stage 2-4 stats
        run: node scripts/analyze-equipment-stage2-4.mjs
      - name: Build Equipment Stage 2-4 max stats
        run: node scripts/build-equipment-stage2-4-stats.mjs
      - name: Persist Stage 2-4 checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/equipment_stage2_4_stat_analysis.json data/generated/equipment_stage2_4_stats.json
          if git diff --cached --quiet; then
            echo "No Stage 2-4 changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 2-4 stats"
          git push
