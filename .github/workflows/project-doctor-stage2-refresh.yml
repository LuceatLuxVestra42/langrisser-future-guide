name: Project Doctor Stage 2 Refresh

on:
  push:
    branches:
      - work/project-status-stage2-active-source
    paths:
      - '.github/workflows/project-doctor-stage2-refresh.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Doctor freshness seal
        run: npm run doctor:freshness:refresh

      - name: Verify Doctor freshness seal
        run: npm run doctor:freshness:validate

      - name: Commit refreshed Doctor outputs
        shell: bash
        run: |
          PATHS=(
            data/generated/project-doctor-active-source-registry.v1.json
            data/validation/project-doctor-active-source-registry-summary.v1.json
            data/generated/project-doctor-d1-1-status.v1.json
            data/validation/project-doctor-d1-1-summary.v1.json
            data/validation/project-doctor-d1-2-summary.v1.json
            data/generated/project-doctor-d5-freshness.v1.json
          )
          if [ -z "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo 'Doctor freshness seal is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${PATHS[@]}"
          git commit -m 'chore: refresh Doctor Stage 2 freshness seal'
          git push origin HEAD:"${GITHUB_REF_NAME}"
