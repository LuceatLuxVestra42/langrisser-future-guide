name: Soldier Prototype Frontend

on:
  push:
    paths:
      - '.github/workflows/soldier-prototype-frontend.yml'
      - 'data/generated/soldier-detail-stage5-2.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'src/lib/soldier-page.server.ts'
      - 'src/lib/soldier-page.functions.ts'
      - 'src/routes/soldiers-prototype.tsx'
      - 'src/routes/soldiers.prototype.tsx'
      - 'src/routeTree.gen.ts'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production frontend
        run: bun run build
      - name: Verify generated Soldier prototype routes
        run: |
          grep -q '/soldiers-prototype' src/routeTree.gen.ts
          grep -q '/soldiers/prototype' src/routeTree.gen.ts
      - name: Persist generated route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "No route tree changes"
            exit 0
          fi
          git commit -m "Register Soldier prototype routes"
          git push
