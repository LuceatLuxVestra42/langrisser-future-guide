name: Hero Fusion Faction Preflight

on:
  push:
    branches:
      - work/hero-fusion-faction-marks-20260830
    paths:
      - '.github/workflows/hero-fusion-faction-preflight.yml'
      - 'src/routes/heroes.tsx'
      - 'src/lib/hero-fusion-power.server.ts'
      - 'src/lib/hero-fusion-power.functions.ts'
      - 'scripts/validate-hero-fusion-power-frontend.mjs'
      - 'scripts/validate-hero-card-icon-frontend.mjs'
      - 'data/generated/hero-fusion-power-presentation.v1.json'
      - 'data/generated/hero-fusion-faction-assets.v1.json'
      - 'public/images/factions/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Hero fusion faction-mark frontend
        run: node scripts/validate-hero-fusion-power-frontend.mjs
      - name: Regression-check Hero card icon frontend
        run: node scripts/validate-hero-card-icon-frontend.mjs
