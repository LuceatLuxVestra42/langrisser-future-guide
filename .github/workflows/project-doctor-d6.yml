# Temporary D5 refresh producer for Hero artwork downstream seal refresh; work branch only.
name: Project Doctor D6 Runtime Proof

on:
  push:
    branches:
      - work/project-doctor-closeout
    paths:
      - data/contracts/project-doctor-*
      - data/generated/project-doctor-*
      - data/validation/project-doctor-*
      - data/validation/hero-list-stage4.v1.json
      - scripts/*project-doctor*
      - package.json
      - .github/workflows/project-doctor-d6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh D5 freshness seal through existing producer
        run: npm run doctor:freshness:refresh

      - name: Validate refreshed D5 freshness seal
        run: npm run doctor:freshness:validate

      - name: Persist refreshed Project Doctor outputs on work branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/project-doctor-active-source-registry.v1.json \
            data/validation/project-doctor-active-source-registry-summary.v1.json \
            data/generated/project-doctor-d1-1-status.v1.json \
            data/validation/project-doctor-d1-1-summary.v1.json \
            data/validation/project-doctor-d1-2-summary.v1.json \
            data/generated/project-doctor-d5-freshness.v1.json
          if git diff --cached --quiet; then
            echo "No Project Doctor freshness outputs changed"
            exit 0
          fi
          git commit -m "Refresh Project Doctor D5 freshness seal"
          git push
