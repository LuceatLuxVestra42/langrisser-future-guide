name: Project Doctor D6 Runtime Proof

on:
  push:
    branches:
      - work/project-doctor-closeout
    paths:
      - data/contracts/project-doctor-*
      - data/generated/project-doctor-*
      - data/validation/project-doctor-*
      - scripts/*project-doctor*
      - package.json
      - .github/workflows/project-doctor-d6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: D5 freshness fixtures
        run: npm run doctor:freshness:self-test

      - name: Integrated closeout fixtures
        run: npm run doctor:closeout:validate

      - name: Validate committed freshness seal
        run: npm run doctor:freshness:validate

      - name: Regenerate D1 status outputs
        run: npm run doctor:status

      - name: Upload regenerated D1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: project-doctor-d6-d1-runtime-outputs
          path: |
            data/generated/project-doctor-d1-1-status.v1.json
            data/validation/project-doctor-d1-1-summary.v1.json
            data/validation/project-doctor-d1-2-summary.v1.json
          if-no-files-found: error

      - name: Require committed D1 outputs to match runtime regeneration
        run: git diff --exit-code -- data/generated/project-doctor-d1-1-status.v1.json data/validation/project-doctor-d1-1-summary.v1.json data/validation/project-doctor-d1-2-summary.v1.json

      - name: Integrated Doctor dry run
        run: npm run doctor -- --dry-run --paths package.json

      - name: Integrated Doctor selected-check execution
        run: npm run doctor -- --paths package.json
