name: Hero portrait Stage 4-2B ConfigData resource scan
on:
  push:
    branches:
      - work/hero-portrait-stage4-2b-explicit-fallback-source-acquisition
    paths:
      - .github/workflows/hero-portrait-stage4-2b-config-resource-scan.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan resource-related ConfigData tables and fields
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for p in sorted(Path('data/configdata').glob('ConfigData*.json')):
              name=p.name
              if re.search(r'(Model|Resource|Spine|HeroJob|Job|CharImage)',name,re.I):
                  text=p.read_text(encoding='utf-8',errors='ignore')[:200000]
                  keys=sorted(set(re.findall(r'"([A-Za-z0-9_]*(?:Spine|Model|Resource|Asset|Path)[A-Za-z0-9_]*)"\s*:',text,re.I)))
                  rows.append({'file':name,'byteLength':p.stat().st_size,'interestingKeys':keys[:80]})
          out={'version':1,'recordCount':len(rows),'records':rows}
          q=Path('data/validation/hero-portrait-stage4-2b-config-resource-table-scan.v1.json')
          q.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2b-config-resource-table-scan.v1.json
          if git diff --cached --quiet; then echo no-change; else git commit -m 'Scan ConfigData Hero portrait fallback resource tables'; git push; fi
