name: Hero Casting Law Material Icons

on:
  push:
    branches:
      - 'feat/hero-casting-law-material-icons-*'
    paths:
      - '.github/workflows/hero-casting-law-material-icons.yml'
      - 'data/contracts/hero-casting-law-material-icons.v1.json'
      - 'data/generated/hero-casting-law-materials.v1.json'
      - 'data/generated/hero-awakening-icon-official-package-inventory.v1.json'
      - 'scripts/materialize-hero-casting-law-material-icons.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hero-casting-law-material-icons.yml'
      - 'data/contracts/hero-casting-law-material-icons.v1.json'
      - 'data/generated/hero-casting-law-material-icon-assets.v1.json'
      - 'data/validation/hero-casting-law-material-icon-assets-summary.v1.json'
      - 'scripts/materialize-hero-casting-law-material-icons.py'
      - 'src/lib/hero-casting-law.server.ts'
      - 'src/components/hero-casting-law-section.tsx'
      - 'public/images/heroes/casting-law-material-icons/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-or-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Unity asset parser
        run: python -m pip install 'UnityPy==1.25.3'

      - name: Materialize exact official icons on feature branch
        if: github.event_name == 'push'
        run: python scripts/materialize-hero-casting-law-material-icons.py --write

      - name: Validate frozen icons on pull request
        if: github.event_name != 'push'
        run: python scripts/materialize-hero-casting-law-material-icons.py --validate-frozen-only

      - name: Reject unexpected mutation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            allowed='^(data/generated/hero-casting-law-material-icon-assets\.v1\.json|data/validation/hero-casting-law-material-icon-assets-summary\.v1\.json|public/images/heroes/casting-law-material-icons/[^/]+\.png)$'
            unexpected="$(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
            if [[ -n "$unexpected" ]]; then
              printf 'Unexpected mutation:\n%s\n' "$unexpected" >&2
              exit 1
            fi
          else
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          fi
          git diff --check

      - name: Freeze materialized icon assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add             data/generated/hero-casting-law-material-icon-assets.v1.json             data/validation/hero-casting-law-material-icon-assets-summary.v1.json             public/images/heroes/casting-law-material-icons
          if git diff --cached --quiet; then
            echo 'Casting Law material icon assets already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze Casting Law material icon assets'
          git push origin HEAD:"${GITHUB_REF_NAME}"
