name: Temporary HeroFetter GotSkills native xref
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract official IL2CPP pair and partial dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hfgs out/herofetter-gotskills-native
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib,hashlib,json
          D=pathlib.Path('/tmp/hfgs'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          src={'installVersion':V,'files':{}}
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}/InstallPage_{V}_{part}.zip' if False else f'{B}/InstallPage_{V}_{part}.zip'
            e=next(e for e in ent(u,hs(u)) if e[0]==target); raw=get(u,e); (D/out).write_bytes(raw); src['files'][out]={'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}
          pathlib.Path('out/herofetter-gotskills-native/source.json').write_text(json.dumps(src,indent=2)+'\n')
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release >/dev/null 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/hfgs/dump
          set +e
          dotnet "$DLL" /tmp/hfgs/GameAssembly.dll /tmp/hfgs/global-metadata.dat /tmp/hfgs/dump > out/herofetter-gotskills-native/dumper.log 2>&1
          echo $? > out/herofetter-gotskills-native/dumper-exit.txt
          set -e
          test -f /tmp/hfgs/dump/script.json
          test -f /tmp/hfgs/dump/dump.cs
      - name: Disassemble SetSkillInfoGroup and map call targets
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json,pathlib,re,subprocess
          D=pathlib.Path('/tmp/hfgs/dump'); O=pathlib.Path('out/herofetter-gotskills-native'); EXE=pathlib.Path('/tmp/hfgs/GameAssembly.dll')
          script=json.loads((D/'script.json').read_text(errors='replace'))
          rows=[]
          def walk(x):
            if isinstance(x,dict):
              n=x.get('Name'); a=x.get('Address'); s=x.get('Signature')
              if isinstance(n,str) and isinstance(a,(int,float)):
                rows.append((int(a),n,s))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(script)
          rows=sorted(set(rows),key=lambda z:z[0])
          targets=[r for r in rows if 'FettersConfessionUIController$$SetSkillInfoGroup' in r[1]]
          if not targets: raise SystemExit('SetSkillInfoGroup not found')
          target=targets[0]; start=target[0]
          larger=sorted({a for a,_,_ in rows if a>start})
          stop=(larger[0] if larger and larger[0]-start<=0x3000 else start+0x1800)
          def run_objdump(s,e):
            return subprocess.check_output(['objdump','-d','-Mintel',f'--start-address={s}',f'--stop-address={e}',str(EXE)],text=True,errors='replace')
          text=run_objdump(start,stop)
          # PE image tools sometimes display VA. If no instructions, retry with 0x180000000 image base.
          if '\t' not in text or len(text.splitlines())<8:
            text=run_objdump(0x180000000+start,0x180000000+stop)
          (O/'set-skill-info-group.disasm.txt').write_text(text)
          call_targets=[]
          for line in text.splitlines():
            m=re.search(r'\bcall\s+([0-9a-fA-Fx]+)',line)
            if not m: continue
            raw=int(m.group(1),16)
            rva=raw-0x180000000 if raw>=0x180000000 else raw
            exact=[r for r in rows if r[0]==rva]
            call_targets.append({'line':line.strip(),'rawTarget':hex(raw),'rva':hex(rva),'matches':[{'address':hex(a),'name':n,'signature':s} for a,n,s in exact[:20]]})
          # Also identify relevant config accessor-like methods globally.
          access=[]
          for a,n,s in rows:
            t=(n+' '+str(s or ''))
            if 'ConfigDataSkillInfo' in t and any(k in t for k in ['Get','Find','ByID','ById','get_Item','ConfigDataManager','ConfigDataLoader','ConfigDataTable']):
              access.append({'address':hex(a),'name':n,'signature':s})
          dump=(D/'dump.cs').read_text(errors='replace')
          # Keep direct class excerpt proving backing-field offset/type alongside native evidence.
          idx=dump.find('public class ConfigDataHeroFetterInfo')
          if idx<0: idx=dump.find('class ConfigDataHeroFetterInfo')
          class_excerpt=dump[idx:idx+9000] if idx>=0 else ''
          (O/'hero-fetter-class.txt').write_text(class_excerpt)
          # Capture method signatures adjacent to target/controller only, no semantic inference.
          result={'status':'TRACE_COMPLETE','target':{'address':hex(start),'name':target[1],'signature':target[2]},'stop':hex(stop),'callCount':len(call_targets),'calls':call_targets,'skillAccessorCandidates':access[:500]}
          (O/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('TARGET',json.dumps(result['target'],ensure_ascii=False))
          print('CALL_COUNT',len(call_targets))
          for c in call_targets:
            print('CALL',json.dumps(c,ensure_ascii=False))
          print('ACCESSOR_CANDIDATE_COUNT',len(access))
          for x in access[:120]: print('ACCESS',json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herofetter-gotskills-native
          path: out/herofetter-gotskills-native
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-herofetter-gotskills-native-xref.yml
          git commit -m "Remove temporary HeroFetter GotSkills native xref"
          git push origin HEAD:${GITHUB_REF_NAME}
