name: Temporary Soldier Stage 11-A6 Refresh

on:
  push:
    branches:
      - soldier/stage11-a6-site-admission-refresh
    paths:
      - '.github/workflows/soldier-stage11-a6-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Refresh Stage 6-1
        run: |
          node scripts/finalize-soldier-stage6-1-full-records.cjs
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          allowed=(data/generated/soldier-stage6-1-full-records.v1.json data/validation/soldier-stage6-1-full-records.v1.json)
          for p in "${changed[@]}"; do
            [[ " ${allowed[*]} " == *" $p "* ]] || { echo "Unexpected Stage 6-1 mutation: $p" >&2; exit 1; }
          done
          if ((${#changed[@]})); then
            git add "${allowed[@]}"
            git commit -m 'Refresh Soldier Stage 6-1 after CN chronology correction'
          fi

      - name: Refresh Stage 6-2
        run: |
          node scripts/finalize-soldier-stage6-2-classification.cjs
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          allowed=(data/generated/soldier-stage6-2-classification.v1.json data/validation/soldier-stage6-2-classification.v1.json)
          for p in "${changed[@]}"; do
            [[ " ${allowed[*]} " == *" $p "* ]] || { echo "Unexpected Stage 6-2 mutation: $p" >&2; exit 1; }
          done
          if ((${#changed[@]})); then
            git add "${allowed[@]}"
            git commit -m 'Refresh Soldier Stage 6-2 after Stage 6-1 freshness update'
          fi

      - name: Refresh Stage 6-3
        run: |
          node scripts/finalize-soldier-stage6-3-representative-qa.cjs
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          allowed=(data/validation/soldier-stage6-3-representative-qa.v1.json)
          for p in "${changed[@]}"; do
            [[ " ${allowed[*]} " == *" $p "* ]] || { echo "Unexpected Stage 6-3 mutation: $p" >&2; exit 1; }
          done
          if ((${#changed[@]})); then
            git add "${allowed[@]}"
            git commit -m 'Refresh Soldier Stage 6-3 provenance after chronology correction'
          fi

      - name: Refresh Stage 6-4
        run: |
          node scripts/finalize-soldier-stage6-4-filter-qa.cjs
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          allowed=(data/validation/soldier-stage6-4-filter-qa.v1.json)
          for p in "${changed[@]}"; do
            [[ " ${allowed[*]} " == *" $p "* ]] || { echo "Unexpected Stage 6-4 mutation: $p" >&2; exit 1; }
          done
          if ((${#changed[@]})); then
            git add "${allowed[@]}"
            git commit -m 'Refresh Soldier Stage 6-4 provenance after chronology correction'
          fi

      - name: Refresh Stage 6-5
        run: |
          node scripts/finalize-soldier-stage6-5-reciprocal-links.cjs
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          allowed=(data/generated/hero-soldier-page-links-stage6-5.v1.json data/validation/soldier-stage6-5-reciprocal-links.v1.json)
          for p in "${changed[@]}"; do
            [[ " ${allowed[*]} " == *" $p "* ]] || { echo "Unexpected Stage 6-5 mutation: $p" >&2; exit 1; }
          done
          if ((${#changed[@]})); then
            git add "${allowed[@]}"
            git commit -m 'Refresh Soldier Stage 6-5 provenance after chronology correction'
          fi

      - name: Refresh Stage 6-6
        run: |
          node scripts/finalize-soldier-stage6-6-expansion-basis.cjs
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          allowed=(data/generated/soldier-stage6-6-expansion-basis.v1.json data/validation/soldier-stage6-6-expansion-basis.v1.json)
          for p in "${changed[@]}"; do
            [[ " ${allowed[*]} " == *" $p "* ]] || { echo "Unexpected Stage 6-6 mutation: $p" >&2; exit 1; }
          done
          if ((${#changed[@]})); then
            git add "${allowed[@]}"
            git commit -m 'Refresh Soldier Stage 6-6 freshness after chronology correction'
          fi

      - name: Refresh Stage 6-7
        run: |
          node scripts/finalize-soldier-stage6-7-site-admission.cjs
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          allowed=(data/generated/soldier-stage6-7-site-admission.v1.json data/validation/soldier-stage6-7-site-admission.v1.json)
          for p in "${changed[@]}"; do
            [[ " ${allowed[*]} " == *" $p "* ]] || { echo "Unexpected Stage 6-7 mutation: $p" >&2; exit 1; }
          done
          if ((${#changed[@]})); then
            git add "${allowed[@]}"
            git commit -m 'Refresh Soldier Stage 6-7 admission after CN chronology correction'
          fi

      - name: Validate final Soldier Stage 6 chain
        run: |
          node scripts/validate-soldier-stage6-7-final.mjs
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Push refreshed Stage 6 chain
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check Status Source closeout projection
        run: node tools/status-source/cli/lifecycle.mjs closeout --pipeline soldier --check

      - name: Check Status Source bridge
        run: node tools/status-source/cli/bridge.mjs --pipeline soldier
