name: tmp-hero-list-stage1-refresh

on:
  push:
    branches:
      - fix/sp-reward-skill-cost
    paths:
      - .github/workflows/tmp-hero-list-stage1-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Regenerate Hero list Stage 1
        run: node scripts/finalize_hero_list_stage1.cjs

      - name: Verify Stage 1 completion
        shell: bash
        run: |
          node <<'NODE'
          const v = require('./data/validation/hero-list-stage1-final.v1.json');
          if (v.status !== 'PASS' || v.completion !== 'COMPLETE' || (v.summary?.hardErrorCount ?? 1) !== 0) {
            throw new Error(`Hero list Stage1 ${v.status}/${v.completion}/hard=${v.summary?.hardErrorCount}`);
          }
          if (v.summary?.generatedRecordCount !== 267 || v.summary?.projectionMismatchCount !== 0) {
            throw new Error(`Hero list Stage1 projection drift: ${JSON.stringify(v.summary)}`);
          }
          console.log(JSON.stringify({status:v.status,completion:v.completion,summary:v.summary},null,2));
          NODE

      - name: Audit and commit expected refresh
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-hero-list-stage1-refresh.yml
          python3 <<'PY'
          import subprocess, sys
          allowed={
            'data/generated/hero-list-stage1.v1.json',
            'data/validation/hero-list-stage1-final.v1.json',
            'data/checkpoints/hero-list-stage1.json',
            'data/checkpoints/hero-list-stage1.md',
            '.github/workflows/tmp-hero-list-stage1-refresh.yml',
          }
          out=subprocess.check_output(['git','status','--porcelain'], text=True)
          bad=[]
          for line in out.splitlines():
            p=line[3:]
            if ' -> ' in p: p=p.split(' -> ',1)[1]
            if p not in allowed: bad.append(line)
          print(out)
          if bad:
            print('unexpected tracked mutation:', *bad, sep='\n', file=sys.stderr)
            sys.exit(1)
          PY
          git add data/generated/hero-list-stage1.v1.json \
            data/validation/hero-list-stage1-final.v1.json \
            data/checkpoints/hero-list-stage1.json \
            data/checkpoints/hero-list-stage1.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(hero): refresh Hero list Stage1 consumer'
          git pull --rebase origin fix/sp-reward-skill-cost
          git push origin HEAD:fix/sp-reward-skill-cost
