name: Hero Card Icon Source Pack H1

on:
  push:
    branches:
      - maintenance/hero-card-icon-source-pack-h1-v1
    paths:
      - scripts/build-hero-card-icon-source-pack-v1.mjs
      - .github/workflows/hero-card-icon-source-pack-v1.yml

permissions:
  contents: write

concurrency:
  group: hero-card-icon-source-pack-h1-v1
  cancel-in-progress: false

jobs:
  build-and-publish-source-pack:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 97abec60007f969a2414588f7b8e1069101c4fd2
      RELEASE_TAG: source-assets-hero-card-icon-v1-97abec60
      ARCHIVE_BASE: hero-card-icon-source-v1-97abec60
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and round-trip verify exact-byte source pack
        run: |
          set -euo pipefail
          node scripts/build-hero-card-icon-source-pack-v1.mjs \
            --source-sha "$SOURCE_SHA" \
            --out-dir dist/source-pack

      - name: Publish immutable-by-hash source pack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to mutate or overwrite it."
            exit 1
          fi

          created=0
          cleanup_on_error() {
            if [ "$created" -eq 1 ]; then
              gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
            fi
          }
          trap cleanup_on_error ERR

          gh release create "$RELEASE_TAG" \
            --target "$SOURCE_SHA" \
            --title "Hero card-icon source pack v1 ($SOURCE_SHA)" \
            --notes "H1 exact-byte external source pack. Built from public/images/heroes/card-icons at pinned source commit $SOURCE_SHA. Hero canonical semantics, production lossless WebP assets, runtime paths, and detail-card artwork are unchanged. Integrity authority is the published SHA-256 checksum."
          created=1

          gh release upload "$RELEASE_TAG" \
            "dist/source-pack/${ARCHIVE_BASE}.tar.gz" \
            "dist/source-pack/${ARCHIVE_BASE}.inventory.json" \
            "dist/source-pack/${ARCHIVE_BASE}.sha256"

          trap - ERR

      - name: Report published checksums
        run: |
          set -euo pipefail
          cat "dist/source-pack/${ARCHIVE_BASE}.sha256"
