name: Hero Stage 5-5-3 integrated output

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-stage5-5-3.yml'
      - 'scripts/build_hero_page_stage5_5_3.cjs'
      - 'scripts/validate_hero_page_stage5_5_3.cjs'
      - 'scripts/hydrate-configdata-source-pack-v1.mjs'
      - 'data/contracts/configdata-source-pack-contract.v1.json'
      - 'data/contracts/hero-page-stage5-5-3-output-contract.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'data/validation/hero-page-stage5-5-2-rarity.v1.json'
      - 'data/validation/hero-page-stage5-5-2-factions.v1.json'
      - 'data/validation/hero-page-stage5-5-2-cv.v1.json'
      - 'data/validation/hero-page-stage5-5-2-origin.v1.json'

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure external ConfigData source root
        shell: bash
        run: echo "CONFIGDATA_SOURCE_ROOT=$RUNNER_TEMP/hero-stage5-5-3-configdata" >> "$GITHUB_ENV"

      - name: Hydrate pinned ConfigData source pack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONFIGDATA_SOURCE_ROOT"
          node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir "$CONFIGDATA_SOURCE_ROOT"
          count="$(find "$CONFIGDATA_SOURCE_ROOT/data/configdata" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$count" = "753"
          case "$CONFIGDATA_SOURCE_ROOT/" in
            "$GITHUB_WORKSPACE/"*) echo 'external ConfigData source root must stay outside repository' >&2; exit 1 ;;
          esac

      - name: Expose hydrated ConfigData at legacy Stage 5 logical path
        shell: bash
        run: |
          set -euo pipefail
          logical_root="$GITHUB_WORKSPACE/data/configdata"
          test ! -e "$logical_root"
          ln -s "$CONFIGDATA_SOURCE_ROOT/data/configdata" "$logical_root"
          test -f "$logical_root/ConfigDataHeroInfo.json"
          test -f "$logical_root/ConfigDataCharImageInfo.json"
          test -f "$logical_root/ConfigDataHeroSkinInfo.json"
          test -f "$logical_root/ConfigDataCharImageSkinResourceInfo.json"

      - name: Generate integrated 267-Hero output
        run: node scripts/build_hero_page_stage5_5_3.cjs

      - name: Validate full Stage 5-5-3 contract
        run: node scripts/validate_hero_page_stage5_5_3.cjs

      - name: Show validation summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/validation/hero-page-stage5-5-3-validation.v1.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            status: r.status,
            completion: r.completion,
            summary: r.summary,
            invariants: r.invariants,
            errorCount: r.errors.length,
            warningCount: r.warnings.length
          }, null, 2));
          if (r.status !== 'PASS') process.exit(1);
          NODE

      - name: Freeze Stage 5-5-3 outputs
        run: |
          TARGET1='data/hero-page-stage5-5-3.v1.json'
          TARGET2='data/validation/hero-page-stage5-5-3-validation.v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET1" "$TARGET2")" ]; then
            echo 'Stage 5-5-3 outputs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET1" "$TARGET2"
          git commit -m 'Freeze Hero Stage 5-5-3 integrated output'
          git push
