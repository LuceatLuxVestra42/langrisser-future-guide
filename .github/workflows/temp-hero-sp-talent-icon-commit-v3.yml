name: Temporary Hero SP Talent Icon Commit V3

on:
  push:
    branches: [work/hero-sp-talent-icons-proof-20260916]
    paths: [.github/workflows/temp-hero-sp-talent-icon-commit-v3.yml]

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow
      - name: Reuse v2 proof implementation exactly
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/temp-hero-sp-talent-icon-proof-v2.yml').read_text(encoding='utf-8')
          marker="          python <<'PY'\n"
          if marker not in src: raise SystemExit('v2 proof block marker missing')
          body=src.split(marker,1)[1].split("\n          PY",1)[0]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body,'sp-proof-v2-extracted.py','exec'),{'__name__':'__main__'})
          PY
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: hero-sp-talent-icon-official-proof-v3, path: out/hero-sp-talent-icon-proof-v2, retention-days: 7}
      - name: Commit only complete proven SP successor materialization
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat out/hero-sp-talent-icon-proof-v2/exit-code.txt 2>/dev/null || echo 99)"
          if [ "$code" != "0" ]; then exit "$code"; fi
          rm -rf out
          git rm .github/workflows/temp-hero-sp-talent-icon-proof-v2.yml .github/workflows/temp-hero-sp-talent-icon-commit-v3.yml
          python <<'PY'
          import subprocess,sys
          rows=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          paths=[row[3:].split(' -> ',1)[-1] for row in rows]
          allowed=lambda p:p in {'.github/workflows/temp-hero-sp-talent-icon-proof-v2.yml','.github/workflows/temp-hero-sp-talent-icon-commit-v3.yml','data/generated/hero-skill-icon-sp-talent-materialization.v1.json'} or p.startswith('public/images/heroes/skill-icons/')
          bad=[p for p in paths if not allowed(p)]
          if bad: print('unexpected paths',bad,file=sys.stderr); raise SystemExit(1)
          pngs=[p for p in paths if p.startswith('public/images/heroes/skill-icons/') and p.endswith('.png')]
          if 'data/generated/hero-skill-icon-sp-talent-materialization.v1.json' not in paths: raise SystemExit('missing materialization')
          if len(pngs)!=25: raise SystemExit(f'SP PNG mutation count mismatch {len(pngs)}/25')
          print('\n'.join(paths))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/generated/hero-skill-icon-sp-talent-materialization.v1.json public/images/heroes/skill-icons
          git commit -m "Materialize verified SP talent skill icons"
          git push origin HEAD:${GITHUB_REF_NAME}
