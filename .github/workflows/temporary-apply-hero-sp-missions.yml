name: Temporary apply Hero SP missions

on:
  push:
    branches:
      - work/hero-sp-missions-20260914
    paths:
      - '.github/workflows/temporary-apply-hero-sp-missions.yml'
      - 'scripts/temporary-apply-hero-sp-missions.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped patch
        run: node scripts/temporary-apply-hero-sp-missions.cjs
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Frontend production gate
        run: node tools/project-check/test/frontend-production-gate.mjs
      - name: Verify scoped diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'src/lib/hero-detail-stage5.server.ts' 'src/routes/heroes_.$heroId.tsx' | sort)"
          test "$changed" = "$expected"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/hero-detail-stage5.server.ts 'src/routes/heroes_.$heroId.tsx'
          git commit -m 'Show SP missions on hero detail pages'
          git push origin HEAD:work/hero-sp-missions-20260914
