name: Hero Awakening Icon Verification Provenance

on:
  push:
    branches:
      - work/awakening-skill-icon-a6-9-provenance-freeze-20260910
  pull_request:
    branches:
      - main
      - work/awakening-skill-icon-a6-7-source-gap-20260910
    paths:
      - '.github/workflows/hero-awakening-icon-verification-provenance.yml'
      - 'scripts/freeze-hero-awakening-icon-verification-provenance.py'
      - 'data/generated/hero-awakening-icon-verification-provenance.v1.json'
      - 'data/generated/hero-awakening-icon-verification-targets.v1.json'
      - 'data/generated/hero-awakening-icon-official-bulk-verification.v1.json'
      - 'data/generated/hero-awakening-icon-source-snapshot-gap.v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen A6-9 provenance read-only
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/freeze-hero-awakening-icon-verification-provenance.py
          after="$(git status --porcelain=v1 --untracked-files=all)"
          test "$before" = "$after"
