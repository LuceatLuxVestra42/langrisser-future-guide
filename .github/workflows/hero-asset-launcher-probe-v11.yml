name: Hero Asset Launcher Probe v11

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-hero-launcher-v11.ps1'
      - '.github/workflows/hero-asset-launcher-probe-v11.yml'

permissions:
  contents: read

jobs:
  public-update-probe:
    if: github.event.pull_request.head.ref == 'work/hero-asset-launcher-probe'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v5
      - name: Probe exact public update protocol files
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/probe-hero-launcher-v11.ps1
      - name: Upload text reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-asset-launcher-probe-v11-report
          path: ${{ runner.temp }}/langrisser-launcher-probe-v11/report
          if-no-files-found: warn
          retention-days: 3
