name: Prepare Hero Portrait WebP Samples

on:
  push:
    paths:
      - '.github/workflows/prepare-hero-portrait-webp.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download clean source PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/hero-portrait-source
          download() {
            local id="$1"
            local output="$2"
            curl -L --fail --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o ".tmp/hero-portrait-source/${output}"
          }
          download '1DO0Dk_7O0cV5h2Tsp9I1KYFQtlTbCYhK' '5.png'
          download '1oPTSwW5O4UWxY6idqHDJ_smjPTm2Wsq1' '6.png'
          download '1sPf2YNf5DhW3vLMNcEhkCDSJpxdLTvgw' '8.png'
          download '1S0Mftmvm4Lu-pdHPvzkant9zfyFGAXNE' '12.png'
          download '1cOdLxGc46d9oqJ7Epk7GDZ8wqsZIiF2p' '15.png'

      - name: Validate PNGs and generate WebP derivatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/heroes/portrait-samples
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          sources = [
              (5, '크리스', 'Chris_idle_Normal_default.png', '1DO0Dk_7O0cV5h2Tsp9I1KYFQtlTbCYhK'),
              (6, '레온', 'Leon_Animation_FIN_idle_Normal_default.png', '1oPTSwW5O4UWxY6idqHDJ_smjPTm2Wsq1'),
              (8, '라나', 'Lana_idle_Normal_default.png', '1sPf2YNf5DhW3vLMNcEhkCDSJpxdLTvgw'),
              (12, '엘윈', 'Elwin_idle_Normal_default.png', '1S0Mftmvm4Lu-pdHPvzkant9zfyFGAXNE'),
              (15, '리아나', 'Riana_idle_Normal_default.png', '1cOdLxGc46d9oqJ7Epk7GDZ8wqsZIiF2p'),
          ]

          records = []
          for hero_id, name_kr, source_name, drive_id in sources:
              source_path = Path(f'.tmp/hero-portrait-source/{hero_id}.png')
              raw = source_path.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Hero {hero_id}: source is not PNG')

              with Image.open(source_path) as image:
                  image.load()
                  if image.format != 'PNG':
                      raise SystemExit(f'Hero {hero_id}: Pillow format is {image.format}')
                  rgba = image.convert('RGBA')
                  if rgba.getextrema()[3][0] == 255:
                      raise SystemExit(f'Hero {hero_id}: expected transparent source PNG')
                  width, height = rgba.size
                  if width < 500 or height < 1000:
                      raise SystemExit(f'Hero {hero_id}: unexpected source dimensions {width}x{height}')

                  web_path = Path(f'public/images/heroes/portrait-samples/{hero_id}.webp')
                  rgba.save(web_path, 'WEBP', quality=90, method=6, lossless=False)

              web_raw = web_path.read_bytes()
              with Image.open(web_path) as web_image:
                  if web_image.format != 'WEBP':
                      raise SystemExit(f'Hero {hero_id}: derivative is not WebP')
                  if web_image.size != (width, height):
                      raise SystemExit(f'Hero {hero_id}: dimensions changed during conversion')

              records.append({
                  'heroId': hero_id,
                  'nameKr': name_kr,
                  'source': {
                      'storage': 'GOOGLE_DRIVE_BASE_SKIN_PNG',
                      'driveFileId': drive_id,
                      'fileName': source_name,
                      'mimeType': 'image/png',
                      'byteLength': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'width': width,
                      'height': height,
                      'alpha': True,
                      'decorationPolicy': 'CLEAN_CHARACTER_ART_ONLY',
                  },
                  'web': {
                      'path': f'/images/heroes/portrait-samples/{hero_id}.webp',
                      'mimeType': 'image/webp',
                      'byteLength': len(web_raw),
                      'sha256': hashlib.sha256(web_raw).hexdigest(),
                      'quality': 90,
                      'width': width,
                      'height': height,
                  },
              })

          manifest = {
              'version': 1,
              'stage': 'hero-portrait-presentation-sample',
              'status': 'PASS',
              'sourcePolicy': {
                  'cleanPngOnly': True,
                  'bakedRarityBadge': False,
                  'bakedSpBadge': False,
                  'bakedFactionBuffBadge': False,
                  'sourcePngPublishedToWebsite': False,
                  'webDerivativeFormat': 'WEBP',
              },
              'summary': {
                  'heroCount': len(records),
                  'webpCount': len(records),
                  'hardErrorCount': 0,
              },
              'records': records,
          }
          Path('data/generated/hero-portrait-presentation-sample.v1.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Verify generated sample assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/images/heroes/portrait-samples -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 5
          test -f data/generated/hero-portrait-presentation-sample.v1.json
          grep -q '"cleanPngOnly": true' data/generated/hero-portrait-presentation-sample.v1.json
          grep -q '"webpCount": 5' data/generated/hero-portrait-presentation-sample.v1.json

      - name: Commit WebP derivatives and provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/heroes/portrait-samples data/generated/hero-portrait-presentation-sample.v1.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Add clean PNG-derived Hero WebP samples'
          git push origin HEAD:main
