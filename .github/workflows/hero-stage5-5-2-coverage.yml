name: Hero Stage 5-5-2 coverage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-stage5-5-2-coverage.yml'
      - 'scripts/validate_hero_page_stage5_5_2.cjs'
      - 'scripts/sync_hero_page_stage5_5_2_semantics.cjs'
      - 'data/validation/hero-page-stage5-5-2-source-trace.v1.json'
      - 'data/validation/hero-page-stage5-5-2-skins-acquisition.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/configdata/ConfigDataHeroSkinInfo.json'

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Stage 5-5-2 structural coverage
        id: generate
        continue-on-error: true
        run: node scripts/validate_hero_page_stage5_5_2.cjs

      - name: Sync confirmed semantic status
        run: node scripts/sync_hero_page_stage5_5_2_semantics.cjs

      - name: Show coverage summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/validation/hero-page-stage5-5-2-coverage.v1.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            status: r.status,
            completion: r.completion,
            canonicalHeroCount: r.canonicalHeroCount,
            heroInfoIdentityCoverage: r.heroInfoIdentityCoverage,
            rarity: r.fields.rarity,
            factions: r.fields.factions,
            cv: r.fields.cv,
            origin: r.fields.origin,
            artwork: r.fields.artwork,
            skins: {
              status: r.fields.skins.status,
              heroesWithValidSkinList: r.fields.skins.heroesWithValidSkinList,
              totalSkinRefs: r.fields.skins.totalSkinRefs,
              resolvedSkinRefs: r.fields.skins.resolvedSkinRefs,
              artworkSemantics: r.fields.skins.artworkSemantics,
              orderingSemantics: r.fields.skins.orderingSemantics,
              acquisitionSemantics: r.fields.skins.acquisitionSemantics,
              acquisitionMapping: r.fields.skins.acquisitionMapping,
              acquisitionEncodedSkinCount: r.fields.skins.acquisitionEncodedSkinCount,
              acquisitionUnencodedSkinCount: r.fields.skins.acquisitionUnencodedSkinCount
            },
            hardErrors: r.hardErrors,
            coverageIssues: r.coverageIssues,
            unresolvedSemanticFields: r.unresolvedSemanticFields,
            dataCompletionIssues: r.dataCompletionIssues,
            readyForDisplayEnrichment: r.readyForDisplayEnrichment
          }, null, 2));
          NODE

      - name: Cross-check omitted skin lists against skin owners
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const coverage = JSON.parse(fs.readFileSync('data/validation/hero-page-stage5-5-2-coverage.v1.json', 'utf8'));
          const skins = JSON.parse(fs.readFileSync('data/configdata/ConfigDataHeroSkinInfo.json', 'utf8'));
          const invalidIds = new Set(coverage.fields.skins.heroIdsWithInvalidSkinList || []);
          const owned = new Map();
          for (const skin of skins) {
            if (!invalidIds.has(skin.SpecifiedHero)) continue;
            const ids = owned.get(skin.SpecifiedHero) || [];
            ids.push(skin.ID);
            owned.set(skin.SpecifiedHero, ids);
          }
          const rows = [...invalidIds].sort((a, b) => a - b).map((heroId) => ({
            heroId,
            specifiedHeroSkinIds: (owned.get(heroId) || []).sort((a, b) => a - b)
          }));
          console.log(JSON.stringify({
            omittedSkinListHeroCount: rows.length,
            heroesWithSpecifiedHeroSkinRows: rows.filter((row) => row.specifiedHeroSkinIds.length > 0),
            heroesWithoutSpecifiedHeroSkinRows: rows.filter((row) => row.specifiedHeroSkinIds.length === 0).map((row) => row.heroId)
          }, null, 2));
          NODE

      - name: Freeze generated coverage artifact
        run: |
          TARGET='data/validation/hero-page-stage5-5-2-coverage.v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'Coverage artifact already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$TARGET"
            git commit -m 'Freeze Hero Stage 5-5-2 coverage'
            git push
          fi

      - name: Enforce structural gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/validation/hero-page-stage5-5-2-coverage.v1.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (Array.isArray(r.hardErrors) && r.hardErrors.length > 0) {
            console.error('Structural hard errors remain:', r.hardErrors);
            process.exit(1);
          }
          if (Array.isArray(r.unresolvedSemanticFields) && r.unresolvedSemanticFields.length > 0) {
            console.error('Unresolved semantic fields remain:', r.unresolvedSemanticFields);
            process.exit(1);
          }
          console.log('Stage 5-5-2 structural and semantic gates passed; explicit source-data gaps are tracked separately.');
          NODE