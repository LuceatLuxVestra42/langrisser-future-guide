name: tmp-sp-reward-metadata-inspect

on:
  push:
    branches:
      - feat/sp-reward-skill-metadata-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reward skill rows from pinned ConfigData source pack
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { resolveConfigDataFile } = require('./scripts/configdata-source-pack-maintenance-root.cjs');
          const p = resolveConfigDataFile('ConfigDataSkillInfo.json');
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          const rows = Array.isArray(d) ? d : (d?.records || d?.rows || d?.data || []);
          console.log('RESOLVED_PATH', p);
          console.log('ROOT_KEYS', Object.keys(d || {}));
          console.log('ROW_COUNT', rows.length);
          for (const id of [12478, 12479]) {
            const q = rows.find(x => Number(x?.ID) === id);
            console.log('SKILL_ID', id);
            console.log('ROW_KEYS', q ? Object.keys(q) : null);
            console.log('ROW_JSON', q ? JSON.stringify(q) : null);
          }
          NODE
