name: tmp-sp-reward-metadata-writer

on:
  push:
    branches:
      - feat/sp-reward-skill-metadata-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write-validate-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Patch Stage 5-4 producer and frontend passthrough
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          producer = Path('scripts/build_hero_stage5_4_sp_v2.cjs')
          text = producer.read_text()
          old_header = "const fs=require('fs'),path=require('path'),R=path.resolve(__dirname,'..');\nconst read=p=>JSON.parse(fs.readFileSync(path.join(R,p),'utf8')), rows=d=>Array.isArray(d)?d:(d?.records||d?.rows||d?.data||[]), mapId=a=>new Map(a.map(x=>[Number(x.ID),x]));"
          new_header = "const fs=require('fs'),path=require('path'),R=path.resolve(__dirname,'..');\nconst {resolveConfigDataFile}=require('./configdata-source-pack-maintenance-root.cjs');\nconst read=p=>JSON.parse(fs.readFileSync(p.startsWith('data/configdata/')?resolveConfigDataFile(path.basename(p)):path.join(R,p),'utf8')), rows=d=>Array.isArray(d)?d:(d?.records||d?.rows||d?.data||[]), mapId=a=>new Map(a.map(x=>[Number(x.ID),x]));"
          if old_header not in text:
              raise SystemExit('Stage5-4 ConfigData read authority drift')
          text = text.replace(old_header, new_header, 1)
          old = "return{skillId:x,nameCn:q?.Name??null,descCn:q?.Desc??null,icon:q?.Icon??q?.IconName??null,cost:q?.Cost??null};"
          new = "return{skillId:x,nameCn:q?.Name??null,descCn:q?.Desc??null,icon:q?.Icon??q?.IconName??null,displayType:q?.TypeText??null,cooldown:q?.CDText??null,range:q?.DistanceText??null,areaOrTarget:q?.RangeText??null,cost:q?.Cost??null};"
          if old not in text:
              raise SystemExit('Stage5-4 reward skill projection authority drift')
          producer.write_text(text.replace(old, new, 1))

          frontend = Path('src/lib/hero-detail-stage5.server.ts')
          text = frontend.read_text()
          old_type = '''type Stage6SpRewardSkill = {\n  skillId?: number;\n  nameCn?: string | null;\n  descCn?: string | null;\n  icon?: string | null;\n  cost?: number | null;\n};'''
          new_type = '''type Stage6SpRewardSkill = {\n  skillId?: number;\n  nameCn?: string | null;\n  descCn?: string | null;\n  icon?: string | null;\n  displayType?: string | null;\n  cooldown?: string | null;\n  range?: string | null;\n  areaOrTarget?: string | null;\n  cost?: number | null;\n};'''
          if old_type not in text:
              raise SystemExit('SP reward skill frontend type authority drift')
          text = text.replace(old_type, new_type, 1)
          old_projection = '''    displayType: null,\n    cooldown: null,\n    range: null,\n    areaOrTarget: null,'''
          new_projection = '''    displayType: skill.displayType ?? null,\n    cooldown: skill.cooldown ?? null,\n    range: skill.range ?? null,\n    areaOrTarget: skill.areaOrTarget ?? null,'''
          if old_projection not in text:
              raise SystemExit('SP reward skill forced-null projection authority drift')
          frontend.write_text(text.replace(old_projection, new_projection, 1))
          PY

      - name: Regenerate and validate Stage 5-4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build_hero_stage5_4_sp_v2.cjs

      - name: Verify representative SP reward skills
        shell: bash
        run: |
          node <<'NODE'
          const artifact = require('./data/generated/hero-page-stage5-4-sp.v1.json');
          const validation = require('./data/validation/hero-page-stage5-4-final.v1.json');
          if (validation.status !== 'PASS' || validation.completion !== 'COMPLETE') throw new Error(`Stage5-4 validation ${validation.status}/${validation.completion}`);
          const found = new Map();
          for (const hero of artifact.records || []) for (const skill of hero?.sp?.secondStageRewards?.skills || []) found.set(Number(skill.skillId), skill);
          const expected = {
            12478: {displayType:'被动', cooldown:'-', range:'-', areaOrTarget:'-'},
            12479: {displayType:'物理伤害', cooldown:'5回合', range:'2格', areaOrTarget:'2格'},
          };
          for (const [id, want] of Object.entries(expected)) {
            const got = found.get(Number(id));
            if (!got) throw new Error(`missing representative SP reward skill ${id}`);
            for (const [k, v] of Object.entries(want)) if (got[k] !== v) throw new Error(`${id}.${k}: ${JSON.stringify(got[k])} != ${JSON.stringify(v)}`);
          }
          NODE

      - name: Regenerate and validate Stage 6-1
        run: node scripts/build_hero_stage6_1_detail.cjs

      - name: Verify Stage 6-1 composition index
        shell: bash
        run: |
          node <<'NODE'
          const artifact = require('./data/generated/hero-detail-stage6-1.v1.json');
          const validation = require('./data/validation/hero-stage6-1-final.v1.json');
          if (artifact.status !== 'PASS' || artifact.completion !== 'COMPLETE') throw new Error(`Stage6-1 artifact ${artifact.status}/${artifact.completion}`);
          if (validation.status !== 'PASS' || validation.completion !== 'COMPLETE') throw new Error(`Stage6-1 validation ${validation.status}/${validation.completion}`);
          if (artifact.representation !== 'normalized-composition-index') throw new Error(`unexpected Stage6-1 representation ${artifact.representation}`);
          if (artifact.sourceMap?.sp?.path !== 'data/generated/hero-page-stage5-4-sp.v1.json') throw new Error(`Stage6-1 SP sourceMap drift: ${JSON.stringify(artifact.sourceMap?.sp)}`);
          if (!Array.isArray(artifact.records) || artifact.records.length !== 267) throw new Error(`Stage6-1 Hero index count ${artifact.records?.length}`);
          NODE

      - name: Regenerate full Hero detail and shards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_hero_stage6_3_full_generation.cjs
          node scripts/shard_hero_stage6_3_output.cjs
          node - <<'NODE'
          const v = require('./data/validation/hero-stage6-3-final.v1.json');
          if (!['PASS','PASS_WITH_REVIEW'].includes(v.status) || v.completion !== 'COMPLETE' || Number(v.summary?.hardErrorCount) !== 0) throw new Error(`Stage6-3 validation ${v.status}/${v.completion}/hard=${v.summary?.hardErrorCount}`);
          const shards = require('fs').readdirSync('./data/generated/hero-detail/by-id').filter(x => x.endsWith('.json'));
          if (shards.length !== 267) throw new Error(`expected 267 Hero shards, got ${shards.length}`);
          let found = null;
          for (const file of shards) {
            const hero = require(`./data/generated/hero-detail/by-id/${file}`);
            for (const skill of hero?.sp?.secondStageRewards?.skills || []) if (Number(skill.skillId) === 12479) found = skill;
          }
          if (!found || found.displayType !== '物理伤害' || found.cooldown !== '5回合' || found.range !== '2格' || found.areaOrTarget !== '2格') throw new Error(`sharded Hero detail did not preserve SP reward metadata: ${JSON.stringify(found)}`);
          NODE

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Frontend preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-skin-stage3-5-static-assets-readonly.mjs
          node scripts/validate-skin-stage3-6-hero-detail-consumer.mjs
          node scripts/validate-hero-card-icon-frontend.mjs
          node scripts/validate-hero-fusion-power-frontend.mjs
          bunx tsc --noEmit

      - name: Build
        run: bunx vite build --config vite.config.pages.ts

      - name: Audit and freeze final change set
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-sp-reward-metadata-inspect.yml
          git rm -f .tmp-sp-reward-metadata-inspect.json .tmp-sp-pipeline-inspect.txt

          echo '=== working tree before freeze ==='
          git status --short

          git add scripts/build_hero_stage5_4_sp_v2.cjs \
            src/lib/hero-detail-stage5.server.ts \
            data/generated/hero-page-stage5-4-sp.v1.json \
            data/validation/hero-page-stage5-4-final.v1.json \
            data/generated/hero-detail-stage6-1.v1.json \
            data/validation/hero-stage6-1-final.v1.json \
            data/generated/hero-detail.v1.json \
            data/generated/hero-detail-shared.v1.json \
            data/generated/hero-detail/by-id \
            data/validation/hero-stage6-3-final.v1.json \
            data/checkpoints/hero-stage6-3-full-generation.json \
            data/checkpoints/hero-stage6-3-full-generation.md

          if [ -n "$(git status --porcelain | grep '^??' || true)" ]; then
            echo 'unexpected untracked paths:' >&2
            git status --short >&2
            exit 1
          fi

          git diff --cached --check
          echo '=== staged paths ==='
          git diff --cached --name-status

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve SP reward skill display metadata'
          git pull --rebase origin feat/sp-reward-skill-metadata-v2
          git push origin HEAD:feat/sp-reward-skill-metadata-v2
