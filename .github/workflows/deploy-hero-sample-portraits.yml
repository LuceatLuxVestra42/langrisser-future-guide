name: Deploy Hero Portrait Samples

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-hero-sample-portraits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Hero portrait sample contract
        run: |
          set -euo pipefail
          grep -q 'SAMPLE_HERO_CARD_URLS' src/routes/heroes.tsx
          grep -q '초상화 샘플' src/routes/heroes.tsx
          for id in 5 6 8 12 15; do
            grep -q "  ${id}:" src/routes/heroes.tsx
          done
          grep -q 'aspect-square' src/routes/heroes.tsx
          grep -q 'bg-black/60' src/routes/heroes.tsx

      - name: Reuse proven GitHub Pages static config
        run: |
          set -euo pipefail
          git fetch origin deploy/soldier-lower-tier-kr-names-20260828 --depth=1
          git show FETCH_HEAD:vite.config.ts > vite.config.ts
          grep -q 'base: "/langrisser-future-guide/"' vite.config.ts
          grep -q 'Expected 267 unique Hero IDs' vite.config.ts

      - name: Build GitHub Pages static site
        run: bun run build

      - name: Verify Hero static output
        run: |
          set -euo pipefail
          test -f dist/client/heroes/index.html
          HERO_DETAIL_COUNT="$(find dist/client/heroes -mindepth 2 -maxdepth 2 -type f -name index.html | grep -E '/heroes/[0-9]+/index\.html$' | wc -l | tr -d ' ')"
          test "$HERO_DETAIL_COUNT" -eq 267
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/client/heroes/index.html', 'utf8');
          const required = [
            '초상화 샘플',
            '/langrisser-future-guide/heroes/6',
            '레온',
            '라나',
            '엘윈',
            '리아나',
            '크리스'
          ];
          for (const token of required) {
            if (!html.includes(token)) throw new Error(`Hero static output missing: ${token}`);
          }
          const imageHostCount = (html.match(/redpanda7301\.github\.io\/langrisser\/img\/card\//g) ?? []).length;
          if (imageHostCount !== 5) throw new Error(`Expected 5 Hero portrait sample URLs; got ${imageHostCount}`);
          console.log(`PASS: Hero portrait samples present in static output (${imageHostCount})`);
          NODE
          printf '%s\n' "$GITHUB_SHA" > dist/client/qa-main-source.txt
          printf '%s\n' 'hero-portrait-sample-5' > dist/client/qa-surface.txt

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/client
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy Hero portrait samples ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
