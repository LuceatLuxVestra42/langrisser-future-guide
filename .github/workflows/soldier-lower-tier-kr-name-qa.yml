name: Soldier lower-tier Korean name QA

on:
  push:
    branches:
      - work/soldier-lower-tier-kr-names
    paths:
      - 'data/presentation/soldier-lower-tier-name-kr.v1.json'
      - 'src/lib/soldier-page.server.ts'
      - '.github/workflows/soldier-lower-tier-kr-name-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify exact tier 1-2 Korean name coverage
        run: |
          node <<'NODE'
          const source = require('./data/presentation/soldier-lower-tier-name-kr.v1.json');
          const frozen = require('./data/generated/soldier-list-stage5-8.v1.json');
          if (source.status !== 'PASS' || source.scope !== 'frontend-presentation-only') throw new Error('presentation source status mismatch');
          if (source.coverage.recordCount !== 39 || source.coverage.tier1Count !== 12 || source.coverage.tier2Count !== 27 || source.coverage.unresolvedCount !== 0) throw new Error('presentation coverage mismatch');
          const lower = frozen.records.filter((r) => r.sortBucket === 'LOWER_TIER_TECHNICAL');
          if (lower.length !== 39) throw new Error(`frozen lower-tier count ${lower.length}`);
          const byId = new Map(source.records.map((r) => [r.soldierId, r]));
          if (byId.size !== 39) throw new Error('duplicate presentation Soldier ID');
          for (const base of lower) {
            const p = byId.get(base.soldierId);
            if (!p) throw new Error(`missing ${base.soldierId}`);
            if (p.nameCn !== base.nameCn || p.tier !== base.tier || !p.nameKr) throw new Error(`mismatch ${base.soldierId}`);
          }
          console.log('PASS: 39/39 tier 1-2 Korean Soldier names exact-mapped');
          NODE
      - name: Production build
        run: bun run build
