name: Materialize Soldier Training Cost Material Icons

on:
  push:
    branches:
      - work/soldier-training-cost-material-icons-48
    paths:
      - "data/manifests/soldier-training-cost-material-assets-supplemental.v1.json"
      - "src/lib/soldier-training-cost-material-assets-supplemental.ts"
      - "scripts/validate-soldier-training-cost-material-assets-supplemental.mjs"
      - ".github/workflows/materialize-soldier-training-cost-material-icons.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/soldier-training-cost-material-icons-48
          fetch-depth: 1

      - name: Download exact Drive assets and patch presentation consumer
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import struct
          import urllib.request

          manifest_path = pathlib.Path("data/manifests/soldier-training-cost-material-assets-supplemental.v1.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          for record in manifest["records"]:
              url = f"https://drive.usercontent.google.com/download?id={record['driveFileId']}&export=download&confirm=t"
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != record["pngSha256"]:
                  raise SystemExit(f"SHA-256 mismatch for itemId={record['itemId']}: {digest}")
              if len(data) != record["byteSize"]:
                  raise SystemExit(f"byte-size mismatch for itemId={record['itemId']}")
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"invalid PNG for itemId={record['itemId']}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height, data[24], data[25]) != (172, 172, 8, 6):
                  raise SystemExit(f"PNG mode/dimensions mismatch for itemId={record['itemId']}")
              target = pathlib.Path(record["repoPngPath"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          route_path = pathlib.Path("src/routes/soldiers_.training.tsx")
          text = route_path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import { getOfficialArmyIconUrl } from "@/lib/army-icon-assets";\nimport { getSoldierTrainingPageData } from "@/lib/soldier-training-page.functions";',
                  'import { getOfficialArmyIconUrl } from "@/lib/army-icon-assets";\nimport { getSoldierTrainingCostMaterialIconUrl } from "@/lib/soldier-training-cost-material-assets-supplemental";\nimport { getSoldierTrainingPageData } from "@/lib/soldier-training-page.functions";',
              ),
              (
                  '          const display = materialById.get(material.id);\n          return (',
                  '          const display = materialById.get(material.id);\n          const iconUrl = getSoldierTrainingCostMaterialIconUrl(material.id);\n          return (',
              ),
              ('              {display ? (\n                <img\n                  src={display.imageUrl}', '              {iconUrl ? (\n                <img\n                  src={iconUrl}'),
              (
                  '          한글명·아이콘이 아직 현재 presentation source에 없는 재료는 검증된 재료 ID로 표시해.',
                  '          한글명이 아직 현재 presentation source에 없는 재료는 검증된 재료 ID로 표시해.',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"route patch contract drift: expected 1 occurrence, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          route_path.write_text(text, encoding="utf-8")
          PY

      - name: Validate exact supplemental asset admission
        run: node scripts/validate-soldier-training-cost-material-assets-supplemental.mjs

      - name: Remove one-off materializer and commit generated assets
        shell: bash
        run: |
          rm .github/workflows/materialize-soldier-training-cost-material-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/soldier-training-cost-material-assets-supplemental.v1.json \
            src/lib/soldier-training-cost-material-assets-supplemental.ts \
            scripts/validate-soldier-training-cost-material-assets-supplemental.mjs \
            src/routes/soldiers_.training.tsx \
            public/images/soldier-training-materials \
            .github/workflows/materialize-soldier-training-cost-material-icons.yml
          git commit -m "Apply Soldier Training cost material icons"
          git push origin HEAD:work/soldier-training-cost-material-icons-48
