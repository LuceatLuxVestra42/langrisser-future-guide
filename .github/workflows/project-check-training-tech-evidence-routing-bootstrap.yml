name: Project Check TrainingTech Evidence Routing Bootstrap

on:
  push:
    branches:
      - project-check/soldier-training-tech-classification-evidence-routing

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add explicit owner rule and regression fixture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ownerPath = 'tools/project-check/contracts/owners.v1.json';
          const ownerMap = JSON.parse(fs.readFileSync(ownerPath, 'utf8'));
          const ruleId = 'soldier-training-tech-classification-evidence';
          if (!ownerMap.pathRules.some(rule => rule.id === ruleId)) {
            const soldierCanonicalIndex = ownerMap.pathRules.findIndex(rule => rule.id === 'soldier-canonical');
            if (soldierCanonicalIndex < 0) throw new Error('soldier-canonical rule not found');
            ownerMap.pathRules.splice(soldierCanonicalIndex, 0, {
              id: ruleId,
              patterns: ['data/evidence/soldier-training-tech-classification-*'],
              owners: ['soldier-canonical']
            });
            fs.writeFileSync(ownerPath, JSON.stringify(ownerMap, null, 2) + '\n');
          }

          const testPath = 'tools/project-check/test/project-check-self-test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const fixture = `expectOwners(\n  'data/evidence/soldier-training-tech-classification-stage3-semantic.v1.json',\n  ['soldier-canonical'],\n  ['soldier-canonical'],\n);\n`;
          if (!test.includes("data/evidence/soldier-training-tech-classification-stage3-semantic.v1.json")) {
            const marker = "const bannerAsset = routeProjectCheckPaths(['public/images/banners/Banner/probe.png'], contracts);";
            if (!test.includes(marker)) throw new Error('self-test insertion marker not found');
            test = test.replace(marker, fixture + '\n' + marker);
            fs.writeFileSync(testPath, test);
          }
          NODE
      - name: Run Project Check self-test
        run: node tools/project-check/test/project-check-self-test.mjs
      - name: Assert explicit Stage 3 evidence route
        run: node tools/project-check/cli/check.mjs --paths data/evidence/soldier-training-tech-classification-stage3-semantic.v1.json --plan
      - name: Persist routing contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/project-check/contracts/owners.v1.json tools/project-check/test/project-check-self-test.mjs
          if git diff --cached --quiet; then
            echo "Routing contract already current."
          else
            git commit -m "Route TrainingTech classification evidence to Soldier canonical"
            git push
          fi
