name: Hero Stage 5 integration review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-stage5-integration.yml'
      - 'scripts/validate_hero_stage5_integration.cjs'
      - 'data/validation/hero-page-stage5-3-final.v1.json'
      - 'data/validation/hero-page-stage5-5-5-final.v1.json'
      - 'data/validation/hero-page-stage5-1-final.v1.json'
      - 'data/validation/hero-page-stage5-2-final.v1.json'
      - 'data/validation/hero-page-stage5-4-final.v1.json'

permissions:
  contents: write

jobs:
  integration-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hero Stage 5 integration review
        run: node scripts/validate_hero_stage5_integration.cjs

      - name: Show integration summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/validation/hero-page-stage5-integration-review.v1.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            status: r.status,
            completion: r.completion,
            summary: r.summary,
            blockers: r.blockers,
            hardErrors: r.hardErrors,
            recommendedWorkOrder: r.recommendedWorkOrder
          }, null, 2));
          NODE

      - name: Freeze integration review artifact
        run: |
          TARGET='data/validation/hero-page-stage5-integration-review.v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'Integration review artifact already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$TARGET"
            git commit -m 'Freeze Hero Stage 5 integration review'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
