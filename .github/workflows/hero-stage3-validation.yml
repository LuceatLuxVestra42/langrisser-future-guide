name: Hero stage 3 and stage 4 validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/validate_hero_stage3_direct.cjs'
      - 'scripts/validate_hero_stage4_upstream_direct.cjs'
      - 'scripts/prepare_hero_basic_combat_stage45.cjs'
      - 'scripts/validate_hero_stage4_final.cjs'
      - 'scripts/validate_hero_stage4_a_boundary.cjs'
      - 'data/hero-name-master.v1.json'
      - 'data/hero-name-corrections.v1.json'
      - 'data/hero-master-stage3-1.v1.json'
      - 'data/hero-normal-stage3-2.v1.json'
      - 'data/hero-sp-stage3-3.v1.json'
      - 'data/hero-page-stage3-4.v1.json'
      - 'data/hero-basic-combat-stage4-5.v1.json'
      - 'data/generated/hero-job-trees.v1.json'
      - 'data/generated/hero-skill-acquisition.v1.json'
      - 'data/generated/hero-basic-combat.v1.json'
      - 'data/validation/hero-pages-summary.v1.json'
      - 'data/validation/hero-stage4-upstream-direct.v1.json'
      - 'data/validation/hero-basic-combat-stage4-5-summary.v1.json'
      - 'data/validation/hero-stage4-a-boundary.v1.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/configdata/ConfigDataJobInfo.json'
      - 'data/configdata/ConfigDataJobConnectionInfo.json'
      - 'data/configdata/ConfigDataJobLevelInfo.json'
      - 'data/configdata/ConfigDataSkillInfo.json'
      - 'data/configdata/ConfigDataAwakenInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'data/configdata/ConfigDataMissionExtSPHeroInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - '.github/workflows/hero-stage3-validation.yml'
  pull_request:
    paths:
      - 'scripts/validate_hero_stage3_direct.cjs'
      - 'scripts/validate_hero_stage4_upstream_direct.cjs'
      - 'scripts/prepare_hero_basic_combat_stage45.cjs'
      - 'scripts/validate_hero_stage4_final.cjs'
      - 'scripts/validate_hero_stage4_a_boundary.cjs'
      - 'data/hero-name-master.v1.json'
      - 'data/hero-name-corrections.v1.json'
      - 'data/hero-master-stage3-1.v1.json'
      - 'data/hero-normal-stage3-2.v1.json'
      - 'data/hero-sp-stage3-3.v1.json'
      - 'data/hero-page-stage3-4.v1.json'
      - 'data/hero-basic-combat-stage4-5.v1.json'
      - 'data/generated/hero-job-trees.v1.json'
      - 'data/generated/hero-skill-acquisition.v1.json'
      - 'data/generated/hero-basic-combat.v1.json'
      - 'data/validation/hero-pages-summary.v1.json'
      - 'data/validation/hero-stage4-upstream-direct.v1.json'
      - 'data/validation/hero-basic-combat-stage4-5-summary.v1.json'
      - 'data/validation/hero-stage4-a-boundary.v1.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/configdata/ConfigDataJobInfo.json'
      - 'data/configdata/ConfigDataJobConnectionInfo.json'
      - 'data/configdata/ConfigDataJobLevelInfo.json'
      - 'data/configdata/ConfigDataSkillInfo.json'
      - 'data/configdata/ConfigDataAwakenInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'data/configdata/ConfigDataMissionExtSPHeroInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - '.github/workflows/hero-stage3-validation.yml'

permissions:
  contents: read

jobs:
  validate-hero-stage3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate frozen Hero Stage 3 against current direct JSON
        run: node scripts/validate_hero_stage3_direct.cjs

  validate-hero-stage4:
    needs: validate-hero-stage3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regress frozen Stage 4-3/4-4 against current direct JSON
        run: node scripts/validate_hero_stage4_upstream_direct.cjs
      - name: Generate Hero Stage 4-5 from current direct JSON
        run: node scripts/prepare_hero_basic_combat_stage45.cjs
      - name: Validate Hero Stage 4 final output
        run: node scripts/validate_hero_stage4_final.cjs
      - name: Recheck A-1/A-9 boundary
        run: node scripts/validate_hero_stage4_a_boundary.cjs
