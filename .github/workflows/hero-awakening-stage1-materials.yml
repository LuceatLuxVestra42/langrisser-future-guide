name: Hero Awakening Stage I Materials

on:
  push:
    branches:
      - 'feat/hero-awakening-stage1-materials-*'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frozen awakening material artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build_hero_awakening_materials.cjs

      - name: Validate frozen awakening material artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate_hero_awakening_materials.cjs

      - name: Reject unexpected producer mutation
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain=v1 | sed -E 's/^...//' | grep -Ev '^(data/generated/hero-awakening-materials\.v1\.json|data/validation/hero-awakening-materials-summary\.v1\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected mutation after producer/validator:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Commit regenerated frozen artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add data/generated/hero-awakening-materials.v1.json data/validation/hero-awakening-materials-summary.v1.json
          if git diff --cached --quiet; then
            echo 'Frozen artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate Hero awakening stage I materials'
          git push origin HEAD:${GITHUB_REF_NAME}
