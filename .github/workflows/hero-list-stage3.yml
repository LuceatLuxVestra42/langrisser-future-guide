name: Hero List Stage 3 Search and Filters

on:
  push:
    branches:
      - work/hero-list-stage3
    paths:
      - "data/generated/hero-list-stage1.v1.json"
      - "data/checkpoints/hero-list-stage2.json"
      - "src/lib/hero-list.server.ts"
      - "src/lib/hero-list.functions.ts"
      - "src/routes/heroes.tsx"
      - "scripts/validate_hero_list_stage3.cjs"
      - ".github/workflows/hero-list-stage3.yml"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "data/generated/hero-list-stage1.v1.json"
      - "data/checkpoints/hero-list-stage2.json"
      - "src/lib/hero-list.server.ts"
      - "src/lib/hero-list.functions.ts"
      - "src/routes/heroes.tsx"
      - "scripts/validate_hero_list_stage3.cjs"
      - ".github/workflows/hero-list-stage3.yml"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

jobs:
  hero-list-stage3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preflight Stage 2 predecessor and frozen consumer
        run: node scripts/validate_hero_list_stage3.cjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build gate
        run: bun run build

      - name: Verify Hero route remains generated
        run: |
          test -f src/routeTree.gen.ts
          grep -q "heroes" src/routeTree.gen.ts

      - name: TypeScript gate
        run: bunx tsc --noEmit
