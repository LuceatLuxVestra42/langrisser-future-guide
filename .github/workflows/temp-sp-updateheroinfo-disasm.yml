name: Temporary SP UpdateHeroInfo disassembly probe
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract GameAssembly and disassemble HeroInfo seams
        shell: bash
        run: |
          mkdir -p /tmp/spbin out/sp-updateheroinfo-disasm
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib
          V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; U=f'{B}/InstallPage_{V}_1.zip'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          def rq(a,b):
            with urllib.request.urlopen(urllib.request.Request(U,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          with urllib.request.urlopen(urllib.request.Request(U,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:t=int(r.headers['Content-Length'])
          n=min(131072,t); x=rq(t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(o,o+s-1); i=0
          while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
            fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); i+=46+fn+ex+cm
            if nm!='Client/GameAssembly.dll': continue
            h=rq(lo,lo+4095); fn2,ex2=struct.unpack_from('<HH',h,26); st=lo+30+fn2+ex2; d=rq(st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; pathlib.Path('/tmp/spbin/GameAssembly.dll').write_bytes(raw); break
          PY
          objdump -d -M intel --start-address=0x1818d9f00 --stop-address=0x1818da120 /tmp/spbin/GameAssembly.dll > out/sp-updateheroinfo-disasm/hero-update.txt
          objdump -d -M intel --start-address=0x181860a20 --stop-address=0x181860c20 /tmp/spbin/GameAssembly.dll > out/sp-updateheroinfo-disasm/battlehero-update.txt
          python <<'PY'
          import json,pathlib,re
          out=pathlib.Path('out/sp-updateheroinfo-disasm')
          targets={'normalGetter':'181c5d770','spGetter':'181c71090','spHpGetter':'180388c50','normalHpGetter':'18143bcd0'}
          result={'status':'PASS','targets':targets,'files':{}}
          for fn in ['hero-update.txt','battlehero-update.txt']:
            text=(out/fn).read_text(errors='replace').lower(); result['files'][fn]={'directTargetHits':{k:len(re.findall(v,text)) for k,v in targets.items()},'callLines':[ln for ln in text.splitlines() if '\tcall' in ln][:80]}
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sp-updateheroinfo-disasm
          path: out/sp-updateheroinfo-disasm
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-sp-updateheroinfo-disasm.yml
          git commit -m "Remove temporary SP UpdateHeroInfo disassembly probe"
          git push origin HEAD:${GITHUB_REF_NAME}
