name: Banner Stage 2-6 Materialize

on:
  push:
    branches:
      - investigate/banner-stage2-6
    paths:
      - '.github/workflows/banner-stage2-6-materialize.yml'
      - 'data/contracts/banner-stage2-6-cp-event-contract.v1.json'
      - 'scripts/finalize-banner-stage2-6-cp-event-relations.mjs'
      - 'scripts/validate-banner-stage2-6-cp-event-relations.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize CP/Event relations
        run: node scripts/finalize-banner-stage2-6-cp-event-relations.mjs
      - name: Validate full CP/Event population
        id: validate
        continue-on-error: true
        run: node scripts/validate-banner-stage2-6-cp-event-relations.mjs
      - name: Commit generated Stage 2-6 outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/banner-cp-event-relations.v1.json \
                  data/validation/banner-stage2-6-summary.v1.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Materialize Banner Stage 2-6 CP/Event relations"
            git push
          fi
      - name: Fail workflow if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
