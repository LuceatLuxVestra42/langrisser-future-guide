name: Apply Soldier 640 Korean name

on:
  push:
    branches:
      - fix/soldier-640-name-kr

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exact Soldier 640 localization surfaces
        shell: python
        run: |
          import json
          from pathlib import Path

          OLD = "요정 예언자"
          NEW = "신령 예언자"
          CN = "仙灵预言者"
          SOLDIER_ID = 640

          metadata_path = Path("data/metadata/soldier-name-kr-tier3.v1.json")
          projection_paths = [
              Path("data/generated/soldier-list-stage5-8.v1.json"),
              Path("data/generated/soldier-detail-stage5-2.v1.json"),
              Path("public/data/soldier-detail-stage5-6.v1.json"),
          ]

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          matches = [row for row in metadata["records"] if row.get("nameCn") == CN]
          assert len(matches) == 1, f"metadata target count={len(matches)}"
          row = matches[0]
          assert row.get("nameKr") == OLD
          assert row.get("nameKrStatus") == "confirmed"
          assert row.get("armyType") == "MAGE"
          assert row.get("uiGroup") == "MAGE_HOLY_DEMON"
          text = metadata_path.read_text(encoding="utf-8")
          needle = '"nameCn":"仙灵预言者","nameKr":"요정 예언자","nameKrStatus":"confirmed","armyType":"MAGE","uiGroup":"MAGE_HOLY_DEMON"'
          replacement = '"nameCn":"仙灵预言者","nameKr":"신령 예언자","nameKrStatus":"confirmed","armyType":"MAGE","uiGroup":"MAGE_HOLY_DEMON"'
          assert text.count(needle) == 1
          metadata_path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          def target_record(payload):
              for record in payload.get("records", []):
                  if record.get("soldierId") == SOLDIER_ID:
                      return record
              raise AssertionError("Soldier 640 missing")

          for path in projection_paths:
              before = json.loads(path.read_text(encoding="utf-8"))
              record = target_record(before)
              identity = record.get("identity", record)
              assert identity.get("nameCn") == CN, (path, identity.get("nameCn"))
              assert identity.get("nameKr") == OLD, (path, identity.get("nameKr"))
              assert identity.get("nameKrStatus") == "confirmed"
              assert identity.get("tier") == 3
              assert identity.get("armyType") == "MAGE"
              assert identity.get("uiGroup") == "MAGE_HOLY_DEMON"
              assert identity.get("isSp") is False
              old_fragment = '"nameKr": "요정 예언자"'
              new_fragment = '"nameKr": "신령 예언자"'
              text = path.read_text(encoding="utf-8")
              assert text.count(old_fragment) == 1, (path, text.count(old_fragment))
              path.write_text(text.replace(old_fragment, new_fragment, 1), encoding="utf-8")
              after = json.loads(path.read_text(encoding="utf-8"))
              updated = target_record(after)
              updated_identity = updated.get("identity", updated)
              assert updated_identity.get("nameKr") == NEW
              for key, expected in {
                  "nameCn": CN,
                  "nameKrStatus": "confirmed",
                  "tier": 3,
                  "armyType": "MAGE",
                  "uiGroup": "MAGE_HOLY_DEMON",
                  "isSp": False,
              }.items():
                  assert updated_identity.get(key) == expected, (path, key, updated_identity.get(key))

          validation = {
              "version": 1,
              "status": "PASS",
              "scope": "Soldier 640 Korean localization correction only",
              "target": {
                  "soldierId": 640,
                  "nameCn": CN,
                  "previousNameKr": OLD,
                  "nameKr": NEW,
                  "nameKrStatus": "confirmed",
                  "tier": 3,
                  "armyType": "MAGE",
                  "uiGroup": "MAGE_HOLY_DEMON",
              },
              "authoritativeSource": "data/metadata/soldier-name-kr-tier3.v1.json",
              "synchronizedFiles": [str(path) for path in projection_paths],
              "invariants": {
                  "soldierIdUnchanged": True,
                  "chineseNameUnchanged": True,
                  "tierUnchanged": True,
                  "armyTypeUnchanged": True,
                  "releaseMetadataUnchanged": True,
                  "combatDataUnchanged": True,
                  "relationsUnchanged": True,
                  "assetsUnchanged": True,
              },
          }
          validation_path = Path("data/validation/soldier-t3-korean-name-640.v1.json")
          validation_path.write_text(json.dumps(validation, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          checkpoint_lines = [
              "Soldier 640 Korean Name Correction — PASS",
              "",
              "Current state:",
              "- 640 / 仙灵预言者 / MAGE",
              "- nameKr: 요정 예언자 -> 신령 예언자",
              "- nameKrStatus: confirmed (unchanged)",
              "",
              "Authoritative source:",
              "- data/metadata/soldier-name-kr-tier3.v1.json",
              "",
              "Synchronized production projections:",
              "- data/generated/soldier-list-stage5-8.v1.json",
              "- data/generated/soldier-detail-stage5-2.v1.json",
              "- public/data/soldier-detail-stage5-6.v1.json",
              "",
              "Completed scope:",
              "- Korean localization correction only",
              "- Soldier ID, Chinese name, tier, army type, release metadata, combat data, relations, and assets unchanged",
              "",
              "REVIEW:",
              "- none",
              "",
              "BLOCKER:",
              "- none",
              "",
              "Next start point:",
              "- normal localization maintenance flow / Project Doctor PR guard",
              "",
              "Reopen conditions:",
              "- authoritative Korean name changes again",
              "- Soldier 640 identity changes",
              "- production projection parity breaks",
          ]
          Path("data/checkpoints/soldier-t3-korean-name-640.txt").write_text("\n".join(checkpoint_lines) + "\n", encoding="utf-8")

          assert OLD not in metadata_path.read_text(encoding="utf-8")
          for path in projection_paths:
              assert OLD not in path.read_text(encoding="utf-8")
          print("Soldier 640 localization patch: PASS")

      - name: Install dependencies
        run: npm ci

      - name: Localization audit
        run: npm run audit:localization:check

      - name: Production build
        run: npm run build

      - name: Commit patched artifacts and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-soldier-640-name.yml
          git rm .github/soldier640-run-trigger.txt
          git add data/metadata/soldier-name-kr-tier3.v1.json \
                  data/generated/soldier-list-stage5-8.v1.json \
                  data/generated/soldier-detail-stage5-2.v1.json \
                  public/data/soldier-detail-stage5-6.v1.json \
                  data/validation/soldier-t3-korean-name-640.v1.json \
                  data/checkpoints/soldier-t3-korean-name-640.txt
          git diff --cached --check
          git commit -m "Correct Soldier 640 Korean name"
          git push origin HEAD:fix/soldier-640-name-kr
