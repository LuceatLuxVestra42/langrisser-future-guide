name: ConfigData B5.8 Soldier Stage3 Writeback Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/finalize-soldier-stage3.cjs'
      - '.github/workflows/soldier-stage3-final.yml'
      - '.github/workflows/configdata-source-pack-b5-8-soldier-stage3-writeback.yml'
      - 'data/contracts/configdata-source-pack-b5-8-soldier-stage3-writeback.v1.json'

permissions:
  contents: read

jobs:
  external-root-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require clean tracked branch state
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Regenerate Soldier Stage3 with tracked ConfigData absent
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/b58-soldier-stage3-proof"
          echo "PROOF=$PROOF" >> "$GITHUB_ENV"
          git worktree add --detach "$PROOF" HEAD
          rm -rf "$PROOF/data/configdata"
          test ! -e "$PROOF/data/configdata"
          (
            cd "$PROOF"
            node scripts/finalize-soldier-stage3.cjs
            node scripts/finalize-soldier-stage3-postprocess.cjs
          )

      - name: Require frozen semantic parity and logical provenance
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$PROOF" node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const proof = process.env.PROOF;
          const files = [
            'data/generated/soldier-stage3.v1.json',
            'data/validation/soldier-stage3-final.v1.json',
          ];
          const expectedSources = {
            soldier: 'data/configdata/ConfigDataSoldierInfo.json',
            spSoldier: 'data/configdata/ConfigDataSPSoldierInfo.json',
            training: 'data/configdata/ConfigDataTrainingTechInfo.json',
            trainingLevel: 'data/configdata/ConfigDataTrainingTechLevelInfo.json',
            mission: 'data/configdata/ConfigDataMissionInfo.json',
            missionSubmit: 'data/configdata/ConfigDataMissionSumitItemInfo.json',
            spHero: 'data/configdata/ConfigDataSPHeroInfo.json',
            soldierMaster: 'data/generated/soldier-master.v1.json',
            heroMaster: 'data/hero-name-master.v1.json',
          };
          function normalize(value) {
            if (Array.isArray(value)) return value.map(normalize);
            if (value && typeof value === 'object') {
              const out = {};
              for (const key of Object.keys(value).sort()) {
                if (key === 'generatedAt') continue;
                out[key] = normalize(value[key]);
              }
              return out;
            }
            return value;
          }
          for (const file of files) {
            const frozen = JSON.parse(fs.readFileSync(file, 'utf8'));
            const regenerated = JSON.parse(fs.readFileSync(path.join(proof, file), 'utf8'));
            if (JSON.stringify(normalize(frozen)) !== JSON.stringify(normalize(regenerated))) {
              throw new Error(`Soldier Stage3 external-root semantic drift: ${file}`);
            }
            if (JSON.stringify(regenerated.sources) !== JSON.stringify(expectedSources)) {
              throw new Error(`Soldier Stage3 external-root logical provenance drift: ${file}`);
            }
          }
          const validation = JSON.parse(fs.readFileSync(path.join(proof, 'data/validation/soldier-stage3-final.v1.json'), 'utf8'));
          if ((validation.errors || []).length !== 0) throw new Error('Soldier Stage3 external-root validation has hard errors');
          console.log(JSON.stringify({
            status: 'PASS',
            trackedRawRootPresentInProof: false,
            semanticParityFileCount: files.length,
            logicalProvenanceChanged: false,
            semanticAuthorityChanged: false,
            frozenSemanticDomainsReopened: false,
          }, null, 2));
          NODE

      - name: Require primary checkout unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"
