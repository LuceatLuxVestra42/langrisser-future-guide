name: Hero Card Icon WebP Materialize

on:
  push:
    branches:
      - diag/hero-card-icon-webp-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Generate lossless WebP delivery from frozen PNG source
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum data/generated/hero-card-icon-assets.v1.json | awk '{print $1}')"
          python scripts/generate-hero-card-icon-web-delivery.py
          after="$(sha256sum data/generated/hero-card-icon-assets.v1.json | awk '{print $1}')"
          test "$before" = "$after"
          test "$(find public/images/heroes/card-icons -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = '267'
          test "$(find public/images/heroes/card-icons-webp -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" = '267'

      - name: Apply WebP delivery consumer and QA boundary
        run: python scripts/apply-hero-card-icon-webp-consumer.py

      - name: Verify all delivery records and actual WebP bytes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image

          delivery = json.loads(Path('data/generated/hero-card-icon-web-delivery.v1.json').read_text())
          assert delivery['status'] == 'PASS'
          assert delivery['freezeState'] == 'HERO_CARD_ICON_WEB_DELIVERY_FROZEN'
          assert delivery['sourcePolicy']['pngAuthoritativeSourceRetained'] is True
          assert delivery['sourcePolicy']['webDeliveryFormat'] == 'LOSSLESS_WEBP'
          assert delivery['summary']['heroCount'] == 267
          assert delivery['summary']['webDeliveryCount'] == 267
          assert delivery['summary']['webDeliveryTotalBytes'] < delivery['summary']['sourcePngTotalBytes']
          assert len(delivery['records']) == 267

          for row in delivery['records']:
              source = Path(row['sourcePngFilePath'])
              target = Path(row['webDeliveryFilePath'])
              assert source.is_file() and target.is_file()
              assert source.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
              assert target.read_bytes()[:4] == b'RIFF' and target.read_bytes()[8:12] == b'WEBP'
              assert hashlib.sha256(source.read_bytes()).hexdigest() == row['sourcePngSha256']
              assert hashlib.sha256(target.read_bytes()).hexdigest() == row['webDeliverySha256']
              assert target.stat().st_size == row['webDeliveryByteLength']
              with Image.open(target) as im:
                  im.load()
                  assert im.format == 'WEBP'
                  assert im.size == (row['width'], row['height'])
                  assert im.mode in ('RGBA', 'RGB')

          print(json.dumps({
              'status': 'PASS_HERO_CARD_ICON_WEBP_DELIVERY_BYTES',
              'count': 267,
              'sourcePngTotalBytes': delivery['summary']['sourcePngTotalBytes'],
              'webDeliveryTotalBytes': delivery['summary']['webDeliveryTotalBytes'],
              'savingsPercent': delivery['summary']['webDeliverySavingsPercent'],
          }))
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Hero card icon frontend validator
        run: node scripts/validate-hero-card-icon-frontend.mjs

      - name: Production build
        run: bun run build

      - name: TypeScript gate
        run: bunx tsc --noEmit

      - name: Restore non-owned build outputs and deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          git restore -- .github/workflows/project-doctor-authoritative-pages-deploy.yml
          rm -f data/generated/equipment-name-kr-user-approved.v1.json
          rm -f data/validation/equipment-name-kr-user-approved-summary.v1.json

      - name: Commit verified WebP delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/hero-card-icon-web-delivery.v1.json
          git add public/images/heroes/card-icons-webp
          git add src/lib/hero-card-icon-assets.server.ts
          git add scripts/validate-hero-card-icon-frontend.mjs
          git add scripts/validate-hero-card-icons-hosted.mjs
          git add scripts/generate-hero-card-icon-web-delivery.py
          if git diff --cached --quiet; then
            echo 'No WebP delivery changes to commit.'
            exit 0
          fi
          git commit -m "Deliver Hero card icons as lossless WebP"
          git push origin HEAD:diag/hero-card-icon-webp-20260830
