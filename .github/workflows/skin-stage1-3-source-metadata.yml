name: Skin Stage 1-3 Source Metadata

on:
  push:
    branches:
      - work/skin-stage1-3-source-metadata
    paths:
      - '.github/workflows/skin-stage1-3-source-metadata.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/skin-stage1-3-source-metadata
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate source metadata
        run: python scripts/generate-skin-stage1-3-source-metadata.py
      - name: Commit generated checkpoint and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/skin-stage1-3-source-metadata.yml
          git add data/generated/skin-stage1-source-metadata.v1.json data/validation/skin-stage1-3-final.v1.json
          git commit -m "Generate Skin Stage 1-3 source metadata"
          git push
