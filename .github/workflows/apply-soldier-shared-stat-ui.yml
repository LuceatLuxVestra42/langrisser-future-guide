name: Apply Soldier Shared Stat UI

on:
  push:
    branches:
      - test/github-pages-static-banner
    paths:
      - '.github/workflows/apply-soldier-shared-stat-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/github-pages-static-banner
      - name: Patch Soldier stat presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/soldier-detail-modal.tsx')
          source = path.read_text()

          source = source.replace(
              'sm:h-[180px] sm:grid-cols-[180px_minmax(0,1fr)_210px] sm:items-stretch lg:h-[210px] lg:grid-cols-[210px_minmax(0,1fr)_220px]',
              'sm:h-[180px] sm:grid-cols-[180px_minmax(0,1fr)_156px] sm:items-stretch lg:h-[210px] lg:grid-cols-[210px_minmax(0,1fr)_168px]'
          )

          old = '''function SoldierStatTable({ record }: { record: SoldierPrototypeRecord }) {
  const stats = [
    { label: "사거리", value: record.combat.range },
    { label: "이동", value: `타입 ${record.combat.moveType} · ${record.combat.move}칸` },
    { label: "생명", value: record.combat.hp },
    { label: "공격", value: record.combat.atk },
    { label: "방어", value: record.combat.def },
    { label: "마방", value: record.combat.mdef },
  ];

  return (
    <div className="grid overflow-hidden rounded-xl border border-border bg-background sm:h-full sm:grid-cols-2 sm:grid-rows-3">
      {stats.map((stat, index) => (
        <div
          key={stat.label}
          className={`flex min-h-[54px] flex-col items-center justify-center px-2 py-2 text-center sm:min-h-0 ${
            index % 2 === 0 ? "sm:border-r sm:border-border" : ""
          } ${index < 4 ? "sm:border-b sm:border-border" : ""}`}
        >
          <p className="text-[9px] font-bold leading-none text-muted-foreground sm:text-[10px]">
            {stat.label}
          </p>
          <p className="mt-1 text-xs font-black leading-tight tabular-nums text-foreground sm:text-sm">
            {stat.value}
          </p>
        </div>
      ))}
    </div>
  );
}'''

          new = '''function SoldierStatTable({ record }: { record: SoldierPrototypeRecord }) {
  const assetUrl = (folder: "stats" | "movement", fileName: string) =>
    `${import.meta.env.BASE_URL}images/shared/${folder}/${fileName}`;

  const movementIcons: Record<number, string> = {
    1: "Move_Ride.png",
    2: "Move_Walk.png",
    3: "Move_Water.png",
    4: "Move_Fly.png",
    5: "Move_FieldArmy.png",
  };

  const stats = [
    { label: "사거리", icon: assetUrl("stats", "Icon_Range.png"), value: record.combat.range },
    {
      label: "이동",
      icon: assetUrl("movement", movementIcons[record.combat.moveType] ?? "Move_Walk.png"),
      value: record.combat.move,
    },
    { label: "생명", icon: assetUrl("stats", "Icon_HP.png"), value: record.combat.hp },
    { label: "공격", icon: assetUrl("stats", "Icon_Attack.png"), value: record.combat.atk },
    { label: "방어", icon: assetUrl("stats", "Icon_Defense.png"), value: record.combat.def },
    { label: "마방", icon: assetUrl("stats", "Icon_MagicDefense.png"), value: record.combat.mdef },
  ];

  return (
    <div className="grid overflow-hidden rounded-xl border border-border bg-background sm:h-full sm:grid-cols-2 sm:grid-rows-3">
      {stats.map((stat, index) => (
        <div
          key={stat.label}
          title={stat.label}
          className={`flex min-h-[48px] items-center justify-center gap-1.5 px-1.5 py-1.5 sm:min-h-0 ${
            index % 2 === 0 ? "sm:border-r sm:border-border" : ""
          } ${index < 4 ? "sm:border-b sm:border-border" : ""}`}
        >
          <img src={stat.icon} alt="" aria-hidden="true" className="h-5 w-5 shrink-0 object-contain sm:h-6 sm:w-6" />
          <span className="text-sm font-black leading-none tabular-nums text-foreground sm:text-base">
            {stat.value}
          </span>
          <span className="sr-only">{stat.label}</span>
        </div>
      ))}
    </div>
  );
}'''

          if old not in source:
              raise SystemExit('Target SoldierStatTable block not found')
          source = source.replace(old, new)
          path.write_text(source)
          PY
      - name: Verify patch
        run: |
          grep -q 'Icon_Range.png' src/components/soldier-detail-modal.tsx
          grep -q 'Move_FieldArmy.png' src/components/soldier-detail-modal.tsx
          grep -q 'grid-cols-\[180px_minmax(0,1fr)_156px\]' src/components/soldier-detail-modal.tsx
      - name: Commit frontend patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/soldier-detail-modal.tsx
          git commit -m "Use shared stat and movement icons in Soldier modal"
          git push origin HEAD:test/github-pages-static-banner

# retrigger after shared assets landed
