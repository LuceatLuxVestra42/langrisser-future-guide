name: Temporary SP runtime API inventory
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract IL2CPP pair and inventory SP-related runtime APIs
        shell: bash
        run: |
          mkdir -p /tmp/spapi out/sp-runtime-api-inventory
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib
          D=pathlib.Path('/tmp/spapi'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'; T={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ents(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; a=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); a.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return a
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          for part,(target,name) in T.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ents(u,hs(u)) if e[0]==target); (D/name).write_bytes(get(u,e))
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release >/dev/null 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/spapi/dump
          dotnet "$DLL" /tmp/spapi/GameAssembly.dll /tmp/spapi/global-metadata.dat /tmp/spapi/dump >/dev/null 2>&1 || true
          python <<'PY'
          import json,pathlib,re
          d=pathlib.Path('/tmp/spapi/dump'); out=pathlib.Path('out/sp-runtime-api-inventory'); text=(d/'dump.cs').read_text(errors='replace')
          # Method declaration + following RVA comment captured loosely
          lines=text.splitlines(); hits=[]
          for i,line in enumerate(lines):
            low=line.lower()
            if ('sphero' in low or 'sp_hero' in low or 'sp hero' in low) and ('(' in line or 'class ' in line or 'interface ' in line):
              hits.append({'line':i+1,'text':line.strip(),'context':'\n'.join(lines[max(0,i-2):min(len(lines),i+4)])})
          # Full class blocks for Hero, BattleHero, HeroComponent: only SP-related declarations
          hero_sp=[]
          for i,line in enumerate(lines):
            if any(x in line for x in [' class Hero ', ' class BattleHero ', ' class HeroComponent ']):
              pass
          # signatures containing ConfigDataSPHeroInfo or GetConfigDataSPHeroInfo
          sigs=[]
          for i,line in enumerate(lines):
            if 'ConfigDataSPHeroInfo' in line and ('(' in line or ' class ' in line or ' interface ' in line): sigs.append({'line':i+1,'text':line.strip(),'context':'\n'.join(lines[max(0,i-2):min(len(lines),i+4)])})
          result={'status':'PASS','spHeroNamedDeclarations':hits[:500],'configDataSPHeroInfoSignatures':sigs[:500],'counts':{'spHeroNamedDeclarations':len(hits),'configDataSPHeroInfoSignatures':len(sigs)}}
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sp-runtime-api-inventory
          path: out/sp-runtime-api-inventory
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-sp-runtime-api-inventory.yml
          git commit -m "Remove temporary SP runtime API inventory"
          git push origin HEAD:${GITHUB_REF_NAME}
