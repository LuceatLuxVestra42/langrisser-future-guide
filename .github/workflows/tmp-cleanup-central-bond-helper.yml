name: Temporary Cleanup Central Bond Helper

on:
  push:
    branches:
      - 'work/restore-central-bond-final-stats-20260914'
    paths:
      - '.github/workflows/tmp-cleanup-central-bond-helper.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove temporary cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-cleanup-central-bond-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(hero): remove temporary cleanup workflow"
          git push origin HEAD:${{ github.ref_name }}
