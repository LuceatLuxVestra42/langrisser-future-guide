name: TrainingTech Stage 1 Census Materialize

on:
  push:
    branches:
      - data/training-tech-classification-stage1
    paths:
      - scripts/finalize-soldier-training-tech-classification-stage1.mjs
      - .github/workflows/soldier-training-tech-classification-stage1.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize Stage 1 census
        run: node scripts/finalize-soldier-training-tech-classification-stage1.mjs

      - name: Persist generated census and validation
        run: |
          if git diff --quiet -- data/generated/soldier-training-tech-classification-stage1-census.v1.json data/validation/soldier-training-tech-classification-stage1.v1.json; then
            echo "Stage 1 outputs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/soldier-training-tech-classification-stage1-census.v1.json data/validation/soldier-training-tech-classification-stage1.v1.json
          git commit -m "Materialize TrainingTech Stage 1 census"
          git push origin HEAD:data/training-tech-classification-stage1
