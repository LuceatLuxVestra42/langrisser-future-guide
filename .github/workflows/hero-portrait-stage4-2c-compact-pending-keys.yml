name: Hero portrait Stage 4-2C compact pending keys

on:
  workflow_dispatch:
  push:
    branches:
      - work/hero-portrait-stage4-2c-current-unity-source-proof
    paths:
      - scripts/hero_portrait_stage4_2c_compact_pending_keys.py
      - .github/workflows/hero-portrait-stage4-2c-compact-pending-keys.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/hero_portrait_stage4_2c_compact_pending_keys.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/validation/hero-portrait-stage4-2c-pending-current-asset-key-summary.v1.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate compact Stage 4-2C pending key report'
          git push
