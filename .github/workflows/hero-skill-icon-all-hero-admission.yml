name: Hero Skill Icon All-Hero Admission

on:
  push:
    branches:
      - work/hero-skill-icon-all-hero-coverage-current-20260912
    paths:
      - scripts/validate-hero-skill-icon-assets-readonly.mjs
      - .github/workflows/hero-skill-icon-all-hero-admission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run owning readonly validator
        run: node scripts/validate-hero-skill-icon-assets-readonly.mjs
      - name: Enforce read-only validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
