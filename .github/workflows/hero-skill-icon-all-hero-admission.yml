name: Hero Skill Icon All-Hero Admission

on:
  push:
    branches:
      - work/hero-skill-icon-all-hero-coverage-current-20260912
    paths:
      - .github/workflows/hero-skill-icon-all-hero-admission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-linux-x64.zip
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run owning skill icon validator
        run: node scripts/validate-hero-skill-icon-assets-readonly.mjs
      - name: Build authoritative static candidate
        run: bunx vite build --config vite.config.pages.ts
      - name: TypeScript gate
        run: bunx tsc --noEmit
      - name: Validate generated hero skill icon surface
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/client/heroes/6/index.html
          test "$(find dist/client/images/heroes/skill-icons -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge '1009'
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = require('./data/generated/hero-skill-icon-assets.v1.json');
          const records = [...manifest.records, ...manifest.awakeningRecords];
          const missing = records.filter((row) => !fs.existsSync(path.join('dist/client', String(row.publicPath).replace(/^\//, ''))));
          if (missing.length) throw new Error(`static candidate missing manifest skill icons: ${missing.length}`);
          const general = manifest.records.filter((row) => row.role === 'stage6-general');
          if (general.length !== 996) throw new Error(`general manifest count drift ${general.length}/996`);
          const nonLeon = general.find((row) => Array.isArray(row.heroIds) && row.heroIds.some((id) => Number(id) !== 6));
          if (!nonLeon) throw new Error('non-Leon general skill icon fixture missing');
          const nonLeonHeroId = nonLeon.heroIds.find((id) => Number(id) !== 6);
          const heroHtml = path.join('dist/client/heroes', String(nonLeonHeroId), 'index.html');
          if (!fs.existsSync(heroHtml)) throw new Error(`non-Leon hero static page missing ${nonLeonHeroId}`);
          const html = fs.readFileSync(heroHtml, 'utf8');
          const filename = path.posix.basename(nonLeon.publicPath);
          if (!html.includes(`/langrisser-future-guide/images/heroes/skill-icons/${filename}`)) {
            throw new Error(`non-Leon hero ${nonLeonHeroId} missing admitted skill icon ${filename}`);
          }
          console.log(JSON.stringify({status:'PASS_STATIC_SKILL_ICON_SURFACE', general:general.length, manifest:records.length, nonLeonHeroId, sourcePath:nonLeon.sourcePath, publicPath:nonLeon.publicPath}));
          NODE
      - name: Enforce read-only build gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
