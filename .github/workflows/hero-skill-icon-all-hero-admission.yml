name: Hero Skill Icon All-Hero Admission

on:
  push:
    branches:
      - work/hero-skill-icon-all-hero-coverage-current-20260912
    paths:
      - scripts/admit-hero-skill-icon-all-hero-manifest.mjs
      - .github/workflows/hero-skill-icon-all-hero-admission.yml
      - data/generated/hero-skill-icon-all-hero-materialization.v1.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit exact verified all-hero skill icons
        run: node scripts/admit-hero-skill-icon-all-hero-manifest.mjs
      - name: Fail closed on unexpected admission mutation
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          if [ "$changed" != "data/generated/hero-skill-icon-assets.v1.json" ]; then
            echo "Unexpected changed paths:"
            echo "$changed"
            exit 1
          fi
      - name: Commit manifest admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/generated/hero-skill-icon-assets.v1.json
          git commit -m "Admit verified all-hero skill icons"
          git push origin HEAD:${GITHUB_REF_NAME}
