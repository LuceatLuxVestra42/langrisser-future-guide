name: Equipment Stage 4 Final Closeout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/contracts/equipment-stage4-final-closeout.v1.json'
      - 'data/contracts/equipment-stage4-0-frontend-consumer-contract.v1.json'
      - 'data/validation/equipment-stage4-1-route-loader-summary.v1.json'
      - 'data/validation/equipment-stage4-2-general-list-ui-summary.v1.json'
      - 'data/validation/equipment-stage4-3-general-detail-ui-summary.v1.json'
      - 'data/validation/equipment-stage4-4-exclusive-ui-ownership-summary.v1.json'
      - 'data/validation/equipment-stage4-5-display-state-policy-summary.v1.json'
      - 'data/validation/equipment-stage4-6-admission-route-qa-summary.v1.json'
      - 'data/validation/equipment-stage4-7-whole-consumer-regression-summary.v1.json'
      - 'data/validation/equipment-image-stage3-hosted-qa-summary.v1.json'
      - 'scripts/validate-equipment-stage4-final.mjs'
      - 'src/routes/index.tsx'
      - '.github/workflows/equipment-stage4-final.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/contracts/equipment-stage4-final-closeout.v1.json'
      - 'data/contracts/equipment-stage4-0-frontend-consumer-contract.v1.json'
      - 'data/validation/equipment-stage4-1-route-loader-summary.v1.json'
      - 'data/validation/equipment-stage4-2-general-list-ui-summary.v1.json'
      - 'data/validation/equipment-stage4-3-general-detail-ui-summary.v1.json'
      - 'data/validation/equipment-stage4-4-exclusive-ui-ownership-summary.v1.json'
      - 'data/validation/equipment-stage4-5-display-state-policy-summary.v1.json'
      - 'data/validation/equipment-stage4-6-admission-route-qa-summary.v1.json'
      - 'data/validation/equipment-stage4-7-whole-consumer-regression-summary.v1.json'
      - 'data/validation/equipment-image-stage3-hosted-qa-summary.v1.json'
      - 'scripts/validate-equipment-stage4-final.mjs'
      - 'src/routes/index.tsx'
      - '.github/workflows/equipment-stage4-final.yml'

permissions:
  contents: read

jobs:
  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject protected main as explicit producer target
        run: |
          echo 'Explicit Equipment Stage 4 final producer runs must target a non-main branch. Freeze there, then open a normal PR.'
          exit 1

  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Equipment Stage 4 final closeout
        run: bun scripts/validate-equipment-stage4-final.mjs
      - name: Verify frozen Equipment Stage 4 final checkpoint
        shell: bash
        run: |
          set -euo pipefail
          target='data/validation/equipment-stage4-final.v1.json'
          if ! git diff --exit-code -- "$target"; then
            echo 'Equipment Stage 4 final checkpoint is stale. Run this workflow explicitly on a non-main producer branch and open a normal PR with the refreshed checkpoint.'
            exit 1
          fi
          echo 'Equipment Stage 4 final checkpoint matches validation output.'

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout explicit producer target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Equipment Stage 4 final closeout
        run: bun scripts/validate-equipment-stage4-final.mjs
      - name: Freeze Equipment Stage 4 final checkpoint on explicit producer branch
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='data/validation/equipment-stage4-final.v1.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT"
          if git diff --cached --quiet; then
            echo 'Equipment Stage 4 final checkpoint is already current.'
          else
            git commit -m 'Freeze Equipment Stage 4 FINAL PASS_WITH_REVIEW'
            git push origin HEAD:${{ github.ref_name }}
          fi
