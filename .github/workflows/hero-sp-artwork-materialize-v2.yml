name: Hero SP Artwork Materialize V2

on:
  push:
    branches:
      - work/hero-sp-artwork-materialize-20260920-v2
    paths:
      - .github/workflows/hero-sp-artwork-materialize-v2.yml

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hero-sp-artwork-materialize-20260920-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download verified SP render artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hero-sp-render-*
          path: .sp-source
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35499268018

      - name: Materialize exact WebP assets and manifest
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          from PIL import Image

          expected=[1,3,4,6,7,8,9,10,11,12,13,14,25,26,27,29,33,37,40,53,55,56,60,67,89]
          source=pathlib.Path('.sp-source')
          target=pathlib.Path('public/images/heroes/sp')
          target.mkdir(parents=True,exist_ok=True)
          records=[]

          for hid in expected:
              root=source/f'hero-sp-render-{hid}'
              summary_path=root/'summary.json'
              webp_path=root/f'{hid}.webp'
              if not summary_path.is_file() or not webp_path.is_file():
                  raise RuntimeError(f'missing artifact payload for Hero {hid}')
              summary=json.loads(summary_path.read_text(encoding='utf-8'))
              if summary.get('status')!='PASS_SP_ARTWORK_RENDER' or int(summary.get('heroId',-1))!=hid:
                  raise RuntimeError(f'invalid render summary for Hero {hid}: {summary.get("status")}')
              data=webp_path.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              if sha!=summary['sha256'] or len(data)!=summary['sizeBytes']:
                  raise RuntimeError(f'artifact byte mismatch for Hero {hid}')
              im=Image.open(webp_path).convert('RGBA')
              if [im.width,im.height]!=[summary['width'],summary['height']:
                  raise RuntimeError(f'dimension mismatch for Hero {hid}')
              amin,amax=im.getchannel('A').getextrema()
              if amin>=255:
                  raise RuntimeError(f'Hero {hid} lost transparency')
              shutil.copyfile(webp_path,target/f'{hid}.webp')
              records.append(summary)

          actual=sorted(int(p.stem) for p in target.glob('*.webp') if p.stem.isdigit())
          if actual!=expected:
              raise RuntimeError(f'final SP asset set mismatch: {actual}')

          manifest={
              'schemaVersion':1,
              'status':'PASS_SP_25_ARTWORK_MATERIALIZED',
              'source':{
                  'workflowRunId':35499268018,
                  'sourceBranch':'work/hero-sp-artwork-source-probe-20260920',
                  'sourceHead':'0823dbd04c06cdce8fcb12a584c2b563ab803fb0',
                  'renderContract':'official installer exact prefab -> Spine 3.3.05 idle_Normal@0 -> transparent WebP'
              },
              'guardrails':{
                  'nameJoin':False,
                  'idArithmetic':False,
                  'aiBackgroundRemoval':False,
                  'historicalImageImported':False
              },
              'count':25,
              'heroIds':expected,
              'records':records
          }
          (target/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':manifest['status'],'count':25,'bytes':sum((target/f'{i}.webp').stat().st_size for i in expected)},ensure_ascii=False))
          PY

      - name: Replace temporary SP artwork data URI with explicit asset map
        run: |
          cat > src/lib/hero-sp-artwork-assets.ts <<'EOF'
          const HERO_SP_ARTWORK_BY_HERO_ID: Readonly<Record<number, string>> = {
            1: "/images/heroes/sp/1.webp",
            3: "/images/heroes/sp/3.webp",
            4: "/images/heroes/sp/4.webp",
            6: "/images/heroes/sp/6.webp",
            7: "/images/heroes/sp/7.webp",
            8: "/images/heroes/sp/8.webp",
            9: "/images/heroes/sp/9.webp",
            10: "/images/heroes/sp/10.webp",
            11: "/images/heroes/sp/11.webp",
            12: "/images/heroes/sp/12.webp",
            13: "/images/heroes/sp/13.webp",
            14: "/images/heroes/sp/14.webp",
            25: "/images/heroes/sp/25.webp",
            26: "/images/heroes/sp/26.webp",
            27: "/images/heroes/sp/27.webp",
            29: "/images/heroes/sp/29.webp",
            33: "/images/heroes/sp/33.webp",
            37: "/images/heroes/sp/37.webp",
            40: "/images/heroes/sp/40.webp",
            53: "/images/heroes/sp/53.webp",
            55: "/images/heroes/sp/55.webp",
            56: "/images/heroes/sp/56.webp",
            60: "/images/heroes/sp/60.webp",
            67: "/images/heroes/sp/67.webp",
            89: "/images/heroes/sp/89.webp",
          };

          export function getHeroSpArtworkSource(heroId: number) {
            return HERO_SP_ARTWORK_BY_HERO_ID[heroId] ?? null;
          }
          EOF

      - name: Validate materialized asset bytes independently
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          from PIL import Image
          root=pathlib.Path('public/images/heroes/sp')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          if m.get('status')!='PASS_SP_25_ARTWORK_MATERIALIZED' or m.get('count')!=25:
              raise RuntimeError('SP materialization manifest status/count')
          ids=sorted(m['heroIds'])
          if len(ids)!=25 or len(set(ids))!=25:
              raise RuntimeError('SP materialization hero ID set')
          for r in m['records']:
              hid=int(r['heroId']); p=root/f'{hid}.webp'
              if not p.is_file(): raise RuntimeError(f'missing final asset {hid}')
              data=p.read_bytes()
              if hashlib.sha256(data).hexdigest()!=r['sha256']: raise RuntimeError(f'final SHA mismatch {hid}')
              im=Image.open(p).convert('RGBA')
              if [im.width,im.height]!=[r['width'],r['height']]: raise RuntimeError(f'final dimension mismatch {hid}')
              if im.getchannel('A').getextrema()[0]>=255: raise RuntimeError(f'final alpha mismatch {hid}')
          print(json.dumps({'status':'PASS_SP_25_MATERIALIZED_BYTE_VALIDATION','count':25}))
          PY

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run owning validators
        run: |
          bun run validate:hero-artwork-final
          bun run build

      - name: Commit verified materialization and remove one-shot workflow
        run: |
          rm .github/workflows/hero-sp-artwork-materialize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/heroes/sp src/lib/hero-sp-artwork-assets.ts .github/workflows/hero-sp-artwork-materialize-v2.yml
          git diff --cached --stat
          test "$(git diff --cached --name-only | grep -E '^public/images/heroes/sp/[0-9]+\.webp$' | wc -l)" -eq 25
          git commit -m "Materialize verified SP hero artwork"
          git push origin HEAD:work/hero-sp-artwork-materialize-20260920-v2
