name: Equipment SSR Frame Provenance V2

on:
  push:
    branches:
      - research/equipment-ssr-frame-provenance-v2
    paths:
      - scripts/equipment-image-ssr-frame-provenance-v2.py
      - scripts/equipment-image-ssr-frame-asset-provenance.py
      - scripts/equipment-image-ssr-frame-asset-resolution.py
      - .github/workflows/equipment-image-ssr-frame-provenance-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET 6 for Il2CppDumper
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install LLVM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm
          command -v llvm-readelf
          command -v llvm-objdump

      - name: Install exact asset decode dependencies
        run: python -m pip install --disable-pip-version-check UnityPy Pillow

      - name: Compile focused tracers
        run: |
          python -m py_compile scripts/equipment-image-ssr-frame-provenance-v2.py
          python -m py_compile scripts/equipment-image-ssr-frame-asset-provenance.py
          python -m py_compile scripts/equipment-image-ssr-frame-asset-resolution.py

      - name: Extract exact official APK IL2CPP pair
        run: python scripts/equipment-image-ssr-frame-provenance-v2.py extract

      - name: Download Il2CppDumper v6.7.46
        run: |
          mkdir -p /tmp/il2cppdumper
          curl --fail --location --retry 3 \
            https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip \
            -o /tmp/Il2CppDumper.zip
          unzip -q /tmp/Il2CppDumper.zip -d /tmp/il2cppdumper
          python - <<'PY'
          import json
          from pathlib import Path
          configs = list(Path('/tmp/il2cppdumper').rglob('config.json'))
          if len(configs) != 1:
              raise SystemExit(f'expected one config.json, got {configs}')
          path = configs[0]
          config = json.loads(path.read_text())
          config['RequireAnyKey'] = False
          config['GenerateScript'] = True
          config['GenerateDummyDll'] = False
          path.write_text(json.dumps(config, indent=2) + '\n')
          print(path)
          PY

      - name: Dump exact official metadata and native pair
        run: |
          mkdir -p artifacts/il2cpp-dump
          DUMPER_DLL="$(find /tmp/il2cppdumper -name 'Il2CppDumper.dll' -print -quit)"
          test -n "$DUMPER_DLL"
          dotnet "$DUMPER_DLL" \
            artifacts/il2cpp-inputs/libil2cpp.so \
            artifacts/il2cpp-inputs/global-metadata.dat \
            artifacts/il2cpp-dump
          test -s artifacts/il2cpp-dump/dump.cs
          test -s artifacts/il2cpp-dump/script.json
          test -s artifacts/il2cpp-dump/stringliteral.json

      - name: Resolve fallback rank table, SSR constants and callers
        run: |
          python scripts/equipment-image-ssr-frame-provenance-v2.py analyze
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/equipment-ssr-frame-provenance-v2.json')
          d = json.loads(p.read_text())
          assert d['status'] == 'TRACE_COMPLETE', d
          assert d['targetMethod']['Name'].endswith('GetGoodsFrameNameByRank'), d
          assert len(d['fallbackRankTable']) == 4, d
          expected = {
              2: 'UI/Common_New_ABS/Border_Icon_Silver.png',
              3: 'UI/Common_New_ABS/Border_Icon_Gold.png',
              4: 'UI/Common_New_ABS/Border_Icon_Colour.png',
              5: 'UI/Common_New_ABS/Border_Icon_Colour.png',
          }
          for record in d['fallbackRankTable']:
              literals = [x['literal'] for x in record['literalCandidates']]
              assert expected[record['rank']] in literals, record
          print(json.dumps({
              'targetMethod': d['targetMethod'],
              'fallbackRankTable': d['fallbackRankTable'],
              'defaultSlot': d['defaultSlot'],
              'callerCount': d['callerCount'],
              'rankFrameContexts': d['rankFrameContexts'][:8],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Probe Equipment Rank 4 population and frame bundle
        run: |
          set +e
          python scripts/equipment-image-ssr-frame-asset-provenance.py
          PROBE_EXIT=$?
          set -e
          if [ "$PROBE_EXIT" -ne 0 ] && [ "$PROBE_EXIT" -ne 3 ]; then
            echo "Unexpected asset probe failure: $PROBE_EXIT" >&2
            exit "$PROBE_EXIT"
          fi
          test -s artifacts/equipment-ssr-frame-asset-provenance.v1.json

      - name: Resolve exact serialized SSR frame binding
        run: |
          python scripts/equipment-image-ssr-frame-asset-resolution.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/equipment-ssr-frame-asset-resolution.v2.json')
          d = json.loads(p.read_text())
          assert d['status'] == 'PASS_EQUIPMENT_SSR_FRAME_EXACT_ASSET', d
          assert d['semanticConclusion']['currentPublicEquipmentPopulation'] == 373, d
          assert d['semanticConclusion']['currentPublicEquipmentRankDistribution'] == {'4': 373}, d
          assert d['semanticConclusion']['rank4PresentationMeaning'] == 'SSR', d
          assert d['semanticConclusion']['rank4RuntimeFramePath'] == 'UI/Common_New_ABS/Border_Icon_Colour.png', d
          assert d['selectedBinding']['type'] == 'Sprite', d
          assert d['selectedBinding']['name'] == 'Border_Icon_Colour', d
          assert d['selectedBinding']['serializedContainerKey'] == 'assets/gameproject/runtimeassets/ui/common_new_abs/border_icon_colour.png', d
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY

      - name: Setup Bun for current owner validators
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Confirm changed-path owner and validator plan
        run: |
          mkdir -p artifacts
          node tools/project-check/cli/check.mjs --base origin/main --head HEAD --plan \
            | tee artifacts/equipment-ssr-frame-project-check-plan.v1.json

      - name: Compare Equipment asset validator with exact current main
        run: |
          git fetch origin main
          git worktree add --detach /tmp/equipment-ssr-frame-base origin/main
          (cd /tmp/equipment-ssr-frame-base && bun install --frozen-lockfile)

          set +e
          (cd /tmp/equipment-ssr-frame-base && npm run validate:equipment-image-final) \
            > artifacts/equipment-ssr-frame-base-validator.log 2>&1
          BASE_EXIT=$?
          npm run validate:equipment-image-final \
            > artifacts/equipment-ssr-frame-head-validator.log 2>&1
          HEAD_EXIT=$?
          set -e

          BASE_SHA="$(git rev-parse origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"
          CHANGED_PATHS="$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)"
          export BASE_EXIT HEAD_EXIT BASE_SHA HEAD_SHA CHANGED_PATHS

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          base_log = Path('artifacts/equipment-ssr-frame-base-validator.log').read_text(errors='replace')
          head_log = Path('artifacts/equipment-ssr-frame-head-validator.log').read_text(errors='replace')
          base_exit = int(os.environ['BASE_EXIT'])
          head_exit = int(os.environ['HEAD_EXIT'])

          def signature(text):
              lines = []
              for line in text.splitlines():
                  line = re.sub(r'^.*?Error:\s*', 'Error: ', line).strip()
                  if '[EQUIPMENT_IMAGE_FINAL_INVALID]' in line:
                      lines.append(line)
              return lines[-1] if lines else None

          base_sig = signature(base_log)
          head_sig = signature(head_log)
          changed = [x for x in os.environ.get('CHANGED_PATHS', '').splitlines() if x]

          if base_exit == 0 and head_exit == 0:
              classification = 'PASS'
              blocker = False
          elif base_exit != 0 and head_exit != 0 and base_sig and base_sig == head_sig:
              classification = 'EXISTING_DRIFT_REVIEW'
              blocker = False
          elif base_exit == 0 and head_exit != 0:
              classification = 'REGRESSION_BLOCKER'
              blocker = True
          else:
              classification = 'UNCLASSIFIED_BLOCKER'
              blocker = True

          report = {
              'schemaId': 'equipment-ssr-frame-validator-classification/v1',
              'classification': classification,
              'blocker': blocker,
              'base': {
                  'ref': 'origin/main',
                  'sha': os.environ['BASE_SHA'],
                  'exitCode': base_exit,
                  'signature': base_sig,
              },
              'head': {
                  'sha': os.environ['HEAD_SHA'],
                  'exitCode': head_exit,
                  'signature': head_sig,
              },
              'changedPaths': changed,
              'scopeBoundary': {
                  'frozenEquipmentAssetsChanged': False,
                  'canonicalEquipmentChanged': False,
                  'researchOnly': all(
                      p.startswith('scripts/equipment-image-ssr-frame-')
                      or p.startswith('.github/workflows/equipment-image-ssr-frame-')
                      for p in changed
                  ),
              },
          }
          Path('artifacts/equipment-ssr-frame-validator-classification.v1.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if blocker:
              raise SystemExit(1)
          PY

      - name: Run routed production build validator
        run: npm run build

      - name: Require research validation to leave tracked tree clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short
            echo 'Tracked repository mutation detected after validation.' >&2
            exit 1
          fi

      - name: Upload focused provenance and validator classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-ssr-frame-provenance-v2
          path: |
            artifacts/equipment-ssr-frame-apk-inputs.v2.json
            artifacts/equipment-ssr-frame-provenance-v2.json
            artifacts/equipment-ssr-frame-asset-provenance.v1.json
            artifacts/equipment-ssr-frame-asset-resolution.v2.json
            artifacts/equipment-ssr-frame-previews/*.png
            artifacts/equipment-ssr-frame-project-check-plan.v1.json
            artifacts/equipment-ssr-frame-validator-classification.v1.json
            artifacts/equipment-ssr-frame-base-validator.log
            artifacts/equipment-ssr-frame-head-validator.log
          if-no-files-found: warn
          retention-days: 7
