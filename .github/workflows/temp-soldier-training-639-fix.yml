name: Temporary Soldier Training 639-640 Fix

on:
  push:
    branches:
      - fix/soldier-training-tech-639-localization-prerender

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[tech639-640-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/soldier-training-tech-639-localization-prerender
          fetch-depth: 0
      - name: Apply exact-ID corrections and validator hardening
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const paths = {
            c: 'data/presentation/soldier-training-tech-name-kr.v1.json',
            d: 'data/presentation/soldier-training-tech-common-passive-template-kr.v1.json',
            e: 'data/presentation/soldier-training-localization-frozen.v1.json',
            checkpoint: 'data/validation/soldier-training-localization-presentation.v1.json',
            validator: 'scripts/validate-soldier-training-localization-presentation.mjs',
          };
          const readJson = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, value) => fs.writeFileSync(p, JSON.stringify(value) + '\n');
          const blobSha = (text) => crypto.createHash('sha1')
            .update(Buffer.from(`blob ${Buffer.byteLength(text, 'utf8')}\0`, 'utf8'))
            .update(text, 'utf8').digest('hex');
          const fileBlobSha = (p) => blobSha(fs.readFileSync(p, 'utf8'));

          const c = readJson(paths.c);
          const c639 = c.records.find((r) => r.techId === 639);
          const c640 = c.records.find((r) => r.techId === 640);
          if (!c639 || c639.nameCn !== '法力爆裂' || c639.displayNameKr !== '마력 폭발' || c639.status !== 'provisional-display') {
            throw new Error(`Unexpected Stage C Tech 639 baseline: ${JSON.stringify(c639)}`);
          }
          if (!c640 || c640.nameCn !== '自我催眠' || c640.displayNameKr !== '자기 최면' || c640.status !== 'provisional-display') {
            throw new Error(`Unexpected Stage C Tech 640 baseline: ${JSON.stringify(c640)}`);
          }
          Object.assign(c639, { nameCn: '聚精会神', displayNameKr: '정신집중', status: 'project-display-confirmed' });
          Object.assign(c640, { nameCn: '祛除不纯', displayNameKr: '불순정화', status: 'project-display-confirmed' });
          Object.assign(c.coverage, {
            projectDisplayConfirmedRecordCount: 87,
            provisionalDisplayRecordCount: 43,
            projectDisplayConfirmedUniqueLabelCount: 32,
            provisionalDisplayUniqueLabelCount: 28,
          });
          c.confirmedLabelEvidence.count = 32;
          for (const label of ['정신집중', '불순정화']) {
            if (!c.confirmedLabelEvidence.labels.includes(label)) c.confirmedLabelEvidence.labels.push(label);
          }
          c.provisionalLabels.labels = c.provisionalLabels.labels.filter((x) => !['마력 폭발', '자기 최면'].includes(x));
          c.provisionalLabels.count = c.provisionalLabels.labels.length;
          const provisionalReview = c.reviews.find((r) => r.code === 'PROVISIONAL_TRAINING_TECH_DISPLAY_NAMES');
          if (provisionalReview) {
            provisionalReview.recordCount = 43;
            provisionalReview.uniqueLabelCount = 28;
          }
          c.corrections = [...(c.corrections ?? []).filter((x) => ![639, 640].includes(x.techId)),
            {
              techId: 639,
              type: 'authoritative-source-name-and-korean-display-correction',
              from: { nameCn: '法力爆裂', displayNameKr: '마력 폭발', status: 'provisional-display' },
              to: { nameCn: '聚精会神', displayNameKr: '정신집중', status: 'project-display-confirmed' },
              basis: {
                identity: 'Stage 1 frozen TrainingTech locator exact techId 639 has raw.Name 聚精会神',
                localization: 'Pinned legacy Korean Training Hall source directly labels the matching mage HP-threshold damage effect 정신집중',
                semanticMutation: false,
              },
            },
            {
              techId: 640,
              type: 'authoritative-source-name-and-korean-display-correction',
              from: { nameCn: '自我催眠', displayNameKr: '자기 최면', status: 'provisional-display' },
              to: { nameCn: '祛除不纯', displayNameKr: '불순정화', status: 'project-display-confirmed' },
              basis: {
                identity: 'Stage 1 frozen TrainingTech locator exact techId 640 has raw.Name 祛除不纯',
                localization: 'Pinned legacy Korean Training Hall source directly labels the matching monk mixed-unit combat effect 불순정화',
                semanticMutation: false,
              },
            },
          ];
          writeJson(paths.c, c);
          const cSha = fileBlobSha(paths.c);

          const d = readJson(paths.d);
          if (d.predecessor.gitBlobSha !== 'd606564c1df6539d649cde7cc30cdd5134be5398') {
            throw new Error(`Unexpected Stage D predecessor: ${d.predecessor.gitBlobSha}`);
          }
          d.predecessor.gitBlobSha = cSha;
          const d639 = d.records.find((r) => r.techId === 639);
          const d640 = d.records.find((r) => r.techId === 640);
          if (!d639 || d639.displayNameKr !== '마력 폭발' || d639.stageCNameStatus !== 'provisional-display') {
            throw new Error(`Unexpected Stage D Tech 639 baseline: ${JSON.stringify(d639)}`);
          }
          if (!d640 || d640.displayNameKr !== '자기 최면' || d640.stageCNameStatus !== 'provisional-display') {
            throw new Error(`Unexpected Stage D Tech 640 baseline: ${JSON.stringify(d640)}`);
          }
          d639.displayNameKr = '정신집중';
          d639.stageCNameStatus = 'project-display-confirmed';
          d640.displayNameKr = '불순정화';
          d640.stageCNameStatus = 'project-display-confirmed';
          d.coverage.stageCProjectDisplayConfirmedNameCount = 21;
          d.coverage.stageCProvisionalDisplayNameCount = 25;
          writeJson(paths.d, d);
          const dSha = fileBlobSha(paths.d);

          const e = readJson(paths.e);
          e.presentationSources.techNames.gitBlobSha = cSha;
          e.presentationSources.passiveTemplates.gitBlobSha = dSha;
          e.semanticAuthorities.trainingTechLocator = {
            path: 'data/generated/soldier-training-tech-classification-stage1-census.v1.json',
            gitBlobSha: '182e87f68af45a755b48a8d36a0415088ded9f3d',
            schemaId: 'soldier-training-tech-classification-stage1-census/v1',
            status: 'PASS',
            projection: 'LOSSLESS_PARSED_RECORD',
          };
          e.admissionPolicy.sourceNameParityByExactTechId = true;
          e.coverage.techProjectDisplayConfirmedCount = 87;
          e.coverage.techProvisionalDisplayCount = 43;
          const eProv = e.reviews.find((r) => r.code === 'PROVISIONAL_TRAINING_TECH_DISPLAY_NAMES');
          if (eProv) {
            eProv.count = 43;
            eProv.note = 'C carries 43 provisional-display records. E preserves that status exactly and does not promote them.';
          }
          e.reopenConditions = e.reopenConditions.map((x) =>
            x.startsWith('B/C/D exact-ID parity')
              ? 'B/C/D exact-ID parity, C-to-Stage1 source-name parity, D-to-C display parity, parameterSequenceId parity, or placeholder wrapper parity fails.'
              : x
          );
          writeJson(paths.e, e);
          const eSha = fileBlobSha(paths.e);

          const checkpoint = readJson(paths.checkpoint);
          checkpoint.consumer.gitBlobSha = eSha;
          checkpoint.method.techSourceNameParity = 'Stage C nameCn must equal Stage 1 frozen locator raw.Name by exact techId';
          checkpoint.expected = {
            materialRecordCount: 24,
            materialAuthorityRecordCount: 24,
            materialProjectDisplayConfirmedCount: 24,
            materialIdSetMatch: true,
            materialSourceNameMismatchCount: 0,
            techRecordCount: 130,
            commonStatTechCount: 84,
            commonPassiveTechCount: 46,
            visibleTechCount: 130,
            techIdSetMatch: true,
            techKindMismatchCount: 0,
            techSourceNameMismatchCount: 0,
            techProjectDisplayConfirmedCount: 87,
            techProvisionalDisplayCount: 43,
            passiveTemplateRecordCount: 46,
            passiveTemplateIdSetMatch: true,
            passiveDisplayNameMismatchCount: 0,
            passiveNameStatusMismatchCount: 0,
            passiveParameterSequenceMismatchCount: 0,
            passiveParameterSequenceCount: 14,
            placeholderParityFailureCount: 0,
            numericLiteralLeakCount: 0,
            blankPresentationValueCount: 0,
            duplicateIdCount: 0,
            pinnedSourceBlobMismatchCount: 0,
            consumerForbiddenSemanticPayloadKeyCount: 0,
          };
          const cpProv = checkpoint.reviews.find((r) => r.code === 'PROVISIONAL_TRAINING_TECH_DISPLAY_NAMES');
          if (cpProv) {
            cpProv.count = 43;
            cpProv.note = 'The 43 provisional C records remain provisional through E; this does not block frontend presentation use.';
          }
          checkpoint.reopenConditions = checkpoint.reopenConditions.map((x) =>
            x.startsWith('Exact-ID, kind, D-to-C display')
              ? 'Exact-ID, kind, C-to-Stage1 source-name, D-to-C display, parameterSequenceId, placeholder, or pinned-source parity validation fails.'
              : x
          );
          writeJson(paths.checkpoint, checkpoint);

          let v = fs.readFileSync(paths.validator, 'utf8');
          const replaceOnce = (needle, replacement, label) => {
            const count = v.split(needle).length - 1;
            if (count !== 1) throw new Error(`Validator patch ${label} expected 1 occurrence, got ${count}`);
            v = v.replace(needle, replacement);
          };
          replaceOnce(
            "  passive: 'data/generated/soldier-training-tech-common-passive-effect-extraction.v1.json',\n};",
            "  passive: 'data/generated/soldier-training-tech-common-passive-effect-extraction.v1.json',\n  stage1: 'data/generated/soldier-training-tech-classification-stage1-census.v1.json',\n};",
            'stage1-path'
          );
          replaceOnce(
            "    material: JSON.parse(raw.material), stat: JSON.parse(raw.stat), passive: JSON.parse(raw.passive),\n",
            "    material: JSON.parse(raw.material), stat: JSON.parse(raw.stat), passive: JSON.parse(raw.passive), stage1: JSON.parse(raw.stage1),\n",
            'stage1-load'
          );
          replaceOnce(
            "  const pr = Array.isArray(x.passive.records) ? x.passive.records : [];\n",
            "  const pr = Array.isArray(x.passive.records) ? x.passive.records : [];\n  const sr = Array.isArray(x.stage1.records) ? x.stage1.records : [];\n",
            'stage1-records'
          );
          replaceOnce(
            "    di = index(dr, 'techId'), pi = index(pr, 'techId');\n",
            "    di = index(dr, 'techId'), pi = index(pr, 'techId'), si = index(sr, 'id');\n",
            'stage1-index'
          );
          replaceOnce(
            "  const kindMismatch = techIds.filter((id) => ci.map.get(id)?.kind !==\n    (statIds.includes(id) ? 'COMMON_STAT' : passiveIds.includes(id) ? 'COMMON_PASSIVE' : null));\n",
            "  const kindMismatch = techIds.filter((id) => ci.map.get(id)?.kind !==\n    (statIds.includes(id) ? 'COMMON_STAT' : passiveIds.includes(id) ? 'COMMON_PASSIVE' : null));\n  const techSourceNameMismatch = techIds.filter((id) => ci.map.get(id)?.nameCn !== si.map.get(id)?.raw?.Name);\n",
            'source-name-mismatch'
          );
          replaceOnce(
            "  const dup = bi.dup.length + mi.dup.length + ci.dup.length + di.dup.length + pi.dup.length;\n",
            "  const dup = bi.dup.length + mi.dup.length + ci.dup.length + di.dup.length + pi.dup.length + si.dup.length;\n",
            'stage1-duplicate'
          );
          replaceOnce(
            "    ['passive', x.consumer.semanticAuthorities?.commonPassive],\n  ];",
            "    ['passive', x.consumer.semanticAuthorities?.commonPassive],\n    ['stage1', x.consumer.semanticAuthorities?.trainingTechLocator],\n  ];",
            'stage1-pin'
          );
          replaceOnce(
            "  if (x.passive.status !== 'PASS' || x.passive.completion !== 'COMPLETE' || x.passive.freezeState !== 'TRAINING_TECH_COMMON_PASSIVE_EFFECT_EXTRACTION_FROZEN') e.push('PASSIVE_AUTHORITY_NOT_FROZEN');\n",
            "  if (x.passive.status !== 'PASS' || x.passive.completion !== 'COMPLETE' || x.passive.freezeState !== 'TRAINING_TECH_COMMON_PASSIVE_EFFECT_EXTRACTION_FROZEN') e.push('PASSIVE_AUTHORITY_NOT_FROZEN');\n  if (x.stage1.schemaId !== 'soldier-training-tech-classification-stage1-census/v1' || x.stage1.status !== 'PASS' || x.stage1.population?.trainingTech !== 287) e.push('STAGE1_LOCATOR_NOT_ADMITTED');\n",
            'stage1-contract'
          );
          replaceOnce(
            "  if (kindMismatch.length) e.push(`TECH_KIND_MISMATCH:${kindMismatch.join(',')}`);\n",
            "  if (kindMismatch.length) e.push(`TECH_KIND_MISMATCH:${kindMismatch.join(',')}`);\n  if (techSourceNameMismatch.length) e.push(`TECH_CN_NAME_MISMATCH:${techSourceNameMismatch.join(',')}`);\n",
            'source-name-error'
          );
          replaceOnce(
            "  if (cr.length !== 130 || cConfirmed !== 85 || cProvisional !== 45) e.push('C_COVERAGE_MISMATCH');\n",
            "  if (cr.length !== 130 || cConfirmed !== 87 || cProvisional !== 43) e.push('C_COVERAGE_MISMATCH');\n",
            'coverage-counts'
          );
          replaceOnce(
            "    commonStatTechCount:84, commonPassiveTechCount:46, techProjectDisplayConfirmedCount:85,\n    techProvisionalDisplayCount:45, passiveTemplateRecordCount:46, passiveParameterSequenceCount:14,\n",
            "    commonStatTechCount:84, commonPassiveTechCount:46, techProjectDisplayConfirmedCount:87,\n    techProvisionalDisplayCount:43, passiveTemplateRecordCount:46, passiveParameterSequenceCount:14,\n",
            'consumer-coverage'
          );
          replaceOnce(
            "      p.exactNumericIdEqualityOnly !== true || p.nameJoin !== false || p.idArithmetic !== false ||\n",
            "      p.exactNumericIdEqualityOnly !== true || p.sourceNameParityByExactTechId !== true || p.nameJoin !== false || p.idArithmetic !== false ||\n",
            'policy-source-name'
          );
          replaceOnce(
            "    techIdSetMatch:same(techIds, visibleIds), techKindMismatchCount:kindMismatch.length,\n    techProjectDisplayConfirmedCount:cConfirmed, techProvisionalDisplayCount:cProvisional,\n",
            "    techIdSetMatch:same(techIds, visibleIds), techKindMismatchCount:kindMismatch.length, techSourceNameMismatchCount:techSourceNameMismatch.length,\n    techProjectDisplayConfirmedCount:cConfirmed, techProvisionalDisplayCount:cProvisional,\n",
            'summary-source-name'
          );
          replaceOnce(
            "      m.materialJoinKey !== 'itemId' || m.techJoinKey !== 'techId' || m.exactNumericIdEqualityOnly !== true ||\n",
            "      m.materialJoinKey !== 'itemId' || m.techJoinKey !== 'techId' || m.techSourceNameParity !== 'Stage C nameCn must equal Stage 1 frozen locator raw.Name by exact techId' || m.exactNumericIdEqualityOnly !== true ||\n",
            'checkpoint-method'
          );
          replaceOnce(
            "  t('tech-kind-drift-fails-closed', x => x.c.records.find(r => r.kind === 'COMMON_STAT').kind='COMMON_PASSIVE', 'TECH_KIND_MISMATCH');\n",
            "  t('tech-kind-drift-fails-closed', x => x.c.records.find(r => r.kind === 'COMMON_STAT').kind='COMMON_PASSIVE', 'TECH_KIND_MISMATCH');\n  t('tech-source-name-drift-fails-closed', x => x.c.records[0].nameCn += 'x', 'TECH_CN_NAME_MISMATCH');\n",
            'source-name-self-test'
          );
          fs.writeFileSync(paths.validator, v);

          console.log(JSON.stringify({ cSha, dSha, eSha, tech639: c639, tech640: c640, d639, d640 }, null, 2));
          NODE

          node scripts/validate-soldier-training-localization-presentation.mjs
          node scripts/validate-soldier-training-localization-presentation.mjs --self-test
          rm .github/workflows/temp-soldier-training-639-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/presentation/soldier-training-tech-name-kr.v1.json \
                  data/presentation/soldier-training-tech-common-passive-template-kr.v1.json \
                  data/presentation/soldier-training-localization-frozen.v1.json \
                  data/validation/soldier-training-localization-presentation.v1.json \
                  scripts/validate-soldier-training-localization-presentation.mjs \
                  .github/workflows/temp-soldier-training-639-fix.yml
          git commit -m "Correct Soldier Training Tech 639-640 localization [tech639-640-applied]"
          git push origin HEAD:fix/soldier-training-tech-639-localization-prerender
