name: Equipment Stage 4-5 Display State Policy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/equipment-stage4-5-display-state-policy.yml'
      - 'scripts/validate-equipment-stage4-5-display-state-policy.mjs'
      - 'data/contracts/equipment-stage4-5-display-state-policy.v1.json'
      - 'src/routes/equipment.tsx'
      - 'src/routes/equipment_.exclusive.tsx'
      - 'src/routes/equipment_.$equipmentId.tsx'
      - 'data/contracts/equipment-stage4-0-frontend-consumer-contract.v1.json'
      - 'data/generated/equipment_stage3_3_general_list.json'
      - 'data/generated/equipment_stage3_5_exclusive_consumer.json'
      - 'data/validation/equipment-stage4-2-general-list-ui-summary.v1.json'
      - 'data/validation/equipment-stage4-3-general-detail-ui-summary.v1.json'
      - 'data/validation/equipment-stage4-4-exclusive-ui-ownership-summary.v1.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Equipment Stage 4-5 display/state policy
        run: node scripts/validate-equipment-stage4-5-display-state-policy.mjs
      - name: Persist Stage 4-5 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/equipment-stage4-5-display-state-policy-summary.v1.json
          if git diff --cached --quiet; then
            echo "No Stage 4-5 generated changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 4-5 display state policy checkpoint"
          git push
