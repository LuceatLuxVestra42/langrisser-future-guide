name: Hero Awakening Materials Freeze

on:
  push:
    branches:
      - 'feat/hero-awakening-materials-*'

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build from pinned ConfigData source-pack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/build_hero_awakening_materials.cjs
          node scripts/validate_hero_awakening_materials.cjs

      - name: Reject unrelated generated mutation
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(data/generated/hero-awakening-materials\.v1\.json|data/validation/hero-awakening-materials-summary\.v1\.json)$'
          unexpected="$(git status --porcelain=v1 | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected mutation:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check

      - name: Commit frozen artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add data/generated/hero-awakening-materials.v1.json data/validation/hero-awakening-materials-summary.v1.json
          if git diff --cached --quiet; then
            echo 'Frozen artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze hero awakening materials artifact'
          git push origin HEAD:${GITHUB_REF_NAME}
