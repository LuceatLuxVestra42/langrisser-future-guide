name: Hero Awakening Icon Source Snapshot Gap

on:
  push:
    branches:
      - work/awakening-skill-icon-a6-7-source-gap-20260910
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-source-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/awakening-skill-icon-a6-7-source-gap-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: pip install UnityPy==1.25.3 Pillow
      - name: Exhaustively scan every bundle for the three A6-6 review paths
        run: python scripts/freeze-hero-awakening-icon-source-snapshot-gap.py --write
      - name: Commit frozen gap classification when changed
        shell: bash
        run: |
          set -euo pipefail
          git add data/generated/hero-awakening-icon-source-snapshot-gap.v1.json
          if git diff --cached --quiet; then
            echo 'Frozen source gap already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Freeze awakening icon source snapshot gaps'
          git push origin HEAD:work/awakening-skill-icon-a6-7-source-gap-20260910
