name: Hero Awakening Icon Source Snapshot Gap

on:
  push:
    branches:
      - work/awakening-skill-icon-a6-7-source-gap-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: pip install UnityPy==1.25.3 Pillow
      - name: Exhaustively scan assigned package shard
        run: >-
          python scripts/freeze-hero-awakening-icon-source-snapshot-gap.py
          --shard-index ${{ matrix.shard }}
          --shard-count 8
          --shard-output gap-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: a6-7-gap-shard-${{ matrix.shard }}
          path: gap-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/awakening-skill-icon-a6-7-source-gap-20260910
      - uses: actions/download-artifact@v4
        with:
          pattern: a6-7-gap-shard-*
          path: gap-shards
          merge-multiple: true
      - name: Aggregate exhaustive coverage and freeze classification
        run: python scripts/freeze-hero-awakening-icon-source-snapshot-gap.py --merge-dir gap-shards --write
      - name: Commit frozen gap classification when changed
        shell: bash
        run: |
          set -euo pipefail
          git add data/generated/hero-awakening-icon-source-snapshot-gap.v1.json
          if git diff --cached --quiet; then
            echo 'Frozen source gap already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Freeze awakening icon source snapshot gaps'
          git push origin HEAD:work/awakening-skill-icon-a6-7-source-gap-20260910
