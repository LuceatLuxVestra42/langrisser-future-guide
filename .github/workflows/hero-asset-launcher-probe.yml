name: Hero Asset Launcher Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hero-asset-launcher-probe.yml'
      - 'scripts/probe-hero-launcher.ps1'
  push:
    branches:
      - work/hero-asset-launcher-probe
    paths:
      - '.github/workflows/hero-asset-launcher-probe.yml'
      - 'scripts/probe-hero-launcher.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe script
        uses: actions/checkout@v4

      - name: Probe official launcher without executing it
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/probe-hero-launcher.ps1

      - name: Upload static probe report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-asset-launcher-probe-report
          path: ${{ runner.temp }}/langrisser-launcher-probe-v2/report
          if-no-files-found: error
          retention-days: 3
