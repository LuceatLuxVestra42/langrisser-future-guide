name: Skin Stage 2-5 Final

on:
  push:
    paths:
      - '.github/workflows/skin-stage2-5-final.yml'
      - 'scripts/validate-skin-stage2-5-final.py'
      - 'data/contracts/skin-stage2-5-consumer-contract.v1.json'
      - 'data/validation/skin-stage2-0-input-summary.v1.json'
      - 'data/validation/skin-stage2-1-final.v1.json'
      - 'data/validation/skin-stage2-2-final.v1.json'
      - 'data/generated/skin-stage2-3-bidirectional-relation.v1.json'
      - 'data/validation/skin-stage2-3-final.v1.json'
      - 'data/validation/skin-stage2-4-final.v1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Skin Stage 2-5 final gate
        run: python scripts/validate-skin-stage2-5-final.py
      - name: Commit final Stage 2 gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/skin-stage2-5-final.v1.json
          if git diff --cached --quiet; then
            echo "No validation changes"
          else
            git commit -m "Complete Skin Stage 2 final gate"
            git push
          fi
