name: Skin Fullart Hosted Browser QA Maintenance

on:
  push:
    branches:
      - fix/skin-fullart-hosted-browser-qa

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/skin-fullart-hosted-browser-qa
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Patch stale Skin hosted expectations only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-authoritative-pages-hosted.mjs')
          s=p.read_text(encoding='utf-8')

          old='''const relation = JSON.parse(fs.readFileSync("data/generated/skin-stage2-3-bidirectional-relation.v1.json", "utf8"));\nconst equipmentPublicAdmission = JSON.parse(fs.readFileSync("data/presentation/equipment-public-admission-correction.v1.json", "utf8"));'''
          new='''const relation = JSON.parse(fs.readFileSync("data/generated/skin-stage2-3-bidirectional-relation.v1.json", "utf8"));\nconst fullartManifest = JSON.parse(fs.readFileSync("data/generated/skin-fullart-reference.v1.json", "utf8"));\nconst equipmentPublicAdmission = JSON.parse(fs.readFileSync("data/presentation/equipment-public-admission-correction.v1.json", "utf8"));'''
          if s.count(old)!=1: raise RuntimeError(f'authority-read anchor drift: {s.count(old)}')
          s=s.replace(old,new)

          old='''const heroRows = Object.entries(relation.byHeroId ?? {})\n  .map(([heroId, skinIds]) => ({ heroId: Number(heroId), skinIds: Array.isArray(skinIds) ? skinIds.map(Number) : [] }))\n  .sort((a, b) => b.skinIds.length - a.skinIds.length || a.heroId - b.heroId);\nconst skinHero = heroRows[0];\ncheck(skinHero?.skinIds?.length >= 2, "no multi-Skin representative Hero");\nconst firstSkinId = skinHero.skinIds[0];\nconst secondSkinId = skinHero.skinIds[1];\nawait fetchWithRetry(`images/skins/${firstSkinId}.png`);\nawait fetchWithRetry(`images/skins/${secondSkinId}.png`);\n\nconst hero6SkinIds = Array.isArray(relation.byHeroId?.["6"]) ? relation.byHeroId["6"].map(Number) : [];\ncheck(hero6SkinIds.length === 6, `Hero 6 frozen Skin count mismatch: ${hero6SkinIds.length}`);\nconst hero6VisualCount = hero6SkinIds.length + 1;'''
          new='''const hero6SkinIds = Array.isArray(relation.byHeroId?.["6"]) ? relation.byHeroId["6"].map(Number) : [];\ncheck(hero6SkinIds.length === 6, `Hero 6 frozen Skin count mismatch: ${hero6SkinIds.length}`);\nconst fullartRecords = Array.isArray(fullartManifest?.records) ? [...fullartManifest.records].sort((a, b) => a.sourceOrder - b.sourceOrder) : [];\nconst hero6FullartIds = fullartRecords.filter((record) => record.heroId === 6).map((record) => Number(record.skinId));\ncheck(JSON.stringify(hero6FullartIds) === JSON.stringify(hero6SkinIds), `Hero 6 fullart admission mismatch: ${JSON.stringify(hero6FullartIds)}`);\nfor (const skinId of hero6FullartIds) await fetchWithRetry(`images/skin-fullart/${skinId}.webp`);\nconst hero6VisualCount = hero6FullartIds.length + 1;'''
          if s.count(old)!=1: raise RuntimeError(f'legacy representative block drift: {s.count(old)}')
          s=s.replace(old,new)

          start='''  let response = await page.goto(url(`heroes/${skinHero.heroId}/`), { waitUntil: "networkidle", timeout: 45000 });'''
          end='''  response = await page.goto(url("heroes/6/"), { waitUntil: "networkidle", timeout: 45000 });'''
          if s.count(start)!=1 or s.count(end)!=1: raise RuntimeError(f'legacy browser block anchors drift: start={s.count(start)} end={s.count(end)}')
          a=s.index(start)
          b=s.index(end)
          s=s[:a] + '''  let response = await page.goto(url("heroes/6/"), { waitUntil: "networkidle", timeout: 45000 });\n''' + s[b+len(end):]

          old='''  const hero6Next = page.getByRole("button", { name: "다음 일러스트" });\n  check(await hero6Next.count() === 1, "Hero 6 next artwork control missing or duplicated");\n  await hero6Next.click();\n  await page.waitForTimeout(100);\n  await page.getByText(`스킨 1 · ID ${hero6SkinIds[0]}`, { exact: true }).waitFor();\n  const hero6FirstSkinImage = page.locator(`img[src*="/images/skins/${hero6SkinIds[0]}.png"]`);\n  check(await hero6FirstSkinImage.count() === 1, "Hero 6 first Skin did not follow representative artwork");'''
          new='''  const hero6Next = page.getByRole("button", { name: "다음 일러스트" });\n  const hero6Prev = page.getByRole("button", { name: "이전 일러스트" });\n  check(await hero6Next.count() === 1 && await hero6Prev.count() === 1, "Hero 6 artwork controls missing or duplicated");\n  for (let index = 0; index < hero6FullartIds.length; index += 1) {\n    const skinId = hero6FullartIds[index];\n    await hero6Next.click();\n    await page.waitForTimeout(100);\n    await page.getByText(`스킨 ${index + 1} · ID ${skinId}`, { exact: true }).waitFor();\n    const image = page.locator(`img[src*="/images/skin-fullart/${skinId}.webp"]`);\n    check(await image.count() === 1, `Hero 6 fullart Skin ${skinId} image missing or duplicated`);\n    const imageState = await image.evaluate((node) => ({ complete: node.complete, naturalWidth: node.naturalWidth, naturalHeight: node.naturalHeight, objectFit: getComputedStyle(node).objectFit }));\n    check(imageState.complete && imageState.naturalWidth > 0 && imageState.naturalHeight > 0, `Hero 6 fullart Skin ${skinId} image did not load`);\n    check(imageState.objectFit === "contain", `Hero 6 fullart Skin ${skinId} object-fit=${imageState.objectFit}`);\n    check(await page.locator(`img[src*="/images/skins/${skinId}.png"]`).count() === 0, `Hero 6 reintroduced legacy static Skin ${skinId}`);\n  }\n  await hero6Next.click();\n  await page.waitForTimeout(100);\n  await page.getByText("대표 일러스트", { exact: true }).waitFor();\n  await page.getByText(`1 / ${hero6VisualCount}`, { exact: true }).waitFor();\n  check((await page.locator('img[alt="레온 대표 일러스트"]').getAttribute("src"))?.includes("/images/heroes/cards/6.png"), "Hero 6 carousel did not wrap back to representative artwork");'''
          if s.count(old)!=1: raise RuntimeError(f'Hero6 old first-skin block drift: {s.count(old)}')
          s=s.replace(old,new)

          old='''    const mobileHeroArtwork = mobilePage.locator('img[alt="레온 대표 일러스트"]');\n    check(await mobileHeroArtwork.count() === 1, "Hero 6 mobile representative artwork missing or duplicated");\n    check((await mobileHeroArtwork.getAttribute("src"))?.includes("/images/heroes/cards/6.png"), "Hero 6 mobile representative artwork source mismatch");'''
          new='''    const mobileHeroArtwork = mobilePage.locator('img[alt="레온 대표 일러스트"]');\n    check(await mobileHeroArtwork.count() === 1, "Hero 6 mobile representative artwork missing or duplicated");\n    check((await mobileHeroArtwork.getAttribute("src"))?.includes("/images/heroes/cards/6.png"), "Hero 6 mobile representative artwork source mismatch");\n    const mobileNext = mobilePage.getByRole("button", { name: "다음 일러스트" });\n    await mobileNext.click();\n    await mobilePage.waitForTimeout(100);\n    await mobilePage.getByText(`스킨 1 · ID ${hero6FullartIds[0]}`, { exact: true }).waitFor();\n    const mobileFullart = mobilePage.locator(`img[src*="/images/skin-fullart/${hero6FullartIds[0]}.webp"]`);\n    check(await mobileFullart.count() === 1, "Hero 6 mobile first fullart Skin missing or duplicated");\n    const mobileFullartState = await mobileFullart.evaluate((node) => ({ complete: node.complete, naturalWidth: node.naturalWidth, naturalHeight: node.naturalHeight, objectFit: getComputedStyle(node).objectFit }));\n    check(mobileFullartState.complete && mobileFullartState.naturalWidth > 0 && mobileFullartState.naturalHeight > 0, "Hero 6 mobile first fullart Skin did not load");\n    check(mobileFullartState.objectFit === "contain", `Hero 6 mobile fullart object-fit=${mobileFullartState.objectFit}`);'''
          if s.count(old)!=1: raise RuntimeError(f'mobile art block drift: {s.count(old)}')
          s=s.replace(old,new)

          old='''    skinRepresentative: { heroId: skinHero.heroId, firstSkinId, secondSkinId },'''
          new='''    skinFullart: { heroId: 6, skinIds: hero6FullartIds, cycle: "BASE_TO_6_SKINS_TO_BASE_PASS", legacyStaticHeroDetailConsumption: false },'''
          if s.count(old)!=1: raise RuntimeError(f'output skinRepresentative drift: {s.count(old)}')
          s=s.replace(old,new)

          p.write_text(s,encoding='utf-8')
          PY
          node --check scripts/validate-authoritative-pages-hosted.mjs
          git diff --check
          git diff -- scripts/validate-authoritative-pages-hosted.mjs

      - name: Install hosted QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run current hosted validators against deployed main
        shell: bash
        env:
          HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="$(node -e 'fetch(process.env.HOSTED_BASE_URL+"authoritative-pages-source.json?qa="+Date.now()).then(r=>r.json()).then(j=>process.stdout.write(j.sourceSha))')"
          export EXPECTED_SOURCE_SHA
          echo "deployedSource=${EXPECTED_SOURCE_SHA}"
          node scripts/validate-authoritative-pages-hosted.mjs
          node scripts/validate-hero-central-discipline-hosted.mjs
          node scripts/validate-hero-soldier-cards-hosted.mjs
          node scripts/validate-hero-card-icons-hosted.mjs

      - name: Commit validated hosted QA maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-authoritative-pages-hosted.mjs
          git diff --cached --check
          git commit -m 'Align authoritative hosted QA with Skin fullart carousel'
          git push origin HEAD:fix/skin-fullart-hosted-browser-qa
