name: Temporary SP Cmd getter xref probe
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract IL2CPP pair, dump metadata, and xref SP Cmd getters
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/spx out/sp-cmd-getter-xref
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib
          D=pathlib.Path('/tmp/spx'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def es(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in es(u,hs(u)) if e[0]==target); (D/out).write_bytes(get(u,e))
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release >/dev/null 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/spx/dump
          dotnet "$DLL" /tmp/spx/GameAssembly.dll /tmp/spx/global-metadata.dat /tmp/spx/dump >/dev/null 2>&1 || true
          python <<'PY'
          import bisect,json,pathlib,re,struct
          root=pathlib.Path('/tmp/spx'); out=pathlib.Path('out/sp-cmd-getter-xref')
          script=json.loads((root/'dump/script.json').read_text())
          methods=script.get('ScriptMethod',script.get('Methods',[]))
          if not methods:
            # Il2CppDumper script.json is usually a dict with ScriptMethod
            for v in script.values():
              if isinstance(v,list) and v and isinstance(v[0],dict) and 'Address' in v[0] and 'Name' in v[0]: methods=v; break
          method_rows=sorted([(int(m['Address']),m.get('Name',''),m.get('Signature','')) for m in methods if isinstance(m,dict) and isinstance(m.get('Address'),int)],key=lambda x:x[0])
          wanted={}
          for addr,name,sig in method_rows:
            if 'ConfigDataSPHeroInfo$$get_' in name and any(x in name for x in ['HPCmd_INI','ATCmd_INI','DFCmd_INI','MagicDFCmd_INI']): wanted[name]=(addr,sig)
          data=(root/'GameAssembly.dll').read_bytes()
          # Parse PE sections and image base
          pe=struct.unpack_from('<I',data,0x3c)[0]; nsec=struct.unpack_from('<H',data,pe+6)[0]; optsz=struct.unpack_from('<H',data,pe+20)[0]; opt=pe+24; image_base=struct.unpack_from('<Q',data,opt+24)[0]; sec0=opt+optsz
          sections=[]
          for i in range(nsec):
            o=sec0+i*40; name=data[o:o+8].rstrip(b'\0').decode(errors='replace'); vs,va,rs,rp=struct.unpack_from('<IIII',data,o+8); sections.append((name,va,vs,rs,rp))
          xrefs={k:[] for k in wanted}
          addrs=[x[0] for x in method_rows]
          for sname,va,vs,rs,rp in sections:
            # executable section characteristic
            o=sec0+sections.index((sname,va,vs,rs,rp))*40; ch=struct.unpack_from('<I',data,o+36)[0]
            if not (ch & 0x20000000): continue
            blob=data[rp:rp+rs]
            for i,b in enumerate(blob[:-4]):
              if b!=0xE8: continue
              rel=struct.unpack_from('<i',blob,i+1)[0]; call_va=image_base+va+i; target=call_va+5+rel; target_rva=target-image_base
              for key,(want,sig) in wanted.items():
                if target_rva==want:
                  idx=bisect.bisect_right(addrs,call_va-image_base)-1
                  caller=method_rows[idx] if idx>=0 else (None,'','')
                  xrefs[key].append({'callRva':hex(call_va-image_base),'callVa':hex(call_va),'callerAddress':hex(caller[0]) if caller[0] is not None else None,'callerName':caller[1],'callerSignature':caller[2]})
          result={'status':'PASS','imageBase':hex(image_base),'spCmdGetters':{k:{'address':hex(v[0]),'signature':v[1]} for k,v in wanted.items()},'xrefs':xrefs,'blockers':[]}
          if len(wanted)<4: result['blockers'].append('SP_CMD_GETTER_SET_INCOMPLETE')
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sp-cmd-getter-xref
          path: out/sp-cmd-getter-xref
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-sp-cmd-getter-xref.yml
          git commit -m "Remove temporary SP Cmd getter xref probe"
          git push origin HEAD:${GITHUB_REF_NAME}
