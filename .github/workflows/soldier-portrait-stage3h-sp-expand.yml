name: Soldier Portrait Stage 3H SP Closeout

on:
  push:
    branches:
      - work/soldier-frontend-stage3-full-portraits
    paths:
      - 'scripts/expand-soldier-portraits-stage3h-sp.mjs'
      - '.github/workflows/soldier-portrait-stage3h-sp-expand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve all SP Soldier portraits from exact current-source evidence
        run: node scripts/expand-soldier-portraits-stage3h-sp.mjs

      - name: Validate Stage 3H SP closeout
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { createHash } = require('crypto');
          const manifest = require('./data/generated/soldier-portrait-manifest.v7.json');
          const evidence = require('./data/validation/soldier-portrait-stage3h-sp-evidence.v1.json');
          const sp = require('./data/configdata/ConfigDataSPSoldierInfo.json');
          const frontend = fs.readFileSync('src/lib/soldier-portrait-assets.ts', 'utf8');

          if (manifest.status !== 'PASS' || manifest.assetsReady !== true) throw new Error('Stage 3H manifest not ready');
          if (manifest.coverage.canonicalSoldierCount !== 224 || manifest.coverage.canonicalNormalCount !== 168 || manifest.coverage.canonicalSpCount !== 56) throw new Error('Canonical coverage mismatch');
          if (manifest.coverage.resolvedCount !== 224 || manifest.coverage.unresolvedCount !== 0) throw new Error('Stage 3H full coverage mismatch');
          if (manifest.coverage.resolvedNormalCount !== 168 || manifest.coverage.resolvedSpCount !== 56) throw new Error('Stage 3H normal/SP coverage mismatch');
          if (manifest.coverage.remainingNormalUnresolvedCount !== 0 || manifest.coverage.remainingSpUnresolvedCount !== 0 || manifest.coverage.newlyResolvedSpCount !== 56) throw new Error('Stage 3H unresolved/new count mismatch');
          if (manifest.records.length !== 224 || manifest.unresolved.length !== 0) throw new Error('Stage 3H record arrays mismatch');
          if (manifest.policy.spPortraitNormalReuse !== false || manifest.policy.spNormalImageFallbackUsed !== false || manifest.policy.spIdArithmeticUsedForAdmission !== false) throw new Error('Stage 3H safety policy mismatch');

          const spById = new Map(sp.map(r => [Number(r.ID), r]));
          const spIds = [...spById.keys()].sort((a,b) => a-b);
          if (spById.size !== 56) throw new Error(`Expected 56 unique SP IDs, got ${spById.size}`);
          if (manifest.newlyResolvedSoldierIds.join(',') !== spIds.join(',')) throw new Error('Stage 3H target set mismatch');

          const stage3hRecords = manifest.records.filter(r => spById.has(Number(r.soldierId)));
          if (stage3hRecords.length !== 56) throw new Error(`Expected 56 SP manifest records, got ${stage3hRecords.length}`);
          for (const r of stage3hRecords) {
            const relation = spById.get(Number(r.soldierId));
            if (r.isSp !== true) throw new Error(`SP flag missing ${r.soldierId}`);
            if (Number(r.normalSoldierId) !== Number(relation.NormalSoliderId)) throw new Error(`Explicit SP-normal relation mismatch ${r.soldierId}`);
            if (!String(r.sourceKind).includes('BWIKI_CURRENT_CN_EXACT_') || !String(r.sourceKind).endsWith('_STAGE3H_SP')) throw new Error(`Unexpected SP source kind ${r.soldierId} ${r.sourceKind}`);
            if (!r.bwikiFileTitle || !r.nameCn || !r.model || !r.modelStem) throw new Error(`Incomplete SP provenance ${r.soldierId}`);
            const expectedTitles = [`File:Q${r.nameCn}.png`, `File:士兵 ${r.nameCn}.png`];
            if (!expectedTitles.includes(r.bwikiFileTitle)) throw new Error(`Non-exact BWiki title ${r.soldierId}: ${r.bwikiFileTitle}`);
            const file = path.join('public/images/soldiers', r.fileName);
            if (!fs.existsSync(file)) throw new Error(`Missing SP portrait ${r.soldierId}`);
            const bytes = fs.readFileSync(file);
            if (bytes.length !== r.size) throw new Error(`SP portrait size mismatch ${r.soldierId}`);
            if (!(bytes[0]===0x89 && bytes[1]===0x50 && bytes[2]===0x4e && bytes[3]===0x47 && bytes[4]===0x0d && bytes[5]===0x0a && bytes[6]===0x1a && bytes[7]===0x0a)) throw new Error(`SP portrait not PNG ${r.soldierId}`);
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (digest !== r.sha256) throw new Error(`SP portrait SHA-256 mismatch ${r.soldierId}`);
            if (!Number.isInteger(r.width) || !Number.isInteger(r.height) || r.width <= 0 || r.height <= 0) throw new Error(`SP portrait dimensions invalid ${r.soldierId}`);
          }

          if (evidence.status !== 'PASS' || evidence.targetCount !== 56 || evidence.passCount !== 56 || evidence.rows.length !== 56) throw new Error('Stage 3H evidence count mismatch');
          if (evidence.normalPortraitReuseCount !== 0 || evidence.rows.some(r => r.status !== 'PASS' || r.normalPortraitReused !== false)) throw new Error('Stage 3H evidence safety mismatch');
          const evidenceIds = evidence.rows.map(r => Number(r.soldierId)).sort((a,b) => a-b);
          if (evidenceIds.join(',') !== spIds.join(',')) throw new Error('Stage 3H evidence target set mismatch');
          if (!frontend.includes('soldier-portrait-manifest.v7.json') || frontend.includes('soldier-portrait-manifest.v6.json')) throw new Error('Frontend portrait resolver is not on v7');

          console.log('STAGE3H_SP_CLOSEOUT_VALIDATED normal=168/168 sp=56/56 total=224/224');
          NODE

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build gate
        run: bun run build

      - name: Commit Stage 3H SP assets and checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/soldiers \
            data/generated/soldier-portrait-manifest.v7.json \
            data/validation/soldier-portrait-stage3h-sp-evidence.v1.json \
            data/checkpoints/soldier-frontend-stage3h-sp.txt \
            src/lib/soldier-portrait-assets.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Resolve all SP Soldier portraits'
          git push origin HEAD:work/soldier-frontend-stage3-full-portraits
