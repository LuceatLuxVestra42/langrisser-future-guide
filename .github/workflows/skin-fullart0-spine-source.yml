name: Skin FULLART-0 Spine Source

on:
  push:
    branches:
      - work/skin-stage3-3-batched-20260901
    paths:
      - scripts/extract-skin-fullart0-spine-source.py
      - scripts/extract-skin-fullart0-spine-source-v2.py
      - .github/workflows/skin-fullart0-spine-source.yml
      - data/evidence/skin-stage3-2-asset-resolution-evidence.v1.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skin-fullart0-spine-source
  cancel-in-progress: false

jobs:
  extract-current-spine-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current work branch
        uses: actions/checkout@v4
        with:
          ref: work/skin-stage3-3-batched-20260901
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install current frozen Unity parser
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3

      - name: Extract current Skin 102 Spine source chain
        run: python scripts/extract-skin-fullart0-spine-source-v2.py

      - name: Upload raw current Spine source proof
        uses: actions/upload-artifact@v4
        with:
          name: skin-fullart0-spine-source
          path: |
            data/evidence/skin-fullart0-spine-source.v1.json
            .skin-fullart0-spine-source/raw/*
          if-no-files-found: error

      - name: Remove execution-only installer state
        run: rm -rf .skin-fullart0-spine-source scripts/__pycache__

      - name: Fail closed on unrelated tracked mutation
        run: |
          allowed='^data/evidence/skin-fullart0-spine-source\.v1\.json$'
          bad="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            printf 'Unexpected paths after FULLART-0 Spine source extraction:\n%s\n' "$bad"
            exit 1
          fi

      - name: Freeze current Spine source evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/evidence/skin-fullart0-spine-source.v1.json
          git diff --cached --quiet && { echo 'Spine source evidence already frozen.'; exit 0; }
          git commit -m 'Freeze Skin FULLART-0 current Spine source'
          git push origin HEAD:work/skin-stage3-3-batched-20260901
