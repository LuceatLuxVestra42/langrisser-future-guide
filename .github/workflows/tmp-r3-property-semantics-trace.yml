name: Temporary R3 property semantics trace
on:
  push:
    paths: ['.github/workflows/tmp-r3-property-semantics-trace.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate pinned ConfigData source pack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir /tmp/langrisser-configdata-source
      - name: Inspect exact PropertyModify rows and Hero3 fields
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/r3-property-semantics
          node <<'NODE' | tee out/r3-property-semantics/result.txt
          const fs=require('fs'), path=require('path');
          const root='/tmp/langrisser-configdata-source/data/configdata';
          const read=p=>JSON.parse(fs.readFileSync(path.join(root,p),'utf8'));
          const rows=x=>Array.isArray(x)?x:(x.records||[]);
          const pm=rows(read('ConfigDataPropertyModifyInfo.json'));
          for(const id of [93,94,95,96]) console.log('PM_ROW='+JSON.stringify(pm.find(r=>Number(r.ID)===id)||null));
          const targetFields=['Hero3_HPCmdAdd','Hero3_ATCmdAdd','Hero3_DFCmdAdd','Hero3_MagicDFCmdAdd'];
          for(const f of fs.readdirSync(root).filter(x=>x.endsWith('.json')).sort()){
            let rs; try{rs=rows(read(f));}catch{continue}
            if(!rs.length) continue;
            const keys=new Set(); for(const r of rs.slice(0,Math.min(rs.length,2000))) for(const k of Object.keys(r||{})) if(targetFields.includes(k)) keys.add(k);
            if(keys.size) console.log('HERO3_FIELD_OWNER='+f+';FIELDS='+JSON.stringify([...keys]));
          }
          for(const f of fs.readdirSync(root).filter(x=>x.endsWith('.json')).sort()){
            let txt; try{txt=fs.readFileSync(path.join(root,f),'utf8')}catch{continue}
            if(targetFields.some(k=>txt.includes('"'+k+'"'))) console.log('HERO3_TEXT_HIT='+f);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: r3-property-semantics
          path: out/r3-property-semantics
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-r3-property-semantics-trace.yml
          git commit -m 'Remove temporary R3 property semantics trace'
          git push origin HEAD:${GITHUB_REF_NAME}
