name: Hero Awakening Icon Manifest Admission

on:
  push:
    branches:
      - work/awakening-skill-icon-a7-2-manifest-admission-20260910
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admit-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/awakening-skill-icon-a7-2-manifest-admission-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit 256 awakening icons into exact-path manifest
        run: python scripts/admit-hero-awakening-icon-manifest.py --write
      - name: Validate legacy Hero 6 manifest contract
        run: node scripts/validate-hero-skill-icon-assets-readonly.mjs
      - name: Commit admitted manifest when changed
        shell: bash
        run: |
          set -euo pipefail
          git add data/generated/hero-skill-icon-assets.v1.json
          if git diff --cached --quiet; then
            echo 'A7-2 manifest already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Admit awakening skill icons to manifest'
          git push origin HEAD:work/awakening-skill-icon-a7-2-manifest-admission-20260910
