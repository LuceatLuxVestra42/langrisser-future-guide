name: Soldier Stage 6-7 Site Admission

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/finalize-soldier-stage6-7-site-admission.cjs'
      - 'data/contracts/soldier-detail-stage5-1-contract.v1.json'
      - 'data/contracts/project-doctor-status-source-stage6-4-soldier-declaration.v1.json'
      - 'data/contracts/project-doctor-status-source-stage6-5-soldier-closeout-request.v1.json'
      - 'data/validation/soldier-stage6-0-checkpoint.v1.json'
      - 'data/validation/soldier-stage5-7-list.v1.json'
      - 'data/validation/soldier-stage5-8-release.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-2-classification.v1.json'
      - 'data/validation/soldier-stage6-3-representative-qa.v1.json'
      - 'data/validation/soldier-stage6-4-filter-qa.v1.json'
      - 'data/generated/hero-soldier-page-links-stage6-5.v1.json'
      - 'data/validation/soldier-stage6-5-reciprocal-links.v1.json'
      - 'data/generated/soldier-stage6-6-expansion-basis.v1.json'
      - 'data/validation/soldier-stage6-6-expansion-basis.v1.json'
      - 'data/generated/soldier-stage6-7-site-admission.v1.json'
      - 'data/validation/soldier-stage6-7-site-admission.v1.json'
      - '.github/workflows/soldier-stage6-7-site-admission.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/finalize-soldier-stage6-7-site-admission.cjs'
      - 'data/contracts/soldier-detail-stage5-1-contract.v1.json'
      - 'data/contracts/project-doctor-status-source-stage6-4-soldier-declaration.v1.json'
      - 'data/contracts/project-doctor-status-source-stage6-5-soldier-closeout-request.v1.json'
      - 'data/validation/soldier-stage6-0-checkpoint.v1.json'
      - 'data/validation/soldier-stage5-7-list.v1.json'
      - 'data/validation/soldier-stage5-8-release.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-2-classification.v1.json'
      - 'data/validation/soldier-stage6-3-representative-qa.v1.json'
      - 'data/validation/soldier-stage6-4-filter-qa.v1.json'
      - 'data/generated/hero-soldier-page-links-stage6-5.v1.json'
      - 'data/validation/soldier-stage6-5-reciprocal-links.v1.json'
      - 'data/generated/soldier-stage6-6-expansion-basis.v1.json'
      - 'data/validation/soldier-stage6-6-expansion-basis.v1.json'
      - 'data/generated/soldier-stage6-7-site-admission.v1.json'
      - 'data/validation/soldier-stage6-7-site-admission.v1.json'
      - '.github/workflows/soldier-stage6-7-site-admission.yml'

permissions:
  contents: read

concurrency:
  group: project-status-owner-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject protected main as explicit producer target
        run: |
          echo 'Explicit Stage 6-7 producer runs must target a non-main branch. Select the branch/ref to freeze, then open a normal PR.'
          exit 1

  site-admission:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Soldier Stage 6-7 final admission gate
        run: node scripts/finalize-soldier-stage6-7-site-admission.cjs

      - name: Upload Stage 6-7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage6-7-site-admission
          path: |
            data/generated/soldier-stage6-7-site-admission.v1.json
            data/validation/soldier-stage6-7-site-admission.v1.json

      - name: Verify frozen Stage 6-7 artifacts on main or PR
        run: |
          CHANGES="$(git status --porcelain -- data/generated/soldier-stage6-7-site-admission.v1.json data/validation/soldier-stage6-7-site-admission.v1.json)"
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            echo 'Stage 6-7 frozen artifacts differ from regenerated output.'
            exit 1
          fi

      - name: Verify Stage 6-5 closeout request projection on PR or main
        run: node scripts/render-project-doctor-status-source-closeout-request.mjs --pipeline soldier --check

      - name: Check Project Status source bridge after frozen Soldier output
        run: node scripts/bridge-project-doctor-status-source.mjs --pipeline soldier --check

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      handoff_pipeline: ${{ steps.handoff_declaration.outputs.pipeline }}
      handoff_expected_predecessor: ${{ steps.handoff_declaration.outputs.expected_predecessor }}
      handoff_entry_id: ${{ steps.handoff_declaration.outputs.entry_id }}
      handoff_source_path: ${{ steps.handoff_declaration.outputs.source_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Soldier Stage 6-7 final admission gate
        run: node scripts/finalize-soldier-stage6-7-site-admission.cjs

      - name: Upload Stage 6-7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage6-7-site-admission
          path: |
            data/generated/soldier-stage6-7-site-admission.v1.json
            data/validation/soldier-stage6-7-site-admission.v1.json

      - name: Freeze Stage 6-7 artifacts on explicit producer run
        run: |
          CHANGES="$(git status --porcelain -- data/generated/soldier-stage6-7-site-admission.v1.json data/validation/soldier-stage6-7-site-admission.v1.json)"
          if [ -z "$CHANGES" ]; then
            echo 'Stage 6-7 artifacts already frozen.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/generated/soldier-stage6-7-site-admission.v1.json data/validation/soldier-stage6-7-site-admission.v1.json
            git commit -m 'freeze Soldier stage 6-7 site admission PASS'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Render Project Status declaration from approved closeout request
        run: node scripts/render-project-doctor-status-source-closeout-request.mjs --pipeline soldier --write

      - name: Commit Stage 6-5 Project Status declaration on explicit producer run
        run: |
          DECLARATION='data/contracts/project-doctor-status-source-stage6-4-soldier-declaration.v1.json'
          if [ -z "$(git status --porcelain -- "$DECLARATION")" ]; then
            echo 'Soldier Project Status declaration is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$DECLARATION"
            git commit -m 'Render Soldier Project Status declaration from closeout request'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Resolve explicit Project Status handoff declaration
        id: handoff_declaration
        run: node scripts/resolve-project-doctor-status-source-declaration.mjs --pipeline soldier --github-output

  project-status-handoff:
    needs: explicit-producer
    if: needs.explicit-producer.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/project-doctor-status-source-stage6-3-apply-handoff.yml
    with:
      pipeline: ${{ needs.explicit-producer.outputs.handoff_pipeline }}
      expected_predecessor: ${{ needs.explicit-producer.outputs.handoff_expected_predecessor }}
      entry_id: ${{ needs.explicit-producer.outputs.handoff_entry_id }}
      source_path: ${{ needs.explicit-producer.outputs.handoff_source_path }}
