name: Soldier Stage 2 Final Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataArmyInfo.json'
      - 'data/metadata/soldier-name-kr-tier3.v1.json'
      - 'data/soldier-master-stage2-1.v1.json'
      - 'scripts/finalize-soldier-stage2.cjs'
      - '.github/workflows/soldier-stage2-final.yml'
      - 'data/contracts/configdata-source-pack-b5-9-soldier-stage2-writeback.v1.json'
  push:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataArmyInfo.json'
      - 'data/metadata/soldier-name-kr-tier3.v1.json'
      - 'data/soldier-master-stage2-1.v1.json'
      - 'scripts/finalize-soldier-stage2.cjs'
      - '.github/workflows/soldier-stage2-final.yml'

jobs:
  validate-automatic:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate Soldier Stage 2 in detached proof worktree
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/soldier-stage2-final-proof"
          echo "PROOF=$PROOF" >> "$GITHUB_ENV"
          git worktree add --detach "$PROOF" HEAD
          (
            cd "$PROOF"
            node scripts/finalize-soldier-stage2.cjs
          )
      - name: Require frozen semantic parity and logical provenance
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$PROOF" node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const proof = process.env.PROOF;
          const masterPath = 'data/generated/soldier-master.v1.json';
          const validationPath = 'data/validation/soldier-stage2-final.v1.json';
          const frozenMaster = JSON.parse(fs.readFileSync(masterPath, 'utf8'));
          const regeneratedMaster = JSON.parse(fs.readFileSync(path.join(proof, masterPath), 'utf8'));
          if (JSON.stringify(frozenMaster) !== JSON.stringify(regeneratedMaster)) {
            throw new Error('Soldier Stage2 automatic validation changed frozen master semantics');
          }
          const frozenValidation = JSON.parse(fs.readFileSync(validationPath, 'utf8'));
          const regeneratedValidation = JSON.parse(fs.readFileSync(path.join(proof, validationPath), 'utf8'));
          const normalize = (value) => {
            if (Array.isArray(value)) return value.map(normalize);
            if (value && typeof value === 'object') {
              const out = {};
              for (const key of Object.keys(value).sort()) {
                if (key === 'generatedAt') continue;
                out[key] = normalize(value[key]);
              }
              return out;
            }
            return value;
          };
          if (JSON.stringify(normalize(frozenValidation)) !== JSON.stringify(normalize(regeneratedValidation))) {
            throw new Error('Soldier Stage2 automatic validation changed frozen validation semantics');
          }
          const expectedSources = {
            soldier: 'data/configdata/ConfigDataSoldierInfo.json',
            spSoldier: 'data/configdata/ConfigDataSPSoldierInfo.json',
            army: 'data/configdata/ConfigDataArmyInfo.json',
            tier3KoreanMap: 'data/metadata/soldier-name-kr-tier3.v1.json',
          };
          if (JSON.stringify(regeneratedValidation.sources) !== JSON.stringify(expectedSources)) {
            throw new Error(`Soldier Stage2 logical provenance drift: ${JSON.stringify(regeneratedValidation.sources)}`);
          }
          if ((regeneratedValidation.errors || []).length !== 0) {
            throw new Error('Soldier Stage2 automatic validation has hard errors');
          }
          console.log(JSON.stringify({
            status: 'PASS',
            masterRecordCount: regeneratedMaster.records?.length ?? null,
            validationStatus: regeneratedValidation.status,
            logicalProvenanceChanged: false,
            semanticAuthorityChanged: false,
            frozenSemanticDomainsReopened: false,
          }, null, 2));
          NODE
      - name: Upload Soldier Stage 2 proof outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage2-final-proof
          path: |
            ${{ env.PROOF }}/data/generated/soldier-master.v1.json
            ${{ env.PROOF }}/data/validation/soldier-stage2-final.v1.json
      - name: Require primary checkout unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"

  write-manual:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Soldier Stage 2 final writer
        run: node scripts/finalize-soldier-stage2.cjs
      - name: Upload Soldier Stage 2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage2-final
          path: |
            data/generated/soldier-master.v1.json
            data/validation/soldier-stage2-final.v1.json
      - name: Commit validated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/soldier-master.v1.json data/validation/soldier-stage2-final.v1.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "generate soldier stage 2 final validation"
            git push
          fi
