name: Equipment Image Stage 2 APK Final 373 v3

on:
  push:
    branches:
      - work/equipment-image-stage2-apk-final373-v2
    paths:
      - scripts/finalize-equipment-image-stage2-hold29-v3.py
      - data/contracts/equipment-image-stage2-official-apk-finalization.v2.json
      - .github/workflows/equipment-image-stage2-apk-final373-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile finalizer
        run: python -m py_compile scripts/finalize-equipment-image-stage2-hold29-v3.py

      - name: Install official APK extraction dependencies
        run: python -m pip install --disable-pip-version-check UnityPy Pillow

      - name: Resolve HOLD29 from official APK and finalize 373
        run: python scripts/finalize-equipment-image-stage2-hold29-v3.py

      - name: Require Equipment Image Stage 2 final PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('data/validation/equipment-image-stage2-final-summary.v3.json').read_text())
          assert summary['status'] == 'PASS_EQUIPMENT_IMAGE_STAGE2', summary
          assert summary['completion'] == 'COMPLETE', summary
          assert summary['freezeState'] == 'EQUIPMENT_IMAGE_STAGE2_FROZEN', summary
          counts = summary['counts']
          assert counts['publicEquipment'] == 373, summary
          assert counts['existingExactSourceAssets'] == 344, summary
          assert counts['heldResolved'] == 29, summary
          assert counts['verifiedRepositoryAssets'] == 373, summary
          assert counts['verifiedEvidence'] == 373, summary
          assert counts['representativeDecoderProofPassed'] == 5, summary
          assert counts['officialEtc2AssetsResolved'] == 29, summary
          assert counts['alphaValidatedHolds'] == 29, summary
          assert counts['existingAssetsChanged'] == 0, summary
          assert counts['unexpectedDeleted'] == 0, summary
          assert counts['unexpectedAddedOutsideHold29'] == 0, summary
          assert counts['missing'] == 0, summary
          assert counts['invalidPng'] == 0, summary
          assert counts['ambiguousLocator'] == 0, summary
          assert counts['hardErrors'] == 0, summary
          assert summary['sourceResolution']['caseMismatchResolved'] == 3, summary
          assert summary['sourceResolution']['fullPathCollisionResolved'] == 2, summary
          assert summary['sourceResolution']['legacyDriveMissingResolved'] == 24, summary
          assert summary['sourceResolution']['textureFormatCode'] == 47, summary
          assert summary['sourceResolution']['textureFormatName'] == 'ETC2_RGBA8', summary
          assert summary['collisionFixture547_550Passed'] is True, summary
          assert summary['finalStage2Complete'] is True, summary
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-run frozen Stage 1 representative validator
        run: node scripts/validate-equipment-image-stage1.mjs

      - name: Re-run frozen Equipment Stage 4-6 admission QA
        run: bun scripts/validate-equipment-stage4-6-admission-route-qa.mjs

      - name: Production build regression
        run: bun run build

      - name: Commit final verified Equipment assets and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/images/equipment \
            data/evidence/equipment-image-stage2-final373-official-apk.v3.json \
            data/validation/equipment-image-stage2-final-summary.v3.json \
            data/checkpoints/equipment-image-stage2-final.v3.json \
            data/validation/equipment-image-stage1-summary.v1.json \
            data/checkpoints/equipment-image-stage1.v1.json
          if git diff --cached --quiet; then
            echo 'Equipment Image Stage 2 final 373 assets already current.'
          else
            git commit -m 'Finalize Equipment Image Stage 2 at 373/373 [skip ci]'
            git push origin HEAD:work/equipment-image-stage2-apk-final373-v2
          fi
