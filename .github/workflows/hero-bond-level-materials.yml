name: Hero Bond Level Materials

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hero-bond-level-materials.yml'
      - 'data/contracts/hero-bond-level-materials.v1.json'
      - 'data/generated/hero-bond-level-materials.v1.json'
      - 'data/validation/hero-bond-level-materials-summary.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'data/generated/hero-detail/by-id/**'
      - 'data/generated/hero-heart-fetter-raw-condition.v1.json'
      - 'scripts/build_hero_bond_level_materials.cjs'
      - 'scripts/validate_hero_bond_level_materials.cjs'
      - 'scripts/lib/configdata-direct.cjs'
      - 'scripts/configdata-source-pack-maintenance-root.cjs'
      - 'scripts/hydrate-configdata-source-pack-v1.mjs'
      - 'data/contracts/configdata-source-pack-contract.v1.json'
  push:
    branches:
      - 'feat/hero-bond-level-materials-*'
    paths:
      - '.github/workflows/hero-bond-level-materials.yml'
      - 'data/contracts/hero-bond-level-materials.v1.json'
      - 'data/generated/hero-bond-level-materials.v1.json'
      - 'data/validation/hero-bond-level-materials-summary.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'data/generated/hero-detail/by-id/**'
      - 'data/generated/hero-heart-fetter-raw-condition.v1.json'
      - 'scripts/build_hero_bond_level_materials.cjs'
      - 'scripts/validate_hero_bond_level_materials.cjs'
      - 'scripts/lib/configdata-direct.cjs'
      - 'scripts/configdata-source-pack-maintenance-root.cjs'
      - 'scripts/hydrate-configdata-source-pack-v1.mjs'
      - 'data/contracts/configdata-source-pack-contract.v1.json'

permissions:
  contents: write

jobs:
  build-validate-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Confirm clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          git diff --check

      - name: Build per-Hero bond level costs
        run: node scripts/build_hero_bond_level_materials.cjs

      - name: Independently validate frozen-source and cost parity
        run: node scripts/validate_hero_bond_level_materials.cjs

      - name: Reject unexpected mutation
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(data/generated/hero-bond-level-materials\.v1\.json|data/validation/hero-bond-level-materials-summary\.v1\.json)$'
          unexpected="$(git status --porcelain=v1 | sed -E 's/^...//' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected repository mutation after producer/validator:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check

      - name: Freeze validated outputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add data/generated/hero-bond-level-materials.v1.json data/validation/hero-bond-level-materials-summary.v1.json
          if git diff --cached --quiet; then
            echo 'Hero bond level material outputs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze Hero bond level material costs'
          git push origin HEAD:"${GITHUB_REF_NAME}"
