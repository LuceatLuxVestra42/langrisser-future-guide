name: Project Tooling R1 Status Source

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/status-source/**'
      - 'data/contracts/project-tooling-status-source-r1.v1.json'
      - 'data/contracts/project-tooling-status-source-r1-2.v1.json'
      - 'data/contracts/project-tooling-status-source-r1-3.v1.json'
      - 'data/contracts/project-tooling-status-source-r1-4.v1.json'
      - 'data/contracts/project-tooling-status-source-r1-5.v1.json'
      - 'data/contracts/project-tooling-status-source-r1-final.v1.json'
      - 'data/contracts/project-tooling-status-source-writer-cutover.v1.json'
      - 'data/contracts/project-tooling-migration-r0.v1.json'
      - 'data/status-sources/**'
      - '.github/workflows/project-tooling-r1-status-source.yml'
      - '.github/workflows/project-tooling-r1-status-source-writer.yml'
      - '.github/workflows/project-doctor-status-source-stage6-3-apply-handoff.yml'
      - '.github/workflows/hero-stage6-4-site-consumer.yml'
      - '.github/workflows/soldier-stage6-7-site-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-source-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run independent Status Source selection parity and isolation self-test
        run: node tools/status-source/test/current-main-parity.mjs

      - name: Run independent Status Source promotion parity and rollback self-test
        run: node tools/status-source/test/promotion-parity.mjs

      - name: Run independent Status Source producer gate parity and delegation self-test
        run: node tools/status-source/test/producer-gate-parity.mjs

      - name: Run independent Status Source artifact bridge parity and delegation self-test
        run: node tools/status-source/test/artifact-bridge-parity.mjs

      - name: Run independent Status Source lifecycle parity and CAS self-test
        run: node tools/status-source/test/lifecycle-parity.mjs

      - name: Print selected sources
        run: node tools/status-source/cli/select.mjs

      - name: Prove promotion CLI defaults to check-only on the active Equipment source
        run: >-
          node tools/status-source/cli/promote.mjs
          --domain equipment
          --id equipment-public-presentation-correction-final
          --source data/validation/equipment-public-presentation-correction-final.v1.json

      - name: Prove producer submit CLI delegates to check-only on the active Equipment source
        run: >-
          node tools/status-source/cli/submit.mjs
          --producer equipment-final
          --id equipment-public-presentation-correction-final
          --source data/validation/equipment-public-presentation-correction-final.v1.json

      - name: Prove artifact bridge CLI delegates to check-only on the active Equipment pipeline
        run: node tools/status-source/cli/bridge.mjs --pipeline equipment

      - name: Resolve retained Hero producer declaration
        run: node tools/status-source/cli/lifecycle.mjs declaration --pipeline hero

      - name: Prove Hero closeout request is deterministic and check-only
        run: node tools/status-source/cli/lifecycle.mjs closeout --pipeline hero

      - name: Prove Hero lifecycle handoff defaults to check-only
        run: >-
          node tools/status-source/cli/lifecycle.mjs handoff
          --pipeline hero
          --expected-predecessor hero-stage6-4-final
          --id hero-stage6-4-final
          --source data/validation/hero-stage6-4-final.v1.json
