name: Equipment Stage 2-2 Basic Join

on:
  push:
    paths:
      - '.github/workflows/equipment-stage2-2-basic-join.yml'
      - 'scripts/verify-equipment-stage2-2-basic-join.mjs'
      - 'data/configdata/ConfigDataEquipmentInfo.json'
      - 'data/configdata/ConfigDataItemInfo.json'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Equipment Stage 2-2 basic join verification
        run: node scripts/verify-equipment-stage2-2-basic-join.mjs

      - name: Persist Stage 2-2 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/equipment_stage2_2_basic_join.json
          if git diff --cached --quiet; then
            echo "No Stage 2-2 changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 2-2 basic join"
          git push
