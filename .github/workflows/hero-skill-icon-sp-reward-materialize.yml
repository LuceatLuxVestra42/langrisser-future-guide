name: Temporary SP reward skill icon materialization

on:
  push:
    branches:
      - work/hero-sp-reward-skill-icons-20260918
    paths:
      - .github/workflows/hero-skill-icon-sp-reward-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hero-sp-reward-skill-icons-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'UnityPy==1.25.3'
      - run: python scripts/materialize-hero-sp-reward-skill-icons.py --scan-shard ${{ matrix.shard }} --shard-count 8 --output /tmp/sp-reward-scan-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sp-reward-scan-${{ matrix.shard }}
          path: /tmp/sp-reward-scan-${{ matrix.shard }}.json
          if-no-files-found: error

  materialize:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hero-sp-reward-skill-icons-20260918
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'UnityPy==1.25.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: sp-reward-scan-*
          path: /tmp/sp-reward-scans
          merge-multiple: true
      - run: python scripts/materialize-hero-sp-reward-skill-icons.py --merge-materialize /tmp/sp-reward-scans
      - name: Commit generated evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/generated/hero-skill-icon-sp-reward-materialization.v1.json public/images/heroes/skill-icons/
          test -n "$(git status --porcelain)"
          changed="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/generated/hero-skill-icon-sp-reward-materialization\.v1\.json|public/images/heroes/skill-icons/[^/]+\.png)$' || true)"
          test -z "$unexpected" || { echo "Unexpected paths:"; echo "$unexpected"; exit 2; }
          git commit -m "Materialize SP reward skill icons"
          git push origin HEAD:work/hero-sp-reward-skill-icons-20260918
