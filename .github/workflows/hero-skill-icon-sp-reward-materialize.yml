name: Temporary SP reward skill icon materialization

on:
  push:
    branches:
      - work/hero-sp-reward-skill-icons-20260918
    paths:
      - .github/workflows/hero-skill-icon-sp-reward-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hero-sp-reward-skill-icons-20260918
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'UnityPy==1.25.3'
      - name: Materialize exact SP reward skill icons
        run: |
          cat > /tmp/materialize_sp_reward.py <<'PY'
          import hashlib, importlib.util, json, pathlib
          import UnityPy

          ROOT = pathlib.Path('.')
          SHARDS = ROOT / 'data/generated/hero-detail/by-id'
          MANIFEST = ROOT / 'data/generated/hero-skill-icon-assets.v1.json'
          LOCATOR = ROOT / 'data/generated/hero-awakening-icon-official-bundle-locator.v1.json'
          VERIFIER = ROOT / 'scripts/verify-hero-awakening-icon-official.py'
          OUT = ROOT / 'data/generated/hero-skill-icon-sp-reward-materialization.v1.json'
          PUBLIC = ROOT / 'public/images/heroes/skill-icons'
          PREFIXES = ('UI/Icon/Skill_ABS/', 'UI/Icon/Skill2_ABS/')
          EXPECTED_RELEASED = 25
          EXPECTED_USAGE = 50
          EXCLUDED_HERO = 6
          EXPECTED_TARGET_USAGE = 48
          EXPECTED_TARGET_UNIQUE = 48

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def compact_sha(value):
              return sha(json.dumps(value, ensure_ascii=False, separators=(',', ':')).encode())

          spec = importlib.util.spec_from_file_location('official', VERIFIER)
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)

          shards = sorted((p for p in SHARDS.glob('*.json') if p.stem.isdigit()), key=lambda p:int(p.stem))
          if len(shards) != 267:
              raise RuntimeError(f'hero shard count drift {len(shards)}/267')

          released = 0
          usage = 0
          targets = {}
          leon_paths = set()
          for path in shards:
              hero = load(path)
              sp = hero.get('sp') or {}
              if sp.get('status') != 'RELEASED':
                  continue
              released += 1
              hero_id = int(hero['heroId'])
              skills = ((sp.get('secondStageRewards') or {}).get('skills') or [])
              if len(skills) != 2:
                  raise RuntimeError(f'Hero {hero_id} SP reward skill count {len(skills)}/2')
              for skill in skills:
                  usage += 1
                  skill_id = skill.get('skillId')
                  source_path = skill.get('icon')
                  if not isinstance(skill_id, int) or not isinstance(source_path, str) or not source_path.startswith(PREFIXES):
                      raise RuntimeError(f'invalid exact SP reward skill locator hero={hero_id} skill={skill_id} path={source_path}')
                  if hero_id == EXCLUDED_HERO:
                      leon_paths.add(source_path)
                      continue
                  row = targets.setdefault(source_path, {'sourcePath': source_path, 'usageCount': 0, 'heroIds': set(), 'skillIds': set()})
                  row['usageCount'] += 1
                  row['heroIds'].add(hero_id)
                  row['skillIds'].add(skill_id)

          if released != EXPECTED_RELEASED or usage != EXPECTED_USAGE:
              raise RuntimeError(f'SP source drift released={released}/{EXPECTED_RELEASED} usage={usage}/{EXPECTED_USAGE}')
          if len(leon_paths) != 2:
              raise RuntimeError(f'Leon admitted scope drift {len(leon_paths)}/2')
          if sum(r['usageCount'] for r in targets.values()) != EXPECTED_TARGET_USAGE or len(targets) != EXPECTED_TARGET_UNIQUE:
              raise RuntimeError(f'target drift usage={sum(r["usageCount"] for r in targets.values())}/{EXPECTED_TARGET_USAGE} unique={len(targets)}/{EXPECTED_TARGET_UNIQUE}')

          manifest = load(MANIFEST)
          frozen = list(manifest.get('records') or []) + list(manifest.get('awakeningRecords') or []) + list(manifest.get('spTalentRecords') or [])
          frozen_by_path = {r.get('sourcePath'): r for r in frozen}
          if not leon_paths.issubset(frozen_by_path):
              raise RuntimeError(f'Leon SP reward predecessor missing {sorted(leon_paths - set(frozen_by_path))}')
          overlap = set(targets) & set(frozen_by_path)
          if overlap:
              raise RuntimeError(f'non-Leon SP reward path already admitted unexpectedly: {sorted(overlap)[:5]}')

          locator = load(LOCATOR)
          groups = {g.get('sourcePathPrefix'): g for g in locator.get('locatorGroups', [])}
          bundle_data = {}
          for prefix in PREFIXES:
              candidates = (groups.get(prefix) or {}).get('candidates') or []
              if len(candidates) != 1:
                  raise RuntimeError(f'locator candidate count {prefix}={len(candidates)}')
              candidate = candidates[0]
              raw = verifier.fetch_zip_entry(candidate['packageUrl'], candidate)
              actual_sha = sha(raw)
              env = UnityPy.load(raw)
              index = {}
              for container_path, value in env.container.items():
                  rel = verifier.runtime_relative(container_path)
                  if rel is not None:
                      index.setdefault(rel, []).append((str(container_path).replace('\\', '/'), value))
              bundle_data[prefix] = (candidate, actual_sha, index)

          existing_public = {str(r.get('publicPath','')).lower() for r in frozen if r.get('publicPath')}
          new_public = set()
          outputs = []
          for source_path in sorted(targets):
              prefix = next(p for p in PREFIXES if source_path.startswith(p))
              candidate, bundle_sha, index = bundle_data[prefix]
              exact = index.get(verifier.norm(source_path), [])
              sprites = []
              companions = 0
              for container_path, value in exact:
                  reader = verifier.reader_of(value)
                  kind = getattr(getattr(reader, 'type', None), 'name', None)
                  if kind != 'Sprite':
                      companions += 1
                      continue
                  raw_obj = reader.get_raw_data()
                  image = reader.read().image.convert('RGBA')
                  if image.getchannel('A').getbbox() is None:
                      raise RuntimeError(f'empty alpha {source_path}')
                  sprites.append({
                      'containerPath': container_path,
                      'pathId': int(getattr(reader, 'path_id', 0) or 0),
                      'rawObjectSha256': sha(raw_obj),
                      'rgbaSha256': sha(image.tobytes()),
                      'width': image.width,
                      'height': image.height,
                      'image': image,
                  })
              if not sprites:
                  raise RuntimeError(f'no exact Sprite hit {source_path}')
              render_keys = {(s['width'], s['height'], s['rgbaSha256']) for s in sprites}
              if len(render_keys) != 1:
                  raise RuntimeError(f'ambiguous non-equivalent exact Sprite hits {source_path}')
              selected = sprites[0]
              filename = pathlib.PurePosixPath(source_path).name
              public_path = f'/images/heroes/skill-icons/{filename}'
              public_key = public_path.lower()
              if public_key in existing_public or public_key in new_public:
                  raise RuntimeError(f'public path collision {public_path}')
              new_public.add(public_key)
              fs_path = ROOT / ('public' + public_path)
              fs_path.parent.mkdir(parents=True, exist_ok=True)
              selected['image'].save(fs_path, format='PNG', optimize=False, compress_level=9)
              png = fs_path.read_bytes()
              u = targets[source_path]
              outputs.append({
                  'role': 'sp-reward',
                  'sourcePath': source_path,
                  'usageCount': u['usageCount'],
                  'heroIds': sorted(u['heroIds']),
                  'skillIds': sorted(u['skillIds']),
                  'verificationOwner': 'OFFICIAL_INSTALLER_EXACT_RUNTIME_PATH_UNITY_SPRITE',
                  'packagePart': candidate['packagePart'],
                  'packageName': candidate['packageName'],
                  'bundleEntry': candidate['bundleEntry'],
                  'bundleSha256': bundle_sha,
                  'containerPath': selected['containerPath'],
                  'objectType': 'Sprite',
                  'pathId': selected['pathId'],
                  'rawObjectSha256': selected['rawObjectSha256'],
                  'rgbaSha256': selected['rgbaSha256'],
                  'width': selected['width'],
                  'height': selected['height'],
                  'publicPath': public_path,
                  'pngBytes': len(png),
                  'pngSha256': sha(png),
                  'nonSpriteExactPathCompanionCount': companions,
              })

          report = {
              'version': 1,
              'schemaId': 'hero-skill-icon-sp-reward-materialization/v1',
              'status': 'FROZEN',
              'completion': 'COMPLETE',
              'semanticReopen': False,
              'lookupAuthority': 'exact sp.secondStageRewards.skills[].icon only',
              'source': {
                  'kind': 'OFFICIAL_INSTALLER',
                  'installVersion': '1.1.113',
                  'unityParser': 'UnityPy==1.25.3',
                  'unityContainerRootPrefix': 'assets/gameproject/runtimeassets',
              },
              'authority': {
                  'source': 'data/generated/hero-detail/by-id/*.json',
                  'exactField': 'sp.secondStageRewards.skills[].icon',
                  'excludedAlreadyAdmittedHeroId': EXCLUDED_HERO,
                  'semanticRecomputation': False,
                  'nameJoin': False,
                  'idArithmetic': False,
              },
              'verificationPolicy': {
                  'proofRequirement': 'full normalized runtime relative path equality + at least one Sprite exact hit + decoded RGBA + non-empty alpha',
                  'outputPathRule': 'exact sourcePath basename after exact proof; case-insensitive collisions fail closed',
              },
              'summary': {
                  'spReleasedCount': released,
                  'spRewardUsageCount': usage,
                  'excludedLeonUsageCount': len(leon_paths),
                  'targetHeroCount': 24,
                  'targetUsageCount': EXPECTED_TARGET_USAGE,
                  'targetUniqueIconPathCount': EXPECTED_TARGET_UNIQUE,
                  'provedCount': len(outputs),
                  'missingCount': 0,
                  'publicPathCollisionCount': 0,
              },
              'records': outputs,
          }
          report['materializationSetSha256'] = compact_sha(outputs)
          report['materializationHashContract'] = 'sha256(UTF-8 compact JSON of records array sorted by exact sourcePath)'
          OUT.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'status':'PASS_MATERIALIZED', **report['summary'], 'materializationSetSha256': report['materializationSetSha256']}, ensure_ascii=False, indent=2))
          PY
          python /tmp/materialize_sp_reward.py
      - name: Commit generated evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/generated/hero-skill-icon-sp-reward-materialization.v1.json public/images/heroes/skill-icons/
          test -n "$(git status --porcelain)"
          changed="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/generated/hero-skill-icon-sp-reward-materialization\.v1\.json|public/images/heroes/skill-icons/[^/]+\.png)$' || true)"
          test -z "$unexpected" || { echo "Unexpected paths:"; echo "$unexpected"; exit 2; }
          git commit -m "Materialize SP reward skill icons"
          git push origin HEAD:work/hero-sp-reward-skill-icons-20260918
