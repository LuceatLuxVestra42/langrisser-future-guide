name: Temporary Leon Skill Icon Integrate Validate

on:
  push:
    branches:
      - feat/leon-skill-icon-assets-20260902

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration patch
        run: python .github/temp-leon-skill-icon-integrate.py

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Commit final implementation and remove temporary files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-leon-skill-icon-integrate-validate.yml
          git rm .github/temp-leon-skill-icon-integrate.py
          git add -A
          git commit -m "Integrate verified Leon skill icons"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Run changed-path Project Check
        run: node tools/project-check/cli/check.mjs --base origin/main --head HEAD

      - name: Ensure validation left no tracked mutation
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code
