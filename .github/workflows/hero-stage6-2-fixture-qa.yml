name: Hero Stage 6-2 Representative Fixture QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/contracts/hero-stage6-2-representative-fixture-qa.v1.json'
      - 'data/generated/hero-detail-stage6-1.v1.json'
      - 'data/validation/hero-stage6-1-final.v1.json'
      - 'data/generated/hero-basic-combat.v1.json'
      - 'data/generated/hero-page-stage5-1-bonds-final.v1.json'
      - 'data/generated/hero-page-stage5-2-exclusive-central.v1.json'
      - 'data/generated/hero-page-soldiers-stage5-3.v1.json'
      - 'data/generated/hero-page-stage5-4-sp.v1.json'
      - 'data/hero-page-stage5-5-3.v1.json'
      - 'scripts/build_hero_stage6_2_fixture_qa.cjs'
      - '.github/workflows/hero-stage6-2-fixture-qa.yml'
  pull_request:
    paths:
      - 'data/contracts/hero-stage6-2-representative-fixture-qa.v1.json'
      - 'data/generated/hero-stage6-2-representative-fixtures.v1.json'
      - 'data/validation/hero-stage6-2-final.v1.json'
      - 'data/generated/hero-detail-stage6-1.v1.json'
      - 'data/validation/hero-stage6-1-final.v1.json'
      - 'data/generated/hero-basic-combat.v1.json'
      - 'data/generated/hero-page-stage5-1-bonds-final.v1.json'
      - 'data/generated/hero-page-stage5-2-exclusive-central.v1.json'
      - 'data/generated/hero-page-soldiers-stage5-3.v1.json'
      - 'data/generated/hero-page-stage5-4-sp.v1.json'
      - 'data/hero-page-stage5-5-3.v1.json'
      - 'scripts/build_hero_stage6_2_fixture_qa.cjs'
      - '.github/workflows/hero-stage6-2-fixture-qa.yml'

permissions:
  contents: read

jobs:
  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject protected main as explicit producer target
        run: |
          echo 'Explicit Hero Stage 6-2 producer runs must target a non-main branch. Select the branch/ref to freeze, then open a normal PR.'
          exit 1

  fixture-qa:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate Stage 6-2 fixtures
        run: node scripts/build_hero_stage6_2_fixture_qa.cjs

      - name: Show Stage 6-2 summary
        run: |
          node - <<'NODE'
          const v = require('./data/validation/hero-stage6-2-final.v1.json');
          console.log(JSON.stringify({status:v.status, completion:v.completion, summary:v.summary, selectedFixtures:v.selectedFixtures, hardErrors:v.hardErrors}, null, 2));
          NODE

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hero-stage6-2-representative-fixture-qa
          path: |
            data/generated/hero-stage6-2-representative-fixtures.v1.json
            data/validation/hero-stage6-2-final.v1.json

      - name: Verify frozen outputs on PR or main
        run: |
          if [ -n "$(git status --porcelain -- data/generated/hero-stage6-2-representative-fixtures.v1.json data/validation/hero-stage6-2-final.v1.json)" ]; then
            echo 'Stage 6-2 generated outputs are not frozen or are stale.'
            git status --short -- data/generated/hero-stage6-2-representative-fixtures.v1.json data/validation/hero-stage6-2-final.v1.json
            exit 1
          fi

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate Stage 6-2 fixtures
        run: node scripts/build_hero_stage6_2_fixture_qa.cjs

      - name: Show Stage 6-2 summary
        run: |
          node - <<'NODE'
          const v = require('./data/validation/hero-stage6-2-final.v1.json');
          console.log(JSON.stringify({status:v.status, completion:v.completion, summary:v.summary, selectedFixtures:v.selectedFixtures, hardErrors:v.hardErrors}, null, 2));
          NODE

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hero-stage6-2-representative-fixture-qa
          path: |
            data/generated/hero-stage6-2-representative-fixtures.v1.json
            data/validation/hero-stage6-2-final.v1.json

      - name: Freeze generated QA outputs on explicit producer run
        run: |
          if [ -z "$(git status --porcelain -- data/generated/hero-stage6-2-representative-fixtures.v1.json data/validation/hero-stage6-2-final.v1.json)" ]; then
            echo 'Stage 6-2 outputs already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/hero-stage6-2-representative-fixtures.v1.json data/validation/hero-stage6-2-final.v1.json
          git commit -m 'Freeze Hero Stage 6-2 representative fixtures'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
