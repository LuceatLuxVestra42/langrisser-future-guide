name: Hero SP Bootstrap Migration Architecture Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  producer:
    if: github.head_ref == 'test/asset-portability-cleanroom-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout producer repository
        uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build frozen deterministic bootstrap package
        run: |
          python tools/asset-intake/experiments/hero-sp-bootstrap-migration/build_bootstrap.py --output-dir /tmp/bootstrap-dist
          cat /tmp/bootstrap-dist/bootstrap-build-result.json
          (cd /tmp/bootstrap-dist && sha256sum -c hero-sp-bootstrap-v1.tar.sha256)
      - name: Upload frozen bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: hero-sp-bootstrap-package
          path: |
            /tmp/bootstrap-dist/hero-sp-bootstrap-v1.tar
            /tmp/bootstrap-dist/hero-sp-bootstrap-v1.tar.sha256
            /tmp/bootstrap-dist/bootstrap-build-result.json
          if-no-files-found: error
          retention-days: 7

  consumer:
    needs: producer
    strategy:
      fail-fast: false
      matrix:
        run: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Setup Python 3.11 host
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup dotnet 8.0.425 host
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - name: Receive bootstrap package only
        uses: actions/download-artifact@v4
        with:
          name: hero-sp-bootstrap-package
          path: /tmp/bootstrap-artifact
      - name: Create empty Git repository and verify package identity
        env:
          RUN_LABEL: ${{ matrix.run }}
        run: |
          set -euo pipefail
          REPO="/tmp/new-repo-${RUN_LABEL}"
          mkdir -p "$REPO"
          cd "$REPO"
          git init
          test -z "$(git remote)"
          test ! -e tools/asset-intake
          test ! -e data/evidence
          test ! -e public/images
          test ! -e generated
          cd /tmp/bootstrap-artifact
          sha256sum -c hero-sp-bootstrap-v1.tar.sha256
          cp hero-sp-bootstrap-v1.tar "$REPO/"
          cd "$REPO"
          tar -xf hero-sp-bootstrap-v1.tar
          rm hero-sp-bootstrap-v1.tar
          test -d bootstrap
          test ! -e tools/asset-intake
          test ! -e data/evidence
          test ! -e public/images
          test -z "$(git remote)"
          python bootstrap/validate_bootstrap.py
          printf '{"status":"PASS_EMPTY_REPO_ASSERT","run":"%s"}\n' "$RUN_LABEL" > empty-repo-proof.json
      - name: Materialize under official-source-only network boundary
        env:
          RUN_LABEL: ${{ matrix.run }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="/tmp/new-repo-${RUN_LABEL}"
          cd "$REPO"
          HOST=mhmnzupdate.zlongame.com
          IPS="$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)"
          test -n "$IPS"
          echo "$IPS" > official-source-ips.txt
          for ip in $IPS; do echo "$ip $HOST" | sudo tee -a /etc/hosts >/dev/null; done
          sudo iptables-save > /tmp/iptables.before
          sudo ip6tables-save > /tmp/ip6tables.before
          restore_net() {
            sudo iptables-restore < /tmp/iptables.before || true
            sudo ip6tables-restore < /tmp/ip6tables.before || true
          }
          trap restore_net EXIT
          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          for ip in $IPS; do
            sudo iptables -A OUTPUT -p tcp -d "$ip" --dport 80 -j ACCEPT
            sudo iptables -A OUTPUT -p tcp -d "$ip" --dport 443 -j ACCEPT
          done
          sudo ip6tables -F OUTPUT
          sudo ip6tables -P OUTPUT DROP
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

          if curl -fsS --connect-timeout 2 --max-time 3 https://github.com >/dev/null 2>&1; then
            echo "FAIL_NETWORK_GITHUB_NOT_BLOCKED"; exit 1
          fi
          if curl -fsS --connect-timeout 2 --max-time 3 https://pypi.org >/dev/null 2>&1; then
            echo "FAIL_NETWORK_PYPI_NOT_BLOCKED"; exit 1
          fi
          echo "PASS_NETWORK_GITHUB_BLOCKED" > network-boundary.txt
          echo "PASS_NETWORK_PYPI_BLOCKED" >> network-boundary.txt
          echo "ALLOW_ONLY=$HOST" >> network-boundary.txt

          python -m pip install --disable-pip-version-check --no-index --find-links bootstrap/runtime/wheelhouse -r bootstrap/runtime/requirements.lock.txt
          python bootstrap/validate_bootstrap.py
          python bootstrap/materialize.py
          python bootstrap/validate_output.py
          trap - EXIT
          restore_net
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd()
          manifest=root/'generated'/'manifest.json'
          package_side=pathlib.Path('/tmp/bootstrap-artifact/hero-sp-bootstrap-v1.tar.sha256').read_text().split()[0]
          proof={
            'status':'PASS_INDEPENDENT_BOOTSTRAP_RUN',
            'run':pathlib.Path(root).name.rsplit('-',1)[-1],
            'gitRemotes':subprocess.check_output(['git','remote'],text=True).split(),
            'bootstrapPackageSha256':package_side,
            'manifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'heroAssets':{}
          }
          for p in sorted((root/'generated'/'assets'/'heroes').glob('*.webp'),key=lambda x:int(x.stem)):
            proof['heroAssets'][p.stem]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'run-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof))
          PY
      - name: Upload independent run proof
        uses: actions/upload-artifact@v4
        with:
          name: hero-sp-bootstrap-run-${{ matrix.run }}
          path: |
            /tmp/new-repo-${{ matrix.run }}/empty-repo-proof.json
            /tmp/new-repo-${{ matrix.run }}/network-boundary.txt
            /tmp/new-repo-${{ matrix.run }}/official-source-ips.txt
            /tmp/new-repo-${{ matrix.run }}/run-proof.json
            /tmp/new-repo-${{ matrix.run }}/generated/manifest.json
            /tmp/new-repo-${{ matrix.run }}/generated/assets/heroes/*.webp
            /tmp/new-repo-${{ matrix.run }}/frontend/*
          if-no-files-found: error
          retention-days: 7

  negative-missing-contract:
    needs: producer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - uses: actions/download-artifact@v4
        with:
          name: hero-sp-bootstrap-package
          path: /tmp/bootstrap-artifact
      - name: Expect missing-contract failure
        run: |
          set -euo pipefail
          REPO=/tmp/new-repo-negative-missing
          mkdir "$REPO"; cd "$REPO"; git init
          (cd /tmp/bootstrap-artifact && sha256sum -c hero-sp-bootstrap-v1.tar.sha256)
          tar -xf /tmp/bootstrap-artifact/hero-sp-bootstrap-v1.tar
          python bootstrap/validate_bootstrap.py
          python -m pip install --disable-pip-version-check --no-index --find-links bootstrap/runtime/wheelhouse -r bootstrap/runtime/requirements.lock.txt
          rm bootstrap/contract/hero-sp.v1.json
          set +e
          output="$(python bootstrap/materialize.py --hero-id 6 2>&1)"
          rc=$?
          set -e
          echo "$output"
          test $rc -ne 0
          grep -F "FAIL_MISSING_ASSET_CONTRACT" <<<"$output"
          printf '{"status":"PASS_NEGATIVE_MISSING_CONTRACT","observed":"FAIL_MISSING_ASSET_CONTRACT"}\n' > negative-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: hero-sp-bootstrap-negative-missing
          path: /tmp/new-repo-negative-missing/negative-proof.json
          if-no-files-found: error
          retention-days: 7

  negative-bad-source-hash:
    needs: producer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - uses: actions/download-artifact@v4
        with:
          name: hero-sp-bootstrap-package
          path: /tmp/bootstrap-artifact
      - name: Expect source-hash mismatch under official-only egress
        shell: bash
        run: |
          set -euo pipefail
          REPO=/tmp/new-repo-negative-hash
          mkdir "$REPO"; cd "$REPO"; git init
          (cd /tmp/bootstrap-artifact && sha256sum -c hero-sp-bootstrap-v1.tar.sha256)
          tar -xf /tmp/bootstrap-artifact/hero-sp-bootstrap-v1.tar
          python bootstrap/validate_bootstrap.py
          HOST=mhmnzupdate.zlongame.com
          IPS="$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)"
          test -n "$IPS"
          for ip in $IPS; do echo "$ip $HOST" | sudo tee -a /etc/hosts >/dev/null; done
          sudo iptables-save > /tmp/iptables.before
          sudo ip6tables-save > /tmp/ip6tables.before
          restore_net() { sudo iptables-restore < /tmp/iptables.before || true; sudo ip6tables-restore < /tmp/ip6tables.before || true; }
          trap restore_net EXIT
          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          for ip in $IPS; do sudo iptables -A OUTPUT -p tcp -d "$ip" --dport 80 -j ACCEPT; sudo iptables -A OUTPUT -p tcp -d "$ip" --dport 443 -j ACCEPT; done
          sudo ip6tables -F OUTPUT
          sudo ip6tables -P OUTPUT DROP
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          python -m pip install --disable-pip-version-check --no-index --find-links bootstrap/runtime/wheelhouse -r bootstrap/runtime/requirements.lock.txt
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('bootstrap/contract/hero-sp.v1.json')
          x=json.loads(p.read_text())
          r=next(r for r in x['records'] if r['heroId']==6)
          h=r['bundleSha256']
          r['bundleSha256']=('0' if h[0]!='0' else '1')+h[1:]
          p.write_text(json.dumps(x,indent=2)+'\n')
          PY
          set +e
          output="$(python bootstrap/materialize.py --hero-id 6 2>&1)"
          rc=$?
          set -e
          echo "$output"
          test $rc -ne 0
          grep -F "FAIL_SOURCE_HASH_MISMATCH" <<<"$output"
          trap - EXIT
          restore_net
          printf '{"status":"PASS_NEGATIVE_BAD_SOURCE_HASH","observed":"FAIL_SOURCE_HASH_MISMATCH"}\n' > negative-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: hero-sp-bootstrap-negative-hash
          path: /tmp/new-repo-negative-hash/negative-proof.json
          if-no-files-found: error
          retention-days: 7

  compare-independent-runs:
    needs: [consumer, negative-missing-contract, negative-bad-source-hash]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hero-sp-bootstrap-run-*
          path: /tmp/runs
      - uses: actions/download-artifact@v4
        with:
          pattern: hero-sp-bootstrap-negative-*
          path: /tmp/negative
      - name: Compare deterministic outputs
        run: |
          set -euo pipefail
          A=/tmp/runs/hero-sp-bootstrap-run-A
          B=/tmp/runs/hero-sp-bootstrap-run-B
          cmp "$A/generated/manifest.json" "$B/generated/manifest.json"
          for id in 6 13 29 37 56; do
            cmp "$A/generated/assets/heroes/$id.webp" "$B/generated/assets/heroes/$id.webp"
          done
          python - <<'PY'
          import hashlib,json,pathlib
          A=pathlib.Path('/tmp/runs/hero-sp-bootstrap-run-A')
          B=pathlib.Path('/tmp/runs/hero-sp-bootstrap-run-B')
          pa=json.loads((A/'run-proof.json').read_text())
          pb=json.loads((B/'run-proof.json').read_text())
          assert pa['bootstrapPackageSha256']==pb['bootstrapPackageSha256']
          assert pa['gitRemotes']==[] and pb['gitRemotes']==[]
          assert pa['manifestSha256']==pb['manifestSha256']
          assert pa['heroAssets']==pb['heroAssets']
          nm=json.loads(pathlib.Path('/tmp/negative/hero-sp-bootstrap-negative-missing/negative-proof.json').read_text())
          nh=json.loads(pathlib.Path('/tmp/negative/hero-sp-bootstrap-negative-hash/negative-proof.json').read_text())
          result={
            'schemaVersion':1,
            'status':'PASS_SP_BOOTSTRAP_ARCHITECTURE',
            'bootstrapPackageSha256':pa['bootstrapPackageSha256'],
            'independentRuns':['A','B'],
            'manifestSha256':pa['manifestSha256'],
            'heroAssets':pa['heroAssets'],
            'networkBoundary':'official-source-only-during-materialization',
            'assetIntakeRuntimePresent':False,
            'sourceRepositoryCheckoutPresentInConsumers':False,
            'negativeControls':[nm['status'],nh['status']]
          }
          pathlib.Path('/tmp/final-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hero-sp-bootstrap-architecture-proof
          path: /tmp/final-result.json
          if-no-files-found: error
          retention-days: 7
