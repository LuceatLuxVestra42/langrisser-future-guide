name: Equipment P3 Chronology Supersede

on:
  push:
    branches:
      - fix/equipment-p3-chronology-supersede
    paths:
      - 'data/validation/equipment-p3-0-release-chronology-presentation-audit.v2.json'
      - 'data/validation/equipment-p3-0-release-chronology-presentation-audit.v3.json'
      - 'data/presentation/equipment-p3-1-release-metadata.v1.json'
      - 'data/presentation/equipment-p3-1-release-metadata.v2.json'
      - 'data/presentation/equipment-display-collection.v1.json'
      - 'data/presentation/equipment-public-admission-correction.v1.json'
      - 'data/generated/equipment_stage3_3_general_list.json'
      - 'data/generated/equipment_stage3_4_general_detail.json'
      - 'data/generated/equipment_stage3_5_exclusive_consumer.json'
      - 'data/localization/equipment-name-kr/**'
      - 'scripts/build-equipment-name-kr-presentation.mjs'
      - 'scripts/validate-equipment-display-collection.mjs'
      - 'scripts/validate-equipment-p3-chronology-supersede.mjs'
      - 'src/lib/equipment-display-collection.ts'
      - 'src/lib/equipment-page.localized.server.ts'
      - '.github/workflows/equipment-p3-chronology-supersede.yml'
  pull_request:
    paths:
      - 'data/validation/equipment-p3-0-release-chronology-presentation-audit.v2.json'
      - 'data/validation/equipment-p3-0-release-chronology-presentation-audit.v3.json'
      - 'data/presentation/equipment-p3-1-release-metadata.v1.json'
      - 'data/presentation/equipment-p3-1-release-metadata.v2.json'
      - 'data/presentation/equipment-display-collection.v1.json'
      - 'data/presentation/equipment-public-admission-correction.v1.json'
      - 'data/generated/equipment_stage3_3_general_list.json'
      - 'data/generated/equipment_stage3_4_general_detail.json'
      - 'data/generated/equipment_stage3_5_exclusive_consumer.json'
      - 'data/localization/equipment-name-kr/**'
      - 'scripts/build-equipment-name-kr-presentation.mjs'
      - 'scripts/validate-equipment-display-collection.mjs'
      - 'scripts/validate-equipment-p3-chronology-supersede.mjs'
      - 'src/lib/equipment-display-collection.ts'
      - 'src/lib/equipment-page.localized.server.ts'
      - '.github/workflows/equipment-p3-chronology-supersede.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Korean equipment-name presentation projection
        run: node scripts/build-equipment-name-kr-presentation.mjs

      - name: Revalidate display collection predecessor
        run: bun scripts/validate-equipment-display-collection.mjs

      - name: Validate P3 chronology supersede contract
        run: bun scripts/validate-equipment-p3-chronology-supersede.mjs

      - name: Production build
        run: bun run build
