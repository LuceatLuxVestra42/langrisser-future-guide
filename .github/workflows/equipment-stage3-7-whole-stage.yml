name: Equipment Stage 3-7 Whole Stage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/equipment-stage3-7-whole-stage.yml'
      - 'scripts/validate-equipment-stage3-7-whole-stage.mjs'
      - 'data/contracts/equipment-stage3-7-whole-stage-validation.v1.json'
      - 'data/validation/equipment-stage3-0-input-summary.v1.json'
      - 'data/validation/equipment-stage3-1-schema-summary.v1.json'
      - 'data/validation/equipment-stage3-2-display-metadata-summary.v1.json'
      - 'data/validation/equipment-stage3-3-general-list-summary.v1.json'
      - 'data/validation/equipment-stage3-4-general-detail-summary.v1.json'
      - 'data/validation/equipment-stage3-5-exclusive-consumer-summary.v1.json'
      - 'data/validation/equipment-stage3-6-special-unresolved-summary.v1.json'
      - 'data/generated/equipment_stage2_7_acquisition.json'
      - 'data/generated/equipment_stage3_2_display_metadata.json'
      - 'data/generated/equipment_stage3_3_general_list.json'
      - 'data/generated/equipment_stage3_4_general_detail.json'
      - 'data/generated/equipment_stage3_5_exclusive_consumer.json'
      - 'data/generated/equipment_stage3_6_special_unresolved.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Equipment Stage 3 as a whole
        run: node scripts/validate-equipment-stage3-7-whole-stage.mjs
      - name: Persist Stage 3-7 final checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/equipment-stage3-7-whole-stage-summary.v1.json
          if git diff --cached --quiet; then
            echo "No Stage 3-7 changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 3-7 whole-stage checkpoint"
          git push
