name: Temporary A6 CaptainBaby UI Icon Exact Scan

on:
  push:
    branches:
      - diag/awakening-icon-a6-1113-coverage-20260910

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow
      - name: Scan official installer UI icon bundles for exact target path
        shell: bash
        run: |
          mkdir -p out/awakening-icon-a6-captain-ui-icon-scan
          python <<'PY'
          import binascii, hashlib, json, pathlib, struct, urllib.error, urllib.request, zlib, traceback
          import UnityPy

          OUT=pathlib.Path('out/awakening-icon-a6-captain-ui-icon-scan')
          VERSION='1.1.113'; BASE=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          TARGET='assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_captainbaby_3.png'
          META={'heroId':99235,'skillId':460775,'sourcePath':'UI/Icon/Skill_ABS/Skill_CaptainBaby_3.png'}
          MAX_PART=90; MISS_BREAK=8
          def norm(x): return str(x).replace('\\','/').strip('/').lower()
          def sha(b): return hashlib.sha256(b).hexdigest()
          def request(url,start=None,end=None):
            h={'User-Agent':UA,'Accept-Encoding':'identity'}
            if start is not None:h['Range']=f'bytes={start}-{end}'
            r=urllib.request.Request(url,headers=h)
            with urllib.request.urlopen(r,timeout=90) as x:data=x.read()
            if start is not None and len(data)!=end-start+1:raise RuntimeError('range mismatch')
            return data
          def head_size(url):
            r=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD')
            try:
              with urllib.request.urlopen(r,timeout=30) as x:return int(x.headers['Content-Length'])
            except urllib.error.HTTPError as e:
              if e.code in (403,404):return None
              raise
          def directory(url,total):
            n=min(131072,total);tail=request(url,total-n,total-1);p=tail.rfind(b'PK\x05\x06')
            if p<0:raise RuntimeError('EOCD missing')
            _,_,_,_,cs,co,_=struct.unpack_from('<HHHHIIH',tail,p+4);c=request(url,co,co+cs-1);out=[];i=0
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              flags,method=struct.unpack_from('<HH',c,i+8);crc,comp,uncomp=struct.unpack_from('<III',c,i+16)
              fl,el,cl=struct.unpack_from('<HHH',c,i+28);off=struct.unpack_from('<I',c,i+42)[0]
              name=c[i+46:i+46+fl].decode('utf-8' if flags&0x800 else 'cp437','replace')
              out.append({'name':name,'method':method,'crc32':f'{crc:08X}','compressedBytes':comp,'uncompressedBytes':uncomp,'localOffset':off})
              i+=46+fl+el+cl
            return out
          def fetch(url,e):
            off=e['localOffset'];hdr=request(url,off,off+4095);method=struct.unpack_from('<H',hdr,8)[0];fl,el=struct.unpack_from('<HH',hdr,26)
            start=off+30+fl+el;comp=request(url,start,start+e['compressedBytes']-1)
            raw=comp if method==0 else zlib.decompress(comp,-15) if method==8 else None
            if raw is None:raise RuntimeError(f'unsupported zip method {method}')
            if len(raw)!=e['uncompressedBytes']:raise RuntimeError('size mismatch')
            if f'{binascii.crc32(raw)&0xffffffff:08X}'!=e['crc32']:raise RuntimeError('crc mismatch')
            return raw
          def deref(v):return v.deref() if hasattr(v,'deref') else v

          result={'version':1,'schemaId':'awakening-icon-exact-positive-locator-scan/v1','status':'RUNNING','semanticReopen':False,
                  'source':{'kind':'OFFICIAL_INSTALLER','installVersion':VERSION,'base':BASE,'unityParser':'UnityPy==1.25.3'},
                  'target':META|{'expectedContainerPath':TARGET},'scanPolicy':'ui_icon bundle-name filter narrows positive search only; VERIFIED requires exact normalized container path + valid Sprite','scanned':[],'hits':[],'blockers':[]}
          code=0
          try:
            candidates=[];seen=False;miss=0
            for part in range(1,MAX_PART+1):
              package=f'InstallPage_{VERSION}_{part}.zip';url=f'{BASE}/{package}';total=head_size(url)
              if total is None:
                if seen:
                  miss+=1
                  if miss>=MISS_BREAK:break
                continue
              seen=True;miss=0
              for e in directory(url,total):
                low=norm(e['name']);base=low.rsplit('/',1)[-1]
                if '/streamingassets/exportassetbundle/' in low and base.endswith('.b') and 'ui_icon' in base:
                  candidates.append((part,package,url,e))
            for part,package,url,e in candidates:
              raw=fetch(url,e); rec={'packagePart':part,'packageName':package,'bundleEntry':e['name'],'bundleBytes':len(raw),'bundleSha256':sha(raw)}
              env=UnityPy.load(raw); exact=[]
              for cp,v in env.container.items():
                if norm(cp)!=TARGET:continue
                reader=deref(v);typ=getattr(getattr(reader,'type',None),'name',None);rb=reader.get_raw_data()
                h={**rec,'containerPath':str(cp).replace('\\','/'),'objectType':typ,'pathId':int(getattr(reader,'path_id',0) or 0),'rawObjectBytes':len(rb),'rawObjectSha256':sha(rb)}
                if typ=='Sprite':
                  img=reader.read().image.convert('RGBA');rgba=img.tobytes();bbox=img.getchannel('A').getbbox()
                  h.update({'width':img.width,'height':img.height,'rgbaSha256':sha(rgba),'alphaBbox':list(bbox) if bbox else None,'nonEmptyAlpha':bbox is not None})
                else:h.update({'width':None,'height':None,'rgbaSha256':None,'alphaBbox':None,'nonEmptyAlpha':False})
                exact.append(h);result['hits'].append(h)
              result['scanned'].append(rec|{'exactHitCount':len(exact)})
              if any(h['objectType']=='Sprite' and h['nonEmptyAlpha'] for h in exact):break
            sprites=[h for h in result['hits'] if h['objectType']=='Sprite' and h['nonEmptyAlpha']]
            keys={(h['width'],h['height'],h['rgbaSha256']) for h in sprites}
            result['summary']={'candidateBundleCount':len(candidates),'scannedBundleCount':len(result['scanned']),'exactHitCount':len(result['hits']),'validSpriteCount':len(sprites),'distinctValidSpriteRenderCount':len(keys)}
            if not sprites:result['status']='PASS_WITH_REVIEW';result['target']['resolution']='UNRESOLVED_IN_UI_ICON_SCAN'
            elif len(keys)!=1:result['status']='BLOCKER';result['target']['resolution']='AMBIGUOUS_NON_EQUIVALENT_EXACT_SPRITES';result['blockers']=[{'type':'AMBIGUOUS_NON_EQUIVALENT_EXACT_SPRITES','hits':sprites}];code=2
            else:result['status']='PASS';result['target']['resolution']='VERIFIED';result['target']['verifiedSprite']=sprites[0]
          except Exception as exc:
            result['status']='DIAGNOSTIC_ERROR';result['blockers']=[{'type':'DIAGNOSTIC_ERROR','message':f'{type(exc).__name__}:{exc}','traceback':traceback.format_exc()}];code=3
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':result['status'],'target':result['target'],'summary':result.get('summary'),'blockers':result['blockers']},ensure_ascii=False,indent=2))
          raise SystemExit(code)
          PY
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awakening-icon-a6-captain-ui-icon-scan
          path: out/awakening-icon-a6-captain-ui-icon-scan
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-awakening-icon-a6-captain-ui-icon-scan.yml
          git commit -m "Remove temporary A6 CaptainBaby scan"
          git push origin HEAD:${GITHUB_REF_NAME}
