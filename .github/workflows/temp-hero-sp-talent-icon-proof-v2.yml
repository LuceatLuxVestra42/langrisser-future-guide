name: Temporary Hero SP Talent Icon Official Proof V2

on:
  push:
    branches: [work/hero-sp-talent-icons-proof-20260916]
    paths: [.github/workflows/temp-hero-sp-talent-icon-proof-v2.yml]

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow
      - name: Prove and materialize using frozen awakening companion policy
        shell: bash
        run: |
          set +e
          python <<'PY'
          import binascii,hashlib,json,pathlib,struct,traceback,urllib.error,urllib.request,zlib
          import UnityPy
          OUT=pathlib.Path('out/hero-sp-talent-icon-proof-v2'); OUT.mkdir(parents=True,exist_ok=True)
          RESULT=OUT/'proof.json'; EXIT=OUT/'exit-code.txt'; MATERIAL=pathlib.Path('data/generated/hero-skill-icon-sp-talent-materialization.v1.json')
          ROOT='assets/gameproject/runtimeassets'; UA='Mozilla/5.0'; PREFIX={'UI/Icon/Skill_ABS/':'ui_icon_skill_abs','UI/Icon/Skill2_ABS/':'ui_icon_skill2_abs'}
          def rj(p): return json.loads(pathlib.Path(p).read_text(encoding='utf-8'))
          def norm(v): return str(v).replace('\\','/').strip('/').lower()
          def sha(b): return hashlib.sha256(b).hexdigest()
          def csha(v): return sha(json.dumps(v,ensure_ascii=False,separators=(',',':')).encode())
          def req(url,a=None,b=None):
            h={'User-Agent':UA,'Accept-Encoding':'identity'}
            if a is not None:h['Range']=f'bytes={a}-{b}'
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=90) as x:d=x.read()
            if a is not None and len(d)!=b-a+1: raise RuntimeError('range mismatch')
            return d
          def hsize(url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=45) as x:return int(x.headers['Content-Length'])
            except urllib.error.HTTPError as e:
              if e.code in (403,404):return None
              raise
          def zdir(url,total):
            n=min(131072,total); tail=req(url,total-n,total-1); p=tail.rfind(b'PK\x05\x06')
            if p<0:raise RuntimeError('EOCD missing')
            _,_,_,_,cs,co,_=struct.unpack_from('<HHHHIIH',tail,p+4); c=req(url,co,co+cs-1); out=[]; i=0
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              flags,method=struct.unpack_from('<HH',c,i+8); crc,cb,ub=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nb=c[i+46:i+46+fn]; name=nb.decode('utf-8' if flags&0x800 else 'cp437','replace'); out.append({'name':name,'method':method,'crc32':f'{crc:08X}','compressedBytes':cb,'uncompressedBytes':ub,'localOffset':lo}); i+=46+fn+ex+cm
            return out
          def zentry(url,e):
            o=e['localOffset']; h=req(url,o,o+4095); m=struct.unpack_from('<H',h,8)[0]; fn,ex=struct.unpack_from('<HH',h,26); s=o+30+fn+ex; c=req(url,s,s+e['compressedBytes']-1); raw=c if m==0 else zlib.decompress(c,-15) if m==8 else None
            if raw is None or len(raw)!=e['uncompressedBytes'] or f'{binascii.crc32(raw)&0xffffffff:08X}'!=e['crc32']:raise RuntimeError('ZIP entry integrity failure')
            return raw
          def rel(p):
            a,b=norm(p),norm(ROOT); return a[len(b)+1:] if a.startswith(b+'/') else None
          def reader(v): return v.deref() if hasattr(v,'deref') else v
          result={'schemaId':'hero-sp-talent-icon-official-proof/v2','status':'RUNNING','blockers':[]}; code=0
          try:
            sp=rj('data/generated/hero-page-stage5-4-sp.v1.json'); manifest=rj('data/generated/hero-skill-icon-assets.v1.json'); src=manifest['source']; version=str(src['installVersion']); base=str(src['base']).rstrip('/')
            targets={}; released=usage=0
            for h in sp['records']:
              s=h.get('sp') or {}
              if s.get('status')!='RELEASED':continue
              released+=1; prog=((s.get('talent') or {}).get('starProgression') or [])
              if len(prog)!=6:raise RuntimeError(f"SP progression count mismatch hero={h['heroId']}")
              for x in prog:
                usage+=1; p=(x.get('skill') or {}).get('iconPath'); stem=next((v for k,v in PREFIX.items() if isinstance(p,str) and p.startswith(k)),None)
                if not stem:raise RuntimeError(f'unsupported/missing SP iconPath {p}')
                t=targets.setdefault(p,{'sourcePath':p,'bundleStem':stem,'usageCount':0,'heroIds':set(),'skillIds':set(),'stars':set()}); t['usageCount']+=1;t['heroIds'].add(int(h['heroId']));t['skillIds'].add(int(x['skillId']));t['stars'].add(int(x['star']))
            if released!=25 or usage!=150 or len(targets)!=25:raise RuntimeError(f'population drift released={released} usage={usage} unique={len(targets)}')
            nt={norm(k):v for k,v in targets.items()}; hits={k:[] for k in nt}; stems={v['bundleStem'] for v in nt.values()}; candidates=[]; seen=False; miss=0
            for part in range(1,91):
              pn=f'InstallPage_{version}_{part}.zip'; url=f'{base}/{pn}'; total=hsize(url)
              if total is None:
                if seen:
                  miss+=1
                  if miss>=8:break
                continue
              seen=True;miss=0
              for e in zdir(url,total):
                bn=norm(e['name']).rsplit('/',1)[-1]; stem=next((s for s in stems if bn.endswith(s+'.b')),None)
                if stem:candidates.append((part,pn,url,e,stem))
            bundle_inputs=[]
            for part,pn,url,e,stem in candidates:
              raw=zentry(url,e); bsha=sha(raw); env=UnityPy.load(raw); bundle_inputs.append({'packagePart':part,'packageName':pn,'bundleEntry':e['name'],'bundleSha256':bsha,'bundleStem':stem})
              for cp,v in env.container.items():
                rp=rel(cp); t=nt.get(rp)
                if t is None or t['bundleStem']!=stem:continue
                rr=reader(v); typ=getattr(getattr(rr,'type',None),'name',None); hit={'containerPath':str(cp).replace('\\','/'),'objectType':typ,'packagePart':part,'packageName':pn,'bundleEntry':e['name'],'bundleSha256':bsha,'pathId':int(getattr(rr,'path_id',0) or 0)}
                if typ=='Sprite':
                  try:
                    rawobj=rr.get_raw_data(); im=rr.read().image.convert('RGBA'); bbox=im.getchannel('A').getbbox(); hit.update({'decodeStatus':'PASS','rawObjectSha256':sha(rawobj),'width':im.width,'height':im.height,'rgbaSha256':sha(im.tobytes()),'nonEmptyAlpha':bbox is not None,'image':im})
                  except Exception as ex: hit.update({'decodeStatus':'FAIL','decodeError':f'{type(ex).__name__}:{ex}'})
                hits[rp].append(hit)
            blockers=[]; reviews=[]; records=[]
            for rp,t in sorted(nt.items(),key=lambda kv:kv[1]['sourcePath']):
              exact=hits[rp]; sprites=[h for h in exact if h['objectType']=='Sprite']; companions=[{'containerPath':h['containerPath'],'objectType':h['objectType'],'pathId':h['pathId']} for h in exact if h['objectType']!='Sprite']
              if not exact:blockers.append(f"NO_EXACT_HIT:{t['sourcePath']}");continue
              if not sprites:blockers.append(f"TYPE_MISMATCH_NO_SPRITE_EXACT_HIT:{t['sourcePath']}");continue
              if any(h.get('decodeStatus')!='PASS' or not h.get('nonEmptyAlpha') for h in sprites):blockers.append(f"SPRITE_DECODE_OR_ALPHA_FAIL:{t['sourcePath']}");continue
              keys={(h['width'],h['height'],h['rgbaSha256']) for h in sprites}
              if len(keys)!=1:blockers.append(f"AMBIGUOUS_NON_EQUIVALENT_EXACT_SOURCES:{t['sourcePath']}");continue
              chosen=sorted(sprites,key=lambda h:(h['packagePart'],h['bundleEntry'],h['containerPath']))[0]; public='/images/heroes/skill-icons/'+pathlib.PurePosixPath(t['sourcePath']).name; fp=pathlib.Path('public'+public); fp.parent.mkdir(parents=True,exist_ok=True); chosen['image'].save(fp); pb=fp.read_bytes()
              records.append({'role':'sp-talent','sourcePath':t['sourcePath'],'usageCount':t['usageCount'],'heroIds':sorted(t['heroIds']),'skillIds':sorted(t['skillIds']),'stars':sorted(t['stars']),'verificationOwner':'OFFICIAL_INSTALLER_EXACT_RUNTIME_PATH_UNITY_SPRITE','packagePart':chosen['packagePart'],'packageName':chosen['packageName'],'bundleEntry':chosen['bundleEntry'],'bundleSha256':chosen['bundleSha256'],'containerPath':chosen['containerPath'],'objectType':'Sprite','pathId':chosen['pathId'],'rawObjectSha256':chosen['rawObjectSha256'],'rgbaSha256':chosen['rgbaSha256'],'width':chosen['width'],'height':chosen['height'],'publicPath':public,'pngBytes':len(pb),'pngSha256':sha(pb),'nonSpriteExactPathCompanionCount':len(companions)})
            result.update({'source':{'kind':'OFFICIAL_INSTALLER','installVersion':version,'base':base,'unityParser':'UnityPy==1.25.3','unityContainerRootPrefix':ROOT},'authority':{'spSource':'data/generated/hero-page-stage5-4-sp.v1.json','exactField':'sp.talent.starProgression[].skill.iconPath','semanticRecomputation':False,'nameJoin':False,'idArithmetic':False},'verificationPolicy':{'proofRequirement':'full normalized runtime relative path equality + at least one Sprite exact hit + decoded RGBA + non-empty alpha','nonSpriteExactPathCompanions':'recorded but do not invalidate a valid Sprite exact hit','predecessorContract':'awakening A6-6 frozen verifier'},'summary':{'spReleasedCount':released,'spTalentUsageCount':usage,'targetUniqueIconPathCount':len(targets),'provedCount':len(records),'missingCount':len(blockers)},'blockers':blockers,'reviews':reviews})
            if blockers:result['status']='BLOCKER';code=2
            else:
              mat={'version':1,'schemaId':'hero-skill-icon-sp-talent-materialization/v1','status':'FROZEN','completion':'COMPLETE','semanticReopen':False,'lookupAuthority':'exact sp.talent.starProgression[].skill.iconPath only','source':result['source'],'authority':result['authority'],'verificationPolicy':result['verificationPolicy'],'summary':result['summary'],'records':records};mat['materializationSetSha256']=csha(records);MATERIAL.write_text(json.dumps(mat,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');result['materializationSetSha256']=mat['materializationSetSha256'];result['status']='PASS'
            RESULT.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          except Exception as ex:
            result['status']='DIAGNOSTIC_ERROR';result['blockers']=[f'{type(ex).__name__}:{ex}'];result['traceback']=traceback.format_exc();RESULT.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');code=3
          EXIT.write_text(str(code)+'\n',encoding='utf-8');print(json.dumps({'status':result['status'],'summary':result.get('summary'),'blockers':result.get('blockers')},ensure_ascii=False,indent=2))
          PY
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: hero-sp-talent-icon-official-proof-v2, path: out/hero-sp-talent-icon-proof-v2, retention-days: 7}
      - name: Fail closed or commit materialization
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat out/hero-sp-talent-icon-proof-v2/exit-code.txt 2>/dev/null || echo 99)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-hero-sp-talent-icon-proof-v2.yml
          if [ "$code" != "0" ]; then git commit -m "Remove failed temporary SP talent icon proof v2"; git push origin HEAD:${GITHUB_REF_NAME}; exit "$code"; fi
          python <<'PY'
          import subprocess,sys
          paths=[]
          for row in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines(): paths.append(row[3:].split(' -> ',1)[-1])
          allowed=lambda p:p=='.github/workflows/temp-hero-sp-talent-icon-proof-v2.yml' or p=='data/generated/hero-skill-icon-sp-talent-materialization.v1.json' or p.startswith('public/images/heroes/skill-icons/')
          bad=[p for p in paths if not allowed(p)]
          if bad:print(bad,file=sys.stderr);raise SystemExit(1)
          if 'data/generated/hero-skill-icon-sp-talent-materialization.v1.json' not in paths:raise SystemExit('missing materialization')
          print('\n'.join(paths))
          PY
          git add data/generated/hero-skill-icon-sp-talent-materialization.v1.json public/images/heroes/skill-icons
          git commit -m "Materialize verified SP talent skill icons"
          git push origin HEAD:${GITHUB_REF_NAME}
