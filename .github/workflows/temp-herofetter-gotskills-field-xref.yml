name: Temporary HeroFetter GotSkills field xref
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build partial dump from official client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hfgs out/herofetter-field-xref
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib
          D=pathlib.Path('/tmp/hfgs'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ent(u,hs(u)) if e[0]==target); (D/out).write_bytes(get(u,e))
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release >/dev/null 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/hfgs/dump
          set +e
          dotnet "$DLL" /tmp/hfgs/GameAssembly.dll /tmp/hfgs/global-metadata.dat /tmp/hfgs/dump > out/herofetter-field-xref/dumper.log 2>&1
          set -e
          test -f /tmp/hfgs/dump/script.json
          test -f /tmp/hfgs/dump/dump.cs
      - name: Find native users of HeroFetter GotSkills backing field
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json,pathlib,re,subprocess
          D=pathlib.Path('/tmp/hfgs/dump'); O=pathlib.Path('out/herofetter-field-xref'); EXE='/tmp/hfgs/GameAssembly.dll'
          script=json.loads((D/'script.json').read_text(errors='replace'))
          rows=[]
          def walk(x):
            if isinstance(x,dict):
              n=x.get('Name'); a=x.get('Address'); s=x.get('Signature')
              if isinstance(n,str) and isinstance(a,(int,float)): rows.append((int(a),n,s or ''))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(script); rows=sorted(set(rows),key=lambda x:x[0]); byaddr={}
          for r in rows: byaddr.setdefault(r[0],[]).append(r)
          candidates=[r for r in rows if 'BlackJack_ConfigData_ConfigDataHeroFetterInfo_o*' in r[2] or 'ConfigDataHeroFetterInfo$$get_GotSkills_ID' in r[1]]
          out=[]
          for a,n,s in candidates:
            nxt=min([x for x,_,_ in rows if x>a],default=a+0x1200); stop=min(max(nxt,a+0x80),a+0x1800)
            def od(st,en):
              return subprocess.run(['objdump','-d','-Mintel',f'--start-address={st}',f'--stop-address={en}',EXE],capture_output=True,text=True,errors='replace').stdout
            text=od(0x180000000+a,0x180000000+stop)
            if len(text.splitlines())<8: text=od(a,stop)
            # direct +0x48 dereferences, plus calls around them
            lines=text.splitlines(); hitidx=[i for i,l in enumerate(lines) if re.search(r'\[[^\]]+\+0x48\]',l)]
            # calls in function mapped to exact script addresses
            calls=[]
            for i,l in enumerate(lines):
              m=re.search(r'\bcall\s+([0-9a-fA-Fx]+)',l)
              if not m: continue
              raw=int(m.group(1),16); rva=raw-0x180000000 if raw>=0x180000000 else raw
              calls.append({'line':l.strip(),'rva':hex(rva),'matches':[{'name':q[1],'signature':q[2]} for q in byaddr.get(rva,[])[:10]]})
            if hitidx or 'get_GotSkills_ID' in n:
              windows=['\n'.join(lines[max(0,i-16):min(len(lines),i+36)]) for i in hitidx[:10]]
              out.append({'address':hex(a),'name':n,'signature':s,'field48HitCount':len(hitidx),'windows':windows,'calls':calls})
          # independently list SkillInfo-returning int-parameter accessors for exact call matching
          skill=[{'address':hex(a),'name':n,'signature':s} for a,n,s in rows if 'BlackJack_ConfigData_ConfigDataSkillInfo_o*' in s and 'int32_t' in s]
          result={'status':'TRACE_COMPLETE','heroFetterMethodCount':len(candidates),'fieldUsers':out,'skillInfoIntAccessors':skill[:1000]}
          (O/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('HEROFETTER_METHOD_COUNT',len(candidates)); print('FIELD_USER_COUNT',len(out))
          for x in out:
            print('FIELD_USER',json.dumps({k:x[k] for k in ['address','name','signature','field48HitCount']},ensure_ascii=False))
            for w in x['windows']: print('WINDOW_BEGIN\n'+w+'\nWINDOW_END')
            for c in x['calls']: print('CALL',json.dumps(c,ensure_ascii=False))
          print('SKILLINFO_INT_ACCESSOR_COUNT',len(skill))
          for x in skill[:200]: print('SKILL_ACCESS',json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herofetter-field-xref
          path: out/herofetter-field-xref
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-herofetter-gotskills-field-xref.yml
          git commit -m "Remove temporary HeroFetter GotSkills field xref"
          git push origin HEAD:${GITHUB_REF_NAME}
