name: Hero B5 hosted and browser QA

on:
  push:
    branches:
      - b5-hosted-browser-qa
    paths:
      - '.github/workflows/hero-b5-hosted-browser-qa.yml'
      - 'scripts/validate_hero_b5_browser_ui.mjs'
      - 'data/contracts/hero-b5-hosted-browser-qa.v1.json'

permissions:
  contents: write

concurrency:
  group: hero-b5-hosted-browser-qa
  cancel-in-progress: true

env:
  HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/

jobs:
  hosted-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact B5 candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-linux-x64.zip

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Confirm B4 predecessor boundary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 48678e8198387ffc31fe0ffdd36ce1e47c623857 HEAD
          grep -q 'data-hero-final-job-stats="true"' src/components/hero-final-job-stats-section.tsx
          grep -q 'data-final-job-source={data.sourceStage}' src/components/hero-final-job-stats-section.tsx
          grep -q 'getHeroFinalJobStatsPresentation' 'src/routes/heroes_.$heroId.tsx'
          if grep -q 'finalJobBranches = detail.jobs.branches.filter' 'src/routes/heroes_.$heroId.tsx'; then
            echo 'Legacy frontend Tier4 filter returned' >&2
            exit 1
          fi

      - name: Build GitHub Pages candidate
        run: |
          set -euo pipefail
          node scripts/build-equipment-name-kr-presentation.mjs
          bunx vite build --config vite.config.pages.ts
          test -f dist/client/heroes/6/index.html
          grep -q 'data-hero-final-job-stats="true"' dist/client/heroes/6/index.html
          grep -q 'data-final-job-source="hero-b3-final-job-extrema-consumer"' dist/client/heroes/6/index.html
          grep -q '湮黯青龙' dist/client/heroes/6/index.html
          grep -q '>4041<' dist/client/heroes/6/index.html
          cp dist/client/index.html dist/client/404.html
          cat > dist/client/authoritative-pages-source.json <<JSON
          {
            "status": "AUTHORITATIVE_GITHUB_PAGES_DEPLOYMENT",
            "sourceSha": "${GITHUB_SHA}",
            "sourceRef": "${GITHUB_REF_NAME}",
            "b4PredecessorSha": "48678e8198387ffc31fe0ffdd36ce1e47c623857",
            "b3Consumer": "data/generated/hero-final-job-extrema.v1.json",
            "semanticRecomputed": false,
            "publisher": ".github/workflows/hero-b5-hosted-browser-qa.yml"
          }
          JSON

      - name: Publish exact B5 candidate to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist/client
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "B5 hosted candidate ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Strict hosted QA with bounded propagation retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Strict hosted QA attempt ${attempt}/12"
            set +e
            output="$(node tools/route-hosted-qa/cli/check.mjs --expected-sha "${GITHUB_SHA}" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 4 ] || ! grep -q '"status":"FAIL_STALE_DEPLOYMENT"' <<<"$output"; then
              exit "$status"
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          exit 4

      - name: Install Chromium browser QA runtime
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Browser UI QA
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/validate_hero_b5_browser_ui.mjs

      - name: Assert repository remained read-only after QA
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- bun.lock 2>/dev/null || true
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"
