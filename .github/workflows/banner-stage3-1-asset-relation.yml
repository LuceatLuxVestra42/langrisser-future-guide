name: Banner Stage 3-1 Asset Relation

on:
  push:
    paths:
      - '.github/workflows/banner-stage3-1-asset-relation.yml'
      - 'scripts/finalize-banner-stage3-1-asset-relation.mjs'
      - 'scripts/validate-banner-stage3-1-asset-relation.mjs'
      - 'data/contracts/banner-stage3-1-asset-relation.v1.json'
      - 'data/validation/banner-stage3-0-input-summary.v1.json'
      - 'data/generated/banner-definitions.v1.json'
      - 'data/generated/banner-occurrences.v1.json'
      - 'public/images/banners/Banner/**'
      - 'public/images/banners/Picture_Notice/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Banner Stage 3-1 asset relations
        run: node scripts/finalize-banner-stage3-1-asset-relation.mjs
      - name: Validate Banner Stage 3-1 asset relations
        run: node scripts/validate-banner-stage3-1-asset-relation.mjs
      - name: Persist Banner Stage 3-1 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/banner-stage3-1-asset-relations.v1.json data/validation/banner-stage3-1-asset-summary.v1.json
          if git diff --cached --quiet; then
            echo "No Banner Stage 3-1 checkpoint changes"
            exit 0
          fi
          git commit -m "Freeze Banner Stage 3-1 asset relation checkpoint"
          git push
