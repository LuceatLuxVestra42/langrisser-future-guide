name: Hero Exclusive Equipment Relation Stage B-5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-exclusive-equipment-relation-stageB5.yml'
      - 'scripts/build_hero_exclusive_equipment_relation_stageB5.cjs'
      - 'scripts/validate_hero_exclusive_equipment_relation_stageB5.cjs'
      - 'data/contracts/hero-exclusive-equipment-relation-index-contract.v1.json'
      - 'data/generated/hero-exclusive-equipment-relations.v1.json'
      - 'data/validation/hero-exclusive-equipment-relation-stageB4-validation.v1.json'

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Stage B-5 bidirectional indexes
        run: node scripts/build_hero_exclusive_equipment_relation_stageB5.cjs
      - name: Validate Stage B-5 round-trip parity
        run: node scripts/validate_hero_exclusive_equipment_relation_stageB5.cjs
      - name: Persist Stage B-5 indexes and validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/hero-exclusive-equipment-by-hero.v1.json data/generated/hero-exclusive-equipment-by-equipment.v1.json data/validation/hero-exclusive-equipment-relation-stageB5-index-summary.v1.json
          if git diff --cached --quiet; then
            echo "No Stage B-5 changes"
            exit 0
          fi
          git commit -m "Freeze Stage B-5 bidirectional exclusive equipment indexes"
          git push
