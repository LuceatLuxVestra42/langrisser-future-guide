name: Audit Soldier Portrait Sizes

on:
  push:
    branches:
      - work/soldier-sp-ability-display
    paths:
      - '.github/workflows/audit-soldier-portrait-size.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate portrait size statistics
        run: |
          node <<'NODE'
          const m = require('./data/generated/soldier-portrait-manifest.v9.json');
          const rows = m.records.map(r => ({id:r.soldierId, size:r.size, width:r.width, height:r.height, isSp:r.isSp, name:r.nameKr || r.presentationNameEvidence || r.chineseName}));
          if (rows.length !== 224) throw new Error(`count ${rows.length}`);
          const sizes = rows.map(r=>r.size).sort((a,b)=>a-b);
          const sum = sizes.reduce((a,b)=>a+b,0);
          const mean = sum/sizes.length;
          const median = (sizes[111]+sizes[112])/2;
          const pct = p => sizes[Math.min(sizes.length-1, Math.ceil(sizes.length*p)-1)];
          const countAbove = n => sizes.filter(x=>x>n).length;
          const top = [...rows].sort((a,b)=>b.size-a.size).slice(0,15);
          const out = {
            count: rows.length,
            totalBytes: sum,
            totalMiB: sum/1024/1024,
            meanBytes: mean,
            meanKiB: mean/1024,
            medianBytes: median,
            medianKiB: median/1024,
            p75KiB: pct(.75)/1024,
            p90KiB: pct(.90)/1024,
            p95KiB: pct(.95)/1024,
            maxBytes: sizes[sizes.length-1],
            maxMiB: sizes[sizes.length-1]/1024/1024,
            over200KB: countAbove(200*1024),
            over300KB: countAbove(300*1024),
            over500KB: countAbove(500*1024),
            over1MB: countAbove(1024*1024),
            under150KB: sizes.filter(x=>x<=150*1024).length,
            top
          };
          console.log('PORTRAIT_SIZE_AUDIT=' + JSON.stringify(out));
          NODE
