name: Leon Fullart Reference Materialize V2

on:
  push:
    branches:
      - work/leon-fullart-reference-v2
    paths:
      - .github/workflows/leon-fullart-reference-materialize-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLD_LEON_REF: 0379c262408d2fd3eb0a39b4e298fab531df415c
      RENDER_PREDECESSOR: bccbdb564b3b2a70aeacfe6014f3829fdc7b09af
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/leon-fullart-reference-v2
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: EsotericSoftware/spine-runtimes
          ref: 1c1936532527900f74cfb58f7002998bf157b254
          path: .runtime/spine-runtimes
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Execute bounded V1 implementation with repository-compatible npm setup
        run: |
          python - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('.github/workflows/leon-fullart-reference-materialize.yml').read_text(encoding='utf-8'))
          by_name={s.get('name'):s for s in doc['jobs']['materialize']['steps'] if s.get('name')}
          names=[
            'Install bounded render dependencies',
            'Restore frozen Leon source evidence and verified renderer recipe',
            'Render exact current-official Leon fullart set',
            'Materialize optimized WebP assets and frozen manifest',
            'Add read-only fullart validator and generated client consumer',
            'Replace legacy Skin card consumption with fullart manifest consumer',
            'Admit explicit fullart owner and validator into Project Check',
            'Freeze independent fullart validation result',
            'Install frontend dependencies',
            'Commit locally then run changed-path Project Check',
            'Push validated reference implementation',
          ]
          env=os.environ.copy()
          for name in names:
              script=by_name[name]['run']
              if name=='Install frontend dependencies':
                  script='npm install --no-package-lock --no-audit --no-fund'
              if name=='Commit locally then run changed-path Project Check':
                  script=script.replace(
                      "grep -v '^.github/workflows/leon-fullart-reference-materialize.yml$'",
                      "grep -Ev '^.github/workflows/leon-fullart-reference-materialize(-v2)?\\.yml$'",
                  )
              print(f'::group::{name}')
              subprocess.run(['bash','-e','-c',script],check=True,env=env)
              print('::endgroup::')
          PY
