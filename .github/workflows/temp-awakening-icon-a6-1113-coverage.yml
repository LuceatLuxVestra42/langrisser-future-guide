name: Temporary A6 Awakening Icon Official Snapshot Coverage

on:
  push:
    branches:
      - diag/awakening-icon-a6-1113-coverage-20260910

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow
      - name: Measure awakening icon coverage against official installer 1.1.113
        shell: bash
        run: |
          set +e
          mkdir -p out/awakening-icon-a6-1113-coverage
          python <<'PY'
          import binascii, hashlib, json, pathlib, struct, traceback, urllib.error, urllib.request, zlib
          import UnityPy

          OUT = pathlib.Path('out/awakening-icon-a6-1113-coverage')
          RESULT = OUT / 'result.json'
          VERSION = '1.1.113'
          BASE = f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}'
          ROOT_PREFIX = 'assets/gameproject/runtimeassets'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          MAX_PART, MISS_BREAK = 90, 8

          def norm(v): return str(v).replace('\\', '/').strip('/').lower()
          def sha256(data): return hashlib.sha256(data).hexdigest()
          def request(url, start=None, end=None):
              headers = {'User-Agent': UA, 'Accept-Encoding': 'identity'}
              if start is not None: headers['Range'] = f'bytes={start}-{end}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as r: data = r.read()
              if start is not None and len(data) != end - start + 1: raise RuntimeError('range mismatch')
              return data
          def head_size(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Encoding': 'identity'}, method='HEAD')
              try:
                  with urllib.request.urlopen(req, timeout=45) as r: return int(r.headers['Content-Length'])
              except urllib.error.HTTPError as e:
                  if e.code in (403, 404): return None
                  raise
          def zip_directory(url, total):
              tail_size = min(131072, total)
              tail = request(url, total - tail_size, total - 1)
              eocd = tail.rfind(b'PK\x05\x06')
              if eocd < 0: raise RuntimeError('EOCD missing')
              _, _, _, _, central_size, central_offset, _ = struct.unpack_from('<HHHHIIH', tail, eocd + 4)
              central = request(url, central_offset, central_offset + central_size - 1)
              entries, i = [], 0
              while i + 46 <= len(central) and central[i:i+4] == b'PK\x01\x02':
                  flags, method = struct.unpack_from('<HH', central, i + 8)
                  crc, compressed, uncompressed = struct.unpack_from('<III', central, i + 16)
                  fn_len, extra_len, comment_len = struct.unpack_from('<HHH', central, i + 28)
                  local_offset = struct.unpack_from('<I', central, i + 42)[0]
                  name_bytes = central[i+46:i+46+fn_len]
                  name = name_bytes.decode('utf-8' if flags & 0x800 else 'cp437', 'replace')
                  entries.append({'name': name, 'method': method, 'crc32': f'{crc:08X}', 'compressedBytes': compressed, 'uncompressedBytes': uncompressed, 'localOffset': local_offset})
                  i += 46 + fn_len + extra_len + comment_len
              return entries
          def fetch_zip_entry(url, entry):
              offset = entry['localOffset']
              header = request(url, offset, offset + 4095)
              method = struct.unpack_from('<H', header, 8)[0]
              fn_len, extra_len = struct.unpack_from('<HH', header, 26)
              start = offset + 30 + fn_len + extra_len
              compressed = request(url, start, start + entry['compressedBytes'] - 1)
              raw = compressed if method == 0 else zlib.decompress(compressed, -15) if method == 8 else None
              if raw is None: raise RuntimeError(f'unsupported compression {method}')
              if len(raw) != entry['uncompressedBytes']: raise RuntimeError('uncompressed size mismatch')
              if f'{binascii.crc32(raw) & 0xffffffff:08X}' != entry['crc32']: raise RuntimeError('CRC mismatch')
              return raw
          def runtime_relative(path):
              actual, prefix = norm(path), norm(ROOT_PREFIX)
              return actual[len(prefix)+1:] if actual.startswith(prefix + '/') else None
          def reader_of(value): return value.deref() if hasattr(value, 'deref') else value

          result = {
              'version': 1,
              'schemaId': 'awakening-icon-official-snapshot-coverage/v1',
              'status': 'RUNNING',
              'semanticReopen': False,
              'source': {'kind': 'OFFICIAL_INSTALLER', 'installVersion': VERSION, 'base': BASE, 'unityParser': 'UnityPy==1.25.3'},
              'locatorPolicy': 'bundle basename narrows I/O only; VERIFIED requires an exact normalized container path hit',
              'summary': {},
              'packageCatalog': {},
              'verified': [],
              'notInInstallerSnapshot': [],
              'blockers': []
          }
          code = 0
          try:
              detail = json.loads(pathlib.Path('data/generated/hero-detail.v1.json').read_text(encoding='utf-8'))
              if detail.get('status') != 'PASS_WITH_REVIEW' or detail.get('completion') != 'COMPLETE': raise RuntimeError('Hero detail frozen consumer is not complete')
              storage = detail.get('storage', {}).get('byHeroId')
              if not isinstance(storage, dict) or len(storage) != 267: raise RuntimeError('Hero detail shard index mismatch')

              targets = {}
              not_defined = 0
              for hero_id_text, locator in storage.items():
                  hero_id = int(hero_id_text)
                  shard = json.loads(pathlib.Path(locator['path']).read_text(encoding='utf-8'))
                  awakening = shard.get('normal', {}).get('awakening')
                  if not awakening: raise RuntimeError(f'Hero {hero_id} awakening block missing')
                  state = awakening.get('level2Status')
                  if state == 'LEVEL2_SKILL_NOT_DEFINED':
                      not_defined += 1
                      continue
                  if state != 'DEFINED' or awakening.get('status') != 'VERIFIED' or not awakening.get('skill'):
                      raise RuntimeError(f'Hero {hero_id} awakening state mismatch')
                  skill = awakening['skill']
                  if awakening.get('level2SkillId') != skill.get('skillId'): raise RuntimeError(f'Hero {hero_id} skill ID parity mismatch')
                  source_path = skill.get('iconPath')
                  if not isinstance(source_path, str) or not source_path: raise RuntimeError(f'Hero {hero_id} iconPath missing')
                  rel = norm(source_path)
                  if not rel.startswith('ui/icon/'): raise RuntimeError(f'Hero {hero_id} unexpected icon source root {source_path}')
                  if rel in targets: raise RuntimeError(f'duplicate normalized awakening icon path {source_path}')
                  targets[rel] = {'heroId': hero_id, 'skillId': skill['skillId'], 'sourcePath': source_path}

              if len(targets) != 257 or not_defined != 10: raise RuntimeError(f'awakening population mismatch defined={len(targets)} notDefined={not_defined}')

              parent_dirs = sorted({rel.rsplit('/', 1)[0] for rel in targets})
              candidate_basenames = sorted({parent.replace('/', '_') + '.b' for parent in parent_dirs})
              candidate_basename_set = set(candidate_basenames)
              result['targetPopulation'] = {'defined': len(targets), 'notDefined': not_defined, 'parentDirs': parent_dirs, 'candidateBundleBasenames': candidate_basenames}

              seen, miss, package_count, candidates = False, 0, 0, []
              for part in range(1, MAX_PART + 1):
                  package_name = f'InstallPage_{VERSION}_{part}.zip'
                  url = f'{BASE}/{package_name}'
                  total = head_size(url)
                  if total is None:
                      if seen:
                          miss += 1
                          if miss >= MISS_BREAK: break
                      continue
                  seen, miss = True, 0
                  package_count += 1
                  for entry in zip_directory(url, total):
                      basename = norm(entry['name']).rsplit('/', 1)[-1]
                      if basename in candidate_basename_set:
                          candidates.append((part, package_name, url, entry, basename))

              result['packageCatalog'] = {
                  'officialPackageCount': package_count,
                  'candidateBundleEntryCount': len(candidates),
                  'candidateBundleEntries': [{'packagePart': p, 'packageName': n, 'bundleEntry': e['name'], 'bundleBasename': b} for p, n, _, e, b in candidates]
              }

              hits_by_rel = {rel: [] for rel in targets}
              for part, package_name, url, entry, basename in candidates:
                  raw = fetch_zip_entry(url, entry)
                  bundle_sha = sha256(raw)
                  env = UnityPy.load(raw)
                  for container_path, value in env.container.items():
                      rel = runtime_relative(container_path)
                      if rel not in targets: continue
                      reader = reader_of(value)
                      object_type = getattr(getattr(reader, 'type', None), 'name', None)
                      raw_obj = reader.get_raw_data()
                      hit = {
                          'packagePart': part,
                          'packageName': package_name,
                          'bundleEntry': entry['name'],
                          'bundleBasename': basename,
                          'bundleBytes': len(raw),
                          'bundleSha256': bundle_sha,
                          'containerPath': str(container_path).replace('\\', '/'),
                          'normalizedRuntimePath': rel,
                          'objectType': object_type,
                          'pathId': int(getattr(reader, 'path_id', 0) or 0),
                          'rawObjectBytes': len(raw_obj),
                          'rawObjectSha256': sha256(raw_obj)
                      }
                      if object_type == 'Sprite':
                          data = reader.read()
                          image = data.image.convert('RGBA')
                          rgba = image.tobytes()
                          alpha_bbox = image.getchannel('A').getbbox()
                          hit.update({'width': image.width, 'height': image.height, 'mode': 'RGBA', 'rgbaSha256': sha256(rgba), 'alphaBbox': list(alpha_bbox) if alpha_bbox else None, 'nonEmptyAlpha': alpha_bbox is not None})
                      else:
                          hit.update({'width': None, 'height': None, 'mode': None, 'rgbaSha256': None, 'alphaBbox': None, 'nonEmptyAlpha': False})
                      hits_by_rel[rel].append(hit)

              for rel, target in sorted(targets.items(), key=lambda kv: kv[1]['sourcePath']):
                  hits = hits_by_rel[rel]
                  if not hits:
                      result['notInInstallerSnapshot'].append(target)
                      continue
                  invalid = [h for h in hits if h['objectType'] != 'Sprite' or not h['nonEmptyAlpha']]
                  render_keys = {(h['width'], h['height'], h['rgbaSha256']) for h in hits if h['objectType'] == 'Sprite' and h['nonEmptyAlpha']}
                  if invalid:
                      result['blockers'].append({'type': 'INVALID_EXACT_HIT', **target, 'hits': hits})
                      continue
                  if len(render_keys) != 1:
                      result['blockers'].append({'type': 'AMBIGUOUS_NON_EQUIVALENT_EXACT_SOURCES', **target, 'hits': hits})
                      continue
                  result['verified'].append({**target, 'hits': hits})

              result['summary'] = {
                  'definedAwakeningCount': len(targets),
                  'notDefinedAwakeningCount': not_defined,
                  'uniqueExactSourcePathCount': len(targets),
                  'verifiedInInstallerSnapshotCount': len(result['verified']),
                  'notInInstallerSnapshotCount': len(result['notInInstallerSnapshot']),
                  'blockerCount': len(result['blockers'])
              }
              if result['blockers']:
                  result['status'] = 'BLOCKER'
                  code = 2
              elif result['notInInstallerSnapshot']:
                  result['status'] = 'PASS_WITH_REVIEW'
              else:
                  result['status'] = 'PASS'
          except Exception as exc:
              result['status'] = 'DIAGNOSTIC_ERROR'
              result['blockers'] = [{'type': 'DIAGNOSTIC_ERROR', 'message': f'{type(exc).__name__}:{exc}'}]
              result['traceback'] = traceback.format_exc()
              code = 3

          RESULT.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'status': result['status'], 'semanticReopen': result.get('semanticReopen'), 'targetPopulation': result.get('targetPopulation'), 'packageCatalog': result.get('packageCatalog'), 'summary': result.get('summary'), 'blockers': result.get('blockers', [])[:3]}, ensure_ascii=False, indent=2))
          raise SystemExit(code)
          PY
          code=$?
          echo "$code" > out/awakening-icon-a6-1113-coverage/exit-code.txt
          exit 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awakening-icon-a6-1113-coverage
          path: out/awakening-icon-a6-1113-coverage
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-awakening-icon-a6-1113-coverage.yml
          git commit -m "Remove temporary A6 snapshot diagnostic"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Enforce diagnostic integrity
        if: always()
        shell: bash
        run: |
          code=$(cat out/awakening-icon-a6-1113-coverage/exit-code.txt 2>/dev/null || echo 99)
          test "$code" = "0"
