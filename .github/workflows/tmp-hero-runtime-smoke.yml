name: Temporary Hero Runtime Smoke

on:
  pull_request:
    paths:
      - "src/lib/hero-page.functions.ts"
      - "src/lib/hero-page.server.ts"
      - "src/routes/heroes_.$heroId.tsx"
      - ".github/workflows/tmp-hero-runtime-smoke.yml"

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Start dev server and request hero page
        shell: bash
        run: |
          set +e
          bun run dev -- --host 127.0.0.1 > /tmp/hero-dev.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:5173/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo '=== HERO RESPONSE ==='
          curl -i http://127.0.0.1:5173/heroes/6 || true
          sleep 2
          echo '=== DEV LOG ==='
          cat /tmp/hero-dev.log || true
          kill "$DEV_PID" 2>/dev/null || true
