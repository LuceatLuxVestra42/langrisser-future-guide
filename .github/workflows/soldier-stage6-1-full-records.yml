name: Soldier Stage 6-1 Full Records

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/finalize-soldier-stage6-1-full-records.cjs'
      - 'data/validation/soldier-stage6-0-checkpoint.v1.json'
      - 'data/generated/soldier-detail-stage5-6.v1.json'
      - 'data/validation/soldier-stage5-6-sp-detail.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'data/validation/soldier-stage5-8-release.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
      - '.github/workflows/soldier-stage6-1-full-records.yml'
  pull_request:
    paths:
      - 'scripts/finalize-soldier-stage6-1-full-records.cjs'
      - 'data/validation/soldier-stage6-0-checkpoint.v1.json'
      - 'data/generated/soldier-detail-stage5-6.v1.json'
      - 'data/validation/soldier-stage5-6-sp-detail.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'data/validation/soldier-stage5-8-release.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - '.github/workflows/soldier-stage6-1-full-records.yml'

permissions:
  contents: read

jobs:
  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject protected main as explicit producer target
        run: |
          echo 'Explicit Soldier Stage 6-1 producer runs must target a non-main branch. Select the branch/ref to freeze, then open a normal PR.'
          exit 1

  generate-validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and validate Soldier Stage 6-1 full records
        run: node scripts/finalize-soldier-stage6-1-full-records.cjs

      - name: Upload Stage 6-1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage6-1-full-records
          path: |
            data/generated/soldier-stage6-1-full-records.v1.json
            data/validation/soldier-stage6-1-full-records.v1.json

      - name: Verify frozen Stage 6-1 content on main or PR
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const paths = [
            'data/generated/soldier-stage6-1-full-records.v1.json',
            'data/validation/soldier-stage6-1-full-records.v1.json',
          ];

          let failed = false;
          for (const path of paths) {
            const regenerated = JSON.parse(fs.readFileSync(path, 'utf8'));
            const committed = JSON.parse(execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }));
            delete regenerated.generatedAt;
            delete committed.generatedAt;
            if (JSON.stringify(regenerated) !== JSON.stringify(committed)) {
              console.error(`${path} differs from the committed frozen content beyond generatedAt.`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          console.log('Soldier Stage 6-1 frozen content matches after excluding generatedAt metadata.');
          NODE

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and validate Soldier Stage 6-1 full records
        run: node scripts/finalize-soldier-stage6-1-full-records.cjs

      - name: Upload Stage 6-1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage6-1-full-records
          path: |
            data/generated/soldier-stage6-1-full-records.v1.json
            data/validation/soldier-stage6-1-full-records.v1.json

      - name: Freeze generated artifacts on explicit producer run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/soldier-stage6-1-full-records.v1.json \
            data/validation/soldier-stage6-1-full-records.v1.json
          if git diff --cached --quiet; then
            echo "Soldier Stage 6-1 artifacts already frozen."
          else
            git commit -m "freeze Soldier stage 6-1 full-record PASS"
            git push origin HEAD:${{ github.ref_name }}
          fi
