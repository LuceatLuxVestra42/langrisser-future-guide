name: Hero-Soldier Stage C-4 Production Boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject protected main as explicit producer target
        run: |
          echo 'Explicit Hero-Soldier Stage C-4 producer runs must target a non-main branch. Select the branch/ref to freeze, then open a normal PR.'
          exit 1

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate C-4 production boundary
        run: node scripts/validate-hero-soldier-stageC-4-production-boundary.cjs

      - name: Show C-4 summary
        if: always()
        run: |
          if [ -f data/validation/hero-soldier-integration-stageC-4-production-boundary.v1.json ]; then
            node -e "const x=require('./data/validation/hero-soldier-integration-stageC-4-production-boundary.v1.json'); console.log(JSON.stringify({status:x.status,completion:x.completion,summary:x.summary,decision:x.decision},null,2))"
          fi

      - name: Upload C-4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-soldier-stageC-4-production-boundary
          path: data/validation/hero-soldier-integration-stageC-4-production-boundary.v1.json
          if-no-files-found: ignore

      - name: Freeze C-4 output on explicit producer run
        if: success()
        run: |
          OUTPUT='data/validation/hero-soldier-integration-stageC-4-production-boundary.v1.json'
          if [ -z "$(git status --porcelain -- "$OUTPUT")" ]; then
            echo 'C-4 output already frozen.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT"
          git commit -m 'Freeze Hero-Soldier Stage C-4 production boundary PASS'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
