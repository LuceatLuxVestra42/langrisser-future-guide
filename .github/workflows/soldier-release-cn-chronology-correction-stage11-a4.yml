name: Soldier Stage 11-A4 CN Chronology Correction Evidence

on:
  push:
    branches:
      - main
    paths:
      - 'data/soldier-release-cn-chronology-correction-evidence-stage11-a4.v1.json'
      - 'scripts/validate-soldier-release-cn-chronology-correction-stage11-a4.mjs'
      - '.github/workflows/soldier-release-cn-chronology-correction-stage11-a4.yml'
      - 'data/soldier-release-source.v1.json'
      - 'data/soldier-release-official-notice-evidence-stage11-a1.v1.json'
      - 'data/generated/soldier-list-stage5-7.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
  pull_request:
    paths:
      - 'data/soldier-release-cn-chronology-correction-evidence-stage11-a4.v1.json'
      - 'scripts/validate-soldier-release-cn-chronology-correction-stage11-a4.mjs'
      - '.github/workflows/soldier-release-cn-chronology-correction-stage11-a4.yml'
      - 'data/soldier-release-source.v1.json'
      - 'data/soldier-release-official-notice-evidence-stage11-a1.v1.json'
      - 'data/generated/soldier-list-stage5-7.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Stage 11-A4 CN chronology correction evidence
        run: node scripts/validate-soldier-release-cn-chronology-correction-stage11-a4.mjs

      - name: Verify evidence validation is read-only
        run: git diff --exit-code
