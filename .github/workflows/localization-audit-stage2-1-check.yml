name: Localization Audit Stage 2.1 Check

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Print Stage 2.1 baseline
        run: node scripts/audit-localization-stage2-1.mjs --json
      - name: Run Stage 2.1 self-tests
        run: node scripts/audit-localization-stage2-1.mjs --self-test
