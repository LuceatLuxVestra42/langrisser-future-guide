name: Localization Audit Stage 2.1 Check

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Stage 2.1 baseline snapshot
        run: node scripts/audit-localization-stage2-1.mjs --check
      - name: Run Stage 2.1 self-tests
        run: node scripts/audit-localization-stage2-1.mjs --self-test
      - name: Verify spacing-only drift is rejected
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/presentation/soldier-lower-tier-name-kr.v1.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const target = data.records.find((record) => record.soldierId === 101);
          if (!target || target.nameKr !== '정예 창병') throw new Error('Soldier 101 baseline name mismatch');
          target.nameKr = '정예창병';
          fs.writeFileSync(p, `${JSON.stringify(data, null, 2)}\n`);
          NODE
          if node scripts/audit-localization-stage2-1.mjs --check >/tmp/localization-drift.log 2>&1; then
            cat /tmp/localization-drift.log
            echo 'Expected spacing drift to fail, but audit passed.' >&2
            exit 1
          fi
          cat /tmp/localization-drift.log
          grep -q 'CONFIRMED_PRESENTATION_DRIFT' /tmp/localization-drift.log
          git checkout -- data/presentation/soldier-lower-tier-name-kr.v1.json
          node scripts/audit-localization-stage2-1.mjs --check
