name: Hero SP 25 Bootstrap Migration Independence Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  producer:
    if: github.head_ref == 'test/asset-portability-cleanroom-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout producer repository
        uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build frozen deterministic SP25 bootstrap package
        run: |
          python tools/asset-intake/experiments/hero-sp-bootstrap-migration/build_bootstrap.py \
            --contract-file tools/asset-intake/experiments/hero-sp-bootstrap-migration/hero-sp-25-contract.v1.json \
            --output-dir /tmp/bootstrap-dist
          cat /tmp/bootstrap-dist/bootstrap-build-result.json
          (cd /tmp/bootstrap-dist && sha256sum -c hero-sp-bootstrap-v1.tar.sha256)
          python - <<'PY'
          import json
          x=json.load(open('/tmp/bootstrap-dist/bootstrap-build-result.json'))
          assert x['recordCount']==25, x
          print({'status':'PASS_SP25_PACKAGE_RECORD_COUNT','recordCount':x['recordCount']})
          PY
      - name: Upload frozen SP25 bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: hero-sp-25-bootstrap-package
          path: |
            /tmp/bootstrap-dist/hero-sp-bootstrap-v1.tar
            /tmp/bootstrap-dist/hero-sp-bootstrap-v1.tar.sha256
            /tmp/bootstrap-dist/bootstrap-build-result.json
          if-no-files-found: error
          retention-days: 7

  consumer:
    needs: producer
    strategy:
      fail-fast: false
      matrix:
        run: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Setup Python 3.11 host
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup dotnet 8.0.425 host
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - name: Receive SP25 bootstrap package only
        uses: actions/download-artifact@v4
        with:
          name: hero-sp-25-bootstrap-package
          path: /tmp/bootstrap-artifact
      - name: Create empty Git repository and verify package identity
        env:
          RUN_LABEL: ${{ matrix.run }}
        run: |
          set -euo pipefail
          REPO="/tmp/new-sp25-repo-${RUN_LABEL}"
          mkdir -p "$REPO"; cd "$REPO"; git init
          test -z "$(git remote)"
          test ! -e tools/asset-intake
          test ! -e data/evidence
          test ! -e public/images
          test ! -e generated
          (cd /tmp/bootstrap-artifact && sha256sum -c hero-sp-bootstrap-v1.tar.sha256)
          cp /tmp/bootstrap-artifact/hero-sp-bootstrap-v1.tar .
          tar -xf hero-sp-bootstrap-v1.tar
          rm hero-sp-bootstrap-v1.tar
          test -d bootstrap
          test ! -e tools/asset-intake
          test ! -e data/evidence
          test ! -e public/images
          test -z "$(git remote)"
          python bootstrap/validate_bootstrap.py
          python - <<'PY'
          import json
          x=json.load(open('bootstrap/contract/hero-sp.v1.json'))
          assert len(x['records'])==25
          print({'status':'PASS_SP25_CONTRACT_POPULATION','count':len(x['records'])})
          PY
      - name: Materialize SP25 under official-source-only network boundary
        env:
          RUN_LABEL: ${{ matrix.run }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="/tmp/new-sp25-repo-${RUN_LABEL}"
          cd "$REPO"
          HOST=mhmnzupdate.zlongame.com
          IPS="$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)"
          test -n "$IPS"
          echo "$IPS" > official-source-ips.txt
          for ip in $IPS; do echo "$ip $HOST" | sudo tee -a /etc/hosts >/dev/null; done
          sudo iptables-save > /tmp/iptables.before
          sudo ip6tables-save > /tmp/ip6tables.before
          restore_net() {
            sudo iptables-restore < /tmp/iptables.before || true
            sudo ip6tables-restore < /tmp/ip6tables.before || true
          }
          trap restore_net EXIT
          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          for ip in $IPS; do
            sudo iptables -A OUTPUT -p tcp -d "$ip" --dport 80 -j ACCEPT
            sudo iptables -A OUTPUT -p tcp -d "$ip" --dport 443 -j ACCEPT
          done
          sudo ip6tables -F OUTPUT
          sudo ip6tables -P OUTPUT DROP
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

          if curl -fsS --connect-timeout 2 --max-time 3 https://github.com >/dev/null 2>&1; then
            echo "FAIL_NETWORK_GITHUB_NOT_BLOCKED"; exit 1
          fi
          if curl -fsS --connect-timeout 2 --max-time 3 https://pypi.org >/dev/null 2>&1; then
            echo "FAIL_NETWORK_PYPI_NOT_BLOCKED"; exit 1
          fi
          printf 'PASS_NETWORK_GITHUB_BLOCKED\nPASS_NETWORK_PYPI_BLOCKED\nALLOW_ONLY=%s\n' "$HOST" > network-boundary.txt

          python -m pip install --disable-pip-version-check --no-index --find-links bootstrap/runtime/wheelhouse -r bootstrap/runtime/requirements.lock.txt
          python bootstrap/validate_bootstrap.py
          python bootstrap/materialize.py
          python bootstrap/validate_output.py
          trap - EXIT
          restore_net

          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd()
          m=json.loads((root/'generated'/'manifest.json').read_text())
          assert len(m['records'])==25, len(m['records'])
          package_sha=pathlib.Path('/tmp/bootstrap-artifact/hero-sp-bootstrap-v1.tar.sha256').read_text().split()[0]
          proof={
            'status':'PASS_SP25_INDEPENDENT_BOOTSTRAP_RUN',
            'run':root.name.rsplit('-',1)[-1],
            'gitRemotes':subprocess.check_output(['git','remote'],text=True).split(),
            'bootstrapPackageSha256':package_sha,
            'manifestSha256':hashlib.sha256((root/'generated'/'manifest.json').read_bytes()).hexdigest(),
            'heroIds':[r['heroId'] for r in m['records']],
            'heroAssets':{}
          }
          for p in sorted((root/'generated'/'assets'/'heroes').glob('*.webp'),key=lambda x:int(x.stem)):
            proof['heroAssets'][p.stem]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert len(proof['heroAssets'])==25
          (root/'run-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps({'status':proof['status'],'count':len(proof['heroAssets']),'manifestSha256':proof['manifestSha256']}))
          PY
      - name: Upload SP25 independent run proof
        uses: actions/upload-artifact@v4
        with:
          name: hero-sp-25-bootstrap-run-${{ matrix.run }}
          path: |
            /tmp/new-sp25-repo-${{ matrix.run }}/network-boundary.txt
            /tmp/new-sp25-repo-${{ matrix.run }}/official-source-ips.txt
            /tmp/new-sp25-repo-${{ matrix.run }}/run-proof.json
            /tmp/new-sp25-repo-${{ matrix.run }}/generated/manifest.json
            /tmp/new-sp25-repo-${{ matrix.run }}/generated/assets/heroes/*.webp
            /tmp/new-sp25-repo-${{ matrix.run }}/frontend/*
          if-no-files-found: error
          retention-days: 7

  compare-independent-runs:
    needs: consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hero-sp-25-bootstrap-run-*
          path: /tmp/runs
      - name: Compare all SP25 deterministic outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          A=pathlib.Path('/tmp/runs/hero-sp-25-bootstrap-run-A')
          B=pathlib.Path('/tmp/runs/hero-sp-25-bootstrap-run-B')
          pa=json.loads((A/'run-proof.json').read_text())
          pb=json.loads((B/'run-proof.json').read_text())
          assert pa['gitRemotes']==[] and pb['gitRemotes']==[]
          assert pa['bootstrapPackageSha256']==pb['bootstrapPackageSha256']
          assert pa['manifestSha256']==pb['manifestSha256']
          assert pa['heroIds']==pb['heroIds']
          assert len(pa['heroIds'])==25
          assert pa['heroAssets']==pb['heroAssets']
          assert len(pa['heroAssets'])==25
          result={
            'schemaVersion':1,
            'status':'PASS_SP_ASSET_INTAKE_MIGRATION_INDEPENDENCE',
            'population':'current-frozen-sp-25',
            'count':25,
            'heroIds':pa['heroIds'],
            'bootstrapPackageSha256':pa['bootstrapPackageSha256'],
            'manifestSha256':pa['manifestSha256'],
            'heroAssets':pa['heroAssets'],
            'independentRuns':['A','B'],
            'networkBoundary':'official-source-only-during-materialization',
            'assetIntakeRuntimePresent':False,
            'sourceRepositoryCheckoutPresentInConsumers':False,
            'architecturePredecessor':'PASS_SP_BOOTSTRAP_ARCHITECTURE'
          }
          pathlib.Path('/tmp/final-sp25-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'status':result['status'],'count':result['count'],'bootstrapPackageSha256':result['bootstrapPackageSha256'],'manifestSha256':result['manifestSha256']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hero-sp-25-migration-independence-proof
          path: /tmp/final-sp25-result.json
          if-no-files-found: error
          retention-days: 7
