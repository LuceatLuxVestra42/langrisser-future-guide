name: Temporary Awakening Skill Super4 Materialize

on:
  push:
    branches:
      - work/awakening-skill-icon-a2-materialize-20260910

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow

      - name: Materialize verified Skill_Super4 sprite
        shell: bash
        run: |
          python <<'PY'
          import binascii, hashlib, io, pathlib, struct, urllib.request, zlib
          import UnityPy

          VERSION='1.1.113'
          PACKAGE='InstallPage_1.1.113_62.zip'
          BASE=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}'
          URL=f'{BASE}/{PACKAGE}'
          ENTRY_NAME='Client/Langrisser_Data/StreamingAssets/ExportAssetBundle/ui_icon_skill_abs.b'
          TARGET='assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_super4.png'
          EXPECT_BUNDLE_SHA='14c4fe918356f47f0e9f5a59e77dae31e4eb4a0d19e30d898c9d8c1085b8eb12'
          EXPECT_RAW_SHA='8bd9fea67f998b20e5cb8f2440d3b5f0e022466305ea8f802edd63b74ddabaef'
          EXPECT_RGBA_SHA='bd61b5dd9929182ef9a235e10c3b7940468cfdb86a95d93788ea8a08f70bc808'
          EXPECT_PATH_ID=2417528737240338854
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          OUT=pathlib.Path('public/images/heroes/skill-icons/Skill_Super4.png')

          def sha256(data): return hashlib.sha256(data).hexdigest()
          def request(start=None,end=None):
              headers={'User-Agent':UA,'Accept-Encoding':'identity'}
              if start is not None: headers['Range']=f'bytes={start}-{end}'
              req=urllib.request.Request(URL,headers=headers)
              with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
              if start is not None and len(data)!=end-start+1: raise RuntimeError('range mismatch')
              return data
          def head_size():
              req=urllib.request.Request(URL,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD')
              with urllib.request.urlopen(req,timeout=45) as r: return int(r.headers['Content-Length'])
          def directory(total):
              tail_size=min(131072,total); tail=request(total-tail_size,total-1); eocd=tail.rfind(b'PK\x05\x06')
              if eocd<0: raise RuntimeError('EOCD missing')
              _,_,_,_,central_size,central_offset,_=struct.unpack_from('<HHHHIIH',tail,eocd+4)
              central=request(central_offset,central_offset+central_size-1); entries=[]; i=0
              while i+46<=len(central) and central[i:i+4]==b'PK\x01\x02':
                  flags,method=struct.unpack_from('<HH',central,i+8); crc,compressed,uncompressed=struct.unpack_from('<III',central,i+16)
                  fn_len,extra_len,comment_len=struct.unpack_from('<HHH',central,i+28); local_offset=struct.unpack_from('<I',central,i+42)[0]
                  name_bytes=central[i+46:i+46+fn_len]; name=name_bytes.decode('utf-8' if flags&0x800 else 'cp437','replace')
                  entries.append({'name':name,'method':method,'crc32':f'{crc:08X}','compressedBytes':compressed,'uncompressedBytes':uncompressed,'localOffset':local_offset})
                  i+=46+fn_len+extra_len+comment_len
              return entries
          def fetch_entry(entry):
              offset=entry['localOffset']; header=request(offset,offset+4095)
              if header[:4]!=b'PK\x03\x04': raise RuntimeError('local header missing')
              method=struct.unpack_from('<H',header,8)[0]; fn_len,extra_len=struct.unpack_from('<HH',header,26); start=offset+30+fn_len+extra_len
              compressed=request(start,start+entry['compressedBytes']-1)
              raw=compressed if method==0 else zlib.decompress(compressed,-15) if method==8 else None
              if raw is None: raise RuntimeError(f'unsupported compression {method}')
              if len(raw)!=entry['uncompressedBytes']: raise RuntimeError('uncompressed size mismatch')
              if f'{binascii.crc32(raw)&0xffffffff:08X}'!=entry['crc32']: raise RuntimeError('CRC mismatch')
              return raw

          entries=directory(head_size())
          exact=[e for e in entries if e['name']==ENTRY_NAME]
          if len(exact)!=1: raise RuntimeError(f'exact bundle entry count {len(exact)}')
          bundle=fetch_entry(exact[0])
          if sha256(bundle)!=EXPECT_BUNDLE_SHA: raise RuntimeError('bundle sha mismatch')

          env=UnityPy.load(bundle)
          hits=[]
          for container_path,value in env.container.items():
              if str(container_path).replace('\\','/').lower()!=TARGET.lower():
                  continue
              reader=value.deref() if hasattr(value,'deref') else value
              raw_obj=reader.get_raw_data(); data=reader.read(); image=data.image.convert('RGBA'); rgba=image.tobytes(); alpha_bbox=image.getchannel('A').getbbox()
              hits.append((reader,raw_obj,image,rgba,alpha_bbox))
          if len(hits)!=1: raise RuntimeError(f'exact target hit count {len(hits)}')

          reader,raw_obj,image,rgba,alpha_bbox=hits[0]
          object_type=getattr(getattr(reader,'type',None),'name',None)
          path_id=int(getattr(reader,'path_id',0) or 0)
          if object_type!='Sprite': raise RuntimeError(f'object type {object_type}')
          if path_id!=EXPECT_PATH_ID: raise RuntimeError('pathId mismatch')
          if sha256(raw_obj)!=EXPECT_RAW_SHA: raise RuntimeError('raw object sha mismatch')
          if (image.width,image.height)!=(170,170): raise RuntimeError('dimension mismatch')
          if sha256(rgba)!=EXPECT_RGBA_SHA: raise RuntimeError('rgba sha mismatch')
          if alpha_bbox!=(0,0,170,170): raise RuntimeError(f'alpha bbox mismatch {alpha_bbox}')

          OUT.parent.mkdir(parents=True,exist_ok=True)
          image.save(OUT,'PNG')
          written=OUT.read_bytes()
          print(f'materialized={OUT}')
          print(f'pngBytes={len(written)}')
          print(f'pngSha256={sha256(written)}')
          PY

      - name: Commit materialized production asset and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-awakening-skill-super4-materialize.yml
          git add public/images/heroes/skill-icons/Skill_Super4.png
          git commit -m "Materialize verified awakening skill icon"
          git push origin HEAD:${GITHUB_REF_NAME}
