name: Localization Audit Stage 2 Live Verify

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current main Stage 2 snapshot
        run: node scripts/audit-localization.mjs --check
      - name: Verify current Stage 2 contamination self-tests
        run: node scripts/audit-localization.mjs --self-test
