name: TrainingTech Stage 3 Candidate Evidence

on:
  push:
    branches:
      - data/training-tech-classification-stage3

permissions:
  contents: write

jobs:
  investigate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Stage 3 candidate evidence
        run: node scripts/investigate-soldier-training-tech-classification-stage3.mjs
      - name: Persist candidate evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence/soldier-training-tech-classification-stage3-candidates.v1.json
          if git diff --cached --quiet; then
            echo "Candidate evidence already current."
          else
            git commit -m "Materialize TrainingTech Stage 3 candidate evidence"
            git push
          fi
