name: Skin Stage 3-3 Bulk Preplan

on:
  push:
    branches:
      - work/skin-stage3-3-bulk-plan

permissions:
  contents: read

jobs:
  preplan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frozen inventory exact-join preplan
        run: node scripts/skin-stage3-3-preplan.mjs
      - name: Upload preplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: skin-stage3-3-preplan
          path: /tmp/skin-stage3-3-preplan.json
          if-no-files-found: error
