name: Project Tooling R3 Project Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact main SHA used by merge finalizer validation
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA that must be checked out
        required: true
        type: string
      pr:
        description: Pull request number for audit context
        required: true
        type: string

permissions:
  contents: read

jobs:
  project-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Project Check base and head
        id: project-check-context
        shell: bash
        env:
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$DISPATCH_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'workflow_dispatch base_sha must be a 40-character Git SHA.'
              exit 1
            fi
            if [[ ! "$DISPATCH_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'workflow_dispatch expected_head_sha must be a 40-character Git SHA.'
              exit 1
            fi
            ACTUAL_HEAD="$(git rev-parse HEAD)"
            if [ "$ACTUAL_HEAD" != "$DISPATCH_HEAD_SHA" ]; then
              echo "Dispatched head moved: expected=$DISPATCH_HEAD_SHA actual=$ACTUAL_HEAD"
              exit 1
            fi
            git fetch --no-tags origin main
            ACTUAL_MAIN="$(git rev-parse origin/main)"
            if [ "$ACTUAL_MAIN" != "$DISPATCH_BASE_SHA" ]; then
              echo "Main moved before Project Check started: expected=$DISPATCH_BASE_SHA actual=$ACTUAL_MAIN"
              exit 1
            fi
            echo "base_spec=$DISPATCH_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$GITHUB_BASE_REF" ]; then
              echo 'pull_request event is missing GITHUB_BASE_REF.'
              exit 1
            fi
            echo "base_spec=origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-linux-x64.zip

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run R3 Project Check contract and routing self-test
        run: node tools/project-check/test/project-check-self-test.mjs

      - name: Run deletion diff routing regression fixture
        run: node tools/project-check/test/deletion-diff-regression.mjs

      - name: Run post-reinstall Soldier and Asset Intake routing fixtures
        run: node tools/project-check/test/post-reinstall-routing-fixtures.mjs

      - name: Run tracked-mutation baseline regression fixture
        run: node tools/project-check/test/tracked-mutation-baseline-regression.mjs

      - name: Plan changed path ownership and validators
        run: node tools/project-check/cli/check.mjs --base "${{ steps.project-check-context.outputs.base_spec }}" --head HEAD --plan

      - name: Run changed path owning validators
        run: node tools/project-check/cli/check.mjs --base "${{ steps.project-check-context.outputs.base_spec }}" --head HEAD

      - name: Verify and classify Project Check tracked state
        shell: bash
        env:
          BASE_SPEC: ${{ steps.project-check-context.outputs.base_spec }}
        run: |
          set -euo pipefail
          HEAD_SIGNATURE="$RUNNER_TEMP/project-check-head-mutation.json"
          BASE_SIGNATURE="$RUNNER_TEMP/project-check-base-mutation.json"
          CHANGED_PATHS="$RUNNER_TEMP/project-check-changed-paths.txt"
          BASE_WORKTREE="$RUNNER_TEMP/project-check-exact-base"
          node tools/project-check/cli/tracked-mutation.mjs signature --repo "$GITHUB_WORKSPACE" --output "$HEAD_SIGNATURE"
          HEAD_MUTATION_COUNT="$(node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(s.lines.length));" "$HEAD_SIGNATURE")"
          if [ "$HEAD_MUTATION_COUNT" = "0" ]; then
            echo 'Project Check tracked state is unchanged.'
            exit 0
          fi
          echo 'Project Check owning validators mutated tracked repository state; reproducing on exact base.'
          cat "$HEAD_SIGNATURE"
          BASE_SHA="$(git rev-parse "$BASE_SPEC")"
          git diff --name-only "$BASE_SHA"...HEAD > "$CHANGED_PATHS"
          cleanup_base_worktree() { git -C "$GITHUB_WORKSPACE" worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true; }
          trap cleanup_base_worktree EXIT
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          (
            cd "$BASE_WORKTREE"
            bun install --frozen-lockfile
            SETUP_CHANGES="$(git status --porcelain=v1 --untracked-files=no)"
            if [ -n "$SETUP_CHANGES" ]; then
              echo "$SETUP_CHANGES"
              echo 'REGRESSION_BLOCKER: exact-base replay setup mutated tracked repository state.'
              exit 91
            fi
            set +e
            node tools/project-check/cli/check.mjs --stdin < "$CHANGED_PATHS"
            BASE_VALIDATOR_EXIT=$?
            set -e
            if [ "$BASE_VALIDATOR_EXIT" -ne 0 ]; then
              echo "REGRESSION_BLOCKER: exact-base owning validator replay did not complete cleanly (exit=$BASE_VALIDATOR_EXIT)."
              exit 92
            fi
          )
          node tools/project-check/cli/tracked-mutation.mjs signature --repo "$BASE_WORKTREE" --output "$BASE_SIGNATURE"
          set +e
          CLASSIFICATION="$(node tools/project-check/cli/tracked-mutation.mjs classify --head "$HEAD_SIGNATURE" --base "$BASE_SIGNATURE")"
          CLASSIFY_EXIT=$?
          set -e
          echo "$CLASSIFICATION"
          STATUS="$(printf '%s' "$CLASSIFICATION" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).status));")"
          if [ "$STATUS" = "REVIEW_EXISTING_DRIFT" ]; then
            echo 'REVIEW_EXISTING_DRIFT: exact base reproduces the identical tracked-mutation signature; required project-check remains successful.'
          elif [ "$STATUS" = "REGRESSION_BLOCKER" ]; then
            echo 'REGRESSION_BLOCKER: head mutation is absent or different on exact base.'
          fi
          exit "$CLASSIFY_EXIT"

  heart-fetter-owner-map-maintenance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/project-check-heart-fetter-consumer-routing-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore original owner-map formatting and insert one explicit rule
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const file = 'tools/project-check/contracts/owners.v1.json';
          const original = cp.execFileSync('git', ['show', `origin/main:${file}`], { encoding: 'utf8' });
          const id = 'hero-heart-fetter-site-consumer-generated';
          const needle = '    {\n      "id": "hero-detail-by-id-canonical",';
          if (!original.includes(needle)) throw new Error('hero-detail-by-id-canonical insertion point not found');
          const rule = '    {\n      "id": "hero-heart-fetter-site-consumer-generated",\n      "patterns": ["data/generated/hero-heart-fetter-site-consumer/**"],\n      "owners": ["hero-canonical"]\n    },\n';
          const next = original.includes(`"id": "${id}"`) ? original : original.replace(needle, rule + needle);
          fs.writeFileSync(file, next);
          NODE
      - name: Commit minimal owner-map update only
        run: |
          set -euo pipefail
          TARGET='tools/project-check/contracts/owners.v1.json'
          if test -z "$(git status --porcelain -- "$TARGET")"; then
            echo 'Minimal owner map already current.'
            exit 0
          fi
          if test -n "$(git status --porcelain | grep -v '^.. tools/project-check/contracts/owners.v1.json$' || true)"; then
            echo 'Unexpected repository mutation during owner-map maintenance.'
            git status --short
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Minimize HeartFetter consumer owner routing diff'
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
