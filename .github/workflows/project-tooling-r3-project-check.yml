name: Project Tooling R3 Project Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run R3 Project Check contract and routing self-test
        run: node tools/project-check/test/project-check-self-test.mjs

      - name: Run deletion diff routing regression fixture
        run: node tools/project-check/test/deletion-diff-regression.mjs

      - name: Run post-reinstall Soldier and Asset Intake routing fixtures
        run: node tools/project-check/test/post-reinstall-routing-fixtures.mjs

      - name: Plan changed path ownership and validators
        run: node tools/project-check/cli/check.mjs --base "origin/${GITHUB_BASE_REF}" --head HEAD --plan

      - name: Run changed path owning validators
        run: node tools/project-check/cli/check.mjs --base "origin/${GITHUB_BASE_REF}" --head HEAD

      - name: Verify Project Check tracked state is unchanged
        run: |
          CHANGES="$(git status --porcelain=v1 --untracked-files=no)"
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            echo 'Project Check owning validators mutated tracked repository state.'
            exit 1
          fi
