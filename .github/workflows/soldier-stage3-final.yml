name: Soldier Stage 3 Final Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'scripts/validate_soldier_stage4_prereq_parsed.cjs'
      - 'scripts/inspect_parsed_soldier_schema.cjs'
      - '.github/workflows/soldier-stage3-final.yml'
  pull_request:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'scripts/validate_soldier_stage4_prereq_parsed.cjs'
      - 'scripts/inspect_parsed_soldier_schema.cjs'
      - '.github/workflows/soldier-stage3-final.yml'

permissions:
  contents: read

jobs:
  validate-soldier-stage3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect parsed soldier ConfigData schema
        run: node scripts/inspect_parsed_soldier_schema.cjs
      - name: Revalidate soldier stage 4 prerequisites
        run: node scripts/validate_soldier_stage4_prereq_parsed.cjs
      - name: Upload stage 4 prerequisite recheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage4-prereq-recheck
          path: data/validation/soldier-stage4-prereq-recheck.v1.json

# validation-only branch workflow override
