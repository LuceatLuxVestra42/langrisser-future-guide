name: Soldier Stage 3 Final Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'scripts/finalize-soldier-stage3.cjs'
      - '.github/workflows/soldier-stage3-final.yml'
  pull_request:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'scripts/finalize-soldier-stage3.cjs'
      - '.github/workflows/soldier-stage3-final.yml'

permissions:
  contents: write

jobs:
  validate-soldier-stage3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run soldier stage 3 validation
        run: node scripts/finalize-soldier-stage3.cjs
      - name: Upload soldier stage 3 outputs
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage3-final
          path: |
            data/generated/soldier-stage3.v1.json
            data/validation/soldier-stage3-final.v1.json
      - name: Commit validated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/soldier-stage3.v1.json data/validation/soldier-stage3-final.v1.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "generate soldier stage 3 final validation"
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi

# validation trigger
