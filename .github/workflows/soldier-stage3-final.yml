name: Soldier Stage 3 Final Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'scripts/finalize-soldier-stage3.cjs'
      - 'scripts/finalize-soldier-stage3-postprocess.cjs'
      - '.github/workflows/soldier-stage3-final.yml'
  pull_request:
    paths:
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataTrainingTechInfo.json'
      - 'data/configdata/ConfigDataTrainingTechLevelInfo.json'
      - 'data/configdata/ConfigDataMissionInfo.json'
      - 'data/configdata/ConfigDataMissionSumitItemInfo.json'
      - 'data/configdata/ConfigDataSPHeroInfo.json'
      - 'data/configdata/ConfigDataHeroInfo.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'scripts/finalize-soldier-stage3.cjs'
      - 'scripts/finalize-soldier-stage3-postprocess.cjs'
      - '.github/workflows/soldier-stage3-final.yml'

permissions:
  contents: read

jobs:
  validate-soldier-stage3:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require clean tracked branch state
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build Soldier Stage 3 in detached proof worktree
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/soldier-stage3-proof"
          echo "PROOF=$PROOF" >> "$GITHUB_ENV"
          git worktree add --detach "$PROOF" HEAD
          (
            cd "$PROOF"
            node scripts/finalize-soldier-stage3.cjs
            node scripts/finalize-soldier-stage3-postprocess.cjs
          )
      - name: Verify logical provenance and frozen semantic parity
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$PROOF" node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const proof = process.env.PROOF;
          const files = [
            'data/generated/soldier-stage3.v1.json',
            'data/validation/soldier-stage3-final.v1.json',
          ];
          const expectedSources = {
            soldier: 'data/configdata/ConfigDataSoldierInfo.json',
            spSoldier: 'data/configdata/ConfigDataSPSoldierInfo.json',
            training: 'data/configdata/ConfigDataTrainingTechInfo.json',
            trainingLevel: 'data/configdata/ConfigDataTrainingTechLevelInfo.json',
            mission: 'data/configdata/ConfigDataMissionInfo.json',
            missionSubmit: 'data/configdata/ConfigDataMissionSumitItemInfo.json',
            spHero: 'data/configdata/ConfigDataSPHeroInfo.json',
            soldierMaster: 'data/generated/soldier-master.v1.json',
            heroMaster: 'data/hero-name-master.v1.json',
          };
          function normalize(value) {
            if (Array.isArray(value)) return value.map(normalize);
            if (value && typeof value === 'object') {
              const out = {};
              for (const key of Object.keys(value).sort()) {
                if (key === 'generatedAt') continue;
                out[key] = normalize(value[key]);
              }
              return out;
            }
            return value;
          }
          for (const file of files) {
            const frozen = JSON.parse(fs.readFileSync(file, 'utf8'));
            const regenerated = JSON.parse(fs.readFileSync(path.join(proof, file), 'utf8'));
            if (JSON.stringify(normalize(frozen)) !== JSON.stringify(normalize(regenerated))) {
              throw new Error(`Soldier Stage3 semantic drift: ${file}`);
            }
            if (JSON.stringify(regenerated.sources) !== JSON.stringify(expectedSources)) {
              throw new Error(`Soldier Stage3 logical provenance drift: ${file}`);
            }
          }
          console.log(JSON.stringify({
            status: 'PASS',
            semanticParityFileCount: files.length,
            logicalProvenanceChanged: false,
            trackedBranchMutation: false,
          }, null, 2));
          NODE
      - name: Upload Soldier Stage 3 proof outputs
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage3-final
          path: |
            ${{ env.PROOF }}/data/generated/soldier-stage3.v1.json
            ${{ env.PROOF }}/data/validation/soldier-stage3-final.v1.json
      - name: Require primary checkout unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"

  write-soldier-stage3:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Soldier Stage 3 data
        run: node scripts/finalize-soldier-stage3.cjs
      - name: Resolve Stage 3 review cases and final-validate
        run: node scripts/finalize-soldier-stage3-postprocess.cjs
      - name: Upload Soldier Stage 3 outputs
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage3-final
          path: |
            data/generated/soldier-stage3.v1.json
            data/validation/soldier-stage3-final.v1.json
      - name: Commit explicitly requested validated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/soldier-stage3.v1.json data/validation/soldier-stage3-final.v1.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "generate soldier stage 3 final validation"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
