name: Banner Stage 2-8 Final Freeze

on:
  push:
    branches:
      - investigate/banner-stage2-8
    paths:
      - '.github/workflows/banner-stage2-8-freeze.yml'
      - 'data/contracts/banner-stage2-8-freeze-contract.v1.json'
      - 'scripts/finalize-banner-stage2-8-production-manifest.mjs'
      - 'scripts/validate-banner-stage2-8-freeze.mjs'
      - 'scripts/run-banner-stage2-8-regression.mjs'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute all Stage 2 validators and final cross-stage freeze regression
        run: node scripts/run-banner-stage2-8-regression.mjs
      - name: Assert predecessor summaries remained frozen
        run: |
          git diff --exit-code -- \
            data/validation/banner-stage2-0-input-summary.v1.json \
            data/validation/banner-stage2-1-summary.v1.json \
            data/validation/banner-stage2-2-summary.v1.json \
            data/validation/banner-stage2-3-summary.v1.json \
            data/validation/banner-stage2-4-summary.v1.json \
            data/validation/banner-stage2-5-summary.v1.json \
            data/validation/banner-stage2-6-summary.v1.json \
            data/validation/banner-stage2-7-summary.v1.json
      - name: Commit Stage 2 freeze outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/banner-stage2-production-manifest.v1.json \
                  data/validation/banner-stage2-8-predecessor-execution.v1.json \
                  data/validation/banner-stage2-8-summary.v1.json \
                  data/checkpoints/banner-stage2-8-freeze.v1.json
          if git diff --cached --quiet; then
            echo "No Stage 2 freeze outputs changed."
          else
            git commit -m "Freeze Banner Stage 2 after whole-stage regression"
            git push
          fi
