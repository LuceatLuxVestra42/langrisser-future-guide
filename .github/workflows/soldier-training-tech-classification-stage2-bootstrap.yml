name: TrainingTech Stage 2 Bootstrap

on:
  push:
    branches:
      - data/training-tech-classification-stage2

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recompute Stage 2 validation
        run: node scripts/validate-soldier-training-tech-classification-stage2.mjs --write
      - name: Verify Stage 2 validation
        run: node scripts/validate-soldier-training-tech-classification-stage2.mjs --check
      - name: Persist validation checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/soldier-training-tech-classification-stage2.v1.json
          if git diff --cached --quiet; then
            echo "Validation already current."
          else
            git commit -m "Freeze TrainingTech Stage 2 validation"
            git push
          fi
