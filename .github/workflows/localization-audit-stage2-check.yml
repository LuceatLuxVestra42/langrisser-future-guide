name: Localization Audit Stage 2 Check

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify frozen Stage 2 audit snapshot
        run: node scripts/audit-localization.mjs --check
      - name: Verify contamination self-tests
        run: node scripts/audit-localization.mjs --self-test
