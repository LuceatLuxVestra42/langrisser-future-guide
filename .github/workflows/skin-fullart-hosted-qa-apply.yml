name: Apply Skin Fullart Hosted QA Patch
on:
  push:
    branches:
      - fix/skin-fullart-hosted-browser-qa
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/skin-fullart-hosted-browser-qa
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python tools/tmp-apply-skin-fullart-hosted-qa.py
      - run: node --check scripts/validate-authoritative-pages-hosted.mjs
      - run: git diff --check
      - name: Commit target validator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-authoritative-pages-hosted.mjs
          git commit -m 'Align authoritative hosted QA with Skin fullart carousel'
          git push origin HEAD:fix/skin-fullart-hosted-browser-qa
