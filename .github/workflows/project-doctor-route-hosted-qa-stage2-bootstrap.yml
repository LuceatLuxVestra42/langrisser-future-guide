name: Route Hosted QA Stage 2 Playwright Bootstrap

on:
  push:
    branches:
      - work/route-hosted-qa-stage2-playwright-browser
    paths:
      - '.github/workflows/project-doctor-route-hosted-qa-stage2-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA-2 branch
        uses: actions/checkout@v5
        with:
          ref: work/route-hosted-qa-stage2-playwright-browser

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pinned Playwright Test dependency
        run: bun add --dev --exact @playwright/test@1.62.1

      - name: Commit package and lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json bun.lock; then
            echo 'Playwright dependency is already locked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'Install Playwright 1.62.1 for Route QA Stage 2 [skip ci]'
          git push origin HEAD:work/route-hosted-qa-stage2-playwright-browser
