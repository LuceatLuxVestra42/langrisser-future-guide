name: Skin Detail Spine Stage 3 Bulk

on:
  push:
    branches:
      - research/skin-detail-spine-stage2-20260830
    paths:
      - scripts/run-skin-detail-spine-stage3-bulk.py
      - scripts/spine-stage2-geometry-export.cs
      - scripts/render-spine-stage2-geometry.py
      - scripts/probe-skin-detail-spine-stage2.py
      - scripts/run-skin-detail-spine-stage2-contract-probe.py
      - data/generated/skin-stage3-1-asset-inventory.v1.json
      - data/contracts/skin-detail-spine-render-contract.v1.json
      - .github/workflows/skin-detail-spine-stage3-bulk.yml

permissions:
  contents: read

jobs:
  bulk-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install frozen renderer dependencies
        run: python -m pip install UnityPy==1.25.3 Pillow==12.3.0 numpy==2.5.2
      - name: Fetch exact official Spine 3.3 runtime and build geometry exporter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/spine-runtimes /tmp/spine33bulk
          git init -q /tmp/spine-runtimes
          git -C /tmp/spine-runtimes remote add origin https://github.com/EsotericSoftware/spine-runtimes.git
          git -C /tmp/spine-runtimes fetch -q --depth=1 origin 1c1936532527900f74cfb58f7002998bf157b254
          git -C /tmp/spine-runtimes checkout -q FETCH_HEAD
          test "$(git -C /tmp/spine-runtimes rev-parse HEAD)" = "1c1936532527900f74cfb58f7002998bf157b254"
          mkdir -p /tmp/spine33bulk
          cat > /tmp/spine33bulk/Spine33Bulk.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="${GITHUB_WORKSPACE}/scripts/spine-stage2-geometry-export.cs" />
              <Compile Include="/tmp/spine-runtimes/spine-csharp/src/**/*.cs" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build /tmp/spine33bulk/Spine33Bulk.csproj -c Release
      - name: Render and classify canonical Skin 540
        run: >-
          python scripts/run-skin-detail-spine-stage3-bulk.py
          --geometry-project /tmp/spine33bulk/Spine33Bulk.csproj
          --work-dir /tmp/skin-detail-spine-stage3-bulk
      - name: Print bulk classification
        if: always()
        shell: bash
        run: |
          if test -f skin-detail-spine-stage3-bulk-summary.json; then
            python - <<'PY'
          import json
          p='skin-detail-spine-stage3-bulk-summary.json'
          x=json.load(open(p,encoding='utf-8'))
          print(json.dumps({'status':x.get('status'),'counts':x.get('counts')},ensure_ascii=False,indent=2))
          PY
          fi
      - name: Upload bulk render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skin-detail-spine-stage3-bulk
          path: |
            skin-detail-spine-stage3-bulk-summary.json
            skin-detail-spine-stage3-bulk-artifacts/renders/*.png
          if-no-files-found: warn
          compression-level: 6
