name: ConfigData B5.7 Soldier readiness patch

on:
  push:
    branches:
      - configdata/b5-7-soldier-deletion-readiness-v1
    paths:
      - '.github/workflows/configdata-b5-7-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: configdata/b5-7-soldier-deletion-readiness-v1

      - name: Apply non-workflow B5.7 source-root fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing exact patch anchor in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique patch anchor in {path}: count={text.count(old)}')
              p.write_text(text.replace(old, new))

          replace(
              'scripts/validate-soldier-stage4-2-master.cjs',
              "const crypto = require('crypto');\n",
              "const crypto = require('crypto');\nconst { resolveConfigDataFile } = require('./configdata-source-pack-maintenance-root.cjs');\n",
          )
          replace(
              'scripts/validate-soldier-stage4-2-master.cjs',
              "const SOLDIER_PATH = P('data/configdata/ConfigDataSoldierInfo.json');\nconst SP_PATH = P('data/configdata/ConfigDataSPSoldierInfo.json');",
              "const SOLDIER_PATH = resolveConfigDataFile('ConfigDataSoldierInfo.json');\nconst SP_PATH = resolveConfigDataFile('ConfigDataSPSoldierInfo.json');",
          )

          replace(
              'scripts/finalize-hero-soldier-relation-layer.cjs',
              "const path = require('path');\nconst { execFileSync } = require('child_process');\n",
              "const path = require('path');\nconst crypto = require('crypto');\n",
          )
          replace(
              'scripts/finalize-hero-soldier-relation-layer.cjs',
              "} = require('./lib/configdata-direct.cjs');\n",
              "} = require('./lib/configdata-direct.cjs');\nconst { resolveConfigDataFile } = require('./configdata-source-pack-maintenance-root.cjs');\n",
          )
          replace(
              'scripts/finalize-hero-soldier-relation-layer.cjs',
              "function gitBlobSha(p) {\n  return execFileSync('git', ['hash-object', p], { cwd: ROOT, encoding: 'utf8' }).trim();\n}\n",
              "function physicalFile(p) {\n  return p.startsWith('data/configdata/') ? resolveConfigDataFile(path.basename(p)) : abs(p);\n}\nfunction gitBlobSha(p) {\n  const body = fs.readFileSync(physicalFile(p));\n  const header = Buffer.from(`blob ${body.length}\\0`);\n  return crypto.createHash('sha1').update(header).update(body).digest('hex');\n}\n",
          )

          replace(
              'scripts/validate-soldier-stage4-8-baseline.cjs',
              "const { ROOT, readJson } = require('./lib/configdata-direct.cjs');\n",
              "const { ROOT, readJson } = require('./lib/configdata-direct.cjs');\nconst { resolveConfigDataFile } = require('./configdata-source-pack-maintenance-root.cjs');\n",
          )
          replace(
              'scripts/validate-soldier-stage4-8-baseline.cjs',
              "};\n\nconst generatedPaths = {\n",
              "};\n\nconst frozenValidationPaths = Object.fromEntries(\n  Object.entries(validationPaths).filter(([key]) => key !== 'inputAdapter')\n);\n\nconst generatedPaths = {\n",
          )
          replace(
              'scripts/validate-soldier-stage4-8-baseline.cjs',
              "function gitBlobSha(p) {\n  return execFileSync('git', ['hash-object', p], { cwd: ROOT, encoding: 'utf8' }).trim();\n}\n",
              "function physicalFile(p) {\n  return p.startsWith('data/configdata/') ? resolveConfigDataFile(path.basename(p)) : abs(p);\n}\nfunction gitBlobSha(p) {\n  const body = fs.readFileSync(physicalFile(p));\n  const header = Buffer.from(`blob ${body.length}\\0`);\n  return crypto.createHash('sha1').update(header).update(body).digest('hex');\n}\n",
          )
          replace(
              'scripts/validate-soldier-stage4-8-baseline.cjs',
              "const validationSnapshot = digestDescriptors(validationPaths);",
              "const validationSnapshot = digestDescriptors(frozenValidationPaths);",
          )
          PY

          git diff --check
          git diff -- scripts/validate-soldier-stage4-2-master.cjs scripts/finalize-hero-soldier-relation-layer.cjs scripts/validate-soldier-stage4-8-baseline.cjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/validate-soldier-stage4-2-master.cjs \
            scripts/finalize-hero-soldier-relation-layer.cjs \
            scripts/validate-soldier-stage4-8-baseline.cjs
          git commit -m "Fix Soldier validators for external ConfigData root"
          git push origin HEAD:configdata/b5-7-soldier-deletion-readiness-v1
