name: Project Status Stage 11-A2 Projection Refresh

on:
  push:
    branches:
      - project-status/stage11-a2-release-projection-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh Soldier release review parity expectation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'tools/project-status/test/current-parity.mjs';
          const before = fs.readFileSync(p, 'utf8');
          const oldText = "releaseReview.reportedCount !== 213 || releaseReview.resolvedCount !== 0 || releaseReview.remainingCount !== 213";
          const newText = "releaseReview.reportedCount !== 173 || releaseReview.resolvedCount !== 0 || releaseReview.remainingCount !== 173";
          const count = before.split(oldText).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one stale release-review expectation, found ${count}`);
          fs.writeFileSync(p, before.replace(oldText, newText));
          NODE

      - name: Verify R1 Status Source predecessor
        run: node tools/status-source/test/current-main-parity.mjs

      - name: Validate projection with stale canonical allowance
        env:
          PROJECT_STATUS_ALLOW_STALE_CANONICAL: '1'
        run: node tools/project-status/test/current-parity.mjs

      - name: Apply canonical Project Status writer
        run: node tools/project-status/cli/write.mjs --apply

      - name: Validate strict canonical parity
        run: node tools/project-status/test/current-parity.mjs

      - name: Verify exact changed path set
        run: |
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            PROJECT_STATUS.md
            data/generated/project-status.v1.json
            tools/project-status/test/current-parity.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo "Unexpected changed path set" >&2
            exit 1
          fi

      - name: Freeze Project Status refresh
        run: |
          git add PROJECT_STATUS.md data/generated/project-status.v1.json tools/project-status/test/current-parity.mjs
          git commit -m "Refresh Project Status Soldier release review count"
          git push origin HEAD:${GITHUB_REF_NAME}
