name: Soldier stage 1-5 validation

on:
  pull_request:
    paths:
      - 'scripts/validate_soldier_stage1_5.cjs'
      - 'scripts/diagnose_sp_soldier_frames.cjs'
      - 'data/configdata/ConfigDataSoldierInfo.json'
      - 'data/configdata/ConfigDataSPSoldierInfo.json'
      - 'data/configdata/ConfigDataArmyInfo.json'
      - '.github/workflows/soldier-stage1-5-validation.yml'
  workflow_dispatch:

jobs:
  validate-soldier-stage1-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose SP Soldier framing
        run: node scripts/diagnose_sp_soldier_frames.cjs
      - name: Run Soldier stage 1-5 final validation
        run: node scripts/validate_soldier_stage1_5.cjs
