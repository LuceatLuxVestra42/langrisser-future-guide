name: Soldier Training Material Assets A1

on:
  push:
    branches:
      - work/soldier-training-material-assets-stage1
    paths:
      - data/generated/soldier-training-material-census.v1.json
      - data/validation/soldier-training-material-census.v1.json
      - data/generated/soldier-training-material-iteminfo.v1.json
      - data/validation/soldier-training-material-iteminfo.v1.json
      - data/validation/soldier-training-material-assets-a0.v1.json
      - data/contracts/soldier-training-material-asset-intake.v1.json
      - data/validation/soldier-training-material-assets-a1.v1.json
      - tools/asset-intake/adapters/soldier-training-material-v1.mjs
      - tools/asset-intake/cli/validate-soldier-training-material-a1.mjs
      - scripts/generate-soldier-training-material-assets-a1.mjs
      - .github/workflows/soldier-training-material-assets-a1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shared Asset Intake contract
        run: node tools/asset-intake/cli/validate-contract-v1.mjs

      - name: Generate Soldier training material A1 contract
        run: node scripts/generate-soldier-training-material-assets-a1.mjs

      - name: Validate Soldier training material A1
        run: node tools/asset-intake/cli/validate-soldier-training-material-a1.mjs

      - name: Commit deterministic A1 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/contracts/soldier-training-material-asset-intake.v1.json \
            data/validation/soldier-training-material-assets-a1.v1.json
          if git diff --cached --quiet; then
            echo 'Soldier training material A1 outputs already current.'
          else
            git commit -m 'Freeze Soldier training material Asset Intake A1 [skip ci]'
            git push origin HEAD:work/soldier-training-material-assets-stage1
          fi
