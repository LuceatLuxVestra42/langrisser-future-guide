name: Soldier Training Material Assets A6

on:
  push:
    branches:
      - work/soldier-training-material-assets-stage1
    paths:
      - scripts/deliver-soldier-training-material-assets-a6.py
      - data/manifests/soldier-training-material-assets-a5.v1.json
      - data/validation/soldier-training-material-assets-a5.v1.json
      - public/images/soldier-training-materials/**
      - .github/workflows/soldier-training-material-assets-a6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned WebP encoder dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate and validate lossless WebP delivery
        run: python scripts/deliver-soldier-training-material-assets-a6.py

      - name: Require A6 PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('data/validation/soldier-training-material-assets-a6.v1.json').read_text())
          assert result['status'] == 'PASS', result
          assert result['completion'] == 'COMPLETE', result
          assert result['deliveryStatus'] == 'READY_FOR_A7_SOLDIER_UI_INTEGRATION', result
          c = result['counts']
          for key in ('target','sourcePng','webpGenerated','webpVerified','dimensions172x172','losslessPixelParity','alphaParity','uniqueItemIds','uniqueSourcePaths','uniqueWebpPaths'):
              assert c[key] == 24, (key, c[key])
          assert c['missing'] == 0 and c['extras'] == 0 and c['errors'] == 0, result
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit WebP assets and A6 checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/images/soldier-training-materials-webp \
            data/manifests/soldier-training-material-assets-a6-webp.v1.json \
            data/validation/soldier-training-material-assets-a6.v1.json \
            docs/checkpoints/soldier-training-material-assets-a6.md
          if git diff --cached --quiet; then
            echo 'Soldier training material A6 WebP delivery already current.'
          else
            git commit -m 'Deliver Soldier training material lossless WebP A6 [skip ci]'
            git push origin HEAD:work/soldier-training-material-assets-stage1
          fi
