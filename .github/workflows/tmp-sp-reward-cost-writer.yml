name: tmp-sp-reward-cost-hydrate-diagnostic

on:
  push:
    branches:
      - fix/sp-reward-skill-cost
    paths:
      - .github/workflows/tmp-sp-reward-cost-writer.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture resolver result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node -e "const m=require('./scripts/configdata-source-pack-maintenance-root.cjs');process.stdout.write(m.resolveConfigDataSourceRoot())" > .tmp-sp-cost-hydrate.log 2>&1
          rc=$?
          echo >> .tmp-sp-cost-hydrate.log
          echo "EXIT_CODE=$rc" >> .tmp-sp-cost-hydrate.log
          cat .tmp-sp-cost-hydrate.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-sp-cost-hydrate.log
          git commit -m 'chore: capture SP cost hydrate diagnostic'
          git pull --rebase origin fix/sp-reward-skill-cost
          git push origin HEAD:fix/sp-reward-skill-cost
