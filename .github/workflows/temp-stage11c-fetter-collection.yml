name: Temporary Stage11C fetter collection
on:
  push:
    branches:
      - diag/sp-runtime-code-asset-locate-20260910
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract current IL2CPP pair and partial dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage11c-fetter out/stage11c-fetter
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib
          D=pathlib.Path('/tmp/stage11c-fetter'); V='1.1.113'; B=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{V}'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          targets={1:('Client/GameAssembly.dll','GameAssembly.dll'),66:('Client/Langrisser_Data/il2cpp_data/Metadata/global-metadata.dat','global-metadata.dat')}
          def rq(u,a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          def hs(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:return int(r.headers['Content-Length'])
          def ent(u,t):
            n=min(131072,t); x=rq(u,t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(u,o,o+s-1); i=0; out=[]
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace'); out.append((nm,me,cr,co,un,lo)); i+=46+fn+ex+cm
            return out
          def get(u,e):
            nm,me,cr,co,un,lo=e; h=rq(u,lo,lo+4095); fn,ex=struct.unpack_from('<HH',h,26); st=lo+30+fn+ex; d=rq(u,st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; return raw
          for part,(target,out) in targets.items():
            u=f'{B}/InstallPage_{V}_{part}.zip'; e=next(e for e in ent(u,hs(u)) if e[0]==target); (D/out).write_bytes(get(u,e))
          PY
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git /tmp/Il2CppDumper >/dev/null 2>&1
          dotnet build /tmp/Il2CppDumper/Il2CppDumper.sln -c Release >/dev/null 2>&1
          DLL=$(find /tmp/Il2CppDumper -path '*/bin/Release/*/Il2CppDumper.dll' | head -1)
          mkdir -p /tmp/stage11c-fetter/dump
          set +e
          dotnet "$DLL" /tmp/stage11c-fetter/GameAssembly.dll /tmp/stage11c-fetter/global-metadata.dat /tmp/stage11c-fetter/dump > out/stage11c-fetter/dumper.log 2>&1
          set -e
          test -f /tmp/stage11c-fetter/dump/script.json
          test -f /tmp/stage11c-fetter/dump/dump.cs
      - name: Extract Fetter and SP modifier seams
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json,pathlib,re
          D=pathlib.Path('/tmp/stage11c-fetter/dump'); O=pathlib.Path('out/stage11c-fetter')
          s=json.loads((D/'script.json').read_text(errors='replace')); rows=[]
          def walk(x):
            if isinstance(x,dict):
              if 'Address' in x and ('Name' in x or 'Signature' in x):
                try:
                  a=x['Address']; a=int(a,16) if isinstance(a,str) else int(a); a=a-0x180000000 if a>=0x180000000 else a
                  name=str(x.get('Name') or ''); sig=str(x.get('Signature') or '')
                  text=name+' '+sig
                  if any(k.lower() in text.lower() for k in ['fetter','hero3_','collectstaticproperty','collectpropertymodifier','sphero','computesoldierproperties']): rows.append((a,name,sig))
                except: pass
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(s); rows=sorted(set(rows))
          dump=(D/'dump.cs').read_text(errors='replace')
          keys=['HeroFetter','Fetter','CollectStaticPropertyModifier','CollectPropertyModifier','Hero3_HPCmdAdd','GetSPHeroInfoIfJobIsSP']
          ex={}
          for k in keys:
            hits=[]
            for m in re.finditer(re.escape(k),dump,re.I):
              hits.append(dump[max(0,m.start()-1800):min(len(dump),m.end()+3000)])
              if len(hits)>=12: break
            ex[k]=hits
          (O/'methods.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          (O/'excerpts.txt').write_text('\n\n'.join('===== '+k+' =====\n'+'\n---\n'.join(v) for k,v in ex.items()))
          print(json.dumps({'methodCount':len(rows),'methods':rows[:200],'excerptCounts':{k:len(v) for k,v in ex.items()}},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage11c-fetter
          path: out/stage11c-fetter
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-stage11c-fetter-collection.yml
          git commit -m "Remove temporary Stage11C fetter probe"
          git push origin HEAD:${GITHUB_REF_NAME}
