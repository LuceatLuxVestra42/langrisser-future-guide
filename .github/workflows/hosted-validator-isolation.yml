name: Hosted Validator Isolation

on:
  pull_request:
    paths:
      - '.github/workflows/hosted-validator-isolation.yml'

permissions:
  contents: read

env:
  HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/

jobs:
  isolate-hosted-validators:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-linux-x64.zip

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Confirm hosted source is PR base
        shell: bash
        run: |
          set -euo pipefail
          manifest=/tmp/authoritative-pages-source.json
          probe="${HOSTED_BASE_URL}authoritative-pages-source.json?isolation=${GITHUB_RUN_ID}-$(date +%s)"
          curl --silent --show-error --fail --location --max-time 20 "$probe" -o "$manifest"
          live_sha="$(node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(value.sourceSha||''))" "$manifest")"
          printf 'HOSTED_ISOLATION_SOURCE expected=%s live=%s\n' "$EXPECTED_SOURCE_SHA" "$live_sha"
          test "$live_sha" = "$EXPECTED_SOURCE_SHA"

      - name: Install Chromium QA runtime
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Hero browser pre-route probe
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = process.env.HOSTED_BASE_URL;
          async function probe(heroId, phase) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            const requestFailures = [];
            const badResponses = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('requestfailed', r => requestFailures.push({ url: r.url(), failure: r.failure()?.errorText || '' }));
            page.on('response', r => { if (r.status() >= 400) badResponses.push({ status: r.status(), url: r.url() }); });
            let navStatus = null;
            let navError = null;
            try {
              const response = await page.goto(new URL(`heroes/${heroId}/?diag=${phase}-${Date.now()}`, base).toString(), { waitUntil: 'domcontentloaded', timeout: 45000 });
              navStatus = response?.status() ?? null;
              await page.waitForTimeout(5000);
            } catch (error) {
              navError = String(error);
            }
            const state = await page.evaluate(() => ({
              href: location.href,
              readyState: document.readyState,
              title: document.title,
              bodyText: (document.body?.innerText || '').slice(0, 1200),
              bodyTextLength: (document.body?.innerText || '').length,
              bodyHtmlLength: (document.body?.innerHTML || '').length,
              headings: [...document.querySelectorAll('h1,h2,h3')].slice(0, 20).map(n => n.textContent?.trim() || ''),
              nextButtons: [...document.querySelectorAll('button')].filter(n => n.getAttribute('aria-label') === '다음 일러스트' || n.textContent?.includes('다음 일러스트')).length,
              representativeArtwork: document.querySelectorAll('img[alt*="대표 일러스트"]').length,
              awakeningSections: document.querySelectorAll('[data-hero-awakening-skill="true"]').length,
              scripts: [...document.scripts].map(s => s.src).filter(Boolean),
            }));
            console.log(JSON.stringify({ phase, heroId, navStatus, navError, ...state, pageErrors, consoleErrors, requestFailures, badResponses }, null, 2));
            await browser.close();
          }
          await probe(6, 'pre-route-hero6');
          await probe(14, 'pre-route-hero14');
          NODE

      - name: route-hosted-qa-strict
        run: node tools/route-hosted-qa/cli/check.mjs --expected-sha "$EXPECTED_SOURCE_SHA"

      - name: Hero browser post-route probe
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = process.env.HOSTED_BASE_URL;
          async function probe(heroId, phase) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            const requestFailures = [];
            const badResponses = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('requestfailed', r => requestFailures.push({ url: r.url(), failure: r.failure()?.errorText || '' }));
            page.on('response', r => { if (r.status() >= 400) badResponses.push({ status: r.status(), url: r.url() }); });
            let navStatus = null;
            let navError = null;
            try {
              const response = await page.goto(new URL(`heroes/${heroId}/?diag=${phase}-${Date.now()}`, base).toString(), { waitUntil: 'domcontentloaded', timeout: 45000 });
              navStatus = response?.status() ?? null;
              await page.waitForTimeout(5000);
            } catch (error) {
              navError = String(error);
            }
            const state = await page.evaluate(() => ({
              href: location.href,
              readyState: document.readyState,
              title: document.title,
              bodyText: (document.body?.innerText || '').slice(0, 1200),
              bodyTextLength: (document.body?.innerText || '').length,
              bodyHtmlLength: (document.body?.innerHTML || '').length,
              headings: [...document.querySelectorAll('h1,h2,h3')].slice(0, 20).map(n => n.textContent?.trim() || ''),
              nextButtons: [...document.querySelectorAll('button')].filter(n => n.getAttribute('aria-label') === '다음 일러스트' || n.textContent?.includes('다음 일러스트')).length,
              representativeArtwork: document.querySelectorAll('img[alt*="대표 일러스트"]').length,
              awakeningSections: document.querySelectorAll('[data-hero-awakening-skill="true"]').length,
              scripts: [...document.scripts].map(s => s.src).filter(Boolean),
            }));
            console.log(JSON.stringify({ phase, heroId, navStatus, navError, ...state, pageErrors, consoleErrors, requestFailures, badResponses }, null, 2));
            await browser.close();
          }
          await probe(6, 'post-route-hero6');
          await probe(14, 'post-route-hero14');
          NODE

      - name: authoritative-pages reproduction
        run: node scripts/validate-authoritative-pages-hosted.mjs
