name: hero-soldier-project-check-routing-repair

on:
  push:
    branches:
      - frontend/hero-soldier-command-f0

permissions:
  contents: write

jobs:
  repair-routing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected head lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor dc99b8aab60ec3465e8a5b0194df03278aaaecfe HEAD

      - name: Apply exact S0 owner routing and regression fixtures
        run: |
          node <<'NODE'
          const fs = require('fs');

          const ownerPath = 'tools/project-check/contracts/owners.v1.json';
          let owners = fs.readFileSync(ownerPath, 'utf8');
          const ruleId = 'sp-soldier-command-semantics-s0';
          if (!owners.includes(`\"id\": \"${ruleId}\"`)) {
            const anchor = `    {\n      \"id\": \"hero-soldier-relation\",`;
            if (!owners.includes(anchor)) throw new Error('owner-map insertion anchor missing');
            const rule = `    {\n      \"id\": \"${ruleId}\",\n      \"patterns\": [\n        \".github/workflows/sp-soldier-command-semantics-s0.yml\",\n        \"data/contracts/sp-soldier-command-semantics.v1.json\",\n        \"data/validation/sp-soldier-command-semantics-s0.v1.json\",\n        \"data/validation/sp-soldier-command-semantics-s0-f.v1.json\"\n      ],\n      \"owners\": [\n        \"soldier-canonical\"\n      ]\n    },\n`;
            owners = owners.replace(anchor, rule + anchor);
            fs.writeFileSync(ownerPath, owners);
          }

          const testPath = 'tools/project-check/test/project-check-self-test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const marker = "'data/contracts/sp-soldier-command-semantics.v1.json'";
          if (!test.includes(marker)) {
            const anchor = `expectOwners(\n  'package.json',\n  ['shared-build'],\n  ['production-build'],\n);\n`;
            if (!test.includes(anchor)) throw new Error('self-test insertion anchor missing');
            const fixtures = `${anchor}\nfor (const s0Path of [\n  '.github/workflows/sp-soldier-command-semantics-s0.yml',\n  'data/contracts/sp-soldier-command-semantics.v1.json',\n  'data/validation/sp-soldier-command-semantics-s0.v1.json',\n  'data/validation/sp-soldier-command-semantics-s0-f.v1.json',\n]) {\n  expectOwners(\n    s0Path,\n    ['soldier-canonical'],\n    ['soldier-canonical'],\n  );\n}\n`;
            test = test.replace(anchor, fixtures);
            fs.writeFileSync(testPath, test);
          }
          NODE

      - name: Run Project Check self-test
        run: node tools/project-check/test/project-check-self-test.mjs

      - name: Verify bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          allowed='^(tools/project-check/contracts/owners\.v1\.json|tools/project-check/test/project-check-self-test\.mjs)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected mutation: $path"; exit 1; }
          done

      - name: Commit routing repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/project-check/contracts/owners.v1.json tools/project-check/test/project-check-self-test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'R3: route SP soldier command S0 authority explicitly'
          git push
