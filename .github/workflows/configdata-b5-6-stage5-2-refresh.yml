name: ConfigData B5.6 Stage5-2 Artifact Refresh

on:
  push:
    branches:
      - configdata/b5-6-maintenance-root-v2
    paths:
      - '.github/workflows/configdata-b5-6-stage5-2-refresh.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: configdata-b5-6-stage5-2-refresh
  cancel-in-progress: false

jobs:
  adopt-validated-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: configdata/b5-6-maintenance-root-v2

      - name: Download exact validated Stage5-2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage5-2"
          gh api repos/${{ github.repository }}/actions/artifacts/9838793992/zip > "$RUNNER_TEMP/stage5-2.zip"
          unzip -q "$RUNNER_TEMP/stage5-2.zip" -d "$RUNNER_TEMP/stage5-2"
          test "$(git hash-object "$RUNNER_TEMP/stage5-2/generated/soldier-detail-stage5-2.v1.json")" = "90c5329cb8e53b0b73b789d4cad6c7523caecae0"
          test "$(git hash-object "$RUNNER_TEMP/stage5-2/validation/soldier-stage5-2-combat.v1.json")" = "9e037ecfca0c6a7f9c3c87b8a3842afbc314d24d"
          test "$(git hash-object data/validation/soldier-stage4-8-baseline.v1.json)" = "ed9fe0a46807638be2535b6d8cdcf9149fb192d1"

      - name: Freeze Stage5-2 provenance-only refresh and remove helper
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/stage5-2/generated/soldier-detail-stage5-2.v1.json" data/generated/soldier-detail-stage5-2.v1.json
          cp "$RUNNER_TEMP/stage5-2/validation/soldier-stage5-2-combat.v1.json" data/validation/soldier-stage5-2-combat.v1.json
          test "$(git hash-object data/generated/soldier-detail-stage5-2.v1.json)" = "90c5329cb8e53b0b73b789d4cad6c7523caecae0"
          test "$(git hash-object data/validation/soldier-stage5-2-combat.v1.json)" = "9e037ecfca0c6a7f9c3c87b8a3842afbc314d24d"
          git rm .github/workflows/configdata-b5-6-stage5-2-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/soldier-detail-stage5-2.v1.json data/validation/soldier-stage5-2-combat.v1.json
          git commit -m "freeze Soldier stage 5-2 combat PASS after B5.6"
          git push origin HEAD:configdata/b5-6-maintenance-root-v2
