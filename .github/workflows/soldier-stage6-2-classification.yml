name: Soldier Stage 6-2 Classification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/finalize-soldier-stage6-2-classification.cjs'
      - 'data/validation/soldier-stage6-0-checkpoint.v1.json'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage3-final.v1.json'
      - 'data/validation/soldier-stage5-3-ability.v1.json'
      - 'data/validation/soldier-stage5-6-sp-detail.v1.json'
      - 'data/validation/hero-soldier-relation-validation.v1.json'
      - 'data/generated/soldier-stage6-2-classification.v1.json'
      - 'data/validation/soldier-stage6-2-classification.v1.json'
      - '.github/workflows/soldier-stage6-2-classification.yml'
  pull_request:
    paths:
      - 'scripts/finalize-soldier-stage6-2-classification.cjs'
      - 'data/validation/soldier-stage6-0-checkpoint.v1.json'
      - 'data/generated/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage6-1-full-records.v1.json'
      - 'data/validation/soldier-stage3-final.v1.json'
      - 'data/validation/soldier-stage5-3-ability.v1.json'
      - 'data/validation/soldier-stage5-6-sp-detail.v1.json'
      - 'data/validation/hero-soldier-relation-validation.v1.json'
      - 'data/generated/soldier-stage6-2-classification.v1.json'
      - 'data/validation/soldier-stage6-2-classification.v1.json'
      - '.github/workflows/soldier-stage6-2-classification.yml'

permissions:
  contents: read

jobs:
  reject-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject protected main as explicit producer target
        run: |
          echo 'Explicit Soldier Stage 6-2 producer runs must target a non-main branch. Select the branch/ref to freeze, then open a normal PR.'
          exit 1

  generate-validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and validate Soldier Stage 6-2 classification
        run: node scripts/finalize-soldier-stage6-2-classification.cjs

      - name: Upload Stage 6-2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage6-2-classification
          path: |
            data/generated/soldier-stage6-2-classification.v1.json
            data/validation/soldier-stage6-2-classification.v1.json

      - name: Verify frozen artifacts on main or PR
        run: git diff --exit-code -- data/generated/soldier-stage6-2-classification.v1.json data/validation/soldier-stage6-2-classification.v1.json

  explicit-producer:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and validate Soldier Stage 6-2 classification
        run: node scripts/finalize-soldier-stage6-2-classification.cjs

      - name: Upload Stage 6-2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage6-2-classification
          path: |
            data/generated/soldier-stage6-2-classification.v1.json
            data/validation/soldier-stage6-2-classification.v1.json

      - name: Freeze generated artifacts on explicit producer run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/soldier-stage6-2-classification.v1.json \
            data/validation/soldier-stage6-2-classification.v1.json
          if git diff --cached --quiet; then
            echo "Soldier Stage 6-2 artifacts already frozen."
          else
            git commit -m "freeze Soldier stage 6-2 classification PASS"
            git push origin HEAD:${{ github.ref_name }}
          fi
