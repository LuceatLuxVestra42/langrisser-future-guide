name: ConfigData B5.9 Stage4-8 Freeze Once

on:
  push:
    branches:
      - configdata/b5-9-soldier-stage2-writeback-v1
    paths:
      - '.github/workflows/configdata-b5-9-stage4-8-freeze-once.yml'

permissions:
  contents: write

jobs:
  freeze-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: configdata/b5-9-soldier-stage2-writeback-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate reviewed Stage4-8 baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-soldier-stage4-1-input.cjs
          node scripts/finalize-soldier-stage2.cjs
          node scripts/validate-soldier-stage4-2-master.cjs
          git show c2276d1162dae52a1762e6381e7dd195c917da2f:data/generated/soldier-stage3.v1.json > "$RUNNER_TEMP/soldier-stage3-pre-4-1.json"
          BASELINE_STAGE3_PATH="$RUNNER_TEMP/soldier-stage3-pre-4-1.json" node scripts/finalize-soldier-stage3.cjs
          BASELINE_STAGE3_PATH="$RUNNER_TEMP/soldier-stage3-pre-4-1.json" node scripts/finalize-soldier-stage3-postprocess.cjs
          BASELINE_STAGE3_PATH="$RUNNER_TEMP/soldier-stage3-pre-4-1.json" node scripts/validate-soldier-stage4-3-trainingtech.cjs
          BASELINE_STAGE3_PATH="$RUNNER_TEMP/soldier-stage3-pre-4-1.json" node scripts/validate-soldier-stage4-4-sp-mission.cjs
          BASELINE_STAGE3_PATH="$RUNNER_TEMP/soldier-stage3-pre-4-1.json" node scripts/validate-soldier-stage4-5-sp-hero-reward.cjs
          node scripts/finalize-soldier-stage3-12.cjs
          node scripts/finalize-hero-soldier-relation-layer.cjs
          node scripts/validate-soldier-stage4-6-relation-consumer.cjs
          node scripts/validate-soldier-stage4-7-domain-fixtures.cjs
          node scripts/validate-soldier-stage4-8-baseline.cjs

      - name: Require reviewed semantic boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('data/validation/soldier-stage4-8-baseline.v1.json', 'utf8'));
          const c = b.changeRecord || {};
          if (b.status !== 'PASS') throw new Error(`Stage4-8 status ${b.status}`);
          if ((b.errors || []).length || (b.reviews || []).length) throw new Error('Stage4-8 errors/reviews not empty');
          if ((c.dataChanges || []).length !== 0 || (c.contractChanges || []).length !== 0) throw new Error('unexpected data/contract changes');
          if ((c.artifactChanges || []).length !== 0 || (c.validationChanges || []).length !== 0) throw new Error('unexpected artifact/validation semantic changes');
          if (b.counts?.relationEdges !== 5977) throw new Error(`relation edge drift ${b.counts?.relationEdges}`);
          const changed = (c.pipelineChanges || []).map(x => x.path).sort();
          const expected = ['.github/workflows/soldier-stage4-8-baseline.yml','scripts/finalize-soldier-stage2.cjs'].sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) throw new Error(`unexpected pipeline changes ${JSON.stringify(changed)}`);
          console.log(JSON.stringify({status:'PASS', classification:c.classification, relationEdges:b.counts.relationEdges, pipelineChanges:changed, artifactChanges:0, validationChanges:0}, null, 2));
          NODE

      - name: Commit baseline and retire one-time producer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/soldier-stage4-8-baseline.v1.json
          git rm .github/workflows/configdata-b5-9-stage4-8-freeze-once.yml
          git diff --cached --name-status
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m "B5.9 freeze revalidated Soldier Stage4-8 baseline"
          git push origin HEAD:configdata/b5-9-soldier-stage2-writeback-v1
