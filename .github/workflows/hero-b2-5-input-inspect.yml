name: Hero B2-5 SP input inspection

on:
  push:
    branches:
      - b2-5-sp-bonded-producer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect B2-5 inputs
        run: node scripts/inspect_hero_b2_5_inputs.cjs
