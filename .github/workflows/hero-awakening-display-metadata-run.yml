name: hero-awakening-display-metadata-run

on:
  push:
    branches: [hero-awakening-display-metadata]
    paths: [.github/workflows/hero-awakening-display-metadata-run.yml]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch owning producers and validator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              return text.replace(old, new, 1)

          # Stage 4-4 remains the owner of SkillInfo presentation-field decoding.
          p = Path('scripts/prepare_hero_skill_acquisition_stage44.cjs')
          text = p.read_text()
          status = "  const status = hardErrors.length ? 'FAIL' : review.length ? 'REVIEW' : 'PASS';\n"
          text = replace_once(text, status, status + """  const skillInfoPresentationCatalog = hardErrors.length
            ? []
            : skillSource.map((skill) => ({
                skillId: skill.id,
                displayType: skill.displayType,
                cooldown: skill.cooldown,
                range: skill.range,
                areaOrTarget: skill.areaOrTarget,
              })).sort((a, b) => a.skillId - b.skillId);
          """, 'Stage 4-4 status')
          tail = "    records: hardErrors.length ? [] : records,\n  });\n  writeJson(summaryPath, {"
          text = replace_once(text, tail, """    records: hardErrors.length ? [] : records,
              skillInfoPresentationCount: skillInfoPresentationCatalog.length,
              skillInfoPresentationCatalog,
            });
            writeJson(summaryPath, {""", 'Stage 4-4 output')
          line = "    generatedHeroCount: hardErrors.length ? 0 : records.length,\n"
          text = replace_once(text, line, line + "    skillInfoPresentationCount: hardErrors.length ? 0 : skillSource.length,\n", 'Stage 4-4 summary')
          p.write_text(text)

          # Stage 4-5 keeps AwakenInfo.Level2SkillID as the relation and only consumes Stage 4-4 metadata by exact skillId.
          p = Path('scripts/prepare_hero_basic_combat_stage45.cjs')
          text = p.read_text()
          old = """function skillSnapshot(row) {
            if (!row) return null;
            return {
              skillId: row.ID,
              nameCn: row.Name ?? null,
              desc: row.Desc ?? null,
              iconPath: row.IconPath ?? row.Icon ?? null,
            };
          }
          """
          new = """function skillSnapshot(row, presentation = null) {
            if (!row) return null;
            const snapshot = {
              skillId: row.ID,
              nameCn: row.Name ?? null,
              desc: row.Desc ?? null,
              iconPath: row.IconPath ?? row.Icon ?? null,
            };
            if (!presentation) return snapshot;
            return {
              ...snapshot,
              displayType: presentation.displayType,
              cooldown: presentation.cooldown,
              range: presentation.range,
              areaOrTarget: presentation.areaOrTarget,
            };
          }
          """
          text = replace_once(text, old, new, 'Stage 4-5 skillSnapshot')
          anchor = "  if (!['PASS', 'REVIEW'].includes(skillAcquisition.status)) errors.push(`Stage 4-4 status=${skillAcquisition.status}`);\n\n"
          insertion = anchor + """  const stage44SkillInfoRows = Array.isArray(skillAcquisition.skillInfoPresentationCatalog)
            ? skillAcquisition.skillInfoPresentationCatalog
            : [];
          const stage44SkillInfoById = indexUnique(
            stage44SkillInfoRows,
            'skillId',
            'Stage 4-4 skillInfoPresentationCatalog',
            errors,
          );
          if (skillAcquisition.skillInfoPresentationCount !== stage44SkillInfoRows.length) {
            errors.push(`Stage 4-4 skillInfoPresentationCount=${String(skillAcquisition.skillInfoPresentationCount)} rows=${stage44SkillInfoRows.length}`);
          }

          """
          text = replace_once(text, anchor, insertion, 'Stage 4-5 Stage 4-4 index')
          old = """        const awakenSkill = Number.isInteger(level2SkillId) && level2SkillId > 0 ? skillIndex.get(level2SkillId) : null;
                  if (Number.isInteger(level2SkillId) && level2SkillId > 0 && !awakenSkill) errors.push(`heroId ${treeHero.heroId}: awakening skill ${level2SkillId} missing from SkillInfo`);
                  awakening = {
                    status: awakenSkill ? 'VERIFIED' : 'FAIL',
                    awakenId: awaken.ID,
                    nameCn: awaken.Name ?? null,
                    level2Status: awakenSkill ? 'DEFINED' : 'UNRESOLVED',
                    level2SkillId: Number.isInteger(level2SkillId) && level2SkillId > 0 ? level2SkillId : null,
                    skill: skillSnapshot(awakenSkill),
                  };
                  if (awakening.status === 'VERIFIED') awakeningSummary.verifiedLevel2Skill += 1;
          """
          new = """        const awakenSkill = Number.isInteger(level2SkillId) && level2SkillId > 0 ? skillIndex.get(level2SkillId) : null;
                  if (Number.isInteger(level2SkillId) && level2SkillId > 0 && !awakenSkill) errors.push(`heroId ${treeHero.heroId}: awakening skill ${level2SkillId} missing from SkillInfo`);
                  const stage44AwakenSkill = Number.isInteger(level2SkillId) && level2SkillId > 0 ? stage44SkillInfoById.get(level2SkillId) : null;
                  if (Number.isInteger(level2SkillId) && level2SkillId > 0 && !stage44AwakenSkill) errors.push(`heroId ${treeHero.heroId}: awakening skill ${level2SkillId} missing from Stage 4-4 skillInfoPresentationCatalog`);
                  let metadataValid = Boolean(awakenSkill && stage44AwakenSkill);
                  if (stage44AwakenSkill) {
                    for (const field of ['displayType', 'cooldown', 'range', 'areaOrTarget']) {
                      if (!hasOwn(stage44AwakenSkill, field)) {
                        errors.push(`heroId ${treeHero.heroId}: awakening skill ${level2SkillId} Stage 4-4 missing ${field}`);
                        metadataValid = false;
                      }
                    }
                  }
                  const resolvedAwakenSkill = metadataValid ? skillSnapshot(awakenSkill, stage44AwakenSkill) : null;
                  awakening = {
                    status: resolvedAwakenSkill ? 'VERIFIED' : 'FAIL',
                    awakenId: awaken.ID,
                    nameCn: awaken.Name ?? null,
                    level2Status: resolvedAwakenSkill ? 'DEFINED' : 'UNRESOLVED',
                    level2SkillId: Number.isInteger(level2SkillId) && level2SkillId > 0 ? level2SkillId : null,
                    skill: resolvedAwakenSkill,
                  };
                  if (awakening.status === 'VERIFIED') awakeningSummary.verifiedLevel2Skill += 1;
          """
          text = replace_once(text, old, new, 'Stage 4-5 awakening')
          p.write_text(text)

          # Independent validator checks every defined awakening against the Stage 4-4 exact-ID metadata catalog.
          p = Path('scripts/validate_hero_stage4_final.cjs')
          text = p.read_text()
          anchor = "const errors = [];\n\nconst skillRows = loadArray('ConfigDataSkillInfo');\n"
          insertion = """const errors = [];

          const stage44SkillInfoRows = Array.isArray(skills.skillInfoPresentationCatalog)
            ? skills.skillInfoPresentationCatalog
            : [];
          const stage44SkillInfoById = new Map();
          for (const skill of stage44SkillInfoRows) {
            const skillId = skill?.skillId;
            if (!Number.isInteger(skillId) || skillId <= 0) {
              errors.push(`Stage 4-4 skillInfoPresentationCatalog invalid skillId=${String(skillId)}`);
              continue;
            }
            if (stage44SkillInfoById.has(skillId)) errors.push(`Stage 4-4 skillInfoPresentationCatalog duplicate skillId=${skillId}`);
            else stage44SkillInfoById.set(skillId, skill);
            for (const field of ['displayType', 'cooldown', 'range', 'areaOrTarget']) {
              if (!Object.prototype.hasOwnProperty.call(skill, field)) errors.push(`Stage 4-4 skillInfoPresentationCatalog ${skillId} missing ${field}`);
            }
          }
          if (skills.skillInfoPresentationCount !== stage44SkillInfoRows.length) {
            errors.push(`Stage 4-4 skillInfoPresentationCount=${String(skills.skillInfoPresentationCount)} rows=${stage44SkillInfoRows.length}`);
          }

          const skillRows = loadArray('ConfigDataSkillInfo');
          """
          text = replace_once(text, anchor, insertion, 'validator Stage 4-4 index')
          text = replace_once(text, "  missingSkillReference: 0,\n};", "  missingSkillReference: 0,\n  presentationMetadataMatched: 0,\n};", 'validator awakening audit')
          old = """    if (generated.level2SkillId !== level2SkillId) errors.push(`heroId ${heroId}: generated Level2SkillID=${generated.level2SkillId}, expected ${level2SkillId}`);
              if (generated.skill?.skillId !== level2SkillId) errors.push(`heroId ${heroId}: generated awakening Skill snapshot mismatch`);
              awakeningAudit.verifiedLevel2Skill += 1;
          """
          new = """    if (generated.level2SkillId !== level2SkillId) errors.push(`heroId ${heroId}: generated Level2SkillID=${generated.level2SkillId}, expected ${level2SkillId}`);
              if (generated.skill?.skillId !== level2SkillId) errors.push(`heroId ${heroId}: generated awakening Skill snapshot mismatch`);
              const stage44Skill = stage44SkillInfoById.get(level2SkillId);
              if (!stage44Skill) {
                errors.push(`heroId ${heroId}: Stage 4-4 presentation metadata missing awakening skill ${level2SkillId}`);
              } else {
                let presentationMatch = true;
                for (const field of ['displayType', 'cooldown', 'range', 'areaOrTarget']) {
                  if (!Object.prototype.hasOwnProperty.call(generated.skill || {}, field)) {
                    errors.push(`heroId ${heroId}: generated awakening skill ${level2SkillId} missing ${field}`);
                    presentationMatch = false;
                  } else if (generated.skill[field] !== stage44Skill[field]) {
                    errors.push(`heroId ${heroId}: generated awakening skill ${level2SkillId} ${field}=${String(generated.skill[field])} Stage 4-4=${String(stage44Skill[field])}`);
                    presentationMatch = false;
                  }
                }
                if (presentationMatch) awakeningAudit.presentationMetadataMatched += 1;
              }
              awakeningAudit.verifiedLevel2Skill += 1;
          """
          text = replace_once(text, old, new, 'validator awakening parity')
          line = "if (awakeningAudit.missingSkillReference !== 0) errors.push(`awakening missing SkillInfo references=${awakeningAudit.missingSkillReference}`);\n"
          text = replace_once(text, line, line + "if (awakeningAudit.presentationMetadataMatched !== 257) errors.push(`awakening Stage 4-4 presentation metadata parity=${awakeningAudit.presentationMetadataMatched}, expected 257`);\n", 'validator presentation invariant')
          p.write_text(text)
          PY
      - name: Regenerate Stage 4-4
        run: npm run inspect:hero-skills
      - name: Regenerate Stage 4-5
        run: npm run inspect:hero-combat
      - name: Validate hero-canonical
        run: npm run validate:coverage:hero-canonical
      - name: Check intended diff
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(scripts/prepare_hero_skill_acquisition_stage44\.cjs|scripts/prepare_hero_basic_combat_stage45\.cjs|scripts/validate_hero_stage4_final\.cjs|data/generated/hero-skill-acquisition\.v1\.json|data/validation/hero-skill-stage4-4-summary\.v1\.json|data/generated/hero-basic-combat\.v1\.json|data/validation/hero-basic-combat-stage4-5-summary\.v1\.json|\.github/workflows/hero-awakening-display-metadata-run\.yml)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          [ -z "$unexpected" ] || { echo "Unexpected tracked mutation:"; echo "$unexpected"; exit 1; }
          git diff --name-only
      - name: Commit completion unit and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare_hero_skill_acquisition_stage44.cjs scripts/prepare_hero_basic_combat_stage45.cjs scripts/validate_hero_stage4_final.cjs data/generated/hero-skill-acquisition.v1.json data/validation/hero-skill-stage4-4-summary.v1.json data/generated/hero-basic-combat.v1.json data/validation/hero-basic-combat-stage4-5-summary.v1.json
          git rm .github/workflows/hero-awakening-display-metadata-run.yml
          git commit -m "feat(hero): preserve awakening skill display metadata"
          git push origin HEAD:hero-awakening-display-metadata
