name: Skin Stage 3-2 Fresh Evidence

on:
  push:
    branches:
      - work/skin-stage3-2-fresh-evidence-20260901
    paths:
      - tools/asset-intake/contract/skin-stage3-2-fresh-source-inventory.v1.json
      - tools/asset-intake/diagnostics/scan-skin-stage3-2-fresh-source-v1.py
      - tools/asset-intake/diagnostics/scan-skin-stage3-2-fresh-source-v2.py
      - tools/asset-intake/diagnostics/build-skin-stage3-2-fresh-evidence-v1.py
      - .github/workflows/skin-stage3-2-fresh-source-inventory.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Unity parser
        shell: pwsh
        run: python -m pip install UnityPy==1.25.3
      - name: Build fresh authoritative Skin evidence
        shell: pwsh
        run: python tools/asset-intake/diagnostics/build-skin-stage3-2-fresh-evidence-v1.py
      - name: Validate existing Skin Stage 3-2 contract
        shell: pwsh
        run: node scripts/validate-skin-stage3-2-resolution-proof.mjs
      - name: Print completion summary
        shell: pwsh
        run: |
          python -c "import json; x=json.load(open('data/validation/skin-stage3-2-readiness.v1.json',encoding='utf-8')); e=json.load(open('data/evidence/skin-stage3-2-asset-resolution-evidence.v1.json',encoding='utf-8')); print(json.dumps({'status':x['status'],'completion':x['completion'],'failedChecks':x['metrics']['failedCheckCount'],'evidenceIssues':x['metrics']['evidenceIssueCount'],'fixtureCount':len(e['fixtures']),'dependencyCounts':{str(r['skinId']):len(r['spine']['dependencies']) for r in e['fixtures']}},ensure_ascii=False,indent=2))"
      - name: Upload fresh Stage 3-2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: skin-stage3-2-fresh-evidence
          path: |
            data/evidence/skin-stage3-2-asset-resolution-evidence.v1.json
            data/validation/skin-stage3-2-readiness.v1.json
            skin-stage3-2-fresh-model-resource-map.v1.json
          if-no-files-found: error
