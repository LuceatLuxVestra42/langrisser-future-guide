name: Skin FULLART-0 Form Families

on:
  push:
    branches:
      - work/skin-stage3-3-batched-20260901
    paths:
      - scripts/extract-skin-fullart0-general-source.py
      - .github/workflows/skin-fullart0-form-families.yml
  workflow_dispatch:

jobs:
  compare-skin-102-families:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current work branch
        uses: actions/checkout@v4
        with:
          ref: work/skin-stage3-3-batched-20260901

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded extraction dependency
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3

      - name: Extract current General primary resource 102
        run: python scripts/extract-skin-fullart0-general-source.py

      - name: Summarize General source morphology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/evidence/skin-fullart0-general-source.v1.json')
          d = json.loads(p.read_text())
          print('resourceFamily=', d['resourceFamily'])
          print('spineVersion=', d['spineBinaryHeader'].get('version'))
          print('skeletonDataAssetName=', d['chain'].get('skeletonDataAssetName'))
          for row in d.get('exports', []):
              print('export=', {k: row.get(k) for k in ('type','name','width','height','sizeBytes')})
          PY

      - name: Upload bounded family probe
        uses: actions/upload-artifact@v4
        with:
          name: skin-fullart0-form-families
          path: |
            data/evidence/skin-fullart0-general-source.v1.json
            .skin-fullart0-general-source/raw/*
          if-no-files-found: error

      - name: Remove execution-only state
        run: rm -rf .skin-fullart0-general-source scripts/__pycache__

      - name: Fail closed on unrelated tracked mutation
        run: |
          allowed='^data/evidence/skin-fullart0-general-source\.v1\.json$'
          bad="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            printf 'Unexpected paths after family probe:\n%s\n' "$bad"
            exit 1
          fi
