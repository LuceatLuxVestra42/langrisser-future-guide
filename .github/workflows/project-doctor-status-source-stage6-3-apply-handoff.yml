name: Project Status Stage 6-3 Apply Handoff

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Registered Stage 6-3 pipeline
        required: true
        type: choice
        options:
          - hero
          - soldier
      expected_predecessor:
        description: Exact currently active entry id (CAS guard)
        required: true
        type: string
      entry_id:
        description: Explicit candidate status-source entry id
        required: true
        type: string
      source_path:
        description: Explicit committed validation JSON path
        required: true
        type: string
      note:
        description: Optional promotion note
        required: false
        type: string
  workflow_call:
    inputs:
      pipeline:
        required: true
        type: string
      expected_predecessor:
        required: true
        type: string
      entry_id:
        required: true
        type: string
      source_path:
        required: true
        type: string
      note:
        required: false
        type: string
        default: ''

concurrency:
  group: project-status-write-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apply-handoff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INPUT_PIPELINE: ${{ inputs.pipeline }}
      INPUT_EXPECTED_PREDECESSOR: ${{ inputs.expected_predecessor }}
      INPUT_ENTRY_ID: ${{ inputs.entry_id }}
      INPUT_SOURCE_PATH: ${{ inputs.source_path }}
      INPUT_NOTE: ${{ inputs.note }}
    steps:
      - name: Reject direct main apply
        if: github.ref_name == 'main'
        run: |
          echo 'Stage 6-3 apply handoff must run on a work branch and reach main through a pull request.'
          exit 1

      - name: Checkout selected work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Stage 6-3 handoff self-tests
        run: node scripts/validate-project-doctor-status-source-stage6-3-apply-handoff.mjs

      - name: Preview guarded apply handoff
        shell: bash
        run: |
          ARGS=(
            --pipeline "$INPUT_PIPELINE"
            --expected-predecessor "$INPUT_EXPECTED_PREDECESSOR"
            --id "$INPUT_ENTRY_ID"
            --source "$INPUT_SOURCE_PATH"
            --check
          )
          if [ -n "$INPUT_NOTE" ]; then
            ARGS+=(--note "$INPUT_NOTE")
          fi
          node scripts/apply-project-doctor-status-source-handoff.mjs "${ARGS[@]}"

      - name: Apply guarded handoff and explicitly reseal D5
        shell: bash
        run: |
          ARGS=(
            --pipeline "$INPUT_PIPELINE"
            --expected-predecessor "$INPUT_EXPECTED_PREDECESSOR"
            --id "$INPUT_ENTRY_ID"
            --source "$INPUT_SOURCE_PATH"
            --apply
          )
          if [ -n "$INPUT_NOTE" ]; then
            ARGS+=(--note "$INPUT_NOTE")
          fi
          node scripts/apply-project-doctor-status-source-handoff.mjs "${ARGS[@]}"

      - name: Verify D5 remains fresh
        run: npm run doctor:freshness:validate

      - name: Verify Project Status projection remains current
        run: node scripts/build-project-status.mjs --check

      - name: Reject unexpected working-tree mutations
        shell: bash
        run: |
          UNEXPECTED="$({ git status --porcelain || true; } | awk '{print $2}' | while IFS= read -r path; do
            case "$path" in
              data/status-sources/*|\
              data/generated/project-doctor-active-source-registry.v1.json|\
              data/validation/project-doctor-active-source-registry-summary.v1.json|\
              data/generated/project-doctor-d1-1-status.v1.json|\
              data/validation/project-doctor-d1-1-summary.v1.json|\
              data/validation/project-doctor-d1-2-summary.v1.json|\
              data/generated/project-status.v1.json|\
              data/generated/project-doctor-d5-freshness.v1.json|\
              PROJECT_STATUS.md)
                ;;
              '')
                ;;
              *)
                echo "$path"
                ;;
            esac
          done)"
          if [ -n "$UNEXPECTED" ]; then
            echo 'Unexpected Stage 6-3 mutations:'
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Commit handoff result to work branch
        shell: bash
        run: |
          git add \
            data/status-sources \
            data/generated/project-doctor-active-source-registry.v1.json \
            data/validation/project-doctor-active-source-registry-summary.v1.json \
            data/generated/project-doctor-d1-1-status.v1.json \
            data/validation/project-doctor-d1-1-summary.v1.json \
            data/validation/project-doctor-d1-2-summary.v1.json \
            data/generated/project-status.v1.json \
            data/generated/project-doctor-d5-freshness.v1.json \
            PROJECT_STATUS.md

          if git diff --cached --quiet; then
            echo 'Stage 6-3 handoff is already fully current; no commit required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: apply project status handoff for ${INPUT_PIPELINE}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
