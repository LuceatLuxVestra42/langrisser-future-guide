name: Temporary Stage 5 Freshness Refresh

on:
  push:
    branches:
      - work/project-status-stage5-artifact-bridge
    paths:
      - '.github/workflows/tmp-stage5-freshness-refresh.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Stage 5 artifact bridge
        run: npm run doctor:source:bridge:self-test

      - name: Refresh Doctor freshness seal
        run: npm run doctor:freshness:refresh

      - name: Commit refreshed Doctor outputs
        shell: bash
        run: |
          PATHS=(
            data/generated/project-doctor-d5-freshness.v1.json
            data/generated/project-doctor-active-source-registry.v1.json
            data/validation/project-doctor-active-source-registry-summary.v1.json
            data/generated/project-doctor-d1-1-status.v1.json
            data/validation/project-doctor-d1-1-summary.v1.json
            data/validation/project-doctor-d1-2-summary.v1.json
          )

          if [ -z "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo 'Doctor freshness outputs are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${PATHS[@]}"
          git commit -m 'chore: refresh Stage 5 Doctor freshness'
          git push origin HEAD:"${GITHUB_REF_NAME}"
