name: Equipment Stage 3-3 General List

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/equipment-stage3-3-general-list.yml'
      - 'scripts/finalize-equipment-stage3-3-general-list.mjs'
      - 'scripts/validate-equipment-stage3-3-general-list.mjs'
      - 'data/contracts/equipment-stage3-3-general-list.v1.json'
      - 'data/contracts/equipment-stage3-1-page-schema.v1.json'
      - 'data/generated/equipment_stage2_3_filter_map.json'
      - 'data/generated/equipment_stage2_5_effects.json'
      - 'data/generated/equipment_stage2_7_acquisition.json'
      - 'data/generated/equipment_stage3_2_display_metadata.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Equipment Stage 3-3 general list
        run: node scripts/finalize-equipment-stage3-3-general-list.mjs
      - name: Validate Equipment Stage 3-3 general list
        run: node scripts/validate-equipment-stage3-3-general-list.mjs
      - name: Persist Stage 3-3 checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/equipment_stage3_3_general_list.json data/validation/equipment-stage3-3-general-list-summary.v1.json
          if git diff --cached --quiet; then
            echo "No Stage 3-3 changes"
            exit 0
          fi
          git commit -m "Freeze Equipment Stage 3-3 general list"
          git push
