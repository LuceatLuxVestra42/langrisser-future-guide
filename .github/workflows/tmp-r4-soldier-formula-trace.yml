name: Temporary R4 soldier formula trace
on:
  push:
    paths: ['.github/workflows/tmp-r4-soldier-formula-trace.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract GameAssembly and disassemble soldier formula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4f out/r4-soldier-formula
          python <<'PY'
          import binascii,pathlib,struct,urllib.request,zlib,hashlib
          u='http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_1.1.113/InstallPage_1.1.113_1.zip'; UA='Mozilla/5.0 Chrome/140 Safari/537.36'
          def rq(a,b):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity','Range':f'bytes={a}-{b}'}),timeout=120) as r:return r.read()
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD'),timeout=60) as r:t=int(r.headers['Content-Length'])
          n=min(131072,t); x=rq(t-n,t-1); p=x.rfind(b'PK\x05\x06'); _,_,_,_,s,o,_=struct.unpack_from('<HHHHIIH',x,p+4); c=rq(o,o+s-1); i=0
          while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
            fl,me=struct.unpack_from('<HH',c,i+8); cr,co,un=struct.unpack_from('<III',c,i+16); fn,ex,cm=struct.unpack_from('<HHH',c,i+28); lo=struct.unpack_from('<I',c,i+42)[0]; nm=c[i+46:i+46+fn].decode('utf-8' if fl&0x800 else 'cp437','replace')
            if nm=='Client/GameAssembly.dll':
              h=rq(lo,lo+4095); lfn,lex=struct.unpack_from('<HH',h,26); st=lo+30+lfn+lex; d=rq(st,st+co-1); raw=d if me==0 else zlib.decompress(d,-15); assert len(raw)==un and (binascii.crc32(raw)&0xffffffff)==cr; pathlib.Path('/tmp/r4f/GameAssembly.dll').write_bytes(raw); pathlib.Path('out/r4-soldier-formula/source.txt').write_text(f'sha256={hashlib.sha256(raw).hexdigest()}\nsize={len(raw)}\n'); break
            i+=46+fn+ex+cm
          PY
          objdump -D -Mintel --start-address=0x18179d2e0 --stop-address=0x18179d7f0 /tmp/r4f/GameAssembly.dll | tee out/r4-soldier-formula/ComputeSoldierBattleProperty.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-soldier-formula
          path: out/r4-soldier-formula
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-r4-soldier-formula-trace.yml
          git commit -m 'Remove temporary R4 soldier formula trace'
          git push origin HEAD:${GITHUB_REF_NAME}
