name: Temporary Awakening Skill Icon Validator Drift Fix

on:
  push:
    branches:
      - work/awakening-skill-icon-a2-materialize-20260910

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/awakening-skill-icon-a2-materialize-20260910
      - name: Update read-only validator for verified awakening icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate-hero-skill-icon-assets-readonly.mjs')
          s = p.read_text()
          old = '  ["UI/Icon/Skill_ABS/Skill_SPLeon2.png", { skillIds: [12528], part: 62, bundle: "14c4fe918356f47f0e9f5a59e77dae31e4eb4a0d19e30d898c9d8c1085b8eb12", raw: "154fb93aa05f63c9fd9209f6c9d656d0741fdaa2d86d2ce44613a2169d7bbcd5", rgba: "2cb351ff3ca777a334742320fd50eaf0246993a0fde36adba06989432df8f5c3", width: 172, height: 172 }],\n]);'
          new = '  ["UI/Icon/Skill_ABS/Skill_SPLeon2.png", { skillIds: [12528], part: 62, bundle: "14c4fe918356f47f0e9f5a59e77dae31e4eb4a0d19e30d898c9d8c1085b8eb12", raw: "154fb93aa05f63c9fd9209f6c9d656d0741fdaa2d86d2ce44613a2169d7bbcd5", rgba: "2cb351ff3ca777a334742320fd50eaf0246993a0fde36adba06989432df8f5c3", width: 172, height: 172 }],\n  ["UI/Icon/Skill_ABS/Skill_Super4.png", { skillIds: [12079], part: 62, bundle: "14c4fe918356f47f0e9f5a59e77dae31e4eb4a0d19e30d898c9d8c1085b8eb12", raw: "8bd9fea67f998b20e5cb8f2440d3b5f0e022466305ea8f802edd63b74ddabaef", rgba: "bd61b5dd9929182ef9a235e10c3b7940468cfdb86a95d93788ea8a08f70bc808", width: 170, height: 170 }],\n]);'
          assert s.count(old) == 1
          s = s.replace(old, new)
          assert s.count('manifest.scope?.targetUniqueIconCount !== 12') == 1
          s = s.replace('manifest.scope?.targetUniqueIconCount !== 12', 'manifest.scope?.targetUniqueIconCount !== 13')
          assert s.count('manifest.records.length !== 12') == 1
          s = s.replace('manifest.records.length !== 12', 'manifest.records.length !== 13')
          anchor = 'for (const row of hero.sp?.secondStageRewards?.skills ?? []) addCurrent(row.icon, row.skillId);\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + 'addCurrent(hero.normal?.awakening?.skill?.iconPath, hero.normal?.awakening?.level2SkillId);\n')
          assert s.count('central discipline icon leaked into 12-icon scope') == 1
          s = s.replace('central discipline icon leaked into 12-icon scope', 'central discipline icon leaked into 13-icon scope')
          p.write_text(s)
          PY
          node scripts/validate-hero-skill-icon-assets-readonly.mjs
      - name: Commit validator maintenance and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-awakening-skill-icon-validator-drift.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-hero-skill-icon-assets-readonly.mjs .github/workflows/temp-awakening-skill-icon-validator-drift.yml
          git commit -m 'Update hero skill icon validator for awakening asset'
          git push origin HEAD:work/awakening-skill-icon-a2-materialize-20260910
