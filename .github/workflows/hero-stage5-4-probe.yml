name: Hero Stage 5-4 SP probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-stage5-4-probe.yml'
      - 'scripts/probe_hero_stage5_4_sp.cjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe current SP relations
        run: node scripts/probe_hero_stage5_4_sp.cjs

      - name: Show compact probe summary
        run: |
          node - <<'NODE'
          const r=require('./data/validation/hero-page-stage5-4-probe.v1.json');
          console.log(JSON.stringify({summary:r.summary,typeSamples:r.typeSamples,errors:r.errors},null,2));
          NODE

      - name: Freeze probe checkpoint
        run: |
          TARGET='data/validation/hero-page-stage5-4-probe.v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'Probe checkpoint already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$TARGET"
            git commit -m 'Freeze Hero Stage 5-4 SP probe'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
