name: Hero Stage 5-4 SP probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hero-stage5-4-probe.yml'
      - 'scripts/probe_hero_stage5_4_sp.cjs'
      - 'scripts/probe_hero_stage5_4_mission_semantics.cjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe current SP relations
        run: node scripts/probe_hero_stage5_4_sp.cjs

      - name: Probe current SP mission semantics
        run: node scripts/probe_hero_stage5_4_mission_semantics.cjs

      - name: Show compact probe summary
        run: |
          node - <<'NODE'
          const r=require('./data/validation/hero-page-stage5-4-probe.v1.json');
          const m=require('./data/validation/hero-page-stage5-4-mission-semantics.v1.json');
          console.log(JSON.stringify({summary:r.summary,missionTypes:m.types,missionAnalyses:Object.fromEntries(m.types.map(t=>[t,{count:m.analyses[t].count,keys:m.analyses[t].keys,param1Values:m.analyses[t].param1Values,param2Values:m.analyses[t].param2Values}]))},null,2));
          NODE

      - name: Freeze probe checkpoints
        run: |
          TARGETS='data/validation/hero-page-stage5-4-probe.v1.json data/validation/hero-page-stage5-4-mission-semantics.v1.json'
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'Probe checkpoints already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add $TARGETS
            git commit -m 'Freeze Hero Stage 5-4 SP probes'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
