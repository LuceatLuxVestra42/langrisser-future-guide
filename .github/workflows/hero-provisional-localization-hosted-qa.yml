name: Hero Provisional Localization Hosted Browser QA

on:
  push:
    branches:
      - qa/hero-provisional-localization-hosted-20260830
    paths:
      - scripts/validate-hero-provisional-localization-hosted.mjs
      - .github/workflows/hero-provisional-localization-hosted-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA source
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Install authoritative Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify five provisional Hero names on hosted UI
        env:
          HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/
          EXPECTED_SOURCE_SHA: 60d47ea0c7f2a3dcb651baffbe6a6ae63514ad61
        run: node scripts/validate-hero-provisional-localization-hosted.mjs

# Focused QA only; branch is not intended for merge.
