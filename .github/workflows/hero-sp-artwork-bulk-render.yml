name: Hero SP Artwork Bulk Render

on:
  push:
    branches:
      - work/hero-sp-artwork-source-probe-20260920
    paths:
      - scripts/extract-hero-sp-artwork-render-input.py
      - data/evidence/hero-sp-artwork-source-census.v1.json
      - .github/workflows/hero-sp-artwork-bulk-render.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('data/evidence/hero-sp-artwork-source-census.v1.json',encoding='utf-8'))
          print('matrix='+json.dumps({'include':[{'heroId':r['heroId'],'charImageId':r['charImageId']} for r in x['records']]},separators=(',',':')))
          PY

  render:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned render dependencies
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow numpy
      - name: Extract exact official SP render input
        env:
          HERO_ID: ${{ matrix.heroId }}
          CHAR_IMAGE_ID: ${{ matrix.charImageId }}
        run: python scripts/extract-hero-sp-artwork-render-input.py
      - name: Restore proven Spine 3.3 renderer
        run: |
          mkdir -p .runtime/geometry
          git show 9aa141fd54bbbed13b95bf5f2f918e0ec2e65158:tools/skin-fullart0/SpineGeometry.cs > .runtime/geometry/SpineGeometry.cs
          git show 9aa141fd54bbbed13b95bf5f2f918e0ec2e65158:scripts/render-skin-fullart0-geometry.py > .runtime/render-spine-geometry.py
      - name: Checkout exact Spine 3.3-era runtime
        uses: actions/checkout@v4
        with:
          repository: EsotericSoftware/spine-runtimes
          ref: 1c1936532527900f74cfb58f7002998bf157b254
          path: .runtime/spine-runtimes
          fetch-depth: 1
      - name: Build version-matched geometry renderer
        run: |
          runtime_src="$GITHUB_WORKSPACE/.runtime/spine-runtimes/spine-csharp/src"
          program="$GITHUB_WORKSPACE/.runtime/geometry/SpineGeometry.cs"
          cat > .runtime/geometry/SpineGeometry.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <LangVersion>latest</LangVersion>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="$runtime_src/**/*.cs" />
              <Compile Include="$program" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build .runtime/geometry/SpineGeometry.csproj -c Release
      - name: Render transparent SP full body
        env:
          HERO_ID: ${{ matrix.heroId }}
        run: |
          root=".probe-out/sp-render/$HERO_ID"
          atlas="$(python -c "import json; print(json.load(open('$root/input.json'))['atlasPath'])")"
          skel="$(python -c "import json; print(json.load(open('$root/input.json'))['skeletonPath'])")"
          texture="$(python -c "import json; print(json.load(open('$root/input.json'))['texturePath'])")"
          dotnet run --project .runtime/geometry/SpineGeometry.csproj -c Release --no-build -- "$atlas" "$skel" "$root/geometry.json"
          python .runtime/render-spine-geometry.py --geometry "$root/geometry.json" --texture "$texture" --output "$root/full.png" --evidence-output "$root/render.json"
      - name: Materialize production candidate WebP and summary
        env:
          HERO_ID: ${{ matrix.heroId }}
          CHAR_IMAGE_ID: ${{ matrix.charImageId }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image
          hid=int(os.environ['HERO_ID']);cid=int(os.environ['CHAR_IMAGE_ID']);root=Path(f'.probe-out/sp-render/{hid}')
          inp=json.load(open(root/'input.json',encoding='utf-8'));ren=json.load(open(root/'render.json',encoding='utf-8'))
          im=Image.open(root/'full.png').convert('RGBA')
          source_size=[im.width,im.height]
          im.thumbnail((1600,1600),Image.Resampling.LANCZOS)
          webp=root/f'{hid}.webp'; im.save(webp,'WEBP',quality=90,method=6)
          chk=Image.open(webp).convert('RGBA');amin,amax=chk.getchannel('A').getextrema()
          summary={'status':'PASS_SP_ARTWORK_RENDER','heroId':hid,'charImageId':cid,'sourceSpinePath':inp['sourceSpinePath'],
            'bundleSha256':inp['bundleSha256'],'spineVersion':inp['spineVersion'],'pose':ren['render']['pose'],
            'sourceCanvas':source_size,'width':chk.width,'height':chk.height,'hasAlpha':amin<255,'alphaExtrema':[amin,amax],
            'renderableAttachmentCount':ren['render']['renderableAttachmentCount'],'triangleCount':ren['render']['triangleCount'],
            'sizeBytes':webp.stat().st_size,'sha256':hashlib.sha256(webp.read_bytes()).hexdigest()}
          if not summary['hasAlpha'] or max(chk.width,chk.height)>1600: raise RuntimeError('production WebP contract failed')
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Upload per-Hero render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-sp-render-${{ matrix.heroId }}
          path: .probe-out/sp-render/${{ matrix.heroId }}
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hero-sp-render-*
          path: .bulk
          merge-multiple: false
      - name: Validate bulk render completion
        run: |
          python - <<'PY'
          import json, pathlib
          roots=sorted(pathlib.Path('.bulk').glob('hero-sp-render-*'))
          rows=[]
          for root in roots:
            ss=list(root.rglob('summary.json'))
            if len(ss)!=1: raise RuntimeError(f'{root}: summary count {len(ss)}')
            x=json.load(open(ss[0],encoding='utf-8'))
            if x.get('status')!='PASS_SP_ARTWORK_RENDER': raise RuntimeError(f'{root}: {x.get("status")}')
            rows.append(x)
          ids=sorted(x['heroId'] for x in rows)
          expected=[1,3,4,6,7,8,9,10,11,12,13,14,25,26,27,29,33,37,40,53,55,56,60,67,89]
          if ids!=expected: raise RuntimeError(f'bulk Hero ID set mismatch: {ids}')
          result={'status':'PASS_SP_25_ARTWORK_BULK_RENDER','count':len(rows),'heroIds':ids,'records':sorted(rows,key=lambda x:x['heroId'])}
          pathlib.Path('.bulk-summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':result['status'],'count':result['count'],'records':[{'heroId':x['heroId'],'width':x['width'],'height':x['height'],'sizeBytes':x['sizeBytes']} for x in result['records']]},ensure_ascii=False))
          PY
      - name: Collect production candidate WebPs
        run: |
          mkdir -p bulk-webp
          find .bulk -type f -name '*.webp' -exec cp {} bulk-webp/ \;
          test "$(find bulk-webp -type f -name '*.webp' | wc -l)" -eq 25
          cp .bulk-summary.json bulk-webp/manifest.json
      - name: Upload bulk production candidates
        uses: actions/upload-artifact@v4
        with:
          name: hero-sp-artwork-bulk-webp
          path: bulk-webp
          if-no-files-found: error
          retention-days: 7
