name: Hero Job Materials Frontend Patch

on:
  push:
    branches:
      - 'feat/hero-job-materials-*'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch hero detail route fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = 'src/routes/heroes_.$heroId.tsx';
          let source = fs.readFileSync(file, 'utf8');
          const importAnchor = 'import { HeroExclusiveEquipmentSection } from "@/components/hero-exclusive-equipment-section";';
          const importReplacement = `${importAnchor}\nimport { HeroJobMaterialsSection } from "@/components/hero-job-materials-section";`;
          const sectionAnchor = '        <section className="mt-5 rounded-2xl border border-border bg-card p-5 shadow-sm sm:p-6">\n          <SectionTitle title="최종 직업 스탯" />';
          const sectionReplacement = `        <HeroJobMaterialsSection heroId={hero.heroId} />\n\n${sectionAnchor}`;
          function replaceExactlyOnce(value, anchor, replacement, label) {
            const first = value.indexOf(anchor);
            const last = value.lastIndexOf(anchor);
            if (first < 0 || first !== last) throw new Error(`${label}: expected exactly one anchor`);
            return value.slice(0, first) + replacement + value.slice(first + anchor.length);
          }
          if (!source.includes('HeroJobMaterialsSection')) {
            source = replaceExactlyOnce(source, importAnchor, importReplacement, 'import');
            source = replaceExactlyOnce(source, sectionAnchor, sectionReplacement, 'section');
            fs.writeFileSync(file, source);
          }
          if ((source.match(/HeroJobMaterialsSection/g) || []).length !== 2) throw new Error('HeroJobMaterialsSection patch cardinality mismatch');
          if (!source.includes('<HeroJobMaterialsSection heroId={hero.heroId} />')) throw new Error('HeroJobMaterialsSection render missing');
          NODE
          git diff --check -- 'src/routes/heroes_.$heroId.tsx'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Semantic and frontend gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/validate_hero_job_materials.cjs
          bunx tsc --noEmit
          bunx vite build --config vite.config.pages.ts

      - name: Reject unrelated tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain=v1 --untracked-files=no | sed -E 's/^...//' | grep -Ev '^src/routes/heroes_\.\$heroId\.tsx$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected tracked mutation:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit verified route patch
        shell: bash
        run: |
          set -euo pipefail
          git add 'src/routes/heroes_.$heroId.tsx'
          if git diff --cached --quiet; then
            echo 'Route already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render hero job advancement materials'
          git push origin HEAD:${GITHUB_REF_NAME}
