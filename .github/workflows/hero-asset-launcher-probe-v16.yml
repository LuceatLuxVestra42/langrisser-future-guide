name: Hero Asset Launcher Probe v16

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-hero-launcher-v16.py'
      - '.github/workflows/hero-asset-launcher-probe-v16.yml'

permissions:
  contents: read

jobs:
  leon-representative-artwork:
    if: github.event.pull_request.head.ref == 'work/hero-asset-launcher-probe'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install UnityPy
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet UnityPy
      - name: Trace Leon prefab references and export artwork
        shell: pwsh
        run: python scripts/probe-hero-launcher-v16.py
      - name: Upload provenance and representative PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-asset-launcher-probe-v16-report
          path: ${{ runner.temp }}/langrisser-launcher-probe-v16/report
          if-no-files-found: warn
          retention-days: 3
