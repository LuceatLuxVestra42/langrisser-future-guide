name: Soldier Stage 3-12 Final Relation

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/generated/soldier-stage3.v1.json'
      - 'data/validation/soldier-stage3-final.v1.json'
      - 'data/generated/soldier-master.v1.json'
      - 'data/hero-name-master.v1.json'
      - 'scripts/finalize-soldier-stage3-12.cjs'
      - '.github/workflows/soldier-stage3-12-final.yml'

permissions:
  contents: write

jobs:
  finalize-stage3-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build final Hero-Soldier relations
        run: node scripts/finalize-soldier-stage3-12.cjs
      - name: Upload stage 3-12 outputs
        uses: actions/upload-artifact@v4
        with:
          name: soldier-stage3-12-final
          path: |
            data/generated/soldier-hero-relations.v1.json
            data/validation/soldier-stage3-12-final.v1.json
      - name: Commit validated outputs
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/soldier-hero-relations.v1.json data/validation/soldier-stage3-12-final.v1.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "generate soldier stage 3-12 final relations"
            git push
          fi
