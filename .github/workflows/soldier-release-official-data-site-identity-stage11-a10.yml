name: Soldier Stage 11-A10 Official Data-Site Identity Batch 2

on:
  pull_request:
    paths:
      - 'data/soldier-release-official-data-site-identity-stage11-a10.v1.json'
      - 'data/soldier-release-official-data-site-identity-stage11-a9.v1.json'
      - 'data/soldier-release-official-archive-gap-stage11-a8.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'scripts/validate-soldier-release-official-data-site-identity-stage11-a10.mjs'
      - '.github/workflows/soldier-release-official-data-site-identity-stage11-a10.yml'
  push:
    branches:
      - main
    paths:
      - 'data/soldier-release-official-data-site-identity-stage11-a10.v1.json'
      - 'data/soldier-release-official-data-site-identity-stage11-a9.v1.json'
      - 'data/soldier-release-official-archive-gap-stage11-a8.v1.json'
      - 'data/generated/soldier-release-metadata.v1.json'
      - 'data/generated/soldier-list-stage5-8.v1.json'
      - 'scripts/validate-soldier-release-official-data-site-identity-stage11-a10.mjs'
      - '.github/workflows/soldier-release-official-data-site-identity-stage11-a10.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Stage 11-A10 official data-site identity batch 2
        run: node scripts/validate-soldier-release-official-data-site-identity-stage11-a10.mjs
      - name: Verify evidence validation is read-only
        run: git diff --exit-code
