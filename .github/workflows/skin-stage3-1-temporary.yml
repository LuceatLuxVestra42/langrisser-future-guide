name: Skin Stage 3-1 Temporary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/skin-stage3-1-temporary.yml

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Stage 3-1 inventory
        run: node scripts/generate-skin-stage3-1-asset-inventory.mjs

      - name: Validate Stage 3-1 inventory
        run: node scripts/validate-skin-stage3-1-asset-inventory.mjs

      - name: Commit Stage 3-1 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/skin-stage3-1-asset-inventory.v1.json data/validation/skin-stage3-1-final.v1.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Complete Skin Stage 3-1 asset inventory"
          git push
