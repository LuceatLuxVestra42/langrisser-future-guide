name: Hero CardHead Sprite Diagnostic V2

on:
  push:
    branches:
      - work/hero-cardhead-assets-20260830
    paths:
      - .github/workflows/hero-cardhead-sprite-diagnostic-v2.yml
      - scripts/diagnose-hero-cardhead-sprites.py

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install extraction runtime
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet UnityPy==1.25.3 Pillow
      - name: Diagnose exact CardHead sprite subassets
        shell: pwsh
        run: python scripts/diagnose-hero-cardhead-sprites.py
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/hero-cardhead-sprite-diagnostic.v1.json public/images/heroes/card-head-diagnostic
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
          else
            git commit -m "Record Hero CardHead sprite diagnostic"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
