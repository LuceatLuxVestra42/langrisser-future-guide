name: hero-awakening-display-metadata-complete
on:
  push:
    branches: [hero-awakening-display-metadata]
    paths: [.github/workflows/hero-stage44-direct-schema-diagnose.yml]
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correct authoritative direct source keys
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const edits = [
            ['scripts/prepare_hero_skill_acquisition_stage44.cjs',
             'skillIds: uniqueIntegers(Array.isArray(row?.Skill_IDs) ? row.Skill_IDs : []),',
             'skillIds: uniqueIntegers(Array.isArray(row?.Skills_ID) ? row.Skills_ID : []),'],
            ['scripts/prepare_hero_skill_acquisition_stage44.cjs',
             'hiddenSkillIds: uniqueIntegers(Array.isArray(row?.HiddenSkill_IDs) ? row.HiddenSkill_IDs : []),',
             'hiddenSkillIds: uniqueIntegers(Array.isArray(row?.HiddenSkills_ID) ? row.HiddenSkills_ID : []),'],
            ['data/hero-skill-acquisition-stage4-4.v1.json',
             '"skillIds": "Skill_IDs"',
             '"skillIds": "Skills_ID"'],
            ['data/hero-skill-acquisition-stage4-4.v1.json',
             '"hiddenSkillIds": "HiddenSkill_IDs"',
             '"hiddenSkillIds": "HiddenSkills_ID"'],
          ];
          for (const [file, from, to] of edits) {
            let text = fs.readFileSync(file, 'utf8');
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${file}: exact patch anchor count=${count} for ${from}`);
            text = text.replace(from, to);
            fs.writeFileSync(file, text);
          }
          NODE
      - name: Hydrate pinned ConfigData authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/validate-configdata-source-pack-v1.mjs
          node scripts/hydrate-configdata-source-pack-v1.mjs --target-dir "$RUNNER_TEMP/configdata-hydrated"
          test ! -e data/configdata
          ln -s "$RUNNER_TEMP/configdata-hydrated/data/configdata" data/configdata
      - name: Regenerate owning artifacts
        run: |
          npm run inspect:hero-skills
          npm run inspect:hero-combat
          npm run validate:coverage:hero-canonical
      - name: Verify no unrelated semantic drift
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:data/generated/hero-skill-acquisition.v1.json > /tmp/base44.json
          git show origin/main:data/generated/hero-basic-combat.v1.json > /tmp/base45.json
          node - <<'NODE'
          const fs = require('fs');
          const base44 = JSON.parse(fs.readFileSync('/tmp/base44.json', 'utf8'));
          const next44 = JSON.parse(fs.readFileSync('data/generated/hero-skill-acquisition.v1.json', 'utf8'));
          if (JSON.stringify(base44.records) !== JSON.stringify(next44.records)) {
            throw new Error('Stage 4-4 existing records drifted from main');
          }
          if (!Number.isInteger(next44.skillInfoPresentationCount) || next44.skillInfoPresentationCount <= 0) {
            throw new Error(`invalid Stage 4-4 skillInfoPresentationCount=${next44.skillInfoPresentationCount}`);
          }
          if (next44.skillInfoPresentationCatalog?.length !== next44.skillInfoPresentationCount) {
            throw new Error('Stage 4-4 presentation catalog count mismatch');
          }
          const strip = (doc) => {
            const copy = JSON.parse(JSON.stringify(doc.records));
            for (const hero of copy) {
              const skill = hero?.awakening?.skill;
              if (!skill) continue;
              delete skill.displayType;
              delete skill.cooldown;
              delete skill.range;
              delete skill.areaOrTarget;
            }
            return copy;
          };
          const base45 = JSON.parse(fs.readFileSync('/tmp/base45.json', 'utf8'));
          const next45 = JSON.parse(fs.readFileSync('data/generated/hero-basic-combat.v1.json', 'utf8'));
          if (JSON.stringify(strip(base45)) !== JSON.stringify(strip(next45))) {
            throw new Error('Stage 4-5 drift exceeds awakening presentation fields');
          }
          let defined = 0;
          for (const hero of next45.records || []) {
            const awakening = hero?.awakening;
            if (awakening?.level2Status !== 'DEFINED') continue;
            defined += 1;
            for (const field of ['displayType','cooldown','range','areaOrTarget']) {
              if (!Object.prototype.hasOwnProperty.call(awakening.skill || {}, field)) {
                throw new Error(`heroId ${hero.heroId}: awakening missing ${field}`);
              }
            }
          }
          if (defined !== 257) throw new Error(`defined awakening count=${defined}, expected=257`);
          NODE
      - name: Remove hydrated source and guard changed paths
        run: |
          rm data/configdata
          git rm .github/workflows/hero-stage44-direct-schema-diagnose.yml
          git add \
            data/hero-skill-acquisition-stage4-4.v1.json \
            data/generated/hero-skill-acquisition.v1.json \
            data/generated/hero-basic-combat.v1.json \
            data/validation/hero-skill-stage4-4-summary.v1.json \
            scripts/prepare_hero_skill_acquisition_stage44.cjs \
            scripts/prepare_hero_basic_combat_stage45.cjs \
            scripts/validate_hero_stage4_final.cjs
          if test -f data/validation/hero-basic-combat-stage4-5-summary.v1.json; then
            git add data/validation/hero-basic-combat-stage4-5-summary.v1.json
          fi
          node - <<'NODE'
          const {execFileSync} = require('child_process');
          const allowed = new Set([
            '.github/workflows/hero-stage44-direct-schema-diagnose.yml',
            'data/hero-skill-acquisition-stage4-4.v1.json',
            'data/generated/hero-skill-acquisition.v1.json',
            'data/generated/hero-basic-combat.v1.json',
            'data/validation/hero-skill-stage4-4-summary.v1.json',
            'data/validation/hero-basic-combat-stage4-5-summary.v1.json',
            'scripts/prepare_hero_skill_acquisition_stage44.cjs',
            'scripts/prepare_hero_basic_combat_stage45.cjs',
            'scripts/validate_hero_stage4_final.cjs',
          ]);
          const changed = execFileSync('git', ['diff','--cached','--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const unexpected = changed.filter((p) => !allowed.has(p));
          if (unexpected.length) throw new Error(`unexpected tracked mutation: ${unexpected.join(', ')}`);
          const status = execFileSync('git', ['status','--porcelain'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const unstaged = status.filter((line) => line[1] !== ' ' && line[1] !== '?');
          if (unstaged.length) throw new Error(`unexpected unstaged mutation: ${unstaged.join(' | ')}`);
          NODE
      - name: Commit verified completion unit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --cached --quiet && { echo 'No completion changes to commit'; exit 1; }
          git commit -m "feat: preserve awakening skill display metadata"
          git push origin HEAD:hero-awakening-display-metadata
