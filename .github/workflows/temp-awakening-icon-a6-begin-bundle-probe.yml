name: Temporary A6 Begin Skill Icon Bundle Probe

on:
  push:
    branches:
      - diag/awakening-icon-a6-1113-coverage-20260910

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 Pillow
      - name: Verify unresolved exact paths in begin bundle
        shell: bash
        run: |
          mkdir -p out/awakening-icon-a6-begin-bundle-probe
          python <<'PY'
          import binascii, hashlib, json, pathlib, struct, urllib.request, zlib, traceback
          import UnityPy

          OUT=pathlib.Path('out/awakening-icon-a6-begin-bundle-probe')
          VERSION='1.1.113'
          PART=27
          PACKAGE=f'InstallPage_{VERSION}_{PART}.zip'
          URL=f'http://mhmnzupdate.zlongame.com/MHMNZ/InstallVersion/InstallPage_{VERSION}/{PACKAGE}'
          ENTRY='Client/Langrisser_Data/StreamingAssets/ExportAssetBundle/begin_ui_icon_skill_abs.b'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          TARGETS={
            'assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_super15.png': {'heroId':13,'skillId':11177,'sourcePath':'UI/Icon/Skill_ABS/Skill_Super15.png'},
            'assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_super140.png': {'heroId':99176,'skillId':460476,'sourcePath':'UI/Icon/Skill_ABS/Skill_Super140.png'},
            'assets/gameproject/runtimeassets/ui/icon/skill_abs/skill_captainbaby_3.png': {'heroId':99235,'skillId':460775,'sourcePath':'UI/Icon/Skill_ABS/Skill_CaptainBaby_3.png'},
          }
          def norm(x): return str(x).replace('\\','/').strip('/').lower()
          def sha(b): return hashlib.sha256(b).hexdigest()
          def req(start=None,end=None):
            h={'User-Agent':UA,'Accept-Encoding':'identity'}
            if start is not None: h['Range']=f'bytes={start}-{end}'
            r=urllib.request.Request(URL,headers=h)
            with urllib.request.urlopen(r,timeout=60) as x: data=x.read()
            if start is not None and len(data)!=end-start+1: raise RuntimeError('range mismatch')
            return data
          def total_size():
            r=urllib.request.Request(URL,headers={'User-Agent':UA,'Accept-Encoding':'identity'},method='HEAD')
            with urllib.request.urlopen(r,timeout=30) as x: return int(x.headers['Content-Length'])
          def directory(total):
            n=min(131072,total); tail=req(total-n,total-1); p=tail.rfind(b'PK\x05\x06')
            if p<0: raise RuntimeError('EOCD missing')
            _,_,_,_,cs,co,_=struct.unpack_from('<HHHHIIH',tail,p+4); c=req(co,co+cs-1); out=[]; i=0
            while i+46<=len(c) and c[i:i+4]==b'PK\x01\x02':
              flags,method=struct.unpack_from('<HH',c,i+8); crc,comp,uncomp=struct.unpack_from('<III',c,i+16)
              fl,el,cl=struct.unpack_from('<HHH',c,i+28); off=struct.unpack_from('<I',c,i+42)[0]
              name=c[i+46:i+46+fl].decode('utf-8' if flags&0x800 else 'cp437','replace')
              out.append({'name':name,'method':method,'crc32':f'{crc:08X}','compressedBytes':comp,'uncompressedBytes':uncomp,'localOffset':off})
              i+=46+fl+el+cl
            return out
          def fetch(e):
            off=e['localOffset']; hdr=req(off,off+4095); method=struct.unpack_from('<H',hdr,8)[0]; fl,el=struct.unpack_from('<HH',hdr,26)
            start=off+30+fl+el; comp=req(start,start+e['compressedBytes']-1)
            raw=comp if method==0 else zlib.decompress(comp,-15) if method==8 else None
            if raw is None: raise RuntimeError(f'unsupported compression {method}')
            if len(raw)!=e['uncompressedBytes']: raise RuntimeError('uncompressed size mismatch')
            if f'{binascii.crc32(raw)&0xffffffff:08X}'!=e['crc32']: raise RuntimeError('CRC mismatch')
            return raw
          def deref(v): return v.deref() if hasattr(v,'deref') else v

          result={'version':1,'schemaId':'awakening-icon-begin-bundle-exact-probe/v1','status':'RUNNING','semanticReopen':False,
                  'source':{'kind':'OFFICIAL_INSTALLER','installVersion':VERSION,'packagePart':PART,'packageName':PACKAGE,'bundleEntry':ENTRY,'unityParser':'UnityPy==1.25.3'},
                  'targets':[],'blockers':[]}
          code=0
          try:
            idx={e['name']:e for e in directory(total_size())}; e=idx.get(ENTRY)
            if not e: raise RuntimeError('target begin bundle entry absent')
            raw=fetch(e); result['source'].update({'bundleBytes':len(raw),'bundleSha256':sha(raw)})
            env=UnityPy.load(raw); hits={k:[] for k in TARGETS}
            for container_path,value in env.container.items():
              k=norm(container_path)
              if k not in hits: continue
              reader=deref(value); typ=getattr(getattr(reader,'type',None),'name',None); rb=reader.get_raw_data()
              h={'containerPath':str(container_path).replace('\\','/'),'objectType':typ,'pathId':int(getattr(reader,'path_id',0) or 0),'rawObjectBytes':len(rb),'rawObjectSha256':sha(rb)}
              if typ=='Sprite':
                img=reader.read().image.convert('RGBA'); rgba=img.tobytes(); bbox=img.getchannel('A').getbbox()
                h.update({'width':img.width,'height':img.height,'rgbaSha256':sha(rgba),'alphaBbox':list(bbox) if bbox else None,'nonEmptyAlpha':bbox is not None})
              else: h.update({'width':None,'height':None,'rgbaSha256':None,'alphaBbox':None,'nonEmptyAlpha':False})
              hits[k].append(h)
            for k,target in TARGETS.items():
              valid=[h for h in hits[k] if h['objectType']=='Sprite' and h['nonEmptyAlpha']]
              render_keys={(h['width'],h['height'],h['rgbaSha256']) for h in valid}
              rec={**target,'expectedContainerPath':k,'hits':hits[k]}
              if not valid:
                rec['status']='UNRESOLVED'
              elif len(render_keys)!=1:
                rec['status']='BLOCKER'; result['blockers'].append({'type':'AMBIGUOUS_NON_EQUIVALENT_EXACT_SPRITES',**rec})
              else:
                rec['status']='VERIFIED'; rec['verifiedSprite']=valid[0]
              result['targets'].append(rec)
            counts={s:sum(1 for t in result['targets'] if t['status']==s) for s in ('VERIFIED','UNRESOLVED','BLOCKER')}
            result['summary']=counts
            result['status']='BLOCKER' if counts['BLOCKER'] else 'PASS' if counts['VERIFIED']==len(TARGETS) else 'PASS_WITH_REVIEW'
            code=2 if counts['BLOCKER'] else 0
          except Exception as exc:
            result['status']='DIAGNOSTIC_ERROR'; result['blockers']=[{'type':'DIAGNOSTIC_ERROR','message':f'{type(exc).__name__}:{exc}','traceback':traceback.format_exc()}]; code=3
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':result['status'],'summary':result.get('summary'),'targets':[{'heroId':t['heroId'],'sourcePath':t['sourcePath'],'status':t['status']} for t in result.get('targets',[])],'source':result['source'],'blockers':result['blockers']},ensure_ascii=False,indent=2))
          raise SystemExit(code)
          PY
      - name: Upload exact-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awakening-icon-a6-begin-bundle-probe
          path: out/awakening-icon-a6-begin-bundle-probe
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-awakening-icon-a6-begin-bundle-probe.yml
          git commit -m "Remove temporary A6 begin bundle probe"
          git push origin HEAD:${GITHUB_REF_NAME}
