name: Hero HeartFetter Raw Condition V1

on:
  pull_request:
    branches:
      - main
    paths:
      - data/contracts/hero-heart-fetter-raw-condition.v1.json
      - data/generated/hero-heart-fetter-raw-condition.v1.json
      - data/generated/hero-heart-fetter-job-effect-research.v1.json
      - data/validation/hero-heart-fetter-raw-condition-admission.v1.json
      - data/validation/hero-heart-fetter-raw-condition-publication.v1.json
      - data/validation/hero-heart-fetter-ct7-job-activation-hypothesis.v1.json
      - data/validation/hero-heart-fetter-ainz-ct7-source-diagnostic.v1.json
      - scripts/build-hero-heart-fetter-raw-condition-v1.cjs
      - scripts/validate-hero-heart-fetter-raw-condition-v1.cjs
      - scripts/validate-hero-heart-fetter-kagura-source-diagnostic-v1.cjs
      - scripts/validate-hero-heart-fetter-ainz-ct7-source-diagnostic-v1.cjs
      - scripts/validate-hero-heart-fetter-ct7-job-activation-hypothesis-v1.cjs
      - scripts/build-hero-heart-fetter-job-effect-research-v1.cjs
      - scripts/validate-hero-heart-fetter-job-effect-research-v1.cjs
      - .github/workflows/hero-heart-fetter-raw-condition-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build raw-condition evidence in runner temp
        run: node scripts/build-hero-heart-fetter-raw-condition-v1.cjs --output "$RUNNER_TEMP/hero-heart-fetter-raw-condition.v1.json"

      - name: Validate independent raw parity and consistency evidence
        run: node scripts/validate-hero-heart-fetter-raw-condition-v1.cjs --artifact "$RUNNER_TEMP/hero-heart-fetter-raw-condition.v1.json"

      - name: Diagnose Kagura source records without semantic interpretation
        run: node scripts/validate-hero-heart-fetter-kagura-source-diagnostic-v1.cjs

      - name: Diagnose Ainz CT7 source-description exception
        run: node scripts/validate-hero-heart-fetter-ainz-ct7-source-diagnostic-v1.cjs

      - name: Validate revised CT7 structural job-reference boundary
        run: node scripts/validate-hero-heart-fetter-ct7-job-activation-hypothesis-v1.cjs

      - name: Build non-canonical job-effect research projection
        run: node scripts/build-hero-heart-fetter-job-effect-research-v1.cjs --output "$RUNNER_TEMP/hero-heart-fetter-job-effect-research.v1.json"

      - name: Validate job-effect research projection
        run: node scripts/validate-hero-heart-fetter-job-effect-research-v1.cjs --artifact "$RUNNER_TEMP/hero-heart-fetter-job-effect-research.v1.json"

      - name: Verify tracked publication parity when present
        run: |
          set -euo pipefail
          if test -f data/generated/hero-heart-fetter-raw-condition.v1.json; then
            cmp data/generated/hero-heart-fetter-raw-condition.v1.json "$RUNNER_TEMP/hero-heart-fetter-raw-condition.v1.json"
          fi
          if test -f data/generated/hero-heart-fetter-job-effect-research.v1.json; then
            cmp data/generated/hero-heart-fetter-job-effect-research.v1.json "$RUNNER_TEMP/hero-heart-fetter-job-effect-research.v1.json"
          fi

      - name: Upload validated HeartFetter evidence
        uses: actions/upload-artifact@v4
        with:
          name: hero-heart-fetter-evidence-v1
          path: |
            ${{ runner.temp }}/hero-heart-fetter-raw-condition.v1.json
            ${{ runner.temp }}/hero-heart-fetter-job-effect-research.v1.json
          if-no-files-found: error
          retention-days: 7

      - name: Run hero-canonical owner validator
        run: npm run validate:coverage:hero-canonical

      - name: Verify repository unchanged
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
