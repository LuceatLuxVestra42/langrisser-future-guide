name: Hero Artwork H-A5 Bulk Extraction Index

on:
  push:
    branches:
      - work/hero-artwork-h-a5-bulk-index
    paths:
      - scripts/build-hero-artwork-h-a5-index.py
      - scripts/build-hero-artwork-h-a5-index-v2.py
      - .github/workflows/hero-artwork-h-a5-bulk-index.yml

permissions:
  contents: read

jobs:
  bulk-index:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install UnityPy
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet UnityPy
      - name: Build 267 Hero artwork extraction index
        shell: pwsh
        run: python scripts/build-hero-artwork-h-a5-index-v2.py
      - name: Upload H-A5 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-artwork-h-a5-bulk-index-report
          path: ${{ runner.temp }}/hero-artwork-h-a5/report
          if-no-files-found: warn
          retention-days: 5
