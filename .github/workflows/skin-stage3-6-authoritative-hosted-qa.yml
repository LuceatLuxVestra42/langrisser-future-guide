name: Skin Stage 3-6 Authoritative Hosted QA

on:
  push:
    branches:
      - work/skin-stage3-3-bulk-plan
    paths:
      - '.github/workflows/skin-stage3-6-authoritative-hosted-qa.yml'
      - 'scripts/validate-skin-stage3-6-hosted.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skin-stage3-6-authoritative-hosted-qa
  cancel-in-progress: true

jobs:
  hosted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current Skin branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolve current authoritative Pages source
        env:
          HOSTED_SENTINEL_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/authoritative-pages-source.json
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const url = `${process.env.HOSTED_SENTINEL_URL}?hosted=${Date.now()}`;
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache', pragma: 'no-cache' } });
            if (!response.ok) throw new Error(`authoritative sentinel HTTP ${response.status}`);
            const payload = await response.json();
            if (payload.status !== 'AUTHORITATIVE_GITHUB_PAGES_DEPLOYMENT') throw new Error(`unexpected authoritative status ${payload.status}`);
            if (!/^[0-9a-f]{40}$/.test(payload.sourceSha ?? '')) throw new Error(`invalid sourceSha ${payload.sourceSha}`);
            if (!/^[0-9a-f]{40}$/.test(payload.skinRuntimeRef ?? '')) throw new Error(`invalid skinRuntimeRef ${payload.skinRuntimeRef}`);
            if (payload.skinPngCount !== 540 || payload.semanticStageReopened !== false) throw new Error('authoritative Skin boundary mismatch');
            if (payload.publisher !== '.github/workflows/project-doctor-authoritative-pages-deploy.yml') throw new Error(`unexpected publisher ${payload.publisher}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_SOURCE_SHA=${payload.sourceSha}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_SKIN_RUNTIME_REF=${payload.skinRuntimeRef}\n`);
            console.log(JSON.stringify(payload, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Validate authoritative Hosted Skin routes and hashes
        env:
          HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/
        run: |
          set -euo pipefail
          node scripts/validate-skin-stage3-6-hosted.mjs

      - name: Require Hosted PASS and authoritative provenance
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync('data/evidence/skin-stage3-6-hosted.v1.json','utf8'));
          const summary = JSON.parse(fs.readFileSync('data/validation/skin-stage3-6-hosted-summary.v1.json','utf8'));
          const checkpoint = JSON.parse(fs.readFileSync('data/checkpoints/skin-stage3-6-hosted.v1.json','utf8'));
          if (evidence.status !== 'PASS_SKIN_STAGE3_6_HOSTED_QA') throw new Error('Hosted evidence is not PASS');
          if (summary.status !== evidence.status || summary.finalReady !== true || summary.sourceSha !== process.env.EXPECTED_SOURCE_SHA) throw new Error('Hosted summary mismatch');
          if (summary.skinRuntimeRef !== process.env.EXPECTED_SKIN_RUNTIME_REF) throw new Error('Skin runtime ref mismatch');
          if (summary.authoritativePublisher !== '.github/workflows/project-doctor-authoritative-pages-deploy.yml') throw new Error('Publisher mismatch');
          if (checkpoint.status !== evidence.status || checkpoint.sourceSha !== summary.sourceSha || checkpoint.browserUi !== 'PENDING') throw new Error('Hosted checkpoint mismatch');
          if (evidence.boundaries.semanticOwnershipRecomputed !== false || evidence.boundaries.sourceOrderRecomputed !== false) throw new Error('Semantic boundary changed');
          console.log(`PASS: authoritative Hosted Skin source ${summary.sourceSha}`);
          NODE

      - name: Persist authoritative Hosted evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence/skin-stage3-6-hosted.v1.json \
                  data/validation/skin-stage3-6-hosted-summary.v1.json \
                  data/checkpoints/skin-stage3-6-hosted.v1.json
          if git diff --cached --quiet; then
            echo 'No Hosted evidence changes to commit.'
            exit 0
          fi
          git commit -m "Refresh Skin Stage 3-6 authoritative Hosted QA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
