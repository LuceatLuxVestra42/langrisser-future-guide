name: Hero CV Browser QA

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/hero-cv-browser-qa.yml'
      - 'data/presentation/hero-cv-localization-*'
      - 'src/lib/hero-cv-localization.server.ts'
      - 'src/lib/hero-detail-stage5.server.ts'
      - 'src/routes/heroes_.$heroId.tsx'

permissions:
  contents: read

concurrency:
  group: hero-cv-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hero-cv-browser-qa:
    name: hero-cv-browser-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA source
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve exact PR preview
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Hero CV Browser QA requires exact PR head SHA: $PR_HEAD_SHA" >&2
            exit 2
          fi
          base="https://luceatluxvestra42.github.io/Data/pr-${PR_NUMBER}/"
          EXPECTED_SOURCE_SHA="$PR_HEAD_SHA" PREVIEW_BASE_URL="$base" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = process.env.PREVIEW_BASE_URL;
          const expected = process.env.EXPECTED_SOURCE_SHA;
          const deadline = Date.now() + 10 * 60_000;
          let deployed = null;
          let lastError = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${base}preview-source.json?hero_cv_browser_qa=${Date.now()}`, { cache: 'no-store' });
              if (!response.ok) throw new Error(`preview manifest HTTP ${response.status}`);
              deployed = await response.json();
              if (deployed.sourceSha === expected) break;
              lastError = new Error(`freshness mismatch expected=${expected} deployed=${deployed.sourceSha}`);
            } catch (error) {
              lastError = error;
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!deployed || deployed.sourceSha !== expected) throw lastError ?? new Error('exact PR preview unavailable');
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_SOURCE_SHA=${expected}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_BASE_URL=${base}\n`);
          console.log(JSON.stringify({ status: 'PASS_HERO_CV_PREDECESSOR', expected, deployed: deployed.sourceSha, base }, null, 2));
          NODE

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify Hero CV presentation
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.PREVIEW_BASE_URL.replace(/\/?$/, '/');
          const url = (path) => new URL(path.replace(/^\//, ''), base).toString();
          const cases = [
            { heroId: 1, expectedCv: 'CV. 카키하라 테츠야', kind: 'named' },
            { heroId: 99193, expectedCv: 'CV. 토요나가 토시유키&쿠보 유리카', kind: 'composite' },
            { heroId: 99235, expectedCv: 'CV. -', kind: 'no-cv' },
          ];

          const browser = await chromium.launch({ headless: true });
          const failedResponses = [];
          const pageErrors = [];
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.on('response', (response) => {
              if (response.status() >= 400) failedResponses.push({ status: response.status(), url: response.url() });
            });
            page.on('pageerror', (error) => pageErrors.push(String(error)));

            for (const testCase of cases) {
              const response = await page.goto(url(`heroes/${testCase.heroId}/`), { waitUntil: 'networkidle', timeout: 45000 });
              if (!response || response.status() >= 400) {
                throw new Error(`Hero ${testCase.heroId} route failed: ${response?.status()}`);
              }
              await page.getByText(testCase.expectedCv, { exact: true }).waitFor({ timeout: 20000 });
              if (testCase.kind === 'no-cv') {
                const body = await page.locator('body').innerText();
                if (body.includes('CV. ■■■■')) throw new Error(`Hero ${testCase.heroId} exposed raw no-CV marker`);
              }
            }

            if (pageErrors.length) throw new Error(`Hero CV page errors: ${JSON.stringify(pageErrors)}`);
            console.log(JSON.stringify({
              status: 'PASS_HERO_CV_BROWSER_QA',
              sourceSha: process.env.EXPECTED_SOURCE_SHA,
              cases,
              failedResponses,
              note: failedResponses.length ? 'Non-blocking resource responses captured for owner triage; CV presentation assertions passed.' : 'No failed resource responses observed.',
              semanticStageReopened: false,
            }, null, 2));
          } finally {
            await browser.close();
          }
          NODE
