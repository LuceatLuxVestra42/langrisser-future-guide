name: Hero Asset Launcher Probe v14

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-hero-launcher-v14.ps1'
      - '.github/workflows/hero-asset-launcher-probe-v14.yml'

permissions:
  contents: read

jobs:
  protocol-code-xrefs:
    if: github.event.pull_request.head.ref == 'work/hero-asset-launcher-probe'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Map PGLauncher protocol code xrefs without execution
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/probe-hero-launcher-v14.ps1
      - name: Upload text reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-asset-launcher-probe-v14-report
          path: ${{ runner.temp }}/langrisser-launcher-probe-v14/report
          if-no-files-found: warn
          retention-days: 3
