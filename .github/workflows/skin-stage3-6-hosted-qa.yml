name: Skin Stage 3-6 Hosted QA

on:
  push:
    branches:
      - work/skin-stage3-3-bulk-plan
    paths:
      - '.github/workflows/skin-stage3-6-hosted-qa.yml'
      - 'data/generated/skin-stage2-3-bidirectional-relation.v1.json'
      - 'data/generated/skin-stage3-5-static-web-asset-map.v1.json'
      - 'data/validation/skin-stage3-5-static-web-asset-map.v1.json'
      - 'public/images/skins/**'
      - 'src/lib/skin-detail.server.ts'
      - 'src/lib/hero-detail-stage5.server.ts'
      - 'src/routes/heroes_.$heroId.tsx'
      - 'scripts/validate-skin-stage3-5-static-web-assets.mjs'
      - 'scripts/validate-skin-stage3-6-hero-detail-consumer.mjs'
      - 'scripts/validate-skin-stage3-6-static-candidate.mjs'
      - 'scripts/validate-skin-stage3-6-hosted.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skin-stage3-6-hosted-qa
  cancel-in-progress: false

jobs:
  hosted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Skin candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Revalidate frozen Skin public surface
        run: |
          set -euo pipefail
          node scripts/validate-skin-stage3-5-static-web-assets.mjs \
            data/generated/skin-stage3-5-static-web-asset-map.v1.json \
            --repo-root . \
            --relation data/generated/skin-stage2-3-bidirectional-relation.v1.json \
            --write /tmp/skin-stage3-5-static-web-asset-map.v1.json
          cmp /tmp/skin-stage3-5-static-web-asset-map.v1.json data/validation/skin-stage3-5-static-web-asset-map.v1.json
          node scripts/validate-skin-stage3-6-hero-detail-consumer.mjs

      - name: Reuse proven GitHub Pages static config
        run: |
          set -euo pipefail
          git fetch --depth=1 origin deploy/soldier-lower-tier-kr-names-20260828
          git show FETCH_HEAD:vite.config.ts > vite.config.ts
          grep -q 'GitHub Pages deployment-only static build config' vite.config.ts
          grep -q 'base: "/langrisser-future-guide/"' vite.config.ts
          grep -q 'nitro: false' vite.config.ts
          grep -q 'outputPath: `/heroes/${heroId}/index.html`' vite.config.ts

      - name: Build GitHub Pages Skin candidate
        run: bun run build

      - name: Validate static candidate and exact 540 Skin artifacts
        run: node scripts/validate-skin-stage3-6-static-candidate.mjs

      - name: Stamp exact source sentinel
        run: |
          set -euo pipefail
          cat > dist/client/skin-stage3-6-hosted-ready.json <<JSON
          {
            "status": "READY_FOR_SKIN_STAGE3_6_HOSTED_QA",
            "sourceSha": "${GITHUB_SHA}",
            "heroDetailPageCount": 267,
            "skinPngCount": 540
          }
          JSON
          printf '%s\n' "$GITHUB_SHA" > dist/client/qa-source-sha.txt
          printf '%s\n' 'skin-stage3-6-hero-detail-carousel' > dist/client/qa-surface.txt

      - name: Publish exact Skin candidate to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/client
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy Skin Stage 3-6 hosted candidate ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Validate deployed Skin routes and exact representative assets
        env:
          HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/validate-skin-stage3-6-hosted.mjs

      - name: Persist Hosted QA evidence and checkpoint
        run: |
          set -euo pipefail
          git checkout -- vite.config.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence/skin-stage3-6-hosted.v1.json \
                  data/validation/skin-stage3-6-hosted-summary.v1.json \
                  data/checkpoints/skin-stage3-6-hosted.v1.json
          if git diff --cached --quiet; then
            echo 'No hosted QA evidence changes to commit.'
            exit 0
          fi
          git commit -m "Freeze Skin Stage 3-6 hosted QA [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
