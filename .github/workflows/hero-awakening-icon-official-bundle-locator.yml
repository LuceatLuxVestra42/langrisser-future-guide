name: Hero Awakening Icon Official Bundle Locator

on:
  pull_request:
    branches:
      - main
      - work/awakening-skill-icon-a6-3-package-inventory-20260910
    paths:
      - '.github/workflows/hero-awakening-icon-official-bundle-locator.yml'
      - 'scripts/freeze-hero-awakening-icon-official-bundle-locator.py'
      - 'data/generated/hero-awakening-icon-official-bundle-locator.v1.json'
      - 'data/generated/hero-awakening-icon-official-package-inventory.v1.json'
      - 'data/generated/hero-awakening-icon-verification-targets.v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bundle-locator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen bundle locator
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/freeze-hero-awakening-icon-official-bundle-locator.py
          after="$(git status --porcelain=v1 --untracked-files=all)"
          test "$before" = "$after"
