name: Equipment Image Stage 2 Drive Resolution

on:
  push:
    branches:
      - work/equipment-image-stage2-public-assets
    paths:
      - data/evidence/equipment-image-stage2-drive-resolution-batches/**
      - scripts/build-equipment-image-stage2-drive-resolution.mjs
      - .github/workflows/equipment-image-stage2-drive-resolution.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Drive resolution registry
        run: node scripts/build-equipment-image-stage2-drive-resolution.mjs

      - name: Require Drive resolution PASS
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('data/validation/equipment-image-stage2-drive-resolution-summary.v1.json', 'utf8'));
          if (summary.status !== 'PASS_EQUIPMENT_IMAGE_STAGE2_DRIVE_RESOLUTION') throw new Error(summary.status);
          if (summary.counts.queryExpectedBasenames !== 371) throw new Error('query count drift');
          if (summary.counts.acquisitionReadyEquipment !== 344) throw new Error(`ready count ${summary.counts.acquisitionReadyEquipment}`);
          if (summary.counts.unresolvedEquipment !== 29) throw new Error(`unresolved count ${summary.counts.unresolvedEquipment}`);
          if (summary.counts.missingInLegacyDrive !== 24) throw new Error('missing count drift');
          if (summary.counts.caseMismatchReview !== 3) throw new Error('case mismatch drift');
          if (summary.counts.collisionBlockedEquipment !== 2) throw new Error('collision count drift');
          if (summary.hardErrors.length !== 0) throw new Error(`hard errors: ${summary.hardErrors.length}`);
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Re-run frozen Equipment admission QA
        run: bun scripts/validate-equipment-stage4-6-admission-route-qa.mjs

      - name: Persist Drive resolution outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/generated/equipment-image-stage2-drive-resolution.v1.json \
            data/generated/equipment-image-stage2-acquisition-manifest.v1.json \
            data/validation/equipment-image-stage2-drive-resolution-summary.v1.json \
            data/checkpoints/equipment-image-stage2-drive-resolution.v1.json
          if git diff --cached --quiet; then
            echo 'Drive resolution outputs already current.'
          else
            git commit -m 'Materialize Equipment image Stage 2 Drive resolution [skip ci]'
            git push origin HEAD:work/equipment-image-stage2-public-assets
          fi
