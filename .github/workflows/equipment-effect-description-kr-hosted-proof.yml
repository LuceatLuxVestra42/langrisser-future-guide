name: Equipment KR Effect Hosted Proof

on:
  workflow_run:
    workflows:
      - Authoritative GitHub Pages Deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equipment-effect-description-kr-hosted-proof
  cancel-in-progress: true

env:
  HOSTED_BASE_URL: https://luceatluxvestra42.github.io/langrisser-future-guide/

jobs:
  hosted-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-linux-x64.zip

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium QA runtime
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Validate hosted KR equipment effect descriptions
        run: |
          set -euo pipefail
          node scripts/validate-equipment-effect-description-kr-hosted.mjs \
            | tee equipment-effect-description-kr-hosted-proof.json

      - name: Upload hosted proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-effect-description-kr-hosted-proof-${{ env.EXPECTED_SOURCE_SHA }}
          path: equipment-effect-description-kr-hosted-proof.json
          if-no-files-found: warn
          retention-days: 30
